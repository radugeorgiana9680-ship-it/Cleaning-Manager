<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8dce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pure Shine Cleaning">
<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
    --pink:#e47d9d;
    --pink-dark:#ad4967;
    --pink-light:#f9dce7;
    --pink-bg:#fff7fa;
    --blue:#dfeafa;
    --green:#dff2e6;
    --yellow:#fff0c9;
    --purple:#eadcf8;
    --peach:#ffe0d9;
    --text:#18161a;
    --muted:#777078;
    --white:#fff;
    --border:#eee4e9;
    --shadow:0 7px 25px rgba(126,69,91,.07);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    width:100%;
    background:#f8dce7;
    color:var(--text);
    font-family:
        "DM Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

svg{
    display:block;
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    background:#f8e4eb;
}

.welcome-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

.welcome-overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            180deg,
            rgba(255,248,250,.04),
            rgba(255,236,244,.12) 58%,
            rgba(255,219,232,.38)
        );
}

.welcome-inner{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    padding:
        max(36px,env(safe-area-inset-top))
        26px
        max(17px,env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
}

.welcome-logo{
    width:min(330px,70vw);
    height:min(330px,70vw);
    object-fit:contain;
    margin-top:5px;
    filter:drop-shadow(0 7px 15px rgba(100,55,70,.15));
}

.logo-fallback{
    display:none;
    width:min(330px,70vw);
    height:min(330px,70vw);
    border-radius:50%;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
        radial-gradient(circle,#fbd9e5,#f0b9cf);
    border:3px solid #d1a45a;
    box-shadow:
        inset 0 0 0 5px rgba(255,255,255,.3),
        0 8px 20px rgba(100,55,70,.15);
    text-align:center;
}

.logo-fallback-main{
    font-family:Georgia,serif;
    font-size:28px;
    color:#96703f;
    letter-spacing:1px;
}

.logo-fallback-script{
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:43px;
    color:#a45874;
}

.welcome-slogan{
    margin-top:4px;
    text-align:center;
    color:#98556d;
    font-family:
        "Parisienne",
        "Brush Script MT",
        "Segoe Script",
        cursive;
    font-size:clamp(40px,10vw,57px);
    line-height:.92;
    text-shadow:0 1px 2px rgba(255,255,255,.8);
}

.welcome-heart{
    margin-top:4px;
    color:#c96785;
    font-family:Georgia,serif;
    font-size:42px;
    line-height:1;
}

.welcome-features{
    width:100%;
    max-width:530px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:3px;
    margin-top:11px;
    padding:8px 3px;
    border-radius:21px;
    background:rgba(255,255,255,.31);
    backdrop-filter:blur(4px);
}

.welcome-feature{
    min-height:91px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#2a2428;
}

.welcome-feature svg{
    width:34px;
    height:34px;
    margin-bottom:6px;
    color:#b24d6b;
}

.welcome-feature span{
    font-size:12px;
    line-height:1.15;
}

.welcome-bottom{
    width:100%;
    max-width:510px;
    margin-top:auto;
}

.get-started{
    width:100%;
    height:62px;
    border-radius:33px;
    background:#e27e9e;
    color:#fff;
    font-size:20px;
    font-weight:500;
    box-shadow:0 8px 20px rgba(175,65,101,.19);
}

.get-started:active{
    transform:scale(.985);
}

.get-started-arrow{
    font-size:30px;
    margin-left:5px;
    vertical-align:-2px;
}

.login-text{
    margin-top:13px;
    text-align:center;
    color:#675e64;
    font-size:15px;
}

.login-text a{
    color:#ac4967;
    font-weight:700;
    text-decoration:underline;
}


/* =========================================================
   APP
========================================================= */

#app{
    display:none;
    min-height:100vh;
    background:
        linear-gradient(
            180deg,
            #fffafd 0%,
            #fff6f9 100%
        );
    padding-bottom:
        calc(84px + env(safe-area-inset-bottom));
}

.app-shell{
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:
        15px
        18px
        25px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:3px 0 14px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:62px;
    height:62px;
    border-radius:50%;
    object-fit:cover;
    flex:none;
}

.brand-title{
    font-size:21px;
    line-height:1;
    font-weight:700;
    letter-spacing:-.6px;
}

.brand-subtitle{
    margin-top:5px;
    color:#777078;
    font-size:13px;
}

.settings-button{
    width:47px;
    height:47px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#18161a;
    box-shadow:var(--shadow);
}

.settings-button svg{
    width:24px;
    height:24px;
}


/* =========================================================
   DATE
========================================================= */

.date-card{
    position:relative;
    overflow:hidden;
    min-height:83px;
    padding:16px 55px 13px 18px;
    margin-bottom:16px;
    border-radius:20px;
    background:
        linear-gradient(
            90deg,
            rgba(250,216,228,.98),
            rgba(249,222,234,.92)
        );
}

.date-card:after{
    content:"";
    position:absolute;
    right:-35px;
    bottom:-80px;
    width:160px;
    height:160px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
}

.date-title{
    font-size:16px;
    font-weight:700;
}

.date-subtitle{
    margin-top:5px;
    color:#6e656b;
    font-size:13px;
}

.date-heart{
    position:absolute;
    right:18px;
    top:16px;
    color:#c55e7d;
    font-family:Georgia,serif;
    font-size:36px;
    z-index:2;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    min-height:115px;
    border-radius:19px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.stat-pink{background:#fbdde8}
.stat-blue{background:#e2e7fb}
.stat-green{background:#def1e5}
.stat-yellow{background:#fff0c9}

.stat-icon{
    width:28px;
    height:28px;
    margin-bottom:7px;
}

.stat-pink .stat-icon{color:#762942}
.stat-blue .stat-icon{color:#1b3158}
.stat-green .stat-icon{color:#2a704d}
.stat-yellow .stat-icon{color:#92701d}

.stat-number{
    font-size:19px;
    font-weight:700;
    line-height:1;
}

.stat-name{
    margin-top:5px;
    font-size:12px;
}


/* =========================================================
   SECTIONS
========================================================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 2px 10px;
}

.section-title h2{
    margin:0;
    font-size:20px;
    letter-spacing:-.5px;
}

.see-all{
    background:transparent;
    color:#ae4564;
    font-size:14px;
    font-weight:700;
}


/* =========================================================
   TODAY
========================================================= */

.today-card{
    background:#fff;
    border-radius:20px;
    padding:10px;
    min-height:202px;
    box-shadow:var(--shadow);
}

.empty-today{
    min-height:182px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.empty-icon{
    width:61px;
    height:61px;
    color:#e4839f;
    margin-bottom:4px;
}

.empty-title{
    font-size:17px;
    font-weight:500;
}

.empty-subtitle{
    margin-top:4px;
    color:#827981;
    font-size:13px;
}

.add-job-button{
    width:100%;
    height:51px;
    margin-top:14px;
    border-radius:28px;
    background:#e47d9d;
    color:#fff;
    font-size:16px;
}

.today-job{
    min-height:61px;
    padding:10px 13px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:7px;
}

.today-job:last-child{
    margin-bottom:0;
}

.today-job-pink{background:#fbdfe9}
.today-job-blue{background:#e3effb}

.today-job-name{
    font-size:15px;
    font-weight:700;
}

.today-job-info{
    margin-top:4px;
    color:#777078;
    font-size:12px;
}

.today-job-price{
    color:#a94d69;
    font-size:16px;
    font-weight:700;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-title{
    margin:20px 2px 10px;
    font-size:20px;
    letter-spacing:-.5px;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.quick{
    height:63px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:14px;
    font-weight:500;
}

.quick svg{
    width:26px;
    height:26px;
}

.q-blue{background:#deebfb;color:#19518b}
.q-green{background:#ddf1e4;color:#246f4f}
.q-pink{background:#f9dce7;color:#7e2949}
.q-yellow{background:#fff0c9;color:#151515}
.q-purple{background:#eadcf8;color:#632c8c}
.q-peach{background:#ffe0d9;color:#a64b3b}


/* =========================================================
   QUOTE
========================================================= */

.quote-card{
    position:relative;
    overflow:hidden;
    height:111px;
    margin-top:17px;
    border-radius:18px;
    background:
        linear-gradient(
            90deg,
            rgba(250,218,229,.92),
            rgba(250,224,235,.73)
        ),
        url("pure-shine-cleaning-background.png");
    background-size:cover;
    background-position:center bottom;
}

.quote-card:after{
    content:"";
    position:absolute;
    right:-18px;
    bottom:-25px;
    width:135px;
    height:135px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 55% 45%,
            rgba(238,117,157,.6) 0 5%,
            transparent 6% 12%,
            rgba(247,147,177,.5) 13% 18%,
            transparent 19% 100%
        );
    opacity:.75;
}

.quote-left,
.quote-right{
    position:absolute;
    z-index:3;
    color:#ce718d;
    font-family:Georgia,serif;
    font-size:31px;
}

.quote-left{
    left:18px;
    top:35px;
}

.quote-right{
    right:113px;
    bottom:16px;
}

.quote-text{
    position:absolute;
    z-index:3;
    left:57px;
    right:94px;
    top:21px;
    text-align:center;
    color:#95546b;
    font-family:
        "Parisienne",
        "Brush Script MT",
        cursive;
    font-size:30px;
    line-height:.9;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;
    z-index:5000;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(560px,100%);
    height:calc(80px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:rgba(255,255,255,.97);
    border-top:1px solid #eee5e9;
    backdrop-filter:blur(15px);
}

.nav-item{
    position:relative;
    background:transparent;
    color:#777982;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:10px;
}

.nav-item svg{
    width:27px;
    height:27px;
}

.nav-item.active{
    color:#bd4d6e;
}

.nav-item.active:before{
    content:"";
    position:absolute;
    width:61px;
    height:51px;
    border-radius:15px;
    background:#f9dce8;
    z-index:-1;
}


/* =========================================================
   INNER PAGES
========================================================= */

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.page-top h1{
    margin:0;
    font-size:27px;
    letter-spacing:-.7px;
}

.page-action{
    padding:9px 13px;
    border-radius:13px;
    background:#f8dce7;
    color:#a74463;
    font-weight:700;
}

.white-card{
    background:#fff;
    border-radius:20px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
}


/* =========================================================
   SCHEDULE
========================================================= */

.calendar-card{
    background:#fff;
    border-radius:21px;
    padding:13px;
    box-shadow:var(--shadow);
    margin-bottom:12px;
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.calendar-month{
    font-size:17px;
    font-weight:700;
}

.calendar-arrow{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#f8dce7;
    color:#a64261;
    font-size:21px;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
}

.calendar-weekday{
    text-align:center;
    color:#8b8289;
    font-size:10px;
    padding-bottom:5px;
}

.calendar-day{
    min-height:40px;
    border-radius:11px;
    background:#fff8fa;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:12px;
    position:relative;
}

.calendar-day.today{
    background:#f7d5e2;
    color:#ad4564;
    font-weight:700;
}

.calendar-day.has-job:after{
    content:"";
    width:5px;
    height:5px;
    border-radius:50%;
    background:#e17d9c;
    position:absolute;
    bottom:5px;
}

.schedule-day{
    background:#fff;
    border-radius:20px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
}

.schedule-day-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
}

.schedule-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 0;
    border-top:1px solid #eee7eb;
}

.schedule-row:first-child{
    border-top:0;
}

.schedule-main strong{
    display:block;
}

.schedule-main small{
    display:block;
    color:#777;
    margin-top:3px;
    font-size:11px;
}

.schedule-money{
    color:#ad4d6b;
    font-weight:700;
}


/* =========================================================
   CLIENTS
========================================================= */

.client-card{
    background:#fff;
    border-radius:20px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
}

.client-top{
    display:flex;
    align-items:center;
    gap:11px;
}

.client-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f8dce7;
    color:#a44564;
    font-weight:700;
}

.client-info{
    flex:1;
}

.client-info strong{
    display:block;
}

.client-info small{
    display:block;
    color:#777;
    margin-top:3px;
}

.client-rate{
    color:#ae4b69;
    font-weight:700;
}

.client-badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
}

.badge{
    padding:4px 8px;
    border-radius:9px;
    font-size:10px;
    font-weight:700;
}

.badge-private{
    background:#fbdce7;
    color:#85304e;
}

.badge-agency{
    background:#deebfa;
    color:#2a5c7b;
}

.badge-frequency{
    background:#eee4f7;
    color:#683a86;
}

.client-actions{
    display:flex;
    gap:7px;
    margin-top:11px;
}

.small-action{
    padding:8px 11px;
    border-radius:12px;
    background:#f0e9ee;
    color:#775c69;
    font-size:12px;
    font-weight:700;
}

.small-danger{
    background:#fff0f3;
    color:#b33458;
}


/* =========================================================
   EARNINGS
========================================================= */

.earnings-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-bottom:12px;
}

.earning-box{
    border-radius:20px;
    padding:20px 13px;
    text-align:center;
}

.earning-box.hours{
    background:#e4e7fb;
}

.earning-box.money{
    background:#def1e5;
}

.earning-box small{
    color:#716b72;
}

.earning-box strong{
    display:block;
    margin-top:5px;
    font-size:25px;
}

.history-card{
    background:#fff;
    border-radius:19px;
    padding:14px;
    margin-bottom:8px;
    box-shadow:var(--shadow);
}

.history-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.history-client{
    font-weight:700;
}

.history-date{
    color:#777;
    font-size:11px;
    margin-top:4px;
}

.history-money{
    color:#ad4c6a;
    font-weight:700;
}

.history-details{
    margin-top:8px;
    color:#696269;
    font-size:12px;
}

.history-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}


/* =========================================================
   SETTINGS
========================================================= */

.settings-card{
    background:#fff;
    border-radius:20px;
    padding:6px 14px;
    box-shadow:var(--shadow);
}

.setting-row{
    min-height:67px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #eee7eb;
}

.setting-row:last-child{
    border-bottom:0;
}

.setting-icon{
    width:43px;
    height:43px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f9dce7;
    color:#a74362;
    font-size:20px;
    flex:none;
}

.setting-copy{
    flex:1;
}

.setting-copy strong{
    display:block;
    font-size:14px;
}

.setting-copy small{
    display:block;
    color:#7c747a;
    margin-top:3px;
    font-size:11px;
}

.setting-select{
    width:83px;
    height:39px;
    border:1px solid #e7dce2;
    border-radius:12px;
    background:#fff;
    text-align:center;
}

.switch{
    width:44px;
    height:25px;
    border-radius:20px;
    background:#ded8dc;
    position:relative;
}

.switch:after{
    content:"";
    position:absolute;
    width:19px;
    height:19px;
    left:3px;
    top:3px;
    background:#fff;
    border-radius:50%;
    transition:.2s;
}

.switch.on{
    background:#e37e9d;
}

.switch.on:after{
    left:22px;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:10000;
    display:none;
    align-items:flex-end;
    background:rgba(25,17,21,.4);
    backdrop-filter:blur(4px);
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:560px;
    max-height:94vh;
    overflow:auto;
    margin:0 auto;
    padding:
        20px
        18px
        calc(30px + env(safe-area-inset-bottom));

let data=null;

try{

if(!data){

    for(const key of OLD_KEYS){

        try{

            const old=JSON.parse(
                localStorage.getItem(key)||"null"
            );

            if(old){

                data=old;
                break;

            }

        }catch(e){}

    }

}


if(!data){
    data={};
}


let clients=
    Array.isArray(data.clients)
    ?data.clients
    :DEFAULT_CLIENTS.map(c=>({...c}));


let jobs=
    Array.isArray(data.jobs)
    ?data.jobs
    :Array.isArray(data.history)
        ?data.history
        :[];

    Array.isArray(data.holidays)
    ?data.holidays
    :[];


let reminderEnabled=
    data.reminderEnabled!==false;


let zoom=
    Number(data.zoom||100);


let activeTimer=
    data.activeTimer||null;


let calendarMonth=
    data.calendarMonth
    ||
    new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
    ).toISOString().slice(0,7);


clients=clients.filter(
    c=>
        String(c.name||"")
            .trim()
            .toLowerCase()
        !==
        "gill"
);


function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            clients,
            jobs,
            holidays,
            reminderEnabled,
            zoom,
            activeTimer,
            calendarMonth
        })
    );

}


/* =========================================================
   HELPERS
========================================================= */

function esc(v){

    return String(v??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function money(v){

    return "£"+
        Number(v||0).toFixed(2);

}


function mins(t){

    if(!t || !String(t).includes(":")){
        return 0;
    }

    const p=String(t).split(":");

    return Number(p[0])*60+
        Number(p[1]);

}


function hoursBetween(start,end){

    return Math.max(
        0,
        mins(end)-mins(start)
    )/60;

}


function durationText(hours){

    const total=Math.round(
        Number(hours||0)*60
    );

    const h=Math.floor(total/60);
    const m=total%60;

    return `${h}h ${m}m`;

}


function timeFromDate(date){

    return new Date(date)
        .toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function todayISO(){

    const d=new Date();

    return d.getFullYear()+
        "-"+
        String(d.getMonth()+1).padStart(2,"0")+
        "-"+
        String(d.getDate()).padStart(2,"0");

}


function prettyDate(date){

    if(!date)return"";

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );

}


function shortDate(date){

    if(!date)return"";

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


function getClient(id){

    return clients.find(
        c=>Number(c.id)===Number(id)
    );

}


function dayName(date){

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {weekday:"long"}
    );

}

/* =========================================================
   TODAY SCHEDULE
========================================================= */

function getTodaySchedule(date){

    const day=dayName(date);

    const list=[];


    clients
        .filter(
            c=>c.day===day
        )
        .forEach(
            c=>{

                if(
                    c.frequency==="Occasional"
                ){
                    return;
                }

                list.push({
                    id:"client-"+c.id,
                    clientId:c.id,
                    name:c.name,
                    start:c.start,
                    end:c.end,
                    rate:c.rate
                });

            }
        );


    jobs
        .filter(
            j=>j.date===date
        )
        .forEach(
            j=>{

                const index=
                    list.findIndex(
                        x=>
                            x.clientId===
                            j.clientId &&
                            x.start===
                            j.start
                    );


                if(index>=0){
                    list.splice(index,1);
                }


                if(
                    String(j.status)
                        .toLowerCase()
                    !==
                    "cancelled"
                ){

                    list.push({
                        id:j.id,
                        clientId:j.clientId,
                        name:j.client||getClient(j.clientId)?.name||"Client",
                        start:j.start,
                        end:j.end,
                        rate:j.rate||getClient(j.clientId)?.rate||0,
                        job:true
                    });

                }

            }
        );


    return list.sort(
        (a,b)=>
            mins(a.start)-
            mins(b.start)
    );

}


/* =========================================================
   SCHEDULE
========================================================= */

function showSchedule(){

    setActive("schedule");

    renderSchedule();

}


function renderSchedule(){

    const date=new Date(
        calendarMonth+"-01T12:00:00"
    );

    const year=date.getFullYear();
    const month=date.getMonth();

    const monthName=date.toLocaleDateString(
        "en-GB",
        {
            month:"long",
            year:"numeric"
        }
    );

    const firstDay=
        new Date(
            year,
            month,
            1
        ).getDay();

    const offset=
        firstDay===0
        ?6
        :firstDay-1;

    const daysInMonth=
        new Date(
            year,
            month+1,
            0
        ).getDate();


    let calendar="";

    for(let i=0;i<offset;i++){
        calendar+=`<div></div>`;
    }


    for(let day=1;day<=daysInMonth;day++){

        const iso=
            year+
            "-"+
            String(month+1).padStart(2,"0")+
            "-"+
            String(day).padStart(2,"0");


        const has=
            getTodaySchedule(iso).length>0;


        calendar+=`

            <button
                class="
                    calendar-day
                    ${iso===todayISO()?"today":""}
                    ${has?"has-job":""}
                "
                onclick="showScheduleDate('${iso}')">

                ${day}

            </button>

        `;

    }


    document.getElementById(
        "appContent"
    ).innerHTML=`

        ${header()}


        <div class="page-top">

            <h1>
                Schedule
            </h1>

            <button
                class="page-action"
                onclick="openJobModal()">

                ＋ Add job

            </button>

        </div>


        <section class="calendar-card">

            <div class="calendar-header">

                <button
                    class="calendar-arrow"
                    onclick="changeCalendar(-1)">

                    ‹

                </button>

                <div class="calendar-month">
                    ${monthName}
                </div>

                <button
                    class="calendar-arrow"
                    onclick="changeCalendar(1)">

                    ›

                </button>

            </div>


            <div class="calendar-grid">

                ${[
                    "Mon",
                    "Tue",
                    "Wed",
                    "Thu",
                    "Fri",
                    "Sat",
                    "Sun"
                ].map(
                    d=>
                        `<div class="calendar-weekday">${d}</div>`
                ).join("")}

                ${calendar}

            </div>

        </section>


        <div id="scheduleDateArea">

            ${scheduleDateHTML(
                todayISO()
            )}

        </div>


        <div class="section-title">

            <h2>
                Job history
            </h2>

        </div>


        ${
            jobs.length

            ?

            jobs
                .slice()
                .sort(
                    (a,b)=>
                        String(b.date)
                            .localeCompare(
                                String(a.date)
                            )
                )
                .map(job=>historyHTML(job))
                .join("")

            :

            `
                <div class="white-card"
                     style="
                        text-align:center;
                        color:#888;
                     ">

                    No completed jobs yet.

                </div>
            `
        }

    `;

    applyZoom();

}


function changeCalendar(amount){

    const d=new Date(
        calendarMonth+"-01T12:00:00"
    );

    d.setMonth(
        d.getMonth()+amount
    );

    calendarMonth=
        d.getFullYear()+
        "-"+
        String(d.getMonth()+1)
            .padStart(2,"0");

    save();

    renderSchedule();

}

function saveClient(id){

    const name=
        document.getElementById(
            "clientName"
        ).value.trim();


    if(!name){
        alert("Please enter a client name.");
        return;
    }


    const object={

        id:id||Date.now(),

        name,

        type:
            document.getElementById(
                "clientType"
            ).value,

        rate:
            Number(
                document.getElementById(
                    "clientRate"
                ).value
            ),

        day:
            document.getElementById(
                "clientDay"
            ).value,

        start:
            document.getElementById(
                "clientStart"
            ).value,

        end:
            document.getElementById(
                "clientEnd"
            ).value,

        frequency:
            document.getElementById(
                "clientFrequency"
            ).value

    };


    if(id){

        const index=
            clients.findIndex(
                c=>Number(c.id)===Number(id)
            );

        if(index>=0){

            clients[index]={
                ...clients[index],
                ...object
            };

        }

    }else{

        clients.push(object);

    }


    save();

    closeModal();

    showClients();

}


function deleteClient(id){

    const client=getClient(id);

    if(!client)return;


    if(
        !confirm(
            `Delete ${client.name}? Existing job history will be kept.`
        )
    ){
        return;
    }


    clients=
        clients.filter(
            c=>Number(c.id)!==Number(id)
        );


    save();

    showClients();

}

        ).value;

            ).value

}


function deleteJob(id){

        )

    jobs=

    save();

    showEarnings();

}

function saveManualJob(){

    const client=
        getClient(
            Number(
                document.getElementById(
                    "newClient"
                ).value
            )
        );


    const date=
        document.getElementById(
            "newDate"
        ).value;

    const start=
        document.getElementById(
            "newStart"
        ).value;

    const end=
        document.getElementById(
            "newEnd"
        ).value;


    if(!client||!date||!start||!end){

        alert(
            "Please complete all fields."
        );

        return;
    }


    if(mins(end)<=mins(start)){

        alert(
            "End time must be after start time."
        );

        return;
    }


    const duration=
        hoursBetween(start,end);


    const amount=
        duration*
        Number(client.rate||0);


    jobs.push({

        id:Date.now(),

        clientId:client.id,

        client:client.name,

        date,

        start,

        end,

        rate:Number(client.rate||0),

        amount,

        price:amount,

        status:"Completed",

        source:"manual"

    });


    save();

    closeModal();

    showEarnings();

}


/* =========================================================

========================================================= */

let timerInterval=null;


function openTimer(){

    if(activeTimer){

        renderTimerModal();

        return;

    }


    openModal(`

            <h2>
                Start cleaning
            </h2>

        </div>

                clients.map(
                    c=>

                            ${esc(c.name)}
                            · £${Number(c.rate||0)}/h
                        </option>
                        `
                ).join("")
            }

        </select>


        <div
            class="timer-display"
            id="timerDisplay">

            00:00:00

        </div>


        <div
            class="timer-status"
            id="timerStatus">

            Timer has not started.

        </div>


        <button
            class="main-button"
            onclick="startTimer()">

            Start cleaning

        </button>

    `);

}


function startTimer(){

    const clientId=
        Number(
            document.getElementById(
                "timerClient"
            ).value
        );


    activeTimer={

        clientId,

        startedAt:Date.now(),

        startDate:todayISO(),

        startTime:timeFromDate(
            new Date()
        )

    };


    save();

    renderTimerModal();

}


function renderTimerModal(){

    const client=
        getClient(
            activeTimer.clientId
        );


    if(!client)return;


    openModal(`

        <div class="modal-header">

            <h2>
                Cleaning in progress
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <div
            style="
                text-align:center;
                color:#777;
                font-size:13px;
            ">

            ${esc(client.name)}
            ·
            £${Number(client.rate||0)}/hour

        </div>


        <div
            class="timer-display"
            id="timerDisplay">

            ${timerElapsed()}

        </div>


        <div class="timer-status">

            Started at ${activeTimer.startTime}

        </div>


        <div
            class="timer-job-summary"
            id="timerMoney">

            Current amount:
            <strong>
                ${timerCurrentMoney(client)}
            </strong>

        </div>


        <button
            class="
                main-button
                timer-stop
            "
            onclick="stopTimer()">

            Finish cleaning & Save job

        </button>

    `);


    clearInterval(timerInterval);

    timerInterval=
        setInterval(
            updateTimerUI,
            500
        );

}


function timerElapsed(){

    if(!activeTimer){
        return "00:00:00";
    }


    const seconds=
        Math.max(
            0,
            Math.floor(
                (Date.now()-
                activeTimer.startedAt)/1000
            )
        );


    const h=
        Math.floor(seconds/3600);

    const m=
        Math.floor(
            (seconds%3600)/60
        );

    const s=
        seconds%60;


    return [
        h,m,s
    ]
    .map(
        n=>
            String(n).padStart(2,"0")
    )
    .join(":");

}


function timerCurrentMoney(client){

    if(!activeTimer){
        return "£0.00";
    }


    const elapsedHours=
        (
            Date.now()-
            activeTimer.startedAt
        )/3600000;


    return money(
        elapsedHours*
        Number(client.rate||0)
    );

}


function updateTimerUI(){

    const display=
        document.getElementById(
            "timerDisplay"
        );


    const client=
        activeTimer
        ?getClient(activeTimer.clientId)
        :null;


    if(display){

        display.textContent=
            timerElapsed();

    }


    const amount=
        document.getElementById(
            "timerMoney"
        );


    if(amount&&client){

        amount.innerHTML=`

            Current amount:
            <strong>
                ${timerCurrentMoney(client)}
            </strong>

        `;

    }

}


function stopTimer(){

    if(!activeTimer){
        return;
    }


    const timer={
        ...activeTimer
    };


    const endDate=new Date();


    const client=
        getClient(
            timer.clientId
        );


    if(!client){
        activeTimer=null;
        save();
        closeModal();
        return;
    }


    const endTimestamp=
        Date.now();


    let durationMinutes=
        Math.round(
            (
                endTimestamp-
                timer.startedAt
            )/60000
        );


    if(durationMinutes<1){
        durationMinutes=1;
    }


    const durationHoursExact=
        durationMinutes/60;


    const amount=
        durationHoursExact*
        Number(client.rate||0);


    const endTime=
        timeFromDate(
            endDate
        );


    jobs.push({

        id:Date.now(),

        clientId:client.id,

        client:client.name,

        date:timer.startDate,

        start:timer.startTime,

        end:endTime,

        rate:Number(client.rate||0),

        amount,

        price:amount,

        durationMinutes,

        status:"Completed",

        source:"timer",

        timerStartedAt:timer.startedAt,

        timerFinishedAt:endTimestamp

    });


    activeTimer=null;

    save();


    clearInterval(timerInterval);

    timerInterval=null;


    closeModal();


    showEarnings();

}


/* =========================================================
   FREE TIME
========================================================= */

function showFreeTime(){

    openModal(`

        <div class="modal-header">

            <h2>
                Find free time
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <label class="label">
            Date
        </label>

        <input
            class="input"
            id="freeDate"
            type="date"
            value="${todayISO()}"
            onchange="calculateFreeTime()"
        >


        <div
            id="freeResults"
            style="margin-top:15px">

        </div>

    `);

    calculateFreeTime();

}


function calculateFreeTime(){

    const date=
        document.getElementById(
            "freeDate"
        )?.value;


    const result=
        document.getElementById(
            "freeResults"
        );


    if(!date||!result)return;


    const day=dayName(date);


    const schedule=
        clients
            .filter(
                c=>
                    c.day===day &&
                    c.frequency!=="Occasional"
            )
            .sort(
                (a,b)=>
                    mins(a.start)-
                    mins(b.start)
            );


    const start=8*60;
    const end=18*60;

    let cursor=start;

    const gaps=[];


    schedule.forEach(
        c=>{

            const s=mins(c.start);
            const e=mins(c.end);


            if(s>cursor){

                gaps.push({
                    start:cursor,
                    end:s
                });

            }


            cursor=
                Math.max(
                    cursor,
                    e
                );

        }
    );


    if(cursor<end){

        gaps.push({
            start:cursor,
            end
        });

    }


    result.innerHTML=`

        <div
            class="white-card"
            style="
                text-align:center;
                background:#fff0c9;
            ">

            <small>
                Available time
            </small>

            <div
                style="
                    font-size:31px;
                    font-weight:700;
                    margin-top:4px;
                ">

                ${durationText(
                    gaps.reduce(
                        (sum,g)=>
                            sum+
                            (g.end-g.start)/60,
                        0
                    )
                )}

            </div>

        </div>


        ${
            gaps.map(
                gap=>`

                    <div class="white-card">

                        <strong>
                            ${String(
                                Math.floor(gap.start/60)
                            ).padStart(2,"0")}:
                            ${String(
                                gap.start%60
                            ).padStart(2,"0")}

                            –

                            ${String(
                                Math.floor(gap.end/60)
                            ).padStart(2,"0")}:
                            ${String(
                                gap.end%60
                            ).padStart(2,"0")}
                        </strong>

                        <div
                            style="
                                margin-top:4px;
                                color:#777;
                            ">

                            ${durationText(
                                (gap.end-gap.start)/60
                            )}

                        </div>

                    </div>

                `
            ).join("")
            ||
            `
                <div
                    style="
                        text-align:center;
                        color:#888;
                        padding:20px;
                    ">

                    No free time found.

                </div>
            `
        }

    `;

}

/* =========================================================
   CALENDAR EXPORT
========================================================= */

function exportCalendar(){

    const events=[];


    jobs.forEach(
        job=>{

            if(
                String(job.status)
                    .toLowerCase()
                ===
                "cancelled"
            ){
                return;
            }


            events.push({

                name:
                    job.client||
                    getClient(job.clientId)?.name||
                    "Cleaning",

                date:job.date,

                start:job.start,

                end:job.end

            });

        }
    );


    clients.forEach(
        client=>{

            events.push({

                name:client.name,

                date:todayISO(),

                start:client.start,

                end:client.end

            });

        }
    );


    const ics=[
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Pure Shine Cleaning//EN"
    ];


    events.forEach(
        event=>{

            const cleanDate=
                String(event.date)
                    .replaceAll("-","");


            const start=
                event.start
                    .replace(":","")+
                "00";


            const end=
                event.end
                    .replace(":","")+
                "00";


            ics.push(
                "BEGIN:VEVENT",
                "UID:"+Date.now()+Math.random(),
                "DTSTART:"+cleanDate+"T"+start,
                "DTEND:"+cleanDate+"T"+end,
                "SUMMARY:"+event.name,
                "END:VEVENT"
            );

        }
    );


    ics.push(
        "END:VCALENDAR"
    );


    const blob=
        new Blob(
            [ics.join("\r\n")],
            {
                type:"text/calendar"
            }
        );


    const url=
        URL.createObjectURL(blob);


    const a=
        document.createElement("a");

    a.href=url;

    a.download=
        "pure-shine-cleaning-calendar.ics";

    a.click();

    setTimeout(
        ()=>{
            URL.revokeObjectURL(url);
        },
        1000
    );

}
