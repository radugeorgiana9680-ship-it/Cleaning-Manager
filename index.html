<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover">

<meta name="theme-color"
      content="#f5d0df">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"

<title>Pure Shine Cleaning Manager ✨</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:#343348;

    background:
        linear-gradient(
            rgba(249,246,251,.78),
            rgba(249,246,251,.90)

        url("background.jpg")

    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

input,
select{
    outline:none;

/* =====================================================
   APP
===================================================== */

#app{
    min-height:100vh;
}

.app{
    min-height:100vh;
    max-width:780px;

    background:

===================================================== */

}

.brand-title{

    font-family:
        Georgia,
        serif;

    font-weight:800;

.brand-subtitle{

        serif;

}

.header-actions{

    display:flex;

}

.header-button{

    height:56px;

}

/* =====================================================
   MAIN
===================================================== */

.content{

}

.greeting{

    margin:0;

    font-size:41px;

    line-height:1;

}

.date-text{

/* =====================================================
   DASHBOARD
===================================================== */

.dashboard{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;

}

.stat{

    border-radius:27px;
}

.stat.jobs{

}

/* =====================================================
   SECTION
===================================================== */

.section{

.section-header{

.section-title{

/* =====================================================

===================================================== */

.schedule-card{

}

.timer-running{

    background:#df98b9 !important;

}

@keyframes pulse{

    0%{
        box-shadow:
            0 0 0 0
            rgba(220,125,165,.45);
    }

    70%{

            0 0 0 9px

   QUICK ACTIONS
===================================================== */

/* =====================================================

===================================================== */

.primary{

    border-radius:16px;

.card-top{

.card-name{

.badge{

<body>

<div id="app"></div>

<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
    "pureShineManager_V5";

const TIMER_KEY =
    "pureShineActiveTimer_V5";

/* =====================================================
   DEFAULT CLIENTS
===================================================== */

const DEFAULT_CLIENTS = [

    {
        id:1,
        name:"Lottie",
        type:"Agency",
        rate:16,
        day:"Monday",
        start:"13:00",
        end:"15:00"
    },

    {
        id:2,
        name:"Christine",
        type:"Private",
        rate:18,
        day:"Tuesday",
        start:"09:30",
        end:"12:30"
    },

    {
        id:3,
        name:"Matt",
        type:"Agency",
        rate:16,
        day:"Tuesday",
        start:"13:30",
        end:"17:30"
    },

    {
        id:4,
        name:"Sonia",
        type:"Agency",
        rate:16,
        day:"Wednesday",
        start:"09:00",
        end:"14:00"
    },

    {
        id:5,
        name:"Gill",
        type:"Agency",
        rate:16,
        day:"Wednesday",
        start:"15:00",
        end:"18:00"
    },

    {
        id:6,
        name:"Laura",
        type:"Private",
        rate:18,
        day:"Thursday",
        start:"09:00",
        end:"13:00"
    },

    {
        id:7,
        name:"Hannah",
        type:"Agency",
        rate:16,
        day:"Thursday",
        start:"13:00",
        end:"16:00"
    }

];

/* =====================================================
   LOAD DATA
===================================================== */

let saved =
    localStorage.getItem(
        STORAGE_KEY
    );

let data;

try{

    data =
        saved
        ? JSON.parse(saved)
        : {
            clients:DEFAULT_CLIENTS,
            jobs:[]
        };

}catch(e){

    data={
        clients:DEFAULT_CLIENTS,
        jobs:[]
    };

}

if(!Array.isArray(data.clients)){
    data.clients=[...DEFAULT_CLIENTS];
}

if(!Array.isArray(data.jobs)){
    data.jobs=[];
}

save();

/* =====================================================
   TIMER
===================================================== */

let timer={
    running:false,
    clientId:null,
    startedAt:null,
    seconds:0
};

try{

    const oldTimer =
        localStorage.getItem(
            TIMER_KEY
        );

    if(oldTimer){

        timer =
            JSON.parse(oldTimer);

    }

}catch(e){}

saveTimer();

/* =====================================================
   APP STATE
===================================================== */

let page="home";

/* =====================================================
   SAVE
===================================================== */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}

function saveTimer(){

    localStorage.setItem(
        TIMER_KEY,
        JSON.stringify(timer)
    );

}

/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function money(value){

    return "£"+
        Number(value||0)
        .toFixed(2);

}

function todayISO(){

    const d=new Date();

    return d
        .toISOString()
        .slice(0,10);

}

function todayName(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {
                weekday:"long"
            }
        );

}

function timeToMinutes(time){

    if(!time) return 0;

    const p=
        time
        .split(":")
        .map(Number);

    return p[0]*60+p[1];

}

function calculateHours(
    start,
    end
){

    return Math.max(
        0,
        (
            timeToMinutes(end)-
            timeToMinutes(start)
        )/60
    );

}

function formatDate(date){

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}

/* =====================================================
   TIMER HELPERS
===================================================== */

function timerSeconds(){

    if(!timer.running){

        return Number(
            timer.seconds||0
        );

    }

    return Number(
        timer.seconds||0
    )
    +
    Math.floor(
        (
            Date.now()-
            Number(timer.startedAt)
        )/1000
    );

}

function timerString(seconds){

    seconds=
        Math.max(
            0,
            Math.floor(seconds)
        );

    const h=
        Math.floor(
            seconds/3600
        );

    const m=
        Math.floor(
            (seconds%3600)/60
        );

    const s=
        seconds%60;

    return (

        String(h).padStart(2,"0")
        +":"
        +String(m).padStart(2,"0")
        +":"
        +String(s).padStart(2,"0")

    );

}

function timerHours(){

    return timerSeconds()/3600;

}

/* =====================================================
   HOME
===================================================== */

function homePage(){

    const jobsToday=
        data.jobs.filter(
            j=>j.date===todayISO()
        );

    const earned=
        jobsToday.reduce(
            (sum,j)=>
                sum+
                Number(j.price||0),
            0
        );

    const hours=
        jobsToday.reduce(
            (sum,j)=>
                sum+
                Number(j.hours||0),
            0
        );

    const todayClients=
        data.clients
        .filter(
            c=>c.day===todayName()
        )
        .sort(
            (a,b)=>
                timeToMinutes(a.start)-
                timeToMinutes(b.start)
        );

    const available=
        todayClients.reduce(
            (sum,c)=>
                sum+
                calculateHours(
                    c.start,
                    c.end
                ),
            0
        );

    return `

        <h1 class="greeting">
            Good morning ✨
        </h1>

        <div class="date-text">

            ${
                new Date()
                .toLocaleDateString(
                    "en-GB",
                    {
                        weekday:"long",
                        day:"numeric",
                        month:"long"
                    }
                )
            }

        </div>

        <div class="dashboard">

            <div class="stat jobs">

                <div class="stat-icon">
                    🧹
                </div>

                <div class="stat-label">
                    Jobs
                </div>

                <div class="stat-value">
                    ${jobsToday.length}
                </div>

            </div>

            <div class="stat hours">

                <div class="stat-icon">
                    ⏰
                </div>

                <div class="stat-label">
                    Hours
                </div>

                <div class="stat-value">
                    ${hours.toFixed(2)}h
                </div>

function scheduleCard(client){

    const existing=
        data.jobs.find(
            j=>
                j.date===todayISO() &&
                Number(j.clientId)===Number(client.id)
        );

    const actual=
        existing
        ?Number(existing.hours||0)
        :calculateHours(
            client.start,
            client.end
        );

    const running=
        timer.running &&
        Number(timer.clientId)===Number(client.id);

    return `

        <div class="schedule-card">

            <div class="schedule-line"></div>

            <div class="schedule-info">

                <div class="schedule-name">

                    ${escapeHTML(
                        client.name
                    )}

                </div>

                <div class="schedule-time">

                    ${client.start}
                    –
                    ${client.end}

                </div>

            </div>

            <div class="schedule-actions">

                <input
                    class="hours-input"
                    type="number"
                    min="0"
                    step="0.01"
                    value="${actual.toFixed(2)}"
                    onchange="
                        changeTodayHours(
                            ${client.id},
                            this.value
                        )
                    "
                    title="Actual hours">

                <button
                    class="
                        icon-button
                        ${
                            running
                            ?"timer-running"
                            :""
                        }
                    "
                    onclick="
                        ${
                            running
                            ?"stopTimer()"
                            :"startTimerFor("+client.id+")"
                        }
                    "
                    title="Timer">

                    ${
                        running
                        ?"⏹"
                        :"⏱️"
                    }

                </button>

                <button
                    class="icon-button pink"
                    onclick="
                        editClient(
                            ${client.id}

                    "
                    title="Edit client">

                    ✏️

                </button>

            </div>

        </div>

    `;

}

/* =====================================================
   CHANGE TODAY HOURS
===================================================== */

function changeTodayHours(
    clientId,
    value
){

    const client=
        data.clients.find(
            c=>Number(c.id)===Number(clientId)
        );

    if(!client)
        return;

    const hours=
        Math.max(
            0,
            Number(value)||0
        );

    let job=
        data.jobs.find(
            j=>
                j.date===todayISO() &&
                Number(j.clientId)===Number(clientId)
        );

    if(!job){

        job={

            id:Date.now(),

            clientId:Number(clientId),

            date:todayISO(),

            start:client.start,

            end:client.end,

            hours,

            price:
                hours*
                Number(client.rate),

            status:"Paid",

            timerSeconds:0

        };

        data.jobs.push(job);

    }else{

        job.hours=hours;

        job.price=
            hours*
            Number(client.rate);

    }

    save();

    render();

}

function saveClient(id){

    const name=
        document.getElementById(
            "clientName"
        ).value.trim();

    const type=
        document.getElementById(
            "clientType"
        ).value;

    const rate=
        Number(
            document.getElementById(
                "clientRate"
            ).value
        );

    const day=
        document.getElementById(
            "clientDay"
        ).value;

    const start=
        document.getElementById(
            "clientStart"
        ).value;

    const end=
        document.getElementById(
            "clientEnd"
        ).value;

    if(!name){

        alert(
            "Please enter the client name."
        );

        return;

    }

    if(!rate || rate<=0){

        alert(
            "Please enter a valid hourly rate."
        );

        return;

    }

    if(id){

        const client=
            data.clients.find(
                c=>Number(c.id)===Number(id)
            );

        if(client){

            client.name=name;
            client.type=type;
            client.rate=rate;
            client.day=day;
            client.start=start;
            client.end=end;

        }

    }else{

        data.clients.push({

            id:Date.now(),

            name,

            type,

            rate,

            day,

            start,

            end

        });

    }

    save();

    closeModal();

    render();

}

/* =====================================================
   DELETE CLIENT
===================================================== */

function deleteClient(
    id,
    fromModal=false
){

    const client=
        data.clients.find(
            c=>Number(c.id)===Number(id)
        );

    if(!client)
        return;

    const confirmed=
        confirm(
            `Delete ${client.name} from your clients?`
        );

    if(!confirmed)
        return;

    data.clients=
        data.clients.filter(
            c=>Number(c.id)!==Number(id)
        );

    /*
       Jobs are kept so historical
       earnings are NOT lost.
    */

    save();

    if(fromModal)
        closeModal();

    render();

}

function saveJob(id){

    const clientId=
        Number(
            document.getElementById(
                "jobClient"
            ).value
        );

    const client=
        data.clients.find(
            c=>Number(c.id)===clientId
        );

    if(!client)
        return;

    const date=
        document.getElementById(
            "jobDate"
        ).value;

    const start=
        document.getElementById(
            "jobStart"
        ).value;

    const end=
        document.getElementById(
            "jobEnd"
        ).value;

    let hours=
        Number(
            document.getElementById(
                "jobHours"
            ).value
        );

    const status=
        document.getElementById(
            "jobStatus"
        ).value;

    if(!hours){

        hours=
            calculateHours(
                start,
                end
            );

    }

    const price=
        hours*
        Number(client.rate);

    if(id){

        const job=
            data.jobs.find(
                j=>Number(j.id)===Number(id)
            );

        if(job){

            job.clientId=clientId;
            job.date=date;
            job.start=start;
            job.end=end;
            job.hours=hours;
            job.price=price;
            job.status=status;

        }

    }else{

        data.jobs.push({

            id:Date.now(),

            clientId,

            clientName:client.name,

            rate:client.rate,

            date,

            start,

            end,

            hours,

            price,

            status,

            timerSeconds:0

        });

    }

    save();

    closeModal();

    render();

}

                    )
                    .map(jobCard)
                    .join("")
                :`

                    <div class="empty">

                        <div class="empty-icon">
                            💷
                        </div>

                        No earnings yet.

                    </div>

                `
            }

        </section>

    `;

}

/* =====================================================
   TIMER SELECTOR
===================================================== */

function openTimerSelector(){

    if(timer.running){

        openTimer(
            timer.clientId
        );

        return;

    }

    modal(`

        <div class="modal-header">

            <h2 class="modal-title">
                Start Timer ⏱️
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>

        <div class="form-group">

            <label class="form-label">
                Choose client
            </label>

            <select
                id="timerClient"
                class="form-control">

                <option value="">
                    Select client
                </option>

                ${
                    data.clients
                    .map(
                        c=>`

                        <option value="${c.id}">
                            ${escapeHTML(c.name)}
                        </option>

                        `
                    )
                    .join("")
                }

            </select>

        </div>

        <button
            class="primary"
            style="
                width:100%;
            "
            onclick="startSelectedTimer()">

            ▶ Start Timer

        </button>

    `);

}

function startSelectedTimer(){

    const id=
        Number(
            document.getElementById(
                "timerClient"
            ).value
        );

    if(!id){

        alert(
            "Please choose a client."
        );

        return;

    }

    startTimerFor(id);

}

/* =====================================================
   START TIMER
===================================================== */

function startTimerFor(clientId){

    if(timer.running){

        if(
            Number(timer.clientId)===Number(clientId)
        ){

            openTimer(clientId);

        }else{

            alert(
                "A timer is already running for another client."
            );

        }

        return;

    }

    timer={

        running:true,

        clientId:Number(clientId),

        startedAt:Date.now(),

        seconds:0

    };

    saveTimer();

    openTimer(clientId);

}

/* =====================================================
   TIMER MODAL
===================================================== */

function openTimer(clientId){

    const client=
        data.clients.find(
            c=>Number(c.id)===Number(clientId)
        );

    if(!client)
        return;

    modal(`

        <div class="modal-header">

            <h2 class="modal-title">

                ${escapeHTML(
                    client.name
                )}

                ⏱️

            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>

        <div class="timer-box">

            <div
                id="timerDisplay"
                class="timer-display">

                ${timerString(
                    timerSeconds()
                )}

            </div>

            <button
                class="primary"
                style="
                    width:100%;
                    background:#766c82;
                "
                onclick="stopTimer()">

                ⏹ Stop & Save

            </button>

            <div
                class="timer-money">

                Current hours

                <strong
                    id="timerHoursDisplay">

                    ${timerHours().toFixed(2)} h

                </strong>

                Current earnings

                <strong
                    id="timerMoneyDisplay">

                    ${money(
                        timerHours()*
                        Number(client.rate)
                    )}

                </strong>

            </div>

            <div class="timer-note">

                The timer uses the real clock time.
                If Safari is put in the background,
                the calculation continues from the
                original start time when you return.

            </div>

        </div>

    `);

}

/* =====================================================
   STOP TIMER
===================================================== */

function stopTimer(){

    if(!timer.running)
        return;

    const client=
        data.clients.find(
            c=>Number(c.id)===Number(timer.clientId)
        );

    if(!client){

        resetTimer();

        return;

    }

    const seconds=
        timerSeconds();

    const hours=
        Number(
            (seconds/3600)
            .toFixed(4)
        );

    const now=
        new Date();

    const started=
        new Date(
            Number(timer.startedAt)
        );

    const start=
        started.toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    const end=
        now.toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    let job=
        data.jobs.find(
            j=>
                j.date===todayISO() &&
                Number(j.clientId)===Number(client.id)
        );

    if(job){

        job.start=start;
        job.end=end;
        job.hours=hours;
        job.price=
            hours*
            Number(client.rate);

        job.timerSeconds=seconds;

    }else{

        data.jobs.push({

            id:Date.now(),

            clientId:client.id,

            clientName:client.name,

            rate:client.rate,

            date:todayISO(),

            start,

            end,

            hours,

            price:
                hours*
                Number(client.rate),

            status:"Paid",

            timerSeconds:seconds

        });

    }

    resetTimer();

    save();

    closeModal();

    render();

}

/* =====================================================
   RESET TIMER
===================================================== */

function resetTimer(){

    timer={

        running:false,

        clientId:null,

        startedAt:null,

        seconds:0

    };

    saveTimer();

}

/* =====================================================
   TIMER LIVE UPDATE
===================================================== */

setInterval(

    ()=>{

        if(!timer.running)
            return;

        const display=
            document.getElementById(
                "timerDisplay"
            );

        if(display){

            display.textContent=
                timerString(
                    timerSeconds()
                );

        }

        const h=
            document.getElementById(
                "timerHoursDisplay"
            );

        const m=
            document.getElementById(
                "timerMoneyDisplay"
            );

        const client=
            data.clients.find(
                c=>Number(c.id)===Number(timer.clientId)
            );

        if(h){

            h.textContent=
                timerHours()
                .toFixed(2)
                +" h";

        }

        if(m && client){

            m.textContent=
                money(
                    timerHours()*
                    Number(client.rate)
                );

        }

    },

    1000

);

/*
   Recalculate immediately after returning
   from background.
*/

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            !document.hidden &&
            timer.running
        ){

            const display=
                document.getElementById(
                    "timerDisplay"
                );

            if(display){

                display.textContent=
                    timerString(
                        timerSeconds()
                    );

            }

        }

    }
);

/* =====================================================
   MODAL
===================================================== */

function modal(content){

    closeModal();

    const backdrop=
        document.createElement(
            "div"
        );

    backdrop.id="modal";

    backdrop.className=
        "modal-backdrop";

    backdrop.innerHTML=`

        <div
            class="modal"
            onclick="
                event.stopPropagation()
            ">

            ${content}

        </div>

    `;

    backdrop.onclick=
        closeModal;

    document.body.appendChild(
        backdrop
    );

}

function closeModal(){

    const old=
        document.getElementById(
            "modal"
        );

    if(old)
        old.remove();

}

/* =====================================================
   NAVIGATION
===================================================== */

function go(target){

    page=target;

    closeModal();

    render();

}

function navigation(){

    return `

        <nav class="bottom-nav">

            <button
                class="
                    nav
                    ${
                        page==="home"
                        ?"active":""
                    }
                "
                onclick="
                    go('home')
                ">

                <span class="nav-icon">
                    🏠
                </span>

                Home

            </button>

            <button
                class="
                    nav
                    ${
                        page==="schedule"
                        ?"active":""
                    }
                "
                onclick="
                    go('schedule')
                ">

                <span class="nav-icon">
                    📅
                </span>

                Schedule

            </button>

            <button
                class="
                    nav
                    ${
                        page==="clients"
                        ?"active":""
                    }
                "
                onclick="
                    go('clients')
                ">

                <span class="nav-icon">
                    👥
                </span>

                Clients

            </button>

            <button
                class="
                    nav
                    ${
                        page==="jobs"
                        ?"active":""
                    }
                "
                onclick="
                    go('jobs')
                ">

                <span class="nav-icon">
                    📋
                </span>

                Jobs

            </button>

            <button
                class="
                    nav
                    ${
                        page==="earnings"
                        ?"active":""
                    }
                "
                onclick="
                    go('earnings')
                ">

                <span class="nav-icon">
                    💷
                </span>

                Earnings

            </button>

        </nav>

    `;

}

/* =====================================================
   RENDER
===================================================== */

function render(){

    let content="";

    if(page==="home")
        content=homePage();

    if(page==="schedule")
        content=schedulePage();

    if(page==="clients")
        content=clientsPage();

    if(page==="jobs")
        content=jobsPage();

    if(page==="earnings")
        content=earningsPage();

    document.getElementById(
        "app"
    ).innerHTML=`

        <div class="app">

            <header class="header">

                <div class="brand">

                    <img
                        class="brand-logo"
                        src="icon.png"
                        alt="Pure Shine">

                    <div
                        class="
                            brand-logo-fallback
                        "
                        id="logoFallback">

                        ✨

                    </div>

                    <div>

                        <div class="brand-title">
                            Pure Shine
                        </div>

                        <div class="brand-subtitle">
                            Cleaning Manager ✨
                        </div>

                    </div>

                </div>

                <div class="header-actions">

                    <button
                        class="
                            header-button
                            timer
                        "
                        onclick="
                            openTimerSelector()
                        "
                        title="Timer">

                        ⏱️

                    </button>

                    <button
                        class="header-button"
                        onclick="
                            openJobForm()
                        "
                        title="Add">

                        +

                    </button>

                </div>

            </header>

            <main class="content">

                ${content}

            </main>

        </div>

        ${navigation()}

    `;

    const logo=
        document.querySelector(
            ".brand-logo"
        );

    const fallback=
        document.getElementById(
            "logoFallback"
        );

    if(logo && fallback){

        logo.onerror=()=>{

            logo.style.display="none";

            fallback.style.display="flex";

        };

    }

}

/* =====================================================
   START
===================================================== */

render();

</script>
