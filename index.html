<!DOCTYPE html>
<html lang="en">

<title>Pure Shine Cleaning Manager</title>

<style>

/* =========================================================
   FULL SCREEN RESET
   ========================================================= */

html,
body{
    margin:0 !important;
    padding:0 !important;

    width:100% !important;
    min-width:100% !important;
    max-width:none !important;

    min-height:100% !important;

    overflow-x:hidden !important;

    background:#f8dce8;

    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
}

*{
    box-sizing:border-box;
}

body{
    position:relative;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    zoom:1 !important;
    transform:none !important;
}

/* IMPORTANT:
   Nothing is allowed to make the application narrower
   than the phone screen.
*/

#app,
.app,
.app-container,
.page,
.page-container,
.main,
.main-container,
.content,
.home,
.home-page,
.screen{
    width:100% !important;
    min-width:100% !important;
    max-width:none !important;

    margin-left:0 !important;
    margin-right:0 !important;

    transform:none !important;
}

/* =========================================================
   APP
   ========================================================= */

#app{
    min-height:100vh;
    min-height:100dvh;

    padding-bottom:
        calc(92px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            rgba(255,250,253,.93),
            rgba(255,250,253,.97)
        ),
        url("pure-shine-cleaning-background(1).png")
        center top / cover fixed no-repeat;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    width:100% !important;
    min-width:100% !important;
    max-width:none !important;

    min-height:94px;

    padding:
        calc(13px + env(safe-area-inset-top))
        18px
        13px
        18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(255,255,255,.98);

    border-bottom:1px solid #eadfe6;

    box-shadow:
        0 4px 18px rgba(93,53,75,.06);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    min-width:0;
}

.logo{
    width:59px !important;
    height:59px !important;

    min-width:59px !important;
    max-width:59px !important;

    border-radius:18px;

    object-fit:cover;

    box-shadow:
        0 6px 17px rgba(180,90,130,.20);
}

.brand-title{
    font-size:20px;
    line-height:1.05;
    font-weight:900;

    color:#29242c;

    white-space:nowrap;
}

.brand-subtitle{
    margin-top:4px;

    font-size:11px;

    color:#8a808b;

    white-space:nowrap;
}

.settings-btn{
    width:48px !important;
    height:48px !important;

    min-width:48px !important;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 5px 18px rgba(65,40,57,.13);

    font-size:22px;

    display:grid;
    place-items:center;
}

/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content{
    width:100% !important;
    min-width:100% !important;
    max-width:none !important;

    padding:
        15px
        13px
        25px;

    margin:0 !important;
}

/* =========================================================
   DATE
   ========================================================= */

.date-card{
    width:100% !important;

    min-height:92px;

    padding:17px 19px;

    border-radius:23px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(
            135deg,
            #f7d2e1,
            #f4c9dc

    box-shadow:
        0 7px 22px rgba(96,48,71,.08);
}

.date-main{
    font-size:18px;
    line-height:1.15;
    font-weight:900;
}

.date-sub{

    font-size:12px;

    color:#81757e;
}

.sparkles{
    color:#d45d8d;
    font-size:20px;
}

/* =========================================================
   PURE SHINE IMAGE BANNER
   ========================================================= */

.quote-banner{
    position:relative;

    width:100% !important;
    max-width:none !important;

    height:135px;

    margin:
        13px
        0
        14px;

    border-radius:20px;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(255,205,224,.30),
            rgba(255,205,224,.30)

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    display:flex;
    align-items:center;
    justify-content:center;

}

.quote-text{
    position:relative;
    z-index:2;

    width:90%;

    font-family:

        "Segoe Script",
        "Brush Script MT",

    font-size:25px;

    line-height:1.08;

    color:#a94170;

    text-shadow:
        0 1px 5px rgba(255,255,255,.85);
}

/* =========================================================
   STATISTICS
   ========================================================= */

.stats{
    width:100% !important;

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:7px;
}

.stat{
    min-width:0;

    min-height:103px;

    border-radius:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    box-shadow:
        0 5px 17px rgba(80,55,75,.07);
}

.stat:nth-child(1){
    background:#f6d5e3;
}

.stat:nth-child(2){
    background:#dceafa;
}

.stat:nth-child(3){
    background:#deefe5;
}

.stat:nth-child(4){
    background:#fff0c9;
}

.stat-icon{
    font-size:18px;
    margin-bottom:4px;
}

.stat-value{
    font-size:17px;
    line-height:1;
    font-weight:900;
}

.stat-label{
    margin-top:5px;

    font-size:9px;
    font-weight:700;
}

/* =========================================================
   SECTION
   ========================================================= */

.section{
    width:100% !important;

    margin-top:21px;
}

.section-head{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:9px;
}

.section-title{
    margin:0;

    font-size:18px;
    font-weight:900;
}

.see-all{
    padding:4px 0;

    background:none;

    color:#b44f79;

    font-size:11px;
    font-weight:900;
}

/* =========================================================
   SCHEDULE
   ========================================================= */

.schedule-box{
    width:100% !important;

    background:#fff;

    border-radius:21px;

    padding:10px;

    box-shadow:
        0 7px 23px rgba(80,55,75,.09);
}

.empty{
    width:100%;

    text-align:center;

    padding:
        25px
        10px
        24px;

    color:#817985;
}

.empty-icon{
    font-size:31px;

    color:#df5d96;

    margin-bottom:5px;
}

.empty strong{
    display:block;

    font-size:14px;

    color:#302d36;
}

.empty p{
    margin:
        5px
        0
        13px;

    font-size:10px;
}

.primary{
    width:100% !important;

    height:43px;

    border-radius:23px;

    background:
        linear-gradient(
            135deg,
            #eb83ae,
            #d94788
        );

    color:white;

    font-size:12px;
    font-weight:900;

    box-shadow:
        0 7px 18px rgba(217,71,136,.25);
}

/* =========================================================
   JOB
   ========================================================= */

.job{
    width:100% !important;

    display:grid;

    grid-template-columns:
        5px
        minmax(0,1fr)
        auto;

    gap:9px;

    align-items:center;

    padding:10px;

    margin:6px 0;

    background:#fff;

    border-radius:16px;

    box-shadow:
        0 4px 14px rgba(80,55,75,.07);
}

.job-line{
    width:5px;
    height:43px;

    border-radius:10px;

    background:
        linear-gradient(
            #e57ba7,
            #a784d0,
            #74b89a

}

.job-name{
    font-size:14px;
    font-weight:900;
}

.job-time{
    margin-top:3px;

    color:#817985;

    font-size:10px;
}

.job-right{
    text-align:right;
}

.job-price{
    font-size:13px;
    font-weight:900;
}

.job-buttons{
    display:flex;
    justify-content:flex-end;
    gap:4px;

    margin-top:4px;
}

.mini{
    padding:5px 7px;

    border-radius:8px;

    background:#eadff6;

    color:#68568c;

    font-size:9px;
    font-weight:900;
}

.mini.pink{
    background:#f5d8e5;
    color:#ad4d77;
}

/* =========================================================
   EXTRA PURE SHINE IMAGE
   ========================================================= */

.shine-banner{
    width:100% !important;

    height:100px;

    margin-top:14px;

    border-radius:18px;

    overflow:hidden;

    background:
        url("6C0E0B5E-6D80-4C4B-A0D8-095D803624EE.jpeg")
        center bottom / cover no-repeat;

    box-shadow:
        0 7px 22px rgba(80,55,75,.09);
}

/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom{
    position:fixed;

    left:0 !important;
    right:0 !important;
    bottom:0 !important;

    width:100vw !important;
    min-width:100vw !important;
    max-width:none !important;

    height:

    padding:

        3px
        env(safe-area-inset-bottom);

    z-index:1000;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    background:
        rgba(255,255,255,.99);

    border-top:

    box-shadow:
        0 -6px 22px rgba(80,55,75,.09);
}

.nav{
    width:100% !important;

    min-width:0;

    padding:0;

    background:none;

    color:#8a8490;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:1px;

    font-size:8px;
    font-weight:800;
}

.nav-pill{
    width:38px;
    height:32px;

    border-radius:18px;

    display:grid;
    place-items:center;
}

.nav-icon{
    font-size:18px;
}

.nav.active{
    color:#dc5790;
}

.nav.active .nav-pill{
    background:#f9dce8;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-bg{
    position:fixed;

    inset:0;

    width:100vw !important;
    height:100vh !important;

    z-index:5000;

    background:
        rgba(36,29,45,.42);

    display:flex;
    align-items:flex-end;
}

.modal{
    width:100% !important;
    max-width:none !important;

    max-height:92vh;

    overflow:auto;

    background:#fffafd;

    border-radius:
        27px
        27px
        0
        0;

    padding:
        20px
        16px

    margin:0 !important;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:13px;
}

.modal-title{
    margin:0;

    font-size:21px;
    font-weight:900;
}

.close{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#f0e8ef;

    font-size:23px;
}

.field{
    margin:10px 0;
}

.label{
    display:block;

    margin-bottom:5px;

    color:#77707b;

    font-size:11px;
    font-weight:800;
}

.control{
    width:100% !important;

    min-height:45px;

    padding:9px 11px;

    border:
        1px solid #ddd5df;

    border-radius:13px;

    background:white;

    color:#34303a;

    font-size:14px;
}

.two{
    display:grid;

    grid-template-columns:

    gap:8px;
}

.list{
    width:100% !important;

    background:#fff;

    border-radius:17px;

    padding:12px;

    margin:7px 0;

    box-shadow:
        0 5px 17px rgba(80,55,75,.07);
}

.list-top{
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.edit{
    padding:7px 9px;

    height:max-content;

    border-radius:9px;

    background:#f1e5ed;

    color:#ad5278;

    font-size:10px;
    font-weight:900;
}

.danger{
    width:100%;

    margin-top:8px;

    padding:11px;

    border-radius:13px;

    background:#ffe5ec;

    color:#b4476c;

    font-size:12px;
    font-weight:900;
}

.setting{
    width:100%;

    background:
        linear-gradient(
            135deg,
            #fff0f6,
            #f0eafa
        );

    border-radius:18px;

    padding:14px;

    margin:8px 0;
}

.setting-title{
    font-size:15px;
    font-weight:900;
}

.setting-text{
    margin-top:4px;

    font-size:11px;

    line-height:1.45;

    color:#827984;
}

.zoom{
    width:100%;

    accent-color:#dc6797;

    margin:11px 0;
}

/* =========================================================
   IPHONE WIDTH PROTECTION
   ========================================================= */

@media screen and (max-width:600px){

    html,
    body{
        width:100vw !important;
        min-width:100vw !important;
        max-width:100vw !important;

        margin:0 !important;
        padding:0 !important;
    }

    #app{
        width:100vw !important;
        min-width:100vw !important;
        max-width:100vw !important;

        margin:0 !important;

    }

    .header,
    .content,
    .bottom{
        width:100vw !important;

        max-width:100vw !important;
    }

    .content{
        padding-left:13px !important;
        padding-right:13px !important;
    }
}

/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media screen and (max-width:370px){

    .brand-title{
        font-size:18px;
    }

    .brand-subtitle{

    }

    .logo{
        width:53px !important;
        height:53px !important;

    }

        font-size:16px;
    }

    }

</style>
</head>

<body>

<div id="app"></div>

<script>

const KEY =
    "pure_shine_cleaning_manager_fullscreen_v3";

const defaultClients = [

    {
        id:"lottie",
        name:"Lottie",
        type:"Agency",
        rate:16,
        day:"Monday",
        start:"13:00",
        end:"15:00",
        frequency:"Weekly"
    },

    {
        id:"christine",
        name:"Christine",
        type:"Private",
        rate:18,
        day:"Tuesday",
        start:"09:30",
        end:"12:30",
        frequency:"Fortnightly"
    },

    {
        id:"matt",
        name:"Matt",
        type:"Agency",
        rate:16,
        day:"Tuesday",
        start:"13:00",
        end:"17:00",
        frequency:"Weekly"
    },

    {
        id:"sonia",
        name:"Sonia",
        type:"Agency",
        rate:16,
        day:"Wednesday",
        start:"09:00",
        end:"14:00",
        frequency:"Weekly"
    },

    {
        id:"laura",
        name:"Laura",
        type:"Private",
        rate:18,
        day:"Thursday",
        start:"09:00",
        end:"13:00",
        frequency:"Weekly"
    },

    {
        id:"hannah",
        name:"Hannah",
        type:"Agency",
        rate:16,
        day:"Thursday",
        start:"13:00",
        end:"16:00",
        frequency:"Weekly"
    },

    {
        id:"meghan",
        name:"Meghan",
        type:"Private",
        rate:18,
        day:"",
        start:"",
        end:"",
        frequency:"Occasional"
    },

    {
        id:"joanna",
        name:"Joanna",
        type:"Private",
        rate:18,
        day:"Friday",
        start:"09:30",
        end:"13:30",
        frequency:"Fortnightly"
    },

    {
        id:"sindu",
        name:"Sindu",
        type:"Agency",
        rate:16,
        day:"Friday",
        start:"09:30",
        end:"12:30",
        frequency:"Fortnightly"
    },

    {
        id:"peter",
        name:"Peter",
        type:"Private",
        rate:18,
        day:"",
        start:"",
        end:"",
        frequency:"Occasional"
    },

    {
        id:"mike",
        name:"Mike",
        type:"Agency",
        rate:16,
        day:"",
        start:"",
        end:"",
        frequency:"Every 3 weeks"
    }

];

let data =
    JSON.parse(
        localStorage.getItem(KEY) || "null"
    )
    ||
    {
        clients:structuredClone(defaultClients),
        jobs:[],
        timer:null
    };

data.clients =
    data.clients.filter(
        c =>
            String(c.name).toLowerCase() !== "gill"
    );

function save(){

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );

}

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            m => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[m])
        );

}

function money(value){

    return "£" +
        Number(value || 0)
        .toFixed(2);

}

function today(){

    const d =
        new Date();

    return d
        .toISOString()
        .slice(0,10);

}

function currentDay(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {
                weekday:"long"
            }
        );

}

function getClient(id){

    return data.clients.find(
        c => c.id === id
    );

}

function timeMinutes(time){

    if(!time) return 0;

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60
    ) +
        Number(parts[1]);

}

function duration(start,end){

    return Math.max(
        0,
        (
            timeMinutes(end) -
            timeMinutes(start)
        ) / 60
    );

}

function todayClients(){

    return data.clients
        .filter(
            c =>
                c.day === currentDay() &&
                c.start &&
                c.end
        )
        .sort(
            (a,b) =>
                timeMinutes(a.start) -
                timeMinutes(b.start)
        );

}

let page = "home";

function render(){

    const app =
        document.getElementById("app");

    app.innerHTML = `

        <header class="header">

            <div class="brand">

                <img
                    class="logo"
                    src="icon(2).png"
                    alt="Pure Shine Cleaning Manager"
                >

                <div>

                    <div class="brand-title">
                        Cleaning Manager
                    </div>

                    <div class="brand-subtitle">
                        Your cleaning business ✨
                    </div>

                </div>

            </div>

            <button
                class="settings-btn"
                onclick="openSettings()"
            >
                ⚙️
            </button>

        </header>

        <main class="content">

            ${
                page === "home"
                    ? homePage()
                    : page === "schedule"
                    ? schedulePage()
                    : page === "clients"
                    ? clientsPage()
                    : page === "timer"
                    ? timerPage()
                    : earningsPage()
            }

        </main>

        <nav class="bottom">

            ${nav("home","⌂","Home")}

            ${nav("schedule","▣","Schedule")}

            ${nav("clients","♣","Clients")}

            ${nav("timer","◷","Free time")}

            ${nav("earnings","▤","Earnings")}

        </nav>
    `;

}

function nav(
    target,
    icon,
    label
){

    return `

        <button
            class="nav ${
                page === target
                    ? "active"
                    : ""
            }"
            onclick="go('${target}')"
        >

            <span class="nav-pill">

                <span class="nav-icon">
                    ${icon}
                </span>

            </span>

            ${label}

        </button>
    `;

}

function homePage(){

    const clients =
        todayClients();

    const jobs =
        data.jobs.filter(
            j => j.date === today()
        );

    const totalHours =
        jobs.reduce(
            (sum,j) =>
                sum + Number(j.hours || 0),
            0
        );

    const totalEarned =
        jobs.reduce(
            (sum,j) =>
                sum + Number(j.price || 0),
            0
        );

    const available =
        clients.reduce(
            (sum,c) =>
                sum +
                duration(
                    c.start,
                    c.end
                ),
            0
        );

    let html = `

        <section class="date-card">

            <div>

                <div class="date-main">

                    ${
                        new Date()
                        .toLocaleDateString(
                            "en-GB",
                            {
                                weekday:"long",
                                day:"numeric",
                                month:"long"
                            }
                        )
                    }

                </div>

                <div class="date-sub">
                    Let's make today productive 🌸
                </div>

            </div>

            <div class="sparkles">
                ♡
            </div>

        </section>

        <section class="quote-banner">

            <div class="quote-text">

                ♡ A clean space<br>
                is a happy place ♡

            </div>

        </section>

        <section class="stats">

            <div class="stat">

                <div class="stat-icon">
                    🧹
                </div>

function jobCard(c){

    const existing =
        data.jobs.find(
            j =>
                j.date === today() &&
                j.clientId === c.id
        );

    const h =
        existing
            ? Number(existing.hours)
            : duration(
                c.start,
                c.end
            );

    const running =
        data.timer &&
        data.timer.clientId === c.id;

    return `

        <div class="job">

            <div class="job-line"></div>

            <div>

                <div class="job-name">
                    ${esc(c.name)}
                </div>

                <div class="job-time">
                    ${c.start}–${c.end}
                    · ${h.toFixed(2)}h
                    · £${c.rate}/h
                </div>

            </div>

            <div class="job-right">

                <div class="job-price">
                    ${money(h * c.rate)}
                </div>

                <div class="job-buttons">

                    <button
                        class="mini"
                        onclick="${
                            running
                                ? "stopTimer()"
                                : `startTimer('${c.id}')`
                        }"
                    >
                        ${
                            running
                                ? "■"
                                : "◷"
                        }
                    </button>

                    <button
                        class="mini pink"
                        onclick="clientForm('${c.id}')"
                    >
                        ✎
                    </button>

                </div>

            </div>

        </div>
    `;

}

function schedulePage(){

    let html = `

        <div class="section-head">

            <h2 class="section-title">
                Weekly Schedule
            </h2>

            <button
                class="see-all"
                onclick="jobForm()"
            >
                ＋ Job
            </button>

        </div>

    `;

    [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
    ].forEach(
        day => {

            const clients =
                data.clients
                    .filter(
                        c =>
                            c.day === day &&
                            c.start &&
                            c.end
                    )
                    .sort(
                        (a,b) =>
                            timeMinutes(a.start) -
                            timeMinutes(b.start)
                    );

            if(!clients.length)
                return;

            html += `

                <section class="section">

                    <h2
                        class="section-title"
                        style="font-size:16px;margin-bottom:7px"
                    >
                        ${day}
                    </h2>

            `;

            clients.forEach(
                c =>
                    html +=
                        jobCard(c)
            );

            html += `
                </section>
            `;

        }
    );

    return html;

function openModal(content){

    const background =
        document.createElement("div");

    background.id = "modal";
    background.className = "modal-bg";

    background.onclick =
        () => background.remove();

    const modal =
        document.createElement("div");

    modal.className = "modal";

    modal.onclick =
        e => e.stopPropagation();

    modal.innerHTML = content;

    background.appendChild(modal);

    document.body.appendChild(
        background
    );

}

function closeModal(){

    const modal =
        document.getElementById("modal");

    if(modal)
        modal.remove();

}

function saveClient(id){

    const name =
        document
            .getElementById("clientName")
            .value
            .trim();

    if(
        !name ||
        name.toLowerCase() === "gill"
    ){

        alert(
            "Please enter a valid client name."
        );

        return;
    }

    const c = {

        id:
            id ||
            "client_" +
            Date.now(),

        name:name,

        type:
            document
                .getElementById("clientType")
                .value,

        rate:
            Number(
                document
                    .getElementById("clientRate")
                    .value || 16
            ),

        day:
            document
                .getElementById("clientDay")
                .value,

        frequency:
            document
                .getElementById("clientFrequency")
                .value,

        start:
            document
                .getElementById("clientStart")
                .value,

        end:
            document
                .getElementById("clientEnd")
                .value

    };

    if(id){

        data.clients =
            data.clients.map(
                old =>
                    old.id === id
                        ? c
                        : old
            );

    }else{

        data.clients.push(c);

    }

    save();

    closeModal();

    render();

}

function deleteClient(id){

    if(
        !confirm(
            "Delete this client?"
        )
    )
        return;

    data.clients =
        data.clients.filter(
            c => c.id !== id
        );

    data.jobs =
        data.jobs.filter(
            j => j.clientId !== id
        );

    save();

    closeModal();

    render();

}

function saveJob(id){

    const c =
        getClient(
            document
                .getElementById("jobClient")
                .value
        );

    const start =
        document
            .getElementById("jobStart")
            .value;

    const end =
        document
            .getElementById("jobEnd")
            .value;

    const entered =
        Number(
            document
                .getElementById("jobHours")
                .value || 0
        );

    const h =
        entered ||
        duration(start,end);

    const job = {

        id:
            id ||
            "job_" +
            Date.now(),

        clientId:c.id,

        clientName:c.name,

        rate:c.rate,

        date:
            document
                .getElementById("jobDate")
                .value,

        start:start,

        end:end,

        hours:h,

        price:h * c.rate,

        status:
            document
                .getElementById("jobStatus")
                .value

    };

    if(id){

        data.jobs =
            data.jobs.map(
                j =>
                    j.id === id
                        ? job
                        : j
            );

    }else{

        data.jobs.push(job);

    }

    save();

    closeModal();

    render();

}

function deleteJob(id){

    if(
        !confirm(
            "Delete this job?"
        )
    )
        return;

    data.jobs =
        data.jobs.filter(
            j => j.id !== id
        );

    save();

    closeModal();

    render();

}

function startTimer(id){

    if(data.timer)
        stopTimer();

    data.timer = {

        clientId:id,

        startedAt:
            Date.now()

    };

    save();

    render();

}

function stopTimer(){

    if(!data.timer)
        return;

    const c =
        getClient(
            data.timer.clientId
        );

    if(!c){

        data.timer = null;

        save();

        render();

        return;
    }

    const elapsed =
        (
            Date.now() -
            data.timer.startedAt
        ) / 3600000;

    let job =
        data.jobs.find(
            j =>
                j.date === today() &&
                j.clientId === c.id
        );

    if(!job){

        job = {

            id:
                "job_" +
                Date.now(),

            clientId:c.id,

            clientName:c.name,

            rate:c.rate,

            date:today(),

            start:c.start || "",

            end:c.end || "",

            hours:0,

            price:0,

            status:"Paid"

        };

        data.jobs.push(job);

    }

    job.hours =
        Number(job.hours || 0) +
        elapsed;

    job.price =
        job.hours *
        c.rate;

    data.timer = null;

    save();

    render();

}

save();

/*
   Keep the timer accurate when Safari is backgrounded.
   The timer is calculated from the real timestamp,
   not from setInterval().
*/

setInterval(
    () => {

        if(
            data.timer &&
            page === "timer"
        ){

            render();

        }

    },
    1000
);
