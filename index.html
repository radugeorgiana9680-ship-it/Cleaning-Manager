<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8dce8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Cleaning Manager</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f8dce8;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
    color:#24222a;
}

body{
    overflow-x:hidden;
}

/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    background:#fffafd;
    padding:
        env(safe-area-inset-top)
        0
        calc(92px + env(safe-area-inset-bottom));
}

/* =========================================================
   HEADER
========================================================= */

.header{
    width:100%;
    padding:22px 24px 17px;
    background:#fffafd;
}

.header-inner{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:62px;
    height:62px;
    border-radius:19px;
    object-fit:cover;
    background:
        linear-gradient(145deg,#fff,#f8d5e4);
    border:1px solid #e8b6cb;
    box-shadow:0 5px 16px rgba(180,105,139,.15);
}

.brand-text h1{
    margin:0;
    font-size:25px;
    line-height:1;
    font-weight:900;
    letter-spacing:-1px;
}

.brand-text p{
    margin:7px 0 0;
    color:#85808a;
    font-size:14px;
}

.settings{
    width:54px;
    height:54px;
    border-radius:50%;
    border:none;
    background:#fff;
    box-shadow:0 7px 22px rgba(80,55,75,.12);
    font-size:25px;
}

/* =========================================================
   DATE
========================================================= */

.date-card{
    margin:0 24px;
    min-height:105px;
    border-radius:28px;
    background:#f5d1e0;
    padding:19px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.date-title{
    font-size:22px;
    font-weight:900;
    letter-spacing:-.5px;
}

.date-subtitle{
    margin-top:7px;
    font-size:14px;
    color:#827783;
}

.date-heart{
    font-size:49px;
    line-height:1;
    color:#d2578b;
    font-weight:300;
}

/* =========================================================
   FLOWER + CLEANING BANNER
========================================================= */

.quote-banner{
    position:relative;
    height:158px;
    margin:17px 24px 21px;
    border-radius:27px;
    overflow:hidden;

    background-image:
        linear-gradient(
            90deg,
            rgba(248,213,227,.94) 0%,
            rgba(248,213,227,.78) 42%,
            rgba(248,213,227,.25) 100%
        ),
        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1600&q=90");

    background-size:cover;
    background-position:center;
}

.quote-banner:before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle at 7% 23%,white 0 2px,transparent 2.5px),
        radial-gradient(circle at 13% 72%,white 0 1.5px,transparent 2px),
        radial-gradient(circle at 22% 30%,white 0 2px,transparent 2.5px),
        radial-gradient(circle at 84% 20%,white 0 1.5px,transparent 2px),
        radial-gradient(circle at 91% 73%,white 0 2px,transparent 2.5px),
        radial-gradient(circle at 76% 81%,white 0 1.5px,transparent 2px);

    opacity:.95;
}

.quote-banner:after{
    content:"✦   ✧       ✦        ✧";
    position:absolute;
    top:18px;
    left:24px;
    color:#fff;
    font-size:15px;
    letter-spacing:8px;
}

.quote{
    position:absolute;
    z-index:2;
    left:14%;
    right:14%;
    top:50%;
    transform:translateY(-50%);
    text-align:center;

    color:#a34e78;
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:30px;
    line-height:1.16;

    text-shadow:
        0 1px 2px rgba(255,255,255,.8);
}

.quote .heart{
    font-family:Arial,sans-serif;
    font-size:38px;
    font-weight:300;
}

/* =========================================================
   STATISTICS
========================================================= */

.stats{
    margin:0 24px 28px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.stat{
    height:137px;
    border-radius:25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
}

.stat:nth-child(1){
    background:#f6d4e2;
}

.stat:nth-child(2){
    background:#dceafb;
}

.stat:nth-child(3){
    background:#dcefe5;
}

.stat:nth-child(4){
    background:#fff0c8;
}

.stat:after{
    content:"✦";
    position:absolute;
    right:12px;
    top:12px;
    font-size:12px;
    opacity:.6;
}

.stat-icon{
    font-size:22px;
    margin-bottom:6px;
}

.stat-value{
    font-size:24px;
    font-weight:900;
    line-height:1.1;
}

.stat-label{
    margin-top:6px;
    font-size:13px;
}

/* =========================================================
   TODAY'S SCHEDULE
========================================================= */

.schedule-section{
    margin:0 24px;
}

.schedule-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.schedule-heading h2{
    margin:0;
    font-size:23px;
    font-weight:900;
    letter-spacing:-.7px;
}

.see-all{
    border:none;
    background:none;
    color:#bd4d7d;
    font-size:15px;
    font-weight:900;
}

.schedule-box{
    min-height:316px;
    border-radius:27px;
    background:#fff;
    box-shadow:0 7px 26px rgba(80,60,75,.07);
    padding:18px;
}

.empty-schedule{
    min-height:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.empty-heart{
    color:#df5c95;
    font-size:61px;
    line-height:1;
    margin-bottom:16px;
}

.empty-title{
    font-size:18px;
    font-weight:900;
}

.empty-subtitle{
    color:#817782;
    font-size:14px;
    margin:7px 0 21px;
}

.add-job{
    width:100%;
    height:57px;
    border:none;
    border-radius:30px;
    background:linear-gradient(
        135deg,
        #ed75a6,
        #dc4282
    );
    color:#fff;
    font-size:17px;
    font-weight:900;
}

/* =========================================================
   REAL JOBS
========================================================= */

.job{
    padding:15px;
    border-radius:20px;
    margin-bottom:10px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
}

.job:nth-child(1){background:#f9dce8}
.job:nth-child(2){background:#deebfa}
.job:nth-child(3){background:#dff0e7}
.job:nth-child(4){background:#fff0ca}

.job-name{
    font-size:18px;
    font-weight:900;
}

.job-details{
    margin-top:5px;
    color:#766e78;
    font-size:13px;
}

.job-money{
    font-size:18px;
    font-weight:900;
    text-align:right;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;
    z-index:100;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    min-height:88px;

    padding:
        7px 9px
        calc(7px + env(safe-area-inset-bottom));

    background:rgba(255,255,255,.98);
    border-top:1px solid #eee3e8;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    box-shadow:0 -5px 25px rgba(70,50,65,.08);
}

.nav-button{
    border:none;
    background:none;
    color:#8d8790;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;

    font-size:12px;
    font-weight:700;
}

.nav-icon{
    width:49px;
    height:40px;
    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
}

.nav-button.active{
    color:#df5790;
}

.nav-button.active .nav-icon{
    background:#f9dce8;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    z-index:1000;
    inset:0;
    background:rgba(40,30,40,.4);
    display:none;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-height:92vh;
    overflow:auto;
    background:#fffafd;
    border-radius:30px 30px 0 0;
    padding:22px 20px calc(25px + env(safe-area-inset-bottom));
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modal-header h2{
    margin:0;
    font-size:23px;
}

.close{
    width:43px;
    height:43px;
    border:none;
    border-radius:50%;
    background:#f4e5ed;
    color:#a95177;
    font-size:25px;
}

.form-label{
    display:block;
    font-size:14px;
    font-weight:800;
    margin:13px 0 6px;
}

.input,
select{
    width:100%;
    min-height:48px;
    border:2px solid #eee0e8;
    border-radius:15px;
    background:#fff;
    padding:10px 13px;
    font-size:16px;
    outline:none;
}

.save{
    width:100%;
    min-height:53px;
    margin-top:17px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#eb82ac,#d95e91);
    color:#fff;
    font-weight:900;
    font-size:16px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:500px){

    .header{
        padding-left:20px;
        padding-right:20px;
    }

    .date-card{
        margin-left:20px;
        margin-right:20px;
    }

    .quote-banner{
        margin-left:20px;
        margin-right:20px;
    }

    .stats{
        margin-left:20px;
        margin-right:20px;
        gap:8px;
    }

    .schedule-section{
        margin-left:20px;
        margin-right:20px;
    }

    .brand-text h1{
        font-size:21px;
    }

    .brand-text p{
        font-size:13px;
    }

    .logo{
        width:57px;
        height:57px;
    }

    .settings{
        width:49px;
        height:49px;
        font-size:22px;
    }

    .date-title{
        font-size:19px;
    }

    .date-subtitle{
        font-size:13px;
    }

    .quote-banner{
        height:151px;
    }

    .quote{
        font-size:27px;
    }

    .stat{
        height:128px;
        border-radius:22px;
    }

    .stat-value{
        font-size:20px;
    }

    .stat-label{
        font-size:11px;
    }

    .stat-icon{
        font-size:19px;
    }

    .schedule-heading h2{
        font-size:21px;
    }

    .schedule-box{
        min-height:310px;
    }
}

@media(max-width:370px){

    .stats{
        gap:5px;
    }

    .stat{
        height:120px;
    }

    .stat-value{
        font-size:18px;
    }

    .stat-label{
        font-size:10px;
    }

    .quote{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="header-inner">

            <div class="brand">

                <img
                    class="logo"
                    src="icon.png"
                    alt="Pure Shine Cleaning"
                    onerror="this.style.display='none'"
                >

                <div class="brand-text">

                    <h1>
                        Cleaning Manager
                    </h1>

                    <p>
                        Your cleaning business ✨
                    </p>

                </div>

            </div>

            <button
                class="settings"
                onclick="openSettings()"
                aria-label="Settings"
            >
                ⚙️
            </button>

        </div>

    </header>


    <!-- DATE -->
    <section class="date-card">

        <div>

            <div
                class="date-title"
                id="date"
            >
                Sunday 27 September
            </div>

            <div class="date-subtitle">
                Let's make today productive 🌸
            </div>

        </div>

        <div class="date-heart">
            ♡
        </div>

    </section>


    <!-- FLOWERS + CLEANING IMAGE + QUOTE -->
    <section class="quote-banner">

        <div class="quote">

            <span class="heart">♡</span>

            A clean space<br>

            is a happy place

            <span class="heart">♡</span>

        </div>

    </section>


    <!-- STATS -->
    <section class="stats">

        <div class="stat">

            <div class="stat-icon">
                💼
            </div>

            <div

                id="jobs"
            >
                0
            </div>

            <div class="stat-label">
                Jobs
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ◷
            </div>

            <div
                class="stat-value"
                id="hours"
            >
                0h 0m
            </div>

            <div class="stat-label">
                Hours
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                🌐
            </div>

            <div
                class="stat-value"
                id="earned"
            >
                £0
            </div>

            <div class="stat-label">
                Earned
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ☼
            </div>

            <div
                class="stat-value"
                id="available"
            >
                8h 0m
            </div>

            <div class="stat-label">
                Available
            </div>

        </div>

    </section>


    <!-- TODAY'S SCHEDULE -->
    <section class="schedule-section">

        <div class="schedule-heading">

            <h2>
                Today's schedule
            </h2>

            <button
                class="see-all"
                onclick="showSchedule()"
            >

            </button>

        <div

            id="schedule"

            <div class="empty-schedule">

                </div>

                    Add one with the + button.
                </div>

                <button
                    class="add-job"
                    onclick="addJob()"
                >
                    ＋ &nbsp;Add cleaning job
                </button>

            </div>

        </div>

    </section>

</div>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <button
        class="nav-button active"
        onclick="goHome()"
    >
        <span class="nav-icon">
            ⌂
        </span>
        Home
    </button>


    <button
        class="nav-button"
        onclick="showSchedule()"
    >
        <span class="nav-icon">
            📅
        </span>
        Schedule
    </button>


    <button
        class="nav-button"
        onclick="showClients()"
    >
        <span class="nav-icon">
            ♣
        </span>
        Clients
    </button>


    <button
        class="nav-button"
        onclick="showFreeTime()"
    >
        <span class="nav-icon">
            ◷
        </span>
        Free time
    </button>


    <button
        class="nav-button"
        onclick="showEarnings()"
    >
        <span class="nav-icon">
            ▥
        </span>
        Earnings
    </button>

</nav>


<!-- MODAL -->
<div
    class="modal"
    id="modal"
    onclick="closeOutside(event)"
>

    <div
        class="modal-content"
        id="modalContent"
    ></div>

</div>


<script>

/* =========================================================
   DATE
========================================================= */

function updateDate(){

    const now = new Date();

    document.getElementById("date").textContent =
        now.toLocaleDateString(
            "en-GB",
            {
                weekday:"long",
                day:"numeric",
                month:"long"
            }
        );

}

updateDate();


/* =========================================================
   DATA
========================================================= */

let clients = [
    {
        name:"Lottie",
        type:"Agency",
        rate:16,
        day:"Monday",
        time:"13:00–15:00"
    },
    {
        name:"Christine",
        type:"Private",
        rate:18,
        day:"Tuesday",
        time:"09:30–12:30"
    },
    {
        name:"Matt",
        type:"Agency",
        rate:16,
        day:"Tuesday",
        time:"13:00–17:00"
    },
    {
        name:"Sonia",
        type:"Agency",
        rate:16,
        day:"Wednesday",
        time:"09:00–14:00"
    },
    {
        name:"Laura",
        type:"Private",
        rate:18,
        day:"Thursday",
        time:"09:00–13:00"
    },
    {
        name:"Hannah",
        type:"Agency",
        rate:16,
        day:"Thursday",
        time:"13:00–16:00"
    },
    {
        name:"Joanna",
        type:"Private",
        rate:18,
        day:"Friday",
        time:"09:30–13:30"
    },
    {
        name:"Sindu",
        type:"Agency",
        rate:16,
        day:"Friday",
        time:"09:30–12:30"
    },
    {
        name:"Meghan",
        type:"Private",
        rate:18,
        day:"Occasional",
        time:""
    },
    {
        name:"Peter",
        type:"Private",
        rate:18,
        day:"Occasional",
        time:""
    },
    {
        name:"Mike",
        type:"Agency",
        rate:16,
        day:"Every 3 weeks",
        time:"2h"
    }
];

let jobs = [];


/* =========================================================
   MODAL
========================================================= */

function openModal(content){

    document.getElementById("modalContent").innerHTML = content;

    document.getElementById("modal").classList.add("show");

}

function closeModal(){

    document.getElementById("modal").classList.remove("show");

}

function closeOutside(event){

    if(event.target.id === "modal"){
        closeModal();
    }

}


/* =========================================================
   ADD JOB
========================================================= */

function addJob(){

    openModal(`

        <div class="modal-header">

            <h2>
                Add cleaning job
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <label class="form-label">
            Client
        </label>

        <select
            id="clientSelect"
        >

            ${clients.map(c=>`
                <option value="${c.name}">
                    ${c.name} — £${c.rate}/h
                </option>
            `).join("")}

        </select>

        <label class="form-label">
            Date
        </label>

        <input
            class="input"
            type="date"
            id="jobDate"
        >

        <label class="form-label">
            Start time
        </label>

        <input
            class="input"
            type="time"
            id="jobStart"
            value="09:00"
        >

        <label class="form-label">
            End time
        </label>

        <input
            class="input"
            type="time"
            id="jobEnd"
            value="12:00"
        >

        <button
            class="save"
            onclick="saveJob()"
        >
            Save cleaning job
        </button>

    `);

}


function saveJob(){

    const name =
        document.getElementById("clientSelect").value;

    const client =
        clients.find(c=>c.name===name);

    const date =
        document.getElementById("jobDate").value;

    const start =
        document.getElementById("jobStart").value;

    const end =
        document.getElementById("jobEnd").value;

    if(!date || !start || !end){
        alert("Please complete the job details.");
        return;
    }

    const [sh,sm] =
        start.split(":").map(Number);

    const [eh,em] =
        end.split(":").map(Number);

    const minutes =
        Math.max(
            0,
            (eh*60+em)-(sh*60+sm)
        );

    jobs.push({
        name,
        date,
        start,
        end,
        hours:minutes/60,
        rate:client.rate
    });

    localStorage.setItem(
        "pureShineJobs",
        JSON.stringify(jobs)
    );

    closeModal();

    render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const today =
        new Date()
        .toISOString()
        .slice(0,10);

    const todaysJobs =
        jobs.filter(j=>j.date===today);

    document.getElementById("jobs").textContent =
        todaysJobs.length;

    let totalHours =
        todaysJobs.reduce(
            (sum,j)=>sum+j.hours,
            0
        );

    let totalEarned =
        todaysJobs.reduce(
            (sum,j)=>sum+(j.hours*j.rate),
            0
        );

    const h =
        Math.floor(totalHours);

    const m =
        Math.round(
            (totalHours-h)*60
        );

    document.getElementById("hours").textContent =
        `${h}h ${m}m`;

    document.getElementById("earned").textContent =
        `£${totalEarned.toFixed(0)}`;

    const available =
        Math.max(
            0,
            8-totalHours
        );

    const ah =
        Math.floor(available);

    const am =
        Math.round(
            (available-ah)*60
        );

    document.getElementById("available").textContent =
        `${ah}h ${am}m`;


    const schedule =
        document.getElementById("schedule");

    if(!todaysJobs.length){

        schedule.innerHTML = `

            <div class="empty-schedule">

                <div class="empty-heart">
                    ♡
                </div>

                <div class="empty-title">
                    No cleaning jobs today 🌸
                </div>

                <div class="empty-subtitle">
                    Add one with the + button.
                </div>

                <button
                    class="add-job"
                    onclick="addJob()"
                >
                    ＋ &nbsp;Add cleaning job
                </button>

            </div>

        `;

        return;

    }


    schedule.innerHTML =
        todaysJobs.map(
            j=>`

                <div class="job">

                    <div>

                        <div class="job-name">
                            ${j.name}
                        </div>

                        <div class="job-details">
                            ◷ ${j.start} – ${j.end}
                            · ${j.hours}h
                        </div>

                    </div>

                    <div class="job-money">
                        £${(j.hours*j.rate).toFixed(2)}
                    </div>

                </div>

            `
        ).join("");

}

try{

    jobs =
        JSON.parse(
            localStorage.getItem(
                "pureShineJobs"
            ) || "[]"
        );

}catch(e){

    jobs=[];

}

render();
