<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f7d5e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light-content">

<title>Pure Shine Cleaning Manager ✨</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f8f6fb;
  color:#303047;
}

body{
  overflow-x:hidden;
  overflow-y:auto;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  min-height:100vh;
  padding-bottom:100px;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  height:116px;
  padding:22px 38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #eeeaf2;
  backdrop-filter:blur(15px);
}

.brand{
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  width:76px;
  height:76px;
  border-radius:24px;
  background:#fff;
  box-shadow:0 6px 18px rgba(60,50,80,.10);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}

.brandText h1{
  margin:0;
  font-size:32px;
  font-weight:800;
  letter-spacing:-1px;
}

.brandText p{
  margin:3px 0 0;
  font-size:21px;
  color:#89869e;
}

.headerActions{
  display:flex;
  gap:12px;
}

.headerBtn{
  width:70px;
  height:70px;
  border-radius:25px;
  background:#f5b5d0;
  color:white;
  font-size:38px;
  box-shadow:0 10px 25px rgba(245,181,208,.35);
}

.timerHeaderBtn{
  background:#ddd0f7;
  font-size:31px;
}

/* =========================
   CONTENT
========================= */

.content{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:48px 38px 130px;
}

.greeting{
  font-size:58px;
  line-height:1;
  font-weight:800;
  letter-spacing:-2px;
  margin:0;
}

.dateText{
  margin-top:18px;
  color:#89869e;
  font-size:27px;
}

/* =========================
   DASHBOARD
========================= */

.cards{
  margin-top:48px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:26px;
}

.card{
  min-height:260px;
  padding:34px;
  border-radius:38px;
  position:relative;
}

.card.jobs{background:#fbe1ec}
.card.hours{background:#eee5fb}
.card.earned{background:#def3e8}
.card.available{background:#fff2cf}

.cardIcon{
  font-size:42px;
}

.cardLabel{
  margin-top:18px;
  color:#77758c;
  font-size:25px;
}

.cardValue{
  margin-top:8px;
  font-size:48px;
  font-weight:800;
  letter-spacing:-1px;
}

/* =========================
   SECTIONS
========================= */

.section{
  margin-top:48px;
}

.sectionHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.sectionTitle{
  margin:0;
  font-size:34px;
  font-weight:800;
}

.linkBtn{
  background:none;
  color:#b85f89;
  font-weight:700;
  font-size:21px;
}

/* =========================
   JOB CARDS
========================= */

.jobCard{
  background:white;
  border-radius:30px;
  padding:24px 26px;
  margin-bottom:18px;
  box-shadow:0 7px 25px rgba(60,50,80,.06);
  display:flex;
  align-items:center;
  gap:20px;
}

.jobAccent{
  width:13px;
  min-width:13px;
  height:82px;
  border-radius:20px;
  background:#edafd0;
}

.jobInfo{
  flex:1;
  min-width:0;
}

.jobName{
  font-size:26px;
  font-weight:800;
}

.jobTime{
  margin-top:5px;
  color:#77758c;
  font-size:20px;
}

.jobType{
  margin-top:4px;
  color:#858299;
  font-size:17px;
}

.jobMoney{
  font-size:27px;
  font-weight:800;
  white-space:nowrap;
}

/* =========================
   QUICK ACTIONS
========================= */

.quickGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.quickBtn{
  min-height:110px;
  border-radius:30px;
  padding:20px;
  text-align:left;
  font-weight:700;
  font-size:21px;
}

.quickBtn.pink{
  background:#fbe1ec;
  color:#5c3a4d;
}

.quickBtn.purple{
  background:#eee5fb;
  color:#50476a;
}

.quickIcon{
  display:block;
  font-size:35px;
  margin-bottom:7px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  height:91px;
  background:rgba(255,255,255,.97);
  border-top:1px solid #e8e4ec;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(16px);
}

.navBtn{
  background:none;
  color:#89869e;
  font-size:14px;
  font-weight:700;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
}

.navIcon{
  font-size:28px;
}

.navBtn.active{
  color:#b75d88;
}

/* =========================
   MODAL
========================= */

.modalOverlay{
  position:fixed;
  inset:0;
  z-index:200;
  background:rgba(38,34,55,.38);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}

.modal{
  width:100%;
  max-width:700px;
  max-height:92vh;
  overflow-y:auto;
  background:#faf8fc;
  border-radius:35px 35px 0 0;
  padding:30px 26px 45px;
  box-shadow:0 -10px 50px rgba(0,0,0,.18);
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.modalHead h2{
  margin:0;
  font-size:32px;
}

.close{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#eee9f3;
  font-size:28px;
  color:#55526b;
}

.formGroup{
  margin-bottom:18px;
}

.formGroup label{
  display:block;
  margin-bottom:8px;
  color:#77758c;
  font-size:16px;
  font-weight:700;
}

.formControl{
  width:100%;
  min-height:56px;
  border:1px solid #e3dfe9;
  border-radius:17px;
  background:white;
  padding:13px 16px;
  color:#303047;
  outline:none;
}

.formControl:focus{
  border-color:#e6a8c5;
  box-shadow:0 0 0 3px rgba(230,168,197,.16);
}

.twoCols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.pinkBtn{
  width:100%;
  min-height:57px;
  border-radius:18px;
  background:#ed9fc2;
  color:white;
  font-weight:800;
  font-size:18px;
  margin-top:8px;
  box-shadow:0 8px 20px rgba(237,159,194,.28);
}

.deleteBtn{
  width:100%;
  min-height:53px;
  border-radius:18px;
  background:#fff0f4;
  color:#c3486d;
  font-weight:800;
  margin-top:10px;
}

/* =========================
   TIMER
========================= */

.timerPanel{
  background:linear-gradient(135deg,#f9dce9,#e9ddfa);
  border-radius:30px;
  padding:26px;
  margin-bottom:25px;
}

.timerStatus{
  font-size:17px;
  color:#77758c;
  font-weight:700;
}

.timerTime{
  font-size:55px;
  font-weight:800;
  letter-spacing:2px;
  margin:8px 0 20px;
}

.timerClient{
  width:100%;
  margin-bottom:12px;
}

.timerButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.startTimer{
  background:#df9fbe;
}

.stopTimer{
  background:#7e718f;
}

.timerHint{
  margin-top:15px;
  color:#77758c;
  font-size:14px;
  line-height:1.4;
}

/* =========================
   JOBS SCREEN
========================= */

.searchBox{
  margin-bottom:18px;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:20px;
}

.filter{
  white-space:nowrap;
  border-radius:30px;
  background:#eeeaf3;
  padding:10px 16px;
  color:#6d6980;
  font-weight:700;
}

.filter.active{
  background:#f2b2ce;
  color:white;
}

.fullJob{
  background:white;
  border-radius:25px;
  padding:21px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(50,40,70,.06);
}

.fullJobTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.fullJobName{
  font-size:23px;
  font-weight:800;
}

.badge{
  display:inline-block;
  border-radius:20px;
  padding:6px 11px;
  font-size:12px;
  font-weight:800;
}

.badge.private{
  background:#fce3ed;
  color:#ad5b82;
}

.badge.agency{
  background:#e8e0f8;
  color:#6d5c91;
}

.fullJobDetails{
  color:#77758c;
  margin-top:8px;
  line-height:1.5;
}

.jobActions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.editBtn,
.smallDelete{
  flex:1;
  min-height:44px;
  border-radius:14px;
  font-weight:800;
}

.editBtn{
  background:#e6ddf8;
  color:#645687;
}

.smallDelete{
  background:#fff0f4;
  color:#c3486d;
}

/* =========================
   EARNINGS
========================= */

.earningsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.earningCard{
  padding:23px;
  border-radius:25px;
}

.earningCard.green{background:#def3e8}
.earningCard.blue{background:#e2ecfa}
.earningCard.pink{background:#fbe1ec}
.earningCard.purple{background:#eee5fb}

.earningLabel{
  color:#77758c;
}

.earningValue{
  font-size:29px;
  font-weight:800;
  margin-top:5px;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:50px 20px;
  color:#89869e;
}

.emptyIcon{
  font-size:50px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

  .header{
    height:95px;
    padding:15px 20px;
  }

  .logo{
    width:60px;
    height:60px;
    border-radius:20px;
  }

  .brand{
    gap:13px;
  }

  .brandText h1{
    font-size:25px;
  }

  .brandText p{
    font-size:16px;
  }

  .headerBtn{
    width:55px;
    height:55px;
    border-radius:20px;
    font-size:30px;
  }

  .timerHeaderBtn{
    font-size:24px;
  }

  .headerActions{
    gap:7px;
  }

  .content{
    padding:34px 20px 120px;
  }

  .greeting{
    font-size:43px;
  }

  .dateText{
    font-size:20px;
  }

  .cards{
    margin-top:30px;
    gap:14px;
  }

  .card{
    min-height:175px;
    padding:20px;
    border-radius:27px;
  }

  .cardIcon{
    font-size:28px;
  }

  .cardLabel{
    font-size:18px;
    margin-top:8px;
  }

  .cardValue{
    font-size:32px;
  }

  .section{
    margin-top:34px;
  }

  .sectionTitle{
    font-size:27px;
  }

  .jobCard{
    padding:18px;
    border-radius:23px;
  }

  .jobAccent{
    width:9px;
    min-width:9px;
  }

  .jobName{
    font-size:21px;
  }

  .jobTime{
    font-size:16px;
  }

  .jobType{
    font-size:14px;
  }

  .jobMoney{
    font-size:20px;
  }

  .quickGrid{
    gap:12px;
  }

  .quickBtn{
    min-height:95px;
    border-radius:22px;
    font-size:17px;
  }

  .quickIcon{
    font-size:28px;
  }

  .bottomNav{
    height:83px;
  }

  .navIcon{
    font-size:23px;
  }

  .navBtn{
    font-size:11px;
  }

  .timerTime{
    font-size:43px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =====================================================
   PURE SHINE CLEANING MANAGER
===================================================== */

const STORAGE_KEY = "pureShineCleaningManager_v4";

/* =========================
   DEFAULT DATA
========================= */

const defaultClients = [

  {
    id:1,
    name:"Lottie",
    type:"agency",
    rate:16,
    day:"Monday",
    start:"13:00",
    end:"15:00"
  },

  {
    id:2,
    name:"Christine",
    type:"private",
    rate:18,
    day:"Tuesday",
    start:"09:30",
    end:"12:30"
  },

  {
    id:3,
    name:"Matt",
    type:"agency",
    rate:16,
    day:"Tuesday",
    start:"13:30",
    end:"17:30"
  },

  {
    id:4,
    name:"Sonia",
    type:"agency",
    rate:16,
    day:"Wednesday",
    start:"09:00",
    end:"14:00"
  },

  {
    id:5,
    name:"Gill",
    type:"agency",
    rate:16,
    day:"Wednesday",
    start:"15:00",
    end:"18:00"
  },

  {
    id:6,
    name:"Laura",
    type:"private",
    rate:18,
    day:"Thursday",
    start:"09:00",
    end:"13:00"
  },

  {
    id:7,
    name:"Hannah",
    type:"agency",
    rate:16,
    day:"Thursday",
    start:"13:00",
    end:"16:00"
  }
];

const todayISO = new Date().toISOString().slice(0,10);

let data = loadData();

let activeScreen = "home";

let currentFilter = "All";

let timer = loadTimer();

/* =========================
   LOAD / SAVE
========================= */

function loadData(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    if(saved){

      return {

        clients:
          saved.clients ||
          defaultClients,

        jobs:
          saved.jobs ||
          []

      };

    }

  }catch(e){}

  return {

    clients:defaultClients,

    jobs:[]

  };

}

function saveData(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(data)

  );

}

/* =========================
   TIMER STORAGE
========================= */

function loadTimer(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("pureShineTimer_v4")
      );

    return saved || {

      running:false,

      clientId:null,

      startedAt:null,

      accumulated:0

    };

  }catch(e){

    return {

      running:false,

      clientId:null,

      startedAt:null,

      accumulated:0

    };

  }

}

function saveTimer(){

  localStorage.setItem(

    "pureShineTimer_v4",

    JSON.stringify(timer)

  );

}

/*
  IMPORTANT:
  The timer uses Date.now() instead of relying
  only on setInterval.

  Therefore if iPhone puts Safari/app in the
  background, when the user returns the elapsed
  time is calculated correctly.
*/

function getTimerSeconds(){

  if(!timer.running){

    return timer.accumulated || 0;

  }

  return (

    timer.accumulated +

    Math.floor(
      (Date.now()-timer.startedAt)/1000
    )

  );

}

function formatTimer(seconds){

  seconds=Math.max(0,seconds);

  const h =
    Math.floor(seconds/3600);

  const m =
    Math.floor((seconds%3600)/60);

  const s =
    seconds%60;

  return [

    String(h).padStart(2,"0"),

    String(m).padStart(2,"0"),

    String(s).padStart(2,"0")

  ].join(":");

}

setInterval(()=>{

  const el =
    document.getElementById("liveTimer");

  if(el){

    el.textContent =
      formatTimer(
        getTimerSeconds()
      );

  }

},1000);

/* =========================
   DATE
========================= */

function niceDate(date){

  const d =
    new Date(date+"T12:00:00");

  return d.toLocaleDateString(
    "en-GB",
    {
      weekday:"long",
      day:"numeric",
      month:"long"
    }
  );

}

/* =========================
   TIME
========================= */

function minutes(time){

  const [h,m]=time.split(":").map(Number);

  return h*60+m;

}

function duration(start,end){

  return (

    minutes(end)-minutes(start)

  )/60;

}

function money(value){

  return "£"+Number(value||0).toFixed(2);

}

/* =========================
   RENDER APP
========================= */

function render(){

  const app =
    document.getElementById("app");

  app.innerHTML = `

    ${header()}

    <main class="content">

      ${

        activeScreen==="home"

        ? homeScreen()

        : activeScreen==="jobs"

        ? jobsScreen()

        : activeScreen==="earnings"

        ? earningsScreen()

        : activeScreen==="clients"

        ? clientsScreen()

        : scheduleScreen()

      }

    </main>

    ${bottomNavigation()}

  `;

}

/* =========================
   HEADER
========================= */

function header(){

  return `

    <header class="header">

      <div class="brand">

        <div class="logo">
          ✨
        </div>

        <div class="brandText">

          <h1>Pure Shine</h1>

          <p>Cleaning Manager ✨</p>

        </div>

      </div>

      <div class="headerActions">

        <button
          class="headerBtn timerHeaderBtn"
          onclick="openTimer()"
          title="Timer">

          ⏱️

        </button>

        <button
          class="headerBtn"
          onclick="addJob()">

          +

        </button>

      </div>

    </header>

  `;

}

/* =========================
   HOME
========================= */

function homeScreen(){

  const todayJobs =
    getTodaySchedule();

  const todayCompleted =
    data.jobs.filter(
      j=>j.date===todayISO
    );

  const hours =
    todayCompleted.reduce(
      (sum,j)=>sum+jobHours(j),
      0
    );

  const earned =
    todayCompleted.reduce(
      (sum,j)=>sum+Number(j.price||0),
      0
    );

  const scheduled =
    todayJobs.reduce(
      (sum,j)=>
        sum+
        duration(j.start,j.end),
      0
    );

  return `

    <h2 class="greeting">
      Good morning ✨
    </h2>

    <div class="dateText">
      ${niceDate(todayISO)}
    </div>

    <div class="cards">

      <div class="card jobs">

        <div class="cardIcon">🧹</div>

        <div class="cardLabel">
          Jobs
        </div>

        <div class="cardValue">
          ${todayCompleted.length}
        </div>

      </div>

      <div class="card hours">

        <div class="cardIcon">⏰</div>

        <div class="cardLabel">
          Hours
        </div>

        <div class="cardValue">
          ${hours.toFixed(1)}h
        </div>

      </div>

      <div class="card earned">

        <div class="cardIcon">💷</div>

        <div class="cardLabel">
          Earned
        </div>

        <div class="cardValue">
          ${money(earned)}
        </div>

      </div>

      <div class="card available">

        <div class="cardIcon">✨</div>

        <div class="cardLabel">
          Available
        </div>

        <div class="cardValue">
          ${scheduled.toFixed(1)}h
        </div>

      </div>

    </div>

    <section class="section">

      <div class="sectionHeader">

        <h2 class="sectionTitle">
          Today's schedule
        </h2>

        <button
          class="linkBtn"
          onclick="showScreen('schedule')">

          View all

        </button>

      </div>

      ${
        todayJobs.length

        ? todayJobs
            .map(scheduleCard)
            .join("")

        : `

          <div class="empty">

            <div class="emptyIcon">
              ✨
            </div>

            No cleaning scheduled today.

          </div>

        `
      }

    </section>

    <section class="section">

      <div class="sectionHeader">

        <h2 class="sectionTitle">
          Quick actions
        </h2>

      </div>

      <div class="quickGrid">

        <button
          class="quickBtn pink"
          onclick="openTimer()">

          <span class="quickIcon">
            ⏱️
          </span>

          Start Timer

        </button>

        <button
          class="quickBtn purple"
          onclick="addJob()">

          <span class="quickIcon">
            ➕
          </span>

          Add Cleaning Job

        </button>

        <button
          class="quickBtn purple"
          onclick="showScreen('jobs')">

          <span class="quickIcon">
            📋
          </span>

          View Jobs

        </button>

        <button
          class="quickBtn pink"
          onclick="showScreen('earnings')">

          <span class="quickIcon">
            💷
          </span>

          Earnings

        </button>

      </div>

    </section>

  `;

}

/* =========================
   TODAY SCHEDULE
========================= */

function getTodaySchedule(){

  const day =
    new Date(
      todayISO+"T12:00:00"
    ).toLocaleDateString(
      "en-GB",
      {weekday:"long"}
    );

  return data.clients
    .filter(c=>c.day===day)
    .sort(
      (a,b)=>
        minutes(a.start)-minutes(b.start)
    );

}

function scheduleCard(c){

  const hrs =

/* =========================
   SAVE JOB
========================= */

function saveJob(id){

  const clientId =
    Number(
      document.getElementById(
        "jobClient"
      ).value
    );

  const date =
    document.getElementById(
      "jobDate"
    ).value;

  const start =
    document.getElementById(
      "jobStart"
    ).value;

  const end =
    document.getElementById(
      "jobEnd"
    ).value;

  const status =
    document.getElementById(
      "jobStatus"
    ).value;

  if(
    !date ||
    !start ||
    !end ||
    minutes(end)<=minutes(start)
  ){

    alert(
      "Please enter a valid start and end time."
    );

    return;

  }

  const client =
    data.clients.find(
      c=>c.id===clientId
    );

  if(!client){

    alert("Please select a client.");

    return;

  }

  const hours =
    duration(start,end);

  const price =
    hours*Number(client.rate);

  if(id){

    const job =
      data.jobs.find(
        j=>j.id===id
      );

    if(job){

      job.clientId=clientId;
      job.date=date;
      job.start=start;
      job.end=end;
      job.price=price;
      job.status=status;

    }

  }else{

    data.jobs.push({

      id:Date.now(),

      clientId,

      date,

      start,

      end,

      price,

      status,

      timerSeconds:null

    });

  }

  saveData();

  closeModal();

  render();

}

/* =========================
   DELETE JOB
========================= */

function deleteJob(id){

  if(
    !confirm(
      "Delete this cleaning job?"
    )
  ){

    return;

  }

  data.jobs =
    data.jobs.filter(
      j=>j.id!==id
    );

  saveData();

  closeModal();

  render();

}

function openTimer(){

  const client =
    data.clients.find(
      c=>c.id===timer.clientId
    );

  showModal(`

    <div class="modalHead">

      <h2>
        Cleaning Timer ⏱️
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div class="timerPanel">

      <div class="timerStatus">

        ${
          timer.running
          ?"Timer running"
          :"Ready to start"
        }

      </div>

      <div
        id="liveTimer"
        class="timerTime">

        ${formatTimer(
          getTimerSeconds()
        )}

      </div>

      <select
        id="timerClient"
        class="formControl timerClient"
        ${
          timer.running
          ?"disabled":""
        }>

        <option value="">
          Select client
        </option>

        ${
          data.clients.map(c=>`

            <option
              value="${c.id}"
              ${
                timer.clientId===c.id
                ?"selected":""
              }>

              ${escapeHTML(c.name)}
              — ${money(c.rate)}/h

            </option>

          `).join("")
        }

      </select>

      <div class="timerButtons">

        ${
          timer.running

          ? `

            <button
              class="pinkBtn stopTimer"
              onclick="stopTimer()">

              ⏹ Stop Timer

            </button>

          `

          : `

            <button
              class="pinkBtn startTimer"
              onclick="startTimer()">

              ▶ Start Timer

            </button>

          `
        }

        <button
          class="pinkBtn"
          style="
            background:#fff;
            color:#806d8d;
            border:1px solid #ddd5e5;
          "
          onclick="resetTimer()">

          ↻ Reset

        </button>

      </div>

      <div class="timerHint">

        The timer uses the actual clock time,
        so it continues correctly when you leave
        the app or your iPhone puts Safari in the
        background. When you stop it, the job is
        automatically saved.

      </div>

    </div>

    ${
      client && timer.running
      ? `

        <div class="empty">

          Currently cleaning for
          <strong>
            ${escapeHTML(client.name)}
          </strong>.

        </div>

      `
      :""
    }

  `);

}

function startTimer(){

  if(timer.running)
    return;

  const select =
    document.getElementById(
      "timerClient"
    );

  const clientId =
    Number(select?.value);

  if(!clientId){

    alert(
      "Please select the client first."
    );

    return;

  }

  timer={

    running:true,

    clientId,

    startedAt:Date.now(),

    accumulated:0

  };

  saveTimer();

  openTimer();

}

function stopTimer(){

  if(!timer.running)
    return;

  const seconds =
    getTimerSeconds();

  const client =
    data.clients.find(
      c=>c.id===timer.clientId
    );

  if(!client){

    resetTimer();

    return;

  }

  /*
    Save timer duration based on actual
    elapsed seconds.
  */

  const hours =
    seconds/3600;

  const price =
    hours*Number(client.rate);

  const startDate =
    new Date(
      timer.startedAt
    );

  const endDate =
    new Date();

  const start =
    startDate.toLocaleTimeString(
      "en-GB",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  const end =
    endDate.toLocaleTimeString(
      "en-GB",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  data.jobs.push({

    id:Date.now(),

    clientId:client.id,

    date:new Date()
      .toISOString()
      .slice(0,10),

    start,

    end,

    price,

    status:"Paid",

    timerSeconds:seconds

  });

  saveData();

  timer={

    running:false,

    clientId:null,

    startedAt:null,

    accumulated:0

  };

  saveTimer();

  closeModal();

  render();

}

function resetTimer(){

  if(timer.running){

    if(
      !confirm(
        "Stop and reset the current timer?"
      )
    ){

      return;

    }

  }

  timer={

    running:false,

    clientId:null,

    startedAt:null,

    accumulated:0

  };

  saveTimer();

  openTimer();

}

      onclick="event.stopPropagation()">

      ${content}

    </div>

  `;

  overlay.onclick=
    function(e){

      if(e.target===overlay){

        closeModal();

      }

    };

  document.body.appendChild(
    overlay
  );

}

function closeModal(){

  const modal =
    document.getElementById(
      "modalOverlay"
    );

  if(modal){

    modal.remove();

  }

}

/* =========================
   SEARCH
========================= */

function setFilter(filter){

  currentFilter=filter;

  render();

}

function filterJobSearch(){

  const value =
    document.getElementById(
      "jobSearch"
    ).value
    .toLowerCase()
    .trim();

  document
    .querySelectorAll(
      "#jobsList .fullJob"
    )
    .forEach(card=>{

      card.style.display =
        card.dataset.search
          .includes(value)
          ? ""
          :"none";

    });

}

/* =========================
   HELPERS
========================= */

function jobHours(job){

  if(
    job.timerSeconds &&
    Number(job.timerSeconds)>0
  ){

    return Number(
      job.timerSeconds
    )/3600;

  }

  return duration(
    job.start,
    job.end
  );

}

function formatDisplayDate(date){

  return new Date(
    date+"T12:00:00"
  ).toLocaleDateString(
    "en-GB",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}

function capitalize(value){

  if(!value)
    return "";

  return value.charAt(0).toUpperCase()+
         value.slice(1);

}

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================
   BACKGROUND / RETURN
========================= */

/*
  When iPhone/Safari returns from background,
  force the timer display to update immediately.
*/

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      !document.hidden &&
      timer.running
    ){

      const el =
        document.getElementById(
          "liveTimer"
        );

      if(el){

        el.textContent =
          formatTimer(
            getTimerSeconds()
          );

      }

    }

  }
);

/* =========================
   INITIAL RENDER
========================= */

render();

</script>
