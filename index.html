<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8dce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pure Shine Cleaning Manager">

<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
    --pink:#e783a2;
    --pink-dark:#b94c6b;
    --pink-light:#f9dce7;
    --pink-bg:#fff6f9;
    --blue:#e1eafa;
    --green:#dff2e6;
    --yellow:#fff0c9;
    --purple:#eadcf8;
    --peach:#ffe1db;
    --text:#171519;
    --muted:#777179;
    --white:#fff;
    --border:#eee3e9;
    --shadow:0 5px 22px rgba(156,87,111,.08);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#f8dce7;
    color:var(--text);
    font-family:
        "DM Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}


/* =========================================================
   WELCOME
========================================================= */

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    background:#f9e7ee;
}

#welcomeScreen .welcome-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

#welcomeScreen .welcome-overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            180deg,
            rgba(255,246,249,.04) 0%,
            rgba(255,240,246,.08) 48%,
            rgba(255,220,233,.24) 100%
        );
}

.welcome-inner{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:
        max(40px,env(safe-area-inset-top))
        28px
        max(18px,env(safe-area-inset-bottom));
}

.welcome-logo{
    width:min(340px,72vw);
    height:min(340px,72vw);
    object-fit:contain;
    margin-top:3px;
    filter:drop-shadow(0 8px 18px rgba(120,55,78,.17));
}

.welcome-slogan{
    margin-top:2px;
    text-align:center;
    color:#98546b;
    font-family:
        "Parisienne",
        "Brush Script MT",
        "Segoe Script",
        cursive;
    font-size:clamp(43px,11vw,59px);
    line-height:.91;
    text-shadow:0 1px 2px rgba(255,255,255,.8);
}

.welcome-heart{
    color:#c96885;
    font-family:"Times New Roman",serif;
    font-size:42px;
    line-height:1;
    margin-top:6px;
}

.welcome-features{
    width:100%;
    max-width:540px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:3px;
    margin-top:12px;
    padding:8px 4px;
    border-radius:20px;
    background:rgba(255,255,255,.30);
    backdrop-filter:blur(4px);
}

.welcome-feature{
    min-height:88px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#292228;
}

.welcome-feature svg{
    width:34px;
    height:34px;
    margin-bottom:6px;
    color:#b14e6c;
}

.welcome-feature span{
    font-size:12px;
    line-height:1.15;
}

.welcome-bottom{
    width:100%;
    max-width:520px;
    margin-top:auto;
}

.get-started{
    width:100%;
    height:63px;
    border-radius:34px;
    background:#e27e9e;
    color:#fff;
    font-size:20px;
    font-weight:500;
    box-shadow:0 8px 20px rgba(177,67,103,.18);
}

.get-started-arrow{
    font-size:31px;
    vertical-align:-3px;
    margin-left:5px;
}

.login-text{
    margin-top:14px;
    text-align:center;
    color:#665d64;
    font-size:15px;
}

.login-text a{
    color:#ad4b69;
    font-weight:700;
    text-decoration:underline;
}


/* =========================================================
   APP
========================================================= */

#app{
    display:none;
    min-height:100vh;
    background:
        linear-gradient(
            180deg,
            #fffafd 0%,
            #fff5f8 100%
        );
    padding-bottom:100px;
}

.app-shell{
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:
        14px
        17px
        28px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 1px 14px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:62px;
    height:62px;
    object-fit:contain;
    border-radius:50%;
}

.brand-title{
    font-size:22px;
    line-height:1;
    font-weight:700;
    letter-spacing:-.7px;
}

.brand-subtitle{
    color:#756d73;
    font-size:14px;
    margin-top:5px;
}

.settings-button{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
    box-shadow:0 5px 17px rgba(140,77,98,.08);
}

.settings-button svg{
    width:25px;
    height:25px;
}


/* =========================================================
   DATE
========================================================= */

.date-card{
    position:relative;
    overflow:hidden;
    min-height:83px;
    border-radius:20px;
    padding:15px 55px 14px 18px;
    margin-bottom:16px;
    background:
        linear-gradient(
            90deg,
            rgba(250,215,228,.97),
            rgba(250,220,232,.91)
        );
}

.date-title{
    font-size:16px;
    font-weight:700;
}

.date-subtitle{
    margin-top:5px;
    color:#6f676d;
    font-size:14px;
}

.date-heart{
    position:absolute;
    right:18px;
    top:16px;
    color:#c75d7c;
    font-family:"Times New Roman",serif;
    font-size:36px;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    min-height:116px;
    border-radius:19px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.stat-jobs{background:#fbdde8}
.stat-hours{background:#e2e7fa}
.stat-earned{background:#def2e5}
.stat-free{background:#fff0c9}

.stat-icon{
    width:28px;
    height:28px;
    margin-bottom:7px;
}

.stat-jobs .stat-icon{color:#7c2948}
.stat-hours .stat-icon{color:#243250}
.stat-earned .stat-icon{color:#276d4c}
.stat-free .stat-icon{color:#98741e}

.stat-number{
    font-size:19px;
    font-weight:700;
    line-height:1;
}

.stat-name{
    margin-top:6px;
    font-size:13px;
}


/* =========================================================
   SECTION HEADINGS
========================================================= */

.section-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 2px 11px;
}

.section-heading h2{
    margin:0;
    font-size:20px;
    letter-spacing:-.5px;
}

.see-all{
    background:transparent;
    color:#ad4263;
    font-weight:700;
}


/* =========================================================
   SCHEDULE HOME CARD
========================================================= */

.schedule-home{
    background:#fff;
    border-radius:21px;
    padding:10px;
    box-shadow:var(--shadow);
}

.empty-schedule{
    min-height:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:14px;
}

.empty-icon{
    width:63px;
    height:63px;
    color:#e3829e;
    margin-bottom:5px;
}

.empty-title{
    font-size:17px;
}

.empty-subtitle{
    color:#847b82;
    margin-top:4px;
    font-size:14px;
}

.add-job-button{
    width:100%;
    height:51px;
    margin-top:15px;
    border-radius:27px;
    background:#e57e9e;
    color:#fff;
    font-size:16px;
}

.home-job{
    border-radius:16px;
    padding:13px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.home-job:last-child{
    margin-bottom:0;
}

.home-job:nth-child(odd){
    background:#fde2ec;
}

.home-job:nth-child(even){
    background:#e2edf9;
}

.home-job-name{
    font-weight:700;
}

.home-job-time{
    margin-top:4px;
    color:#777;
    font-size:12px;
}

.home-job-money{
    color:#ad4c6a;
    font-weight:700;
    font-size:17px;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-title{
    margin:20px 2px 11px;
    font-size:20px;
    letter-spacing:-.5px;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.quick{
    height:64px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:14px;
}

.quick svg{
    width:27px;
    height:27px;
}

.quick-blue{background:#dfebfa;color:#19518b}
.quick-green{background:#dff2e6;color:#246f4f}
.quick-pink{background:#f9dce7;color:#7d2949}
.quick-yellow{background:#fff0c9;color:#111}
.quick-purple{background:#eadcf8;color:#652f90}
.quick-peach{background:#ffe1db;color:#a64c3b}


/* =========================================================
   QUOTE PHOTO
========================================================= */

.quote-card{
    position:relative;
    overflow:hidden;
    height:116px;
    margin-top:17px;
    border-radius:18px;
    background:
        linear-gradient(
            90deg,
            rgba(250,218,229,.94),
            rgba(250,224,234,.63)
        ),
        url("pure-shine-cleaning-background.png");
    background-size:cover;
    background-position:center;
}

.quote-card:after{
    content:"";
    position:absolute;
    right:-2px;
    bottom:-5px;
    width:105px;
    height:105px;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(240,126,157,.72) 0 7%,
            transparent 8% 20%,
            rgba(246,148,174,.56) 21% 28%,
            transparent 29%
        );
    opacity:.55;
}

.quote-left,
.quote-right{
    position:absolute;
    color:#d07991;
    font-family:"Times New Roman",serif;
    font-size:33px;
    z-index:2;
}

.quote-left{
    left:19px;
    top:37px;
}

.quote-right{
    right:125px;
    bottom:20px;
}

.quote-text{
    position:absolute;
    z-index:3;
    left:54px;
    right:93px;
    top:23px;
    text-align:center;
    color:#98556c;
    font-family:
        "Parisienne",
        "Brush Script MT",
        cursive;
    font-size:30px;
    line-height:.91;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;
    z-index:5000;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:min(560px,100%);
    height:calc(80px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:rgba(255,255,255,.98);
    border-top:1px solid #eee4e9;
    backdrop-filter:blur(16px);
}

.nav-button{
    position:relative;
    background:transparent;
    color:#777b83;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:10px;
}

.nav-button svg{
    width:27px;
    height:27px;
}

.nav-button.active{
    color:#b94869;
}

.nav-button.active:before{
    content:"";
    position:absolute;
    z-index:-1;
    width:64px;
    height:52px;
    border-radius:16px;
    background:#f9dce8;
}


/* =========================================================
   PAGES
========================================================= */

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.page-top h1{
    margin:0;
    font-size:27px;
    letter-spacing:-.7px;
}

.page-add{
    padding:9px 13px;
    border-radius:13px;
    background:#f9dce7;
    color:#a94262;
    font-weight:700;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
}


/* =========================================================
   CALENDAR
========================================================= */

.calendar-card{
    background:#fff;
    border-radius:21px;
    padding:14px;
    box-shadow:var(--shadow);
    margin-bottom:12px;
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
}

.calendar-header strong{
    font-size:18px;
}

.calendar-arrow{
    width:37px;
    height:37px;
    border-radius:50%;
    background:#f9dce7;
    color:#a94563;
    font-size:20px;
}

.calendar-weekdays,
.calendar-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
}

.calendar-weekdays div{
    text-align:center;
    color:#91888e;
    font-size:10px;
    font-weight:700;
    padding-bottom:5px;
}

.calendar-day{
    min-height:39px;
    border-radius:11px;
    background:#fff7fa;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:12px;
}

.calendar-day.today{
    background:#e783a2;
    color:#fff;
    font-weight:700;
}

.calendar-day.has-job:after{
    content:"";
    position:absolute;
    bottom:4px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#d46d8c;
}

.calendar-day.today.has-job:after{
    background:#fff;
}


/* =========================================================
   CLIENTS
========================================================= */

.client-card{
    background:#fff;
    border-radius:20px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
}

.client-main{
    display:flex;
    align-items:center;
    gap:11px;
}

.client-avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f9dce7;
    color:#a74463;
    font-weight:700;
    flex:none;
}

.client-info{
    flex:1;
}

.client-info strong{
    display:block;
}

.client-info small{
    display:block;
    color:#777;
    margin-top:4px;
}

.client-rate{
    color:#ad4d6b;
    font-weight:700;
}

.client-badges{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
}

.badge{
    padding:4px 8px;
    border-radius:9px;
    font-size:10px;
    font-weight:700;
}

.private{
    background:#ffe0eb;
    color:#893151;
}

.agency{
    background:#dceefa;
    color:#28617e;
}

.client-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.small-button{
    padding:8px 11px;
    border-radius:11px;
    background:#f2e9ef;
    color:#855269;
    font-size:12px;
    font-weight:700;
}

.small-danger{
    background:#fff0f3;
    color:#b82f55;
}


/* =========================================================
   EARNINGS
========================================================= */

.earnings-total{
    background:#eadcf8;
    border-radius:22px;
    text-align:center;
    padding:22px;
    margin-bottom:11px;
}

.earnings-total small{
    color:#756b7c;
}

.earnings-total strong{
    display:block;
    font-size:39px;
    margin:5px 0;
}

.history{
    background:#fff;
    border-radius:19px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
}

.history-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.history-client{
    font-weight:700;
}

.history-date{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.history-money{
    color:#ad4c6a;
    font-weight:700;
}

.history-buttons{
    display:flex;
    gap:7px;
    margin-top:10px;
}


/* =========================================================
   SETTINGS
========================================================= */

.settings-page{
    padding-bottom:20px;
}

.settings-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff;
    border-radius:18px;
    padding:14px;
    margin-bottom:9px;
    box-shadow:var(--shadow);
}

.settings-icon{
    width:45px;
    height:45px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    background:#ffe0eb;
    color:#b34868;
    font-size:21px;
}

.settings-copy{
    flex:1;
}

.settings-copy strong{
    display:block;
}

.settings-copy small{
    display:block;
    color:#777;
    margin-top:3px;
}

.settings-control{
    width:90px;
    height:40px;
    border-radius:11px;
    border:1px solid #eadfe5;
    background:#fff;
}

.switch{
    width:46px;
    height:26px;
    border-radius:20px;
    background:#ddd5da;
    position:relative;
}

.switch:after{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    left:3px;
    top:3px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.switch.on{
    background:#e582a0;
}

.switch.on:after{
    left:23px;
}


/* =========================================================
   FREE TIME
========================================================= */

.free-total{
    background:#fff0c9;
    border-radius:22px;
    padding:25px;
    text-align:center;
    margin-bottom:11px;
}

.free-total strong{
    display:block;
    font-size:40px;
    margin-top:5px;
}

.free-slot{
    background:#fff;
    border-radius:18px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    box-shadow:var(--shadow);
}

.free-slot small{
    display:block;
    color:#777;
    margin-top:4px;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:10000;
    display:none;
    align-items:flex-end;
    background:rgba(28,19,24,.40);
    backdrop-filter:blur(4px);
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:560px;
    max-height:92vh;
    overflow:auto;
    margin:0 auto;
    padding:20px 18px 32px;
    border-radius:28px 28px 0 0;
    background:#fff9fb;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.modal-header h2{
    margin:0;
    font-size:23px;
}

.close{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#f3e7ed;
    color:#9c3d5c;
    font-size:26px;
}

.label{
    display:block;
    margin:12px 0 6px;
    font-size:13px;
    font-weight:700;
}

.input,
.select{
    width:100%;
    height:49px;
    padding:0 12px;
    border:1px solid #e6dbe1;
    border-radius:14px;
    background:#fff;
    outline:none;
}

.input:focus,
.select:focus{
    border-color:#df83a1;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.modal-button{
    width:100%;
    height:51px;
    margin-top:17px;
    border-radius:27px;
    background:#e47e9d;
    color:#fff;
    font-weight:700;
}

.modal-secondary{
    padding:9px 12px;
    border-radius:12px;
    background:#f1e8ee;
    color:#865169;
    font-weight:700;
}

.danger{
    background:#fff0f3;
    color:#b52e55;
}


/* =========================================================
   TIMER
========================================================= */

.timer-display{
    text-align:center;
    font-size:44px;
    font-weight:700;
    padding:27px 0;
    letter-spacing:1px;
}

.timer-status{
    text-align:center;
    color:#777;
    font-size:13px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

    .app-shell{
        padding-left:14px;
        padding-right:14px;
    }

    .brand-logo{
        width:56px;
        height:56px;

];

let logoIndex=0;

function tryNextLogo(img){

    logoIndex++;

    if(logoIndex<LOGO_FILES.length){

        img.src=LOGO_FILES[logoIndex];

    }
}


/* =========================================================
   STORAGE
========================================================= */

const MAIN_KEYS=[
    "pureShineCleaningManager",
    "pureShineFinalOneFile",
    "cleaningManagerData"
];

const CLIENT_KEYS=[
    "pureShineClients",
    "cleaningClients",
    "clients"
];

const JOB_KEYS=[
    "pureShineJobs",
    "cleaningJobs",
    "jobs"
];


function readJSON(keys){

    for(const key of keys){

        try{

            const value=
                localStorage.getItem(key);

            if(!value) continue;

            const parsed=
                JSON.parse(value);

            if(parsed!==null){
                return parsed;
            }

        }catch(e){}

    }

    return null;
}


const oldData=
    readJSON(MAIN_KEYS);


let clients=
    Array.isArray(oldData?.clients)
        ? oldData.clients
        : readJSON(CLIENT_KEYS);


let jobs=
    Array.isArray(oldData?.jobs)
        ? oldData.jobs
        : readJSON(JOB_KEYS);


let holidays=
    Array.isArray(oldData?.holidays)
        ? oldData.holidays
        : [];


if(!Array.isArray(clients)){
    clients=[];
}


if(!Array.isArray(jobs)){
    jobs=[];
}


/* =========================================================
   DEFAULT CLIENTS
   Only used if there are NO saved clients.
========================================================= */

const DEFAULT_CLIENTS=[

    {
        id:1,

        start:"13:00",

        frequency:"Weekly"
    },

    {

    {

    },

    {
        id:4,
        name:"Sonia",
        type:"Agency",
        rate:16,

        start:"09:00",

    },

    },

        id:6,

        day:"Thursday",

    },

    {

    {

    },

    {

    }

];


if(clients.length===0){

    clients=
        DEFAULT_CLIENTS.map(

        );

}


/* Gill is always excluded */

clients=
    clients.filter(
        c=>
            String(c.name||"")
                .trim()
                .toLowerCase()!=="gill"
    );


let reminderEnabled=
    oldData?.reminderEnabled!==false;


let calendarSync=
    oldData?.calendarSync!==false;


let zoom=
    Number(
        oldData?.zoom||100
    );


let welcomeSeen=
    localStorage.getItem(
        "pureShineWelcomeSeen"
    )==="1";


let timerData=
    oldData?.timer||null;


/* =========================================================
   SAVE
========================================================= */

function save(){

    const data={

        clients,
        jobs,
        holidays,

        reminderEnabled,
        calendarSync,

        zoom,

        timer:timerData

    };


    localStorage.setItem(
        "pureShineCleaningManager",
        JSON.stringify(data)
    );

    localStorage.setItem(
        "pureShineFinalOneFile",
        JSON.stringify(data)
    );

    localStorage.setItem(
        "pureShineClients",
        JSON.stringify(clients)
    );

    localStorage.setItem(
        "pureShineJobs",
        JSON.stringify(jobs)
    );
}


/* =========================================================
   HELPERS
========================================================= */

function esc(v){

    return String(v??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function mins(v){

    if(!v || !String(v).includes(":")){
        return 0;
    }

    const p=
        String(v)
            .split(":")
            .map(Number);

    return (
        (p[0]||0)*60+
        (p[1]||0)
    );
}


function hoursBetween(start,end){

    return Math.max(
        0,
        mins(end)-mins(start)
    )/60;
}


function durationText(hours){

    const total=
        Math.round(
            Number(hours||0)*60
        );

    const h=
        Math.floor(total/60);

    const m=
        total%60;

    return `${h}h ${m}m`;
}


function money(value){

    return "£"+
        Number(value||0)
            .toFixed(2);
}


function today(){

    const d=new Date();

    return [
        d.getFullYear(),
        String(d.getMonth()+1).padStart(2,"0"),
        String(d.getDate()).padStart(2,"0")
    ].join("-");
}


function niceDate(date){

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );
}


function shortDate(date){

    if(!date) return "";

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}


function dayName(date){

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {weekday:"long"}
    );
}


function getClient(id){

    return clients.find(
        c=>Number(c.id)===Number(id)
    );
}


function getClientName(id){

    const c=getClient(id);

    return c
        ?c.name
        :"Client";
}


function activate(page){

    document
        .querySelectorAll(".nav-button")
        .forEach(
            b=>{
                b.classList.toggle(
                    "active",
                    b.dataset.page===page
                );
            }
        );
}


/* =========================================================
   WELCOME
========================================================= */

function enterApp(){

    welcomeSeen=true;

    localStorage.setItem(
        "pureShineWelcomeSeen",
        "1"
    );

    document
        .getElementById("welcomeScreen")
        .style.display="none";

    document
        .getElementById("app")
        .style.display="block";

    save();

    showHome();
}


function showWelcome(){

    localStorage.removeItem(
        "pureShineWelcomeSeen"
    );

    welcomeSeen=false;

    document
        .getElementById("app")
        .style.display="none";

    document
        .getElementById("welcomeScreen")
        .style.display="block";
}


/* =========================================================
   HOME
========================================================= */

function showHome(){

    activate("home");

    renderHome();
}


function todayClients(){

    const day=
        dayName(today());

    return clients
        .filter(
            c=>{

                if(c.day!==day){
                    return false;
                }

                if(c.frequency==="Occasional"){
                    return false;
                }

                return true;

            }
        )
        .sort(
            (a,b)=>
                mins(a.start)-
                mins(b.start)
        );
}


function renderHome(){

    const app=
        document.getElementById(
            "appContent"
        );


    const currentDate=today();

    const todayJobs=
        jobs.filter(
            j=>
                j.date===currentDate &&
                String(j.status||"")
                    .toLowerCase()!=="cancelled"
        );


    let totalHours=0;
    let totalEarned=0;


    jobs.forEach(
        j=>{

            if(
                String(j.status||"")
                    .toLowerCase()==="cancelled"
            ){
                return;
            }

            totalHours+=
                hoursBetween(
                    j.start,
                    j.end
                );

            totalEarned+=
                Number(
                    j.price ??
                    j.amount ??
                    0
                );

        }
    );


    const available=
        Math.max(
            0,
            8-totalHours
        );


    let schedule=
        todayJobs;


    if(schedule.length===0){

        schedule=
            todayClients();

    }


    app.innerHTML=`

            <div class="brand">

                    class="brand-logo"

                        l-.05.05

                        a1.7 1.7 0 0 0-.34-1.88
                        l-.05-.05
                        1.55-1.55
                        .05.05
                        a1.7 1.7 0 0 0 1.88.34
                        1.7 1.7 0 0 0 1.04-1.56V5h2.18v.35
                        a1.7 1.7 0 0 0 1.04 1.56
                        1.7 1.7 0 0 0 1.88-.34
                        l.05-.05
                        1.55 1.55
                        -.05.05
                        A1.7 1.7 0 0 0 19.4 10
                        a1.7 1.7 0 0 0 1.56 1.04H21v2.18h-.04
                        A1.7 1.7 0 0 0 19.4 15Z"
                    />

                </svg>

            </button>

        </header>


        <section class="date-card">

            <div class="date-title">
                ${niceDate(currentDate)}
            </div>

            <div class="date-subtitle">
                Let's make today productive ✨
            </div>

            <div class="date-heart">
                ♡
            </div>

        </section>


        <section class="stats">

            <div class="stat stat-jobs">

                <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">

                                Number(

                                    getClient(item.clientId)?.rate||

/* =========================================================
   SCHEDULE
========================================================= */

let calendarDate=
    new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
    );


function showSchedule(){

    activate("schedule");

    renderSchedule();
}


function renderSchedule(){

    const app=
        document.getElementById(
            "appContent"
        );


    const year=
        calendarDate.getFullYear();

    const month=
        calendarDate.getMonth();


    const first=
        new Date(
            year,
            month,
            1
        );


    const last=
        new Date(
            year,
            month+1,
            0
        );


    const startDay=
        first.getDay()===0
        ?6
        :first.getDay()-1;


    const days=[];


    for(let i=0;i<startDay;i++){
        days.push(null);
    }


    for(let d=1;d<=last.getDate();d++){
        days.push(d);
    }


    app.innerHTML=`

        <div class="page-top">

            <h1>
                Schedule
            </h1>

            <button
                class="page-add"
                onclick="openAddJob()">

                ＋ Add job

            </button>

        </div>


        <section class="calendar-card">

            <div class="calendar-header">

                <button
                    class="calendar-arrow"
                    onclick="
                        calendarDate.setMonth(
                            calendarDate.getMonth()-1
                        );
                        renderSchedule();
                    ">

                    ‹

                </button>


                <strong>
                    ${calendarDate.toLocaleDateString(
                        "en-GB",
                        {
                            month:"long",
                            year:"numeric"
                        }
                    )}
                </strong>


                <button
                    class="calendar-arrow"
                    onclick="
                        calendarDate.setMonth(
                            calendarDate.getMonth()+1
                        );
                        renderSchedule();
                    ">

                    ›

                </button>

            </div>


            <div class="calendar-weekdays">

                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div>SAT</div>
                <div>SUN</div>

            </div>


            <div class="calendar-days">

                ${
                    days.map(
                        d=>{

                            if(!d){
                                return `<div></div>`;
                            }

                            const date=
                                [
                                    year,
                                    String(month+1).padStart(2,"0"),
                                    String(d).padStart(2,"0")
                                ].join("-");


                            const has=
                                jobs.some(
                                    j=>j.date===date
                                )
                                ||
                                clients.some(
                                    c=>
                                        c.day===
                                        dayName(date)
                                );


                            return `

                                <button
                                    class="
                                        calendar-day
                                        ${
                                            date===today()
                                            ?"today"
                                            :""
                                        }
                                        ${
                                            has
                                            ?"has-job"
                                            :""
                                        }
                                    "
                                    onclick="
                                        openDay('${date}');
                                    ">

                                    ${d}

                                </button>

                            `;

                        }
                    ).join("")
                }

            </div>

        </section>


        <div class="section-heading">

            <h2>
                Scheduled clients
            </h2>

        </div>


        ${
            clients
                .sort(
                    (a,b)=>
                        mins(a.start)-
                        mins(b.start)
                )
                .map(
                    c=>`

                        <div class="card">

                            <div
                                style="
                                    display:flex;
                                    align-items:center;
                                    justify-content:space-between;
                                ">

                                <div>

                                    <strong>
                                        ${esc(c.name)}
                                    </strong>

                                    <div
                                        style="
                                            color:#777;
                                            font-size:12px;
                                            margin-top:4px;
                                        ">

                                        ${esc(c.day)}
                                        ·
                                        ${esc(c.start)}
                                        –
                                        ${esc(c.end)}

                                    </div>

                                </div>


                                <div
                                    style="
                                        color:#ad4d6b;
                                        font-weight:700;
                                    ">

                                    £${Number(c.rate||0)}/h

                                </div>

                            </div>


                            <div
                                style="
                                    display:flex;
                                    gap:7px;
                                    margin-top:10px;
                                ">

                                <button
                                    class="small-button"
                                    onclick="
                                        openClientEditor(${c.id});
                                    ">

                                    Edit

                                </button>

                                <button
                                    class="small-button"
                                    onclick="
                                        openAddJob({
                                            clientId:${c.id},
                                            date:'${today()}',
                                            start:'${c.start}',
                                            end:'${c.end}'
                                        });
                                    ">

                                    Add job

                                </button>

                            </div>

                        </div>

                    `
                ).join("")
        }


        <div class="section-heading">

            <h2>
                Job history
            </h2>

        </div>


        ${
            jobs.length
            ?
            jobs
                .slice()
                .sort(
                    (a,b)=>
                        String(b.date)
                            .localeCompare(
                                String(a.date)
                            )
                )
                .map(historyHTML)
                .join("")
            :
            `
                <div class="card"
                    style="
                        text-align:center;
                        color:#888;
                    ">

                    No completed jobs yet.

                </div>
            `
        }

    `;
}


function openDay(date){

    const dayJobs=
        jobs.filter(
            j=>j.date===date
        );


    const scheduled=
        clients.filter(
            c=>c.day===dayName(date)
        );


    openModal(`

                ${niceDate(date)}
            </h2>

                class="close"

                ×

            </button>

        ${
            dayJobs.length
            ?

                    padding:20px;

        ${

function saveJob(){

    const client=
        getClient(
            document
                .getElementById("jobClient")
                .value
        );


    const date=
        document
            .getElementById("jobDate")
            .value;


    const start=
        document
            .getElementById("jobStart")
            .value;


    const end=
        document
            .getElementById("jobEnd")
            .value;


    const status=
        document
            .getElementById("jobStatus")
            .value;


    let price=
        Number(
            document
                .getElementById("jobPrice")
                .value
        );


    if(
        !client||
        !date||
        !start||
        !end
    ){

        alert(
            "Please complete the client, date, start and end time."
        );

        return;
    }


    if(mins(end)<=mins(start)){

        alert(
            "The end time must be after the start time."
        );

        return;
    }


    if(!price){

        price=
            hoursBetween(
                start,
                end
            )*
            Number(client.rate||0);

    }


    jobs.push({

        id:Date.now(),

        clientId:client.id,

        client:client.name,

        date,

        start,

        end,

        rate:Number(client.rate||0),

        price,

        amount:price,

        status

    });


    save();

    closeModal();

    showSchedule();
}

function updateJob(id){

    const job=
        jobs.find(
            j=>Number(j.id)===Number(id)
        );


    if(!job) return;


    const client=
        getClient(
            document
                .getElementById("editClient")
                .value
        );


    job.clientId=
        Number(
            document
                .getElementById("editClient")
                .value
        );


    job.client=
        client?.name||
        job.client;


    job.date=
        document
            .getElementById("editDate")
            .value;


    job.start=
        document
            .getElementById("editStart")
            .value;


    job.end=
        document
            .getElementById("editEnd")
            .value;


    job.price=
        Number(
            document
                .getElementById("editPrice")
                .value
        );


    job.amount=
        job.price;


    job.status=
        document
            .getElementById("editStatus")
            .value;


    save();

    closeModal();

    showSchedule();
}


function deleteJob(id){

    if(
        !confirm(
            "Delete this job?"
        )
    ){
        return;
    }


    jobs=
        jobs.filter(
            j=>Number(j.id)!==Number(id)
        );


    save();

    showSchedule();
}

                .getElementById("clientStart")
                .value,

        end:
            document
                .getElementById("clientEnd")
                .value,

        frequency:
            document
                .getElementById("clientFrequency")
                .value

    };


    if(id){

        const index=
            clients.findIndex(
                c=>Number(c.id)===Number(id)

        if(index>=0){

            clients[index]={
                ...clients[index],
                ...object
            };

    }else{

        clients.push(object);

    }


    save();

    closeModal();

    showClients();
}


function deleteClient(id){

    clients=
        clients.filter(
            c=>Number(c.id)!==Number(id)
        );


    save();

    showClients();
}

function showFreeTime(){

    activate("free");


    const app=
        document.getElementById(
            "appContent"
        );


    app.innerHTML=`

        <div class="page-top">

            <h1>
                Free time
            </h1>

        </div>


        <div class="card">

            <label class="label">
                Choose date
            </label>

            <input
                class="input"
                id="freeDate"
                type="date"
                value="${today()}"
                onchange="calculateFreeTime()"
            >

        </div>


        <div id="freeResults"></div>

    `;


    calculateFreeTime();
}


function calculateFreeTime(){

    const date=
        document
            .getElementById("freeDate")
            ?.value;


    const result=
        document
            .getElementById("freeResults");


    if(!date||!result){
        return;
    }


    const day=
        dayName(date);


    const scheduled=
        clients
            .filter(
                c=>
                    c.day===day &&
                    c.frequency!=="Occasional"
            )
            .sort(
                (a,b)=>
                    mins(a.start)-
                    mins(b.start)
            );


    const dayStart=8*60;
    const dayEnd=18*60;

    let cursor=dayStart;

    const gaps=[];


    scheduled.forEach(
        c=>{

            const start=mins(c.start);
            const end=mins(c.end);


            if(start>cursor){

                gaps.push({
                    start:cursor,
                    end:start
                });

            }


            cursor=
                Math.max(
                    cursor,
                    end
                );

        }
    );


    if(cursor<dayEnd){

        gaps.push({
            start:cursor,
            end:dayEnd
        });

    }


    const total=
        gaps.reduce(
            (sum,g)=>
                sum+
                (g.end-g.start)/60,
            0
        );


    result.innerHTML=`

        <div class="free-total">

            <small>
                Available time
            </small>

            <strong>
                ${durationText(total)}
            </strong>

        </div>


        ${
            gaps.length
            ?
            gaps.map(
                g=>`

                    <div class="free-slot">

                        <div>

                            <strong>
                                ${formatTime(g.start)}
                                –
                                ${formatTime(g.end)}
                            </strong>

                            <small>
                                ${durationText(
                                    (g.end-g.start)/60
                                )}
                            </small>

                        </div>


                        <button
                            class="small-button"
                            onclick="
                                openAddJob({
                                    date:'${date}',
                                    start:'${formatTime(g.start)}',
                                    end:'${formatTime(g.end)}'
                                });
                            ">

                            ＋ Add

                        </button>

                    </div>

                `
            ).join("")
            :
            `
                <div class="card"
                    style="
                        text-align:center;
                        color:#888;
                    ">

                    No free time found.

                </div>
            `
        }

    `;
}


function formatTime(total){

    const h=
        Math.floor(total/60);

    const m=
        total%60;

    return (
        String(h).padStart(2,"0")
        +
        ":"
        +
        String(m).padStart(2,"0")
    );
}

/* =========================================================
   TIMER
========================================================= */

let timerInterval=null;


function timerElapsed(){

    if(!timerData?.startedAt){
        return 0;
    }

    return Math.max(
        0,
        Date.now()-
        Number(timerData.startedAt)
    );
}


function timerText(){

    const seconds=
        Math.floor(
            timerElapsed()/1000
        );


    const h=
        Math.floor(seconds/3600);

    const m=
        Math.floor(
            (seconds%3600)/60
        );

    const s=
        seconds%60;


    return [
        h,
        m,
        s
    ]
    .map(
        n=>
            String(n)
                .padStart(2,"0")
    )
    .join(":");
}


function openTimer(){

    openModal(`

        <div class="modal-header">

            <h2>
                Start cleaning
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <label class="label">
            Client
        </label>

        <select
            class="select"
            id="timerClient">

            ${
                clients.map(
                    c=>`

                        <option
                            value="${c.id}"
                            ${
                                Number(timerData?.clientId)===
                                Number(c.id)
                                ?"selected"
                                :""
                            }>

                            ${esc(c.name)}
                            · £${Number(c.rate||0)}/h

                        </option>

                    `
                ).join("")
            }

        </select>


        <div
            class="timer-display"
            id="timerDisplay">

            ${timerText()}

        </div>


        <div
            class="timer-status"
            id="timerStatus">

            ${
                timerData
                ?"Cleaning timer is running"
                :"Ready to start"
            }

        </div>


        <button
            class="modal-button"
            id="timerButton"
            onclick="toggleTimer()">

            ${
                timerData
                ?"Finish cleaning"
                :"Start timer"
            }

        </button>

    `);


    startTimerRefresh();
}


function startTimerRefresh(){

    if(timerInterval){
        clearInterval(timerInterval);
    }


    timerInterval=
        setInterval(
            ()=>{

                const display=
                    document
                        .getElementById(
                            "timerDisplay"
                        );

                if(display){
                    display.textContent=
                        timerText();
                }

            },
            500
        );
}


function toggleTimer(){

    if(timerData){

        finishTimer();

        return;
    }


    const clientId=
        Number(
            document
                .getElementById("timerClient")
                .value
        );


    const client=
        getClient(clientId);


    if(!client){
        return;
    }


    timerData={

        clientId,

        client:client.name,

        rate:Number(client.rate||0),

        startedAt:Date.now(),

        date:today()

    };


    save();


    openTimer();
}


function finishTimer(){

    if(!timerData){
        return;
    }


    const client=
        getClient(
            timerData.clientId
        );


    const elapsed=
        timerElapsed();


    const totalMinutes=
        Math.max(
            1,
            Math.round(
                elapsed/60000
            )
        );


    const startDate=
        new Date(
            timerData.startedAt
        );


    const endDate=
        new Date();


    const start=
        String(
            startDate.getHours()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            startDate.getMinutes()
        ).padStart(2,"0");


    const end=
        String(
            endDate.getHours()
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            endDate.getMinutes()
        ).padStart(2,"0");


    const exactHours=
        totalMinutes/60;


    const rate=
        Number(
            timerData.rate||
            client?.rate||
            0
        );


    const amount=
        exactHours*rate;


    jobs.push({

        id:Date.now(),

        clientId:
            timerData.clientId,

        client:
            timerData.client||
            client?.name||
            "Client",

        date:
            timerData.date||
            today(),

        start,

        end,

        durationMinutes:
            totalMinutes,

        rate,

        price:
            amount,

        amount,

        status:"Completed",

        timerStartedAt:
            timerData.startedAt,

        timerFinishedAt:
            Date.now()

    });


    timerData=null;

    save();


    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

    }


    closeModal();

    showHome();


    setTimeout(
        ()=>{
            alert(
                "Cleaning finished!\n\n"+
                "Time: "+
                durationText(exactHours)+
                "\n"+
                "Amount: "+
                money(amount)
            );
        },
        100
    );
}
