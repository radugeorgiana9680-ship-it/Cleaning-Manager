<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8dce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pure Shine Cleaning Manager">

<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
  --pink:#f8dce7;
  --pink2:#f4c8d9;
  --pink3:#fff4f8;
  --gold:#c8a45d;
  --gold2:#e2c98e;
  --text:#493c42;
  --muted:#8d7d84;
  --white:#fff;
  --green:#8eb69b;
  --red:#c97d88;
  --shadow:0 8px 25px rgba(100,70,85,.12);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f9eef2;
  font-family:'DM Sans',sans-serif;
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:linear-gradient(180deg,#fff8fb 0%,#fff 100%);
  position:relative;
  padding-bottom:90px;
}

.welcome{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:
    linear-gradient(rgba(255,244,248,.78),rgba(255,244,248,.92)),

}

.welcome-card{
  width:100%;

  text-align:center;
  padding:42px 25px;
  border-radius:32px;
  background:rgba(255,255,255,.88);

}

.welcome-logo{

  margin-bottom:8px;
}

.script{

}

.welcome h1{

}

.welcome p{

}

.primary{

header{

}

.header-row{

.brand{

}

.brand img{

.brand-title{

.brand-sub{

.icon-btn{

.date-card{

.date-main{

}

.date-small{

.flower-banner{

.flower-banner strong{

.stats{

}

.stat{

}

.stat-icon{

}

.stat-label{

}

.stat-value{

}

.section-title{
  display:flex;

}

.section-title h2{

}

.section-title span{

.schedule-card,
.client-card,
.job-card,
.earning-card,
.setting-card{

}

.schedule-card{

.schedule-left{

}

.client-dot{

  height:45px;

  align-items:center;

  background:#fae5ed;
  font-size:20px;
}

.client-name{

}

.client-meta{

}

.rate{
  font-weight:700;
  color:var(--gold);

}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);

}

.quick{
  padding:16px;

  border-radius:20px;

  text-align:left;
}

.quick .emoji{

}

.quick strong{

}

.bottom-nav{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid #f2e4e9;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  background:transparent;
  color:#9b8a91;
  min-height:62px;
  border-radius:17px;
  font-size:11px;
}

.nav-btn span{
  display:block;
  font-size:25px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:#b47a91;
  background:#fff1f6;

}

.fab{
  position:fixed;
  z-index:101;
  right:18px;
  bottom:92px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#e7bfd0,#c8a45d);
  color:#fff;
  font-size:28px;

}

.modal-backdrop{

  inset:0;
  z-index:500;
  background:rgba(60,40,50,.38);
  display:none;
  align-items:flex-end;

  padding:0;
}

.modal-backdrop.show{

}

.modal{
  width:min(520px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:30px 30px 0 0;
  padding:20px 17px calc(25px + env(safe-area-inset-bottom));

}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h3{
  margin:0;
  font-size:21px;
}

.close{

  height:40px;
  border-radius:13px;
  background:#f9edf2;
  font-size:21px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  font-weight:700;
  color:#76656d;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #ecdde3;
  border-radius:14px;
  background:#fffafc;
  outline:none;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#d7a9bb;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.timer-box{
  text-align:center;
  padding:24px 10px;
  border-radius:25px;
  background:linear-gradient(135deg,#fff1f6,#fff9ec);
  margin-bottom:16px;
}

.timer-client{
  font-size:18px;
  font-weight:700;
}

.timer-time{
  font-size:53px;
  font-weight:700;
  letter-spacing:1px;
  margin:10px 0;
  color:#765563;
}

.timer-rate{
  color:var(--gold);
  font-weight:700;
}

.timer-live{
  display:inline-flex;
  align-items:center;
  gap:7px;

}

.live-dot{
  width:9px;

.timer-earnings{

  font-size:18px;
  font-weight:700;
}

.timer-actions{
  display:grid;

  gap:10px;
}

.danger{
  background:#f5d7dd!important;

}

.secondary{
  background:#f5edf0;
  color:#725d66;
}

.green{
  background:#e1efe6;
  color:#547861;
}

.day-title{
  font-weight:700;
  color:#92717f;
  margin:20px 2px 8px;
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  background:#fff;
  border-radius:22px;
}

.client-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.client-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#f8edf2;
}

.job-card{
  position:relative;
}

.job-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.job-date{
  font-weight:700;
}

.job-status{
  padding:5px 9px;
  border-radius:10px;
  background:#e2efe6;
  color:#547861;
  font-size:10px;
  font-weight:700;
}

.job-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.job-info div{
  background:#fff6f9;
  padding:9px;
  border-radius:12px;
}

.job-info small{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.job-info strong{
  font-size:13px;
}

.job-buttons{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.job-buttons button{
  flex:1;
  padding:9px;
  border-radius:12px;
  background:#f6edf1;
  font-size:12px;
}

.earning-total{
  background:linear-gradient(135deg,#fff1f6,#fff8e9);
  border-radius:25px;
  padding:22px;
  box-shadow:var(--shadow);
  text-align:center;
}

.earning-total .money{
  font-size:36px;
  font-weight:700;

}

.earning-total .hours{
  color:var(--muted);
  margin-top:4px;
}

.week-row{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:5px;
}

.week-day{
  min-width:78px;
  padding:12px 8px;
  border-radius:17px;
  background:#fff;
  box-shadow:var(--shadow);
  text-align:center;
}

.week-day.today{
  background:#f5dce6;
}

.week-day small{
  display:block;
  color:var(--muted);
}

.week-day strong{
  display:block;
  font-size:18px;
  margin-top:4px;

.switch-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #f0e5e9;
}

.switch{
  width:50px;
  height:28px;
  border-radius:20px;
  background:#ddd;
  padding:3px;
}

.switch i{
  display:block;
  width:22px;
  height:22px;
  border-radius:50%;

}

.switch.on{
  background:#d9b6c5;
}

.switch.on i{
  transform:translateX(22px);
}

.zoom-value{

  color:var(--gold);
}

.holiday{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.holiday-date{
  font-size:12px;

.calendar{
  background:#fff;
  border-radius:22px;
  box-shadow:var(--shadow);

.calendar-head{

  grid-template-columns:repeat(7,1fr);

  text-align:center;

.calendar-grid{

.calendar-cell{

.calendar-cell.has-job{

.calendar-cell strong{

}

.calendar-client{
  margin-top:3px;
  font-size:8px;

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:105px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#493c42;
  color:#fff;
  padding:12px 17px;
  border-radius:15px;

  transition:.25s;

.toast.show{

@media(min-width:700px){
  .app{
    box-shadow:0 0 50px rgba(80,50,65,.08);
  }

  .bottom-nav{
    bottom:10px;
    border-radius:25px;
    width:500px;
  }

  .fab{
    right:calc(50% - 235px);
  }

</style>
</head>

<body>

<div class="welcome" id="welcomeScreen">
  <div class="welcome-card">
    <img class="welcome-logo" src="icon.png" onerror="this.style.display='none'">

<div class="app" id="app">

<header>
  <div class="header-row">
    <div class="brand">
      <img src="icon.png" onerror="this.style.display='none'">
      <div>
        <div class="brand-title">Pure Shine</div>
        <div class="brand-sub">Cleaning Manager</div>
      </div>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<main id="main"></main>

<button class="fab" onclick="openAddJob()">＋</button>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="home" onclick="showPage('home')">
    <span>⌂</span>Home
  </button>
  <button class="nav-btn" data-page="schedule" onclick="showPage('schedule')">

  </button>

    <span>♙</span>Clients
  </button>

</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENT_KEY = 'pureShineClients';
const JOB_KEY = 'pureShineJobs';
const APP_KEY = 'pureShineFinalOneFile';

const defaultClients = [
  {id:'lottie',name:'Lottie',type:'Agency',rate:16,day:1,start:'13:00',end:'15:00',frequency:'Weekly'},
  {id:'christine',name:'Christine',type:'Private',rate:18,day:2,start:'09:30',end:'12:30',frequency:'Fortnightly'},
  {id:'matt',name:'Matt',type:'Agency',rate:16,day:2,start:'13:00',end:'17:00',frequency:'Weekly'},
  {id:'sonia',name:'Sonia',type:'Agency',rate:16,day:3,start:'09:00',end:'14:00',frequency:'Weekly'},
  {id:'laura',name:'Laura',type:'Private',rate:18,day:4,start:'09:00',end:'13:00',frequency:'Weekly'},
  {id:'hannah',name:'Hannah',type:'Agency',rate:16,day:4,start:'13:00',end:'16:00',frequency:'Weekly'},
  {id:'meghan',name:'Meghan',type:'Private',rate:20,day:4,start:'16:00',end:'18:00',frequency:'Occasional'},
  {id:'johanna',name:'Johanna',type:'Private',rate:20,day:5,start:'09:00',end:'11:00',frequency:'Fortnightly'},
  {id:'sindu',name:'Sindu',type:'Private',rate:20,day:5,start:'11:30',end:'13:30',frequency:'Fortnightly'},
  {id:'peter',name:'Peter',type:'Private',rate:20,day:5,start:'14:00',end:'16:00',frequency:'Occasional'},
  {id:'mike',name:'Mike',type:'Private',rate:20,day:5,start:'16:00',end:'18:00',frequency:'Every 3 weeks'}
];

let clients = JSON.parse(localStorage.getItem(CLIENT_KEY) || 'null') || defaultClients;
clients = clients.filter(c => c.name.toLowerCase() !== 'gill');

let jobs = JSON.parse(localStorage.getItem(JOB_KEY) || '[]');

let appSettings = JSON.parse(localStorage.getItem(APP_KEY) || 'null') || {
  zoom:100,
  reminders:false,
  calendar:false
};

let currentPage = 'home';

let timer = {
  active:false,
  clientId:null,
  startTimestamp:null,
  elapsedBefore:0,
  interval:null
};

function saveClients(){
  localStorage.setItem(CLIENT_KEY,JSON.stringify(clients));
}

function saveJobs(){
  localStorage.setItem(JOB_KEY,JSON.stringify(jobs));
}

function saveSettings(){
  localStorage.setItem(APP_KEY,JSON.stringify(appSettings));
}

function uid(prefix='id'){
  return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
}

function money(n){
  return '£' + Number(n || 0).toFixed(2);
}

function formatMinutes(minutes){
  minutes=Math.max(0,Math.round(minutes));
  const h=Math.floor(minutes/60);
  const m=minutes%60;
  return `${h}h ${String(m).padStart(2,'0')}m`;
}

function formatTime(seconds){
  seconds=Math.max(0,Math.floor(seconds));
  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;

  if(h>0){
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function dateISO(date=new Date()){
  const d=new Date(date);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function displayDate(value){
  if(!value) return '';
  const d=new Date(value+'T12:00:00');
  return d.toLocaleDateString('en-GB',{
    day:'2-digit',
    month:'short',
    year:'numeric'
  });
}

function getClient(id){
  return clients.find(c=>c.id===id);
}

function getClientByName(name){
  return clients.find(c=>c.name.toLowerCase()===String(name).toLowerCase());
}

function getWorkedMinutes(job){
  if(job.minutes != null) return Number(job.minutes);

  if(job.start && job.end){
    const a=job.start.split(':').map(Number);
    const b=job.end.split(':').map(Number);
    let mins=(b[0]*60+b[1])-(a[0]*60+a[1]);
    if(mins<0) mins+=1440;
    return mins;
  }

  return 0;
}

function calculateJobPay(job){
  const minutes=getWorkedMinutes(job);
  const rate=Number(job.rate || 0);
  return (minutes/60)*rate;
}

function todayJobs(){
  return jobs.filter(j=>j.date===dateISO());
}

function totalHours(){
  return jobs.reduce((sum,j)=>sum+getWorkedMinutes(j),0);
}

function totalEarned(){
  return jobs.reduce((sum,j)=>sum+calculateJobPay(j),0);
}

function startApp(){
  localStorage.setItem('pureShineStarted','1');
  document.getElementById('welcomeScreen').classList.add('hidden');
  render();
}

function init(){
  if(localStorage.getItem('pureShineStarted')==='1'){
    document.getElementById('welcomeScreen').classList.add('hidden');
  }

function getTodaySchedule(){
  const jsDay=new Date().getDay();
  const day=jsDay===0?7:jsDay;

  return clients.filter(c=>{
    if(c.day!==day) return false;
    if(c.frequency==='Occasional') return false;

    if(c.frequency==='Weekly') return true;

    const today=new Date();
    const week=getWeekNumber(today);

    if(c.frequency==='Fortnightly'){
      return week%2===0;
    }

    if(c.frequency==='Every 3 weeks'){
      return week%3===0;
    }

    return true;
  });
}

function getDateForDay(day){
  const today=new Date();
  const current=today.getDay();
  const diff=day-current;
  const d=new Date(today);
  d.setDate(today.getDate()+diff);
  return d.getDate();
}

function getWeekNumber(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dayNum=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dayNum);
  const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-yearStart)/86400000)+1)/7);
}

function getFreeMinutes(){
  const start=8*60;
  const end=18*60;

  let busy=0;

  getTodaySchedule().forEach(c=>{
    const s=c.start.split(':').map(Number);
    const e=c.end.split(':').map(Number);
    busy+=Math.max(0,(e[0]*60+e[1])-(s[0]*60+s[1]));
  });

  return Math.max(0,end-start-busy);
}

function openTimer(clientId){
  const client=getClient(clientId);
  if(!client) return;

  if(timer.active && timer.clientId!==clientId){
    showToast('Please stop the current timer first.');
    return;
  }

  if(!timer.active){
    timer.active=true;
    timer.clientId=clientId;
    timer.startTimestamp=Date.now();
    timer.elapsedBefore=0;
    startTimerInterval();
  }

  renderTimerModal();
}

function startTimerInterval(){
  clearInterval(timer.interval);

  timer.interval=setInterval(()=>{
    if(timer.active){
      updateTimerDisplay();
    }
  },250);
}

function getTimerElapsedSeconds(){
  if(!timer.active) return timer.elapsedBefore;

  return timer.elapsedBefore + Math.floor((Date.now()-timer.startTimestamp)/1000);
}

function updateTimerDisplay(){
  const element=document.getElementById('liveTimer');

  if(element){
    element.textContent=formatTime(getTimerElapsedSeconds());
  }

  const earn=document.getElementById('liveEarnings');

  if(earn){
    const client=getClient(timer.clientId);
    const seconds=getTimerElapsedSeconds();
    const value=(seconds/3600)*Number(client?.rate || 0);
    earn.textContent=money(value);
  }
}

function renderTimerModal(){
  const client=getClient(timer.clientId);
  if(!client) return;

  openModal(`
    <div class="modal-head">
      <h3>Cleaning Timer</h3>
      <button class="close" onclick="closeTimerWithoutStopping()">×</button>
    </div>

      </div>

    </div>

      </button>

      </button>

    </p>
  `);

  updateTimerDisplay();

}

function stopTimerAndSave(){
  if(!timer.active || !timer.clientId) return;

  const client=getClient(timer.clientId);
  if(!client) return;

  const seconds=getTimerElapsedSeconds();
  const minutes=Math.max(1,Math.round(seconds/60));

  const startDate=new Date(timer.startTimestamp);
  const endDate=new Date();

  const job={
    id:uid('job'),
    clientId:client.id,
    clientName:client.name,
    date:dateISO(startDate),
    start:startDate.toLocaleTimeString('en-GB',{
      hour:'2-digit',
      minute:'2-digit'
    }),
    end:endDate.toLocaleTimeString('en-GB',{
      hour:'2-digit',
      minute:'2-digit'
    }),
    rate:Number(client.rate),
    minutes:minutes,
    status:'Completed',
    source:'timer',
    createdAt:new Date().toISOString()
  };

  job.earnings=calculateJobPay(job);

  jobs.push(job);
  saveJobs();

  clearInterval(timer.interval);

  timer={
    active:false,
    clientId:null,
    startTimestamp:null,
    elapsedBefore:0,
    interval:null
  };

  closeModal();
  render();

  showToast(
    `${client.name} saved: ${formatMinutes(minutes)} · You should receive ${money(job.earnings)}`
  );
}

        <div class="form-group">
          <label>Finish</label>
          <input id="editEnd" type="time" value="${job.end||''}" required>
        </div>
      </div>

      <button class="primary" type="submit">Save & Recalculate</button>

    </form>
  `);
}

function saveEditedJob(e,id){
  e.preventDefault();

  const job=jobs.find(j=>j.id===id);
  if(!job) return;

  const client=getClient(document.getElementById('editClient').value);

  job.clientId=client?.id || job.clientId;
  job.clientName=client?.name || job.clientName;
  job.date=document.getElementById('editDate').value;
  job.rate=Number(document.getElementById('editRate').value);
  job.start=document.getElementById('editStart').value;
  job.end=document.getElementById('editEnd').value;
  job.minutes=getWorkedMinutes(job);
  job.earnings=calculateJobPay(job);

  saveJobs();
  closeModal();
  render();

  showToast(`Job updated · ${formatMinutes(job.minutes)} · ${money(job.earnings)}`);
}

function deleteJob(id){
  const job=jobs.find(j=>j.id===id);
  if(!job) return;

  if(!confirm(`Delete the ${job.clientName} job from ${displayDate(job.date)}?`)) return;

  jobs=jobs.filter(j=>j.id!==id);
  saveJobs();
  render();

  showToast('Job deleted');
}

function renderHolidays(){
  const holidays=JSON.parse(localStorage.getItem('pureShineHolidays')||'[]');

  if(!holidays.length){
    return `
      <div class="empty">
        No holidays added yet.<br><br>
        <button class="primary" onclick="addHoliday()">＋ Add Holiday</button>
      </div>`;
  }

  return `
    ${holidays.map((h,i)=>`
      <div class="setting-card holiday">
        <div>
          <strong>${escapeHTML(h.clientName)}</strong>
          <div class="holiday-date">${displayDate(h.start)} – ${displayDate(h.end)}</div>
        </div>
        <button class="small-btn" onclick="deleteHoliday(${i})">🗑️</button>
      </div>
    `).join('')}

    <button class="primary" onclick="addHoliday()">＋ Add Holiday</button>
  `;
}

function addHoliday(){
  const list=JSON.parse(localStorage.getItem('pureShineHolidays')||'[]');

  openModal(`
    <div class="modal-head">
      <h3>Client Holiday</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <form onsubmit="saveHoliday(event)">

      <div class="form-group">
        <label>Client</label>
        <select id="holidayClient" required>
          ${clients.map(c=>`<option value="${c.id}">${escapeHTML(c.name)}</option>`).join('')}
        </select>
      </div>

      <div class="two">
        <div class="form-group">
          <label>From</label>
          <input id="holidayStart" type="date" required>
        </div>

        <div class="form-group">
          <label>Until</label>
          <input id="holidayEnd" type="date" required>
        </div>
      </div>

      <button class="primary" type="submit">Save Holiday</button>

    </form>
  `);
}

function saveHoliday(e){
  e.preventDefault();

  const list=JSON.parse(localStorage.getItem('pureShineHolidays')||'[]');
  const client=getClient(document.getElementById('holidayClient').value);

  list.push({
    clientId:client.id,
    clientName:client.name,
    start:document.getElementById('holidayStart').value,
    end:document.getElementById('holidayEnd').value
  });

  localStorage.setItem('pureShineHolidays',JSON.stringify(list));

  closeModal();
  render();

  showToast(`${client.name}'s holiday saved`);
}

function deleteHoliday(index){
  const list=JSON.parse(localStorage.getItem('pureShineHolidays')||'[]');
  list.splice(index,1);
  localStorage.setItem('pureShineHolidays',JSON.stringify(list));
  render();
}

function toggleSetting(key){
  appSettings[key]=!appSettings[key];
  saveSettings();
  render();
}

function changeZoom(amount){
  appSettings.zoom=Math.min(200,Math.max(100,appSettings.zoom+amount));
  saveSettings();
  applyZoom();
  render();
}

function setZoom(value){
  appSettings.zoom=Math.min(200,Math.max(100,Number(value)));
  saveSettings();
  applyZoom();
}

function applyZoom(){
  const app=document.getElementById('app');
  if(!app) return;

  app.style.zoom=(appSettings.zoom/100);

  if(appSettings.zoom>100){
    app.style.maxWidth='520px';
  }
}

function openSettings(){
  showPage('settings');
}

function exportData(){
  const data={
    clients,
    jobs,
    settings:appSettings,
    holidays:JSON.parse(localStorage.getItem('pureShineHolidays')||'[]'),
    exportedAt:new Date().toISOString()
  };

  const blob=new Blob([JSON.stringify(data,null,2)],{
    type:'application/json'
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='pure-shine-cleaning-manager-backup.json';
  a.click();
  URL.revokeObjectURL(url);

  showToast('Backup exported');
}

function confirmClearJobs(){
  if(!jobs.length) return;

  if(!confirm('Delete ALL saved job history? This cannot be undone.')) return;

  jobs=[];
  saveJobs();
  render();

  showToast('All job history deleted');
}

function escapeHTML(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHTML(value);
}

function showToast(message){
  const toast=document.getElementById('toast');

  toast.textContent=message;
  toast.classList.add('show');

  clearTimeout(showToast.timeout);

  showToast.timeout=setTimeout(()=>{
    toast.classList.remove('show');
  },3200);
}

/* Restore timer after accidental page/modal redraw.
   The exact start timestamp is kept in memory while the page is open. */
window.addEventListener('beforeunload',()=>{
  if(timer.active){
    sessionStorage.setItem('pureShineTimer',JSON.stringify({
      active:true,
      clientId:timer.clientId,
      startTimestamp:timer.startTimestamp,
      elapsedBefore:timer.elapsedBefore
    }));
  }
});

function restoreTimer(){
  const saved=sessionStorage.getItem('pureShineTimer');

  if(!saved) return;

  try{
    const data=JSON.parse(saved);

    if(data.active && data.clientId){
      timer={
        active:true,
        clientId:data.clientId,
        startTimestamp:data.startTimestamp,
        elapsedBefore:data.elapsedBefore || 0,
        interval:null
      };

      startTimerInterval();
    }
  }catch(e){}
}

window.addEventListener('load',()=>{
  restoreTimer();
  init();
});

document.addEventListener('visibilitychange',()=>{
  if(timer.active){
    updateTimerDisplay();
  }
});

/*
  IMPORTANT TIMER CALCULATION:

  When the user presses "Stop & Save Job":
  1. The exact start timestamp is compared with the exact current timestamp.
  2. The result is rounded to the nearest whole minute.
  3. The exact worked minutes are stored inside the job.
  4. Payment is calculated automatically:
     
     worked minutes / 60 × hourly rate

  Example:
  6h 26m × £16/hour
  = 6.4333 hours × £16
  = £102.93

  The saved job therefore keeps:
  - client
  - date
  - exact start
  - exact finish
  - exact minutes worked
  - hourly rate
  - calculated earnings
  - completed status
*/
</script>

</body>
</html>
