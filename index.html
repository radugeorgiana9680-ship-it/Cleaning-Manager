<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9dce8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light-content">
<meta name="apple-mobile-web-app-title" content="Cleaning Manager">

<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
  --pink:#f7d8e5;
  --pink-light:#fff1f6;
  --pink-soft:#fde5ee;
  --pink-button:#e986a9;
  --pink-dark:#c95578;
  --blue:#e4edff;
  --blue-text:#23589a;
  --green:#e1f3e8;
  --green-text:#28754d;
  --yellow:#fff1c9;
  --yellow-text:#a87300;
  --purple:#eee0fb;
  --purple-text:#7041a3;
  --peach:#fde5df;
  --peach-text:#bd674b;
  --text:#151515;
  --muted:#77737a;
  --white:#fff;
  --shadow:0 3px 14px rgba(180,105,135,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f8dbe7;
  font-family:'DM Sans',sans-serif;
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;
  background:#fff;
  position:relative;
  padding-bottom:96px;
  overflow:hidden;
}

/* WELCOME */

.welcome{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#f8dbe7;
  display:flex;
  align-items:center;
  justify-content:center;
}

.welcome-background{
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(255,247,249,.10),rgba(255,247,249,.18)),
    url('pure-shine-cleaning-background.png') center center/cover no-repeat;
}

.welcome-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(255,238,245,.02) 0%,
    rgba(255,235,243,.05) 55%,
    rgba(255,236,244,.30) 100%
  );
}

.welcome-content{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:max(38px,env(safe-area-inset-top)) 28px max(25px,env(safe-area-inset-bottom));
}

.welcome-logo{
  width:285px;
  height:285px;
  object-fit:contain;
  margin-top:34px;
  filter:drop-shadow(0 7px 8px rgba(120,75,80,.13));
}

.welcome-tagline{
  margin-top:0;
  text-align:center;
  font-family:'Parisienne',cursive;
  color:#a84667;
  font-size:46px;
  line-height:.95;
  text-shadow:0 1px 1px rgba(255,255,255,.6);
}

.welcome-heart{
  font-family:'Parisienne',cursive;
  color:#e15e82;
  font-size:54px;
  line-height:1;
  margin-top:5px;
}

.welcome-feature-row{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:24px;
}

.welcome-feature{
  min-height:86px;
  border-radius:16px;
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(5px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#2c2629;
}

.welcome-feature .icon{
  color:#c65d7e;
  font-size:30px;
  line-height:1;
  margin-bottom:7px;
}

.welcome-feature span{
  font-size:12px;
  line-height:1.25;
}

.welcome-bottom{
  width:100%;
  margin-top:auto;
}

.get-started{
  width:100%;
  height:66px;
  border-radius:34px;
  background:#e887a8;
  color:#fff;
  font-size:20px;
  font-weight:500;
  box-shadow:0 7px 17px rgba(190,80,115,.17);
}

.login{
  text-align:center;
  margin-top:22px;
  color:#67545b;
  font-size:15px;
}

.login a{
  color:#a84667;
  text-decoration:underline;
  font-weight:600;
  margin-left:5px;
}

/* HEADER */

.header{
  padding:max(17px,env(safe-area-inset-top)) 18px 9px;
  background:#fff;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-logo{
  width:60px;
  height:60px;
  object-fit:contain;
}

.brand-copy{
  display:flex;
  flex-direction:column;
}

.brand-title{
  font-size:22px;
  line-height:1.1;
  font-weight:700;
  letter-spacing:-.4px;
}

.brand-sub{
  margin-top:3px;
  color:#77747a;
  font-size:14px;
}

.bell{
  width:47px;
  height:47px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}

/* MAIN */

.page{
  padding:0 15px 24px;
}

.date-banner{
  margin-top:8px;
  min-height:82px;
  border-radius:20px;
  background:#f9dce8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 18px;
}

.date-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.date-icon{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c84e73;
  font-size:31px;
}

.date-main{
  font-size:18px;
  font-weight:600;
  line-height:1.2;
}

.date-sub{
  margin-top:4px;
  color:#77737a;
  font-size:14px;
}

.date-heart{
  font-size:34px;
  color:#df6e91;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:11px;
}

.stat{
  min-height:111px;
  border-radius:18px;
  padding:12px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stat:nth-child(1){background:#fde3ed}
.stat:nth-child(2){background:#e4edff}
.stat:nth-child(3){background:#e0f2e7}
.stat:nth-child(4){background:#fff0c7}

.stat-icon{
  font-size:27px;
  line-height:1;
  margin-bottom:6px;
}

.stat:nth-child(1) .stat-icon{color:#c54870}
.stat:nth-child(2) .stat-icon{color:#3167a5}
.stat:nth-child(3) .stat-icon{color:#2f8153}
.stat:nth-child(4) .stat-icon{color:#b67b00}

.stat-value{
  font-size:20px;
  font-weight:700;
  line-height:1.15;
}

.stat-label{
  font-size:12px;
  margin-top:3px;
  color:#514b50;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:21px 2px 10px;
}

.section-head h2{
  margin:0;
  font-size:21px;
  letter-spacing:-.4px;
}

.section-link{
  color:#aa4265;
  font-size:14px;
  font-weight:500;
}

.today-card{
  min-height:215px;
  border-radius:20px;
  background:#fff;
  border:1px solid #f3edf0;
  box-shadow:var(--shadow);
  padding:18px 16px 15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.today-empty-icon{
  color:#ed9ab4;
  font-size:53px;
  line-height:1;
  margin-bottom:13px;
}

.today-empty-title{
  font-size:17px;
  font-weight:500;
}

.today-empty-sub{
  color:#77737a;
  font-size:13px;
  margin-top:5px;
}

.add-job-main{
  width:100%;
  height:52px;
  border-radius:28px;
  background:#e885a7;
  color:#fff;
  font-size:17px;
  margin-top:17px;
}

/* SCHEDULE */

.schedule-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  background:#fff;
  border:1px solid #f3e8ed;
  border-radius:18px;
  margin-bottom:8px;
  box-shadow:var(--shadow);
}

.schedule-person{
  display:flex;
  align-items:center;
  gap:12px;
}

.schedule-avatar{
  width:47px;
  height:47px;
  border-radius:15px;
  background:#fce5ed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c95779;
  font-size:22px;
}

.schedule-name{
  font-weight:700;
  font-size:15px;
}

.schedule-time{
  color:#77737a;
  font-size:12px;
  margin-top:3px;
}

.schedule-rate{
  color:#a9687c;
  font-weight:700;
  font-size:13px;
}

.schedule-actions{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
}

.reminder-mini{
  height:31px;
  padding:0 9px;
  border-radius:10px;
  background:#fce4ed;
  color:#a64061;
  font-size:10px;
  font-weight:600;
}

/* QUICK ACTIONS */

.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.quick{
  min-height:63px;
  border-radius:17px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  text-align:left;
}

.quick-icon{
  width:31px;
  flex:none;
  font-size:26px;
  text-align:center;
}

.quick-text{
  font-size:16px;
  font-weight:500;
}

.quick-blue{background:#e4efff;color:#235a98}
.quick-green{background:#dff2e6;color:#27734c}
.quick-pink{background:#fce1ec;color:#9e3e60}
.quick-yellow{background:#fff0c7;color:#1c1c1c}
.quick-purple{background:#eee0fa;color:#6e3aa0}
.quick-peach{background:#fde5de;color:#bb6348}

.quote-banner{
  position:relative;
  overflow:hidden;
  min-height:116px;
  margin-top:13px;
  border-radius:18px;
  background:linear-gradient(90deg,rgba(255,225,235,.96),rgba(255,218,230,.88));
  display:flex;
  align-items:center;
  padding:17px 50px 17px 55px;
}

.quote-banner:after{
  content:'';
  position:absolute;
  right:-30px;
  top:-20px;
  width:150px;
  height:150px;
  background:url('pure-shine-cleaning-background.png') right center/cover no-repeat;
  opacity:.6;
  border-radius:50%;
}

.quote-heart{
  position:absolute;
  left:18px;
  font-size:39px;
  color:#df6e91;
  z-index:2;
}

.quote-text{
  position:relative;
  z-index:2;
  font-family:'Parisienne',cursive;
  color:#9e5b71;
  font-size:31px;
  line-height:1;
  text-align:center;
}

.quote-text:before{
  content:'♡';
  margin-right:7px;
  font-family:Arial,sans-serif;
  font-size:29px;
}

.quote-text:after{
  content:'♡';
  margin-left:7px;
  font-family:Arial,sans-serif;
  font-size:29px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:300;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);
  min-height:78px;
  padding:7px 7px max(7px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);
  border-top:1px solid #eee6e9;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  min-height:65px;
  border-radius:17px;
  background:transparent;
  color:#777983;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:11px;
}

.nav-icon{
  font-size:25px;
  line-height:1;
}

.nav-btn.active{
  color:#bd426b;
  background:#fde5ef;
}

.fab{
  position:fixed;
  z-index:250;
  right:max(17px,calc(50% - 242px));
  bottom:93px;
  width:57px;
  height:57px;
  border-radius:50%;
  background:#e887a8;
  color:#fff;
  font-size:30px;
  box-shadow:0 7px 20px rgba(180,75,110,.22);
}

/* OTHER PAGES */

.page-title{
  margin:13px 2px 15px;
  font-size:27px;
  font-weight:700;
}

.week-row{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:4px;
}

.week-row::-webkit-scrollbar{
  display:none;
}

.week-day{
  flex:0 0 69px;
  min-height:75px;
  border-radius:16px;
  background:#fff;
  border:1px solid #f1e7eb;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.week-day.today{
  background:#f9dce8;
  color:#a33d60;
}

.week-day small{
  font-size:11px;
  color:#77737a;
}

.week-day strong{
  margin-top:4px;
  font-size:19px;
}

.day-title{
  margin:19px 2px 8px;
  color:#a04e6b;
  font-size:17px;
  font-weight:700;
}

.empty{
  background:#fff;
  border:1px solid #f2e8ec;
  border-radius:19px;
  padding:27px 15px;
  text-align:center;
  color:#77737a;
}

/* CLIENTS */

.client-card{
  background:#fff;
  border:1px solid #f1e8eb;
  border-radius:19px;
  padding:14px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.client-main{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.client-avatar{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#fce4ed;
  color:#c45173;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex:none;
}

.client-name{
  font-weight:700;
  font-size:15px;
}

.client-meta{
  color:#77737a;
  font-size:11px;
  margin-top:3px;
}

.client-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.small-btn{
  width:37px;
  height:37px;
  border-radius:11px;
  background:#f9edf2;
  color:#8f5369;
}

.send-reminder-btn{
  height:37px;
  padding:0 10px;
  border-radius:11px;
  background:#e9f0ff;
  color:#285a94;
  font-size:11px;
  font-weight:600;
}

/* EARNINGS */

.earning-total{
  margin-top:13px;
  padding:24px 18px;
  border-radius:21px;
  background:linear-gradient(135deg,#fde4ee,#fff1d0);
  text-align:center;
}

.earning-total-title{
  font-size:14px;
  color:#70676c;
}

.money{
  color:#a14d69;
  font-size:38px;
  font-weight:700;
  margin-top:5px;
}

.hours{
  margin-top:5px;
  color:#77737a;
  font-size:13px;
}

.job-card{
  background:#fff;
  border:1px solid #f0e7ea;
  border-radius:18px;
  padding:15px;
  margin-bottom:9px;
}

.job-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.job-client{
  font-weight:700;
}

.job-date{
  font-size:11px;
  color:#77737a;
  margin-top:3px;
}

.job-status{
  background:#e0f1e6;
  color:#377552;
  border-radius:10px;
  padding:5px 8px;
  height:max-content;
  font-size:10px;
  font-weight:700;
}

.job-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:12px;
}

.job-info-box{
  background:#fff5f8;
  border-radius:11px;
  padding:9px 7px;
}

.job-info-box small{
  display:block;
  color:#8b8085;
  font-size:9px;
}

.job-info-box strong{
  display:block;
  margin-top:2px;
  font-size:12px;
}

.job-buttons{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.job-buttons button{
  flex:1;
  height:36px;
  border-radius:11px;
  background:#f8edf2;
  color:#765a65;
  font-size:12px;
}

/* SETTINGS */

.setting-card{
  background:#fff;
  border:1px solid #f0e7ea;
  border-radius:20px;
  padding:5px 16px;
  margin-bottom:12px;
}

.setting-row{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #f2eaed;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-name{
  font-size:14px;
  font-weight:600;
}

.setting-description{
  color:#77737a;
  font-size:11px;
  margin-top:3px;
}

.switch{
  width:49px;
  height:28px;
  padding:3px;
  border-radius:20px;
  background:#ddd;
}

.switch i{
  display:block;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch.on{
  background:#df89a6;
}

.switch.on i{
  transform:translateX(21px);
}

.zoom-controls{
  display:flex;
  align-items:center;
  gap:7px;
}

.zoom-value{
  min-width:48px;
  text-align:center;
  color:#ad5671;
  font-weight:700;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(35,25,30,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:27px 27px 0 0;
  padding:19px 16px calc(23px + env(safe-area-inset-bottom));
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.modal-head h3{
  margin:0;
  font-size:21px;
}

.close{
  width:39px;
  height:39px;
  border-radius:13px;
  background:#f8edf1;
  font-size:23px;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  color:#72686d;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  min-height:46px;
  padding:10px 12px;
  border:1px solid #eadde2;
  border-radius:13px;
  outline:none;
  background:#fffafc;
}

.form-group textarea{
  resize:vertical;
  min-height:90px;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.primary{
  width:100%;
  min-height:49px;
  border-radius:25px;
  background:#e887a8;
  color:#fff;
  font-weight:600;
}

.secondary{
  background:#f5edf1!important;
  color:#765b65!important;
}

.danger{
  background:#f4d8df!important;
  color:#95586a!important;
}

.whatsapp{
  background:#dff3e5!important;
  color:#267349!important;
}

.sms{
  background:#e4edff!important;
  color:#2b5d98!important;
}

/* TIMER */

.timer-box{
  border-radius:23px;
  padding:25px 15px;
  text-align:center;
  background:linear-gradient(135deg,#fde5ee,#fff1d4);
}

.timer-client{
  font-size:20px;
  font-weight:700;
}

.timer-live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#9a6172;
  font-size:11px;
  margin-top:7px;
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#db6f8d;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.75);
  }
}

.timer-time{
  margin:12px 0;
  font-size:52px;
  font-weight:700;
  letter-spacing:1px;
  color:#704e5c;
}

.timer-rate{
  color:#a45d74;
  font-weight:700;
}

.timer-earnings{
  margin-top:13px;

/* FORMATTERS */

function money(value){
  return '£'+Number(value||0).toFixed(2);
}

function formatMinutes(minutes){

  minutes=Math.max(
    0,
    Math.round(Number(minutes)||0)
  );

  const hours=Math.floor(minutes/60);
  const mins=minutes%60;

  return `${hours}h ${String(mins).padStart(2,'0')}m`;
}

function formatTime(seconds){

  seconds=Math.max(0,Math.floor(seconds));

  const hours=Math.floor(seconds/3600);

  const mins=Math.floor((seconds%3600)/60);

  const secs=seconds%60;

  if(hours>0){

    return `${String(hours).padStart(2,'0')}:`+
           `${String(mins).padStart(2,'0')}:`+
           `${String(secs).padStart(2,'0')}`;

  }

  return `${String(mins).padStart(2,'0')}:`+
         `${String(secs).padStart(2,'0')}`;
}

function dateISO(date=new Date()){

  const d=new Date(date);

  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

function displayDate(value){

  if(!value)return '';

  const d=new Date(value+'T12:00:00');

  return d.toLocaleDateString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );
}

function escapeHTML(value){

  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHTML(value);
}


/* DATA */

function getClient(id){
  return clients.find(c=>c.id===id);
}

function getWorkedMinutes(job){

  if(job.minutes!=null){
    return Number(job.minutes);
  }

  if(job.start&&job.end){

    const a=job.start.split(':').map(Number);
    const b=job.end.split(':').map(Number);

    let mins=
      (b[0]*60+b[1])-
      (a[0]*60+a[1]);

    if(mins<0){
      mins+=1440;
    }

    return mins;
  }

  return 0;
}

function calculateJobPay(job){

  return(
    getWorkedMinutes(job)/60
  )*Number(job.rate||0);
}

function todayJobs(){

  return jobs.filter(
    j=>j.date===dateISO()

function totalHours(){

  return jobs.reduce(
    (sum,j)=>sum+getWorkedMinutes(j),

  );
}

function totalEarned(){

  return jobs.reduce(
    (sum,j)=>sum+calculateJobPay(j),

  );
}

  html+=`

        .sort(

/* EARNINGS */

function earningsPage(){

  const completed=
    jobs.filter(
      j=>j.status==='Completed'
    );

  const byClient={};

  completed.forEach(job=>{

    const name=job.clientName||'Unknown';

    if(!byClient[name]){
      byClient[name]={
        minutes:0,
        earnings:0,
        count:0
      };
    }

    byClient[name].minutes+=
      getWorkedMinutes(job);

    byClient[name].earnings+=
      calculateJobPay(job);

    byClient[name].count++;

  });


  return`

  <section class="page">

    <div class="page-title">

/* TODAY SCHEDULE */

function getTodaySchedule(){

  const jsDay=new Date().getDay();

  const day=jsDay===0?7:jsDay;

  return clients.filter(c=>{

    if(c.day!==day){
      return false;
    }

    if(c.frequency==='Occasional'){
      return false;
    }

    if(c.frequency==='Weekly'){
      return true;
    }

    const week=getWeekNumber(new Date());

    if(c.frequency==='Fortnightly'){
      return week%2===0;
    }

    if(c.frequency==='Every 3 weeks'){
      return week%3===0;
    }

    return true;
  });
}


/* DATE / WEEK */

function getDateForDay(day){

  const today=new Date();

  const current=today.getDay();

  const diff=day-current;

  const d=new Date(today);

  d.setDate(
    today.getDate()+diff
  );

  return d.getDate();
}

function getWeekNumber(date){

  const d=
    new Date(
      Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      )
    );

  const dayNum=d.getUTCDay()||7;

  d.setUTCDate(
    d.getUTCDate()+4-dayNum
  );

  const yearStart=
    new Date(
      Date.UTC(
        d.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (((d-yearStart)/86400000)+1)/7
  );
}


/* FREE MINUTES */

function getFreeMinutes(){

  const start=8*60;
  const end=18*60;

  let busy=0;

  getTodaySchedule().forEach(c=>{

    const s=c.start.split(':').map(Number);
    const e=c.end.split(':').map(Number);

    busy+=Math.max(
      0,
      (e[0]*60+e[1])-
      (s[0]*60+s[1])
    );

  });

  return Math.max(
    0,
    end-start-busy
  );
}

/* TIMER */

function openTimer(clientId){

  const client=getClient(clientId);

  if(!client)return;

  if(
    timer.active&&
    timer.clientId!==clientId
  ){

    showToast(
      'Please stop the current timer first.'
    );

    return;
  }

  if(!timer.active){

    timer.active=true;
    timer.clientId=clientId;
    timer.startTimestamp=Date.now();
    timer.elapsedBefore=0;

    startTimerInterval();
  }

  renderTimerModal();
}

function startTimerInterval(){

  clearInterval(timer.interval);

  timer.interval=
    setInterval(
      ()=>{
        if(timer.active){
          updateTimerDisplay();
        }
      },
      250
    );
}

function getTimerElapsedSeconds(){

  if(!timer.active){
    return timer.elapsedBefore;
  }

  return timer.elapsedBefore+
    Math.floor(
      (Date.now()-timer.startTimestamp)/1000
    );
}

function updateTimerDisplay(){

  const timerElement=
    document.getElementById('liveTimer');

  if(timerElement){

    timerElement.textContent=
      formatTime(
        getTimerElapsedSeconds()
      );

  }

  const earningElement=
    document.getElementById('liveEarnings');

  if(earningElement){

    const client=getClient(timer.clientId);

    const seconds=getTimerElapsedSeconds();

    const value=
      (seconds/3600)*
      Number(client?.rate||0);

    earningElement.textContent=money(value);
  }
}

function stopTimerAndSave(){

  if(!timer.active||!timer.clientId){
    return;
  }

  const client=getClient(timer.clientId);

  if(!client)return;

  const seconds=getTimerElapsedSeconds();

  const minutes=Math.max(
    1,
    Math.round(seconds/60)
  );

  const startDate=
    new Date(timer.startTimestamp);

  const endDate=new Date();

  const job={
    id:uid('job'),
    clientId:client.id,
    clientName:client.name,
    date:dateISO(startDate),

    start:startDate.toLocaleTimeString(
      'en-GB',
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    ),

    end:endDate.toLocaleTimeString(
      'en-GB',
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    ),

    rate:Number(client.rate),
    minutes,
    status:'Completed',
    source:'timer',
    createdAt:new Date().toISOString()
  };

  job.earnings=calculateJobPay(job);

  jobs.push(job);

  saveJobs();

  clearInterval(timer.interval);

  timer={
    active:false,
    clientId:null,
    startTimestamp:null,
    elapsedBefore:0,
    interval:null
  };

  sessionStorage.removeItem('pureShineTimer');

  closeModal();
  render();

  showToast(
    `${client.name} saved · `+
    `${formatMinutes(minutes)} · `+
    `You should receive ${money(job.earnings)}`
  );
}

/* CLIENT REMINDER */

function buildReminderMessage(client){

  if(client.reminder){
    return client.reminder;
  }

  const today=
    new Intl.DateTimeFormat(
      'en-GB',
      {
        weekday:'long',
        day:'numeric',
        month:'long'
      }
    ).format(new Date());

  return(
    `Hi ${client.name}, just a quick reminder `+
    `that I'm coming for your cleaning today, `+
    `${client.start}. See you soon! 💕✨`
  );
}

function cleanPhone(phone){

  return String(phone||'')
    .trim()
    .replace(/[^\d+]/g,'');
}

function sendClientReminder(clientId,method='choose'){

  const client=getClient(clientId);

  if(!client)return;

  if(!client.phone){

    showToast(
      'Please add the client phone number first.'
    );

    setTimeout(
      ()=>editClient(client.id),
      400
    );

    return;
  }

  const message=
    buildReminderMessage(client);

  const phone=
    cleanPhone(client.phone);

  if(method==='choose'){

    openReminderChoice(
      client,
      phone,
      message
    );

    return;
  }

  if(method==='sms'){

    const smsURL=
      'sms:'+phone+
      '&body='+
      encodeURIComponent(message);

    window.location.href=smsURL;

    return;
  }

  if(method==='whatsapp'){

    let whatsappPhone=
      phone.replace(/\+/g,'');

    if(
      whatsappPhone.startsWith('0')
    ){
      whatsappPhone=
        '44'+
        whatsappPhone.substring(1);
    }

    const url=
      'https://wa.me/'+
      whatsappPhone+
      '?text='+
      encodeURIComponent(message);

    window.location.href=url;

    return;
  }
}

    job.clientId;

  job.clientName=
    client?.name||
    job.clientName;

  job.date=
    document
      .getElementById('editDate')
      .value;

  job.rate=
    Number(
      document
        .getElementById('editRate')
        .value
    );

  job.start=
    document
      .getElementById('editStart')
      .value;

  job.end=
    document
      .getElementById('editEnd')
      .value;

  job.minutes=getWorkedMinutes(job);

  job.earnings=calculateJobPay(job);

  saveJobs();

  closeModal();
  render();

  showToast(
    `Job updated · `+
    `${formatMinutes(job.minutes)} · `+
    `${money(job.earnings)}`
  );
}

function deleteJob(id){

  const job=
    jobs.find(j=>j.id===id);

  if(!job)return;

  if(
    !confirm(
      `Delete the ${job.clientName} job from ${displayDate(job.date)}?`
    )
  ){
    return;
  }

  jobs=
    jobs.filter(j=>j.id!==id);

  saveJobs();

  render();

  showToast('Job deleted');
}


/* HOLIDAYS */

function renderHolidays(){

  if(!holidays.length){

    return`

      <div class="empty">

        No holidays added yet.

        <br><br>

        <button
          class="primary"
          onclick="addHoliday()"
        >
          ＋ Add Holiday
        </button>

      </div>

    `;
  }

  return`

    ${
      holidays.map(
        (h,i)=>`

        <div class="client-card">

          <div>

            <div class="client-name">
              ${escapeHTML(h.clientName)}
            </div>

            <div class="client-meta">
              ${displayDate(h.start)}
              –
              ${displayDate(h.end)}
            </div>

          </div>

          <button
            class="small-btn"
            onclick="deleteHoliday(${i})"
          >
            ×
          </button>

        </div>

        `
      ).join('')
    }

    <button
      class="primary"
      onclick="addHoliday()"
    >
      ＋ Add Holiday
    </button>

  `;
}

function showHolidaysPage(){

  currentPage='clients';

  render();

  setTimeout(
    ()=>{
      const el=
        document.querySelector(
          '.section-head:last-of-type'
        );

      if(el){
        el.scrollIntoView({
          behavior:'smooth'
        });
      }
    },
    100
  );
}

function addHoliday(){

  openModal(`

    <div class="modal-head">

      <h3>Client Holiday</h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <form onsubmit="saveHoliday(event)">

      <div class="form-group">

        <label>Client</label>

        <select
          id="holidayClient"
          required
        >

          ${
            clients.map(
              c=>`
              <option value="${c.id}">
                ${escapeHTML(c.name)}
              </option>
              `
            ).join('')
          }

        </select>

      </div>


      <div class="two">

        <div class="form-group">

          <label>From</label>

          <input
            id="holidayStart"
            type="date"
            required
          >

        </div>


        <div class="form-group">

          <label>Until</label>

          <input
            id="holidayEnd"
            type="date"
            required
          >

        </div>

      </div>


      <button
        class="primary"
        type="submit"
      >
        Save Holiday
      </button>

    </form>

  `);
}

function saveHoliday(e){

  e.preventDefault();

  const client=
    getClient(
      document
        .getElementById('holidayClient')
        .value
    );

  if(!client)return;

  holidays.push({

    clientId:client.id,

    clientName:client.name,

    start:
      document
        .getElementById('holidayStart')
        .value,

    end:
      document
        .getElementById('holidayEnd')
        .value

  });

  saveHolidays();

  closeModal();
  render();

  showToast(
    `${client.name}'s holiday saved`
  );
}

function deleteHoliday(index){

  holidays.splice(index,1);

  saveHolidays();

  render();
}


/* NOTIFICATIONS */

function openNotifications(){

  const today=getTodaySchedule();

  openModal(`

    <div class="modal-head">

      <h3>
        Reminders
      </h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    ${
      today.length
      ?
      today.map(
        client=>`

        <div class="client-card">

          <div>

            <div class="client-name">
              ${escapeHTML(client.name)}
            </div>

            <div class="client-meta">
              Today · ${client.start}
            </div>

          </div>

          ${
            client.phone
            ?
            `
            <button
              class="send-reminder-btn"
              onclick="sendClientReminder('${client.id}')"
            >
              Send
            </button>
            `
            :
            `
            <button
              class="send-reminder-btn"
              onclick="editClient('${client.id}')"
            >
              Add phone
            </button>
            `
          }

        </div>

        `
      ).join('')
      :
      `
      <div class="empty">
        No client reminders for today 🌸
      </div>
      `
    }

  `);
}


/* SETTINGS */

function openSettings(){

  openModal(`

    <div class="modal-head">

      <h3>Settings</h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div class="setting-card">

      <div class="setting-row">

        <div>

          <div class="setting-name">
            Evening reminders
          </div>

          <div class="setting-description">
            Reminder before tomorrow's cleaning
          </div>

        </div>

        <button
          class="switch ${appSettings.reminders?'on':''}"
          onclick="toggleSetting('reminders')"
        >
          <i></i>
        </button>

      </div>


      <div class="setting-row">

        <div>

          <div class="setting-name">
            Calendar sync
          </div>

          <div class="setting-description">
            Keep your cleaning schedule visible
          </div>

        </div>

        <button
          class="switch ${appSettings.calendar?'on':''}"
          onclick="toggleSetting('calendar')"
        >
          <i></i>
        </button>

      </div>


      <div class="setting-row">

        <div>

          <div class="setting-name">
            App zoom
          </div>

          <div class="setting-description">
            Make the app easier to read
          </div>

        </div>

        <div class="zoom-controls">

          <button
            class="small-btn"
            onclick="changeZoom(-10)"
          >
            −
          </button>

          <span class="zoom-value">
            ${appSettings.zoom}%
          </span>

          <button
            class="small-btn"
            onclick="changeZoom(10)"
          >
            +
          </button>

        </div>

      </div>

    </div>


    <button
      class="primary"
      onclick="openAddJob()"
    >
      ＋ Add Past Job
    </button>

    <br><br>

    <button
      class="primary secondary"
      onclick="exportData()"
    >
      Export Data
    </button>

    <br><br>

    <button
      class="primary danger"
      onclick="confirmClearJobs()"
    >
      Delete All Job History
    </button>

  `);
}

function toggleSetting(key){

  appSettings[key]=!appSettings[key];

  saveSettings();

  openSettings();
}

function changeZoom(amount){

  appSettings.zoom=
    Math.min(
      200,
      Math.max(
        100,
        appSettings.zoom+amount
      )
    );

  saveSettings();

  applyZoom();

  openSettings();
}

function applyZoom(){

  const app=
    document.getElementById('app');

  if(!app)return;

  app.style.zoom=
    appSettings.zoom/100;
}


/* MODAL */

function openModal(content){

  document.getElementById('modal').innerHTML=content;

  document
    .getElementById('modalBackdrop')
    .classList.add('show');
}

function closeModal(){

  document
    .getElementById('modalBackdrop')
    .classList.remove('show');
}

function backdropClose(e){

  if(e.target.id==='modalBackdrop'){
    closeModal();
  }
}


/* EXPORT */

function exportData(){

  const data={
    clients,
    jobs,
    holidays,
    settings:appSettings,
    exportedAt:new Date().toISOString()
  };

  const blob=
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:'application/json'}
    );

  const url=
    URL.createObjectURL(blob);

  const a=document.createElement('a');

  a.href=url;

  a.download=
    'pure-shine-cleaning-manager-backup.json';

  a.click();

  URL.revokeObjectURL(url);

  showToast('Backup exported');
}

function confirmClearJobs(){

  if(!jobs.length)return;

  if(
    !confirm(
      'Delete ALL saved job history?'
    )
  ){
    return;
  }

  jobs=[];

  saveJobs();

  closeModal();
  render();

  showToast(
    'All job history deleted'
  );
}


/* TOAST */

function showToast(message){

  const toast=
    document.getElementById('toast');

  toast.textContent=message;

  toast.classList.add('show');

  clearTimeout(showToast.timeout);

  showToast.timeout=
    setTimeout(
      ()=>{
        toast.classList.remove('show');
      },
      3200
    );
}


/* TIMER PERSISTENCE */

window.addEventListener(
  'beforeunload',
  ()=>{
    if(timer.active){

      sessionStorage.setItem(
        'pureShineTimer',
        JSON.stringify({

          active:true,

          clientId:
            timer.clientId,

          startTimestamp:
            timer.startTimestamp,

          elapsedBefore:
            timer.elapsedBefore

        })
      );
    }
  }
);

function restoreTimer(){

  const saved=
    sessionStorage.getItem(
      'pureShineTimer'
    );

  if(!saved)return;

  try{

    const data=JSON.parse(saved);

    if(data.active&&data.clientId){

      timer={
        active:true,
        clientId:data.clientId,
        startTimestamp:data.startTimestamp,
        elapsedBefore:data.elapsedBefore||0,
        interval:null
      };

      startTimerInterval();
    }

  }catch(e){}
}

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(timer.active){
      updateTimerDisplay();
    }
  }
);


/* START */

window.addEventListener(
  'load',
  init
);

</script>

</body>
</html>
