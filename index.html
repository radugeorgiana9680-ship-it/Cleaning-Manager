<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#f8dce8">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pure Shine Cleaning Manager</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-width:100%;
    min-height:100%;
    overflow-x:hidden;
    background:#f8dce8;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%;
}

body{
    width:100vw;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
}

/* =========================================================
   APP — FULL WIDTH, NO EMPTY PINK SIDES
   ========================================================= */

#app{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    background:#fffafd;
    padding-bottom:95px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    width:100%;
    height:100px;
    padding:
        calc(10px + env(safe-area-inset-top))
        24px
        10px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#fff;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:62px;
    height:62px;
    min-width:62px;
    border-radius:19px;
    object-fit:cover;
    display:block;
    box-shadow:0 4px 13px rgba(170,75,120,.16);
}

.brand-title{
    font-size:22px;
    font-weight:900;
    color:#292630;
    letter-spacing:-.7px;
}

.brand-subtitle{
    margin-top:5px;
    color:#817983;
    font-size:12px;
}

.settings{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#fff;
    display:grid;
    place-items:center;
    font-size:23px;
    box-shadow:0 4px 18px rgba(75,55,70,.12);
}

/* =========================================================
   CONTENT
   ========================================================= */

.content{
    width:100%;
    padding:7px 24px 30px;
}

/* =========================================================
   DATE
   NO SQUARE
   ========================================================= */

.date-card{
    width:100%;
    min-height:91px;

    padding:18px 27px;

    border-radius:25px;

    background:#f5d1e0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:0 5px 16px rgba(100,50,80,.07);
}

.date-main{
    font-size:20px;
    font-weight:900;
    color:#28242d;
    letter-spacing:-.4px;
}

.date-sub{
    margin-top:6px;
    font-size:12px;
    color:#817681;
}

.date-sparkles{
    color:#bd4e7c;
    font-size:19px;
    letter-spacing:5px;
}

/* =========================================================
   FLOWER QUOTE IMAGE
   THIS IS THE FLOWER IMAGE YOU PROVIDED
   ========================================================= */

.flower-banner{
    width:100%;
    height:151px;

    margin-top:17px;

    border-radius:23px;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(255,220,234,.08),
            rgba(255,220,234,.08)
        ),
        url("photo-flowers.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    box-shadow:0 6px 20px rgba(90,50,70,.08);

    position:relative;
}

.flower-sparkle{
    position:absolute;
    color:white;
    font-size:15px;
    text-shadow:0 1px 5px rgba(150,80,110,.2);
}

.flower-sparkle.s1{
    left:29px;
    top:23px;
}

.flower-sparkle.s2{
    left:72px;
    top:32px;
}

.flower-sparkle.s3{
    right:34px;
    bottom:25px;
}

.flower-sparkle.s4{
    right:65px;
    bottom:32px;
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
    width:100%;

    margin-top:19px;

    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
}

.stat{
    min-width:0;
    height:126px;

    border-radius:22px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;
}

.stat:nth-child(1){
    background:#f5d4e2;
}

.stat:nth-child(2){
    background:#dbe9fa;
}

.stat:nth-child(3){
    background:#dcefe5;
}

.stat:nth-child(4){
    background:#fff0c9;
}

.stat-sparkle{
    position:absolute;
    right:12px;
    top:11px;
    font-size:11px;
}

.stat:nth-child(1) .stat-sparkle{
    color:#bc4f7e;
}

.stat:nth-child(2) .stat-sparkle{
    color:#718bc5;
}

.stat:nth-child(3) .stat-sparkle{
    color:#c49c44;
}

.stat:nth-child(4) .stat-sparkle{
    color:#c49c44;
}

.stat-icon{
    font-size:18px;
    margin-bottom:7px;
}

.stat-value{
    font-size:20px;
    font-weight:900;
    color:#27232c;
}

.stat-label{
    margin-top:5px;
    font-size:11px;
    color:#39343d;
}

/* =========================================================
   TODAY'S SCHEDULE
   ========================================================= */

.schedule-section{
    width:100%;
    margin-top:26px;
}

.schedule-header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.schedule-title{
    margin:0;
    font-size:20px;
    font-weight:900;
    color:#29252e;
}

.see-all{
    background:none;
    color:#b44e7b;
    font-size:12px;
    font-weight:900;
}

/* =========================================================
   SCHEDULE EMPTY CARD
   ========================================================= */

.schedule-box{
    width:100%;
    min-height:314px;

    background:#fff;

    border-radius:24px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:30px 28px;

    box-shadow:0 7px 23px rgba(80,55,75,.08);
}

.schedule-icon{
    font-size:50px;
    color:#d85d94;
    line-height:1;
    margin-bottom:18px;
}

.no-jobs{
    font-size:15px;
    font-weight:900;
    color:#2e2932;
}

.add-hint{
    margin-top:7px;
    color:#847c85;
    font-size:12px;
}

.add-button{
    width:100%;
    height:52px;

    margin-top:25px;

    border-radius:28px;

    background:linear-gradient(
        100deg,
        #e683ad,
        #d54888
    );

    color:#fff;

    font-size:14px;
    font-weight:900;

    box-shadow:0 8px 18px rgba(213,72,136,.22);
}

/* =========================================================
   SCHEDULE JOB
   ========================================================= */

.job{
    width:100%;

    background:#fff;

    border-radius:18px;

    padding:13px;

    margin-bottom:8px;

    display:flex;
    align-items:center;
    gap:12px;

    box-shadow:0 4px 14px rgba(70,45,65,.07);
}

.job-colour{
    width:5px;
    min-width:5px;
    height:48px;
    border-radius:10px;
    background:linear-gradient(
        #e77aa8,
        #a989d6,
        #72b89a
    );
}

.job-info{
    flex:1;
    min-width:0;
}

.job-name{
    font-size:14px;
    font-weight:900;
}

.job-time{
    margin-top:4px;
    font-size:10px;
    color:#817983;
}

.job-price{
    font-size:13px;
    font-weight:900;
}

/* =========================================================
   CLEANING IMAGE BELOW SCHEDULE
   ========================================================= */

.cleaning-banner{
    width:100%;
    height:118px;

    margin-top:16px;

    border-radius:21px;

    overflow:hidden;

    background-image:
        linear-gradient(
            rgba(255,195,218,.08),
            rgba(255,195,218,.08)
        ),
        url("photo-cleaning.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    box-shadow:0 6px 20px rgba(90,50,70,.08);
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:
        calc(78px + env(safe-area-inset-bottom));

    padding:
        5px
        4px
        env(safe-area-inset-bottom);

    z-index:1000;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    background:rgba(255,255,255,.98);

    border-top:1px solid #eee5eb;

    box-shadow:0 -5px 20px rgba(70,45,65,.07);
}

.nav{
    min-width:0;
    background:none;

    color:#8c8590;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:9px;
    font-weight:800;
}

.nav-icon{
    width:40px;
    height:34px;

    border-radius:20px;

    display:grid;
    place-items:center;

    font-size:19px;
}

.nav.active{
    color:#d9508b;
}

.nav.active .nav-icon{
    background:#f8d9e6;
}

/* =========================================================
   OTHER PAGES
   ========================================================= */

.page-title{
    margin:12px 0 18px;
    font-size:24px;
    font-weight:900;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:17px;
    margin-bottom:10px;
    box-shadow:0 5px 18px rgba(80,55,75,.08);
}

.card-name{
    font-size:16px;
    font-weight:900;
}

.card-small{
    margin-top:5px;
    font-size:11px;
    color:#817983;
}

.edit-button{
    margin-top:10px;
    padding:8px 12px;
    border-radius:10px;
    background:#f4ddea;
    color:#aa4e77;
    font-size:10px;
    font-weight:900;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-bg{
    position:fixed;
    inset:0;

    z-index:5000;

    background:rgba(30,25,35,.42);

    display:flex;
    align-items:flex-end;
}

.modal{
    width:100%;
    max-height:90vh;

    overflow-y:auto;

    background:#fffafd;

    border-radius:27px 27px 0 0;

    padding:
        22px
        18px
        calc(28px + env(safe-area-inset-bottom));
}

.modal-title{
    font-size:22px;
    font-weight:900;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#f1e8ef;
    font-size:22px;
}

.field{
    margin-bottom:12px;
}

.label{
    display:block;
    margin-bottom:6px;
    font-size:11px;
    font-weight:800;
    color:#77707a;
}

.control{
    width:100%;
    min-height:46px;
    padding:9px 11px;
    border:1px solid #ded6df;
    border-radius:13px;
    background:#fff;
    font-size:14px;
}

.save-button{
    width:100%;
    height:48px;
    border-radius:25px;
    background:linear-gradient(100deg,#e683ad,#d54888);
    color:#fff;
    font-weight:900;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:390px){

    .content{
        padding-left:18px;
        padding-right:18px;
    }

    .header{
        padding-left:18px;
        padding-right:18px;
    }

    .brand-title{
        font-size:19px;
    }

    .logo{
        width:56px;
        height:56px;
        min-width:56px;
    }

    .stat{
        height:112px;
    }

    .stat-value{
        font-size:18px;
    }

    .stat-label{
        font-size:10px;
    }

    .flower-banner{
        height:142px;
    }
}

</style>
</head>

<body>

<div id="app"></div>

<script>

const STORAGE_KEY =
    "PURE_SHINE_CLEANING_MANAGER_V6";

let state =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "null"
    ) || {

        clients:[],
        jobs:[],
        timer:null

    };

let currentPage = "home";

/* =========================================================
   DEFAULT CLIENTS
   ========================================================= */

if(!state.clients.length){

    state.clients = [

        {
            id:"lottie",
            name:"Lottie",
            type:"Agency",
            rate:16,
            day:"Monday",
            start:"13:00",
            end:"15:00"
        },

        {
            id:"christine",

            type:"Private",

            start:"09:30",

        },

        {
            id:"matt",
            name:"Matt",
            type:"Agency",
            rate:16,
            day:"Tuesday",
            start:"13:00",
            end:"17:00"
        },

        {
            id:"sonia",
            name:"Sonia",
            type:"Agency",
            rate:16,
            day:"Wednesday",
            start:"09:00",
            end:"14:00"
        },

        {
            id:"laura",
            name:"Laura",
            type:"Private",
            rate:18,
            day:"Thursday",
            start:"09:00",
            end:"13:00"
        },

        {
            id:"hannah",
            name:"Hannah",
            type:"Agency",
            rate:16,
            day:"Thursday",
            start:"13:00",
            end:"16:00"
        },

        {
            id:"meghan",
            name:"Meghan",
            type:"Private",
            rate:18,
            day:"",
            start:"",
            end:""
        },

        {
            id:"joanna",
            name:"Joanna",
            type:"Private",
            rate:18,
            day:"Friday",
            start:"09:30",
            end:"13:30"
        },

        {
            id:"sindu",
            name:"Sindu",
            type:"Agency",
            rate:16,
            day:"Friday",
            start:"09:30",
            end:"12:30"
        },

        {
            id:"peter",
            name:"Peter",
            type:"Private",
            rate:18,
            day:"",
            start:"",
            end:""
        },

        {
            id:"mike",
            name:"Mike",
            type:"Private",
            rate:18,
            day:"",
            start:"",
            end:""
        }

    ];

}

state.clients =
    state.clients.filter(
        c =>
            c.name.toLowerCase() !== "gill"
    );

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}

function today(){

    return new Date()
        .toISOString()
        .slice(0,10);

}

function currentDay(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {weekday:"long"}
        );

}

function getClient(id){

    return state.clients.find(
        c => c.id === id
    );

}

function minutes(time){

    if(!time) return 0;

    const p = time.split(":");

    return (
        Number(p[0]) * 60 +
        Number(p[1])
    );

}

function hoursBetween(start,end){

    return Math.max(
        0,
        (
            minutes(end) -
            minutes(start)
        ) / 60
    );

}

function money(n){

    return "£" +
        Number(n || 0).toFixed(2);

}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

    const app =
        document.getElementById("app");

    if(currentPage === "home")
        app.innerHTML = home();

    else if(currentPage === "schedule")
        app.innerHTML = schedule();

    else if(currentPage === "clients")
        app.innerHTML = clients();

    else if(currentPage === "timer")
        app.innerHTML = timerPage();

    else
        app.innerHTML = earnings();

}

/* =========================================================
   HOME
   ========================================================= */

function home(){

    const todayJobs =
        state.jobs.filter(
            j => j.date === today()
        );

    const totalHours =
        todayJobs.reduce(
            (a,j) =>
                a + Number(j.hours || 0),
            0
        );

    const earned =
        todayJobs.reduce(
            (a,j) =>
                a + Number(j.price || 0),
            0
        );

    const todayClients =
        state.clients
        .filter(
            c =>
                c.day === currentDay() &&
                c.start &&
                c.end
        );

    const available =
        todayClients.reduce(
            (a,c) =>
                a +
                hoursBetween(
                    c.start,
                    c.end
                ),
            0
        );

    return `

        <header class="header">

            <div class="brand">

                <img
                    class="logo"
                    src="icon.png"
                    onerror="
                        this.style.display='none'
                    "
                >

                <div>

                    <div class="brand-title">
                        Cleaning Manager
                    </div>

                    <div class="brand-subtitle">
                        Your cleaning business ✨
                    </div>

                </div>

            </div>

            <button
                class="settings"
                onclick="settings()"
            >
                ⚙️
            </button>

        </header>

        <main class="content">

            <section class="date-card">

                <div>

                    <div class="date-main">
                        ${new Date().toLocaleDateString(
                            "en-GB",
                            {
                                weekday:"long",
                                day:"numeric",
                                month:"long"
                            }
                        )}
                    </div>

                    <div class="date-sub">
                        Let's make today productive 🌸
                    </div>

                </div>

                <div class="date-sparkles">
                    ✦ ✧
                </div>

            </section>

            <!-- FLOWERS -->
            <section class="flower-banner">

                <span class="flower-sparkle s1">✦</span>
                <span class="flower-sparkle s2">✧</span>
                <span class="flower-sparkle s3">✦</span>
                <span class="flower-sparkle s4">✧</span>

            </section>

            <section class="stats">

                <div class="stat">

                    <span class="stat-sparkle">
                        ✦
                    </span>

                    <div class="stat-icon">
                        🧹
                    </div>

                    <div class="stat-value">
                        ${todayJobs.length}
                    </div>

                    <div class="stat-label">
                        Jobs
                    </div>

                </div>

                <div class="stat">

                    <span class="stat-sparkle">
                        ✦
                    </span>

                    <div class="stat-icon">
                        ◷
                    </div>

                    <div class="stat-value">
                        ${totalHours.toFixed(1)}h
                    </div>

                    <div class="stat-label">
                        Hours
                    </div>

                </div>

                <div class="stat">

                    <span class="stat-sparkle">
                        ✦
                    </span>

                    <div class="stat-icon">
                        ◎
                    </div>

                    <div class="stat-value">
                        ${money(earned)}
                    </div>

                    <div class="stat-label">
                        Earned
                    </div>

                </div>

                <div class="stat">

                    <span class="stat-sparkle">
                        ✦
                    </span>

                    <div class="stat-icon">
                        ☼
                    </div>

                    <div class="stat-value">
                        ${available.toFixed(1)}h
                    </div>

                    <div class="stat-label">
                        Available
                    </div>

                </div>

            </section>

            <section class="schedule-section">

                <div class="schedule-header">

                    <h2 class="schedule-title">
                        Today's schedule
                    </h2>

                    <button
                        class="see-all"
                        onclick="go('schedule')"
                    >
                        See all
                    </button>

                </div>

                <div class="schedule-box">

                    ${
                        todayClients.length
                        ?
                        todayClients
                            .map(jobCard)
                            .join("")
                        :
                        `

                            <div class="schedule-icon">
                                ♡
                            </div>

                            <div class="no-jobs">
                                No cleaning jobs today 🌸
                            </div>

                            <div class="add-hint">
                                Add one with the + button.
                            </div>

                            <button
                                class="add-button"
                                onclick="addJob()"
                            >
                                ＋ Add cleaning job
                            </button>

                        `
                    }

                </div>

            </section>

            <!-- CLEANING PHOTO -->
            <section class="cleaning-banner"></section>

        </main>

        ${navigation()}

    `;

}

/* =========================================================
   JOB CARD
   ========================================================= */

function jobCard(c){

    const existing =
        state.jobs.find(
            j =>
                j.date === today() &&
                j.clientId === c.id
        );

    const h =
        existing
        ? Number(existing.hours)
        : hoursBetween(
            c.start,
            c.end
        );

    return `

        <div class="job">

            <div class="job-colour"></div>

            <div class="job-info">

                <div class="job-name">
                    ${c.name}
                </div>

                <div class="job-time">
                    ${c.start} – ${c.end}
                    · ${h.toFixed(2)}h
                </div>

            </div>

            <div class="job-price">
                ${money(h * c.rate)}
            </div>

        </div>

    `;

}

/* =========================================================
   NAVIGATION
   ========================================================= */

function navigation(){

    return `

        <nav class="bottom-nav">

            <button
                class="nav ${
                    currentPage === "home"
                    ? "active"
                    : ""
                }"
                onclick="go('home')"
            >

                <span class="nav-icon">
                    ⌂
                </span>

                Home

            </button>

            <button
                class="nav ${
                    currentPage === "schedule"
                    ? "active"
                    : ""
                }"
                onclick="go('schedule')"
            >

                <span class="nav-icon">
                    ▣
                </span>

                Schedule

            </button>

            <button
                class="nav ${
                    currentPage === "clients"
                    ? "active"
                    : ""
                }"
                onclick="go('clients')"
            >

                <span class="nav-icon">
                    ♣
                </span>

                Clients

            </button>

            <button
                class="nav ${
                    currentPage === "timer"
                    ? "active"
                    : ""
                }"
                onclick="go('timer')"
            >

                <span class="nav-icon">
                    ◷
                </span>

                Free time

            </button>

            <button
                class="nav ${
                    currentPage === "earnings"
                    ? "active"
                    : ""
                }"

        <div class="field">
            <label class="label">
                Hourly rate
            </label>

                id="clientRate"

function saveNewClient(){

    const name =
        document
        .getElementById("clientName")
        .value
        .trim();

    if(!name)
        return;

    state.clients.push({

        id:
            "client_" +
            Date.now(),

        name:name,

        type:
            document
            .getElementById("clientType")
            .value,

        rate:
            Number(
                document
                .getElementById("clientRate")
                .value
            ),

        day:"",
        start:"",
        end:""

    });

    save();

    closeModal();

    render();

}

/* =========================================================
   ADD JOB
   ========================================================= */

function addJob(){

    if(!state.clients.length)
        return;

    modal(`

        <div class="modal-head">

            <div class="modal-title">
                Add cleaning job
            </div>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div class="field">

            <label class="label">
                Client
            </label>

            <select
                id="jobClient"
                class="control"
            >

                ${
                    state.clients.map(
                        c =>
                        `
                        <option value="${c.id}">
                            ${c.name}
                        </option>
                        `
                    ).join("")
                }

            </select>

        </div>

        <div class="field">

            <label class="label">
                Date
            </label>

            <input
                id="jobDate"
                class="control"
                type="date"
                value="${today()}"
            >

        </div>

        <div class="field">

            <label class="label">
                Exact hours worked
            </label>

            <input
                id="jobHours"
                class="control"
                type="number"
                step=".01"
                placeholder="Example: 4.25"
            >

        </div>

        <button
            class="save-button"
            onclick="saveJob()"
        >
            Save cleaning job
        </button>

    `);

}

function saveJob(){

    const client =
        getClient(
            document
            .getElementById("jobClient")
            .value
        );

    const hours =
        Number(
            document
            .getElementById("jobHours")
            .value
        );

    if(!client || !hours)
        return;

    state.jobs.push({

        id:"job_" + Date.now(),

        clientId:client.id,

        clientName:client.name,

        date:
            document
            .getElementById("jobDate")
            .value,

        hours:hours,

        price:
            hours * client.rate

    });

    save();

    closeModal();

    render();

}

/* =========================================================
   MODAL
   ========================================================= */

function modal(content){

    closeModal();

    const bg =
        document.createElement("div");

    bg.id = "modal";

    bg.className = "modal-bg";

    bg.onclick =
        e => {

            if(e.target === bg)
                closeModal();

        };

    const box =
        document.createElement("div");

    box.className = "modal";

    box.innerHTML = content;

    bg.appendChild(box);

    document.body.appendChild(bg);

}

function closeModal(){

    const old =
        document.getElementById("modal");

    if(old)
        old.remove();

}
