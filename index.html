<style>
.settings-card{
    cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
}

.settings-card:active{
    transform:scale(.98);
}

.settings-card::after{
    content:"›";
    position:absolute;
    right:22px;
    top:50%;
    transform:translateY(-50%);
    font-size:28px;
    color:#c58aa4;
}

.settings-card{
    position:relative;
    padding-right:55px!important;
}

.settings-subpage{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:#fff;
    overflow-y:auto;
    padding:
        calc(env(safe-area-inset-top) + 18px)
        20px
        calc(30px + env(safe-area-inset-bottom));
}

.settings-subpage.open{
    display:block;
}

.settings-sub-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
}

.settings-back{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#fff1f6;
    color:#b94f7d;
    font-size:26px;
}

.settings-sub-header h2{
    font-size:24px;
}

.settings-option{
    background:#fff;
    border-radius:20px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:0 8px 25px rgba(80,45,65,.08);
    border:1px solid #f1e4eb;
}

.settings-option-title{
    font-size:17px;
    font-weight:800;
}

.settings-option-text{
    color:#817883;
    font-size:13px;
    margin-top:5px;
    line-height:1.45;
}

.settings-option-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.settings-switch{
    width:52px;
    height:31px;
    border-radius:20px;
    background:#d8d2d5;
    padding:3px;
    flex-shrink:0;
}

.settings-switch span{
    display:block;
    width:25px;
    height:25px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.settings-switch.on{
    background:#b94f7d;
}

.settings-switch.on span{
    transform:translateX(21px);
}

.settings-range{
    width:100%;
    margin-top:15px;
    accent-color:#b94f7d;
}

.settings-value{
    color:#b94f7d;
    font-weight:800;
}
</style>

<script>
(function(){

function createSettingsSubPages(){

    if(document.getElementById("settingsDisplayPage")) return;

    const pages = `
    
    <div id="settingsDisplayPage" class="settings-subpage">

        <div class="settings-sub-header">
            <button class="settings-back"
                    onclick="closeSettingsSubPage()">
                ‹
            </button>
            <h2>Display</h2>
        </div>

        <div class="settings-option">

            <div class="settings-option-row">

                <div>
                    <div class="settings-option-title">
                        App Zoom
                    </div>

                    <div class="settings-option-text">
                        Increase the size of everything in the app.
                    </div>
                </div>

                <div class="settings-value"
                     id="displayZoomValue">
                    100%
                </div>

            </div>

            <input
                id="displayZoom"
                class="settings-range"
                type="range"
                min="100"
                max="200"
                step="10"
                value="100"
                oninput="setDisplayZoom(this.value)"
            >

        </div>

        <div class="settings-option"
             onclick="setDisplayZoom(100)">

            <div class="settings-option-title">
                Reset display
            </div>

            <div class="settings-option-text">
                Return the application to the normal 100% size.
            </div>

        </div>

    </div>


    <div id="settingsNotificationsPage"
         class="settings-subpage">

        <div class="settings-sub-header">

            <button class="settings-back"
                    onclick="closeSettingsSubPage()">
                ‹
            </button>

            <h2>Notifications 🔔</h2>

        </div>


        <div class="settings-option">

            <div class="settings-option-row">

                <div>

                    <div class="settings-option-title">
                        Cleaning reminders
                    </div>

                    <div class="settings-option-text">
                        Receive a reminder before your scheduled cleaning.
                    </div>

                </div>

                <button
                    id="cleaningReminderSwitch"
                    class="settings-switch"
                    onclick="toggleCleaningReminder(event)">
                    <span></span>
                </button>

            </div>

        </div>


        <div class="settings-option">

            <div class="settings-option-row">

                <div>

                    <div class="settings-option-title">
                        Schedule notifications
                    </div>

                    <div class="settings-option-text">
                        Show upcoming cleaning jobs and schedule changes.
                    </div>

                </div>

                <button
                    id="scheduleReminderSwitch"
                    class="settings-switch"
                    onclick="toggleScheduleReminder(event)">
                    <span></span>
                </button>

            </div>

        </div>

    </div>


    <div id="settingsCalendarPage"
         class="settings-subpage">

        <div class="settings-sub-header">

            <button class="settings-back"
                    onclick="closeSettingsSubPage()">
                ‹
            </button>

            <h2>Calendar 📅</h2>

        </div>


        <div class="settings-option">

            <div class="settings-option-title">
                Monthly calendar
            </div>

            <div class="settings-option-text">
                View your cleaning jobs by date in the monthly calendar.
            </div>

        </div>


        <div class="settings-option">

            <div class="settings-option-title">
                Add jobs from calendar
            </div>

            <div class="settings-option-text">
                Cleaning jobs can be added with the ＋ button and assigned to
                a specific date and time.
            </div>

        </div>


        <div class="settings-option">

            <div class="settings-option-title">
                Biweekly clients
            </div>

            <div class="settings-option-text">
                Fortnightly clients remain marked separately from weekly
                cleaning clients.
            </div>

        </div>

    </div>
    `;

    document.body.insertAdjacentHTML(
        "beforeend",
        pages
    );
}


window.openSettingsSubPage=function(type){

    createSettingsSubPages();

    document
        .querySelectorAll(".settings-subpage")
        .forEach(function(page){
            page.classList.remove("open");
        });

    const page=
        document.getElementById(
            "settings"+
            type.charAt(0).toUpperCase()+
            type.slice(1)+
            "Page"
        );

    if(page){
        page.classList.add("open");
    }

    if(type==="display"){
        updateDisplaySettings();
    }

    if(type==="notifications"){
        updateNotificationSettings();
    }
};


window.closeSettingsSubPage=function(){

    document
        .querySelectorAll(".settings-subpage")
        .forEach(function(page){
            page.classList.remove("open");
        });

};


window.setDisplayZoom=function(value){

    value=Math.max(
        100,
        Math.min(
            200,
            Number(value)
        )
    );

    localStorage.setItem(
        "pure_shine_zoom",
        value
    );

    document.documentElement.style.setProperty(
        "--app-scale",
        value/100
    );

    const valueElement=
        document.getElementById(
            "displayZoomValue"
        );

    if(valueElement){
        valueElement.textContent=
            value+"%";
    }

    const range=
        document.getElementById(
            "displayZoom"
        );

    if(range){
        range.value=value;
    }

    document.body.style.fontSize=
        (value/100)+"rem";
};


function updateDisplaySettings(){

    const value=
        Number(
            localStorage.getItem(
                "pure_shine_zoom"
            )||100
        );

    const range=
        document.getElementById(
            "displayZoom"
        );

    const label=
        document.getElementById(
            "displayZoomValue"
        );

    if(range) range.value=value;

    if(label) label.textContent=value+"%";
}


window.toggleCleaningReminder=function(event){

    event.stopPropagation();

    const current=
        localStorage.getItem(
            "pure_shine_cleaning_reminders"
        )==="true";

    localStorage.setItem(
        "pure_shine_cleaning_reminders",
        String(!current)
    );

    updateNotificationSettings();
};


window.toggleScheduleReminder=function(event){

    event.stopPropagation();

    const current=
        localStorage.getItem(
            "pure_shine_schedule_reminders"
        )==="true";

    localStorage.setItem(
        "pure_shine_schedule_reminders",
        String(!current)
    );

    updateNotificationSettings();
};


function updateNotificationSettings(){

    const cleaning=
        localStorage.getItem(
            "pure_shine_cleaning_reminders"
        )==="true";

    const schedule=
        localStorage.getItem(
            "pure_shine_schedule_reminders"
        )==="true";

    const cleaningButton=
        document.getElementById(
            "cleaningReminderSwitch"
        );

    const scheduleButton=
        document.getElementById(
            "scheduleReminderSwitch"
        );

    if(cleaningButton){
        cleaningButton.classList.toggle(
            "on",
            cleaning
        );
    }

    if(scheduleButton){
        scheduleButton.classList.toggle(
            "on",
            schedule
        );
    }
}


function findSettingsCards(){

    const modal=
        document.getElementById(
            "settingsModal"
        );

    if(!modal) return;


    const elements=
        modal.querySelectorAll(
            "div,section,button"
        );


    elements.forEach(function(el){

        const text=
            el.innerText
            ?.trim()
            ?.toLowerCase();

        if(!text) return;


        if(
            text.startsWith("display") &&
            text.length<250 &&
            !el.dataset.settingsBound
        ){

            el.dataset.settingsBound="1";
            el.classList.add("settings-card");

            el.onclick=function(){

                openSettingsSubPage(
                    "display"
                );

            };

        }


        if(
            text.startsWith("notifications") &&
            text.length<250 &&
            !el.dataset.settingsBound
        ){

            el.dataset.settingsBound="1";
            el.classList.add("settings-card");

            el.onclick=function(){

                openSettingsSubPage(
                    "notifications"
                );

            };

        }


        if(
            text.startsWith("calendar") &&
            text.length<300 &&
            !el.dataset.settingsBound
        ){

            el.dataset.settingsBound="1";
            el.classList.add("settings-card");

            el.onclick=function(){

                openSettingsSubPage(
                    "calendar"
                );

            };

        }

    });

}


const originalOpenSettings=
    window.openSettings;

window.openSettings=function(){

    if(
        typeof originalOpenSettings===
        "function"
    ){
        originalOpenSettings();
    }else{

        const modal=
            document.getElementById(
                "settingsModal"
            );

        if(modal){
            modal.classList.add("open");
        }

    }

    setTimeout(
        findSettingsCards,
        50
    );

};


window.addEventListener(
    "load",
    function(){

        createSettingsSubPages();

        const savedZoom=
            Number(
                localStorage.getItem(
                    "pure_shine_zoom"
                )||100
            );

        setDisplayZoom(
            savedZoom
        );

    }
);

})();
</script>
