<script>

const KEY =
"pure_shine_cleaning_manager_master_v12";

const OLD_KEYS = [

"pureShineExactDesignV11",
"pureShineExactDesign",

const defaultClients = [

},

{
id:"laura",

rate:18,
day:"Thursday",
start:"09:00",
end:"13:00",
frequency:"Weekly",
week:"A",
variable:true,
location:"",

notes:"Normally 4 hours, sometimes 5."
},

{
id:"hannah",
name:"Hannah",
type:"Agency",
rate:16,
day:"Thursday",
start:"13:00",
end:"16:00",
frequency:"Weekly",
week:"A",
variable:false,
location:"",

},

{
id:"joanna",

type:"Private",
rate:18,
day:"Friday",
start:"09:30",
end:"13:30",
frequency:"Fortnightly",
week:"A",
variable:true,
location:"",
phone:"",
notes:""
},

{
id:"sindu",
name:"Sindu",
type:"Agency",
rate:16,
day:"Friday",
start:"09:30",
end:"12:30",
frequency:"Fortnightly",
week:"B",
variable:false,
location:"",
phone:"",
notes:""
}

];


function diffHours(a,b){

if(!a || !b)
return 0;

let [ah,am] =
a.split(":").map(Number);

let [bh,bm] =
b.split(":").map(Number);

return Math.max(
0,
(
(bh*60+bm) -
(ah*60+am)
)/60
);

}


const defaultJobs =
defaultClients.map(c=>({

id:"schedule-"+c.id,

clientId:c.id,

day:c.day,

date:"",

start:c.start,

end:c.end,

hours:diffHours(
c.start,
c.end
),

rate:c.rate,

notes:c.notes || "",

scheduled:true

}));


let data = {
clients:[],
jobs:[],
reminders:[],
holidays:[],
timer:null,
week:"A"
};


function money(n){

return "£"+
Number(n||0)
.toFixed(2)
.replace(/\.00$/,"");

}


function hoursText(x){

x=Math.max(
0,
Number(x||0)
);

let h=Math.floor(x);

let m=Math.round(
(x-h)*60
);

if(m===60){

h++;
m=0;

}

return h+"h "+m+"m";

}


function esc(s){

return String(s??"")
.replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m]));

}


function iso(d=new Date()){

return new Date(
d.getTime() -
d.getTimezoneOffset()*60000
)
.toISOString()
.slice(0,10);

}


function todayName(){

return new Date()
.toLocaleDateString(
"en-GB",
{
weekday:"long"
}
);

}


function getOldData(){

for(
const k of OLD_KEYS
){

try{

const x=
JSON.parse(
localStorage.getItem(k)||"null"
);

if(
x &&
(
Array.isArray(x.clients) ||
Array.isArray(x.jobs)
)
){

return x;

}

}catch(e){}

}

return null;

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

}


function normalize(){

data.clients =
(
Array.isArray(data.clients)
?
data.clients
:
[]
)
.filter(
c =>
String(c.name||"")
.toLowerCase() !== "gill"
);


data.jobs =
Array.isArray(data.jobs)
?
data.jobs
:
[];


data.reminders =
Array.isArray(data.reminders)
?
data.reminders

defaultClients
);

defaultJobs
);

}else{

const dc of defaultClients
){

!data.clients.some(
c =>
String(c.name)
.toLowerCase() ===
dc.name.toLowerCase()
)
){

data.clients.push(
structuredClone(dc)
);

}

}


for(
const dc of defaultClients
){

if(
!data.jobs.some(
j =>
j.id ===
"schedule-"+dc.id
)
&&
!data.jobs.some(
j =>
j.clientId===dc.id &&
j.scheduled
)
){

data.jobs.push(
structuredClone(
defaultJobs.find(
j=>j.clientId===dc.id
)
)
);

}

}

}


data.jobs =
data.jobs.filter(
j =>
data.clients.some(
c=>c.id===j.clientId
)
||
data.clients.some(
c =>

)
);

data.jobs.map(j=>{

j.clientName

c =>
c.name.toLowerCase() ===
j.clientName.toLowerCase()
);

return j;

function toggleTimer(id){

if(
data.timer?.jobId===id
){

stopTimer();

return;

}


let j=
data.jobs.find(
x=>x.id===id
);


if(!j)
return;


data.timer={

jobId:id,

startedAt:Date.now(),

baseHours:
Number(j.hours||0)

};


save();

render();

}


function stopTimer(){

if(!data.timer)
return;


let j=
data.jobs.find(
x=>x.id===data.timer.jobId
);


if(j){

j.hours=
Number(
data.timer.baseHours||0
)
+
(
Date.now()-
data.timer.startedAt
)
/3600000;

}


data.timer=null;

save();

render();

}

Add your own location, phone number, notes and other details for every client.
</div>


<button
class="save"
onclick="openClients()"
>
Manage clients 👥
</button>

</div>

`);

updateNotificationStatus();

}


function setZoom(v){

v=
Math.max(
90,
Math.min(
150,
Number(v)
)
);


localStorage.setItem(
"pure_shine_zoom",
v
);


document.documentElement
.style
.setProperty(
"--zoom",
v/100
);


let x=
document.getElementById(
"zoomVal"
);


let r=
document.getElementById(
"zoomRange"
);


if(x)
x.textContent=v+"%";


if(r)
r.value=v;

}


function enableNotifications(){

if(
!("Notification" in window)
){

alert(
"Notifications are not supported here."
);

return;

}


Notification
.requestPermission()
.then(
p=>{

updateNotificationStatus();

if(
p==="granted"
){

new Notification(
"Pure Shine Cleaning ✨",
{
body:
"Your client reminders are enabled."
}
);

}

});

}


function updateNotificationStatus(){

let x=
document.getElementById(
"notificationStatus"
);


if(x){

x.textContent=
"Notification permission: "+
(
"Notification" in window
?
Notification.permission
:
"not supported"
);

}

}


function openReminders(){

show(`

<div class="sheetHead">

<h2>
Client reminders 🔔
</h2>

<button
class="close"
onclick="close()"
>
×
</button>

</div>


<div class="notice">

<b>Important:</b>
a client can receive the reminder on their own phone through WhatsApp or SMS.

Your own reminder can appear in your notification bar after notifications are enabled.

</div>


<button
class="save"
onclick="enableNotifications()"
>
🔔 Enable my notification bar
</button>


<h3 style="margin-top:20px">
Send a reminder
</h3>


${
data.clients
.map(
c=>`

<div class="reminder">

<div class="reminderName">
${esc(c.name)}
</div>


<div class="reminderMeta">

${
c.phone
?
"☎ "+esc(c.phone)
:
"No phone number saved yet"
}

· ${esc(c.day)}
· ${esc(c.start)}–${esc(c.end)}

</div>


<div class="reminderBtns">

<button
class="main"
onclick="openReminder('${c.id}')"
>
🔔 Set
</button>


<button
onclick="sendWhatsApp('${c.id}')"
>
WhatsApp
</button>


<button
onclick="sendSMS('${c.id}')"
>
SMS
</button>

</div>

</div>

`
)
.join("")
}


<h3 style="margin-top:20px">
Scheduled reminders
</h3>


${
data.reminders.length
?
data.reminders
.slice()
.reverse()
.map(
r=>{

let c=
client(r.clientId);

return c
?
`

<div class="reminder">

<div class="reminderName">
${esc(c.name)}
</div>


<div class="reminderMeta">
${r.date} at ${r.time}
</div>


<div class="reminderBtns">

<button
class="main"
onclick="notifyReminder('${r.id}')"
>
🔔 Notify me
</button>


<button
onclick="sendWhatsApp('${c.id}')"
>
WhatsApp
</button>


<button
onclick="deleteReminder('${r.id}')"
>
Delete
</button>

</div>

</div>

`
:
"";

}
)
.join("")
:
`
<div class="empty">
No reminders scheduled yet.
</div>
`
}

`);

}


function openReminder(cid){

let c=
client(cid);


if(!c)
return;


show(`

<div class="sheetHead">

<h2>
Reminder — ${esc(c.name)}
</h2>

<button
class="close"
onclick="close()"
>
×
</button>

</div>


<div class="notice">

You can send this client a reminder by WhatsApp/SMS.

Their phone number is entered by you in the client profile.

</div>


<label class="label">
Reminder date
</label>

<input
class="input"
id="rdate"
type="date"
value="${
iso(
new Date(
Date.now()+86400000
)
)
}"
>


<label class="label">
Reminder time
</label>

<input
class="input"
id="rtime"
type="time"
value="20:00"
>


<button
class="save"
onclick="createReminder('${cid}')"
>
🔔 Save reminder
</button>


<button
class="save"
style="background:#d86f9e"
onclick="sendWhatsApp('${cid}')"
>
💬 Send WhatsApp now
</button>


<button
class="save"
style="background:#7da9df"
onclick="sendSMS('${cid}')"
>
💬 Send SMS now
</button>

`);

}


function createReminder(cid){

let date=
document
.getElementById("rdate")
.value;


let time=
document
.getElementById("rtime")
.value;


if(!date||!time)
return;


let r={
id:"r-"+Date.now(),
clientId:cid,
date,
time
};


data.reminders.push(r);

save();

scheduleNotification(r);

openReminders();

}


function reminderText(c){

return `
Hello ${c.name}, just a reminder about your cleaning on ${c.day} at ${c.start}. See you then! ✨
`;

}


function sendWhatsApp(cid){

let c=
client(cid);


if(!c?.phone){

alert(
"Add the client's phone number first in Clients → Edit."
);

return;

}


let phone=
c.phone.replace(
/\D/g,
""
);


let url=
"https://wa.me/"+
phone+
"?text="+
encodeURIComponent(
reminderText(c)
);


window.open(
url,
"_blank"
);

}


function sendSMS(cid){

let c=
client(cid);


if(!c?.phone){

alert(
"Add the client's phone number first in Clients → Edit."
);

return;

}


window.location.href=
"sms:"+
c.phone+
"?body="+
encodeURIComponent(
reminderText(c)
);

}


function scheduleNotification(r){

if(
!("Notification" in window)
){

alert(
"Notifications are not supported."
);

return;

}


if(
Notification.permission!=="granted"
){

enableNotifications();

return;

}


let t=
new Date(
r.date+
"T"+
r.time+
":00"
)
.getTime();


let delay=
t-Date.now();


if(delay<=0){

notifyReminder(r.id);

return;

}


setTimeout(
()=>notifyReminder(r.id),
delay
);


alert(
"Your reminder is scheduled for "+
r.date+
" at "+
r.time+
"."
);

}


function notifyReminder(id){

let r=
data.reminders.find(
x=>x.id===id
);


let c=
r &&
client(r.clientId);


if(!r||!c)
return;


if(
"Notification" in window &&
Notification.permission==="granted"
){

new Notification(
"🔔 Pure Shine Cleaning",
{
body:
"Reminder: "+
c.name+
" — cleaning at "+
c.start+
" on "+
c.day,
tag:
"pure-shine-"+id
}
);

}else{

alert(
"Enable notifications first in Settings."
);

}

}


function deleteReminder(id){

data.reminders=
data.reminders.filter(
r=>r.id!==id
);

save();

openReminders();

}


setZoom(
Number(
localStorage.getItem(
"pure_shine_zoom"
)||115
)
);

load();

render();

</script>

</body>
</html>
