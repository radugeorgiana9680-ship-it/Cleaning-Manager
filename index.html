<!-- Schedule page — edit / delete / modify existing jobs -->
<!-- Replace the current Schedule page section + its Schedule JavaScript with this. -->

<style>
  :root{
    --pink:#f3d7e5;
    --pink-dark:#a45f7e;
    --pink-soft:#f9edf3;
    --cream:#fffafd;
    --text:#3e3840;
    --muted:#968b94;
    --shadow:0 8px 28px rgba(130,90,110,.09);
  }

  #schedulePage{
    min-height:100vh;
    background:#fffafd;
    color:var(--text);
    padding:28px 18px 125px;
    box-sizing:border-box;
  }

  .schedule-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:28px;
  }

  .schedule-title{
    font-family:Georgia,serif;
    font-size:34px;
    font-weight:700;
    margin:0;
    letter-spacing:-.5px;
  }

  .view-switch{
    display:flex;
    align-items:center;
    background:#f4eaf0;
    border-radius:17px;
    padding:4px;
    box-shadow:0 2px 8px rgba(0,0,0,.03);
  }

  .view-switch button{
    border:0;
    background:transparent;
    color:#847681;
    font-family:Georgia,serif;
    font-size:18px;
    font-weight:600;
    padding:10px 15px;
    border-radius:13px;
    cursor:pointer;
  }

  .view-switch button.active{
    background:white;
    color:var(--pink-dark);
    box-shadow:0 2px 7px rgba(100,70,90,.08);
  }

  .day-card{
    background:white;
    border-radius:28px;
    padding:22px 18px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }

  .day-title{
    font-family:Georgia,serif;
    font-size:22px;
    font-weight:700;
    margin-bottom:6px;
  }

  .day-count{
    color:#a79aa3;
    font-family:Georgia,serif;
    font-size:15px;
  }

  .schedule-job{
    background:white;
    border-radius:28px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    position:relative;
  }

  .scheduled-row{
    display:flex;
    align-items:center;
    gap:15px;
    min-width:0;
  }

  .client-circle{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    background:#f6dce8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia,serif;
    font-size:22px;
    color:#a45f7e;
  }

  .job-main{
    flex:1;
    min-width:0;
  }

  .job-client{
    font-family:Georgia,serif;
    font-size:21px;
    font-weight:700;
    margin-bottom:5px;
  }

  .job-details{
    font-family:Georgia,serif;
    font-size:16px;
    color:#a0939c;
    line-height:1.45;
  }

  .job-price{
    font-family:Georgia,serif;
    font-size:19px;
    font-weight:700;
    white-space:nowrap;
  }

  .job-arrow{
    font-size:28px;
    color:#b06b89;
    cursor:pointer;
    padding:4px 0 4px 5px;
  }

  .completed-job{
    margin-top:12px;
    border-top:1px solid #f2e8ed;
    padding-top:14px;
  }

  .completed-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .completed-info{
    min-width:0;
    flex:1;
  }

  .completed-client{
    font-family:Georgia,serif;
    font-size:19px;
    font-weight:700;
    margin-bottom:4px;
  }

  .completed-duration{
    font-family:Georgia,serif;
    font-size:16px;
    color:#9a8e97;
  }

  .completed-right{
    display:flex;
    align-items:center;
    gap:9px;
  }

  .completed-price{
    font-family:Georgia,serif;
    font-size:19px;
    font-weight:700;
    white-space:nowrap;
  }

  .invoice-btn{
    border:0;
    background:#f5e9ef;
    color:#77646f;
    font-family:Georgia,serif;
    font-size:17px;
    font-weight:700;
    padding:11px 16px;
    border-radius:17px;
    cursor:pointer;
  }

  .job-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
  }

  .edit-job-btn,
  .delete-job-btn{
    flex:1;
    border:0;
    border-radius:15px;
    padding:12px 10px;
    font-family:Georgia,serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }

  .edit-job-btn{
    background:#e5edf9;
    color:#65738a;
  }

  .delete-job-btn{
    background:#f7dddd;
    color:#a05f66;
  }

  .empty-schedule{
    background:white;
    border-radius:28px;
    padding:35px 20px;
    text-align:center;
    box-shadow:var(--shadow);
    font-family:Georgia,serif;
    color:#9b8f97;
    font-size:18px;
  }

  /* Modal */

  #jobEditModal{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(60,45,55,.32);
    backdrop-filter:blur(5px);
  }

  #jobEditModal.show{
    display:flex;
  }

  .job-modal{
    width:min(700px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fffafd;
    border-radius:32px 32px 0 0;
    padding:25px 20px 35px;
    box-sizing:border-box;
  }

  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
  }

  .modal-title{
    margin:0;
    font-family:Georgia,serif;
    font-size:27px;
  }

  .close-modal{
    border:0;
    width:43px;
    height:43px;
    border-radius:50%;
    background:#f2e2ea;
    color:#8f6478;
    font-size:25px;
    cursor:pointer;
  }

  .form-group{
    margin-bottom:17px;
  }

  .form-group label{
    display:block;
    font-family:Georgia,serif;
    font-size:16px;
    font-weight:700;
    margin-bottom:7px;
  }

  .form-group input,
  .form-group select{
    width:100%;
    box-sizing:border-box;
    border:1px solid #eadce3;
    background:white;
    border-radius:15px;
    padding:14px;
    font-size:17px;
    color:#443d43;
    outline:none;
  }

  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .calculated-box{
    background:#e1f1eb;
    border-radius:19px;
    padding:16px;
    margin:5px 0 18px;
  }

  .calculated-box div{
    font-family:Georgia,serif;
    font-size:17px;
    margin:4px 0;
  }

  .modal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
  }

  .save-job-btn,
  .cancel-job-btn{
    border:0;
    border-radius:17px;
    padding:15px;
    font-family:Georgia,serif;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
  }

  .save-job-btn{
    background:#f0d0df;
    color:#925875;
  }

  .cancel-job-btn{
    background:#eee7eb;
    color:#776d73;
  }

  .delete-modal-btn{
    width:100%;
    border:0;
    background:#f7dddd;
    color:#a05f66;
    border-radius:17px;
    padding:15px;
    margin-top:12px;
    font-family:Georgia,serif;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }

  /* Bottom navigation */
  .bottom-nav{
    position:fixed;
    left:16px;
    right:16px;
    bottom:15px;
    z-index:5000;
    background:white;
    border-radius:28px;
    box-shadow:0 5px 28px rgba(90,60,75,.12);
    padding:8px;
    display:flex;
    justify-content:space-around;
  }

  .bottom-nav button{
    flex:1;
    border:0;
    background:transparent;
    border-radius:20px;
    padding:13px 4px;
    color:#817780;
    font-family:Georgia,serif;
    font-size:15px;
  }

  .bottom-nav button.active{
    background:#f1d5e2;
    color:#9b5e79;
  }

  .bottom-nav .nav-icon{
    display:block;
    font-size:22px;
    margin-bottom:4px;
  }

  @media(max-width:500px){
    #schedulePage{
      padding-left:17px;
      padding-right:17px;
    }

    .schedule-title{
      font-size:31px;
    }

    .view-switch button{
      font-size:17px;
      padding:9px 12px;
    }

    .job-client{
      font-size:20px;
    }

    .job-details,
    .completed-duration{
      font-size:15px;
    }

    .completed-right{
      flex-direction:column;
      align-items:flex-end;
    }
  }
</style>


<div id="schedulePage">

  <div class="schedule-header">
    <h1 class="schedule-title">Schedule</h1>

    <div class="view-switch">
      <button id="listViewBtn" class="active" onclick="setScheduleView('list')">
        List
      </button>
      <button id="calendarViewBtn" onclick="setScheduleView('calendar')">
        Calendar
      </button>
    </div>
  </div>

  <div id="scheduleContent"></div>

</div>


<!-- EDIT JOB MODAL -->

<div id="jobEditModal">
  <div class="job-modal">

    <div class="modal-head">
      <h2 class="modal-title">Edit job</h2>
      <button class="close-modal" onclick="closeJobEditor()">×</button>
    </div>

    <input type="hidden" id="editJobId">

    <div class="form-group">
      <label>Client</label>
      <select id="editJobClient"></select>
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" id="editJobDate">
    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Start time</label>
        <input type="time" id="editJobStart">
      </div>

      <div class="form-group">
        <label>End time</label>
        <input type="time" id="editJobEnd">
      </div>

    </div>

    <div class="form-group">
      <label>Hours and minutes</label>
      <input
        type="text"
        id="editJobDuration"
        placeholder="Example: 3 hours 45 minutes"
      >
    </div>

    <div class="form-group">
      <label>Hourly rate (£)</label>
      <input
        type="number"
        id="editJobRate"
        min="0"
        step="0.01"
      >
    </div>

    <div class="calculated-box">
      <div><strong>Duration:</strong> <span id="calculatedDuration">0 minutes</span></div>
      <div><strong>Amount owed:</strong> £<span id="calculatedPrice">0.00</span></div>
    </div>

    <div class="form-group">
      <label>Payment status</label>
      <select id="editJobStatus">
        <option value="owed">Owed</option>
        <option value="paid">Paid</option>
      </select>
    </div>

    <div class="modal-buttons">
      <button class="cancel-job-btn" onclick="closeJobEditor()">
        Cancel
      </button>

      <button class="save-job-btn" onclick="saveEditedJob()">
        Save changes
      </button>
    </div>

    <button class="delete-modal-btn" onclick="deleteEditedJob()">
      🗑 Delete this job
    </button>

  </div>
</div>


<script>
/* =========================================================
   PURE SHINE — SCHEDULE JOB MANAGEMENT
   ========================================================= */

(function(){

  /*
    Uses the existing Pure Shine data when available.
    Nothing is invented or added to today's schedule here.
  */

  window.pureShineData = window.pureShineData || {};

  function getStoredData(){

    try{

      const raw = localStorage.getItem("pureShineCleaningManagerFinal");

      if(raw){
        const parsed = JSON.parse(raw);

        if(parsed && typeof parsed === "object"){
          return parsed;
        }
      }

    }catch(error){
      console.error("Could not load Pure Shine data:",error);
    }

    return {
      clients:[],
      jobs:[]
    };
  }

  function saveStoredData(data){

    try{

      localStorage.setItem(
        "pureShineCleaningManagerFinal",
        JSON.stringify(data)
      );

    }catch(error){
      console.error("Could not save Pure Shine data:",error);
    }
  }


  function getData(){

    const stored = getStoredData();

    if(!Array.isArray(stored.clients)){
      stored.clients = [];
    }

    if(!Array.isArray(stored.jobs)){
      stored.jobs = [];
    }

    window.pureShineData = stored;

    return stored;
  }


  function getClientByIdOrName(job){

    const data = getData();

    return data.clients.find(c =>
      String(c.id) === String(job.clientId) ||
      String(c.name || "").toLowerCase() ===
      String(job.client || job.clientName || "").toLowerCase()
    );
  }


  function getClientName(job){

    const client = getClientByIdOrName(job);

    return (
      client?.name ||
      job.client ||
      job.clientName ||
      "Client"
    );
  }


  function getClientRate(job){

    const client = getClientByIdOrName(job);

    const rate =
      Number(job.rate) ||
      Number(job.hourlyRate) ||
      Number(client?.rate) ||
      Number(client?.hourlyRate) ||
      0;

    return rate;
  }


  function parseDuration(job){

    if(Number.isFinite(Number(job.minutes)) && Number(job.minutes) > 0){
      return Math.round(Number(job.minutes));
    }

    if(Number.isFinite(Number(job.durationMinutes)) && Number(job.durationMinutes) > 0){
      return Math.round(Number(job.durationMinutes));
    }

    if(Number.isFinite(Number(job.duration)) && Number(job.duration) > 0){

      const durationNumber = Number(job.duration);

      /*
        If duration is very small it is assumed to be hours.
        If it is a large integer it is treated as minutes.
      */

      if(durationNumber < 24){
        return Math.round(durationNumber * 60);
      }

      return Math.round(durationNumber);
    }

    if(job.hours !== undefined){

      const h = Number(job.hours) || 0;
      const m = Number(job.minutesPart || job.extraMinutes || 0) || 0;

      return Math.round(h * 60 + m);
    }

    if(job.start && job.end){

      const start = timeToMinutes(job.start);
      const end = timeToMinutes(job.end);

      if(start !== null && end !== null){

        let difference = end - start;

        if(difference < 0){
          difference += 24 * 60;
        }

        return difference;
      }
    }

    if(job.startTime && job.endTime){

      const start = timeToMinutes(job.startTime);
      const end = timeToMinutes(job.endTime);

      if(start !== null && end !== null){

        let difference = end - start;

        if(difference < 0){
          difference += 24 * 60;
        }

        return difference;
      }
    }

    return 0;
  }


  function timeToMinutes(value){

    if(!value) return null;

    const match = String(value).match(/^(\d{1,2}):(\d{2})/);

    if(!match) return null;

    return Number(match[1]) * 60 + Number(match[2]);
  }


  function durationText(minutes){

    minutes = Math.max(0,Math.round(Number(minutes) || 0));

    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;

    if(hours && mins){
      return `${hours} hour${hours === 1 ? "" : "s"} ${mins} minute${mins === 1 ? "" : "s"}`;
    }

    if(hours){
      return `${hours} hour${hours === 1 ? "" : "s"}`;
    }

    return `${mins} minute${mins === 1 ? "" : "s"}`;
  }


  function calculatePrice(job){

    const minutes = parseDuration(job);
    const rate = getClientRate(job);

    return (minutes / 60) * rate;
  }


  function getJobDate(job){

    return (
      job.date ||
      job.jobDate ||
      job.day ||
      ""
    );
  }


  function formatDate(dateString){

    if(!dateString){
      return "";
    }

    const date = new Date(dateString + "T12:00:00");

    if(Number.isNaN(date.getTime())){
      return dateString;
    }

    return date.toLocaleDateString("en-GB",{
      weekday:"long",
      day:"numeric",
      month:"long"
    });
  }


  function formatTime(value){

    if(!value) return "";

    const parts = String(value).split(":");

    if(parts.length < 2){
      return value;
    }

    let h = Number(parts[0]);
    const m = parts[1];

    const suffix = h >= 12 ? "PM" : "AM";

    h = h % 12;

    if(h === 0) h = 12;

    return `${h}:${m} ${suffix}`;
  }


  function dateOnly(date){

    const d = new Date(date);

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;
  }


  function todayString(){

    return dateOnly(new Date());
  }


  function escapeHTML(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  /* =========================================================
     RENDER SCHEDULE
     ========================================================= */

  window.renderSchedulePage = function(){

    const data = getData();

    const jobs = Array.isArray(data.jobs)
      ? data.jobs
      : [];

    const content = document.getElementById("scheduleContent");

    if(!content) return;

    /*
      Only jobs which actually exist are rendered.
      This prevents another client being automatically added
      to today's schedule.
    */

    const validJobs = jobs
      .filter(job => getJobDate(job))
      .sort((a,b) => {

        const dateA = getJobDate(a);
        const dateB = getJobDate(b);

        if(dateA !== dateB){
          return dateA.localeCompare(dateB);
        }

        const timeA = a.start || a.startTime || "";
        const timeB = b.start || b.startTime || "";

        return timeA.localeCompare(timeB);
      });


    if(window.currentScheduleView === "calendar"){

      renderCalendar(validJobs);

    }else{

      renderList(validJobs);

    }

  };


  function renderList(jobs){

    const content = document.getElementById("scheduleContent");

    if(!jobs.length){

      content.innerHTML = `
        <div class="empty-schedule">
          No jobs scheduled yet.
        </div>
      `;

      return;
    }


    const groups = {};

    jobs.forEach(job => {

      const date = getJobDate(job);

      if(!groups[date]){
        groups[date] = [];
      }

      groups[date].push(job);

    });


    let html = "";

    Object.keys(groups)
      .sort()
      .forEach(date => {

        const dayJobs = groups[date];

        html += `
          <div class="day-card">

            <div class="day-title">
              ${escapeHTML(formatDate(date))}
            </div>

            <div class="day-count">
              ${dayJobs.length}
              ${dayJobs.length === 1 ? "scheduled client" : "scheduled clients"}
            </div>

          </div>
        `;


        dayJobs.forEach(job => {

          html += renderJobCard(job);

        });

      });


    content.innerHTML = html;

  }


  function renderJobCard(job){

    const name = getClientName(job);
    const rate = getClientRate(job);

    const duration = parseDuration(job);
    const price = calculatePrice(job);

    const start =
      job.start ||
      job.startTime ||
      "";

    const end =
      job.end ||
      job.endTime ||
      "";

    const isCompleted =
      job.completed === true ||
      job.status === "completed" ||
      duration > 0;


    const jobId =
      job.id ||
      job.jobId ||
      createTemporaryId(job);


    const initial =
      name.trim()
        ? name.trim().charAt(0).toUpperCase()
        : "?";


    let html = `

      <div class="schedule-job">

        <div class="scheduled-row">

          <div class="client-circle">
            ${escapeHTML(initial)}
          </div>

          <div class="job-main">

            <div class="job-client">
              ${escapeHTML(name)}
            </div>

            <div class="job-details">

              ${
                start
                  ? `${escapeHTML(formatTime(start))}`
                  : ""
              }

              ${
                end
                  ? ` – ${escapeHTML(formatTime(end))}`
                  : ""
              }

              ${
                start || end
                  ? " · "
                  : ""
              }

              ${
                duration
                  ? escapeHTML(durationText(duration))
                  : "Scheduled"
              }

              ${
                rate
                  ? ` · £${rate.toFixed(2)}/h`
                  : ""
              }

            </div>

          </div>

          <div class="job-price">
            ${
              duration
                ? `£${price.toFixed(2)}`
                : ""
            }
          </div>

          <div
            class="job-arrow"
            onclick="openJobEditor('${escapeHTML(String(jobId))}')"
            title="Edit job"
          >
            ›
          </div>

        </div>
    `;


    if(isCompleted && duration > 0){

      html += `

        <div class="completed-job">

          <div class="completed-row">

            <div class="completed-info">

              <div class="completed-client">
                ${escapeHTML(name)}
              </div>

              <div class="completed-duration">
                ${escapeHTML(durationText(duration))}
              </div>

            </div>

            <div class="completed-right">

              <div class="completed-price">
                £${price.toFixed(2)}
              </div>

              <button
                class="invoice-btn"
                onclick="createInvoice('${escapeHTML(String(jobId))}')"
              >
                Invoice
              </button>

            </div>

          </div>

          <div class="job-actions">

            <button
              class="edit-job-btn"
              onclick="openJobEditor('${escapeHTML(String(jobId))}')"
            >
              ✏️ Edit job
            </button>

            <button
              class="delete-job-btn"
              onclick="deleteJobDirectly('${escapeHTML(String(jobId))}')"
            >
              🗑 Delete
            </button>

          </div>

        </div>
      `;

    }else{

      html += `

        <div class="job-actions">

          <button
            class="edit-job-btn"
            onclick="openJobEditor('${escapeHTML(String(jobId))}')"
          >
            ✏️ Edit job
          </button>

          <button
            class="delete-job-btn"
            onclick="deleteJobDirectly('${escapeHTML(String(jobId))}')"
          >
            🗑 Delete
          </button>

        </div>
      `;

    }


    html += `</div>`;

    return html;
  }


  function createTemporaryId(job){

    if(!job.__temporaryId){

      job.__temporaryId =
        "job_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2,8);

    }

    return job.__temporaryId;
  }


  /* =========================================================
     EDIT JOB
     ========================================================= */

  window.openJobEditor = function(jobId){

    const data = getData();

    let job = data.jobs.find(j =>
      String(j.id) === String(jobId) ||
      String(j.jobId) === String(jobId) ||
      String(j.__temporaryId) === String(jobId)
    );


    if(!job){
      alert("Job not found.");
      return;
    }


    if(!job.id){
      job.id = jobId;
      saveStoredData(data);
    }


    const clientSelect =
      document.getElementById("editJobClient");

    clientSelect.innerHTML = "";


    /*
      Use existing clients only.
      No new clients are automatically created.
    */

    data.clients.forEach(client => {

      if(!client || !client.name){
        return;
      }

      const option =
        document.createElement("option");

      option.value =
        client.id ??
        client.name;

      option.textContent =
        client.name;

      if(
        String(client.id) === String(job.clientId) ||
        String(client.name).toLowerCase() ===
        String(getClientName(job)).toLowerCase()
      ){
        option.selected = true;
      }

      clientSelect.appendChild(option);

    });


    /*
      If the job has a client which isn't currently
      in the clients array, preserve it in the editor.
    */

    if(!clientSelect.options.length){

      const option =
        document.createElement("option");

      option.value =
        job.clientId ||
        getClientName(job);

      option.textContent =
        getClientName(job);

      option.selected = true;

      clientSelect.appendChild(option);

    }


    document.getElementById("editJobId").value =
      job.id || jobId;


    document.getElementById("editJobDate").value =
      getJobDate(job);


    document.getElementById("editJobStart").value =
      job.start ||
      job.startTime ||
      "";


    document.getElementById("editJobEnd").value =
      job.end ||
      job.endTime ||
      "";


    document.getElementById("editJobRate").value =
      getClientRate(job) || "";


    document.getElementById("editJobStatus").value =
      job.status === "paid" ||
      job.paid === true
        ? "paid"
        : "owed";


    const minutes = parseDuration(job);

    document.getElementById("editJobDuration").value =
      minutes
        ? durationText(minutes)
        : "";


    updateEditorCalculation();


    document
      .getElementById("jobEditModal")
      .classList.add("show");

  };


  window.closeJobEditor = function(){

    document
      .getElementById("jobEditModal")
      .classList.remove("show");

  };


  function readDurationInput(){

    const input =
      document
        .getElementById("editJobDuration")
        .value
        .trim()
        .toLowerCase();


    if(!input){

      const start =
        document.getElementById("editJobStart").value;

      const end =
        document.getElementById("editJobEnd").value;

      if(start && end){

        const s = timeToMinutes(start);
        const e = timeToMinutes(end);

        let diff = e - s;

        if(diff < 0){
          diff += 1440;
        }

        return diff;
      }

      return 0;
    }


    /*
      Accepts:
      3 hours 45 minutes
      3h 45m
      3 hours
      45 minutes
      225
    */

    let hours = 0;
    let minutes = 0;


    const hourMatch =
      input.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)/);

    const minuteMatch =
      input.match(/(\d+)\s*(?:minutes?|mins?|m)/);


    if(hourMatch){
      hours = Number(hourMatch[1]);
    }

    if(minuteMatch){
      minutes = Number(minuteMatch[1]);
    }


    if(!hourMatch && !minuteMatch){

      const number =
        Number(input.replace(/[^\d.]/g,""));

      if(Number.isFinite(number)){

        if(number < 24){
          hours = number;
        }else{
          minutes = number;
        }

      }

    }


    return Math.round(hours * 60 + minutes);

  }


  function updateEditorCalculation(){

    const minutes = readDurationInput();

    const rate =
      Number(
        document.getElementById("editJobRate").value
      ) || 0;


    const price =
      (minutes / 60) * rate;


    document.getElementById("calculatedDuration").textContent =
      durationText(minutes);


    document.getElementById("calculatedPrice").textContent =
      price.toFixed(2);

  }


  document.addEventListener("input",function(event){

    if(
      event.target.id === "editJobDuration" ||
      event.target.id === "editJobRate" ||
      event.target.id === "editJobStart" ||
      event.target.id === "editJobEnd"
    ){

      updateEditorCalculation();

    }

  });


  window.saveEditedJob = function(){

    const data = getData();

    const id =
      document.getElementById("editJobId").value;


    const job =
      data.jobs.find(j =>
        String(j.id) === String(id) ||
        String(j.jobId) === String(id)
      );


    if(!job){

      alert("Job not found.");
      return;

    }


    const clientValue =
      document.getElementById("editJobClient").value;


    const client =
      data.clients.find(c =>
        String(c.id) === String(clientValue)
      ) ||
      data.clients.find(c =>
        String(c.name).toLowerCase() ===
        String(clientValue).toLowerCase()
      );


    const date =
      document.getElementById("editJobDate").value;


    const start =
      document.getElementById("editJobStart").value;


    const end =
      document.getElementById("editJobEnd").value;


    const minutes =
      readDurationInput();


    const rate =
      Number(
        document.getElementById("editJobRate").value
      ) || 0;


    const status =
      document.getElementById("editJobStatus").value;


    /*
      Preserve the original job and only change
      the fields the user edited.
    */

    job.date = date;

    job.jobDate = date;

    job.start = start;

    job.startTime = start;

    job.end = end;

    job.endTime = end;

    job.minutes = minutes;

    job.durationMinutes = minutes;

    job.rate = rate;

    job.hourlyRate = rate;

    job.hours = Math.floor(minutes / 60);

    job.extraMinutes = minutes % 60;

    job.duration =
      Math.round((minutes / 60) * 100) / 100;

    job.price =
      Math.round(((minutes / 60) * rate) * 100) / 100;

    job.amount =
      job.price;

    job.status =
      status;

    job.paid =
      status === "paid";

    job.completed =
      minutes > 0;


    if(client){

      job.clientId =
        client.id;

      job.client =
        client.name;

      job.clientName =
        client.name;

    }else{

      /*
        If no matching client exists, don't invent one.
      */

      job.client =
        job.client ||
        job.clientName;

    }


    saveStoredData(data);

    closeJobEditor();

    renderSchedulePage();


    /*
      Refresh the main app too, if the existing app
      already has a render() function.
    */

    if(typeof window.render === "function"){

      try{
        window.render();
      }catch(error){
        console.log("Main render refresh skipped.",error);
      }

    }

  };


  /* =========================================================
     DELETE JOB
     ========================================================= */

  window.deleteJobDirectly = function(jobId){

    const data = getData();

    const index =
      data.jobs.findIndex(j =>
        String(j.id) === String(jobId) ||
        String(j.jobId) === String(jobId) ||
        String(j.__temporaryId) === String(jobId)
      );


    if(index === -1){

      alert("Job not found.");
      return;

    }


    const job =
      data.jobs[index];


    const name =
      getClientName(job);


    const confirmed =
      window.confirm(
        `Delete the job for ${name}?\n\nThis cannot be undone.`
      );


    if(!confirmed){
      return;
    }


    data.jobs.splice(index,1);

    saveStoredData(data);

    renderSchedulePage();


    if(typeof window.render === "function"){

      try{
        window.render();
      }catch(error){
        console.log("Main render refresh skipped.",error);
      }

    }

  };


  window.deleteEditedJob = function(){

    const id =
      document.getElementById("editJobId").value;

    closeJobEditor();

    setTimeout(() => {

      deleteJobDirectly(id);

    },50);

  };


  /* =========================================================
     INVOICE

  /* =========================================================
     LIST / CALENDAR
     ========================================================= */

  window.currentScheduleView =
    localStorage.getItem("pureShineScheduleView") ||
    "list";


  window.setScheduleView = function(view){

    window.currentScheduleView =
      view;

    localStorage.setItem(
      "pureShineScheduleView",
      view
    );


    document
      .getElementById("listViewBtn")
      .classList.toggle(
        "active",
        view === "list"
      );


    document
      .getElementById("calendarViewBtn")
      .classList.toggle(
        "active",
        view === "calendar"
      );


    renderSchedulePage();

  };


  function renderCalendar(jobs){

    const content =
      document.getElementById("scheduleContent");


    const today =
      new Date();


    const year =
      today.getFullYear();


    const month =
      today.getMonth();


    const first =
      new Date(year,month,1);


    const last =
      new Date(year,month + 1,0);


    const firstDay =
      first.getDay();


    const days =
      last.getDate();


    let html = `

      <div class="day-card">

        <div class="day-title">
          ${today.toLocaleDateString("en-GB",{
            month:"long",
            year:"numeric"
          })}
        </div>

        <div class="day-count">
          Tap a job to edit or delete it
        </div>

      </div>

      <div style="
        display:grid;
        grid-template-columns:repeat(7,1fr);
        gap:7px;
        margin-bottom:10px;
      ">

    `;


    [
      "Sun",
      "Mon",
      "Tue",
      "Wed",
      "Thu",
      "Fri",
      "Sat"
    ].forEach(day => {

      html += `
        <div style="
          text-align:center;
          font-family:Georgia,serif;
          color:#9a8e97;
          font-size:13px;
          padding:5px 0;
        ">
          ${day}
        </div>
      `;

    });


    html += `</div>`;

    html += `
      <div style="
        display:grid;
        grid-template-columns:repeat(7,1fr);
        gap:7px;
      ">
    `;


    for(let i=0;i<firstDay;i++){

      html += `<div></div>`;

    }


    for(let day=1;day<=days;day++){

      const date =
        `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


      const dayJobs =
        jobs.filter(j =>
          getJobDate(j) === date
        );


      html += `

        <div
          onclick="openCalendarDay('${date}')"
          style="
            min-height:76px;
            background:white;
            border-radius:15px;
            padding:8px;
            box-shadow:0 3px 12px rgba(100,70,90,.06);
            cursor:pointer;
          "
        >

          <div style="
            font-family:Georgia,serif;
            font-size:16px;
            font-weight:bold;
            margin-bottom:5px;
          ">
            ${day}
          </div>

          ${
            dayJobs.map(job => `
              <div style="
                background:#f2d8e4;
                color:#8f5a73;
                border-radius:8px;
                padding:3px 4px;
                margin-top:3px;
                font-size:11px;
                overflow:hidden;
                white-space:nowrap;
                text-overflow:ellipsis;
              ">
                ${escapeHTML(getClientName(job))}
              </div>
            `).join("")
          }

        </div>

      `;

    }


    html += `</div>`;

    content.innerHTML = html;

  }


  window.openCalendarDay = function(date){

    const data = getData();

    const jobs =
      data.jobs.filter(j =>
        getJobDate(j) === date
      );


    if(!jobs.length){

      /*
        Don't create a fake job just because the calendar
        date was tapped.
      */

      return;

    }


    if(jobs.length === 1){

      const job =
        jobs[0];

      openJobEditor(
        job.id ||
        job.jobId ||
        createTemporaryId(job)
      );

      return;

    }


    renderList(jobs);

  };


  /* =========================================================
     INITIALISE
     ========================================================= */

  function initialiseSchedule(){

    const listBtn =
      document.getElementById("listViewBtn");

    const calendarBtn =
      document.getElementById("calendarViewBtn");


    if(window.currentScheduleView === "calendar"){

      listBtn.classList.remove("active");
      calendarBtn.classList.add("active");

    }else{

      listBtn.classList.add("active");
      calendarBtn.classList.remove("active");

    }


    renderSchedulePage();

  }


  /*
    Expose it so the existing app can call it whenever
    the Schedule tab is opened.
  */

  window.refreshSchedule =
    renderSchedulePage;


  if(document.readyState === "loading"){

    document.addEventListener(
      "DOMContentLoaded",
      initialiseSchedule
    );

  }else{

    initialiseSchedule();

  }

})();
</script>
