<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7d5e3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pure Shine">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">

  <title>Pure Shine Cleaning Manager ✨</title>

  <style>

    :root {
      --pink: #e9a4c7;
      --pink-dark: #b95c91;
      --pink-soft: #f8dce9;

      --purple: #e7dcf8;
      --green: #dcefe6;
      --yellow: #fff0c9;
      --blue: #dcecf8;

      --ink: #35334d;
      --muted: #858198;
      --white: #ffffff;
      --line: #eeeaf1;

      --shadow: 0 8px 24px rgba(72,55,90,.08);
      --radius: 24px;
    }


    /* =========================
       GLOBAL
    ========================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-width: 100%;
      max-width: 100%;

      margin: 0;
      padding: 0;

      overflow-x: hidden;

      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      color: var(--ink);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

      background:
        #faf8fc
        url("background.jpg")
        center top / cover
        fixed
        no-repeat;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      font-size: 16px;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    img {
      max-width: 100%;
    }


    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 100%;

      min-height: 100vh;
      min-height: 100dvh;

      padding-bottom: 92px;

      overflow-x: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    .top {
      padding:
        calc(16px + env(safe-area-inset-top))
        22px
        10px;

      background: rgba(255,255,255,.84);

      backdrop-filter: blur(14px);

      border-bottom:
        1px solid rgba(238,234,241,.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      width: 68px;
      height: 68px;

      border-radius: 18px;

      object-fit: cover;

      box-shadow:
        0 4px 14px rgba(185,92,145,.18);
    }

    .brand-fallback {
      width: 68px;
      height: 68px;

      border-radius: 18px;

      background: var(--pink-soft);

      display: grid;
      place-items: center;

      font-size: 34px;
    }

    .brand h1 {
      font-size: 25px;
      line-height: 1;

      margin: 0 0 7px;

      font-weight: 800;
    }

    .brand p {
      margin: 0;

      color: var(--muted);

      font-size: 15px;
    }

    .top-row {
      display: flex;

      align-items: center;
      justify-content: space-between;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 58px;
      height: 58px;

      border-radius: 18px;

      background: var(--purple);

      color: var(--ink);

      font-size: 25px;

      box-shadow: var(--shadow);
    }

    .icon-btn.add {
      background: var(--pink);
      color: #fff;
    }


    /* =========================
       MAIN
    ========================= */

    main {
      width: 100%;
      max-width: 920px;

      margin: 0 auto;

      padding: 0 22px;
    }

    .date {
      color: var(--muted);

      font-size: 17px;

      padding:
        2px
        0
        18px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }


    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 14px;

      margin-bottom: 30px;
    }

    .stat {
      border-radius: 28px;

      padding: 24px 20px;

      min-height: 128px;

      box-shadow: var(--shadow);
    }

    .stat.pink {
      background: #f5d7e5;
    }

    .stat.purple {
      background: #e7dcf8;
    }

    .stat.green {
      background: #d9eee4;
    }

    .stat.yellow {
      background: #ffedbd;
    }

    .stat .emoji {
      font-size: 24px;
    }

    .stat .label {
      color: #777389;

      margin-top: 10px;

      font-size: 17px;
    }

    .stat .value {
      font-size: 32px;

      font-weight: 800;

      margin-top: 4px;
    }


    /* =========================
       SECTION HEAD
    ========================= */

    .section-head {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin:
        0
        0
        16px;
    }

    h2 {
      font-size: 28px;

      margin: 0;

      font-weight: 800;
    }

    .link {
      color: var(--pink-dark);

      font-weight: 700;

      background: none;

      padding: 5px;
    }


    /* =========================
       CARDS
    ========================= */

    .card {
      background: rgba(255,255,255,.92);

      border-radius: 24px;

      box-shadow: var(--shadow);

      border:
        1px solid rgba(255,255,255,.75);
    }

    .schedule-card {
      padding: 17px 16px;

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 28px;
    }

    .bar {
      width: 10px;
      height: 62px;

      border-radius: 8px;

      background: var(--pink);

      flex: none;
    }

    .job-main {
      min-width: 0;
      flex: 1;
    }

    .job-main strong {
      font-size: 21px;

      display: block;
    }

    .job-main span {
      display: block;

      color: var(--muted);

      margin-top: 5px;
    }

    .job-actions {
      display: flex;

      gap: 6px;

      align-items: center;
    }

    .hours-input {
      width: 78px;

      text-align: center;

      border:
        1px solid #ddd7e3;

      border-radius: 13px;

      padding: 10px 5px;

      background: #fff;

      font-weight: 700;
    }

    .mini-btn {
      width: 48px;
      height: 48px;

      border-radius: 14px;

      background: var(--purple);

      font-size: 22px;
    }

    .mini-btn.edit {
      background: var(--pink-soft);
    }

    .mini-btn.running {
      background: #bfe8d3;
    }


    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 14px;
    }

    .quick {
      min-height: 104px;

      border-radius: 24px;

      padding: 17px 20px;

      text-align: left;

      color: var(--ink);

      box-shadow: var(--shadow);

      font-weight: 800;
    }

    .quick.pink {
      background: #f5d7e5;
    }

    .quick.purple {
      background: #e7dcf8;
    }

    .quick.green {
      background: #d9eee4;
    }

    .quick.blue {
      background: #dcecf8;
    }

    .quick .qicon {
      display: block;

      font-size: 25px;

      margin-bottom: 9px;
    }


    /* =========================
       QUOTE CARD
    ========================= */

    .quote {
      position: relative;

      overflow: hidden;

      margin-top: 18px;

      padding:
        27px
        20px
        72px;

      text-align: center;

      background: rgba(255,255,255,.92);

      border-radius: 24px;

      box-shadow: var(--shadow);

      min-height: 170px;
    }

    .quote-text {
      font-family: Georgia, serif;

      font-size: 18px;

      position: relative;

      z-index: 2;
    }

    .quote small {
      display: block;

      color: var(--muted);

      margin-top: 7px;

      position: relative;

      z-index: 2;
    }

    .quote-art {
      position: absolute;

      left: 50%;
      bottom: -3px;

      transform: translateX(-50%);

      width: min(94%, 520px);

      height: 120px;

      object-fit: contain;

      object-position: center bottom;

      pointer-events: none;

      z-index: 1;

      opacity: .9;
    }


    /* =========================
       BUTTONS
    ========================= */

    .toolbar {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 18px;
    }

    .primary,
    .secondary,
    .danger {
      padding: 12px 16px;

      border-radius: 14px;

      font-weight: 750;
    }

    .primary {
      background: var(--pink);
      color: #fff;
    }

    .secondary {
      background: var(--purple);
      color: var(--ink);
    }

    .danger {
      background: #f7d1d1;
      color: #8d3030;
    }


    /* =========================
       LISTS
    ========================= */

    .list {
      display: grid;

      gap: 12px;
    }

    .row {
      background: rgba(255,255,255,.94);

      border-radius: 20px;

      padding: 16px;

      box-shadow: var(--shadow);

      display: flex;

      justify-content: space-between;

      gap: 12px;

      align-items: center;
    }

    .row h3 {
      margin: 0 0 5px;

      font-size: 19px;
    }

    .row p {
      margin: 0;

      color: var(--muted);
    }

    .row-actions {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;

      justify-content: flex-end;
    }

    .empty {
      padding: 32px 20px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,.88);

      border-radius: 22px;
    }


    /* =========================
       MODALS
    ========================= */

    .modal {
      position: fixed;

      inset: 0;

      background: rgba(37,31,48,.42);

      backdrop-filter: blur(6px);

      display: none;

      align-items: flex-end;

      justify-content: center;

      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .sheet {
      width: 100%;

      max-width: 620px;

      max-height: 92vh;

      overflow: auto;

      background: #fff;

      border-radius: 28px 28px 0 0;

      padding:
        22px
        20px
        calc(26px + env(safe-area-inset-bottom));
    }

    .sheet-head {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 16px;
    }

    .sheet h3 {
      font-size: 23px;

      margin: 0;
    }

    .close {
      background: #f1edf4;

      border-radius: 12px;

      width: 42px;
      height: 42px;
    }

    label {
      display: block;

      font-weight: 700;

      margin:
        13px
        0
        7px;
    }

    input,
    select,
    textarea {
      width: 100%;

      border:
        1px solid #ddd7e3;

      border-radius: 13px;

      padding: 12px;

      background: #fff;

      color: var(--ink);
    }

    .form-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .form-actions {
      display: flex;

      gap: 10px;

      margin-top: 18px;
    }

    .form-actions > * {
      flex: 1;
    }


    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 80;

      padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

      background: rgba(255,255,255,.96);

      backdrop-filter: blur(18px);

      border-top:
        1px solid var(--line);

      display: grid;

      grid-template-columns: repeat(5,1fr);
    }

    .nav-btn {
      background: none;

      color: #858198;

      font-weight: 700;

      font-size: 12px;

      padding: 5px 2px;
    }

    .nav-btn .ni {
      display: block;

      font-size: 21px;

      margin-bottom: 2px;
    }

    .nav-btn.active {
      color: var(--pink-dark);
    }


    /* =========================
       TIMER
    ========================= */

    .timer-panel {
      position: fixed;

      right: 16px;

      bottom: 92px;

      background: #fff;

      border-radius: 18px;

      box-shadow:
        0 10px 30px rgba(0,0,0,.14);

      padding: 12px 15px;

      display: none;

      z-index: 70;
    }

    .timer-panel.show {
      display: block;
    }

    .timer-panel strong {
      display: block;
    }

    .timer-panel span {
      font-variant-numeric: tabular-nums;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 430px) {

      main {
        padding: 0 22px;
      }

      .stats {
        gap: 12px;
      }

      .stat {
        padding: 20px 16px;

        min-height: 122px;
      }

      .stat .value {
        font-size: 29px;
      }

      .quick-grid {
        gap: 12px;
      }

      .quick {
        padding: 15px 16px;
      }

      .schedule-card {
        padding: 15px 12px;
      }

      .job-actions {
        gap: 5px;
      }

      .hours-input {
        width: 68px;
      }

      .mini-btn {
        width: 44px;
        height: 44px;
      }
    }


    @media (min-width: 700px) {

      .app {
        padding-bottom: 20px;
      }

      .bottom-nav {
        max-width: 920px;

        left: 50%;
        right: auto;

        transform: translateX(-50%);

        bottom: 12px;

        border-radius: 22px;
      }

      .top {
        padding-left:
          calc((100% - 876px)/2 + 22px);

        padding-right:
          calc((100% - 876px)/2 + 22px);
      }
    }

  </style>
</head>


<body>

<div class="app">

  <!-- HEADER -->

  <header class="top">

    <div class="top-row">

      <div class="brand">

        <img
          src="icon.png"
          alt="Pure Shine"
          onerror="this.style.display='none';document.getElementById('brandFallback').style.display='grid'"
        >

        <div
          id="brandFallback"
          class="brand-fallback"
          style="display:none"
        >
          ✨
        </div>

        <div>

          <h1>Pure Shine</h1>

          <p>Cleaning Manager ✨</p>

        </div>

      </div>


      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="openTimerForNext()"
        >
          ⏱️
        </button>

        <button
          class="icon-btn add"
          onclick="openJobModal()"
        >
          ＋
        </button>

      </div>

    </div>

  </header>


  <main>


    <!-- HOME -->

    <section
      id="home"
      class="page active"
    >

      <div
        class="date"
        id="todayDate"
      ></div>


      <div class="stats">

        <div class="stat pink">

          <div class="emoji">🧹</div>

          <div class="label">Jobs</div>

          <div
            class="value"
            id="statJobs"
          >
            0
          </div>

        </div>


        <div class="stat purple">

          <div class="emoji">⏰</div>

          <div class="label">Hours</div>

          <div
            class="value"
            id="statHours"
          >
            0.00h
          </div>

        </div>


        <div class="stat green">

          <div class="emoji">💷</div>

          <div class="label">Earned</div>

          <div
            class="value"
            id="statEarned"
          >
            £0.00
          </div>

        </div>


        <div class="stat yellow">

          <div class="emoji">✨</div>

          <div class="label">Available</div>

          <div class="value">
            6.0h
          </div>

        </div>

      </div>


      <div class="section-head">

        <h2>
          Today's schedule
        </h2>

        <button
          class="link"
          onclick="showPage('jobs')"
        >
          View all
        </button>

      </div>


      <div id="todaySchedule"></div>


      <h2 style="margin:28px 0 16px">
        Quick actions
      </h2>


      <div class="quick-grid">

        <button
          class="quick pink"
          onclick="openTimerForNext()"
        >

          <span class="qicon">
            ⏱️
          </span>

          Start Timer

        </button>


        <button
          class="quick purple"
          onclick="openJobModal()"
        >

          <span class="qicon">
            ＋
          </span>

          Add Cleaning Job

        </button>


        <button
          class="quick green"
          onclick="showPage('jobs')"
        >

          <span class="qicon">
            📋
          </span>

          View Jobs

        </button>


        <button
          class="quick blue"
          onclick="showPage('earnings')"
        >

          <span class="qicon">
            💷
          </span>

          Earnings

        </button>

      </div>


      <!-- QUOTE CARD -->

      <div class="quote">

        <div class="quote-text">
          “A clean space is a happy place ♡”
        </div>

        <small>
          Pure Shine Cleaning
        </small>

        <img
          class="quote-art"
          src="cleaning-plant.png"
          alt=""
          aria-hidden="true"
        >

      </div>

    </section>



    <!-- WEEKLY SCHEDULE -->

    <section
      id="schedule"
      class="page"
    >

      <div class="section-head">

        <h2>
          Weekly Schedule
        </h2>

        <button
          class="primary"
          onclick="openJobModal()"
        >
          ＋ Add
        </button>

      </div>

      <div
        id="weeklyList"
        class="list"
      ></div>

    </section>



    <!-- CLIENTS -->

    <section
      id="clients"
      class="page"
    >

      <div class="section-head">

        <h2>
          Clients
        </h2>

        <button
          class="primary"
          onclick="openClientModal()"
        >
          ＋ Add
        </button>

      </div>

      <div
        id="clientsList"
        class="list"
      ></div>

    </section>



    <!-- JOBS -->

    <section
      id="jobs"
      class="page"
    >

      <div class="section-head">

        <h2>
          Jobs
        </h2>

        <button
          class="primary"
          onclick="openJobModal()"
        >
          ＋ Add
        </button>

      </div>


      <div class="toolbar">

        <button
          class="secondary"
          onclick="showTodayJobs()"
        >
          Today
        </button>

        <button
          class="secondary"
          onclick="renderJobs()"
        >
          All jobs
        </button>

      </div>


      <div
        id="jobsList"
        class="list"
      ></div>

    </section>



    <!-- EARNINGS -->

    <section
      id="earnings"
      class="page"
    >

      <div class="section-head">

        <h2>
          Earnings
        </h2>

      </div>


      <div class="stats">

        <div class="stat green">

          <div class="emoji">
            💷
          </div>

          <div class="label">
            Total
          </div>

          <div
            class="value"
            id="earnTotal"
          >
            £0.00
          </div>

        </div>


        <div class="stat purple">

          <div class="emoji">
            ⏰
          </div>

          <div class="label">
            Hours
          </div>

          <div
            class="value"
            id="earnHours"
          >
            0.00h
          </div>

        </div>

      </div>


      <div
        id="earningsList"
        class="list"
      ></div>

    </section>

  </main>



  <!-- TIMER PANEL -->

  <div
    id="timerPanel"
    class="timer-panel"
  >

    <strong id="timerClient">
      Timer
    </strong>

    <span id="timerValue">
      00:00:00
    </span>

  </div>



  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      data-page="home"
      onclick="showPage('home')"
    >

      <span class="ni">
        🏠
      </span>

      Home

    </button>


    <button
      class="nav-btn"
      data-page="schedule"
      onclick="showPage('schedule')"
    >

      <span class="ni">
        📅
      </span>

      Schedule

    </button>


    <button
      class="nav-btn"
      data-page="clients"
      onclick="showPage('clients')"
    >

      <span class="ni">
        👥
      </span>

      Clients

    </button>


    <button
      class="nav-btn"
      data-page="jobs"
      onclick="showPage('jobs')"
    >

      <span class="ni">
        📋
      </span>

      Jobs

    </button>


    <button
      class="nav-btn"
      data-page="earnings"
      onclick="showPage('earnings')"
    >

      <span class="ni">
        💷
      </span>

      Earnings

    </button>

  </nav>

</div>



<!-- CLIENT MODAL -->

<div
  id="clientModal"
  class="modal"
  onclick="if(event.target===this)closeModal('clientModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h3 id="clientModalTitle">
        Add Client
      </h3>

      <button
        class="close"
        onclick="closeModal('clientModal')"
      >
        ✕
      </button>

    </div>


    <input
      type="hidden"
      id="clientId"
    >


    <label>
      Name
    </label>

    <input
      id="clientName"
      placeholder="Client name"
    >


    <div class="form-grid">

      <div>

        <label>
          Type
        </label>

        <select id="clientType">

          <option>
            Private
          </option>

          <option>
            Agency
          </option>

        </select>

      </div>


      <div>

        <label>
          Rate (£/hour)
        </label>

        <input
          id="clientRate"
          type="number"
          min="0"
          step="0.01"
        >

      </div>

    </div>


    <div class="form-actions">

      <button
        class="secondary"
        onclick="closeModal('clientModal')"
      >
        Cancel
      </button>

      <button
        class="primary"
        onclick="saveClient()"
      >
        Save
      </button>

    </div>

  </div>

</div>



<!-- JOB MODAL -->

<div
  id="jobModal"
  class="modal"
  onclick="if(event.target===this)closeModal('jobModal')"
>

  <div class="sheet">

    <div class="sheet-head">

      <h3 id="jobModalTitle">
        Add Cleaning Job
      </h3>

      <button
        class="close"
        onclick="closeModal('jobModal')"
      >
        ✕
      </button>

    </div>


    <input
      type="hidden"
      id="jobId"
    >


    <label>
      Client
    </label>

    <select id="jobClient"></select>


    <div class="form-grid">

      <div>

        <label>
          Date
        </label>

        <input
          id="jobDate"
          type="date"
        >

      </div>


      <div>

        <label>
          Day
        </label>

        <select id="jobDay">

          <option>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
          <option>Saturday</option>
          <option>Sunday</option>

        </select>

      </div>

    </div>


    <div class="form-grid">

      <div>

        <label>
          Start
        </label>

        <input
          id="jobStart"
          type="time"
        >

      </div>


      <div>

        <label>
          End
        </label>

        <input
          id="jobEnd"
          type="time"
        >

      </div>

    </div>


    <div class="form-grid">

      <div>

        <label>
          Hours
        </label>

        <input
          id="jobHours"
          type="number"
          min="0"
          step="0.01"
        >

      </div>


      <div>

        <label>
          Rate (£/hour)
        </label>

        <input
          id="jobRate"
          type="number"
          min="0"
          step="0.01"
        >

      </div>

    </div>


    <label>
      Notes
    </label>

    <textarea
      id="jobNotes"
      rows="2"
      placeholder="Optional notes"
    ></textarea>


    <div class="form-actions">

      <button
        class="secondary"
        onclick="closeModal('jobModal')"
      >
        Cancel
      </button>

      <button
        class="primary"
        onclick="saveJob()"
      >
        Save
      </button>

    </div>


    <button
      id="deleteJobBtn"
      class="danger"
      style="width:100%;margin-top:10px;display:none"
      onclick="deleteCurrentJob()"
    >
      Delete job
    </button>

  </div>

</div>



<script>

  /* =========================
     STORAGE
  ========================= */

  const CLIENTS_KEY =
    "pure_shine_clients_v8";

  const JOBS_KEY =
    "pure_shine_jobs_v8";

  const TIMER_KEY =
    "pure_shine_timer_v8";


  /* =========================
     CLIENTS
  ========================= */

  const defaultClients = [

    {
      id: "lottie",
      name: "Lottie",
      type: "Agency",
      rate: 16
    },

    {
      id: "christine",
      name: "Christine",
      type: "Private",
      rate: 18
    },

    {
      id: "matt",
      name: "Matt",
      type: "Agency",
      rate: 16
    },

    {
      id: "sonia",
      name: "Sonia",
      type: "Agency",
      rate: 16
    },

    {
      id: "laura",
      name: "Laura",
      type: "Private",
      rate: 18
    },

    {
      id: "hannah",
      name: "Hannah",
      type: "Agency",
      rate: 16
    }

  ];


  /* =========================
     DEFAULT JOBS
  ========================= */

  const defaultJobs = [

    {
      id: "mon-lottie",
      clientId: "lottie",
      day: "Monday",
      date: "",
      start: "13:00",
      end: "15:00",
      hours: 2,
      rate: 16,
      notes: ""
    },

    {
      id: "tue-christine",
      clientId: "christine",
      day: "Tuesday",
      date: "",
      start: "09:30",
      end: "12:30",
      hours: 3,
      rate: 18,
      notes: ""
    },

    {
      id: "tue-matt",
      clientId: "matt",
      day: "Tuesday",
      date: "",
      start: "13:00",
      end: "17:00",
      hours: 4,
      rate: 16,
      notes: "Editable on the day"
    },

    {
      id: "wed-sonia",
      clientId: "sonia",
      day: "Wednesday",
      date: "",
      start: "09:00",
      end: "15:00",
      hours: 6,
      rate: 16,
      notes: "Usually 5–6 hours"
    },

    {
      id: "thu-laura",
      clientId: "laura",
      day: "Thursday",
      date: "",
      start: "09:00",
      end: "13:00",
      hours: 4,
      rate: 18,
      notes: "Sometimes 5 hours"
    },

    {
      id: "thu-hannah",
      clientId: "hannah",
      day: "Thursday",
      date: "",
      start: "13:00",
      end: "16:00",
      hours: 3,
      rate: 16,
      notes: ""
    }

  ];


  let clients =
    load(
      CLIENTS_KEY,
      defaultClients
    );

  let jobs =
    load(
      JOBS_KEY,
      defaultJobs
    );

  let timer =
    load(
      TIMER_KEY,
      null
    );


  /* =========================
     LOAD / SAVE
  ========================= */

  function load(key, fallback) {

    try {

      const x =
        JSON.parse(
          localStorage.getItem(key)
        );

      return x ?? structuredClone(fallback);

    } catch(e) {

      return structuredClone(fallback);

    }

  }


  function save() {

    /* Gill is always excluded */

    clients =
      clients.filter(
        c =>
          c.name.toLowerCase() !== "gill"
      );


    jobs =
      jobs.filter(j => {

        const c =
          clients.find(
            x => x.id === j.clientId
          );

        return (
          c &&
          c.name.toLowerCase() !== "gill"
        );

      });


    localStorage.setItem(
      CLIENTS_KEY,
      JSON.stringify(clients)
    );

    localStorage.setItem(
      JOBS_KEY,
      JSON.stringify(jobs)
    );

    localStorage.setItem(
      TIMER_KEY,
      JSON.stringify(timer)
    );

  }


  /* =========================
     HELPERS
  ========================= */

  const dayNames = [
    "Sunday",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday"
  ];


  const money =
    n =>
      "£" +
      Number(n || 0).toFixed(2);


  const hoursText =
    n =>
      Number(n || 0).toFixed(2) +
      "h";


  const todayISO =
    () =>
      new Date()
        .toISOString()
        .slice(0,10);


  function dateLabel() {

    return new Intl.DateTimeFormat(
      "en-GB",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    ).format(new Date());

  }


  function clientById(id) {

    return clients.find(
      c => c.id === id
    );

  }


  function todayJobs() {

    const d = new Date();

    const iso =
      todayISO();

    const day =
      dayNames[d.getDay()];

    return jobs.filter(
      j =>
        (
          j.date &&
          j.date === iso
        )
        ||
        (
          !j.date &&
          j.day === day
        )
    );

  }


  /* =========================
     PAGE NAVIGATION
  ========================= */

  function showPage(page) {

    document
      .querySelectorAll(".page")
      .forEach(
        p =>
          p.classList.remove("active")
      );


    document
      .getElementById(page)
      .classList.add("active");


    document
      .querySelectorAll(".nav-btn")
      .forEach(
        b =>
          b.classList.toggle(
            "active",
            b.dataset.page === page
          )
      );


    renderAll();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================
     HOME
  ========================= */

  function renderHome() {

    document
      .getElementById("todayDate")
      .textContent =
        dateLabel();


    const list =
      todayJobs();


    const totalH =
      list.reduce(
        (s,j) =>
          s +
          Number(j.hours || 0),
        0
      );


    const totalE =
      list.reduce(
        (s,j) =>
          s +
          Number(j.hours || 0) *
          Number(j.rate || 0),
        0
      );


    document
      .getElementById("statJobs")
      .textContent =
        list.length;


    document
      .getElementById("statHours")
      .textContent =
        hoursText(totalH);


    document
      .getElementById("statEarned")
      .textContent =
        money(totalE);


    const el =
      document.getElementById(
        "todaySchedule"
      );


    if (!list.length) {

      el.innerHTML =
        '<div class="empty">No cleaning jobs scheduled today.</div>';

      return;

    }


    el.innerHTML =
      list
        .map(j => {

          const c =
            clientById(
              j.clientId
            );


          const running =
            timer &&
            timer.jobId === j.id;


          return `

            <div class="card schedule-card">

              <div class="bar"></div>

              <div class="job-main">

                <strong>
                  ${esc(c?.name || "Unknown")}
                </strong>

                <span>
                  ${esc(j.start || "")}
                  –
                  ${esc(j.end || "")}
                </span>

              </div>


              <div class="job-actions">

                <input
                  class="hours-input"
                  type="number"
                  min="0"
                  step="0.01"
                  value="${Number(j.hours || 0)}"
                  onchange="changeHours('${j.id}',this.value)"
                >


                <button
                  class="mini-btn ${running ? "running" : ""}"
                  onclick="toggleTimer('${j.id}')"
                >
                  ${running ? "⏹️" : "⏱️"}
                </button>


                <button
                  class="mini-btn edit"
                  onclick="openJobModal('${j.id}')"
                >
                  ✏️
                </button>

              </div>

            </div>

          `;

        })
        .join("");

  }


  /* =========================
     WEEKLY
  ========================= */

  function renderWeekly() {

    const order = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];


    const el =
      document.getElementById(
        "weeklyList"
      );


    const valid =
      jobs.filter(
        j =>
          clientById(
            j.clientId
          )
      );


    el.innerHTML =
      order
        .map(day => {

          const js =
            valid.filter(
              j =>
                j.day === day
            );


          if (!js.length)
            return "";


          return `

            <div>

              <h3
                style="margin:12px 0 8px"
              >
                ${day}
              </h3>

              ${

                js.map(j => {

                  const c =
                    clientById(
                      j.clientId
                    );


                  return `

                    <div class="row">

                      <div>

                        <h3>
                          ${esc(c.name)}
                        </h3>

                        <p>
                          ${j.start || ""}
                          –
                          ${j.end || ""}
                          ·
                          ${hoursText(j.hours)}
                          ·
                          ${money(j.rate)}/h
                        </p>

                      </div>


                      <div class="row-actions">

                        <button
                          class="secondary"
                          onclick="openJobModal('${j.id}')"
                        >
                          Edit
                        </button>

                      </div>

                    </div>

                  `;

                }).join("")

              }

            </div>

          `;

        })
        .join("")
        ||
        '<div class="empty">No weekly jobs yet.</div>';

  }


  /* =========================
     CLIENTS
  ========================= */

  function renderClients() {

    const el =
      document.getElementById(
        "clientsList"
      );


    el.innerHTML =
      clients
        .map(c => `

          <div class="row">

            <div>

              <h3>
                ${esc(c.name)}
              </h3>

              <p>
                ${c.type}
                ·
                ${money(c.rate)}/hour
              </p>

            </div>


            <div class="row-actions">

              <button
                class="secondary"
                onclick="openClientModal('${c.id}')"
              >
                Edit
              </button>


              <button
                class="danger"
                onclick="deleteClient('${c.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        `)
        .join("")
        ||
        '<div class="empty">No clients yet.</div>';

  }


  /* =========================
     JOBS
  ========================= */

  function renderJobs() {

    const el =
      document.getElementById(
        "jobsList"
      );


    const sorted =
      [...jobs].sort(
        (a,b) =>
          (a.date || "")
            .localeCompare(
              b.date || ""
            )
      );


    el.innerHTML =
      sorted
        .map(j => {

          const c =
            clientById(
              j.clientId
            );


          if (!c)
            return "";


          const actualDate =
            j.date
              ?
              new Date(
                j.date +
                "T12:00:00"
              ).toLocaleDateString(
                "en-GB"
              )
              :
              "Weekly";


          return `

            <div class="row">

              <div>

                <h3>
                  ${esc(c.name)}
                </h3>

                <p>
                  ${actualDate}
                  ·
                  ${esc(j.start || "")}
                  –
                  ${esc(j.end || "")}
                  ·
                  ${hoursText(j.hours)}
                  ·
                  ${money(j.rate)}/h
                </p>

              </div>


              <div class="row-actions">

                <button
                  class="secondary"
                  onclick="openJobModal('${j.id}')"
                >
                  Edit
                </button>

              </div>

            </div>

          `;

        })
        .join("")
        ||
        '<div class="empty">No jobs yet.</div>';

  }


  function showTodayJobs() {

    const el =
      document.getElementById(
        "jobsList"
      );


    const list =
      todayJobs();


    el.innerHTML =
      list
        .map(j => {

          const c =
            clientById(
              j.clientId
            );


          return `

            <div class="row">

              <div>

                <h3>
                  ${esc(
                    c?.name ||
                    "Unknown"
                  )}
                </h3>

                <p>
                  ${j.start || ""}
                  –
                  ${j.end || ""}
                  ·
                  ${hoursText(j.hours)}
                  ·
                  ${money(j.rate)}/h
                </p>

              </div>


              <div class="row-actions">

                <button
                  class="secondary"
                  onclick="openJobModal('${j.id}')"
                >
                  Edit
                </button>

              </div>

            </div>

          `;

        })
        .join("")
        ||
        '<div class="empty">No jobs today.</div>';

  }


  /* =========================
     EARNINGS
  ========================= */

  function renderEarnings() {

    const totalH =
      jobs.reduce(
        (s,j) =>
          s +
          Number(j.hours || 0),
        0
      );


    const totalE =
      jobs.reduce(
        (s,j) =>
          s +
          Number(j.hours || 0) *
          Number(j.rate || 0),
        0
      );


    document
      .getElementById("earnHours")
      .textContent =
        hoursText(totalH);


    document
      .getElementById("earnTotal")
      .textContent =
        money(totalE);


    document
      .getElementById("earningsList")
      .innerHTML =
      [...jobs]
        .reverse()
        .map(j => {

          const c =
            clientById(
              j.clientId
            );


          if (!c)
            return "";


          return `

            <div class="row">

              <div>

                <h3>
                  ${esc(c.name)}
                </h3>

                <p>
                  ${hoursText(j.hours)}
                  ×
                  ${money(j.rate)}/h
                </p>

              </div>


              <strong>
                ${money(
                  Number(j.hours || 0) *
                  Number(j.rate || 0)
                )}
              </strong>

            </div>

          `;

        })
        .join("")
        ||
        '<div class="empty">No earnings yet.</div>';

  }


  /* =========================
     RENDER ALL
  ========================= */

  function renderAll() {

    renderHome();

    renderWeekly();

    renderClients();

    renderJobs();

    renderEarnings();

    updateTimerPanel();

  }


  /* =========================
     CLIENT MODAL
  ========================= */

  function openClientModal(id = null) {

    document
      .getElementById(
        "clientModalTitle"
      )
      .textContent =
        id
          ?
          "Edit Client"
          :
          "Add Client";


    document
      .getElementById(
        "clientId"
      )
      .value =
        id || "";


    const c =
      id &&
      clientById(id);


    document
      .getElementById(
        "clientName"
      )
      .value =
        c?.name || "";


    document
      .getElementById(
        "clientType"
      )
      .value =
        c?.type || "Private";


    document
      .getElementById(
        "clientRate"
      )
      .value =
        c?.rate ?? 18;


    document
      .getElementById(
        "clientModal"
      )
      .classList.add("show");

  }


  function saveClient() {

    const id =
      document
        .getElementById(
          "clientId"
        )
        .value;


    const name =
      document
        .getElementById(
          "clientName"
        )
        .value
        .trim();


    if (
      !name ||
      name.toLowerCase() === "gill"
    ) {

      alert(
        "Please enter a valid client name."
      );

      return;

    }


    const obj = {

      id:
        id ||
        ("c-" + Date.now()),

      name,

      type:
        document
          .getElementById(
            "clientType"
          )
          .value,

      rate:
        Number(
          document
            .getElementById(
              "clientRate"
            )
            .value ||
          0
        )

    };


    if (id) {

      clients =
        clients.map(
          c =>
            c.id === id
              ?
              obj
              :
              c
        );

    } else {

      clients.push(obj);

    }


    save();

    closeModal(
      "clientModal"
    );

    renderAll();

  }


  function deleteClient(id) {

    const c =
      clientById(id);


    if (!c)
      return;


    if (
      !confirm(
        `Delete ${c.name}? Their scheduled jobs will also be removed.`
      )
    )
      return;


    clients =
      clients.filter(
        x => x.id !== id
      );


    jobs =
      jobs.filter(
        j => j.clientId !== id
      );


    save();

    renderAll();

  }


  /* =========================
     JOB MODAL
  ========================= */

  function openJobModal(id = null) {

    document
      .getElementById(
        "jobModalTitle"
      )
      .textContent =
        id
          ?
          "Edit Cleaning Job"
          :
          "Add Cleaning Job";


    document
      .getElementById(
        "jobId"
      )
      .value =
        id || "";


    document
      .getElementById(
        "deleteJobBtn"
      )
      .style.display =
        id
          ?
          "block"
          :
          "none";


    const sel =
      document.getElementById(
        "jobClient"
      );


    sel.innerHTML =
      clients
        .map(
          c =>
            `<option value="${c.id}">${esc(c.name)}</option>`
        )
        .join("");


    const j =
      id &&
      jobs.find(
        x => x.id === id
      );


    sel.value =
      j?.clientId ||
      clients[0]?.id ||
      "";


    document
      .getElementById(
        "jobDate"
      )
      .value =
        j?.date || "";


    document
      .getElementById(
        "jobDay"
      )
      .value =
        j?.day ||
        dayNames[
          new Date().getDay()
        ];


    document
      .getElementById(
        "jobStart"
      )
      .value =
        j?.start ||
        "09:00";


    document
      .getElementById(
        "jobEnd"
      )
      .value =
        j?.end ||
        "12:00";


    document
      .getElementById(
        "jobHours"
      )
      .value =
        j?.hours ??
        3;


    document
      .getElementById(
        "jobRate"
      )
      .value =
        j?.rate ??
        clientById(
          sel.value
        )?.rate ??
        16;


    document
      .getElementById(
        "jobNotes"
      )
      .value =
        j?.notes ||
        "";


    document
      .getElementById(
        "jobModal"
      )
      .classList.add(
        "show"
      );

  }


  document
    .getElementById(
      "jobClient"
    )
    .addEventListener(
      "change",
      e => {

        const c =
          clientById(
            e.target.value
          );


        if (c) {

          document
            .getElementById(
              "jobRate"
            )
            .value =
              c.rate;

        }

      }
    );


  function saveJob() {

    const id =
      document
        .getElementById(
          "jobId"
        )
        .value;


    const clientId =
      document
        .getElementById(
          "jobClient"
        )
        .value;


    const c =
      clientById(
        clientId
      );


    if (!c)
      return;


    const obj = {

      id:
        id ||
        ("j-" + Date.now()),

      clientId,

      day:
        document
          .getElementById(
            "jobDay"
          )
          .value,

      date:
        document
          .getElementById(
            "jobDate"
          )
          .value,

      start:
        document
          .getElementById(
            "jobStart"
          )
          .value,

      end:
        document
          .getElementById(
            "jobEnd"
          )
          .value,

      hours:
        Number(
          document
            .getElementById(
              "jobHours"
            )
            .value ||
          0
        ),

      rate:
        Number(
          document
            .getElementById(
              "jobRate"
            )
            .value ||
          c.rate ||
          0
        ),

      notes:
        document
          .getElementById(
            "jobNotes"
          )
          .value
          .trim()

    };


    if (id) {

      jobs =
        jobs.map(
          j =>
            j.id === id
              ?
              obj
              :
              j
        );

    } else {

      jobs.push(obj);

    }


    save();

    closeModal(
      "jobModal"
    );

    renderAll();

  }


  function deleteCurrentJob() {

    const id =
      document
        .getElementById(
          "jobId"
        )
        .value;


    if (!id)
      return;


    if (
      !confirm(
        "Delete this cleaning job?"
      )
    )
      return;


    if (
      timer?.jobId === id
    ) {

      timer = null;

      save();

    }


    jobs =
      jobs.filter(
        j => j.id !== id
      );


    save();

    closeModal(
      "jobModal"
    );

    renderAll();

  }


  /* =========================
     EDIT HOURS
  ========================= */

  function changeHours(
    id,
    value
  ) {

    const j =
      jobs.find(
        x => x.id === id
      );


    if (!j)
      return;


    j.hours =
      Number(
        value || 0
      );


    save();

    renderAll();

  }


  /* =========================
     TIMER
  ========================= */

  function toggleTimer(
    jobId
  ) {

    if (
      timer?.jobId === jobId
    ) {

      stopTimer();

      return;

    }


    const j =
      jobs.find(
        x => x.id === jobId
      );


    if (!j)
      return;


    timer = {

      jobId,

      startedAt:
        Date.now(),

      baseHours:
        Number(
          j.hours || 0
        )

    };


    save();

    renderAll();

  }


  function stopTimer() {

    if (!timer)
      return;


    const j =
      jobs.find(
        x =>
          x.id ===
          timer.jobId
      );


    if (j) {

      const elapsed =
        (
          Date.now() -
          timer.startedAt
        ) /
        3600000;


      j.hours =
        Number(
          timer.baseHours || 0
        ) +
        elapsed;

    }


    timer = null;

    save();

    renderAll();

  }


  function openTimerForNext() {

    const j =
      todayJobs()[0] ||
      jobs[0];


    if (j) {

      toggleTimer(
        j.id
      );

    } else {

      openJobModal();

    }

  }


  function updateTimerPanel() {

    const panel =
      document.getElementById(
        "timerPanel"
      );


    if (!timer) {

      panel.classList.remove(
        "show"
      );

      return;

    }


    const j =
      jobs.find(
        x =>
          x.id ===
          timer.jobId
      );


    const c =
      j &&
      clientById(
        j.clientId
      );


    if (!j) {

      timer = null;

      save();

      panel.classList.remove(
        "show"
      );

      return;

    }


    panel.classList.add(
      "show"
    );


    document
      .getElementById(
        "timerClient"
      )
      .textContent =
        c?.name ||
        "Timer";


    const sec =
      Math.max(
        0,
        Math.floor(
          (
            Date.now() -
            timer.startedAt
          ) /
          1000
        )
      );


    const h =
      String(
        Math.floor(
          sec / 3600
        )
      ).padStart(
        2,
        "0"
      );


    const m =
      String(
        Math.floor(
          (
            sec % 3600
          ) / 60
        )
      ).padStart(
        2,
        "0"
      );


    const s =
      String(
        sec % 60
      ).padStart(
        2,
        "0"
      );


    document
      .getElementById(
        "timerValue"
      )
      .textContent =
        `${h}:${m}:${s}`;

  }


  setInterval(
    updateTimerPanel,
    1000
  );


  /* =========================
     MODALS
  ========================= */

  function closeModal(id) {

    document
      .getElementById(id)
      .classList.remove(
        "show"
      );

  }


  /* =========================
     SECURITY / TEXT
  ========================= */

  function esc(s) {

    return String(
      s ?? ""
    ).replace(
      /[&<>"']/g,
      m => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m])
    );

  }


  /* =========================
     START APP
  ========================= */

  save();

  renderAll();

</script>

</body>
</html>
