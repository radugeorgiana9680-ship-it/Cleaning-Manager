<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4c6da">

<meta name="apple-mobile-web-app-status-bar-style" content="light">

<title>Pure Shine Cleaning Manager ✨</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#343348;
    background:
        linear-gradient(rgba(249,246,251,.82),rgba(249,246,251,.92)),
        url("background.jpg") center/cover fixed no-repeat;
    overscroll-behavior-x:none;
}

button,input,select,textarea{
    font:inherit;
}

input,select,textarea{
    font-size:16px !important;
}

button{
    border:0;
    touch-action:manipulation;
}

.app{
    min-height:100vh;
    width:100%;
    max-width:100%;
    padding-bottom:95px;
    overflow-x:hidden;
}

.header{
    position:sticky;
    top:0;
    z-index:20;
    min-height:110px;
    width:100%;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #eee5ed;
    backdrop-filter:blur(15px);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
    flex:1;
}

.brand > div:last-child{
    min-width:0;
}

.brand-title{
    font-size:27px;
    font-weight:850;
    white-space:nowrap;
}

.brand-subtitle{
    color:#8b879c;
    font-size:15px;
    margin-top:3px;
}

.logo{
    width:68px;
    height:68px;
    flex:0 0 68px;
    border-radius:21px;
    object-fit:cover;
    background:#f2b8d0;
    box-shadow:0 7px 20px rgba(180,90,130,.18);
}

.logo-fallback{
    display:none;
    width:68px;
    height:68px;
    flex:0 0 68px;
    border-radius:21px;
    align-items:center;
    justify-content:center;
    background:#f2b8d0;
    font-size:32px;
}

.header-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.header-btn{
    width:54px;
    height:54px;
    border-radius:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:#efabc8;
    color:white;
}

.header-btn.timer{
    background:#e5daf7;
    color:#655b7d;
}

.content{
    width:100%;
    max-width:780px;
    margin:auto;
    padding:29px 20px 35px;
}

.greeting{
    margin:0;
    font-size:40px;
    line-height:1;
    letter-spacing:-1.5px;
}

.date{
    color:#8b879c;
    font-size:17px;
    margin-top:9px;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
    margin-top:29px;
}

.stat{
    min-height:145px;
    padding:19px;
    border-radius:27px;
}

.stat.jobs{background:#f8dce8}
.stat.hours{background:#e9e0f8}
.stat.earned{background:#ddf1e6}
.stat.available{background:#fff0c9}

.stat-icon{font-size:27px}

.stat-label{
    color:#777388;
    margin-top:8px;
    font-size:16px;
}

.stat-value{
    font-size:30px;
    font-weight:850;
    margin-top:4px;
}

.section{
    margin-top:30px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:13px;
}

.section-title{
    margin:0;
    font-size:27px;
    font-weight:850;
}

.text-btn{
    background:none;
    color:#b25d87;
    font-weight:800;
}

.schedule-card{
    background:white;
    border-radius:24px;
    padding:16px;
    margin-bottom:11px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 7px 22px rgba(60,50,75,.07);

}

.schedule-line{
    width:9px;
    min-height:60px;
    flex:0 0 9px;
    border-radius:20px;

}

.schedule-info{
    flex:1;
    min-width:0;
}

.schedule-name{
    font-size:20px;
    font-weight:850;
    overflow:hidden;
    text-overflow:ellipsis;
}

.schedule-time{
    color:#8a869a;
    font-size:15px;
    margin-top:4px;
}

.schedule-actions{
    display:flex;
    gap:5px;
    align-items:center;
    flex-shrink:0;
}

.hours-input{
    width:70px;
    height:42px;
    border:1px solid #ddd6e2;
    border-radius:12px;
    text-align:center;
    background:#faf8fc;
    font-weight:800;
}

.small-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#eee6f8;
    color:#655982;
    flex:0 0 42px;
}

.small-btn.pink{

}

.small-btn.red{
    background:#ffe8ee;
    color:#bd5473;
}

.running{
    background:#d993b7!important;
    color:white!important;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.quick{
    min-height:94px;
    padding:17px;
    border-radius:23px;
    text-align:left;
    color:#403c51;
    font-weight:800;
}

.quick.pink{background:#f8dce8}
.quick.purple{background:#e9e0f8}
.quick.green{background:#ddf1e6}
.quick.blue{background:#e1eef8}

.quick-icon{
    display:block;
    font-size:27px;
    margin-bottom:7px;
}

.quote{
    position:relative;
    overflow:hidden;
    min-height:172px;
    margin-top:18px;
    padding:28px 22px;
    border-radius:24px;
    background:rgba(255,255,255,.94);
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 7px 22px rgba(60,50,75,.06);
}

.quote::before{
    content:"";
    position:absolute;
    left:-10px;
    bottom:-12px;
    width:155px;
    height:125px;
    background:url("decor.svg") center/contain no-repeat;
    opacity:.88;
    pointer-events:none;
}

.quote::after{
    content:"";
    position:absolute;
    right:-20px;
    top:-28px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#f8dce8;
    opacity:.42;
    pointer-events:none;
}

.quote-main,
.quote-sub{
    position:relative;
    z-index:2;
}

.quote-main{
    font-family:Georgia,serif;
    font-size:18px;
    font-weight:700;
}

.quote-sub{
    margin-top:6px;
    color:#9993a4;
    font-size:13px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:100;
    height:80px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:rgba(255,255,255,.98);
    border-top:1px solid #e9e3eb;
    padding-bottom:env(safe-area-inset-bottom);
}

.nav{
    background:none;
    color:#8a8698;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:11px;
    font-weight:800;
}

.nav-icon{
    font-size:22px;
}

.nav.active{
    color:#b45d87;
}

.primary{
    min-height:48px;
    padding:0 18px;
    border-radius:15px;
    background:#df99ba;
    color:white;
    font-weight:800;
}

.secondary{
    min-height:45px;
    padding:0 15px;
    border-radius:14px;
    background:#eee7f8;
    color:#665a83;
    font-weight:800;
}

.danger{
    min-height:45px;
    padding:0 15px;
    border-radius:14px;
    background:#ffe8ee;
    color:#bd5473;
    font-weight:800;
}

.empty{
    background:rgba(255,255,255,.75);
    border-radius:23px;
    padding:35px 15px;
    text-align:center;
    color:#8d8798;
}

.empty-icon{
    font-size:42px;
    margin-bottom:8px;
}

.card{
    background:white;
    padding:18px;
    border-radius:23px;
    margin-bottom:12px;
    box-shadow:0 7px 22px rgba(60,50,75,.06);
}

.card-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.card-name{
    font-size:20px;
    font-weight:850;
}

.card-details{
    color:#858094;
    font-size:14px;
    line-height:1.6;
    margin-top:6px;
}

.badge{
    height:max-content;
    padding:6px 10px;
    border-radius:10px;
    font-size:10px;
    font-weight:800;
}

.badge.agency{
    background:#e9e0f8;
    color:#6c5a92;
}

.badge.private{
    background:#f8dce8;
    color:#a54f76;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.modal-bg{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(35,29,44,.42);
}

.modal{
    width:100%;
    max-width:620px;
    max-height:92vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:23px 20px 40px;
    border-radius:30px 30px 0 0;
    background:#fbf9fc;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}

.modal-title{
    margin:0;
    font-size:27px;
    font-weight:850;
}

.close{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#eee8f1;
    font-size:25px;
    color:#595469;
    flex:0 0 44px;
}

.form-group{
    margin-bottom:15px;
}

.label{
    display:block;
    margin-bottom:7px;
    color:#777287;
    font-size:13px;
    font-weight:800;
}

.control{
    width:100%;
    min-height:52px;
    padding:11px 13px;
    border:1px solid #ddd6e2;
    border-radius:15px;
    background:white;
    color:#383548;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.timer-box{
    padding:24px;
    border-radius:27px;
    background:linear-gradient(135deg,#f8dce8,#e8def7);
    text-align:center;
}

.timer-display{
    font-size:48px;
    font-weight:850;
    margin:12px 0 22px;
    letter-spacing:2px;
}

.timer-info{
    margin-top:15px;
    padding:16px;
    border-radius:18px;
    background:rgba(255,255,255,.72);
}

.timer-big{
    display:block;
    margin:5px 0 12px;
    font-size:28px;
    font-weight:850;
    color:#b04f7c;
}

.timer-banner{
    position:sticky;
    top:0;
    z-index:25;
    width:100%;
    min-height:46px;
    padding:9px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:linear-gradient(90deg,#d98eb2,#aa8fcf);
    color:white;
    font-size:13px;
    font-weight:750;
    box-shadow:0 5px 18px rgba(80,50,90,.15);
}

.timer-banner strong{
    font-size:16px;
    letter-spacing:1px;
}

.earnings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.earning{
    padding:20px;
    border-radius:23px;
}

.earning.green{background:#ddf1e6}
.earning.pink{background:#f8dce8}
.earning.yellow{background:#fff0c9}
.earning.purple{background:#e9e0f8}

.earning-label{
    color:#777388;
    font-size:13px;
    font-weight:800;
}

.earning-value{
    margin-top:7px;
    font-size:27px;
    font-weight:850;
}

.note{
    color:#918b9c;
    font-size:12px;
    line-height:1.5;
    margin-top:7px;
}

@media(max-width:390px){

    .header{
        padding-left:12px;
        padding-right:12px;
    }

    .brand{
        gap:9px;
    }

    .brand-title{
        font-size:23px;
    }

    .brand-subtitle{
        font-size:13px;
    }

    .logo,
    .logo-fallback{
        width:60px;
        height:60px;
        flex-basis:60px;
    }

    .header-btn{
        width:48px;
        height:48px;
        border-radius:17px;
    }

    .content{
        padding-left:14px;
        padding-right:14px;
    }

    .schedule-card{
        padding:13px 10px;
        gap:8px;
    }

    .schedule-actions{
        gap:3px;
    }

    .hours-input{
        width:58px;
    }

    .small-btn{
        width:38px;
        height:38px;
        flex-basis:38px;
    }

    .schedule-name{
        font-size:18px;
    }

    .schedule-time{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const STORAGE_KEY="pureShineCleaningManager_FINAL";
const TIMER_KEY="pureShineCleaningManager_TIMER";

const defaultClients=[
    {
        id:1,
        name:"Tosca",
        type:"agency",
        rate:16,
        day:"Monday",
        start:"09:00",
        end:"12:00",
        freq:"weekly",
        week:"A"
    },
    {
        id:2,
        name:"Lottie",
        type:"agency",
        rate:16,
        day:"Monday",
        start:"13:00",
        end:"15:00",
        freq:"weekly",
        week:"A"
    },
    {
        id:3,
        name:"Christine",
        type:"private",
        rate:18,
        day:"Tuesday",
        start:"09:30",
        end:"12:30",
        freq:"weekly",
        week:"A"
    },
    {
        id:4,
        name:"Matt",
        type:"agency",
        rate:16,
        day:"Tuesday",
        start:"13:00",
        end:"17:00",
        freq:"weekly",
        week:"A",
        variable:true,
        maxHours:6
    },
    {
        id:5,
        name:"Sonia",
        type:"agency",
        rate:16,
        day:"Wednesday",
        start:"09:00",
        end:"14:00",
        freq:"weekly",
        week:"A",
        variable:true
    },
    {
        id:7,
        name:"Laura",
        type:"private",
        rate:18,
        day:"Thursday",
        start:"09:00",
        end:"13:00",
        freq:"weekly",
        week:"A",
        variable:true
    },
    {
        id:8,
        name:"Hannah",
        type:"agency",
        rate:16,
        day:"Thursday",
        start:"13:00",
        end:"16:00",
        freq:"weekly",
        week:"A"
    },
    {
        id:9,
        name:"Joanna",
        type:"private",
        rate:18,
        day:"Friday",
        start:"09:30",
        end:"13:30",
        freq:"fortnightly",
        week:"A",
        variable:true
    },
    {
        id:10,
        name:"Sindu",
        type:"agency",
        rate:16,
        day:"Friday",
        start:"09:30",
        end:"12:30",
        freq:"fortnightly",
        week:"B"
    }
];

/* --------------------------------------------------
   DATA
-------------------------------------------------- */

var data;

try{
    data=JSON.parse(localStorage.getItem(STORAGE_KEY));
}catch(e){
    data=null;
}

if(!data || !Array.isArray(data.clients)){
    data={
        clients:defaultClients,
        jobs:[]
    };
}

if(!Array.isArray(data.jobs)){
    data.jobs=[];
}

/* Gill removed */
data.clients=data.clients.filter(function(c){
    return String(c.name||"").toLowerCase()!=="gill";
});

data.jobs=data.jobs.filter(function(j){
    return String(j.clientName||"").toLowerCase()!=="gill";
});

function saveData(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

saveData();

/* --------------------------------------------------
   TIMER
-------------------------------------------------- */

var timer={
    running:false,
    clientId:null,
    startedAt:null,
    accumulated:0
};

try{
    var savedTimer=JSON.parse(localStorage.getItem(TIMER_KEY));
    if(savedTimer && typeof savedTimer==="object"){
        timer=savedTimer;
    }
}catch(e){}

function saveTimer(){
    try{
        localStorage.setItem(TIMER_KEY,JSON.stringify(timer));
    }catch(e){}
}

/*
   IMPORTANT:
   The timer does NOT depend on setInterval to keep time.

   startedAt is stored in milliseconds.
   Therefore, if iPhone suspends Safari/PWA in the
   background, the next calculation uses Date.now()
   and automatically catches up with the real elapsed time.
*/

function timerSeconds(){

    if(!timer.running){
        return Number(timer.accumulated||0);
    }

    var started=Number(timer.startedAt||0);

    if(!started){
        return Number(timer.accumulated||0);
    }

    return Number(timer.accumulated||0)
        +
        Math.max(
            0,
            Math.floor(
                (Date.now()-started)/1000
            )
        );
}

function timerText(seconds){

    seconds=Math.max(
        0,
        Math.floor(Number(seconds)||0)
    );

    var h=Math.floor(seconds/3600);

    var m=Math.floor(
        (seconds%3600)/60
    );

    var s=seconds%60;

    return String(h).padStart(2,"0")
        +":"
        +String(m).padStart(2,"0")
        +":"
        +String(s).padStart(2,"0");
}

function timerHours(){
    return timerSeconds()/3600;
}

/* --------------------------------------------------
   HELPERS
-------------------------------------------------- */

function esc(value){

    return String(value==null?"":value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function money(value){

    return "£"
        +Number(value||0)
        .toFixed(2);
}

function today(){

    var d=new Date();

    return d.getFullYear()
        +"-"
        +String(d.getMonth()+1).padStart(2,"0")
        +"-"
        +String(d.getDate()).padStart(2,"0");
}

function todayDay(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {weekday:"long"}
        );
}

function minutes(time){

    if(!time)return 0;

    var p=time.split(":");

    return Number(p[0])*60
        +Number(p[1]);
}

function durationMinutes(start,end){

    return Math.max(
        0,
        minutes(end)-minutes(start)
    );
}

function duration(start,end){

    return durationMinutes(start,end)/60;
}

/*
   Human readable exact duration.
   Example:
   09:15 -> 13:40
   = 4h 25m
*/

function formatDuration(hours){

    var totalMinutes=Math.round(
        Number(hours||0)*60
    );

    var h=Math.floor(
        totalMinutes/60
    );

    var m=totalMinutes%60;

    if(h && m){
        return h+"h "
            +String(m).padStart(2,"0")
            +"m";
    }

    if(h){
        return h+"h";
    }

    return m+"m";
}

function formatDate(date){

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}

function findClient(id){

    return data.clients.find(
        function(c){
            return Number(c.id)
                ===Number(id);
        }
    );
}

/* --------------------------------------------------
   START TIMER
-------------------------------------------------- */

function startTimer(id){

    id=Number(id);

    if(!id){
        return;
    }

    if(timer.running){

        if(Number(timer.clientId)===id){
            showTimer(id);
        }else{
            alert(
                "A timer is already running for another client."
            );
        }

        return;
    }

    timer={
        running:true,
        clientId:id,
        startedAt:Date.now(),
        accumulated:0
    };

    saveTimer();

    closeModal();

    render();

    showTimer(id);
}

/* --------------------------------------------------
   STOP TIMER
-------------------------------------------------- */

function stopTimer(){

    if(!timer.running){
        return;
    }

    var client=findClient(
        timer.clientId
    );

    if(!client){

        resetTimer();

        render();

        return;
    }

    var seconds=timerSeconds();

    /*
       Keep exact seconds.
       This means 6h 26m is not rounded to 6.25h.
    */

    var hours=seconds/3600;

    var now=new Date();

    var started=new Date(
        Number(timer.startedAt)
    );

    var start=started.toLocaleTimeString(
        "en-GB",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    var end=now.toLocaleTimeString(
        "en-GB",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

    var existing=data.jobs.find(
        function(j){

            return j.date===today()
                &&
                Number(j.clientId)
                ===Number(client.id)
                &&
                j.timerSeconds>0;
        }
    );

    if(existing){

        existing.start=start;
        existing.end=end;
        existing.hours=hours;
        existing.price=
            hours*Number(client.rate);
        existing.timerSeconds=seconds;

function setQuickHours(clientId,value){

    var client=findClient(clientId);

    if(!client){
        return;
    }

    var hours=Number(value);

    if(!Number.isFinite(hours)||hours<0){
        return;
    }

    var job=data.jobs.find(
        function(j){
            return j.date===today()
                &&
                Number(j.clientId)
                ===Number(clientId);
        }
    );

    if(!job){

        data.jobs.push({

            id:Date.now(),

            clientId:client.id,

            clientName:client.name,

            rate:Number(client.rate),

            date:today(),

            start:client.start,

            end:client.end,

            hours:hours,

            price:
                hours*Number(client.rate),

            status:"Paid",

            timerSeconds:0
        });

    }else{

        job.hours=hours;

        job.price=
            hours*Number(client.rate);
    }

    saveData();

    render();
}

function saveClient(id){

    var name=
        document.getElementById(
            "clientName"
        ).value.trim();

    var type=
        document.getElementById(
            "clientType"
        ).value;

    var rate=
        Number(
            document.getElementById(
                "clientRate"
            ).value
        );

    var day=
        document.getElementById(
            "clientDay"
        ).value;

    var freq=
        document.getElementById(
            "clientFreq"
        ).value;

    var start=
        document.getElementById(
            "clientStart"
        ).value;

    var end=
        document.getElementById(
            "clientEnd"
        ).value;

    var variable=
        document.getElementById(
            "clientVariable"
        ).value==="yes";

    if(!name){
        alert("Please enter the client name.");
        return;
    }

    if(!start||!end||minutes(end)<=minutes(start)){
        alert("Please enter a valid Start and End time.");
        return;
    }

    if(!Number.isFinite(rate)||rate<0){
        alert("Please enter a valid hourly rate.");
        return;
    }

    if(id){

        var existing=findClient(id);

        if(existing){

            existing.name=name;
            existing.type=type;
            existing.rate=rate;
            existing.day=day;
            existing.freq=freq;
            existing.start=start;
            existing.end=end;
            existing.variable=variable;
        }

    }else{

        data.clients.push({

            id:Date.now(),

            name:name,

            type:type,

            rate:rate,

            day:day,

            start:start,

            end:end,

            freq:freq,

            week:"A",

            variable:variable
        });
    }

    saveData();

    closeModal();

    render();
}

function deleteClient(id){

    var client=findClient(id);

    if(!client){
        return;
    }

    if(!confirm(
        "Delete "+client.name+"?"
    )){
        return;
    }

    data.clients=
        data.clients.filter(
            function(c){
                return Number(c.id)
                    !==Number(id);
            }
        );

    data.jobs=
        data.jobs.filter(
            function(j){
                return Number(j.clientId)
                    !==Number(id);
            }
        );

    if(timer.running &&
       Number(timer.clientId)===Number(id)){
        resetTimer();
    }

    saveData();

    render();
}

    html+='<input id="jobRate" class="control" type="number" step="0.01" value="">';
    html+='</div>';

    html+='</div>';

    html+='<div class="form-group">';
    html+='<label class="label">Payment</label>';
    html+='<select id="jobStatus" class="control">';

    html+='<option value="Paid" '
        +(!editing||job.status==="Paid"
            ?"selected"
            :"")
        +'>Paid</option>';

    html+='<option value="Owed" '
        +(editing&&job.status==="Owed"
            ?"selected"
            :"")
        +'>Owed</option>';

    html+='</select>';
    html+='</div>';

    html+='<button class="primary" style="width:100%" onclick="saveJob('
        +(editing?job.id:0)
        +')">'
        +(editing
            ?"Save Changes"
            :"Save Job")
        +" ✨</button>";

    if(editing){

        html+='<button class="danger" style="width:100%;margin-top:10px" onclick="deleteJob('+job.id+',true)">🗑️ Delete Job</button>';
    }

    openModal(html);

    var clientSelect=
        document.getElementById(
            "jobClient"
        );

    var startInput=
        document.getElementById(
            "jobStart"
        );

    var endInput=
        document.getElementById(
            "jobEnd"
        );

    var hoursInput=
        document.getElementById(
            "jobHours"
        );

    var rateInput=
        document.getElementById(
            "jobRate"
        );

    var exactLabel=
        document.getElementById(
            "jobHoursExact"
        );

    function updateJobFromClient(){

        var client=findClient(
            Number(clientSelect.value)
        );

        if(!client){
            return;
        }

        rateInput.value=
            Number(client.rate);

        updateJobDuration();
    }

    function updateJobDuration(){

        var start=startInput.value;

        var end=endInput.value;

        if(
            !start ||
            !end ||
            minutes(end)<=minutes(start)
        ){

            hoursInput.value="";

            exactLabel.textContent=
                "Enter a valid Start and End time.";

            return;
        }

        var exact=duration(
            start,
            end
        );

        /*
           Exact decimal value is stored internally.

           Example:
           09:15 -> 13:40
           265 minutes / 60
           = 4.416666...
        */

        hoursInput.value=
            exact.toFixed(4);

        exactLabel.textContent=
            formatDuration(exact)
            +" · calculated exactly from Start and End";
    }

    clientSelect.addEventListener(
        "change",
        updateJobFromClient
    );

    startInput.addEventListener(
        "input",
        updateJobDuration
    );

    endInput.addEventListener(
        "input",
        updateJobDuration
    );

    /*
       Date changes automatically update Day.
    */

    document.getElementById(
        "jobDate"
    ).addEventListener(
        "change",
        function(){

            var d=new Date(
                this.value+"T12:00:00"
            );

            document.getElementById(
                "jobDay"
            ).value=
                d.toLocaleDateString(
                    "en-GB",
                    {weekday:"long"}
                );
        }
    );

    updateJobFromClient();
}

/* --------------------------------------------------
   SAVE JOB
-------------------------------------------------- */

function saveJob(id){

    var clientId=
        Number(
            document.getElementById(
                "jobClient"
            ).value
        );

    var client=findClient(
        clientId
    );

    if(!client){
        return;
    }

    var date=
        document.getElementById(
            "jobDate"
        ).value;

    var start=
        document.getElementById(
            "jobStart"
        ).value;

    var end=
        document.getElementById(
            "jobEnd"
        ).value;

    var hours=
        duration(
            start,
            end
        );

    var status=
        document.getElementById(
            "jobStatus"
        ).value;

    if(
        !date ||
        !start ||
        !end ||
        minutes(end)<=minutes(start)
    ){

        alert(
            "Please enter a valid Start and End time."
        );

        return;
    }

    /*
       IMPORTANT:
       Never use the manually displayed rounded value
       to calculate the money.

       Always calculate directly from Start and End.
    */

    var exactMinutes=
        durationMinutes(
            start,
            end
        );

    var exactHours=
        exactMinutes/60;

    var price=
        exactHours*
        Number(client.rate);

    if(id){

        var job=data.jobs.find(
            function(j){
                return Number(j.id)
                    ===Number(id);
            }
        );

        if(job){

            job.clientId=
                client.id;

            job.clientName=
                client.name;

            job.rate=
                Number(client.rate);

            job.date=date;

            job.start=start;

            job.end=end;

            job.hours=
                exactHours;

            job.price=
                price;

            job.status=
                status;
        }

    }else{

        data.jobs.push({

            id:Date.now(),

            clientId:
                client.id,

            clientName:
                client.name,

            rate:
                Number(client.rate),

            date:
                date,

            start:
                start,

            end:
                end,

            /*
               EXACT decimal hours
            */

            hours:
                exactHours,

            /*
               EXACT earnings
            */

            price:
                price,

            status:
                status,

            timerSeconds:
                0
        });
    }

    saveData();

    closeModal();

    render();
}

/* --------------------------------------------------
   EDIT / DELETE JOB
-------------------------------------------------- */

function editJob(id){

    var job=data.jobs.find(
        function(j){
            return Number(j.id)
                ===Number(id);
        }
    );

    if(job){
        openJobForm(job);
    }
}

function deleteJob(id,fromModal){

    if(!confirm(
        "Delete this cleaning job?"
    )){
        return;
    }

    data.jobs=
        data.jobs.filter(
            function(j){
                return Number(j.id)
                    !==Number(id);
            }
        );

    saveData();

    if(fromModal){
        closeModal();
    }

    render();
}

/* --------------------------------------------------
   EARNINGS
-------------------------------------------------- */

function earningsPage(){

    var paid=0;
    var owed=0;
    var hours=0;

    data.jobs.forEach(
        function(j){

            total+=Number(
                j.price||0
            );

            hours+=Number(
                j.hours||0
            );

                owed+=Number(
                    j.price||0
                );
            }else{
                paid+=Number(
                    j.price||0
                );
            }
        }
    );

    var html="";

    html+='<div class="section-head">';
    html+='<h2 class="section-title">Earnings</h2>';
    html+='</div>';

    html+='<div class="earnings-grid">';

    html+='<div class="earning green">';
    html+='<div class="earning-label">Total</div>';
    html+='<div class="earning-value">'
        +money(total)
        +"</div>";
    html+='</div>';

    html+='<div class="earning pink">';
    html+='<div class="earning-label">Paid</div>';
    html+='<div class="earning-value">'
        +money(paid)
        +"</div>";
    html+='</div>';

    html+='<div class="earning yellow">';
    html+='<div class="earning-label">Owed</div>';
    html+='<div class="earning-value">'
        +money(owed)
        +"</div>";
    html+='</div>';

    html+='<div class="earning purple">';
    html+='<div class="earning-label">Hours</div>';
    html+='<div class="earning-value">'
        +formatDuration(hours)
        +"</div>";
    html+='</div>';

    html+='</div>';

    html+='<section class="section">';

    html+='<h2 class="section-title" style="margin-bottom:13px">';
    html+='Recent jobs';
    html+='</h2>';

    if(data.jobs.length){

        var jobs=
            data.jobs.slice().sort(
                function(a,b){
                    return b.date.localeCompare(
                        a.date
                    );
                }
            );

        jobs.forEach(
            function(job){

                var client=findClient(
                    job.clientId
                );

                var name=
                    client
                        ?client.name
                        :(job.clientName||"Unknown");

                html+='<div class="card">';

                html+='<div class="card-name">'
                    +esc(name)
                    +"</div>";

                html+='<div class="card-details">';

                html+=formatDate(
                    job.date
                );

                if(job.start&&job.end){

                    html+='<br>'
                        +esc(job.start)
                        +" – "
                        +esc(job.end);
                }

                html+='<br>'
                    +formatDuration(
                        Number(job.hours||0)
                    )
                    +" · "
                    +money(job.price);

                html+='</div>';

                html+='<div class="card-actions">';

                html+='<button class="secondary" onclick="editJob('+job.id+')">✏️ Edit</button>';

                html+='<button class="danger" onclick="deleteJob('+job.id+')">🗑️ Delete</button>';

                html+='</div>';

                html+='</div>';
            }
        );

    }else{

        html+='<div class="empty">';
        html+='<div class="empty-icon">💷</div>';
        html+='No earnings yet.';
        html+='</div>';
    }

    html+='</section>';

    return html;
}

/* --------------------------------------------------
   TIMER SELECTOR
-------------------------------------------------- */

function openTimerSelector(){

    if(timer.running){

        showTimer(
            timer.clientId
        );

        return;
    }

    var html="";

    html+='<div class="modal-head">';
    html+='<h2 class="modal-title">Start Timer ⏱️</h2>';
    html+='<button class="close" onclick="closeModal()">×</button>';
    html+='</div>';

    html+='<div class="form-group">';
    html+='<label class="label">Choose client</label>';
    html+='<select id="timerClient" class="control">';
    html+='<option value="">Select client</option>';

    data.clients.forEach(
        function(c){

            html+='<option value="'+c.id+'">'
                +esc(c.name)
                +"</option>";
        }
    );

    html+='</select>';
    html+='</div>';

    html+='<button class="primary" style="width:100%" onclick="startSelectedTimer()">▶ Start Timer</button>';

    openModal(html);
}

function startSelectedTimer(){

    var id=
        Number(
            document.getElementById(
                "timerClient"
            ).value
        );

    if(!id){

        alert(
            "Please choose a client."
        );

        return;
    }

    startTimer(id);
}

/* --------------------------------------------------
   TIMER DISPLAY
-------------------------------------------------- */

function showTimer(id){

    var client=findClient(id);

    if(!client){
        return;
    }

    var html="";

    html+='<div class="modal-head">';

    html+='<h2 class="modal-title">'
        +esc(client.name)
        +" ⏱️</h2>";

    html+='<button class="close" onclick="closeModal()">×</button>';

    html+='</div>';

    html+='<div class="timer-box">';

    html+='<div id="timerDisplay" class="timer-display">'
        +timerText(timerSeconds())
        +"</div>";

    html+='<button class="primary" style="width:100%;background:#766c82" onclick="stopTimer()">⏹ Stop & Save</button>';

    html+='<div class="timer-info">';

    html+='Current hours';

    html+='<strong id="timerHours" class="timer-big">'
        +formatDuration(timerHours())
        +"</strong>";

    html+='Current earnings';

    html+='<strong id="timerMoney" class="timer-big">'
        +money(
            timerHours()*
            Number(client.rate)
        )
        +"</strong>";

    html+='</div>';

    html+='</div>';

    openModal(html);
}

/* --------------------------------------------------
   MODAL
-------------------------------------------------- */

function openModal(content){

    closeModal();

    var bg=document.createElement(
        "div"
    );

    bg.id="modal";

    bg.className="modal-bg";

    var box=document.createElement(
        "div"
    );

    box.className="modal";

    box.innerHTML=content;

    box.onclick=function(e){
        e.stopPropagation();
    };

    bg.appendChild(box);

    bg.onclick=function(){
        closeModal();
    };

    document.body.appendChild(bg);
}

function closeModal(){

    var old=
        document.getElementById(
            "modal"
        );

    if(old){
        old.remove();
    }
}

/* --------------------------------------------------
   NAVIGATION
-------------------------------------------------- */

var currentPage="home";

function go(page){

    currentPage=page;

    closeModal();

    render();
}

function navigation(){

    var html=
        '<nav class="bottom-nav">';

    html+=navButton(
        "home",
        "🏠",
        "Home"
    );

    html+=navButton(
        "schedule",
        "📅",
        "Schedule"
    );

    html+=navButton(
        "clients",
        "👥",
        "Clients"
    );

    html+=navButton(
        "jobs",
        "📋",
        "Jobs"
    );

    html+=navButton(
        "earnings",
        "💷",
        "Earnings"
    );

    html+="</nav>";

}

function navButton(
    page,
    icon,
    label
){

    return '<button class="nav '
        +(currentPage===page
            ?"active"
            :"")
        +'" onclick="go(\''
        +page
        +'\')"><span class="nav-icon">'
        +icon
        +"</span>"
        +label
        +"</button>";
}

/* --------------------------------------------------
   RENDER
-------------------------------------------------- */

function render(){

    var content="";

    if(currentPage==="home"){
        content=homePage();
    }

    if(currentPage==="schedule"){
        content=schedulePage();
    }

    if(currentPage==="clients"){
        content=clientsPage();
    }

    if(currentPage==="jobs"){
        content=jobsPage();
    }

    if(currentPage==="earnings"){
        content=earningsPage();
    }

    var runningClient=
        timer.running
            ?findClient(timer.clientId)
            :null;

    var timerBanner=
        runningClient
            ?'<div class="timer-banner" onclick="showTimer('
                +runningClient.id
                +')">'
                +'<span>⏱️ '
                +esc(runningClient.name)
                +'</span>'
                +'<strong id="bannerTimer">'
                +timerText(timerSeconds())
                +'</strong>'
                +'<span>Tap to open</span>'
                +'</div>'
            :"";

    document.getElementById(
        "app"
    ).innerHTML=

        '<div class="app">'

        +timerBanner

        +'<header class="header">'

        +'<div class="brand">'

        +'<img id="mainLogo" class="logo" src="icon.png" alt="Pure Shine">'

        +'<div id="logoFallback" class="logo-fallback">✨</div>'

        +'<div>'
        +'<div class="brand-title">Pure Shine</div>'
        +'<div class="brand-subtitle">Cleaning Manager ✨</div>'
        +'</div>'

        +'</div>'

        +'<div class="header-actions">'

        +'<button class="header-btn timer" onclick="openTimerSelector()">⏱️</button>'

        +'<button class="header-btn" onclick="openJobForm()">+</button>'

        +'</div>'

        +'</header>'

        +'<main class="content">'
        +content
        +'</main>'

        +'</div>'

        +navigation();

    var logo=
        document.getElementById(
            "mainLogo"
        );

    var fallback=
        document.getElementById(
            "logoFallback"
        );

    if(logo){

        logo.onerror=function(){

            logo.style.display="none";

            if(fallback){
                fallback.style.display="flex";
            }
        };
    }
}

/* --------------------------------------------------
   TIMER UI UPDATE
-------------------------------------------------- */

setInterval(
    function(){

        if(!timer.running){
            return;
        }

        /*
           Date.now() recalculates the true elapsed time
           every second. If Safari pauses JavaScript,
           it catches up when JavaScript runs again.
        */

        var seconds=
            timerSeconds();

        var display=
            document.getElementById(
                "timerDisplay"
            );

        var hours=
            document.getElementById(
                "timerHours"
            );

        var moneyBox=
            document.getElementById(
                "timerMoney"
            );

        var banner=
            document.getElementById(
                "bannerTimer"
            );

        if(display){

            display.textContent=
                timerText(seconds);
        }

        if(banner){

            banner.textContent=
                timerText(seconds);
        }

        if(hours){

            hours.textContent=
                formatDuration(
                    seconds/3600
                );
        }

        var client=
            findClient(
                timer.clientId
            );

        if(moneyBox&&client){

            moneyBox.textContent=
                money(
                    (seconds/3600)*
                    Number(client.rate)
                );
        }

    },
    1000
);

/*
   Save the timer before the page becomes hidden.
   The actual elapsed time remains based on Date.now().
*/

window.addEventListener(
    "pagehide",
    function(){

        if(timer.running){
            saveTimer();
        }
    }
);

window.addEventListener(
    "beforeunload",
    function(){

        if(timer.running){
            saveTimer();
        }
    }
);

/*
   When the app becomes visible again,
   immediately calculate the true elapsed time.
*/

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden &&
            timer.running
        ){

            var seconds=
                timerSeconds();

            var display=
                document.getElementById(
                    "timerDisplay"
                );

            var banner=
                document.getElementById(
                    "bannerTimer"
                );

            var hours=
                document.getElementById(
                    "timerHours"
                );

            var moneyBox=
                document.getElementById(
                    "timerMoney"
                );

            if(display){
                display.textContent=
                    timerText(seconds);
            }

            if(banner){
                banner.textContent=
                    timerText(seconds);
            }

            if(hours){
                hours.textContent=
                    formatDuration(
                        seconds/3600
                    );
            }

            var client=
                findClient(
                    timer.clientId
                );

            if(moneyBox&&client){

                moneyBox.textContent=
                    money(
                        (seconds/3600)*
                        Number(client.rate)
                    );
            }
        }
    }
);

/*
   If iOS wakes the page after a longer
   period in the background, render again.
*/

document.addEventListener(
    "resume",
    function(){

        if(timer.running){
            render();
        }
    }
);

render();

</script>
