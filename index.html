<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f7dbe7">

<title>Pure Shine Cleaning Manager</title>

<style>

/* =========================================================
   PURE SHINE CLEANING MANAGER
   REFERECE-BASED MOBILE DESIGN
========================================================= */

:root{
    --pink:#f7d4e2;
    --pinkStrong:#df5b91;
    --pinkText:#c9467b;

    --blue:#dceafa;
    --blueText:#173b78;

    --green:#dcefe5;
    --greenText:#287b55;

    --yellow:#fff0c7;
    --yellowText:#171717;

    --purple:#e5dcfa;
    --purpleText:#633ca3;

    --peach:#f8ddd5;
    --peachText:#a84e40;

    --dark:#202026;
    --grey:#817a84;

    --white:#ffffff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    margin:0;
    padding:0;
    min-height:100%;
    background:#f7dbe7;
}

body{
    margin:0;
    padding:0;
    min-height:100vh;

    background:#f7dbe7;

    color:var(--dark);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

    -webkit-font-smoothing:antialiased;
}

button{
    font:inherit;
    border:0;
    outline:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

button:active{
    transform:scale(.98);
}


/* =========================================================
   MAIN PHONE AREA
========================================================= */

#app{
    width:100%;
    max-width:690px;
    min-height:100vh;

    margin:0 auto;

    background:
        linear-gradient(
            180deg,
            #fffafd 0%,
            #fffafd 55%,
            #fff 100%
        );

    padding:
        env(safe-area-inset-top)
        26px
        calc(115px + env(safe-area-inset-bottom))
        26px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    height:125px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 4px 13px;
}

.brand{
    display:flex;
    align-items:center;
    gap:17px;
}

.logo{
    width:76px;
    height:76px;

    border-radius:22px;

    object-fit:cover;

    background:white;

    box-shadow:
        0 5px 15px rgba(150,80,110,.14);
}

.brandText h1{
    margin:0;

    font-size:28px;
    line-height:1;

    font-weight:900;

    letter-spacing:-1px;
}

.brandText p{
    margin:9px 0 0;

    color:#837b85;

    font-size:17px;
}

.settingsButton{
    width:62px;
    height:62px;

    border-radius:50%;

    background:white;

    display:grid;
    place-items:center;

    font-size:29px;

    box-shadow:
        0 6px 20px rgba(60,40,60,.08);
}


/* =========================================================
   DATE CARD
========================================================= */

.dateCard{
    height:127px;

    border-radius:31px;

    background:#f5d0df;

    padding:22px 26px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.dateLeft{
    display:flex;
    align-items:center;
    gap:17px;
}

.dateIcon{
    color:#b51e5c;
    font-size:36px;
    line-height:1;
}

.dateTitle{
    font-size:24px;
    font-weight:900;
    line-height:1.1;

    letter-spacing:-.5px;
}

.dateSubtitle{
    margin-top:8px;

    font-size:16px;
    color:#7d747e;
}

.dateHeart{
    color:#d25a90;
    font-size:59px;
    line-height:1;
}


/* =========================================================
   STATISTICS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:12px;

    margin:
        27px
        0
        34px;
}

.stat{
    height:157px;

    border-radius:27px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.stat:nth-child(1){
    background:#f7d4e2;
}

.stat:nth-child(2){
    background:#dceafa;
}

.stat:nth-child(3){
    background:#dcefe5;
}

.stat:nth-child(4){
    background:#fff0c7;
}

.statIcon{
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:6px;

    font-size:31px;
}

.stat:nth-child(1) .statIcon{
    color:#a91d55;
}

.stat:nth-child(2) .statIcon{
    color:#173c78;
}

.stat:nth-child(3) .statIcon{
    color:#19734a;
}

.stat:nth-child(4) .statIcon{
    color:#ec9214;
}

.statValue{
    font-size:26px;
    line-height:1;

    font-weight:900;

    letter-spacing:-.5px;
}

.statLabel{
    margin-top:10px;

    font-size:16px;
}


/* =========================================================
   SECTION HEADER
========================================================= */

.sectionHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.sectionHeader h2{
    margin:0;

    font-size:26px;
    font-weight:900;

    letter-spacing:-.8px;
}

.seeAll{
    background:none;

    color:#d14c82;

    font-size:17px;
    font-weight:850;
}


/* =========================================================
   TODAY'S SCHEDULE
========================================================= */

.scheduleCard{
    min-height:340px;

    border-radius:31px;

    background:#fff;

    box-shadow:
        0 7px 27px rgba(70,50,70,.055);

    padding:
        25px
        27px
        22px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.scheduleIcon{
    color:#e45c95;

    font-size:69px;

    line-height:1;

    margin-bottom:16px;
}

.scheduleTitle{
    font-size:20px;
    font-weight:800;

    letter-spacing:-.2px;
}

.scheduleSub{
    margin-top:8px;

    font-size:16px;

    color:#817a83;
}

.addJobButton{
    width:100%;
    height:62px;

    margin-top:27px;

    border-radius:33px;

    background:
        linear-gradient(
            90deg,
            #ed76a6,
            #db4e89
        );

    color:#fff;

    font-size:18px;
    font-weight:850;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quickTitle{
    margin:
        31px
        0
        16px;

    font-size:26px;
    font-weight:900;

    letter-spacing:-.8px;
}

.quickGrid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:11px;
}

.quick{
    height:91px;

    border-radius:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;

    font-size:17px;
    font-weight:750;

    box-shadow:none;
}

.quickIcon{
    width:36px;
    height:36px;

    display:grid;
    place-items:center;

    font-size:31px;
    line-height:1;
}

.quick.start{
    background:var(--blue);
    color:var(--blueText);
}

.quick.clients{
    background:var(--green);
    color:var(--greenText);
}

.quick.schedule{
    background:var(--pink);
    color:#b71f59;
}

.quick.free{
    background:var(--yellow);
    color:#171717;
}

.quick.earnings{
    background:var(--purple);
    color:var(--purpleText);
}

.quick.holidays{
    background:var(--peach);
    color:var(--peachText);
}


/* =========================================================
   FLOWER QUOTE BANNER
========================================================= */

.quoteBanner{
    position:relative;

    width:100%;
    height:166px;

    margin-top:19px;

    border-radius:27px;

    overflow:hidden;

    background:#f5cedd;
}

.quotePhoto{
    position:absolute;

    inset:0;

    background-image:
        linear-gradient(
            90deg,
            rgba(244,204,219,.97) 0%,
            rgba(244,204,219,.88) 33%,
            rgba(244,204,219,.55) 57%,
            rgba(244,204,219,.12) 100%
        ),
        url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1200&q=90");

    background-size:cover;

    background-position:
        center right;
}

.quoteText{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding-right:120px;

    text-align:center;

    color:#9e4e70;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:32px;

    line-height:1.08;
}

.quoteHeart{
    font-family:Arial,sans-serif;

    font-size:44px;

    color:#ad5277;

    margin:0 13px;
}


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottomNav{
    position:fixed;

    z-index:100;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:100%;
    max-width:690px;

    height:
        calc(
            106px +
            env(safe-area-inset-bottom)
        );

    background:
        rgba(255,255,255,.98);

    border-top:
        1px solid #eee8ec;

    box-shadow:
        0 -5px 24px rgba(70,50,70,.06);

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    padding:
        8px
        8px
        calc(
            8px +
            env(safe-area-inset-bottom)
        );
}

.navButton{
    background:none;

    color:#817d86;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:4px;

    font-size:14px;
    font-weight:650;
}

.navIcon{
    width:61px;
    height:48px;

    border-radius:25px;

    display:grid;
    place-items:center;

    font-size:30px;
}

.navButton.active{
    color:#df4f8b;
    font-weight:850;
}

.navButton.active .navIcon{
    background:#f9dce8;
}


/* =========================================================
   MODAL
========================================================= */

.overlay{
    position:fixed;
    inset:0;

    z-index:500;

    background:
        rgba(35,25,35,.42);

    backdrop-filter:blur(5px);

    display:none;

    align-items:flex-end;
}

.overlay.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:690px;

    max-height:92vh;

    overflow:auto;

    background:#fffafd;

    border-radius:
        30px
        30px
        0
        0;

    padding:
        23px
        22px
        calc(
            30px +
            env(safe-area-inset-bottom)
        );
}

.sheetHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:18px;
}

.sheetHeader h2{
    margin:0;

    font-size:25px;
}

.closeButton{
    width:44px;
    height:44px;

    border-radius:50%;

    background:#f5e4eb;

    color:#ad5278;

    font-size:25px;
}

.input,
.select{
    width:100%;

    height:52px;

    border:
        2px solid #eee2e8;

    border-radius:16px;

    padding:0 14px;

    background:#fff;

    font-size:16px;
}

label{
    display:block;

    margin:
        13px
        0
        6px;

    font-weight:800;
}

.saveButton{
    width:100%;

    height:55px;

    margin-top:17px;

    border-radius:18px;

    background:#df6597;

    color:white;

    font-size:17px;
    font-weight:850;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    #app{
        padding-left:24px;
        padding-right:24px;
    }

    .header{
        height:120px;
    }

    .logo{
        width:72px;
        height:72px;
    }

    .brandText h1{
        font-size:25px;
    }

    .brandText p{
        font-size:15px;
    }

    .settingsButton{
        width:58px;
        height:58px;
    }

    .dateCard{
        height:121px;
    }

    .dateTitle{
        font-size:21px;
    }

    .dateSubtitle{
        font-size:15px;
    }

    .stats{
        gap:9px;
    }

    .stat{
        height:143px;
        border-radius:24px;
    }

    .statValue{
        font-size:23px;
    }

    .statLabel{
        font-size:14px;
    }

    .sectionHeader h2,
    .quickTitle{
        font-size:24px;
    }

    .scheduleCard{
        min-height:320px;
    }

    .quick{
        height:82px;
        font-size:15px;
    }

    .quickIcon{
        font-size:28px;
    }

    .quoteBanner{
        height:155px;
    }

    .quoteText{
        font-size:28px;
        padding-right:95px;
    }

    .quoteHeart{
        font-size:37px;
        margin:0 7px;
    }

    .bottomNav{
        height:
            calc(
                100px +
                env(safe-area-inset-bottom)
            );
    }

    .navButton{
        font-size:12px;
    }

    .navIcon{
        width:51px;
        height:42px;
        font-size:27px;
    }
}


@media(max-width:390px){

    #app{
        padding-left:18px;
        padding-right:18px;
    }

    .brand{
        gap:11px;
    }

    .logo{
        width:63px;
        height:63px;
        border-radius:19px;
    }

    .brandText h1{
        font-size:22px;
    }

    .brandText p{
        font-size:13px;
    }

    .settingsButton{
        width:51px;
        height:51px;
        font-size:24px;
    }

    .dateCard{
        padding:18px;
    }

    .dateTitle{
        font-size:18px;
    }

    .dateSubtitle{
        font-size:13px;
    }

    .dateHeart{
        font-size:49px;
    }

    .stat{
        height:132px;
    }

    .statIcon{
        font-size:27px;
    }

    .statValue{
        font-size:20px;
    }

    .statLabel{
        font-size:12px;
    }

    .quick{
        height:76px;
        font-size:13px;
        gap:7px;
    }

    .quickIcon{
        font-size:25px;
    }

    .quoteText{
        font-size:25px;
    }
}

</style>
</head>

    </section>



    <!-- QUICK ACTIONS -->

    <h2 class="quickTitle">
        Quick actions

            <span class="quickIcon">

            </span>

            Start cleaning

        </button>


        <button
            class="quick clients"
            onclick="openClients()"
        >

            <span class="quickIcon">
                ♧
            </span>

            Clients

        </button>


        <button
            class="quick schedule"
            onclick="openSchedule()"
        >

            <span class="quickIcon">
                ▣
            </span>

            Schedule

        </button>


        <button
            class="quick free"
            onclick="openFreeTime()"
        >

            <span class="quickIcon">
                ⌕
            </span>

            Find free time

        </button>


        <button
            class="quick earnings"
            onclick="openEarnings()"
        >

            <span class="quickIcon">
                ▥
            </span>

            Earnings

        </button>


        <button
            class="quick holidays"
            onclick="openHolidays()"
        >

            <span class="quickIcon">
                🏖️
            </span>

            Holidays

        </button>


    </section>



    <!-- FLOWERS -->

    <section class="quoteBanner">

        <div class="quotePhoto"></div>

        <div class="quoteText">

            <span class="quoteHeart">
                ♡
            </span>

            <span>
                A clean space<br>
                is a happy place
            </span>

            <span class="quoteHeart">
                ♡
            </span>

        </div>

    </section>


</div>



<!-- =========================================================
     BOTTOM NAV
========================================================= -->

<nav class="bottomNav">


    <button
        class="navButton active"
        onclick="goHome(this)"
    >

        <span class="navIcon">
            🏠
        </span>

        Home

    </button>


    <button

    <button

    >

        <span class="navIcon">

        Clients

    </button>


    <button
        class="navButton"

        <span class="navIcon">
            ◷
        </span>

        Free time

    </button>


    <button
        class="navButton"
        onclick="openEarnings()"
    >

        <span class="navIcon">
            ▥
        </span>

        Earnings

    </button>


</nav>



<!-- =========================================================
     MODAL
========================================================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeOutside(event)"
>

    <div
        class="sheet"
        id="sheet"
    ></div>

</div>

function todayISO(){

    return new Date()
        .toISOString()
        .slice(0,10);
}


/* =========================================================
   RENDER TODAY
========================================================= */

function renderToday(){

    const today=
        todayName();

    const todayClients=
        clients.filter(
            c=>c.day===today
        );

    const card=
        document.getElementById(
            "scheduleCard"
        );


    if(!todayClients.length){

        card.innerHTML=`

            <div class="scheduleIcon">
                ♡
            </div>

            <div class="scheduleTitle">
                No cleaning jobs today 🌸
            </div>

            <div class="scheduleSub">
                Add one with the + button.
            </div>

            <button
                class="addJobButton"
                onclick="openJob()"
            >
                ＋ &nbsp;Add cleaning job
            </button>

        `;

        return;
    }


    card.style.justifyContent="flex-start";
    card.style.alignItems="stretch";
    card.style.textAlign="left";

    card.innerHTML=
        todayClients
        .map(
            c=>`

                <div
                    style="
                    background:#f9e3ec;
                    border-radius:18px;
                    padding:14px;
                    margin-bottom:9px;
                    "
                >

                    <strong
                        style="
                        font-size:17px;
                        "
                    >
                        ${c.name}
                    </strong>

                    <div
                        style="
                        margin-top:5px;
                        color:#756e76;
                        font-size:13px;
                        "
                    >
                        ${c.start}
                        –
                        ${c.end}
                        ·
                        £${c.rate}/h
                    </div>

                </div>

            `
        ).join("")+

        `

            <button
                class="addJobButton"
                onclick="openJob()"
            >
                ＋ &nbsp;Add cleaning job
            </button>

        `;
}


/* =========================================================
   MODAL
========================================================= */

function show(html){

    document.getElementById(
        "sheet"
    ).innerHTML=html;

    document.getElementById(
        "overlay"
    ).classList.add("show");
}


function closeModal(){

    document.getElementById(
        "overlay"
    ).classList.remove("show");
}


function closeOutside(e){

    if(
        e.target===
        document.getElementById("overlay")
    ){

        closeModal();

    }

}


/* =========================================================
   ADD JOB
========================================================= */

function openJob(){

    show(`

        <div class="sheetHeader">

            <h2>
                Add cleaning job
            </h2>

            <button
                class="closeButton"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <label>
            Client
        </label>

        <select
            class="select"
            id="jobClient"
        >

            ${
                clients
                .map(
                    c=>
                    `
                    <option>
                        ${c.name}
                    </option>
                    `
                )
                .join("")
            }

        </select>


        <label>
            Date
        </label>

        <input
            class="input"
            id="jobDate"
            type="date"
            value="${todayISO()}"
        >


        <label>
            Start
        </label>

        <input
            class="input"
            id="jobStart"
            type="time"
            value="09:00"
        >


        <label>
            End
        </label>

        <input
            class="input"
            id="jobEnd"
            type="time"
            value="12:00"
        >


        <label>
            Hours
        </label>

        <input
            class="input"
            id="jobHours"
            type="number"
            step=".01"
            value="3"
        >


        <label>
            Rate £/hour
        </label>

        <input
            class="input"
            id="jobRate"
            type="number"
            step=".5"
            value="16"
        >


        <button
            class="saveButton"
            onclick="saveJob()"
        >
            Save cleaning job
        </button>

    `);
}


function saveJob(){

    const name=
        document.getElementById(
            "jobClient"
        ).value;

    const job={

        id:Date.now(),

        client:name,

        date:
            document.getElementById(
                "jobDate"
            ).value,

        start:
            document.getElementById(
                "jobStart"
            ).value,

        end:
            document.getElementById(
                "jobEnd"
            ).value,

        hours:
            Number(
                document.getElementById(
                    "jobHours"
                ).value
            ),

        rate:
            Number(
                document.getElementById(
                    "jobRate"
                ).value
            )

    };

    jobs.push(job);

    localStorage.setItem(
        "pure_shine_jobs",
        JSON.stringify(jobs)
    );

    closeModal();

    updateStats();

    renderToday();
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const today=
        todayISO();

    const todayJobs=
        jobs.filter(
            j=>j.date===today
        );

    let hours=0;
    let earned=0;

    todayJobs.forEach(
        j=>{

            hours+=
                Number(j.hours||0);

            earned+=
                Number(j.hours||0)*
                Number(j.rate||0);

        }
    );


    document.getElementById(
        "jobsValue"
    ).textContent=
        todayJobs.length;


    const h=
        Math.floor(hours);

    const m=
        Math.round(
            (hours-h)*60
        );

    document.getElementById(
        "hoursValue"
    ).textContent=
        h+"h "+m+"m";


    document.getElementById(
        "earnedValue"
    ).textContent=
        "£"+
        earned.toFixed(0);
}
