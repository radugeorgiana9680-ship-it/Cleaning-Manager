<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover">

<meta name="theme-color"
      content="#f3a9c5">

<link rel="manifest"
      href="manifest.json">

<link rel="apple-touch-icon"
      href="icon.png">

<title>Pure Shine Cleaning Manager</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#fff8fb;
    color:#533d47;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}


/* =====================================================
   WELCOME SCREEN
===================================================== */

.start-screen{

    min-height:100vh;
    min-height:100svh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        calc(25px + env(safe-area-inset-top))
        22px
        calc(25px + env(safe-area-inset-bottom));

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 15%,
            #ffffff 0%,
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 25%,
            #f8d3e2 0%,
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #fffafc,
            #fce8f1 55%,
            #f5d4e1
        );
}


/* decorative bubbles */

.start-screen:before{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.8),
            rgba(255,255,255,0)
        );

    top:-90px;
    right:-70px;
}

.start-screen:after{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(201,164,92,.15),
            transparent 70%
        );

    bottom:-80px;
    left:-70px;
}


.start-content{

    width:100%;
    max-width:430px;

    text-align:center;

    position:relative;
    z-index:2;
}


/* logo */

.welcome-logo{

    width:145px;
    height:145px;

    margin:0 auto 18px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #fff,
            #f8c9dc
        );

    border:3px solid #c9a45c;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 18px 45px
        rgba(160,75,110,.18);

    position:relative;
}

.welcome-logo:after{

    content:"✦";

    position:absolute;

    top:8px;
    right:18px;

    color:#c9a45c;

    font-size:22px;
}

.logo-inner{

    font-family:
        Georgia,
        serif;

    color:#ad537d;

    font-size:24px;

    line-height:1.05;
}

.logo-inner span{

    display:block;

    font-family:
        "Brush Script MT",
        cursive;

    font-size:28px;

    color:#d67da4;

    margin-top:5px;
}


/* title */

.welcome-title{

    margin:0;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:43px;

    line-height:1;

    color:#a84f79;

    letter-spacing:-1px;
}

.welcome-subtitle{

    margin-top:8px;

    font-family:
        Georgia,
        serif;

    font-size:12px;

    letter-spacing:4px;

    color:#92707e;
}


/* slogan */

.welcome-slogan{

    margin:22px auto 20px;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:29px;

    line-height:1.05;

    color:#bd638d;
}

.welcome-slogan b{

    color:#9e4d75;
}


/* feature buttons */

.features{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin:18px 0 22px;
}

.feature{

    min-height:94px;

    padding:9px 3px;

    border-radius:19px;

    background:
        rgba(255,255,255,.82);

    border:
        1px solid
        rgba(210,157,179,.35);

    box-shadow:
        0 9px 25px
        rgba(130,65,90,.08);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.feature-icon{

    font-size:27px;

    margin-bottom:6px;
}

.feature-text{

    font-size:10px;

    line-height:1.2;

    font-weight:700;

    color:#765361;
}


/* start button */

.start-button{

    width:100%;

    padding:17px 20px;

    border-radius:19px;

    background:
        linear-gradient(
            90deg,
            #d979a4,
            #c65c89
        );

    color:white;

    font-size:17px;

    font-weight:700;

    box-shadow:
        0 12px 28px
        rgba(190,85,130,.28);
}

.start-button:active{

    transform:scale(.98);
}

.start-login{

    margin-top:13px;

    font-size:12px;

    color:#91717e;
}

.start-login span{

    color:#b45b84;

    font-weight:700;
}

.start-tagline{

    margin-top:16px;

    font-family:
        Georgia,
        serif;

    font-size:11px;

    letter-spacing:1px;

    color:#a1808c;
}


/* =====================================================
   APP
===================================================== */

.app{

    display:none;

    min-height:100vh;

    padding-bottom:
        env(safe-area-inset-bottom);
}

.app.visible{
    display:block;
}


.app-header{

    position:sticky;

    top:0;

    z-index:20;

    padding:
        15px
        15px
        11px;

    text-align:center;

    background:
        rgba(255,249,251,.96);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid #efdce4;
}

.app-logo{

    font-family:
        Georgia,
        serif;

    font-size:25px;

    color:#a84f79;
}

.app-label{

    margin-top:4px;

    font-size:9px;

    letter-spacing:3px;

    color:#9d818c;
}


/* navigation */

.navigation{

    position:sticky;

    top:66px;

    z-index:19;

    display:flex;

    gap:7px;

    overflow-x:auto;

    padding:10px;

    background:#fff;

    border-bottom:
        1px solid #efdce4;

    scrollbar-width:none;
}

.navigation::-webkit-scrollbar{
    display:none;
}

.navigation button{

    flex:0 0 auto;

    white-space:nowrap;

    padding:10px 15px;

    border-radius:20px;

    background:#fff0f5;

    color:#995673;

    font-size:14px;
}

.navigation button.active{

    background:#d878a2;

    color:#fff;

    box-shadow:
        0 5px 13px
        rgba(200,95,140,.2);
}
