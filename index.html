<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* SETTINGS + 130% APP ZOOM */
#app.zoom-fit{
    zoom:1.3;
    width:76.9230769%;
    min-height:76.9230769dvh;
}

.settings-page{
    padding-bottom:110px;
}

.settings-card{
    background:linear-gradient(135deg,#fff8fb,#ffe9f1);
    border:1px solid #d8aa55;
    border-radius:22px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
}

.settings-card h3{
    margin:0 0 6px;
    color:#7e304f;
    font-size:20px;
}

.settings-card p{
    margin:0 0 16px;
    color:var(--muted);
    font-size:14px;
    line-height:1.4;
}

.zoom-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:8px 0 14px;
}

.zoom-btn{
    width:48px;
    height:48px;
    border-radius:15px;
    background:#fff;
    border:1px solid #d4a44f;
    color:#8d3156;
    font-size:25px;
    font-weight:800;
}

.zoom-value{
    min-width:82px;
    text-align:center;
    font-size:22px;
    font-weight:900;
    color:#8d3156;
}

.zoom-range{
    width:100%;
    accent-color:#d96d91;
}

.settings-action{
    width:100%;
    min-height:54px;
    border-radius:17px;
    margin-top:10px;
    background:#fff;
    border:1px solid #d9ae5b;
    color:#7e304f;
    font-weight:800;
}

.settings-action.primary-action{
    background:linear-gradient(180deg,#ef9bb8,#db6287);
    color:#fff;
}

.settings-action.danger-action{
    background:#fff0f4;
    color:#a43b61;
}

.bottom .nav.settings-nav{
    color:#8d3156;
}
</style>

<script>
function applyAppZoom(value){
    let z=Math.max(80,Math.min(200,Number(value)||130));

    document.documentElement.style.setProperty(
        '--app-zoom',
        z/100
    );

    document.getElementById('app')?.classList.add('zoom-fit');

    if(document.getElementById('zoomLabel')){
        document.getElementById('zoomLabel').textContent=z+'%';
    }

    if(document.getElementById('zoomRange')){
        document.getElementById('zoomRange').value=z;
    }

    localStorage.setItem(
        'pure_shine_app_zoom',
        String(z)
    );
}

function setAppZoom(value){
    applyAppZoom(value);
}

function changeZoom(delta){
    let current=Number(
        localStorage.getItem(
            'pure_shine_app_zoom'
        )||130
    );

    applyAppZoom(current+delta);
}

function addJobsToCalendar(){
    let ics=[
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Pure Shine Cleaning Manager//EN'
    ];

    jobs.forEach((j)=>{
        let c=clients.find(x=>x.id===j.clientId);
        let date=j.date||'';

        if(!date)return;

        let start=(j.start||'09:00')
            .replace(':','')+'00';

        let end=(j.end||'10:00')
            .replace(':','')+'00';

        let d=date.replaceAll('-','');

        ics.push(
            'BEGIN:VEVENT',
            'UID:'+j.id+'@pureshine',
            'DTSTART:'+d+'T'+start,
            'DTEND:'+d+'T'+end,
            'SUMMARY:'+((c?.name)||'Cleaning Job'),
            'DESCRIPTION:Pure Shine Cleaning Manager',
            'END:VEVENT'
        );
    });

    ics.push('END:VCALENDAR');

    let blob=new Blob(
        [ics.join('\r\n')],
        {type:'text/calendar'}
    );

    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='Pure-Shine-Cleaning-Calendar.ics';
    a.click();

    setTimeout(
        ()=>URL.revokeObjectURL(a.href),
        1000
    );
}

function exportData(){
    let data={
        clients,
        jobs,
        timer,
        exportedAt:new Date().toISOString()
    };

    let blob=new Blob(
        [JSON.stringify(data,null,2)],
        {type:'application/json'}
    );

    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='Pure-Shine-Cleaning-Manager-Data.json';
    a.click();

    setTimeout(
        ()=>URL.revokeObjectURL(a.href),
        1000
    );
}

function resetAppData(){
    if(!confirm('Reset all Pure Shine app data?'))return;

    localStorage.removeItem(KEY+'_clients');
    localStorage.removeItem(KEY+'_jobs');
    localStorage.removeItem(TIMER);

    location.reload();
}

setInterval(updateTimer,1000);

applyAppZoom(
    Number(
        localStorage.getItem(
            'pure_shine_app_zoom'
        )||130
    )
);

render();
</script>
</body>
</html>
