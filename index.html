<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#fffafd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Pure Shine Cleaning Manager</title>

<style>

/* =========================================================
   PURE SHINE CLEANING MANAGER
   HOME SCREEN REDESIGN
   Based on the SECOND reference image:
   - much less pink
   - white/pale background
   - 2-column Quick Actions
   - 5 bottom navigation buttons
   - bell in header
   - pastel blue / green / pink / yellow / purple
   - large clean cards
   - same clients, rates, schedules and settings preserved
========================================================= */

:root{
    --pink:#e879a3;
    --pink-dark:#c94f7f;
    --pink-soft:#f9dce8;

    --blue:#dceafb;
    --blue-dark:#245887;

    --green:#dcefe4;
    --green-dark:#347758;

    --yellow:#fff0c7;
    --yellow-dark:#80621c;

    --purple:#e8defa;
    --purple-dark:#65469c;

    --peach:#f8ddd5;
    --peach-dark:#a65243;

    --ink:#22212a;
    --muted:#817984;
    --white:#ffffff;

    --page:#f8e8ee;

    --zoom:1;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    min-height:100%;
    background:var(--page);
    color:var(--ink);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

    -webkit-text-size-adjust:100%;
}

body{
    overflow-x:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

button:active{
    transform:scale(.98);
}

.hidden{
    display:none!important;
}


/* =========================================================
   MAIN APP
========================================================= */

#app{
    width:min(100%,650px);
    min-height:100vh;
    margin:auto;

    background:#fffafd;

    padding:
        0
        16px
        calc(118px + env(safe-area-inset-bottom));

    zoom:var(--zoom);
}


/* =========================================================
   HEADER
========================================================= */

header{
    padding:20px 0 15px;
}

.headerRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.logo{
    width:62px;
    height:62px;

    border-radius:50%;

    object-fit:cover;

    background:#fff;

    box-shadow:
        0 5px 18px rgba(184,91,130,.12);

    flex-shrink:0;
}

.brandText{
    min-width:0;
}

.brand h1{
    margin:0;

    font-size:23px;
    line-height:1.1;

    font-weight:850;

    letter-spacing:-.5px;
}

.brand p{
    margin:5px 0 0;

    font-size:14px;

    color:#817984;
}

.headerBtn{
    width:50px;
    height:50px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 6px 20px rgba(70,45,65,.10);

    display:grid;
    place-items:center;

    font-size:25px;

    flex-shrink:0;
}


/* =========================================================
   DATE CARD
========================================================= */

.dateCard{
    height:86px;

    border-radius:24px;

    background:#f8d9e6;

    padding:13px 17px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.dateLeft{
    display:flex;
    align-items:center;
    gap:12px;
}

.dateIcon{
    width:35px;
    height:35px;

    display:grid;
    place-items:center;

    font-size:28px;

    color:#a63e68;
}

.dateMain{
    font-size:18px;
    font-weight:850;
    line-height:1.15;
}

.dateSub{
    font-size:13px;
    color:#817984;
    margin-top:5px;
}

.dateHeart{
    font-size:44px;
    color:#d66796;
    line-height:1;
}


/* =========================================================
   STAT CARDS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin:
        18px
        0
        27px;
}

.stat{
    height:116px;

    border-radius:21px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    overflow:hidden;

    box-shadow:
        0 5px 18px rgba(70,45,65,.035);
}

.statIcon{
    font-size:25px;
    line-height:1;

    margin-bottom:7px;
}

.statValue{
    font-size:20px;
    line-height:1;

    font-weight:900;

    margin-bottom:5px;
}

.statLabel{
    font-size:12px;
}

.stat:nth-child(1){
    background:#f8d9e5;
    color:#202029;
}

.stat:nth-child(1) .statIcon{
    color:#9f2859;
}

.stat:nth-child(2){
    background:#dceafb;
    color:#202029;
}

.stat:nth-child(2) .statIcon{
    color:#173c72;
}

.stat:nth-child(3){
    background:#dcefe4;
    color:#202029;
}

.stat:nth-child(3) .statIcon{
    color:#24744e;
}

.stat:nth-child(4){
    background:#fff0c7;
    color:#202029;
}

.stat:nth-child(4) .statIcon{
    color:#a27612;
}


/* =========================================================
   SECTION TITLES
========================================================= */

.sectionHead{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:10px;
}

.sectionHead h2{
    margin:0;

    font-size:21px;
    font-weight:900;

    letter-spacing:-.3px;
}

.linkBtn{
    background:none;

    color:#b34570;

    font-size:14px;
    font-weight:850;
}


/* =========================================================
   TODAY'S SCHEDULE
========================================================= */

.scheduleBox{
    background:#fff;

    border-radius:22px;

    padding:9px;

    box-shadow:
        0 7px 25px rgba(65,46,60,.07);
}

.empty{
    text-align:center;

    padding:
        19px
        12px
        12px;

    color:#77727d;
}

.emptyIcon{
    font-size:44px;

    line-height:1;

    margin-bottom:7px;

    color:#e776a3;
}

.empty strong{
    display:block;

    color:#24232b;

    font-size:18px;

    font-weight:700;
}

.empty p{
    margin:
        5px
        0
        16px;

    font-size:14px;
}

.primaryFull{
    width:100%;
    height:53px;

    border-radius:27px;

    background:
        linear-gradient(
            135deg,
            #e98aae,
            #d96c98
        );

    color:#fff;

    font-weight:850;

    font-size:16px;
}


/* =========================================================
   TODAY JOB CARDS
========================================================= */

.jobCard{
    border-radius:19px;

    padding:13px;

    display:grid;

    grid-template-columns:
        48px
        1fr
        auto;

    gap:10px;

    align-items:center;

    margin-bottom:8px;
}

.jobCard:last-child{
    margin-bottom:0;
}

.jobCard:nth-child(3n+1){
    background:#f9dce8;
}

.jobCard:nth-child(3n+2){
    background:#dceafb;
}

.jobCard:nth-child(3n){
    background:#dcefe4;
}

.jobPhoto{
    width:48px;
    height:48px;

    border-radius:50%;

    object-fit:cover;

    border:
        2px solid
        rgba(255,255,255,.85);
}

.clientName{
    font-size:16px;
    font-weight:900;
}

.badge{
    display:inline-block;

    font-size:9px;

    padding:
        3px
        7px;

    border-radius:9px;

    margin-left:4px;

    font-weight:800;
}

.private{
    background:#f4c8db;
    color:#b43e72;
}

.agency{
    background:#c4e1f7;
    color:#2778a5;
}

.jobInfo{
    font-size:11px;

    color:#65616c;

    line-height:1.45;

    margin-top:4px;
}

.priceBox{
    text-align:right;
}

.price{
    font-size:16px;
    font-weight:900;
}

.rate{
    font-size:10px;
    color:#77707a;
    margin-top:2px;
}

.miniActions{
    display:flex;
    gap:4px;
    justify-content:flex-end;

    margin-top:5px;
}

.mini{
    border-radius:9px;

    padding:
        5px
        7px;

    background:#d86f9c;

    color:#fff;

    font-size:9px;
    font-weight:850;
}

.mini.timer{
    background:#967bc9;
}


/* =========================================================
   QUICK ACTIONS
   EXACTLY 2 COLUMNS LIKE REFERENCE IMAGE
========================================================= */

.quickTitle{
    font-size:21px;

    font-weight:900;

    margin:
        24px
        0
        10px;
}

.quick{
    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:8px;
}

.quick button{
    position:relative;

    height:64px;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:9px;

    font-size:13px;

    font-weight:700;

    box-shadow:
        0 4px 14px rgba(70,45,65,.025);
}

.q1{
    background:#dceafb;
    color:#245887;
}

.q2{
    background:#dcefe4;
    color:#347758;
}

.q3{
    background:#f8d9e5;
    color:#9e3f68;
}

.q4{
    background:#fff0c7;
    color:#80621c;
}

.q5{
    background:#e8defa;
    color:#65469c;
}

.q6{
    background:#f8ddd5;
    color:#a65243;
}

.q7{
    background:#f8ddd5;
    color:#a65243;
}

.q8{
    background:#f9dce8;
    color:#a43e69;
}

.qIcon{
    font-size:23px;
    line-height:1;
}


/* =========================================================
   BANNER
========================================================= */

.banner{
    height:108px;

    margin-top:15px;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #f8dce7,
            #fdebef
        );

    display:grid;

    place-items:center;

    text-align:center;

    overflow:hidden;

    position:relative;
}

.banner::after{
    content:"";

    position:absolute;

    right:-10px;
    bottom:-20px;

    width:130px;
    height:130px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(239,125,155,.25) 0 25%,
            rgba(239,125,155,.10) 26% 48%,
            transparent 49%
        );
}

.bannerText{
    position:relative;
    z-index:2;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:28px;

    line-height:1.1;

    color:#a45676;
}


/* =========================================================
   BOTTOM NAVIGATION
   5 BUTTONS — LIKE SECOND IMAGE
========================================================= */

.bottomNav{
    position:fixed;

    z-index:90;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:min(650px,100%);

    min-height:84px;

    background:
        rgba(255,255,255,.98);

    border-top:
        1px solid
        #eee5e9;

    padding:
        6px
        4px
        calc(6px + env(safe-area-inset-bottom));

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:2px;

    box-shadow:
        0 -7px 28px
        rgba(80,50,70,.10);

    backdrop-filter:blur(15px);
}

.bottomNav button{
    min-width:0;

    background:none;

    color:#99939d;

    font-size:11px;

    font-weight:600;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    border-radius:15px;
}

.bottomNav button span{
    width:46px;
    height:38px;

    border-radius:20px;

    display:grid;

    place-items:center;

    font-size:27px;

    line-height:1;
}

.bottomNav button.active{
    color:#d45f91;
    font-weight:800;
}

.bottomNav button.active span{
    background:#f9dce8;
}


/* =========================================================
   MODALS
========================================================= */

.overlay{
    position:fixed;

    z-index:1000;

    inset:0;

    background:
        rgba(45,36,48,.35);

    backdrop-filter:blur(5px);

    display:none;

    align-items:flex-end;
}

.overlay.show{
    display:flex;
}

.sheet{
    width:100%;

    max-width:650px;

    max-height:94vh;

    overflow:auto;

    background:#fffafd;

    border-radius:
        30px
        30px
        0
        0;

    padding:
        20px
        18px
        calc(30px + env(safe-area-inset-bottom));
}

.sheetHeader{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}

.sheetHeader h2{
    margin:0;

    font-size:23px;
}

.closeBtn{
    width:43px;
    height:43px;

    border-radius:50%;

    background:#f4e7ee;

    color:#b45c80;

    font-size:24px;
}

label{
    display:block;

    font-weight:800;

    margin:
        13px
        0
        6px;
}

.input,
.select,
.textarea{
    width:100%;

    padding:13px;

    border:
        2px solid
        #eadfe5;

    border-radius:16px;

    background:#fff;

    outline:none;

    font-size:16px;
}

.textarea{
    min-height:90px;
}

.grid2{
    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:10px;
}

.saveBtn{
    width:100%;

    margin-top:15px;

    padding:15px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #e98bae,
            #d76d99
        );

    color:#fff;

    font-weight:900;
}

.deleteBtn{
    width:100%;

    margin-top:9px;

    padding:14px;

    border-radius:17px;

    background:#ffe1e7;

    color:#ad3e67;

    font-weight:850;
}

.listItem{
    background:#fff;

    border:
        1px solid
        #eee3e8;

    border-radius:19px;

    padding:14px;

    margin:9px 0;
}

.listTop{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.editBtn{
    background:#f5e5ec;

    color:#b65c80;

    padding:
        9px
        12px;

    border-radius:12px;

    font-weight:800;
}

.meta{
    font-size:12px;

    color:#817984;

    margin-top:5px;

    line-height:1.5;
}

.notice{
    padding:13px;

    background:#fff1f5;

    border-radius:16px;

    color:#7d7179;

    font-size:12px;

    line-height:1.55;

    margin:10px 0;
}

.tabs{
    display:flex;

    gap:7px;

    margin-bottom:12px;
}

.tab{
    flex:1;

    background:#eee8f0;

    border-radius:14px;

    padding:11px;

    font-weight:800;
}

.tab.active{
    background:#e68caf;

    color:#fff;
}

.setting{
    background:
        linear-gradient(
            135deg,
            #fff1f7,
            #f6f1ff
        );

    border:
        1px solid
        #eee4ef;

    border-radius:21px;

    padding:17px;

    margin:10px 0;
}

.settingRow{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.settingTitle{
    font-size:18px;
    font-weight:900;
}

.settingText{
    font-size:12px;

    color:#847984;

    line-height:1.45;

    margin-top:5px;
}

.zoomRange{
    width:100%;

    accent-color:#df76a1;

    margin:18px 0 5px;

    height:35px;
}

.history{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    background:#fff;

    border:
        1px solid
        #eee3e8;

    border-radius:18px;

    padding:13px;

    margin:8px 0;
}

.history small{
    display:block;

    color:#857b84;

    margin-top:4px;
}

.reminder{
    background:#f9e0ea;

    border-radius:18px;

    padding:14px;

    margin:9px 0;
}

.reminderName{
    font-size:17px;

    font-weight:900;
}

.reminderMeta{
    font-size:12px;

    color:#817580;

    margin-top:4px;

    line-height:1.5;
}


/* =========================================================
   TIMER
========================================================= */

.timerFloating{
    position:fixed;

    z-index:95;

    right:14px;

    bottom:
        calc(
            94px +
            env(safe-area-inset-bottom)
        );

    background:#fff;

    border-radius:17px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.17);

    padding:10px 13px;

    display:none;
}

.timerFloating.show{
    display:block;
}

.timerFloating strong{
    display:block;
}

.timerFloating span{
    font-variant-numeric:tabular-nums;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:520px){

    #app{
        padding-left:13px;
        padding-right:13px;
    }

    .brand h1{
        font-size:21px;
    }

    .brand p{
        font-size:13px;
    }

    .logo{
        width:57px;
        height:57px;
    }

    .headerBtn{
        width:48px;
        height:48px;
    }

    .dateMain{
        font-size:16px;
    }

    .dateSub{
        font-size:12px;
    }

    .stats{
        gap:6px;
    }

    .stat{
        height:110px;
        border-radius:20px;
    }

    .statIcon{
        font-size:23px;
    }

    .statValue{
        font-size:18px;
    }

    .statLabel{
        font-size:11px;
    }

    .sectionHead h2,
    .quickTitle{
        font-size:21px;
    }

    .quick{
        gap:8px;
    }

    .quick button{
        height:63px;
        font-size:12px;
    }

    .qIcon{
        font-size:22px;
    }

    .banner{
        height:102px;
    }

    .bannerText{
        font-size:26px;
    }

    .bottomNav{
        min-height:82px;
    }
}

@media(max-width:370px){

    .stats{
        grid-template-columns:
            1fr
            1fr;
    }

    .quick button{
        font-size:11px;
    }

    .bottomNav button{
        font-size:10px;
    }

    .bottomNav button span{
        font-size:25px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     APP HOME
===================================================== -->

<div id="app">


<header>

<div class="headerRow">

<div class="brand">

<img
    class="logo"
    src="icon.png"
    alt="Pure Shine Cleaning"
>

<div class="brandText">

<h1>
Cleaning Manager
</h1>

<p>
Your cleaning business ✨
</p>

</div>

</div>


<button
    class="headerBtn"
    onclick="openReminders()"
    aria-label="Notifications"
>
🔔
</button>

</div>

</header>


<!-- =====================================================
     DATE
===================================================== -->

<section class="dateCard">

<div class="dateLeft">

<div class="dateIcon">
▣
</div>

<div>

<div
    class="dateMain"
    id="todayDate"
>
Saturday 26 September
</div>

<div class="dateSub">
Let's make today productive 🌸
</div>

</div>

</div>

<div class="dateHeart">
♡
</div>

</section>


<!-- =====================================================
     STATS
===================================================== -->

<section class="stats">


<div class="stat">

<div class="statIcon">
▣
</div>

<div
    class="statValue"
    id="jobsCount"
>
0
</div>

<div class="statLabel">
Jobs
</div>

</div>


<div class="stat">

<div class="statIcon">
◷
</div>

<div
    class="statValue"
    id="hoursCount"
>
0h 0m
</div>

<div class="statLabel">
Hours
</div>

</div>


<div class="stat">

<div class="statIcon">
◎
</div>

<div
    class="statValue"
    id="earnedCount"
>
£0
</div>

<div class="statLabel">
Earned
</div>

</div>


<div class="stat">

<div class="statIcon">
☼
</div>

<div
    class="statValue"
    id="freeCount"
>
8h 0m
</div>

<div class="statLabel">
Available
</div>

</div>


</section>


<!-- =====================================================
     TODAY'S SCHEDULE
===================================================== -->

<div class="sectionHead">

<h2>
Today's schedule
</h2>

<button
    class="linkBtn"
    onclick="openSchedule()"
>
See all
</button>

</div>


<section
    class="scheduleBox"
    id="todaySchedule"
>
</section>


<!-- =====================================================
     QUICK ACTIONS
===================================================== -->

<div class="quickTitle">
Quick actions
</div>


<section class="quick">


<button
    class="q1"
    onclick="startNextTimer()"
>

<span class="qIcon">
◷
</span>

<span>
Start cleaning
</span>

</button>


<button
    class="q2"
    onclick="openClients()"
>

<span class="qIcon">
♧
</span>

<span>
Clients
</span>

</button>


<button
    class="q3"
    onclick="openSchedule()"
>

<span class="qIcon">
▣
</span>

<span>
Schedule
</span>

</button>

/* =========================================================
   HELPERS
========================================================= */

function money(n){

return "£"+
Number(n||0)
.toFixed(2)
.replace(/\.00$/,"");

}


function hoursText(x){

x=Math.max(
0,
Number(x||0)
);

let h=Math.floor(x);

let m=Math.round(
(x-h)*60
);

if(m===60){

h++;
m=0;

}

return h+"h "+m+"m";

}


function diffHours(a,b){

if(!a||!b)
return 0;

let [ah,am]=
a.split(":").map(Number);

let [bh,bm]=
b.split(":").map(Number);

return Math.max(
0,
(
(bh*60+bm)-
(ah*60+am)
)/60
);

}


function esc(s){

return String(s??"")
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


function iso(d=new Date()){

return new Date(
d.getTime()-
d.getTimezoneOffset()*60000
)
.toISOString()
.slice(0,10);

}


function dayName(d=new Date()){

return d.toLocaleDateString(
"en-GB",
{
weekday:"long"
}
);

}

STORAGE_KEY,

function load(){

try{

let saved=
JSON.parse(
localStorage.getItem(
STORAGE_KEY
)||"null"

if(saved){

data={
...data,
...saved
};

}else{

for(
const key of OLD_KEYS
){

try{

let old=
JSON.parse(
localStorage.getItem(key)||"null"
);

if(
old &&
(
Array.isArray(old.clients)||
Array.isArray(old.jobs)
)
){

data={
...data,
...old
};

break;

}

}catch(e){}

}

}

}catch(e){}


if(!Array.isArray(data.clients))
data.clients=[];

if(!Array.isArray(data.jobs))
data.jobs=[];

if(!Array.isArray(data.holidays))
data.holidays=[];

if(!Array.isArray(data.reminders))
data.reminders=[];


data.clients=
data.clients.filter(
c=>
String(c.name||"")
.toLowerCase()!=="gill"
);


for(
const c of defaultClients
){

if(
!data.clients.some(
x=>
String(x.name)
.toLowerCase()===
c.name.toLowerCase()
)
){

data.clients.push(
JSON.parse(
JSON.stringify(c)
)
);

}

}

save();

}


/* =========================================================
   SCHEDULE
========================================================= */

function holidayApplies(
clientId,
date
){

return data.holidays.some(
h=>
h.clientId===clientId&&
date>=h.from&&
date<=h.to
);

}


function clientWorksOnDate(
c,
date
){

if(
!c.day||
!c.start||
!c.end
)
return false;

if(
holidayApplies(
c.id,
iso(date)
)
)
return false;

if(
dayName(date)!==c.day
)
return false;

if(
c.frequency==="Occasional"
)
return false;


if(c.name==="Sindu"){

const anchor=
new Date(
"2026-09-25T00:00:00"
);

if(date<anchor)
return false;

return(
Math.floor(
(date-anchor)/86400000
)%14===0
);

}


if(c.name==="Joanna"){

const anchor=
new Date(
"2026-10-02T00:00:00"
);

if(date<anchor)
return false;

return(
Math.floor(
(date-anchor)/86400000
)%14===0
);

}


if(
c.frequency==="Every 2 weeks"||
c.frequency==="Fortnightly"
){

const anchor=
new Date(
"2026-09-25T00:00:00"
);

return(
Math.floor(
(date-anchor)/86400000
)%14===0
);

}


if(
c.frequency==="Every 3 weeks"
){

const anchor=
new Date(
"2026-09-25T00:00:00"
);

return(
Math.floor(
(date-anchor)/86400000
)%21===0
);

}


if(
c.frequency==="Every 4 weeks"||
c.frequency==="Monthly"
){

const anchor=
new Date(
"2026-09-25T00:00:00"
);

return(
Math.floor(
(date-anchor)/86400000
)%28===0
);

}


return true;

}


function recurringJobsForDate(date){

return data.clients
.filter(
c=>
clientWorksOnDate(
c,
date
)
)
.map(
c=>({

id:
"auto-"+c.id+"-"+iso(date),

clientId:c.id,

day:c.day,

date:iso(date),

start:c.start,

end:c.end,

hours:
diffHours(
c.start,
c.end
),

rate:c.rate,

notes:c.notes||"",

scheduled:true,

auto:true

})
);

}


function todayJobs(){

let d=
new Date();

let recurring=
recurringJobsForDate(d);

let manual=
data.jobs.filter(
j=>
j.date===iso(d)&&
j.auto!==true
);

return[
...recurring,
...manual
];

}

function saveClient(){

let id=
clientId.value;

let name=
clientName.value.trim();

if(
!name||
name.toLowerCase()==="gill"
){

alert(
"Please enter a valid client name."
);

return;

}

let old=
client(id);

let c={

id:
id||
"client-"+Date.now(),

name,

type:
clientType.value,

rate:
Number(
clientRate.value||0
),

day:
clientDay.value,

frequency:
clientFrequency.value,

week:
clientWeek.value,

start:
clientStart.value,

end:
clientEnd.value,

variable:
old?.variable||
false,

phone:
clientPhone.value.trim(),

location:
clientLocation.value.trim(),

notes:
clientNotes.value.trim()

};


if(id){

data.clients=
data.clients.map(
x=>
x.id===id
?
c
:
x
);

}else{

data.clients.push(c);

}

save();

closeModal();

render();

}


function deleteClient(id){

let c=
client(id);

if(
!c||
!confirm(
"Delete "+c.name+"?"
)
)
return;

data.clients=
data.clients.filter(
x=>x.id!==id
);

data.jobs=
data.jobs.filter(
j=>j.clientId!==id
);

data.holidays=
data.holidays.filter(
h=>h.clientId!==id
);

data.reminders=
data.reminders.filter(
r=>r.clientId!==id
);

if(
data.timer?.clientId===id
)
data.timer=null;

save();

openClients();

render();

}

/* =========================================================
   FREE TIME
========================================================= */

function formatMinutes(m){

return String(
Math.floor(m/60)
).padStart(2,"0")
+
":"+
String(
m%60
).padStart(2,"0");

}


function openFreeTime(){

let days=[
"Monday",
"Tuesday",
"Wednesday",
"Thursday",
"Friday",
"Saturday",
"Sunday"
];

let html=
days.map(
day=>{

let clients=
data.clients
.filter(
c=>
c.day===day&&
c.start&&
c.end&&
c.frequency!=="Occasional"
)
.sort(
(a,b)=>
a.start.localeCompare(
b.start
)
);

let cursor=480;

let gaps=[];

for(
const c of clients
){

let [sh,sm]=
c.start.split(":")
.map(Number);

let [eh,em]=
c.end.split(":")
.map(Number);

let start=
sh*60+sm;

let end=
eh*60+em;

if(start>cursor){

gaps.push(
formatMinutes(cursor)+
"–"+
formatMinutes(start)
);

}

cursor=
Math.max(
cursor,
end
);

}

if(cursor<1200){

gaps.push(
formatMinutes(cursor)+
"–20:00"
);

}

return`

<div class="listItem">

<strong>
${day}
</strong>

<div class="meta">

${
gaps.length
?
gaps.join(" · ")
:
"No open time"
}

</div>

</div>

`;

}
).join("");

show(`

<div class="sheetHeader">

<h2>
Free time 🕒
</h2>

<button
class="closeBtn"
onclick="closeModal()"
>
×
</button>

</div>

<div class="notice">

Availability is calculated using your schedule and an 08:00–20:00 working window.

</div>

${html}

`);

}

/* =========================================================
   TIMER
========================================================= */

function startNextTimer(){

let jobs=
todayJobs();

if(!jobs.length){

openJob();

return;

}

toggleTimer(
jobs[0].id
);

}


function toggleTimer(id){

if(
data.timer?.jobId===id
){

stopTimer();

return;

}

let j=
data.jobs.find(
x=>x.id===id
);

if(!j){

let auto=
todayJobs()
.find(
x=>x.id===id
);

if(auto){

j={

...auto,

id:
"logged-"+Date.now(),

auto:false,

scheduled:false,

date:iso()

};

data.jobs.push(j);

}

}

if(!j)
return;

data.timer={

jobId:j.id,

startedAt:Date.now(),

baseHours:
Number(j.hours||0)

};

save();

render();

}


function stopTimer(){

if(!data.timer)
return;

let j=
data.jobs.find(
x=>x.id===data.timer.jobId
);

if(j){

j.hours=
Number(
data.timer.baseHours||0
)
+
(
Date.now()-
data.timer.startedAt
)/3600000;

j.date=
j.date||
iso();

}

data.timer=null;

save();

render();

}


function updateTimer(){

let box=
document.getElementById(
"timerFloating"
);

if(
!data.timer
){

box.classList.remove(
"show"
);

return;

}

let j=
data.jobs.find(
x=>x.id===data.timer.jobId
);

if(!j){

data.timer=null;

save();

box.classList.remove(
"show"
);

return;

}

let c=
client(j.clientId);

box.classList.add(
"show"
);

timerClient.textContent=
c?.name||
"Timer";

let seconds=
Math.floor(
(
Date.now()-
data.timer.startedAt
)/1000
);

timerValue.textContent=
String(
Math.floor(seconds/3600)
).padStart(2,"0")
+
":"+
String(
Math.floor(
(seconds%3600)/60
)
).padStart(2,"0")
+
":"+
String(
seconds%60
).padStart(2,"0");

}

c.phone.replace(

);

"https://wa.me/"+
phone+
"?text="+
encodeURIComponent(
reminderText(c)
);

);

function getZoom(){

let z=
Number(
localStorage.getItem(
"pure_shine_zoom"
)||100
);

return Math.max(
80,
Math.min(
200,
z
)
);

}


function applyZoom(z){

z=
Math.max(
80,
Math.min(
200,
Number(z)||100
)
);

localStorage.setItem(
"pure_shine_zoom",
String(z)
);

document.documentElement.style.setProperty(
"--zoom",
String(z/100)
);

const zoomText=
document.getElementById(
"zoomValue"
);

if(zoomText){

zoomText.textContent=
z+"%";

}

}
