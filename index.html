<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8d8e5">
<title>Pure Shine Cleaning Manager</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f8dfe9;color:#292634;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

:root{--zoom:1}

.app{
    width:min(100%,650px);
    min-height:100vh;
    margin:auto;
    background:#fffafd;
    padding:0 22px 125px;
    font-size:calc(16px * var(--zoom));
}

.header{padding:30px 0 18px;background:#fffafd}
.headerInner{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:15px}
.logo{
    width:64px;height:64px;border-radius:19px;
    background:linear-gradient(145deg,#fff,#ffd5e5);
    border:1px solid #efb4ca;
    box-shadow:0 8px 22px rgba(190,91,130,.16);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0
}
.logo span{
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:11px;line-height:.9;text-align:center;color:#c87899;
    transform:rotate(-5deg)
}
.logo span b{
    display:block;font-size:10px;letter-spacing:1px;
    font-family:Arial,sans-serif;margin-top:4px
}
.brandTitle{font-size:25px;font-weight:800;letter-spacing:-.7px}
.brandSub{color:#8c8290;font-size:16px;margin-top:5px}
.headerButton{
    width:55px;height:55px;border:0;border-radius:50%;
    background:#fff;color:#397ff0;font-size:25px;
    box-shadow:0 8px 25px rgba(80,65,90,.08)
}

.today{
    margin-top:5px;padding:22px;border-radius:27px;
    background:#f8d2e1;display:flex;align-items:center;
    justify-content:space-between
}
.todayLeft{display:flex;align-items:center;gap:17px}
.calendarIcon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#9f5777;font-size:28px}
.todayDate{font-size:20px;font-weight:800}
.todayText{color:#817583;font-size:16px;margin-top:7px}
.todayHeart{color:#d76e9b;font-size:40px;line-height:1}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:20px}
.stat{
    min-height:144px;border-radius:27px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;text-align:center
}
.statIcon{font-size:27px;margin-bottom:11px}
.statNumber{font-size:24px;font-weight:850}
.statLabel{font-size:15px;margin-top:7px}
.pink{background:#f8d8e5}
.blue{background:#d9e7fc}
.green{background:#dcefe5}
.yellow{background:#fff0c8}

.sectionHeader{display:flex;align-items:center;justify-content:space-between;margin:27px 0 13px}
.sectionTitle{font-size:25px;font-weight:850;letter-spacing:-.7px}
.seeAll{border:0;background:transparent;color:#b34c73;font-weight:800;font-size:17px}

.schedule{
    background:#fff;border-radius:27px;padding:16px;
    box-shadow:0 9px 30px rgba(70,45,65,.07)
}

.clientCard{
    position:relative;border-radius:23px;min-height:135px;
    padding:18px;margin-bottom:12px;
    display:grid;grid-template-columns:62px 1fr auto;
    align-items:center;gap:14px
}
.clientCard:last-child{margin-bottom:0}
.clientPink{background:#fbdce8}
.clientBlue{background:#dceafb}
.clientGreen{background:#e0f2e7}

.avatar{
    width:58px;height:58px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:800
}
.avatarPink{background:#f5b4ce;color:#b53670}
.avatarBlue{background:#b9daf6;color:#237caf}
.avatarGreen{background:#b8e3c9;color:#299565}

.clientName{font-size:21px;font-weight:850}
.badge{
    display:inline-block;vertical-align:middle;margin-left:6px;
    padding:5px 12px;border-radius:13px;font-size:12px;font-weight:700
}
.badgePrivate{background:#f5c8dc;color:#bc4278}
.badgeAgency{background:#c5e2f8;color:#277ba7}
.clientInfo{color:#5e6671;font-size:15px;line-height:1.55;margin-top:6px}

.priceArea{text-align:right;align-self:center}
.price{font-size:22px;font-weight:850}
.rate{color:#68717b;font-size:14px;margin-top:3px}

.play{
    width:50px;height:50px;border:0;border-radius:50%;
    background:#e66b9b;color:#fff;font-size:21px;margin-top:8px;
    box-shadow:0 6px 16px rgba(210,82,130,.2)
}

.reminderMini{
    border:0;border-radius:14px;
    background:#d86f9e;color:white;
    padding:8px 11px;font-size:11px;font-weight:800;
    margin-top:7px;
    box-shadow:0 4px 10px rgba(210,82,130,.16)
}

.quickTitle{font-size:24px;font-weight:850;margin:28px 0 13px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quickButton{
    min-height:105px;border:0;border-radius:23px;
    display:flex;align-items:center;justify-content:center;
    gap:7px;padding:13px;font-size:15px;font-weight:750;
    box-shadow:0 6px 18px rgba(70,50,70,.04)
}
.quickIcon{font-size:28px}
.quickPink{background:#f9d7e5;color:#ba4174}
.quickGreen{background:#dcefe4;color:#398061}
.quickPurple{background:#e6dbfb;color:#644b9b}
.quickYellow{background:#fff0c7;color:#85651e}
.quickBlue{background:#dceafc;color:#396c9e}
.quickPeach{background:#f8ddd4;color:#a95845}

.banner{
    margin-top:17px;min-height:145px;border-radius:25px;
    background:linear-gradient(135deg,#e7c2d1,#e6c6d5);
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:20px
}
.bannerText{
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:30px;line-height:1.25;color:#9b5875
}

.bottomNav{
    position:fixed;z-index:50;bottom:0;left:50%;
    transform:translateX(-50%);width:min(650px,100%);
    background:rgba(255,255,255,.97);
    border-top:1px solid #eee3e8;
    padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:repeat(5,1fr);
    box-shadow:0 -8px 25px rgba(70,45,65,.05)
}
.navButton{border:0;background:transparent;color:#9b949d;font-size:13px;padding:4px}
.navButton span{
    display:flex;width:48px;height:40px;margin:auto;
    border-radius:20px;align-items:center;justify-content:center;font-size:22px
}
.navButton.active{color:#df6998}
.navButton.active span{background:#f9dce8}

.overlay{
    position:fixed;z-index:100;inset:0;
    background:rgba(40,27,37,.45);
    display:none;align-items:flex-end
}
.overlay.open{display:flex}
.modal{
    width:100%;max-width:650px;max-height:92vh;overflow-y:auto;
    background:#fffafd;border-radius:32px 32px 0 0;
    padding:23px 20px calc(30px + env(safe-area-inset-bottom))
}
.modalHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modalTitle{margin:0;font-size:24px}
.close{
    width:44px;height:44px;border:0;border-radius:50%;
    background:#f7e6ee;color:#bb6687;font-size:26px
}
.label{display:block;margin:14px 0 7px;font-weight:750}
.input,.select,.textarea{
    width:100%;border:2px solid #eadfe5;background:#fff;
    border-radius:16px;padding:14px;outline:none
}
.textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{
    width:100%;border:0;border-radius:18px;padding:16px;margin-top:18px;
    background:linear-gradient(135deg,#e991b4,#d66f99);
    color:white;font-weight:850
}
.delete{
    width:100%;border:0;border-radius:18px;padding:14px;margin-top:9px;
    background:#ffe3ea;color:#bb426c;font-weight:750
}

.clientListItem{
    display:flex;align-items:center;gap:13px;background:#fff;
    border:1px solid #f0e3e9;border-radius:20px;padding:14px;margin:8px 0
}
.clientListAvatar{
    width:53px;height:53px;border-radius:50%;
    background:#f7d8e5;color:#b94171;
    display:flex;align-items:center;justify-content:center;
    font-weight:850;font-size:20px;flex-shrink:0
}
.clientListInfo{flex:1}
.clientListName{font-size:18px;font-weight:800}
.clientListMeta{color:#847983;font-size:12px;margin-top:4px}
.editButton{
    border:0;background:#f7e7ee;color:#b85e82;
    border-radius:13px;padding:9px 12px;font-weight:750
}
.addClient{
    width:100%;border:0;background:#e791b3;color:white;
    border-radius:18px;padding:15px;font-weight:850;margin-bottom:10px
}

.empty{text-align:center;color:#887b84;padding:28px 10px}
.emptyIcon{font-size:40px;margin-bottom:7px}

.settingCard{
    background:#fff;border:1px solid #f0e3e9;
    border-radius:21px;padding:17px;margin:10px 0
}
.settingRow{
    display:flex;align-items:center;
    justify-content:space-between;gap:14px
}
.settingTitle{font-weight:800;font-size:17px}
.settingText{color:#887b84;font-size:12px;margin-top:4px;line-height:1.4}
.zoomValue{
    font-size:17px;font-weight:850;
    color:#bd557d;min-width:55px;text-align:right
}
.range{width:100%;accent-color:#d96f9c;margin-top:14px}
.smallButton{
    border:0;border-radius:13px;padding:10px 13px;
    background:#f3d5e2;color:#b44c77;font-weight:800;
    white-space:nowrap
}
.notice{
    background:#fff0f5;border-radius:18px;padding:14px;
    color:#806f79;font-size:12px;line-height:1.5;margin:12px 0
}
.reminderItem{
    background:#f9e1eb;border-radius:18px;padding:13px;margin:8px 0
}
.reminderItem strong{font-size:16px}
.reminderMeta{font-size:12px;color:#806f79;margin-top:4px}
.reminderActions{display:flex;gap:7px;margin-top:9px}
.reminderActions button{
    flex:1;border:0;border-radius:13px;padding:10px;
    background:#fff;color:#b64e78;font-weight:750
}
.reminderActions .primary{
    background:#d86f9e;color:white
}

@media(max-width:500px){
    .app{padding-left:16px;padding-right:16px}
    .brandTitle{font-size:21px}
    .brandSub{font-size:14px}
    .logo{width:58px;height:58px}
    .headerButton{width:48px;height:48px}
    .today{padding:18px}
    .todayDate{font-size:17px}
    .todayText{font-size:14px}
    .todayHeart{font-size:34px}
    .stats{gap:7px}
    .stat{min-height:122px;border-radius:21px}
    .statNumber{font-size:20px}
    .statLabel{font-size:12px}
    .sectionTitle,.quickTitle{font-size:21px}
    .clientCard{
        grid-template-columns:50px 1fr auto;
        gap:9px;padding:13px
    }
    .avatar{width:48px;height:48px;font-size:20px}
    .clientName{font-size:17px}
    .badge{font-size:10px;padding:4px 8px}
    .clientInfo{font-size:12px}
    .price{font-size:17px}
    .rate{font-size:11px}
    .play{width:42px;height:42px;font-size:17px}
    .reminderMini{font-size:9px;padding:7px 8px}
    .quick{grid-template-columns:repeat(2,1fr)}
    .quickButton{min-height:86px;font-size:13px}
    .quickIcon{font-size:24px}
    .bannerText{font-size:25px}
}

@media(max-width:360px){
    .brandTitle{font-size:18px}
    .brandSub{font-size:12px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat{min-height:105px}
    .todayHeart{display:none}
    .clientCard{grid-template-columns:45px 1fr}
    .priceArea{display:none}
}
</style>
</head>

<body>

<div class="app">

<header class="header">
<div class="headerInner">

<div class="brand">

<div class="logo">
<span>
Pure Shine
<b>CLEANING</b>
</span>
</div>

<div>
<div class="brandTitle">Cleaning Manager</div>
<div class="brandSub">Your cleaning business ✨</div>
</div>

</div>

<button class="headerButton" onclick="openSettings()">⚙️</button>

</div>
</header>


<section class="today">

<div class="todayLeft">

<div class="calendarIcon">▣</div>

<div>
<div class="todayDate" id="todayDate"></div>
<div class="todayText">Let's make today productive 🌸</div>
</div>

</div>

<div class="todayHeart">♡</div>

</section>


<section class="stats">

<div class="stat pink">
<div class="statIcon">▣</div>
<div class="statNumber" id="jobsToday">0</div>
<div class="statLabel">Jobs</div>
</div>

<div class="stat blue">
<div class="statIcon">◷</div>
<div class="statNumber" id="hoursToday">0h</div>
<div class="statLabel">Hours</div>
</div>

<div class="stat green">
<div class="statIcon">◎</div>
<div class="statNumber" id="earnedToday">£0</div>
<div class="statLabel">Earned</div>
</div>

<div class="stat yellow">
<div class="statIcon">☼</div>
<div class="statNumber" id="freeToday">8h</div>
<div class="statLabel">Available</div>
</div>

</section>


<div class="sectionHeader">

<div class="sectionTitle">Today's schedule</div>

<button class="seeAll" onclick="openSchedule()">
See all
</button>

</div>


<section class="schedule" id="todaySchedule"></section>


<div class="quickTitle">Quick actions</div>

<section class="quick">

<button class="quickButton quickPink" onclick="openAddJob()">
<span class="quickIcon">▣</span>
Add cleaning job
</button>

<button class="quickButton quickGreen" onclick="openClients()">
<span class="quickIcon">♣</span>
Clients
</button>

<button class="quickButton quickPurple" onclick="openTimer()">
<span class="quickIcon">◷</span>
Start timer
</button>

<button class="quickButton quickYellow" onclick="openSchedule()">
<span class="quickIcon">▣</span>
Schedule
</button>

<button class="quickButton quickBlue" onclick="openEarnings()">
<span class="quickIcon">▤</span>
Earnings
</button>

<button class="quickButton quickPeach" onclick="openHolidays()">
<span class="quickIcon">♨</span>
Holidays
</button>

</section>


<section class="banner">

<div class="bannerText">
♡ A clean space<br>
is a happy place ♡
</div>

</section>

</div>


<nav class="bottomNav">

<button class="navButton active" onclick="goHome(this)">
<span>⌂</span>
Home
</button>

<button class="navButton" onclick="openSchedule(this)">
<span>▣</span>
Schedule
</button>

<button class="navButton" onclick="openClients(this)">
<span>♣</span>
Clients
</button>

<button class="navButton" onclick="openTimer(this)">
<span>◷</span>
Timer
</button>

<button class="navButton" onclick="openEarnings(this)">
<span>▤</span>
Earnings
</button>

</nav>


<div class="overlay" id="overlay">
<div class="modal" id="modal"></div>
</div>


<script>

const STORAGE_KEY="pureShineExactDesignV11";

const defaultClients=[
{
id:1,
name:"Lottie",
type:"Private",
rate:18,
day:"Monday",
start:"09:00",
end:"12:00",
location:"",
notes:"",
frequency:"Weekly",
phone:""
},
{
id:2,
name:"Matt",
type:"Agency",
rate:16,
day:"Tuesday",
start:"13:00",
end:"15:00",
location:"",
notes:"",
frequency:"Weekly",
phone:""
},
{
id:3,
name:"Christine",
type:"Private",
rate:18,
day:"Tuesday",
start:"16:00",
end:"17:30",
location:"",
notes:"",
frequency:"Weekly",
phone:""
}
];

let stored=null;

try{
stored=JSON.parse(
localStorage.getItem(STORAGE_KEY)
);
}catch(e){}

let clients=stored?.clients||defaultClients;
let jobs=stored?.jobs||[];
let holidays=stored?.holidays||[];
let reminders=stored?.reminders||[];

let timerInterval=null;
let timerStart=null;


function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify({
clients,
jobs,
holidays,
reminders
})
);

}


function escapeHTML(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function minutes(t){

const [h,m]=t.split(":").map(Number);

return h*60+m;

}


function duration(a,b){

return Math.max(
0,
(minutes(b)-minutes(a))/60
);

}


function money(v){

return "£"+
Number(v)
.toFixed(2)
.replace(".00","");

}


function initials(n){

return n.trim()
.charAt(0)
.toUpperCase();

}


function todayName(){

return new Date()
.toLocaleDateString(
"en-GB",
{weekday:"long"}
);

}


function dateText(){

return new Date()
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

}


function formatHours(v){

return v%1===0
?v+"h"
:v.toFixed(1)+"h";

}


function getTodayClients(){

return clients
.filter(c=>c.day===todayName())
.sort(
(a,b)=>
minutes(a.start)-
minutes(b.start)
);

}


function render(){

document.getElementById("todayDate")
.textContent=dateText();

const list=getTodayClients();

let hours=0;
let earnings=0;

list.forEach(c=>{

const h=duration(
c.start,
c.end
);

hours+=h;
earnings+=h*Number(c.rate);

});

document.getElementById("jobsToday")
.textContent=list.length;

document.getElementById("hoursToday")
.textContent=formatHours(hours);

document.getElementById("earnedToday")
.textContent=money(earnings);

document.getElementById("freeToday")
.textContent=
formatHours(
Math.max(0,8-hours)
);

renderTodaySchedule();

save();

}


function renderTodaySchedule(){

const el=
document.getElementById(
"todaySchedule"
);

const list=getTodayClients();

if(!list.length){

el.innerHTML=`
<div class="empty">

<div class="emptyIcon">♡</div>

<strong>No cleaning jobs today</strong>

<div>Add a client to your schedule.</div>

</div>
`;

return;

}

const colors=[
"clientPink",
"clientBlue",
"clientGreen"
];

const avatars=[
"avatarPink",
"avatarBlue",
"avatarGreen"
];

el.innerHTML=list.map((c,i)=>{

const h=
duration(
c.start,
c.end
);

const total=
h*Number(c.rate);

return `

<div class="clientCard ${colors[i%3]}">

<div class="avatar ${avatars[i%3]}">
${initials(c.name)}
</div>


<div>

<div class="clientName">

${escapeHTML(c.name)}

<span class="badge ${
c.type==="Private"
?"badgePrivate"
:"badgeAgency"
}">

${escapeHTML(c.type)}

</span>

</div>


<div class="clientInfo">

◷ ${c.start} – ${c.end}
(${formatHours(h)})

${
c.location
?`<br>⌖ ${escapeHTML(c.location)}`
:""
}

</div>

</div>


<div class="priceArea">

<div class="price">
${money(total)}
</div>

<div class="rate">
£${Number(c.rate).toFixed(0)}/h
</div>

<button
class="play"
onclick="startTimerFor(${c.id})"
>
▶
</button>

<button
class="reminderMini"
onclick="openReminderFor(${c.id})"
>
🔔 Reminder
</button>

</div>

</div>

`;

}).join("");

}


function showModal(html){

document.getElementById("modal")
.innerHTML=html;

document.getElementById("overlay")
.classList.add("open");

}


function closeModal(){

document.getElementById("overlay")
.classList.remove("open");

}


document
.getElementById("overlay")
.addEventListener(
"click",
e=>{

if(e.target===e.currentTarget)
closeModal();

}
);


/* =========================
CLIENTS
========================= */

function openClients(){

showModal(`

<div class="modalHeader">

<h2 class="modalTitle">
Clients 👥
</h2>

<button
class="close"
onclick="closeModal()"
>
×
</button>

</div>


<button
class="addClient"
onclick="openClientForm()"
>
＋ Add new client
</button>


${
clients.length
?
clients.map(c=>`

<div class="clientListItem">

<div class="clientListAvatar">
${initials(c.name)}
</div>

<div class="clientListInfo">

<div class="clientListName">
${escapeHTML(c.name)}
</div>

<div class="clientListMeta">

${escapeHTML(c.type)}
· £${Number(c.rate).toFixed(0)}/h
· ${escapeHTML(c.day)}
· ${escapeHTML(c.start)}
– ${escapeHTML(c.end)}

</div>

${
c.location
?
`
<div class="clientListMeta">
⌖ ${escapeHTML(c.location)}
</div>
`
:""
}

${
c.phone
?
`
<div class="clientListMeta">
☎ ${escapeHTML(c.phone)}
</div>
`
:""
}

</div>

<button
class="editButton"
onclick="openClientForm(${c.id})"
>
Edit
</button>

</div>

`).join("")
:
`
<div class="empty">
No clients added yet.
</div>
`
}

`);

}


/* =========================
CLIENT FORM
========================= */

function openClientForm(id=null){

const c=
id
?clients.find(x=>x.id===id)
:null;

showModal(`

<div class="modalHeader">

<h2 class="modalTitle">
${c?"Edit client":"Add client"}
</h2>

<button
class="close"
onclick="openClients()"
>
×
</button>

</div>


<label class="label">
Client name
</label>

<input

document.getElementById("clientName")

document.getElementById("clientType")
.value;

const rate=
Number(
document.getElementById("clientRate")
.value
);

document.getElementById("clientDay")
.value;

document.getElementById("clientFrequency")
.value;

document.getElementById("clientStart")
.value;

const end=
document.getElementById("clientEnd")
.value;

document.getElementById("clientLocation")
.value.trim();

const phone=
document.getElementById("clientPhone")
.value.trim();

const notes=
document.getElementById("clientNotes")
.value.trim();


if(!name||!start||!end){

alert(
"Please complete the client name and cleaning times."
);

return;

}


if(minutes(end)<=minutes(start)){

alert(
"End time must be after start time."
);

return;

}

id:id||Date.now(),
name,
type,
rate,
day,
frequency,
start,
end,
location,
phone,
notes
};


if(id){

const i=
clients.findIndex(
c=>c.id===id
);

if(i>=0)
clients[i]=obj;

}else{

clients.push(obj);

}

save();
closeModal();
render();

}


function deleteClient(id){

if(!confirm("Delete this client?"))
return;

clients=
clients.filter(
c=>c.id!==id
);

save();
openClients();
render();

}

function toggleTimer(){

.padStart(2,"0")
)
.join(":");

},1000);

function requestNotifications(){

if(!("Notification" in window)){

alert(
"Notifications are not supported by this browser."
);

return;

}


Notification.requestPermission()
.then(permission=>{

if(permission==="granted"){

new Notification(
"Pure Shine Cleaning ✨",
{
body:"Notifications are enabled on this device."
}
);

renderNotificationStatus();

}else{

alert(
"Please allow notifications in your browser settings."
);

renderNotificationStatus();

}

});

}


function renderNotificationStatus(){

const el=
document.getElementById(
"notificationStatus"
);

if(!el)
return;


if(
"Notification" in window &&
Notification.permission==="granted"
){

el.textContent=
"Notifications enabled ✓";

}else{

el.textContent=
"Notifications not enabled";

}

}


function reminderMessage(client,reminder){

return `
Hello ${client.name}, just a reminder about your cleaning on ${reminder.date} at ${reminder.time}. See you then! ✨
`;

}


function sendWhatsApp(client,reminder){

if(!client.phone){

alert(
"Add the client's phone number first."
);

return;

}


const phone=
client.phone
.replace(/[^\d+]/g,"")
.replace(/^00/,"+");


const text=
encodeURIComponent(
reminderMessage(
client,
reminder
)
);


window.open(
`https://wa.me/${phone.replace("+","")}?text=${text}`,
"_blank"
);

}


function sendSMS(client,reminder){

if(!client.phone){

alert(
"Add the client's phone number first."
);

return;

}


const body=
encodeURIComponent(
reminderMessage(
client,
reminder
)
);


window.location.href=
`sms:${client.phone}?&body=${body}`;

}


function scheduleLocalReminder(client,reminder){

if(!("Notification" in window)){

alert(
"Notifications are not supported."
);

return;

}


if(Notification.permission!=="granted"){

requestNotifications();

return;

}


const target=
new Date(
`${reminder.date}T${reminder.time}:00`
).getTime();


const delay=
target-Date.now();


if(delay<=0){

new Notification(
"🔔 Client reminder",
{
body:reminderMessage(
client,
reminder
),
tag:"pure-shine-"+reminder.id
}
);

return;

}


setTimeout(()=>{

new Notification(
"🔔 Client reminder",
{
body:reminderMessage(
client,
reminder
),
tag:"pure-shine-"+reminder.id
}
);

},
delay
);


alert(
"Reminder scheduled. Notifications must stay enabled."
);

}
