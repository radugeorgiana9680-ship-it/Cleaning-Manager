========================= */

/* =========================
   HEADER
========================= */

justify-content:space-between;

.brand-logo{

}

.brand-sub{

}

.settings{

height:47px;

align-items:center;

}

height:24px;
}


/* =========================
   DATE
========================= */

.date{
height:82px;
border-radius:19px;
background:#f9dce7;
padding:15px 18px;
position:relative;
margin-bottom:16px;
}

.date strong{
font-size:16px;

}

.date span{

}

}


/* =========================
   STATS
========================= */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);

}

.stat{

align-items:center;
justify-content:center;
text-align:center;
}

.stat:nth-child(1){background:#fbdde8}
.stat:nth-child(2){background:#e2e8fa}
.stat:nth-child(3){background:#def1e5}

height:28px;

}

.stat:nth-child(2) svg{color:#17284d}
.stat:nth-child(3) svg{color:#236846}

.stat-label{

/* =========================
   TITLES
========================= */

.heading{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 2px 10px;
}

.heading h2{

}

.heading button{

color:#aa4261;

}

}

.add{

.job-time{

.job-price{

.q3{background:#f9dce7;color:#782c48}
.q4{background:#fff0c9;color:#111}

/* =========================

========================= */

.quote{

linear-gradient(
90deg,
rgba(250,219,230,.94),

url("pure-shine-cleaning-background.png");

}

.quote-text{
position:absolute;
left:62px;
right:75px;
top:25px;

color:#99546b;

}

.quote-heart{

}

.quote-heart.right{

/* =========================
   NAV
========================= */

.nav{

bottom:0;
left:50%;

.nav button{

.nav svg{
width:27px;

}

.nav button.active{

.nav button.active:before{

/* =========================
   OTHER PAGES
========================= */

.page-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:9px 0 16px;
}

.page-title h1{
font-size:27px;

}

.add-small{

}

.card{

padding:15px;
margin-bottom:9px;
box-shadow:0 5px 22px rgba(120,70,90,.07);
}


/* =========================
   CALENDAR
========================= */

.calendar{
background:#fff;
border-radius:21px;
padding:14px;
box-shadow:0 5px 22px rgba(120,70,90,.07);
}

.cal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:13px;
}

.cal-head strong{
font-size:18px;
}

.cal-arrow{
width:36px;
height:36px;

}

.weekdays,
.days{
display:grid;
grid-template-columns:repeat(7,1fr);

}

.weekdays div{
text-align:center;
font-size:10px;

}

.day{
height:39px;
border-radius:10px;
background:#fff7fa;

align-items:center;
justify-content:center;

}

.day.today{
background:#e582a1;
color:white;
font-weight:700;
}

.day.has:after{
content:"";
position:absolute;
bottom:4px;
width:5px;
height:5px;
border-radius:50%;
background:#d16c8b;
}

.day.today.has:after{
background:#fff;
}


/* =========================
   CLIENTS
========================= */

.client{
background:#fff;
border-radius:19px;
padding:15px;
margin-bottom:9px;
box-shadow:0 5px 22px rgba(120,70,90,.07);
}

.client-top{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:47px;
height:47px;
border-radius:50%;
background:#f9dce7;
color:#a94462;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.client-info{
flex:1;
}

.client-info strong{
display:block;
}

.client-info small{
display:block;
color:#777;
margin-top:4px;
}

.rate{
font-weight:700;
color:#a94462;
}

.badges{
display:flex;
gap:6px;
margin-top:10px;
}

.badge{
font-size:10px;
font-weight:700;
padding:4px 8px;
border-radius:8px;
}

.private{
background:#ffe0eb;
color:#873050;
}

.agency{
background:#dceefa;
color:#28617e;
}

.client-actions{
display:flex;
gap:7px;
margin-top:10px;

}

.small{
padding:8px 10px;
border-radius:10px;
background:#f2e8ee;
color:#835068;
font-size:12px;
font-weight:700;
}


/* =========================
   EARNINGS
========================= */

.total{
background:#eadcf8;
border-radius:21px;
padding:22px;
text-align:center;
margin-bottom:10px;
}

.total small{
color:#756a7c;
}

.total strong{
display:block;
font-size:39px;
margin:5px 0;
}

.history{
background:#fff;
border-radius:18px;
padding:15px;
margin-bottom:9px;
box-shadow:0 5px 22px rgba(120,70,90,.07);
}

.history-top{
display:flex;
justify-content:space-between;
}

.history-name{
font-weight:700;
}

.history-date{
font-size:12px;
color:#777;
margin-top:4px;
}

.history-price{
font-weight:700;
color:#a94462;
}


/* =========================
   SETTINGS
========================= */

.setting{
display:flex;
align-items:center;
gap:12px;
background:#fff;
border-radius:18px;
padding:14px;
margin-bottom:9px;
box-shadow:0 5px 22px rgba(120,70,90,.07);
}

.setting-icon{
width:45px;
height:45px;
border-radius:14px;
background:#f9dce7;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
}

.setting-text{
flex:1;
}

.setting-text strong{
display:block;
}

.setting-text small{
display:block;
color:#777;
margin-top:3px;
}

.switch{
width:46px;
height:26px;
border-radius:20px;
background:#d8d2d6;
position:relative;
}

.switch:after{
content:"";
position:absolute;
width:20px;
height:20px;
border-radius:50%;
background:#fff;
left:3px;
top:3px;
transition:.2s;
}

.switch.on{
background:#e582a1;
}

.switch.on:after{
left:23px;
}


/* =========================
   MODAL
========================= */

.overlay{
position:fixed;
inset:0;
z-index:10000;
display:none;
align-items:flex-end;
background:rgba(30,20,25,.38);
backdrop-filter:blur(4px);
}

.overlay.show{
display:flex;
}

.modal{
width:100%;
max-width:560px;
max-height:92vh;
overflow:auto;
margin:auto auto 0;
background:#fff9fb;
border-radius:27px 27px 0 0;
padding:20px 18px 32px;
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
}

.modal-head h2{
margin:0;
font-size:23px;
}

.close{
width:42px;
height:42px;
border-radius:50%;
background:#f1e7ed;
font-size:26px;
color:#91415c;
}

label{
display:block;
font-size:13px;
font-weight:700;
margin:11px 0 6px;
}

.input,.select{
width:100%;
height:49px;
border:1px solid #e5dbe0;
border-radius:13px;
background:#fff;
padding:0 12px;
outline:none;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.modal-save{
width:100%;
height:51px;
border-radius:27px;
background:#e27e9d;
color:white;
font-weight:700;
margin-top:17px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:390px){

.shell{
padding-left:14px;
padding-right:14px;
}

.brand-logo{
width:56px;
height:56px;
}

.brand-title{
font-size:20px;
}

.brand-sub{
font-size:12px;
}

.stat{
height:108px;
}

.stat-number{
font-size:17px;
}

.stat-label{
font-size:11px;
}

.welcome-logo{
width:60%;
}

.welcome-title{
font-size:42px;
}

.feature{
height:82px;
}

.feature span{
font-size:10px;
}

.feature svg{
width:29px;
height:29px;
}

}
</style>
</head>

/* =========================================================
   HELPERS
========================================================= */

function esc(x){
return String(x??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function today(){
const d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function niceDate(d){
return new Date(d+"T12:00:00").toLocaleDateString(
"en-GB",
{weekday:"long",day:"numeric",month:"long"}
);
}

function weekday(d){
return new Date(d+"T12:00:00").toLocaleDateString(
"en-GB",
{weekday:"long"}
);
}

function minutes(t){
if(!t)return 0;
const p=t.split(":").map(Number);
return p[0]*60+p[1];
}

function duration(start,end){
const m=Math.max(0,minutes(end)-minutes(start));
return `${Math.floor(m/60)}h ${m%60}m`;
}

function durationHours(start,end){
return Math.max(0,minutes(end)-minutes(start))/60;
}

function money(n){
return "£"+Number(n||0).toFixed(2);
}

function client(id){
return clientsData.find(
c=>Number(c.id)===Number(id)
);
}

function activate(page){
document.querySelectorAll(".nav button").forEach(b=>{
b.classList.toggle("active",b.dataset.page===page);
});
}

function modal(html){
document.getElementById("modal").innerHTML=html;
document.getElementById("overlay").classList.add("show");
}

function closeModal(){
document.getElementById("overlay").classList.remove("show");
}

function saveJob(){

const c=client(
document.getElementById("jobClient").value
);

const date=document.getElementById("jobDate").value;
const start=document.getElementById("jobStart").value;
const end=document.getElementById("jobEnd").value;

if(!c||!date||!start||!end){
alert("Please complete all fields.");
return;
}

if(minutes(end)<=minutes(start)){
alert("End time must be after start time.");
return;
}

let amount=Number(
document.getElementById("jobAmount").value
);

if(!amount){
amount=durationHours(start,end)*Number(c.rate||0);
}

date,
start,
end,

amount,
price:amount,
status:"Completed"
});

persist();
closeModal();
home();
}

c=>Number(c.id)===Number(id)
);

if(i>=0){
clientsData[i]={
...clientsData[i],
...obj
};
}

}else{
clientsData.push(obj);
}

persist();
closeModal();
clientsPage();
}

clientsData=clientsData.filter(
c=>Number(c.id)!==Number(id)
);

clientsPage();
}

/* =========================================================
   FREE TIME
========================================================= */

function freePage(){

activate("free");

document.getElementById("content").innerHTML=`

<div class="page-title">
<h1>Free time</h1>
</div>

<div class="card">

<label>Date</label>

<input
class="input"

type="date"
value="${today()}"
onchange="calculateFree()"
>

</div>

<div id="freeResult"></div>

`;

calculateFree();
}


function calculateFree(){

const date=document.getElementById("freeDate")?.value;

if(!date)return;

const day=weekday(date);

const list=clientsData
.filter(c=>c.day===day&&c.frequency!=="Occasional")
.sort((a,b)=>minutes(a.start)-minutes(b.start));

let cursor=8*60;
let gaps=[];

list.forEach(c=>{

const s=minutes(c.start);
const e=minutes(c.end);

if(s>cursor){
gaps.push([cursor,s]);
}

cursor=Math.max(cursor,e);

});

if(cursor<18*60){
gaps.push([cursor,18*60]);
}

let total=gaps.reduce(
(a,g)=>a+(g[1]-g[0])/60,0
);

document.getElementById("freeResult").innerHTML=`

<div class="total" style="background:#fff0c9">

<small>Available time</small>

<strong>${Math.floor(total)}h ${Math.round((total%1)*60)}m</strong>

</div>

${gaps.map(g=>`

<div class="card" style="display:flex;justify-content:space-between;align-items:center">

<div>

<strong>
${formatMinutes(g[0])} – ${formatMinutes(g[1])}
</strong>

<div style="font-size:12px;color:#777;margin-top:4px">
${Math.floor((g[1]-g[0])/60)}h ${(g[1]-g[0])%60}m
</div>

</div>

<button class="small" onclick="addJob({
date:'${date}',
start:'${formatMinutes(g[0])}',
end:'${formatMinutes(g[1])}'
})">
＋ Add
</button>

</div>

`).join("")}

`;
}


function formatMinutes(n){

return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
}


/* =========================================================
   TIMER
========================================================= */

let timerInterval=null;

function timer(){

modal(`

<div class="modal-head">

<h2>Start cleaning</h2>

<button class="close" onclick="closeModal()">×</button>

</div>

<label>Client</label>

<select class="select" id="timerClient">

${clientsData.map(c=>`

<option value="${c.id}">
${esc(c.name)} · £${Number(c.rate||0)}/h
</option>

`).join("")}

</select>

<div
id="timerDisplay"
style="
text-align:center;
font-size:43px;
font-weight:700;
padding:28px 0;
">
00:00:00
</div>

<button
class="modal-save"
id="timerButton"
onclick="startTimer()">
Start timer
</button>

`);

if(runningTimer){

document.getElementById("timerClient").value=
runningTimer.clientId;

updateTimerDisplay();

document.getElementById("timerButton").textContent=
"Finish cleaning";

document.getElementById("timerButton").onclick=
finishTimer;

timerInterval=setInterval(updateTimerDisplay,500);

}

}


function startTimer(){

const id=Number(
document.getElementById("timerClient").value
);

const c=client(id);

runningTimer={
clientId:id,
client:c.name,
rate:Number(c.rate||0),
startedAt:Date.now(),
date:today()
};

persist();

timer();

}


function updateTimerDisplay(){

if(!runningTimer)return;

const seconds=Math.floor(
(Date.now()-runningTimer.startedAt)/1000
);

const h=Math.floor(seconds/3600);
const m=Math.floor((seconds%3600)/60);
const s=seconds%60;

const el=document.getElementById("timerDisplay");

if(el){
el.textContent=
`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

}


function finishTimer(){

if(!runningTimer)return;

const endDate=new Date();
const startDate=new Date(runningTimer.startedAt);

const totalMinutes=Math.max(
1,
Math.round((Date.now()-runningTimer.startedAt)/60000)
);

const start=
`${String(startDate.getHours()).padStart(2,"0")}:${String(startDate.getMinutes()).padStart(2,"0")}`;

const end=
`${String(endDate.getHours()).padStart(2,"0")}:${String(endDate.getMinutes()).padStart(2,"0")}`;

const amount=
(totalMinutes/60)*Number(runningTimer.rate||0);

jobsData.push({
id:Date.now(),
clientId:runningTimer.clientId,
client:runningTimer.client,
date:runningTimer.date,
start,
end,
durationMinutes:totalMinutes,
rate:runningTimer.rate,
amount,
price:amount,
status:"Completed",
timerStartedAt:runningTimer.startedAt,
timerFinishedAt:Date.now()
});

runningTimer=null;

if(timerInterval){
clearInterval(timerInterval);
timerInterval=null;
}

persist();
closeModal();
home();

setTimeout(()=>{
alert(
"Cleaning finished\n\n"+
"Time: "+Math.floor(totalMinutes/60)+"h "+totalMinutes%60+"m\n"+
"Amount: "+money(amount)
);
},100);

}
