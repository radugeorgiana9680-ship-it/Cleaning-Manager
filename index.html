
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4c5d6">
<title>Pure Shine Cleaning Manager</title>
<style>
:root{--pink:#f3c7d7;--pinklight:#fff0f5;--gold:#c5a15b;--ink:#463844;--muted:#857783;--line:#f0e1e9;--lav:#e9e1f6;--sage:#e0efe4;--cream:#fff4e1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff9fb}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{max-width:850px;margin:auto;padding:12px 13px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:5px 0 15px}
.profile{width:62px;height:62px;flex-shrink:0;border-radius:20px;overflow:hidden;background:linear-gradient(140deg,var(--pink),var(--gold));display:grid;place-items:center;border:2px solid white;box-shadow:0 3px 12px #75556818;position:relative}
.profile img{width:100%;height:100%;object-fit:cover}
.profile button{position:absolute;right:0;bottom:0;border:0;background:#ffffffdf;border-radius:9px;font-size:12px;padding:3px 5px}
.brand{min-width:0;flex:1}
.brand h1{font:700 24px Georgia,serif;margin:0}
.brand small{color:var(--muted);font-size:12px}
.topbtn{border:0;border-radius:15px;background:#fff0f5;color:#9b5b78;width:45px;height:45px;font-size:25px}
.banner{height:150px;border-radius:23px;overflow:hidden;position:relative;margin-bottom:15px;background:linear-gradient(120deg,#f3c7d7,#f9e8ef 50%,#e9def5);box-shadow:0 6px 22px #75556810}
.banner>img{width:100%;height:100%;object-fit:cover;display:block}
.banner .banneredit{position:absolute;right:10px;top:10px;background:#ffffffdf;border:0;border-radius:12px;padding:9px 11px;color:#634957;font-size:12px;font-weight:700}
.banner .emptybanner{height:100%;display:flex;align-items:center;justify-content:center;font-size:35px;color:#b78a9e}
h2{font:700 21px Georgia,serif;margin:0}
h3{font-size:16px;margin:0 0 8px}
p{line-height:1.5}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.hero{padding:19px;border-radius:23px;background:linear-gradient(125deg,#f7dbe6,#f0e7fa 65%,#fff1d9);margin-bottom:13px}
.hero h2{font-size:24px;margin:7px 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.stat{padding:14px;border-radius:18px;background:var(--pinklight);min-width:0}
.stat:nth-child(2){background:var(--sage)}.stat:nth-child(3){background:var(--lav)}.stat:nth-child(4){background:var(--cream)}
.stat span{font-size:12px;color:var(--muted);display:block}.stat strong{font-size:21px;display:block;margin-top:5px;overflow-wrap:anywhere}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:21px 2px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:14px;margin:9px 0;box-shadow:0 5px 20px #7555680a}
.btn{border:0;border-radius:14px;padding:11px 14px;background:var(--pink);color:#694456;font-weight:750}
.btn.primary{background:linear-gradient(120deg,#e9b2c8,#c5a15b);color:white}
.btn.soft{background:#faeaf1}.btn.danger{background:#f9e0e2;color:#994958}.btn.small{padding:8px 10px;font-size:12px}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.wide{width:100%}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.itemtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.itemtop>div{min-width:0}.item strong{font-size:15px}
.pill{display:inline-block;font-size:11px;font-weight:750;background:var(--lav);border-radius:9px;padding:4px 7px;margin:4px 3px 0 0}.pill.green{background:var(--sage)}.pill.gold{background:var(--cream)}.pill.pink{background:var(--pinklight)}
.field{margin:11px 0}.field label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1.5px solid #e8dce4;border-radius:13px;background:white;color:var(--ink);padding:12px;font-size:16px}
.field textarea{min-height:75px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.empty{text-align:center;padding:20px 8px;color:var(--muted);font-size:14px}
.notice{padding:12px;background:#fff5dd;border-radius:13px;font-size:12px;line-height:1.5;margin:10px 0}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nav button{min-width:0;border:0;background:transparent;border-radius:13px;padding:6px 0;color:#887987;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button span{font-size:22px}.nav button.active{background:#fff0f5;color:#a25276;font-weight:800}
.modalback{display:none;position:fixed;inset:0;z-index:60;background:#34263177;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:700px;max-height:92dvh;overflow:auto;background:#fffafd;border-radius:26px 26px 0 0;padding:17px 15px calc(22px + env(safe-area-inset-bottom))}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.close{border:0;border-radius:50%;width:39px;height:39px;background:#f8e7ef;color:#995675;font-size:24px}
#toast{position:fixed;z-index:100;left:15px;right:15px;bottom:95px;padding:13px 16px;border-radius:14px;background:#51414f;color:white;display:none;box-shadow:0 5px 25px #0002;font-size:14px}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{max-width:850px;left:50%;right:auto;transform:translateX(-50%);width:100%;border-radius:18px 18px 0 0}.modalback{align-items:center;padding:20px}.modal{border-radius:25px;max-height:88dvh}}
@media(max-width:360px){.banner{height:115px}.profile{width:53px;height:53px}.brand h1{font-size:21px}.app{padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="profile" id="profileBox"><span>✨</span><button onclick="document.getElementById('profileFile').click()">✎</button></div>
 <div class="brand"><h1>Pure Shine</h1><small>Cleaning Manager · Business planner</small></div>
 <button class="topbtn" onclick="addMenu()">＋</button>
</header>
<div class="banner" id="bannerBox"><div class="emptybanner">✨</div><button class="banneredit" onclick="document.getElementById('bannerFile').click()">📷 Schimbă bannerul</button></div>
<input id="profileFile" type="file" accept="image/*" hidden onchange="saveImage(event,'profile')">
<input id="bannerFile" type="file" accept="image/*" hidden onchange="saveImage(event,'banner')">
<div id="view"></div>
</main>
<nav class="nav">
<button data-page="home" onclick="go('home')"><span>⌂</span>Acasă</button>
<button data-page="schedule" onclick="go('schedule')"><span>▦</span>Calendar</button>
<button data-page="clients" onclick="go('clients')"><span>♙</span>Clienți</button>
<button data-page="money" onclick="go('money')"><span>£</span>Financiar</button>
<button data-page="more" onclick="go('more')"><span>☷</span>Mai mult</button>
</nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div>
<div id="toast"></div>
<input id="importFile" type="file" accept=".json,application/json" hidden onchange="importBackup(event)">
<script>
'use strict';
const DBNAME='PureShineManagerDB',STORE='app',RECORD='main';
const DAY={'Luni':1,'Marți':2,'Miercuri':3,'Joi':4,'Vineri':5,'Sâmbătă':6,'Duminică':0};
const $=id=>document.getElementById(id);
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now()+Math.floor(Math.random()*9999);
const initial=()=>({version:6,settings:{zoom:100,businessName:'Pure Shine Cleaning',phone:'',email:'',address:'',invoicePrefix:'PSC',invoiceNext:1},clients:[],jobs:[],invoices:[],payments:[],expenses:[],holidays:[],history:[],images:{},activeTimer:null});
let db=initial(),page='home',selectedDate=today(),mode='week',search='';
let idb=null;
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('IndexedDB unavailable'));return}let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>{idb=r.result;resolve(idb)};r.onerror=()=>reject(r.error)})}
function idbGet(){return new Promise((resolve,reject)=>{let r=idb.transaction(STORE,'readonly').objectStore(STORE).get(RECORD);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function idbPut(value){return new Promise((resolve,reject)=>{let tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,RECORD);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function persist(){
 try{if(idb){await idbPut(db);return true}
 localStorage.setItem('pureShineManager_v6',JSON.stringify(db));return true
 }catch(e){toast('Salvarea a eșuat. Descarcă un backup și verifică spațiul disponibil.');return false}
}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3200)}
function history(action,details=''){db.history.unshift({id:uid(),at:new Date().toISOString(),action,details});db.history=db.history.slice(0,250)}
async function save(action,details=''){history(action,details);return persist()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cash(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0)}
function dateObj(s){return new Date((s||today())+'T12:00:00')}
function dateText(s){return s?dateObj(s).toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):''}
function minutes(s){if(!s||!s.includes(':'))return 0;let [h,m]=s.split(':').map(Number);return h*60+m}
function hours(a,b){let n=minutes(b)-minutes(a);if(n<0)n+=1440;return Math.max(0,n)/60}
function durationText(h){let n=Math.round((Number(h)||0)*60);return `${Math.floor(n/60)} h ${n%60} min`}
function getClient(id){return db.clients.find(c=>String(c.id)===String(id))}
function byId(id){return db.jobs.find(j=>String(j.id)===String(id))}
function jobHours(j){return Number.isFinite(j.actualMinutes)?j.actualMinutes/60:hours(j.start,j.end)}
function doneJobs(){return db.jobs.filter(j=>j.status==='Finalizat')}
function revenue(){return doneJobs().reduce((s,j)=>s+(Number(j.price)||0),0)}
function totalExpenses(){return db.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0)}
function paid(inv){return db.payments.filter(p=>String(p.invoiceId)===String(inv.id)).reduce((s,p)=>s+Number(p.amount||0),0)}
function balance(inv){return Math.max(0,Number(inv.total||0)-paid(inv))}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'')}
const presets=[
 ['Lottie','Agency',16,'Săptămânal','Luni','13:00','15:00'],
 ['Christine','Private',18,'La 2 săptămâni','Marți','09:30','12:30'],
 ['Matt','Agency',16,'Săptămânal','Marți','09:00','13:00'],
 ['Sonia','Agency',16,'Săptămânal','Miercuri','09:00','14:00'],
 ['Laura','Private',18,'Săptămânal','Joi','09:00','13:00'],
 ['Hannah','Agency',16,'Săptămânal','Joi','13:00','16:00'],
 ['Meghan','Private',null,'Ocazional','Nesetată','',''],
 ['Johanna','Private',null,'La 2 săptămâni','Vineri','',''],
 ['Sindu','Agency',16,'La 2 săptămâni','Vineri','',''],
 ['Peter','Private',null,'Ocazional','Nesetată','',''],
 ['Mike','Private',null,'La 3 săptămâni','Nesetată','','']
];
function seedClients(){
 for(const p of presets){
  let c=db.clients.find(x=>norm(x.name)===norm(p[0])||(p[0]==='Johanna'&&norm(x.name)==='joanna'));
  if(!c)db.clients.push({id:uid(),name:p[0],type:p[1],rate:p[2],frequency:p[3],day:p[4],start:p[5],end:p[6],phone:'',address:'',notes:'',archived:false,week:p[0]==='Sindu'?'B':'A',anchorWeek:'2026-10-05',anchorDate:p[0]==='Christine'?'2026-10-13':'',schedulePresetVersion:1});
 }
 const g=db.clients.find(c=>norm(c.name)==='gill');if(g)g.archived=true;
}
function occurs(c,date){
 if(c.archived||!c.day||!DAY.hasOwnProperty(c.day)||!c.start||!c.end||dateObj(date).getDay()!==DAY[c.day])return false;
 if(c.frequency==='Ocazional')return false;
 if(c.frequency==='La 2 săptămâni'){
  if(c.anchorDate){let n=Math.round((dateObj(date)-dateObj(c.anchorDate))/86400000);return n>=0&&n%14===0}
  let a=dateObj(c.anchorWeek||'2026-10-05'),b=dateObj(date);a.setDate(a.getDate()-((a.getDay()+6)%7));b.setDate(b.getDate()-((b.getDay()+6)%7));
  return ((Math.round((b-a)/604800000)%2)+2)%2===(c.week==='B'?1:0);
 }
 if(c.frequency==='La 3 săptămâni'){let n=Math.round((dateObj(date)-dateObj(c.anchorDate||date))/86400000);return n>=0&&n%21===0}
 return c.frequency==='Săptămânal';
}
function generate(){
 let changed=false;
 for(let i=0;i<35;i++){
  let d=dateObj(today());d.setDate(d.getDate()+i);let date=d.toISOString().slice(0,10);
  for(let c of db.clients){
   if(!occurs(c,date))continue;
   if(db.holidays.some(h=>String(h.clientId)===String(c.id)&&date>=h.from&&date<=h.to))continue;
   if(db.jobs.some(j=>String(j.clientId)===String(c.id)&&j.date===date))continue;
   let rate=Number(c.rate)||0;
   db.jobs.push({id:uid(),clientId:c.id,date,start:c.start,end:c.end,rate,price:Math.round(hours(c.start,c.end)*rate*100)/100,status:'Programat',notes:'',autoGenerated:true});changed=true;
  }
 }
 if(changed)db.jobs.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 return changed;
}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='home')home();else if(page==='schedule')schedule();else if(page==='clients')clients();else if(page==='money')money();else more();
 renderImages();
}
function set(html){$('view').innerHTML=html}
function go(p){page=p;render()}
function renderImages(){
 for(const key of ['profile','banner']){
  const box=$(key==='profile'?'profileBox':'bannerBox'),data=db.images?.[key];
  if(key==='profile'){
   box.innerHTML=data?`<img src="${data}" alt="Poză de profil"><button onclick="document.getElementById('profileFile').click()">✎</button>`:`<span style="font-size:28px">✨</span><button onclick="document.getElementById('profileFile').click()">✎</button>`;
  }else{
   box.innerHTML=data?`<img src="${data}" alt="Banner Pure Shine"><button class="banneredit" onclick="document.getElementById('bannerFile').click()">📷 Schimbă bannerul</button>`:`<div class="emptybanner">✨</div><button class="banneredit" onclick="document.getElementById('bannerFile').click()">📷 Adaugă banner</button>`;
  }
 }
}
function home(){
 let jobs=db.jobs.filter(j=>j.date===today()&&j.status!=='Anulat').sort((a,b)=>a.start.localeCompare(b.start));
 let future=db.jobs.filter(j=>j.date>today()&&j.status==='Programat').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,3);
 set(`<section class="hero"><div class="muted">${dateText(today())}</div><h2>Bună! ✨</h2><p class="muted">Organizează-ți ziua și urmărește fiecare lucrare.</p><div class="btnrow"><button class="btn primary" onclick="jobForm()">＋ Adaugă job</button><button class="btn" onclick="clientForm()">＋ Client nou</button></div></section>
 <div class="stats"><div class="stat"><span>Venit realizat</span><strong>${cash(revenue())}</strong></div><div class="stat"><span>Cheltuieli</span><strong>${cash(totalExpenses())}</strong></div><div class="stat"><span>Facturi restante</span><strong>${cash(db.invoices.reduce((s,i)=>s+balance(i),0))}</strong></div><div class="stat"><span>Ore finalizate</span><strong>${durationText(doneJobs().reduce((s,j)=>s+jobHours(j),0))}</strong></div></div>
 ${db.activeTimer?`<div class="card"><h3>⏱ Timer activ · ${esc(getClient(db.activeTimer.clientId)?.name||'Client')}</h3><strong id="timerDisplay" style="font-size:24px">${timerElapsed()}</strong><div class="btnrow"><button class="btn primary" onclick="stopTimer()">Finalizează</button><button class="btn" onclick="pauseTimer()">${db.activeTimer.pausedAt?'Continuă':'Pauză'}</button></div></div>`:''}
 <div class="sectionhead"><h2>Programul de azi</h2><button class="btn small soft" onclick="go('schedule')">Calendar →</button></div><div class="card">${jobs.length?jobs.map(jobCard).join(''):'<div class="empty">🌸 Nu ai joburi programate astăzi.</div>'}</div>
 <div class="sectionhead"><h2>Urmează</h2></div><div class="card">${future.length?future.map(jobCard).join(''):'<div class="empty">Nu există alte programări.</div>'}</div>`);
 if(db.activeTimer)tick();
}
function jobCard(j){
 let c=getClient(j.clientId);
 return `<div class="item"><div class="itemtop"><div><strong>${esc(c?.name||'Client')}</strong><div class="muted">${dateText(j.date)} · ${esc(j.start)}–${esc(j.end)} · ${durationText(jobHours(j))}</div><span class="pill ${j.status==='Finalizat'?'green':j.status==='Anulat'?'pink':'gold'}">${esc(j.status)}</span></div><strong>${cash(j.price)}</strong></div><div class="btnrow"><button class="btn small soft" onclick="jobForm(${j.id})">Editează</button>${j.status==='Programat'?`<button class="btn small" onclick="startTimer(${j.id})">▶ Timer</button><button class="btn small" onclick="finishJob(${j.id})">Finalizează</button>`:''}<button class="btn small danger" onclick="deleteJob(${j.id})">Șterge</button></div></div>`;
}
function monday(s){let d=dateObj(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)}
function shiftDate(s,n){let d=dateObj(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function schedule(){
 let dates=Array.from({length:7},(_,i)=>shiftDate(monday(selectedDate),i));
 let list=db.jobs.filter(j=>mode==='all'||(mode==='day'?j.date===selectedDate:dates.includes(j.date))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 set(`<div class="sectionhead"><h2>Calendar</h2><button class="btn primary" onclick="jobForm()">＋ Job</button></div><div class="card"><div class="grid2"><div class="field"><label>Data</label><input type="date" value="${selectedDate}" onchange="selectedDate=this.value;schedule()"></div><div class="field"><label>Vizualizare</label><select onchange="mode=this.value;schedule()"><option value="week" ${mode==='week'?'selected':''}>Săptămână</option><option value="day" ${mode==='day'?'selected':''}>O zi</option><option value="all" ${mode==='all'?'selected':''}>Toate joburile</option></select></div></div><div class="btnrow"><button class="btn small" onclick="selectedDate=shiftDate(selectedDate,-7);schedule()">← Anterior</button><button class="btn small" onclick="selectedDate=today();schedule()">Astăzi</button><button class="btn small" onclick="selectedDate=shiftDate(selectedDate,7);schedule()">Următor →</button></div></div><div class="card">${list.length?list.map(jobCard).join(''):'<div class="empty">Nu există programări în această perioadă.</div>'}</div>
 <div class="sectionhead"><h2>Vacanțe clienți</h2><button class="btn small" onclick="holidayForm()">＋ Vacanță</button></div><div class="card">${db.holidays.map(h=>`<div class="item"><strong>${esc(getClient(h.clientId)?.name||'Client')}</strong><div class="muted">${dateText(h.from)} – ${dateText(h.to)}</div><button class="btn small danger" onclick="deleteHoliday(${h.id})">Șterge</button></div>`).join('')||'<div class="empty">Nicio vacanță introdusă.</div>'}</div>`);
}
function clients(){
 let list=db.clients.filter(c=>!c.archived&&(c.name+' '+c.phone+' '+c.address).toLowerCase().includes(search.toLowerCase()));
 set(`<div class="sectionhead"><h2>Clienți</h2><button class="btn primary" onclick="clientForm()">＋ Client</button></div><div class="field"><input placeholder="Caută client..." value="${esc(search)}" oninput="search=this.value;clients()"></div><div class="card">${list.map(c=>`<div class="item"><div class="itemtop"><div><strong>${esc(c.name)}</strong><div><span class="pill ${c.type==='Agency'?'green':'pink'}">${c.type==='Agency'?'Agenție':'Privat'}</span><span class="pill">${esc(c.frequency)}</span></div><div class="muted">${esc(c.day)} · ${esc(c.start||'--:--')}–${esc(c.end||'--:--')}</div><div class="muted">${c.rate==null?'Tarif necompletat':cash(c.rate)+'/oră'} ${c.phone?' · '+esc(c.phone):''}</div>${c.address?`<div class="muted">📍 ${esc(c.address)}</div>`:''}</div></div><div class="btnrow"><button class="btn small soft" onclick="clientForm(${c.id})">Editează</button><button class="btn small" onclick="jobForm(null,${c.id})">＋ Job</button><button class="btn small" onclick="holidayForm(${c.id})">🏖️ Vacanță</button>${c.address?`<button class="btn small" onclick="route(${c.id})">Hartă</button>`:''}<button class="btn small danger" onclick="archiveClient(${c.id})">Arhivează</button></div></div>`).join('')||'<div class="empty">Nu există clienți.</div>'}</div>`);
}
function money(){

async function saveClient(e,id){
 e.preventDefault();let f=new FormData(e.target),old=id?getClient(id):null;
 let c={...(old||{}),id:old?.id||uid(),name:f.get('name').trim(),phone:f.get('phone'),rate:f.get('rate')===''?null:Number(f.get('rate')),address:f.get('address'),type:f.get('type'),frequency:f.get('frequency'),day:f.get('day'),week:f.get('week'),start:f.get('start'),end:f.get('end'),notes:f.get('notes'),archived:false};
 if(c.frequency==='La 2 săptămâni'&&!c.anchorDate&&!c.anchorWeek)c.anchorWeek=today();
 if(c.frequency==='La 3 săptămâni'&&!c.anchorDate)c.anchorDate=today();
 if(old){
  let changed=['day','start','end','rate','frequency','week'].some(k=>old[k]!==c[k]);Object.assign(old,c);
  if(changed)db.jobs=db.jobs.filter(j=>!(j.autoGenerated&&j.status==='Programat'&&j.date>=today()&&String(j.clientId)===String(old.id)));
 }else db.clients.push(c);
 generate();await save(old?'Client actualizat':'Client adăugat');closeModal();render();
}

}
async function saveJob(e,id){
 e.preventDefault();let f=new FormData(e.target),old=id?byId(id):null,start=f.get('start'),end=f.get('end'),rate=Number(f.get('rate')),h=hours(start,end);
 if(h<=0){toast('Verifică orele introduse.');return}
 let j={...(old||{}),id:old?.id||uid(),clientId:f.get('clientId'),date:f.get('date'),start,end,rate,price:Math.round(h*rate*100)/100,status:f.get('status'),notes:f.get('notes'),autoGenerated:false};
 if(old)Object.assign(old,j);else db.jobs.push(j);
 await save(old?'Job actualizat':'Job adăugat');generate();await persist();closeModal();render();
}
async function deleteJob(id){if(!confirm('Ștergi acest job?'))return;db.jobs=db.jobs.filter(j=>String(j.id)!==String(id));await save('Job șters');render()}
async function finishJob(id){
 let j=byId(id);if(!j)return;let raw=prompt('Durata reală în minute:',String(Math.round(hours(j.start,j.end)*60)));
 if(raw===null)return;let n=Number(raw);if(!Number.isFinite(n)||n<=0){toast('Introdu durata în minute.');return}
 j.actualMinutes=Math.round(n);j.price=Math.round(n/60*Number(j.rate)*100)/100;j.status='Finalizat';await save('Job finalizat',getClient(j.clientId)?.name||'');render();
}
async function startTimer(id){let j=byId(id);if(!j)return;if(db.activeTimer&&!confirm('Înlocuiești timerul activ?'))return;db.activeTimer={jobId:j.id,clientId:j.clientId,startedAt:Date.now(),pausedAt:null,pausedMs:0};await save('Timer pornit');render()}
function timerElapsed(){let t=db.activeTimer;if(!t)return '00:00:00';let end=t.pausedAt||Date.now(),s=Math.max(0,Math.floor((end-t.startedAt-(t.pausedMs||0))/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function tick(){if(!db.activeTimer||page!=='home')return;let el=$('timerDisplay');if(el)el.textContent=timerElapsed();setTimeout(tick,1000)}
async function pauseTimer(){let t=db.activeTimer;if(!t)return;if(t.pausedAt){t.pausedMs+=(Date.now()-t.pausedAt);t.pausedAt=null}else t.pausedAt=Date.now();await save('Timer actualizat');render()}
async function stopTimer(){let t=db.activeTimer;if(!t)return;let j=byId(t.jobId);if(j){let n=Math.max(1,Math.round(((t.pausedAt||Date.now())-t.startedAt-(t.pausedMs||0))/60000));j.actualMinutes=n;j.price=Math.round(n/60*Number(j.rate)*100)/100;j.status='Finalizat'}db.activeTimer=null;await save('Job finalizat din timer');render()}

function invoiceForm(){showModal(`<div class="modalhead"><h2>Factură nouă</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveInvoice(event)"><div class="field"><label>Client</label><select name="clientId" required>${db.clients.filter(c=>!c.archived).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Data</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Scadență</label><input type="date" name="due" value="${today()}" required></div></div><div class="field"><label>Total £</label><input type="number" name="total" min=".01" step=".01" required></div><div class="field"><label>Descriere</label><input name="description" value="Cleaning services"></div><button class="btn primary wide">Creează factura</button></form>`)}
async function saveInvoice(e){e.preventDefault();let f=new FormData(e.target),c=getClient(f.get('clientId'));db.invoices.push({id:uid(),number:`${db.settings.invoicePrefix}-${String(db.settings.invoiceNext++).padStart(4,'0')}`,clientId:c.id,clientName:c.name,date:f.get('date'),due:f.get('due'),total:Number(f.get('total')),description:f.get('description')});await save('Factură creată');closeModal();render()}
function printInvoice(id){let i=db.invoices.find(x=>String(x.id)===String(id));if(!i)return;let c=getClient(i.clientId),w=window.open('','_blank');if(!w){toast('Permite ferestrele pop-up pentru PDF.');return}w.document.write(`<!doctype html><html><meta charset="utf-8"><title>${esc(i.number)}</title><style>body{font:16px Arial;margin:40px;color:#463844}h1{color:#b56d8b}.total{font-size:25px;font-weight:bold}</style><body><h1>${esc(db.settings.businessName)}</h1><p>${esc(db.settings.address)}<br>${esc(db.settings.phone)} · ${esc(db.settings.email)}</p><hr><h2>INVOICE ${esc(i.number)}</h2><p>Client: ${esc(c?.name||i.clientName)}<br>Date: ${esc(i.date)}<br>Due: ${esc(i.due)}</p><p>${esc(i.description)}</p><p class="total">Total: ${cash(i.total)}</p><p>Paid: ${cash(paid(i))}<br>Balance: ${cash(balance(i))}</p><script>onload=()=>setTimeout(()=>print(),200)<\/script></body></html>`);w.document.close()}
function paymentForm(id){let i=db.invoices.find(x=>String(x.id)===String(id));if(!i)return;showModal(`<div class="modalhead"><h2>Înregistrează plata</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">Restant: ${cash(balance(i))}</div><form onsubmit="savePayment(event,${i.id})"><div class="field"><label>Sumă £</label><input type="number" name="amount" min=".01" max="${balance(i)}" step=".01" required></div><div class="grid2"><div class="field"><label>Data</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>Metodă</label><select name="method"><option>Bank transfer</option><option>Cash</option><option>Card</option><option>Other</option></select></div></div><button class="btn primary wide">Salvează plata</button></form>`)}
async function savePayment(e,id){e.preventDefault();let f=new FormData(e.target),i=db.invoices.find(x=>String(x.id)===String(id)),amount=Number(f.get('amount'));if(!i||amount<=0||amount>balance(i)+.001){toast('Verifică suma.');return}db.payments.push({id:uid(),invoiceId:i.id,amount,date:f.get('date'),method:f.get('method')});await save('Plată înregistrată');closeModal();render()}

async function saveExpense(e){e.preventDefault();let f=new FormData(e.target);db.expenses.push({id:uid(),date:f.get('date'),amount:Number(f.get('amount')),category:f.get('category'),note:f.get('note')});await save('Cheltuială adăugată');closeModal();render()}
async function deleteExpense(id){if(!confirm('Ștergi cheltuiala?'))return;db.expenses=db.expenses.filter(e=>String(e.id)!==String(id));await save('Cheltuială ștearsă');render()}

function forecast(){let upcoming=db.jobs.filter(j=>j.date>=today()&&j.status==='Programat');showModal(`<div class="modalhead"><h2>Previziuni</h2><button class="close" onclick="closeModal()">×</button></div><div class="stats"><div class="stat"><span>Programări viitoare</span><strong>${upcoming.length}</strong></div><div class="stat"><span>Venit estimat</span><strong>${cash(upcoming.reduce((s,j)=>s+j.price,0))}</strong></div></div>`)}

async function saveSettings(e){e.preventDefault();let f=new FormData(e.target);for(let k of ['businessName','phone','email','address','invoicePrefix'])db.settings[k]=f.get(k);db.settings.zoom=Number(f.get('zoom'));document.documentElement.style.fontSize=(16*db.settings.zoom/100)+'px';await save('Setări actualizate');closeModal();render()}
async function saveImage(e,key){
 const file=e.target.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/')){toast('Alege un fișier imagine.');return}
 try{
  const resized=await resizeImage(file,key==='banner'?1400:600,key==='banner'?450:600);
  db.images[key]=resized;
  const ok=await persist();
  if(ok){renderImages();toast(key==='banner'?'Banner salvat.':'Poza de profil salvată.')}
 }catch(err){toast('Nu am putut salva imaginea. Încearcă o imagine mai mică.')}
 e.target.value='';
}
function resizeImage(file,maxW,maxH){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.78))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('invalid image'))};img.src=url})}
async function backup(){await persist();let blob=new Blob([JSON.stringify(db)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`pure-shine-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(e){let file=e.target.files?.[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x||!Array.isArray(x.clients)||!Array.isArray(x.jobs))throw Error();if(!confirm('Backupul va înlocui datele actuale. Continui?'))return;db={...initial(),...x,settings:{...initial().settings,...x.settings},images:x.images||{}};generate();await persist();toast('Backup restaurat.');render()}catch(err){toast('Fișierul nu este un backup valid.')}finally{e.target.value=''}}
function csv(type){let rows=[];if(type==='jobs')rows=[['Date','Client','Start','End','Minutes','Rate','Price','Status'],...db.jobs.map(j=>[j.date,getClient(j.clientId)?.name,j.start,j.end,Math.round(jobHours(j)*60),j.rate,j.price,j.status])];if(type==='clients')rows=[['Name','Phone','Address','Type','Rate','Frequency','Day'],...db.clients.map(c=>[c.name,c.phone,c.address,c.type,c.rate,c.frequency,c.day])];if(type==='invoices')rows=[['Number','Client','Date','Due','Total','Paid','Balance'],...db.invoices.map(i=>[i.number,getClient(i.clientId)?.name||i.clientName,i.date,i.due,i.total,paid(i),balance(i)])];let content=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`pure-shine-${type}-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(type){csv(type)}
async function boot(){
 try{
  await openDB();let saved=await idbGet();
  if(saved)db={...initial(),...saved,settings:{...initial().settings,...saved.settings},images:saved.images||{}};
  else{
   let old=null;try{old=JSON.parse(localStorage.getItem('pureShineManager_v5')||localStorage.getItem('pureShineManager_v4')||'null')}catch(e){}
   if(old)db={...initial(),...old,settings:{...initial().settings,...old.settings},images:old.images||{}};
   else{try{let legacy=JSON.parse(localStorage.getItem('pureShineManager')||'null');if(legacy)db={...initial(),...legacy,settings:{...initial().settings,...legacy.settings}}}catch(e){}}
  }
 }catch(e){
  try{let saved=JSON.parse(localStorage.getItem('pureShineManager_v6')||'null');if(saved)db={...initial(),...saved,settings:{...initial().settings,...saved.settings}}}catch(err){}
 }
 seedClients();generate();
 try{await persist()}catch(e){}
 document.documentElement.style.fontSize=(16*(db.settings.zoom||100)/100)+'px';
 render();
}
boot();
window.addEventListener('pageshow',()=>{if(db.activeTimer&&page==='home')tick()});
