<style>
/* FINAL FIXES — add immediately before </body> */

.hero{
  height:auto!important;
  min-height:0!important;
  background:transparent!important;
  box-shadow:none!important;
  overflow:hidden!important;
}
.hero img{
  width:100%!important;
  height:auto!important;
  object-fit:contain!important;
  object-position:center!important;
  display:block!important;
}
.hero-overlay,.hero-content{display:none!important}

/* Large App Size: keep the whole interface inside the phone. */
.brand{min-width:0;flex:1 1 auto}
.brand-title{min-width:0;flex:1 1 auto}
.brand-name{
  white-space:normal!important;
  overflow:visible!important;
  word-break:normal!important;
  overflow-wrap:normal!important;
  font-size:min(calc(37px * var(--ui)),7.2vw)!important;
  line-height:.95!important;
}
.brand-subtitle{
  white-space:nowrap;
  font-size:min(calc(12px * var(--ui)),3vw)!important;
}
.header-actions{flex:0 0 auto}

@media(max-width:450px){
  .brand-name{
    font-size:min(calc(31px * var(--ui)),6.8vw)!important
  }
  .brand-subtitle{
    font-size:min(calc(10px * var(--ui)),2.6vw)!important
  }
}

/* Direct client controls. */
.client-card-actions{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
  margin-top:9px;
}

.client-direct-btn{
  min-height:40px;
  padding:7px 9px;
  border-radius:13px;
  background:#fff0f6;
  color:var(--accent-dark);
  font-weight:900;
  font-size:12px;
}

.client-direct-btn.start{
  background:var(--accent);
  color:#fff
}

.client-direct-btn.delete{
  background:#fde5e8;
  color:#ad3e4e
}

/* Real-time timer calculation. */
.timer-live-info{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:7px 15px;
  margin:-10px 0 18px;
  color:var(--muted);
  font-size:calc(12px * var(--ui));
  font-weight:800;
  text-align:center;
}

.timer-live-info strong{
  color:var(--accent-dark)
}

.timer-live-money{
  color:var(--accent-dark)!important;
  font-size:calc(15px * var(--ui))
}

/* Exact hours + minutes editor. */
.exact-time-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.exact-amount{
  margin-top:12px;
  padding:15px;
  border-radius:18px;
  background:#f8edf4;
  border:1px solid #ecd5e0
}

.exact-amount-label{
  font-size:11px;
  color:var(--muted)
}

.exact-amount-value{
  font-size:25px;
  font-weight:900;
  color:var(--accent-dark);
  margin-top:4px
}

.exact-amount-time{
  font-size:12px;
  color:var(--muted);
  margin-top:3px
}
</style>

<script>
/* FINAL JS FIXES */

/* Settings Save -> Home */
function saveSettings(){
  state.settings.businessName=
    document.getElementById("settingBusinessName").value.trim() ||
    "Pure Shine Cleaning";

  state.settings.ownerName=
    document.getElementById("settingOwnerName").value.trim() ||
    "Georgiana";

  state.settings.privateRate=
    Number(
      document.getElementById("settingPrivateRate").value
    ) || 18;

  state.settings.agencyRate=
    Number(
      document.getElementById("settingAgencyRate").value
    ) || 16;

  state.settings.reminderTime=
    document.getElementById("settingReminderTime").value ||
    "20:00";

  state.settings.reminderStyle=
    document.getElementById("settingReminderStyle").value;

  state.settings.invoiceNumber=
    Math.max(
      1,
      Number(
        document.getElementById("settingInvoiceNumber").value
      ) || 1001
    );

  state.settings.zoom=
    Number(
      document.getElementById("settingZoom").value
    ) || 100;

  state.settings.accent=
    document.getElementById("settingAccent").value ||
    "#e72f78";

  saveState();
  applySettings();
  renderAll();

  /* After pressing Save All Settings, always return to Home. */
  openPage("home");

  toast("All settings saved ✨");
}


/* Banner stays image-only and keeps the uploaded image ratio. */
function applyBranding(){

  const logo=
    state.settings.logo ||
    DEFAULT_LOGO;

  const banner=
    state.settings.banner ||
    DEFAULT_BANNER;

  document.getElementById("headerLogo").src=logo;
  document.getElementById("homeBanner").src=banner;
  document.getElementById("logoPreview").src=logo;
  document.getElementById("bannerPreview").src=banner;
}


/* Clients:
   Start / Edit / Delete are visible directly on every client card. */
function renderClients(){

  let clients=
    state.clients.filter(
      c=>c.active!==false
    );

  const filter=
    state.ui.clientFilter || "all";

  if(filter==="private"){
    clients=
      clients.filter(
        c=>c.type==="private"
      );
  }

  if(filter==="agency"){
    clients=
      clients.filter(
        c=>c.type==="agency"
      );
  }

  if(filter==="fortnightly"){
    clients=
      clients.filter(
        c=>c.frequency==="fortnightly"
      );
  }

  const el=
    document.getElementById("clientList");

  if(!clients.length){

    el.innerHTML=
      `<div class="empty">
        No clients found.
      </div>`;

    return;
  }

  el.innerHTML=
    clients.map(c=>`

      <div class="client-card">

        <div class="client-avatar">
          ${initials(c.name)}
        </div>

        <div class="client-info">

          <div class="client-name">
            ${escapeHTML(c.name)}
          </div>

          <div class="client-meta">

            ${escapeHTML(
              c.phone || "No phone"
            )}

            <br>

            ${dayName(c.day)}
            • ${escapeHTML(c.start || "")}
            • ${hoursText(c.duration)}

            ${c.flexible
              ? " • Flexible"
              : ""}

            ${c.frequency==="fortnightly"
              ? " • Fortnightly"
              : ""}

            • ${money(getRate(c))}/hr

          </div>

        </div>

        <div class="client-card-actions">

          <button
            class="client-direct-btn start"
            onclick="startClientDirect('${c.id}')">
            ▶ Start
          </button>

          <button
            class="client-direct-btn"
            onclick="openClientModal('${c.id}')">
            ✏️ Edit
          </button>

          <button
            class="client-direct-btn delete"
            onclick="deleteClientDirect('${c.id}')">
            🗑 Delete
          </button>

        </div>

      </div>

    `).join("");
}


function startClientDirect(id){

  const client=
    getClient(id);

  if(!client)return;

  if(
    state.timer.active &&
    state.timer.clientId!==id
  ){

    if(
      !confirm(
        "A timer is already running. Replace the current client?"
      )
    ){
      return;
    }

    resetTimer();
  }

  state.timer.clientId=id;
  state.timer.active=true;
  state.timer.paused=false;
  state.timer.startedAt=Date.now();
  state.timer.elapsedBefore=0;

  saveState();
  startTimerLoop();

  openPage("home");

  renderTimer();

  toast(
    `${client.name} timer started ✨`
  );
}


function deleteClientDirect(id){

  const client=
    getClient(id);

  if(!client)return;

  if(
    !confirm(
      `Remove ${client.name} from your client list? Past completed jobs will stay saved.`
    )
  ){
    return;
  }

  client.active=false;

  saveState();
  renderAll();

  toast(
    `${client.name} removed.`
  );
}


/* ============================================================
   REAL-TIME TIMER
   Exact time + exact earnings
   ============================================================ */

function timerElapsed(){

  const t=
    state.timer;

  if(!t.active){
    return Number(
      t.elapsedBefore || 0
    );
  }

  if(t.paused){
    return Number(
      t.elapsedBefore || 0
    );
  }

  if(!t.startedAt){
    return Number(
      t.elapsedBefore || 0
    );
  }

  return Number(
    t.elapsedBefore || 0
  ) +
  Math.max(
    0,
    Date.now() -
    Number(t.startedAt)
  ) / 1000;
}


function exactTimeText(seconds){

  const totalMinutes=
    Math.floor(
      Math.max(
        0,
        Number(seconds || 0)
      ) / 60
    );

  const h=
    Math.floor(
      totalMinutes / 60
    );

  const m=
    totalMinutes % 60;

  return `${h}h ${m}m`;
}


function timerMoney(){

  const client=
    getClient(
      state.timer.clientId
    );

  return client
    ? timerElapsed() /
      3600 *
      getRate(client)
    : 0;
}


function renderTimer(){

  const t=
    state.timer;

  const client=
    getClient(t.clientId);

  const elapsed=
    timerElapsed();

  document.getElementById(
    "timerClientName"
  ).textContent=
    client
      ? client.name
      : "No active job";

  document.getElementById(
    "timerDisplay"
  ).textContent=
    secondsText(elapsed);

  document.getElementById(
    "timerStatus"
  ).textContent=
    t.active && !t.paused
      ? "🟢"
      : "⏸️";


  /*
    Add the live calculation underneath
    the big timer.
  */

  let info=
    document.getElementById(
      "timerLiveInfo"
    );

  const display=
    document.getElementById(
      "timerDisplay"
    );

  if(!info){

    info=
      document.createElement(
        "div"
      );

    info.id=
      "timerLiveInfo";

    info.className=
      "timer-live-info";

    display.insertAdjacentElement(
      "afterend",
      info
    );
  }


  if(
    client &&
    t.active
  ){

    info.innerHTML=`

      <span>
        Time:
        <strong>
          ${exactTimeText(elapsed)}
        </strong>
      </span>

      <span class="timer-live-money">
        Earnings:
        <strong>
          ${money(timerMoney())}
        </strong>
      </span>

    `;

  }else{

    info.innerHTML=`
      <span>
        Exact time and earnings will appear here while the timer runs.
      </span>
    `;
  }


  const btn=
    document.getElementById(
      "timerMainBtn"
    );

  if(
    t.active &&
    !t.paused
  ){

    btn.textContent=
      "⏸ Pause";

  }else if(
    t.active &&
    t.paused
  ){

    btn.textContent=
      "▶ Resume";

  }else{

    btn.textContent=
      "▶ Start";
  }
}


function startTimerLoop(){

  stopTimerLoop();

  timerInterval=
    setInterval(
      ()=>{
        if(!state.timer.active){
          return;
        }

        const elapsed=
          timerElapsed();

        const display=
          document.getElementById(
            "timerDisplay"
          );

        if(display){
          display.textContent=
            secondsText(elapsed);
        }

        const info=
          document.getElementById(
            "timerLiveInfo"
          );

        const client=
          getClient(
            state.timer.clientId
          );

        if(
          info &&
          client
        ){

          info.innerHTML=`

            <span>
              Time:
              <strong>
                ${exactTimeText(elapsed)}
              </strong>
            </span>

            <span class="timer-live-money">
              Earnings:
              <strong>
                ${money(timerMoney())}
              </strong>
            </span>

          `;
        }

      },
      500
    );
}


function stopTimer(){

  if(
    !state.timer.active
  ){

    resetTimer();
    return;
  }

  const elapsed=
    Math.round(
      timerElapsed()
    );

  const client=
    getClient(
      state.timer.clientId
    );

  if(!client){

    resetTimer();
    return;
  }

  if(
    elapsed < 5 &&
    !confirm(
      "The timer has only been running for a few seconds. Stop it anyway?"
    )
  ){
    return;
  }

  const now=
    new Date();

  const hours=
    elapsed / 3600;

  const job={

    id:uid("job"),

    clientId:
      client.id,

    clientName:
      client.name,

    date:
      dateKey(now),

    start:
      timeFromDate(
        new Date(
          Date.now() -
          elapsed * 1000
        )
      ),

    end:
      timeFromDate(now),

    seconds:
      elapsed,

    hours:
      Math.round(
        hours * 100
      ) / 100,

    rate:
      getRate(client),

    amount:
      Math.round(
        hours *
        getRate(client) *
        100
      ) / 100,

    paid:false,

    createdAt:
      now.toISOString(),

    invoiceNumber:null
  };


  state.jobs.unshift(
    job
  );

  resetTimer();

  saveState();

  renderAll();

  toast(
    `${client.name}: ${exactTimeText(elapsed)} • ${money(job.amount)} saved ✓`
  );


  if(
    state.settings.invoiceAfterTimer
  ){

    setTimeout(
      ()=>openInvoice(job.id),
      250
    );
  }
}


/* ============================================================
   COMPLETED JOB EDITOR
   Enter hours and minutes separately.
   Calculation updates immediately.
   ============================================================ */

function openJobEditor(
  jobId,
  dateOverride
){

  const job=
    jobId
      ? state.jobs.find(
          j=>j.id===jobId
        )
      : null;

  if(
    jobId &&
    !job
  ){

    toast(
      "Job not found."
    );

    return;
  }


  const client=
    job
      ? getClient(job.clientId)
      : state.clients.find(
          c=>c.active!==false
        );


  const selectedClientId=
    job
      ? job.clientId
      : client?.id || "";


  const totalMinutes=
    job
      ? Math.round(
          Number(
            job.hours || 0
          ) * 60
        )
      : Math.round(
          Number(
            client?.duration || 2
          ) * 60
        );


  const initialHours=
    Math.floor(
      totalMinutes / 60
    );

  const initialMinutes=
    totalMinutes % 60;


  const rate=
    job
      ? job.rate
      : client
        ? getRate(client)
        : state.settings.privateRate;


  const date=
    job
      ? job.date
      : dateOverride ||
        dateKey(
          new Date()
        );


  openModal(`

    <div class="handle"></div>

    <div class="modal-header">

      <h2>
        ${
          job
            ? "Edit Completed Job"
            : "Add Completed Job"
        }
      </h2>

      <button
        class="modal-close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="form-grid">

      <div class="form-group full">

        <label>
          Client
        </label>

        <select
          id="jobClient"
          class="select"
          onchange="updateJobDefaultsExact()">

          ${
            state.clients
              .filter(
                c=>
                  c.active!==false ||
                  c.id===selectedClientId
              )
              .map(
                c=>`

                <option
                  value="${c.id}"
                  ${
                    c.id===selectedClientId
                      ? "selected"
                      : ""
                  }>

                  ${escapeHTML(c.name)}

                </option>

              `
              )
              .join("")
          }

        </select>

      </div>


      <div class="form-group">

        <label>
          Date
        </label>

        <input
          id="jobDate"
          class="input"
          type="date"
          value="${attr(date)}">

      </div>


      <div class="form-group">

        <label>
          Start time
        </label>

        <input
          id="jobStart"
          class="input"
          type="time"
          value="${attr(
            job?.start ||
            client?.start ||
            "09:00"
          )}">

      </div>


      <div class="form-group full">

        <label>
          Exact time worked
        </label>

        <div class="exact-time-row">

          <input
            id="jobHours"
            class="input"
            type="number"
            min="0"
            step="1"
            value="${initialHours}"
            placeholder="Hours">

          <input
            id="jobMinutes"
            class="input"
            type="number"
            min="0"
            max="59"
            step="1"
            value="${initialMinutes}"
            placeholder="Minutes">

        </div>

      </div>


      <div class="form-group">

        <label>
          Hourly rate
        </label>

        <input
          id="jobRate"
          class="input"
          type="number"
          min="0"
          step=".50"
          value="${rate}">

      </div>


      <div class="form-group full">

        <label>

          <input
            id="jobPaid"
            type="checkbox"
            ${
              job?.paid
                ? "checked"
                : ""
            }>

          Mark this job as
          <strong>PAID</strong>

        </label>

      </div>

    </div>


    <div class="exact-amount">

      <div class="exact-amount-label">
        Real-time calculation
      </div>

      <div
        id="jobAmountPreview"
        class="exact-amount-value">

        ${
          money(
            totalMinutes /
            60 *
            Number(rate)
          )
        }

      </div>

      <div
        id="jobTimePreview"
        class="exact-amount-time">

        ${
          exactTimeText(
            totalMinutes * 60
          )
        }

      </div>

    </div>


    <div class="modal-footer">

      ${
        job
          ? `
            <button
              class="danger-btn"
              onclick="deleteJob('${job.id}')">

              Delete

            </button>
          `
          : ""
      }


      <button
        class="primary-btn"
        onclick="
          saveCompletedJobExact(
            ${
              job
                ? `'${job.id}'`
                : "null"
            }
          )
        ">

        ${
          job
            ? "Save Changes"
            : "Save Job"
        }

      </button>

    </div>

  `);


  [
    "jobHours",
    "jobMinutes",
    "jobRate"
  ].forEach(
    id=>
      document
        .getElementById(id)
        .addEventListener(
          "input",
          updateJobAmountPreview
        )
  );
}


function getEditorMinutes(){

  const h=
    Math.max(
      0,
      Number(
        document.getElementById(
          "jobHours"
        )?.value || 0
      )
    );

  const m=
    Math.min(
      59,
      Math.max(
        0,
        Number(
          document.getElementById(
            "jobMinutes"
          )?.value || 0
        )
      )
    );

  return Math.round(
    h * 60 + m
  );
}


function updateJobAmountPreview(){

  const minutes=
    getEditorMinutes();

  const rate=
    Math.max(
      0,
      Number(
        document.getElementById(
          "jobRate"
        )?.value || 0
      )
    );

  document.getElementById(
    "jobAmountPreview"
  ).textContent=
    money(
      minutes /
      60 *
      rate
    );

  document.getElementById(
    "jobTimePreview"
  ).textContent=
    exactTimeText(
      minutes * 60
    );
}


function updateJobDefaultsExact(){

  const client=
    getClient(
      document.getElementById(
        "jobClient"
      ).value
    );

  if(!client)return;

  const total=
    Math.round(
      Number(
        client.duration || 2
      ) * 60
    );

  document.getElementById(
    "jobHours"
  ).value=
    Math.floor(
      total / 60
    );

  document.getElementById(
    "jobMinutes"
  ).value=
    total % 60;

  document.getElementById(
    "jobRate"
  ).value=
    getRate(client);

  document.getElementById(
    "jobStart"
  ).value=
    client.start ||
    "09:00";

  updateJobAmountPreview();
}


function saveCompletedJobExact(
  jobId
){

  const client=
    getClient(
      document.getElementById(
        "jobClient"
      ).value
    );

  if(!client){

    toast(
      "Please choose a client."
    );

    return;
  }


  const date=
    document.getElementById(
      "jobDate"
    ).value;

  const minutes=
    getEditorMinutes();

  const rate=
    Number(
      document.getElementById(
        "jobRate"
      ).value || 0
    );

  const start=
    document.getElementById(
      "jobStart"
    ).value;

  const paid=
    document.getElementById(
      "jobPaid"
    ).checked;


  if(!date){

    toast(
      "Please choose a date."
    );

    return;
  }

  if(minutes<=0){

    toast(
      "Please enter the time worked."
    );

    return;
  }

  if(rate<0){

    toast(
      "Please enter a valid rate."
    );

    return;
  }


  const hours=
    minutes / 60;

  const amount=
    Math.round(
      hours *
      rate *
      100
    ) / 100;


  if(jobId){

    const job=
      state.jobs.find(
        j=>j.id===jobId
      );

    if(!job)return;

    job.clientId=
      client.id;

    job.clientName=
      client.name;

    job.date=
      date;

    job.start=
      start;

    job.hours=
      Math.round(
        hours * 100
      ) / 100;

    job.seconds=
      minutes * 60;

    job.rate=
      rate;

    job.amount=
      amount;

    job.paid=
      paid;

    job.editedAt=
      new Date()
        .toISOString();

  }else{

    state.jobs.unshift({

      id:
        uid("job"),

      clientId:
        client.id,

      clientName:
        client.name,

      date,

      start,

      hours:
        Math.round(
          hours * 100
        ) / 100,

      seconds:
        minutes * 60,

      rate,

      amount,

      paid,

      createdAt:
        new Date()
          .toISOString(),

      invoiceNumber:null

    });

  }


  saveState();
  closeModal();
  renderAll();

  toast(
    jobId
      ? "Job updated successfully ✨"
      : "Job saved successfully ✨"
  );
}


/* Add a job for today. */
function openAddJob(){

  openJobEditor(
    null,
    dateKey(
      new Date()
    )
  );
}


/* Refresh the live timer after returning to Home. */
function openPage(page){

  state.ui.page=
    page;

  document
    .querySelectorAll(".page")
    .forEach(
      p=>
        p.classList.toggle(
          "active",
          p.id==="page-"+page
        )
    );

  document
    .querySelectorAll(".nav-btn")
    .forEach(
      btn=>
        btn.classList.toggle(
          "active",
          btn.dataset.page===page
        )
    );


  if(page==="home")
    renderHome();

  if(page==="schedule")
    renderSchedule();

  if(page==="clients")
    renderClients();

  if(page==="earnings")
    renderEarnings();

  if(page==="reminders")
    renderReminders();

  if(page==="settings")
    renderSettings();


  saveState();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* Apply immediately after overriding the original functions. */
applySettings();
applyBranding();
renderAll();
</script>
