<!-- iPhone Calendar Sync -->

<style>
.calendar-sync-card{
  margin-top:18px;
  padding:20px;
  border-radius:22px;
  background:linear-gradient(135deg,#f8d5e2,#fff8fb);
  border:1px solid #d3a44d;
  box-shadow:0 8px 25px rgba(112,48,75,.10);
}

.calendar-sync-title{
  color:#8e3157;
  font-size:21px;
  font-weight:900;
  margin-bottom:7px;
}

.calendar-sync-text{
  color:#8d727f;
  font-size:14px;
  line-height:1.4;
  margin-bottom:15px;
}

.calendar-sync-button{
  width:100%;
  padding:16px;
  border-radius:16px;
  border:1px solid #d3a44d;
  background:linear-gradient(180deg,#ed8daa,#dc5f84);
  color:white;
  font-size:17px;
  font-weight:900;
}

.calendar-sync-button:active{
  transform:scale(.98);
}
</style>

<script>
/* =====================================================
   IPHONE CALENDAR
   ===================================================== */

function calendarEscape(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/,/g,"\\,")
    .replace(/;/g,"\\;")
    .replace(/\n/g,"\\n");

}


function calendarDate(date,time){

  const d =
    date
      ? new Date(date + "T" + (time || "00:00"))
      : new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  const h =
    String(d.getHours())
      .padStart(2,"0");

  const min =
    String(d.getMinutes())
      .padStart(2,"0");

  const sec =
    String(d.getSeconds())
      .padStart(2,"0");

  return `${y}${m}${day}T${h}${min}${sec}`;
}


function addMinutesToDate(date,time,minutes){

  const d =
    new Date(
      date +
      "T" +
      (time || "00:00")
    );

  d.setMinutes(
    d.getMinutes() + minutes
  );

  return d;

}


function icsDate(date){

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth()+1)
      .padStart(2,"0");

  const d =
    String(date.getDate())
      .padStart(2,"0");

  const h =
    String(date.getHours())
      .padStart(2,"0");

  const min =
    String(date.getMinutes())
      .padStart(2,"0");

  const sec =
    String(date.getSeconds())
      .padStart(2,"0");

  return `${y}${m}${d}T${h}${min}${sec}`;
}


function createCalendarICS(){

  const validJobs =
    jobs.filter(job => {

      return (
        job.date &&
        job.start &&
        job.end &&
        getClient(job.clientId)
      );

    });


  if(!validJobs.length){

    alert(
      "There are no dated jobs with start and end times to add to Calendar."
    );

    return;

  }


  const events =
    validJobs.map(job => {

      const client =
        getClient(job.clientId);

      const start =
        new Date(
          job.date +
          "T" +
          job.start
        );


      let end;


      if(job.end){

        end =
          new Date(
            job.date +
            "T" +
            job.end
          );


        if(end <= start){

          end.setDate(
            end.getDate() + 1
          );

        }

      }else{

        end =
          new Date(
            start.getTime() +
            Number(
              job.hours || 0
            ) *
            3600000
          );

      }


      const description =
        [
          "Pure Shine Cleaning Manager",
          "Client: " + client.name,
          "Type: " + (client.type || ""),
          "Rate: £" + Number(job.rate || client.rate || 0).toFixed(2) + "/hour",
          job.workedSeconds
            ? "Exact worked time: " +
              exactWorkedText(job.workedSeconds)
            : "",
          job.notes
            ? "Notes: " + job.notes
            : ""
        ]
        .filter(Boolean)
        .join("\\n");


      return [
        "BEGIN:VEVENT",
        "UID:pureshine-" +
          calendarEscape(job.id) +
          "@pureshine",
        "DTSTAMP:" +
          icsDate(new Date()),
        "DTSTART:" +
          icsDate(start),
        "DTEND:" +
          icsDate(end),
        "SUMMARY:" +
          calendarEscape(
            "Cleaning - " +
            client.name
          ),
        "DESCRIPTION:" +
          calendarEscape(
            description
          ),
        "LOCATION:" +
          calendarEscape(
            client.name
          ),
        "STATUS:" +
          (
            job.done
              ? "COMPLETED"
              : "CONFIRMED"
          ),
        "END:VEVENT"
      ].join("\r\n");

    });


  const ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Pure Shine Cleaning Manager//EN
CALSCALE:GREGORIAN
METHOD:PUBLISH
X-WR-CALNAME:Pure Shine Cleaning
X-WR-CALDESC:Pure Shine Cleaning Manager Jobs
${events.join("\r\n")}
END:VCALENDAR`;


  const blob =
    new Blob(
      [ics],
      {
        type:"text/calendar;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "Pure-Shine-Cleaning-Calendar.ics";

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    2000
  );

}


function addCalendarSyncToSettings(){

  const settingsPage =
    document.getElementById(
      "page-settings"
    );

  if(!settingsPage)
    return;


  if(
    document.getElementById(
      "calendarSyncCard"
    )
  )
    return;


  const card =
    document.createElement("div");

  card.id =
    "calendarSyncCard";

  card.className =
    "calendar-sync-card";


  card.innerHTML = `
    <div class="calendar-sync-title">
      📅 iPhone Calendar
    </div>

    <div class="calendar-sync-text">
      Add your Pure Shine cleaning jobs to the Calendar app on your iPhone.
    </div>

    <button
      class="calendar-sync-button"
      type="button"
      id="syncCalendarButton"
    >
      📅 Add Jobs to iPhone Calendar
    </button>
  `;


  settingsPage
    .querySelector(".card")
    .appendChild(card);


  document
    .getElementById("syncCalendarButton")
    .addEventListener(
      "click",
      createCalendarICS
    );

}


document.addEventListener(
  "DOMContentLoaded",
  () => {

    addCalendarSyncToSettings();

  }
);


/* =====================================================
   ALSO ADD CALENDAR BUTTON TO SCHEDULE PAGE
   ===================================================== */

function addCalendarButtonToSchedule(){

  const head =
    document.querySelector(
      "#page-schedule .section-head"
    );

  if(!head)
    return;


  if(
    document.getElementById(
      "syncScheduleCalendar"
    )
  )
    return;


  const button =
    document.createElement("button");

  button.id =
    "syncScheduleCalendar";

  button.className =
    "primary";

  button.type =
    "button";

  button.textContent =
    "📅 Calendar";


  button.addEventListener(
    "click",
    createCalendarICS
  );


  head.appendChild(button);

}


document.addEventListener(
  "DOMContentLoaded",
  () => {

    addCalendarSyncToSettings();
    addCalendarButtonToSchedule();

  }
);
</script>
