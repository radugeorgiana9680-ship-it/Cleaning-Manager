<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#f8e4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cleaning Manager">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Parisienne&display=swap');

:root{
    --bg:#fff8fb;
    --white:#ffffff;
    --pink:#f9dce8;
    --pink2:#fceaf2;
    --pink-dark:#e5789f;
    --pink-text:#a84368;
    --blue:#dce9ff;
    --blue-text:#28578f;
    --green:#dcf2e5;
    --green-text:#28714d;
    --yellow:#fff0c8;
    --yellow-text:#8e6814;
    --purple:#eadcf8;
    --purple-text:#70418e;
    --peach:#fde0da;
    --peach-text:#a95042;
    --text:#18161b;
    --muted:#777078;
    --border:#eee3e8;
    --shadow:0 6px 22px rgba(116,70,94,.07);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-width:100%;
    max-width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    zoom:1!important;
}

body{
    background:#f8e4ec;
    color:var(--text);
    font-family:
        "DM Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body.intro-open{
    overflow:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

img{
    max-width:100%;
}

/* =========================================================
   INTRO
========================================================= */

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:99999;

    width:100%;
    height:100dvh;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        max(22px,env(safe-area-inset-top))
        18px
        max(22px,env(safe-area-inset-bottom));

    overflow:auto;

    background:
        linear-gradient(
            180deg,
            rgba(255,235,244,.84),
            rgba(255,249,252,.96)
        ),
        url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1400&q=90")
        center/cover;
}

.welcome-card{
    width:min(100%,420px);
    padding:24px 18px 20px;
    border-radius:32px;
    text-align:center;
    background:rgba(255,255,255,.90);
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 18px 55px rgba(150,76,108,.16);
    backdrop-filter:blur(12px);
}

.welcome-logo{
    width:135px;
    height:135px;
    object-fit:cover;
    display:block;
    margin:0 auto 15px;
    border-radius:50%;
    box-shadow:0 10px 28px rgba(190,90,130,.18);
}

.welcome-title{
    font-family:"Parisienne",cursive;
    color:#a44769;
    font-size:42px;
    line-height:1;
}

.welcome-subtitle{
    margin-top:7px;
    font-size:18px;
    font-weight:700;
}

.welcome-description{
    max-width:330px;
    margin:11px auto 18px;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.welcome-features{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-bottom:17px;
}

.welcome-feature{
    min-height:74px;
    border-radius:17px;
    padding:10px 5px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:700;
}

.welcome-feature:nth-child(1){
    background:#fbdde8;
    color:#963e61;
}

.welcome-feature:nth-child(2){
    background:#dfeaff;
    color:#315b91;
}

.welcome-feature:nth-child(3){
    background:#ddf2e5;
    color:#28714d;
}

.welcome-feature:nth-child(4){
    background:#fff0c9;
    color:#8e6815;
}

.welcome-feature-icon{
    font-size:23px;
    margin-bottom:4px;
}

.get-started{
    width:100%;
    height:53px;
    border-radius:28px;
    background:linear-gradient(90deg,#e982a6,#dc7299);
    color:#fff;
    font-size:15px;
    font-weight:700;
    box-shadow:0 8px 20px rgba(216,110,150,.22);
}

.login-link{
    margin-top:12px;
    background:none;
    color:#a44769;
    font-size:11px;
    font-weight:600;
}

/* =========================================================
   APP — TRUE 100% PHONE WIDTH
========================================================= */

#mainApp{
    width:100%;
    min-width:100%;
    max-width:none;
    min-height:100dvh;
    background:var(--bg);
    overflow-x:hidden;
}

.app{
    width:100%;
    min-height:100dvh;
    padding-bottom:calc(77px + env(safe-area-inset-bottom));
}

.screen{
    display:none;
    width:100%;
    min-width:0;
    min-height:100dvh;

    padding:
        max(12px,env(safe-area-inset-top))
        16px
        25px;
}

.screen.active{
    display:block;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    width:100%;
    min-height:69px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:9px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.brand-logo{
    width:56px;
    height:56px;
    flex:none;
    border-radius:17px;
    object-fit:cover;
    background:#f7d7e5;
    box-shadow:0 4px 13px rgba(180,90,125,.12);
}

.brand-text{
    min-width:0;
}

.brand-title{
    font-size:22px;
    line-height:1.05;
    font-weight:800;
    letter-spacing:-.8px;
    white-space:nowrap;
}

.brand-subtitle{
    margin-top:5px;
    color:#686068;
    font-size:13px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.header-button{
    width:43px;
    height:43px;
    flex:none;
    border-radius:50%;
    background:#fff;
    box-shadow:0 4px 18px rgba(120,70,95,.10);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    color:#393139;
}

/* =========================================================
   DATE
========================================================= */

.date-banner{
    width:100%;
    min-height:86px;
    border-radius:21px;
    background:linear-gradient(135deg,#fbdde9,#f7d1e1);
    display:flex;
    align-items:center;
    padding:12px 14px;
    margin-bottom:12px;
}

.date-icon{
    width:42px;
    height:42px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#913653;
    font-size:25px;
    margin-right:8px;
}

.date-text{
    flex:1;
    min-width:0;
}

.date-title{
    font-size:16px;
    font-weight:800;
}

.date-subtitle{
    margin-top:4px;
    color:#675e64;
    font-size:13px;
}

.date-heart{
    flex:none;
    color:#c86588;
    font-size:35px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px;
    margin-bottom:24px;
}

.stat{
    min-width:0;
    min-height:108px;
    border-radius:19px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.stat:nth-child(1){background:#fbdde8}
.stat:nth-child(2){background:#dfe8ff}
.stat:nth-child(3){background:#ddf2e5}
.stat:nth-child(4){background:#fff0c7}

.stat-icon{
    height:29px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    margin-bottom:5px;
}

.stat-value{
    font-size:18px;
    font-weight:800;
    line-height:1;
}

.stat-label{
    margin-top:6px;
    font-size:12px;
}

/* =========================================================
   SECTIONS
========================================================= */

.section-header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 10px;
}

.section-title{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.7px;
}

.section-link{
    background:none;
    color:#a34469;
    font-size:13px;
    font-weight:800;
}

/* =========================================================
   TODAY
========================================================= */

.today-card{
    width:100%;
    background:#fff;
    border-radius:22px;
    min-height:180px;
    box-shadow:var(--shadow);
    padding:15px;
    margin-bottom:10px;
}

.today-empty{
    text-align:center;
}

.today-icon{
    width:55px;
    height:55px;
    margin:0 auto 5px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#e483a5;
    font-size:45px;
}

.today-title{
    font-size:17px;
    font-weight:500;
}

.today-sub{
    margin-top:4px;
    color:#777078;
    font-size:13px;
}

.today-add{
    width:100%;
    height:48px;
    margin-top:13px;
    border-radius:25px;
    color:#fff;
    background:linear-gradient(90deg,#e982a6,#dc7299);
    font-size:15px;
    font-weight:700;
}

.today-job-top{
    display:flex;
    align-items:center;
    gap:11px;
}

.today-job-photo{
    width:58px;
    height:58px;
    flex:none;
    border-radius:17px;
    background-size:cover;
    background-position:center;
}

.today-job-info{
    flex:1;
    min-width:0;
}

.today-job-name{
    font-size:17px;
    font-weight:800;
}

.today-job-time{
    margin-top:4px;
    color:#777078;
    font-size:13px;
}

.today-job-money{
    margin-top:3px;
    color:#a64d70;
    font-size:12px;
    font-weight:600;
}

.today-job-actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.today-job-actions .start{
    flex:1;
    height:43px;
    border-radius:23px;
    background:#e982a6;
    color:#fff;
    font-size:13px;
    font-weight:700;
}

.today-job-actions .edit{
    width:82px;
    height:43px;
    border-radius:23px;
    background:#f8e5ed;
    color:#a44c6d;
    font-size:13px;
    font-weight:700;
}

/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
}

.quick-button{
    width:100%;
    min-width:0;
    height:61px;
    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    font-size:14px;
    font-weight:700;
}

.quick-button.blue{
    background:var(--blue);
    color:var(--blue-text);
}

.quick-button.green{
    background:var(--green);
    color:var(--green-text);
}

.quick-button.pink{
    background:var(--pink);
    color:#873450;
}

.quick-button.yellow{
    background:var(--yellow);
    color:#191714;
}

.quick-button.purple{
    background:var(--purple);
    color:var(--purple-text);
}

.quick-button.peach{
    background:var(--peach);
    color:var(--peach-text);
}

.quick-icon{
    font-size:20px;
}

/* =========================================================
   QUOTE IMAGE
========================================================= */

.quote{
    width:100%;
    height:118px;
    border-radius:18px;
    margin-top:15px;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            rgba(250,216,228,.92),
            rgba(250,216,228,.60)
        ),
        url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1000&q=90")
        center/cover;
}

.quote-text{
    position:absolute;
    inset:0;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-family:"Parisienne",cursive;
    color:#a45a71;
    font-size:28px;
    line-height:1.05;
}

/* =========================================================
   PAGE HEADERS
========================================================= */

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.page-title{
    font-size:27px;
    font-weight:800;
    letter-spacing:-.8px;
}

.page-subtitle{
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
}

.add-circle{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#f7d5e2;
    color:#a8496b;
    font-size:27px;
}

/* =========================================================
   CARDS
========================================================= */

.day-card,
.item-card,
.month-card,
.settings-card{
    width:100%;
    background:#fff;
    border-radius:21px;
    box-shadow:var(--shadow);
}

.day-card{
    padding:13px;
    margin-bottom:10px;
}

.day-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
}

.day-name{
    font-size:18px;
    font-weight:800;
}

.day-total{
    color:#a7486a;
    font-size:12px;
    font-weight:800;
}

.schedule-row{
    display:flex;
    align-items:center;
    gap:9px;
    border-top:1px solid #f3e9ed;
    padding:9px 0;
}

.schedule-photo,
.item-photo,
.month-photo{
    flex:none;
    background-size:cover;
    background-position:center;
}

.schedule-photo{
    width:49px;
    height:49px;
    border-radius:15px;
}

.schedule-info,
.item-info,
.month-info{
    flex:1;
    min-width:0;
}

.schedule-name,
.item-name,
.month-name{
    font-size:14px;
    font-weight:800;
}

.schedule-time{
    margin-top:4px;
    color:var(--muted);
    font-size:10px;
}

.schedule-pay{
    color:#b45d7d;
    font-size:11px;
    font-weight:800;
}

.item-card{
    padding:12px;
    margin-bottom:10px;
}

.item-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.item-photo{
    width:58px;
    height:58px;
    border-radius:17px;
}

.item-meta{
    margin-top:4px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
}

.item-right{
    text-align:right;
    flex:none;
}

.item-money{
    color:#b65c7d;
    font-size:11px;
    font-weight:800;
}

.badge{
    display:inline-block;
    margin-top:4px;
    padding:4px 7px;
    border-radius:8px;
    font-size:8px;
}

.private{
    background:#f9dce8;
    color:#a24768;
}

.agency{
    background:#fff0d1;
    color:#987027;
}

.item-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.item-actions button{
    flex:1;
    min-width:0;
    height:35px;
    border-radius:11px;
    background:#fceaf1;
    color:#a34a6b;
    font-size:10px;
    font-weight:800;
}

.item-actions button.delete{
    background:#fff0f0;
    color:#b86168;
}

/* =========================================================
   EARNINGS
========================================================= */

.earnings-card{
    width:100%;
    background:linear-gradient(135deg,#f6d5e2,#eeb5cd);
    border-radius:23px;
    padding:21px;
    margin-bottom:13px;
}

.earnings-label{
    color:#8e5168;
    font-size:12px;
}

.earnings-value{
    margin-top:3px;
    color:#743b54;
    font-size:38px;
    font-weight:800;
}

.earnings-hours{
    margin-top:3px;
    color:#795f6a;
    font-size:13px;
}

.month-card{
    padding:13px;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    gap:10px;
}

.month-photo{
    width:53px;
    height:53px;
    border-radius:16px;
}

.month-money{
    color:#ad5577;
    font-weight:800;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-image{
    width:100%;
    height:175px;
    border-radius:23px;
    overflow:hidden;
    position:relative;
    margin-bottom:12px;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(67,39,51,.68)
        ),
        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1000&q=90")
        center/cover;
}

.settings-image-text{
    position:absolute;
    left:18px;
    bottom:17px;
    color:#fff;
}

.settings-image-title{
    font-family:"Parisienne",cursive;
    font-size:31px;
}

.settings-card{
    padding:7px 14px;
    margin-bottom:10px;
}

.setting-row{
    min-height:62px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #f1e6ea;
}

.setting-row:last-child{
    border-bottom:0;
}

.setting-icon{
    width:38px;
    height:38px;
    flex:none;
    border-radius:12px;
    background:#fce6ee;
    color:#a6496b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.setting-info{
    flex:1;
    min-width:0;
}

.setting-name{
    font-size:13px;
    font-weight:800;
}

.setting-desc{
    margin-top:3px;
    color:var(--muted);
    font-size:9px;
}

.setting-select{
    width:95px;
    height:36px;
    border:1px solid #eadde2;
    border-radius:10px;
    background:#fff;
    font-size:10px;
    padding:0 6px;
    outline:none;
}

/* =========================================================
   BOTTOM NAV — 5 ITEMS LIKE THE DESIGN
========================================================= */

.bottom-nav{
    position:fixed;
    z-index:1000;

    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:calc(76px + env(safe-area-inset-bottom));

    padding-bottom:env(safe-area-inset-bottom);

    background:rgba(255,255,255,.98);
    border-top:1px solid #eee3e7;

    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
}

.nav-item{
    min-width:0;
    padding:0;
    background:none;
    color:#727078;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;

    font-size:9px;
    font-weight:500;
}

.nav-icon{
    width:40px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.nav-item.active{
    color:#bd416b;
}

.nav-item.active .nav-icon{
    width:43px;
    border-radius:15px;
    background:#f9dce8;
}

/* =========================================================
   MODALS
========================================================= */

.modal{
    position:fixed;
    z-index:2000;
    inset:0;

    background:rgba(35,20,28,.4);
    backdrop-filter:blur(4px);

    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    background:#fff9fb;
    border-radius:28px 28px 0 0;
    padding:19px;
    max-height:92dvh;
    overflow-y:auto;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.modal-title{
    font-size:25px;
    font-weight:800;
}

.close{
    width:38px;
    height:38px;
    border-radius:13px;
    background:#f8dfe8;
    color:#a44769;
    font-size:22px;
}

.form-group{
    margin-bottom:10px;
}

.form-label{
    display:block;
    margin:0 0 5px 2px;
    color:#786b72;
    font-size:9px;
    font-weight:800;
}

.form-control{
    width:100%;
    height:44px;
    border:1px solid #eadde3;
    background:#fff;
    border-radius:13px;
    padding:0 11px;
    outline:none;
    font-size:11px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
    height:43px;
    border-radius:13px;
    font-size:11px;
    font-weight:800;
}

.cancel{
