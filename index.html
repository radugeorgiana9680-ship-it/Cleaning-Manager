<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e58aaa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pure Shine">
<title>Pure Shine Cleaning Manager</title>

<style>
:root{
--pink:#e88aaa;
--rose:#bd3d69;
--ink:#211d22;
--muted:#77717a;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#fff7fa;
color:var(--ink)
}

button,input,select{font:inherit}
button{cursor:pointer}

#welcome{
position:fixed;
inset:0;
z-index:1000;
background:#fff1f6;
overflow:hidden
}

#welcomeArt{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center;
display:block
}

#welcomeClick{
position:absolute;
z-index:3;
left:7%;
right:7%;
bottom:7%;
height:10%;
border:0;
background:transparent;
border-radius:50px
}

#app{
display:none;
min-height:100vh;
padding-bottom:105px;
background:linear-gradient(180deg,#fffafd,#fff6fa 75%,#fff9fb)
}

.inner{
max-width:540px;
margin:auto;
padding:18px 16px 28px
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:4px 2px 15px
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:56px;
height:56px;
border-radius:18px;
object-fit:cover;
display:block;
box-shadow:0 4px 12px rgba(182,91,120,.12)
}

.brand h1{
margin:0;
font-size:22px;
letter-spacing:-.6px
}

.sub{
margin-top:4px;
color:#77717a;
font-size:14px
}

.settingsBtn{
width:48px;
height:48px;
border:0;
border-radius:50%;
background:#fff;
color:#9f4565;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 6px 20px rgba(155,97,112,.08)
}

.settingsBtn svg{
width:25px;
height:25px
}

.date{
position:relative;
overflow:hidden;
border-radius:22px;
padding:16px 18px;
background:
linear-gradient(
100deg,
rgba(255,219,232,.94),
rgba(249,226,243,.80)
),
url("pure-shine-cleaning-background(3).png") center/cover;
margin-bottom:16px
}

.date b{
font-size:18px
}

.date div{
margin-top:4px;
color:#776b74;
font-size:14px
}

.heart{
position:absolute;
right:16px;
top:13px;
color:#d46b91;
font-size:30px
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
margin-bottom:18px
}

.stat{
min-height:116px;
border-radius:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center
}

.stat .ico{
font-size:25px;
margin-bottom:4px
}

.stat b{
font-size:19px
}

.stat span{
font-size:12px;
color:#655c63;
margin-top:3px
}

.s1{background:#ffdce8}
.s2{background:#e5e5ff}
.s3{background:#dcf4e6}
.s4{background:#fff0c9}

.section{
display:flex;
align-items:center;
justify-content:space-between;
margin:18px 3px 11px
}

.section h2{
margin:0;
font-size:21px;
letter-spacing:-.5px
}

.see{
color:#b83b68;
font-size:14px;
font-weight:700
}

.card{
background:#fff;
border-radius:23px;
padding:13px;
box-shadow:0 7px 24px rgba(124,80,99,.06)
}

.job{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
border-radius:19px;
margin-bottom:8px
}

.job:last-child{
margin-bottom:0
}

.jp{background:#fff0f6}
.jb{background:#e9f7fb}

.job strong{
font-size:16px
}

.job small{
display:block;
color:#7d747c;
margin-top:4px
}

.price{
font-size:18px;
font-weight:700
}

.empty{
text-align:center;
padding:25px 10px;
background:
linear-gradient(
105deg,
rgba(255,255,255,.90),
rgba(255,241,247,.78)
),
url("pure-shine-cleaning-background(3).png") center/cover;
border-radius:18px
}

.empty .big{
font-size:38px;
color:#eb8dac
}

.empty small{
display:block;
color:#8a8188;
margin-top:5px
}

.pinkBtn{
width:100%;
border:0;
border-radius:23px;
padding:15px;
background:linear-gradient(135deg,#ed91b1,#d979a0);
color:#fff;
font-weight:700;
margin-top:13px
}

.quick{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.quick button{
border:0;
min-height:64px;
border-radius:18px;
font-weight:700;
font-size:14px
}

.qb{background:#dceffd;color:#165b96}
.qg{background:#dcf3e6;color:#257151}
.qp{background:#ffdce8;color:#8b2850}
.qy{background:#fff0c9;color:#705719}
.ql{background:#eadcf9;color:#65318e}
.qo{background:#ffe2d8;color:#a54c2b}

.quote{
margin-top:15px;
border-radius:20px;
padding:17px;
background:
linear-gradient(
105deg,
rgba(255,240,243,.90),
rgba(255,224,232,.64)
),
url("pure-shine-cleaning-background(3).png") center/cover;
display:flex;
align-items:center;
justify-content:space-between;
overflow:hidden
}

.quoteText{
flex:1;
text-align:center;
font-family:"Brush Script MT","Segoe Script",cursive;
font-size:22px;
line-height:1.1;
color:#895469
}

.quoteFlower{
font-size:34px
}

.bottom{
position:fixed;
z-index:30;
display:none;
bottom:max(10px,env(safe-area-inset-bottom));
left:50%;
transform:translateX(-50%);
width:min(500px,calc(100% - 28px));
padding:8px;
border-radius:28px;
background:rgba(255,255,255,.97);
border:1px solid #f1dfe6;
box-shadow:0 10px 28px rgba(141,82,101,.09)
}

.bottom.show{
display:flex
}

.nav{
flex:1;
border:0;
background:transparent;
border-radius:18px;
padding:8px 2px;
color:#77717a;
font-size:10px
}

.nav span{
display:block;
font-size:21px;
margin-bottom:4px
}

.nav.active{
background:#ffe1ec;
color:#bd3d69
}

.overlay{
position:fixed;
inset:0;
z-index:2000;
display:none;
align-items:flex-end;
background:rgba(30,20,25,.43);
backdrop-filter:blur(3px)
}

.overlay.show{
display:flex
}

.modal{
width:100%;
max-width:540px;
max-height:92vh;
overflow:auto;
margin:auto;
background:#fff;
border-radius:30px 30px 0 0;
padding:20px 18px 34px
}

.modalHead{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px
}

.modalHead h2{
margin:0;
font-size:24px
}

.close{
width:46px;
height:46px;
border:0;
border-radius:50%;
background:#f4f0f7;
color:#b83467;
font-size:28px
}

label{
display:block;
font-weight:700;
margin:13px 0 7px
}

input,select{
width:100%;
padding:14px;
border:2px solid #e4deeb;
border-radius:17px;
background:#fff;
font-size:16px;
outline:0
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.secondary{
border:0;
border-radius:16px;
padding:10px 12px;
background:#f0ebf6;
color:#6c5968;
font-weight:700
}

.danger{
background:#fff0f4;
color:#c12f59
}

.list{
padding:14px;
border-radius:19px;
background:#faf9fc;
border:1px solid #eee8f1;
margin-bottom:9px
}

.listTitle{
font-size:17px;
font-weight:700
}

.muted{
color:#7e757d;
font-size:13px;
margin-top:4px
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:10px
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:10px;
font-size:11px;
margin-left:4px;
font-weight:700
}

.private{
background:#ffe1ec;
color:#8d3155
}

.agency{
background:#dff2fa;
color:#28617d
}

.tabs{
display:flex;
gap:8px;
margin-bottom:12px
}

.tab{
flex:1;
border:0;
border-radius:15px;
padding:11px;
background:#eee9f4;
font-weight:700
}

.tab.active{
background:#ed91b1;
color:#fff
}

.timer{
text-align:center;
font-size:46px;
font-weight:800;
padding:28px 0
}

.note{
padding:12px 14px;
border-radius:16px;
background:#fff8df;
color:#6e5a22;
font-size:13px;
margin:10px 0
}

.slot{
display:flex;
justify-content:space-between;
align-items:center;
padding:13px;
background:#fff1f6;
border-radius:16px;
margin:8px 0
}

.small{
border:0;
border-radius:15px;
padding:8px 10px;
background:#ffe0eb;
color:#bd3d69;
font-weight:700
}

.earn{
padding:18px;
border-radius:20px;
background:#fff1f6;
text-align:center;
margin-bottom:10px
}

.bigMoney{
font-size:38px;
font-weight:800;
margin:5px 0
}

.settingsList{
display:flex;
flex-direction:column;
gap:10px
}

.settingRow{
display:flex;
align-items:center;
gap:13px;
padding:15px;
border-radius:18px;
background:#fff5f8;
border:1px solid #f0dce5
}

.settingIcon{
width:44px;
height:44px;
border-radius:14px;
background:#ffe1ec;
color:#b83d68;
display:flex;
align-items:center;
justify-content:center;
font-size:21px
}

.settingText{
flex:1
}

.settingText strong{
display:block
}

.settingText small{
display:block;
margin-top:3px;
color:#77717a
}

@media(max-width:390px){
.stats{gap:7px}
.stat{min-height:103px}
.stat b{font-size:17px}
.stat span{font-size:11px}
}
</style>
</head>

<body>

<section id="welcome">

<img
id="welcomeArt"
src="pure-shine-cleaning-background(3).png"
alt=""
>

<button
id="welcomeClick"
onclick="enterApp()"
aria-label="Get Started">
</button>

</section>


<main id="app">

<div class="inner">

<header class="header">

<div class="brand">

<img
class="logo"
src="icon(3).png"
alt="Pure Shine"
>

<div>

<h1>
Cleaning Manager
</h1>

<div class="sub">
Your cleaning business ✨
</div>

</div>

</div>


<button
class="settingsBtn"
onclick="openSettings()"
aria-label="Settings">

<svg
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>

<path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.5 1.5-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.12v-.08a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.5-1.5.06-.06A1.7 1.7 0 0 0 9.16 15a1.7 1.7 0 0 0-1.56-1.03H7.5v-2.12h.1A1.7 1.7 0 0 0 9.16 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.5-1.5.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.56V5h2.12v.08a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.5 1.5-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1.03H21v2.12h-.04A1.7 1.7 0 0 0 19.4 15Z"/>

</svg>

</button>

</header>


<div class="date">

<b id="date"></b>

<div>

</div>

<div class="heart">

</div>

</div>

</div>

See all →

id="todaySchedule">

<div class="section">

<h2>
Quick actions
</h2>

<div class="quick">

<button

onclick="openTimer()">
◷&nbsp; Start cleaning

<button
class="qg"
onclick="openClients()">
👥&nbsp; Clients
</button>

class="qp"

<button
class="qy"
onclick="openFreeTime()">
🔎&nbsp; Find free time

<button
class="ql"
onclick="openEarnings()">
📊&nbsp; Earnings
</button>

class="qo"
onclick="openHolidays()">
🏖️&nbsp; Holidays
</button>

</div>


<div class="quote">

<div style="font-size:30px;color:#e681a3">
♡
</div>

<div class="quoteText">
A clean space<br>
is a happy place ♡
</div>

<div class="quoteFlower">
🌸
</div>

</div>

</div>

</main>


<nav
class="bottom"
id="bottom">

class="nav active"
onclick="home(this)">

<span>⌂</span>
Home

</button>

class="nav"
onclick="openSchedule(this)">

<span>▣</span>
Schedule

</button>

class="nav"
onclick="openClients(this)">

<span>♧</span>
Clients

</button>

<button
class="nav"
onclick="openFreeTime(this)">

<span>◷</span>
Free time

</button>

class="nav"
onclick="openEarnings(this)">

<span>▥</span>
Earnings

</button>

</nav>


<div
class="overlay"
id="overlay">

<div
class="modal"
id="modal">
</div>

</div>


<script>

const KEY="pureShineFinalOneFile";

const seed={
clients:[
{
id:1,
name:"Tosca",
type:"agency",
rate:16,
day:"Monday",
start:"09:00",
end:"12:00",
frequency:"weekly",
week:"A"
},
{
id:2,
name:"Lottie",
type:"agency",
rate:16,
day:"Monday",
start:"13:00",
end:"15:00",
frequency:"weekly",
week:"A"
},
{
id:3,
name:"Christine",
type:"private",
rate:18,
day:"Tuesday",
start:"09:30",
end:"12:30",
frequency:"weekly",
week:"A"
},
{
id:4,
name:"Matt",
type:"agency",
rate:16,
day:"Tuesday",
start:"13:00",
end:"17:00",
frequency:"weekly",
week:"A",
variable:true
},
{
id:5,
name:"Sonia",
type:"agency",
rate:16,
day:"Wednesday",
start:"09:00",
end:"14:00",
frequency:"weekly",
week:"A",
variable:true
},
{
id:6,
name:"Gill",
type:"agency",
rate:16,
day:"Wednesday",
start:"15:00",
end:"18:00",
frequency:"weekly",
week:"A"
},
{
id:7,
name:"Laura",
type:"private",
rate:18,
day:"Thursday",
start:"09:00",
end:"13:00",
frequency:"weekly",
week:"A",
variable:true
},
{
id:8,
name:"Hannah",
type:"agency",
rate:16,
day:"Thursday",
start:"13:00",
end:"16:00",
frequency:"weekly",
week:"A"
}
],
jobs:[],
holidays:[],
week:"A"
};

let data=
JSON.parse(
localStorage.getItem(KEY)||"null"
)||seed;

let timerId=null;
let timerStart=0;


function save(){
localStorage.setItem(
KEY,
JSON.stringify(data)
);
}


function mins(t){
let[a,b]=t.split(":").map(Number);
return a*60+b;
}


function dur(a,b){
return Math.max(
0,
(mins(b)-mins(a))/60
);
}


function money(n){
return "£"+(
Math.round(n*100)/100
);
}


function esc(s){
return String(s).replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);
}


function dateKey(d){
return d.toISOString().slice(0,10);
}


function day(d){
return d.toLocaleDateString(
"en-GB",
{weekday:"long"}
);
}


function fmt(m){
return String(
Math.floor(m/60)
).padStart(2,"0")
+
":"+
String(m%60).padStart(2,"0");
}


function closeModal(){

if(timerId){
clearInterval(timerId);
timerId=null;
}

document
.getElementById("overlay")
.classList.remove("show");
}


function show(html){

document.getElementById("modal")
.innerHTML=html;

document
.getElementById("overlay")
.classList.add("show");
}


document
.getElementById("overlay")
.addEventListener(
"click",
e=>{
if(e.target.id==="overlay")
closeModal();
}
);


function enterApp(){

document
.getElementById("welcome")
.style.display="none";

document
.getElementById("app")
.style.display="block";

document
.getElementById("bottom")
.classList.add("show");

localStorage.setItem(
"pureShineEntered",
"1"
);

render();
}


if(
localStorage.getItem(
"pureShineEntered"
)==="1"
){
enterApp();
}


function holiday(id,d){

return data.holidays.some(
h=>
h.clientId===id &&
d>=h.from &&
d<=h.to
);

}


function todays(){

let d=new Date();

let dn=day(d);

let dk=dateKey(d);

return data.clients
.filter(
c=>
c.day===dn &&
(
c.frequency!=="fortnightly" ||
c.week===data.week
) &&
!holiday(c.id,dk)
)
.sort(
(a,b)=>
mins(a.start)-mins(b.start)
);

}


function render(){

let d=new Date();

let jobs=todays();

let h=
jobs.reduce(
(s,c)=>
s+dur(c.start,c.end),
0
);

let e=
jobs.reduce(
(s,c)=>
s+
dur(c.start,c.end)*c.rate,
0
);

document
.getElementById("date")
.textContent=
d.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

document
.getElementById("jobsCount")
.textContent=
jobs.length;

document
.getElementById("hours")
.textContent=
Math.floor(h)+
"h "+
Math.round((h%1)*60)+
"m";

document
.getElementById("earned")
.textContent=
money(e);

document
.getElementById("available")
.textContent=
Math.max(0,8-h)
.toFixed(1)
.replace(".0","")
+"h";


document
.getElementById("todaySchedule")
.innerHTML=
jobs.length
?
jobs.map(
(c,i)=>
`
<div class="job ${i%2?"jb":"jp"}">

<div>

<strong>
${esc(c.name)}
</strong>

<small>
${c.start} – ${c.end}
· ${dur(c.start,c.end)}h
· ${c.type==="private"?"Private":"Agency"}
</small>

</div>

<div class="price">
${money(
dur(c.start,c.end)*c.rate
)}
</div>

</div>
`
).join("")
:
`
<div class="empty">

<div class="big">
♡
</div>

<b>
No cleaning jobs today 🌸
</b>

<small>
Add one with the + button.
</small>

<button
class="pinkBtn"
onclick="openJob()">
＋ Add cleaning job
</button>

</div>
`;

save();

}


function setNav(btn){

document
.querySelectorAll(".nav")
.forEach(
x=>x.classList.remove("active")
);

if(btn)
btn.classList.add("active");

}


function home(btn){

setNav(btn);

closeModal();

render();

}


function openJob(pref={}){

show(

`
<div class="modalHead">

<h2>
Add cleaning job 🧹
</h2>

<button
class="close"
onclick="closeModal()">
×
</button>

</div>

<label>
Client
</label>

<select id="jc">

${data.clients.map(
c=>
`
<option value="${c.id}">
${esc(c.name)} — £${c.rate}/h
</option>
`
).join("")}

</select>

<label>
Date
</label>

<input
id="jd"
type="date"
value="${pref.date||dateKey(new Date())}"
>

<div class="row">

<div>

<label>
Start
</label>

<input
id="js"
type="time"
value="${pref.start||""}"

function saveClient(id){

let n=
document.getElementById("cn")
.value.trim();

let s=
document.getElementById("cs")
.value;

let e=
document.getElementById("ce")
.value;

if(
!n ||
!s ||
!e ||
mins(e)<=mins(s)
)
return alert(
"Please complete the client details."
);

let obj={

id:id||Date.now(),

name:n,

type:
document.getElementById("ct").value,

rate:
Number(
document.getElementById("cr").value
)||0,

day:
document.getElementById("cd").value,

start:s,

end:e,

frequency:
document.getElementById("cf").value,

week:
document.getElementById("cw").value

};

let old=
data.clients.find(
x=>x.id===id
);

if(old)
Object.assign(old,obj);
else
data.clients.push(obj);

save();

openClients();

render();

}


function deleteClient(id){

let c=
data.clients.find(
x=>x.id===id
);

if(
c &&
confirm(
"Delete "+c.name+
"? This also removes saved jobs and holidays."
)
){

data.clients=
data.clients.filter(
x=>x.id!==id
);

data.jobs=
data.jobs.filter(
j=>j.clientId!==id
);

data.holidays=
data.holidays.filter(
h=>h.clientId!==id
);

save();

openClients();

render();

}

}

function toggleTimer(){

let b=
document.getElementById(
"timerBtn"
);

if(timerId){

clearInterval(timerId);

timerId=null;

b.textContent=
"Start timer";

return;

}

timerStart=Date.now();

b.textContent=
"Stop timer";

const tick=()=>{

let s=
Math.floor(
(Date.now()-timerStart)/1000
);

let h=
Math.floor(s/3600);

let m=
Math.floor(
(s%3600)/60
);

let x=
s%60;

document.getElementById(
"clock"
).textContent=
[
h,m,x
]
.map(
n=>
String(n).padStart(2,"0")
)
.join(":");

};

tick();

timerId=
setInterval(
tick,
500
);

}

function refreshFree(){

let v=
document.getElementById("fd")
.value;

if(!v)
return;

let d=
new Date(v+"T12:00:00");

let dn=day(d);

let jobs=
data.clients
.filter(
c=>
c.day===dn &&
(
c.frequency!=="fortnightly" ||
c.week===data.week
) &&
!holiday(c.id,v)
)
.sort(
(a,b)=>
mins(a.start)-mins(b.start)
);

let cursor=8*60;

let end=18*60;

let slots=[];

jobs.forEach(
j=>{

let a=mins(j.start);

let b=mins(j.end);

if(a>cursor)
slots.push([cursor,a]);

cursor=
Math.max(
cursor,
b
);

}
);

if(cursor<end)
slots.push(
[cursor,end]
);

document.getElementById(
"freeResults"
).innerHTML=

`
<div class="note">

${dn}
· Available gaps between
08:00 and 18:00.

</div>

${
slots.length

?

slots.map(
s=>
`
<div class="slot">

<div>

<b>
${fmt(s[0])}
–
${fmt(s[1])}
</b>

<div class="muted">

${Math.floor(
(s[1]-s[0])/60
)}h
${(s[1]-s[0])%60}m
available

</div>

</div>

<button
class="small"
onclick="openJob({
date:'${v}',
start:'${fmt(s[0])}',
end:'${fmt(s[1])}'
})">

＋ Add job

</button>

</div>
`
).join("")

:

'<div class="empty">No free gaps found 🌸</div>'

}

`;

}
