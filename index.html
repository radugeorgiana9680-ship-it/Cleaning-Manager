<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#f8dce8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cleaning Manager">

<title>Cleaning Manager</title>

<style>
:root{
    --pink:#e84d91;
    --pink-dark:#c92f72;
    --pink-light:#f8d8e6;

    --blue:#d9e9fb;
    --blue-text:#183d78;

    --green:#d9f0e3;
    --green-text:#26734c;

    --yellow:#fff0c7;
    --yellow-text:#9b6811;

    --purple:#e7dcfa;
    --purple-text:#6841a5;

    --peach:#f8ddd4;
    --peach-text:#a84f3b;

    --text:#171722;
    --muted:#77727d;

    --white:#ffffff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f8dce8;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

    color:var(--text);
    overflow-x:hidden;
}

button{
    font:inherit;
    border:0;
    outline:0;
}

.app{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    background:
        linear-gradient(
            180deg,
            #f8dce8 0px,
            #fdf8fb 100px,
            #fffafb 100%
        );
    padding-bottom:100px;
}

/* =========================
   HEADER
========================= */

.header{
    width:100%;
    min-height:126px;

    padding:
        calc(env(safe-area-inset-top) + 18px)
        24px
        18px;

    background:rgba(255,255,255,.96);

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #f0e8ed;
}

.brand{
    display:flex;
    align-items:center;
    gap:16px;
    min-width:0;
}

.logo{
    width:78px;
    height:78px;
    flex:0 0 78px;

    object-fit:cover;

    border-radius:22px;

    background:#fff;

    box-shadow:
        0 5px 16px rgba(190,70,125,.16);
}

.brand-copy{
    min-width:0;
}

.brand-copy h1{
    margin:0;

    font-size:29px;
    line-height:1.05;

    font-weight:800;
    letter-spacing:-1px;

    white-space:nowrap;
}

.brand-copy p{
    margin:8px 0 0;

    font-size:17px;

    color:#85808a;
}

.settings{
    width:64px;
    height:64px;

    flex:0 0 64px;

    border-radius:50%;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;

    box-shadow:
        0 7px 24px rgba(50,30,45,.10);
}

/* =========================
   CONTENT
========================= */

.content{
    width:100%;
    padding:24px;
}

/* =========================
   DATE
========================= */

.date-card{
    width:100%;
    min-height:126px;

    padding:23px 28px;

    border-radius:29px;

    background:#f5cfe0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:22px;
}

.date-left{
    display:flex;
    align-items:center;
    gap:18px;
}

.date-icon{
    width:53px;
    height:53px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:39px;

    color:#b92768;
}

.date-text h2{
    margin:0;

    font-size:26px;
    line-height:1.1;

    font-weight:800;
    letter-spacing:-.7px;
}

.date-text p{
    margin:9px 0 0;

    color:#7c707b;

    font-size:17px;
}

.date-heart{
    color:#d13e82;
    font-size:58px;
    line-height:1;
}

/* =========================
   STAT CARDS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:15px;

    margin-bottom:29px;
}

.stat{
    min-height:148px;

    border-radius:27px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:14px 7px;
}

.stat:nth-child(1){
    background:#f5d0e0;
}

.stat:nth-child(2){
    background:var(--blue);
}

.stat:nth-child(3){
    background:var(--green);
}

.stat:nth-child(4){
    background:var(--yellow);
}

.stat-icon{
    font-size:34px;
    line-height:1;

    margin-bottom:11px;
}

.stat:nth-child(1) .stat-icon{
    color:#c23c77;
}

.stat:nth-child(2) .stat-icon{
    color:var(--blue-text);
}

.stat:nth-child(3) .stat-icon{
    color:var(--green-text);
}

.stat:nth-child(4) .stat-icon{
    color:#c78316;
}

.stat-value{
    font-size:28px;
    font-weight:800;
    line-height:1;
}

.stat-label{
    margin-top:10px;
    font-size:15px;
}

/* =========================
   TODAY'S SCHEDULE
========================= */

.schedule-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.schedule-heading h2{
    margin:0;

    font-size:27px;
    font-weight:800;

    letter-spacing:-.7px;
}

.schedule-heading button{
    background:transparent;

    color:#c83c7a;

    font-size:17px;
    font-weight:800;
}

/* =========================
   SCHEDULE CARD
========================= */

.schedule-card{
    width:100%;
    min-height:310px;

    background:#fff;

    border-radius:31px;

    box-shadow:
        0 7px 28px rgba(70,45,65,.07);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:28px;
}

.schedule-icon{
    width:86px;
    height:86px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#e05091;

    font-size:69px;

    margin-bottom:17px;
}

.schedule-card h3{
    margin:0;

    font-size:21px;
    font-weight:800;
}

.schedule-card p{
    margin:10px 0 27px;

    color:#817984;

    font-size:17px;
}

.add-job{
    width:100%;
    min-height:65px;

    border-radius:34px;

    background:#e94d91;

    color:#fff;

    font-size:19px;
    font-weight:800;

    box-shadow:
        0 8px 18px rgba(220,64,130,.18);
}

/* =========================
   QUICK ACTIONS
   EXACTLY AS REFERENCE
========================= */

.quick-title{
    margin:29px 0 14px;

    font-size:27px;
    font-weight:800;

    letter-spacing:-.7px;
}

.quick-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.quick{
    min-height:84px;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;

    font-size:19px;
    font-weight:700;
}

.quick .qicon{
    font-size:32px;
    line-height:1;
}

.quick.blue{
    background:var(--blue);
    color:var(--blue-text);
}

.quick.green{
    background:var(--green);
    color:var(--green-text);
}

.quick.pink{
    background:#f6d1e1;
    color:#bd2f6e;
}

.quick.yellow{
    background:var(--yellow);
    color:#171717;
}

.quick.purple{
    background:var(--purple);
    color:var(--purple-text);
}

.quick.peach{
    background:var(--peach);
    color:var(--peach-text);
}

/* =========================
   FLOWER QUOTE IMAGE
========================= */

.quote-image{
    width:100%;
    height:165px;

    margin-top:17px;

    border-radius:26px;

    overflow:hidden;

    position:relative;

    background:#f5d2e0;
}

.quote-image img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;
}

.quote-image:after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(255,192,218,.25),
            rgba(255,205,222,.05)
        );

    pointer-events:none;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:100;

    width:100%;

    min-height:96px;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    background:rgba(255,255,255,.98);

    border-top:1px solid #eee8ed;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    box-shadow:
        0 -5px 25px rgba(70,40,60,.07);
}

.nav-item{
    background:transparent;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    color:#85808a;

    font-size:15px;
    font-weight:700;
}

.nav-icon{
    width:53px;
    height:43px;

    border-radius:23px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;
}

.nav-item.active{
    color:#df4388;
}

.nav-item.active .nav-icon{
    background:#f8d6e5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        min-height:112px;
        padding-left:22px;
        padding-right:22px;
    }

    .logo{
        width:68px;
        height:68px;
        flex-basis:68px;
    }

    .brand{
        gap:13px;
    }

    .brand-copy h1{
        font-size:24px;
    }

    .brand-copy p{
        font-size:15px;
        margin-top:7px;
    }

    .settings{
        width:57px;
        height:57px;
        flex-basis:57px;
        font-size:26px;
    }

    .content{
        padding:22px;
    }

    .date-card{
        min-height:112px;
        padding:21px;
    }

    .date-left{
        gap:10px;
    }

    .date-icon{
        width:38px;
        font-size:30px;
    }

    .date-text h2{
        font-size:22px;
    }

    .date-text p{
        font-size:15px;
    }

    .date-heart{
        font-size:48px;
    }

    .stats{
        gap:10px;
    }

    .stat{
        min-height:138px;
        border-radius:23px;
    }

    .stat-icon{
        font-size:27px;
    }

    .stat-value{
        font-size:23px;
    }

    .stat-label{
        font-size:13px;
    }

    .schedule-heading h2,
    .quick-title{
        font-size:23px;
    }

    .quick{
        min-height:77px;
        font-size:16px;
        gap:9px;
    }

    .quick .qicon{
        font-size:26px;
    }

    .quote-image{
        height:145px;
    }

    .nav-item{
        font-size:12px;
    }

    .nav-icon{
        width:47px;
        height:38px;
        font-size:25px;
    }
}

/* VERY SMALL PHONES */

@media(max-width:370px){

    .content{
        padding:16px;
    }

    .header{
        padding-left:16px;
        padding-right:16px;
    }

    .stats{
        gap:7px;
    }

    .stat{
        min-height:125px;
        border-radius:20px;
    }

    .stat-value{
        font-size:20px;
    }

    .stat-label{
        font-size:12px;
    }

    .quick{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="brand">

        <img
            src="icon.png"
            class="logo"
            alt="Pure Shine Cleaning Manager"
        >

        <div class="brand-copy">
            <h1>Cleaning Manager</h1>
            <p>Your cleaning business ✨</p>
        </div>

    </div>

    <button
        class="settings"
        onclick="openSettings()"
        aria-label="Settings"
    >
        ⚙️
    </button>

</header>


<main class="content">

    <!-- DATE -->

    <section class="date-card">

        <div class="date-left">

            <div class="date-icon">▣</div>

            <div class="date-text">
                <h2 id="dateText"></h2>
                <p>Let's make today productive 🌸</p>
            </div>

        </div>

        <div class="date-heart">♡</div>

    </section>


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat">
            <div class="stat-icon">💼</div>
            <div class="stat-value">0</div>
            <div class="stat-label">Jobs</div>
        </div>

        <div class="stat">
            <div class="stat-icon">◷</div>
            <div class="stat-value">0h 0m</div>
            <div class="stat-label">Hours</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🪙</div>
            <div class="stat-value">£0</div>
            <div class="stat-label">Earned</div>
        </div>

        <div class="stat">
            <div class="stat-icon">☼</div>
            <div class="stat-value">1h</div>
            <div class="stat-label">Available</div>
        </div>

    </section>


    <!-- TODAY'S SCHEDULE -->

    <section>

        <div class="schedule-heading">

            <h2>Today's schedule</h2>

            <button onclick="showSchedule()">
                See all
            </button>

        </div>


        <div class="schedule-card">

            <div class="schedule-icon">
                ♡
            </div>

            <h3>
                No cleaning jobs today 🌸
            </h3>

            <p>
                Add one with the + button.
            </p>

            <button
                class="add-job"
                onclick="addJob()"
            >
                ＋ Add cleaning job
            </button>

        </div>

    </section>


    <!-- QUICK ACTIONS -->

    <h2 class="quick-title">
        Quick actions
    </h2>

    <section class="quick-actions">

        <button class="quick blue" onclick="startCleaning()">
            <span class="qicon">◷</span>
            <span>Start cleaning</span>
        </button>

        <button class="quick green" onclick="clients()">
            <span class="qicon">♧</span>
            <span>Clients</span>
        </button>

        <button class="quick pink" onclick="schedule()">
            <span class="qicon">▣</span>
            <span>Schedule</span>
        </button>

        <button class="quick yellow" onclick="freeTime()">
            <span class="qicon">⌕</span>
            <span>Find free time</span>
        </button>

        <button class="quick purple" onclick="earnings()">
            <span class="qicon">▥</span>
            <span>Earnings</span>
        </button>

        <button class="quick peach" onclick="holidays()">
            <span class="qicon">🏖️</span>
            <span>Holidays</span>
        </button>

    </section>


    <!-- FLOWER QUOTE -->

    <div class="quote-image">

        <img
            src="flowers-pink.jpg"
            alt="Pink flowers"
        >

    </div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button class="nav-item active" onclick="home()">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
    </button>

    <button class="nav-item" onclick="schedule()">
        <span class="nav-icon">▣</span>
        <span>Schedule</span>
    </button>

    <button class="nav-item" onclick="clients()">
        <span class="nav-icon">♧</span>
        <span>Clients</span>
    </button>

    <button class="nav-item" onclick="freeTime()">
        <span class="nav-icon">◷</span>
        <span>Free time</span>
    </button>

    <button class="nav-item" onclick="earnings()">
        <span class="nav-icon">▥</span>
        <span>Earnings</span>
    </button>

</nav>

</div>


<script>

function updateDate(){

    const now = new Date();

    const days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];

    document.getElementById("dateText").textContent =
        days[now.getDay()] +
        " " +
        now.getDate() +
        " " +
        months[now.getMonth()];
}

updateDate();


function openSettings(){
    alert("Settings");
}

function addJob(){
    alert("Add cleaning job");
}

function showSchedule(){
    alert("Schedule");
}

function startCleaning(){
    alert("Start cleaning");
}

function clients(){
    alert("Clients");
}

function schedule(){
    alert("Schedule");
}

function freeTime(){
    alert("Find free time");
}

function earnings(){
    alert("Earnings");
}

function holidays(){
    alert("Holidays");
}

function home(){
    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

</script>

</body>
</html>
