<style>
/* FIX — Get Started must always be clickable */
#welcomeScreen {
    position: fixed !important;
    inset: 0 !important;
    z-index: 99999 !important;
    pointer-events: auto !important;
}

#welcomeScreen img,
#welcomeScreen .welcome-background,
#welcomeScreen .decorative-image,
#welcomeScreen .background-image {
    pointer-events: none !important;
}

#welcomeScreen .welcome-content {
    position: relative !important;
    z-index: 100000 !important;
    pointer-events: auto !important;
}

#welcomeScreen .get-started,
#welcomeScreen #getStarted,
#welcomeScreen button {
    position: relative !important;
    z-index: 100001 !important;
    pointer-events: auto !important;
    cursor: pointer !important;
    touch-action: manipulation !important;
}

/* Prevent an invisible image/element from covering the button */
#welcomeScreen::before,
#welcomeScreen::after {
    pointer-events: none !important;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const getStarted =
        document.getElementById("getStarted") ||
        document.querySelector("#welcomeScreen .get-started") ||
        document.querySelector("#welcomeScreen button");

    if (getStarted) {
        getStarted.style.pointerEvents = "auto";
        getStarted.style.position = "relative";
        getStarted.style.zIndex = "100001";

        getStarted.addEventListener("touchend", function (e) {
            e.preventDefault();
            e.stopPropagation();
            startPureShineApp();
        }, { passive: false });

        getStarted.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            startPureShineApp();
        });
    }
});

function startPureShineApp() {
    localStorage.setItem("pureShineStarted", "true");

    const welcome = document.getElementById("welcomeScreen");

    if (welcome) {
        welcome.style.pointerEvents = "none";
        welcome.style.opacity = "0";
        welcome.style.transition = "opacity .35s ease";

        setTimeout(function () {
            welcome.style.display = "none";
            welcome.style.visibility = "hidden";
        }, 350);
    }

    const app = document.getElementById("app");

    if (app) {
        app.style.display = "block";
        app.style.visibility = "visible";
        app.style.opacity = "1";
        app.style.pointerEvents = "auto";
    }

    window.scrollTo(0, 0);
}
</script>
