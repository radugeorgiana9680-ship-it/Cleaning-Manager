<section id="settings" class="page settings-page">

<div class="section-head">
<h2>Settings</h2>
</div>

<!-- APP ZOOM -->
<div class="settings-card">

<h3>App Zoom</h3>

<p>
Adjust the app size. The setting is saved automatically on this device.
</p>

<div class="zoom-box">

<button class="zoom-btn"
onclick="changeZoom(-5)">
−
</button>

<div id="zoomLabel" class="zoom-value">
130%
</div>

<button class="zoom-btn"
onclick="changeZoom(5)">
+
</button>

</div>

<input
id="zoomRange"
class="zoom-range"
type="range"
min="80"
max="200"
step="5"
value="130"
oninput="setAppZoom(this.value)"
>

</div>


<button
class="settings-action primary-action"
onclick="setAppZoom(130)">
↺ Reset Zoom to 130%
</button>


<!-- APP IMAGES -->
<div class="settings-card">

<h3>🎨 App Images</h3>

<p>
Change the images used by your Pure Shine Cleaning app.
</p>


<div class="image-setting">

<div class="image-setting-title">
📱 App Thumbnail / Logo
</div>

<div class="image-preview thumbnail-preview">
<img
id="thumbnailPreview"
alt="App Thumbnail"
>
</div>

<input
id="thumbnailInput"
type="file"
accept="image/*"
onchange="changeAppImage('thumbnail',this)"
>

</div>


<div class="image-setting">

<div class="image-setting-title">
🌸 Welcome Cover
</div>

<div class="image-preview cover-preview">
<img
id="coverPreview"
alt="Welcome Cover"
>
</div>

<input
id="coverInput"
type="file"
accept="image/*"
onchange="changeAppImage('cover',this)"
>

</div>


<div class="image-setting">

<div class="image-setting-title">
✨ Home Banner
</div>

<div class="image-preview banner-preview">
<img
id="bannerPreview"
alt="Home Banner"
>
</div>

<input
id="bannerInput"
type="file"
accept="image/*"
onchange="changeAppImage('banner',this)"
>

</div>

</div>


<button
class="settings-action"
onclick="addJobsToCalendar()">
📅 Add Jobs to iPhone Calendar
</button>


<button
class="settings-action"
onclick="exportData()">
⬇️ Export My Data
</button>


<button
class="settings-action danger-action"
onclick="resetAppData()">
🔄 Reset App Data
</button>

</section>
