<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#f8dce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pure Shine">

<title>Pure Shine Cleaning Manager</title>

<style>

/* =========================================================
   PURE SHINE CLEANING MANAGER
   Complete single-file application
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
    --pink:#e581a1;
    --pink-dark:#b84b6c;
    --pink-light:#f9dce7;
    --pink-soft:#fff1f6;

    --blue:#dfeafa;
    --green:#dff2e6;
    --yellow:#fff0c9;
    --purple:#eadcf8;
    --peach:#ffe1db;

    --text:#171519;
    --muted:#777179;
    --white:#ffffff;

    --shadow:0 5px 22px rgba(156,87,111,.07);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#f7dce8;
    color:var(--text);
    font-family:
        "DM Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

img{
    max-width:100%;
}

.hidden{
    display:none!important;
}


/* =========================================================
   WELCOME
========================================================= */

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;
    background:#f9e8ef;
}

#welcomeBackground{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

#welcomeTint{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            180deg,
            rgba(255,244,248,.02) 0%,
            rgba(255,239,245,.03) 55%,
            rgba(255,220,232,.18) 100%
        );
}

.welcome-content{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:
        max(64px,env(safe-area-inset-top))
        22px
        max(16px,env(safe-area-inset-bottom));
}

.welcome-logo{
    width:min(330px,72vw);
    height:auto;
    aspect-ratio:1;
    object-fit:contain;

    margin-top:2px;

    filter:
        drop-shadow(
            0 7px 15px
            rgba(130,65,90,.15)
        );
}

.welcome-slogan{
    margin-top:2px;

    color:#96516a;

    text-align:center;

    font-family:
        "Parisienne",
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:48px;
    line-height:.94;

    text-shadow:
        0 1px 1px
        rgba(255,255,255,.8);
}

.welcome-heart{
    margin-top:5px;

    color:#c96885;

    font-family:
        "Times New Roman",
        serif;

    font-size:42px;
    line-height:1;
}

.welcome-features{
    width:100%;
    max-width:530px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    margin-top:13px;

    padding:8px 3px;

    border-radius:20px;

    background:
        rgba(255,255,255,.27);

    backdrop-filter:blur(3px);
}

.welcome-feature{
    min-height:90px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#29232a;
}

.welcome-feature svg{
    width:34px;
    height:34px;

    margin-bottom:6px;

    color:#b04e6b;
}

.welcome-feature span{
    font-size:12px;
    line-height:1.15;
}

.welcome-bottom{
    width:100%;
    max-width:510px;

    margin-top:auto;
}

.get-started{
    width:100%;
    height:62px;

    border-radius:34px;

    background:#e27e9e;

    color:#fff;

    font-size:20px;
    font-weight:500;

    box-shadow:
        0 7px 20px
        rgba(179,68,104,.17);
}

.get-started-arrow{
    font-size:29px;
    vertical-align:-2px;
    margin-left:5px;
}

.login-text{
    margin-top:14px;

    text-align:center;

    color:#675e65;

    font-size:15px;
}

.login-text a{
    color:#ad4a69;
    font-weight:700;
    text-decoration:underline;
}


/* =========================================================
   APP
========================================================= */

#app{
    display:none;

    min-height:100vh;

    padding-bottom:
        calc(88px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            180deg,
            #fffafd 0%,
            #fff4f8 100%
        );
}

.app-width{
    width:100%;
    max-width:560px;

    margin:0 auto;

    padding:
        15px
        18px
        25px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        3px
        1px
        14px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:63px;
    height:63px;

    border-radius:50%;

    object-fit:cover;

    flex:none;
}

.brand-title{
    font-size:22px;
    font-weight:700;

    letter-spacing:-.7px;

    line-height:1;
}

.brand-subtitle{
    margin-top:5px;

    color:#716970;

    font-size:14px;
}

.settings-button{
    width:47px;
    height:47px;

    border-radius:50%;

    background:#fff;

    color:#151419;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 5px 17px
        rgba(140,77,98,.07);
}

.settings-button svg{
    width:25px;
    height:25px;
}


/* =========================================================
   DATE CARD
========================================================= */

.date-card{
    position:relative;
    overflow:hidden;

    min-height:83px;

    border-radius:20px;

    margin-bottom:17px;

    padding:
        15px
        55px
        14px
        18px;

    background:
        linear-gradient(
            90deg,
            rgba(250,213,226,.97),
            rgba(249,219,231,.87)
        ),
        url("pure-shine-cleaning-background.png");

    background-size:cover;
    background-position:center;
}

.date-title{
    font-size:16px;
    font-weight:700;
}

.date-subtitle{
    margin-top:4px;

    color:#6d646b;

    font-size:14px;
}

.date-heart{
    position:absolute;

    right:18px;
    top:17px;

    color:#c75c7c;

    font-family:
        "Times New Roman",
        serif;

    font-size:34px;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:8px;
}

.stat{
    min-height:119px;

    border-radius:19px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.stat-jobs{
    background:#fbdce7;
}

.stat-hours{
    background:#e3e6fb;
}

.stat-earned{
    background:#def2e5;
}

.stat-free{
    background:#fff0c9;
}

.stat-icon{
    width:28px;
    height:28px;

    margin-bottom:7px;
}

.stat-jobs .stat-icon{
    color:#792943;
}

.stat-hours .stat-icon{
    color:#1c294b;
}

.stat-earned .stat-icon{
    color:#286c4b;
}

.stat-free .stat-icon{
    color:#98731c;
}

.stat-number{
    font-size:20px;
    font-weight:700;

    line-height:1;
}

.stat-name{
    margin-top:5px;

    font-size:13px;
}


/* =========================================================
   SECTION
========================================================= */

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:
        20px
        2px
        11px;
}

.section-header h2{
    margin:0;

    font-size:20px;
    font-weight:700;

    letter-spacing:-.5px;
}

.see-all{
    background:transparent;

    color:#ae4264;

    font-size:14px;
    font-weight:700;
}


/* =========================================================
   TODAY
========================================================= */

.today-card{
    background:#fff;

    border-radius:20px;

    padding:12px;

    min-height:215px;

    box-shadow:var(--shadow);
}

.empty-today{
    min-height:190px;

    border-radius:17px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:15px;
}

.empty-clean-icon{
    width:62px;
    height:62px;

    color:#e5849f;

    margin-bottom:4px;
}

.empty-title{
    font-size:17px;
    font-weight:500;
}

.empty-subtitle{
    margin-top:4px;

    color:#827981;

    font-size:14px;
}

.add-cleaning-button{
    width:100%;
    height:51px;

    margin-top:15px;

    border-radius:28px;

    background:#e57d9d;

    color:#fff;

    font-size:16px;
}


/* =========================================================
   TODAY JOB
========================================================= */

.today-job{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px;

    margin-bottom:8px;

    border-radius:17px;
}

.today-job:last-child{
    margin-bottom:0;
}

.today-job:nth-child(odd){
    background:#fde4ed;
}

.today-job:nth-child(even){
    background:#e5f0fc;
}

.today-job-name{
    font-weight:700;
}

.today-job-info{
    margin-top:4px;

    color:#777;

    font-size:12px;
}

.today-job-money{
    color:#ad4d6b;

    font-size:17px;
    font-weight:700;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-title{
    margin:
        19px
        2px
        11px;

    font-size:20px;

    letter-spacing:-.5px;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;
}

.quick-button{
    height:64px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    font-size:14px;
    font-weight:500;
}

.quick-button svg{
    width:27px;
    height:27px;
}

.quick-blue{
    background:var(--blue);
    color:#19508a;
}

.quick-green{
    background:var(--green);
    color:#246f4f;
}

.quick-pink{
    background:#f9dbe7;
    color:#7c2747;
}

.quick-yellow{
    background:var(--yellow);
    color:#181818;
}

.quick-purple{
    background:var(--purple);
    color:#632d8d;
}

.quick-peach{
    background:var(--peach);
    color:#a74b39;
}


/* =========================================================
   QUOTE IMAGE
========================================================= */

.quote-card{
    position:relative;
    overflow:hidden;

    height:116px;

    margin-top:17px;

    border-radius:18px;

    background:
        linear-gradient(
            90deg,
            rgba(250,218,229,.94),
            rgba(250,224,234,.63)
        ),
        url("pure-shine-cleaning-background.png");

    background-size:cover;
    background-position:center;
}

.quote-card:after{
    content:"🌸";

    position:absolute;

    right:-4px;
    bottom:-22px;

    font-size:82px;

    opacity:.62;
}

.quote-heart-left,
.quote-heart-right{
    position:absolute;

    color:#d27a91;

    font-family:
        "Times New Roman",
        serif;

    font-size:31px;
}

.quote-heart-left{
    left:20px;
    top:37px;
}

.quote-heart-right{
    right:138px;
    bottom:20px;
}

.quote-text{
    position:absolute;

    left:57px;
    right:82px;
    top:23px;

    text-align:center;

    color:#98556b;

    font-family:
        "Parisienne",
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:30px;

    line-height:.92;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;

    z-index:3000;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:min(560px,100%);

    height:
        calc(80px + env(safe-area-inset-bottom));

    padding-bottom:
        env(safe-area-inset-bottom);

    display:grid;
    grid-template-columns:repeat(5,1fr);

    background:
        rgba(255,255,255,.97);

    border-top:
        1px solid #eee4e9;

    backdrop-filter:blur(15px);
}

.nav-button{
    position:relative;

    border:0;

    background:transparent;

    color:#777a82;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:10px;
}

.nav-button svg{
    width:27px;
    height:27px;
}

.nav-button.active{
    color:#bb496b;
}

.nav-button.active:before{
    content:"";

    position:absolute;

    width:63px;
    height:51px;

    border-radius:15px;

    background:#f9dce8;

    z-index:-1;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;

    z-index:10000;

    display:none;
    align-items:flex-end;

    background:
        rgba(28,19,24,.39);

    backdrop-filter:blur(4px);
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:560px;

    max-height:92vh;

    overflow:auto;

    margin:auto;

    padding:
        20px
        18px
        32px;

    border-radius:
        29px
        29px
        0
        0;

    background:#fff9fb;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:17px;
}

.modal-header h2{
    margin:0;

    font-size:23px;

    letter-spacing:-.5px;
}

.close-button{
    width:43px;
    height:43px;

    border-radius:50%;

    background:#f4e7ed;

    color:#a13d5f;

    font-size:26px;
}

.form-label{
    display:block;

    margin:
        12px
        0
        6px;

    font-size:13px;
    font-weight:700;
}

.form-input,
.form-select{
    width:100%;
    height:49px;

    padding:0 12px;

    border:
        1px solid
        #e6dbe1;

    border-radius:14px;

    background:#fff;

    outline:none;
}

.form-input:focus,
.form-select:focus{
    border-color:#e28aa5;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:9px;
}

.modal-main-button{
    width:100%;
    height:51px;

    margin-top:17px;

    border-radius:27px;

    background:#e47e9d;

    color:#fff;

    font-weight:700;
}

.modal-secondary{
    padding:9px 12px;

    border-radius:13px;

    background:#f1e9ef;

    color:#87536a;

    font-weight:700;
}

.modal-danger{
    background:#fff0f3;
    color:#b93059;
}


/* =========================================================
   INNER PAGES
========================================================= */

.page{
    padding-bottom:20px;
}

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:16px;
}

.page-top h2{
    margin:0;

    font-size:27px;

    letter-spacing:-.7px;
}

.page-top button{
    padding:9px 12px;

    border-radius:13px;

    background:#f9dce7;

    color:#a84162;

    font-weight:700;
}

.white-card{
    background:#fff;

    border-radius:20px;

    padding:16px;

    margin-bottom:9px;

    box-shadow:var(--shadow);
}

.day-title{
    font-size:16px;
    font-weight:700;

    margin-bottom:9px;
}

.schedule-client{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        11px
        0;

    border-top:
        1px solid
        #eee7eb;
}

.schedule-client:first-child{
    border-top:0;
}

.schedule-client-name{
    font-weight:700;
}

.schedule-client-details{
    color:#777;

    font-size:12px;

    margin-top:3px;
}

.client-card{
    background:#fff;

    border-radius:20px;

    padding:15px;

    margin-bottom:9px;

    box-shadow:var(--shadow);
}

.client-line{
    display:flex;
    align-items:center;
    gap:11px;
}

.client-avatar{
    width:48px;
    height:48px;

    flex:none;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f9dce7;

    color:#a44564;

    font-weight:700;
}

.client-info{
    flex:1;
}

.client-info strong{
    display:block;
}

.client-info small{
    display:block;

    margin-top:4px;

    color:#777;
}

.client-rate{
    color:#af4d6c;

    font-weight:700;
}

.client-actions{
    display:flex;
    flex-wrap:wrap;

    gap:7px;

    margin-top:11px;
}

.badge{
    display:inline-block;

    padding:4px 7px;

    border-radius:9px;

    font-size:10px;
    font-weight:700;
}

.badge-private{
    background:#ffe0eb;
    color:#8a3152;
}

.badge-agency{
    background:#dceefa;
    color:#28617e;
}

.history-card{
    background:#fff;

    border-radius:19px;

    padding:15px;

    margin-bottom:9px;

    box-shadow:var(--shadow);
}

.history-top{
    display:flex;
    justify-content:space-between;

    gap:12px;
}

.history-client{
    font-weight:700;
}

.history-date{
    color:#777;

    font-size:12px;

    margin-top:4px;
}

.history-money{
    color:#ad4b6b;

    font-weight:700;
}

.history-actions{
    display:flex;
    gap:7px;

    margin-top:10px;
}

.total-card{
    background:#eadcf8;

    border-radius:22px;

    text-align:center;

    padding:24px;

    margin-bottom:10px;
}

.total-card small{
    color:#756a7b;
}

.total-card strong{
    display:block;

    margin-top:4px;

    font-size:39px;
}

.free-total{
    background:#fff0c9;

    border-radius:22px;

    text-align:center;

    padding:28px;

    margin-bottom:11px;
}

.free-total strong{
    display:block;

    font-size:41px;
}

.free-slot{
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#fff;

    border-radius:17px;

    padding:14px;

    margin-bottom:8px;

    box-shadow:var(--shadow);
}

.free-slot small{
    display:block;

    color:#777;

    margin-top:4px;
}

.setting-list{
    display:flex;
    flex-direction:column;

    gap:9px;
}

.setting-row{
    display:flex;
    align-items:center;

    gap:12px;

    background:#fff;

    border-radius:18px;

    padding:14px;

    box-shadow:var(--shadow);
}

.setting-icon{
    width:45px;
    height:45px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex:none;

    background:#ffe0eb;

    color:#b34868;

    font-size:21px;
}

.setting-copy{
    flex:1;
}

.setting-copy strong{
    display:block;
}

.setting-copy small{
    display:block;

    color:#7b7379;

    margin-top:3px;
}

.switch{
    width:45px;
    height:25px;

    border-radius:20px;

    background:#e3dce1;

    position:relative;
}

.switch:after{
    content:"";

    position:absolute;

    width:19px;
    height:19px;

    top:3px;
    left:3px;

    border-radius:50%;

    background:#fff;

    transition:.2s;
}

.switch.on{
    background:#e583a1;
}

.switch.on:after{
    left:23px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

    .app-width{
        padding-left:14px;
        padding-right:14px;
    }

    .brand-logo{
        width:57px;
        height:57px;
    }

    .brand-title{
        font-size:20px;
    }

    .brand-subtitle{
        font-size:13px;
    }

    .stats{
        gap:6px;
    }

    .stat{
        min-height:106px;
    }

    .stat-number{
        font-size:17px;
    }

    .stat-name{
        font-size:11px;
    }

    .welcome-slogan{
        font-size:42px;
    }

    .welcome-feature{
        min-height:79px;
    }

    .welcome-feature span{
        font-size:10.5px;
    }

    .welcome-feature svg{
        width:30px;
        height:30px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     WELCOME SCREEN
======================================================= -->

<section id="welcomeScreen">

    <img
        id="welcomeBackground"
        src="pure-shine-cleaning-background.png"

/* =========================================================
   BASIC HELPERS
========================================================= */

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function minutes(value){

    if(
        !value ||
        !String(value).includes(":")
    ){
        return 0;
    }

    const p =
        String(value)
            .split(":")
            .map(Number);

    return (
        (p[0] || 0)*60
    ) +
    (p[1] || 0);
}


function durationHours(start,end){

    return Math.max(
        0,
        minutes(end)-minutes(start)
    )/60;
}


function durationText(hours){

    const total =
        Math.round(
            Number(hours || 0)*60
        );

    const h =
        Math.floor(total/60);

    const m =
        total%60;

    return `${h}h ${m}m`;
}


function money(value){

    return "£" +
        Number(value || 0)
            .toFixed(2);
}


function todayKey(){

    const d=new Date();

    const y=d.getFullYear();

    const m=String(
        d.getMonth()+1
    ).padStart(2,"0");

    const day=String(
        d.getDate()
    ).padStart(2,"0");

    return `${y}-${m}-${day}`;
}


function weekday(date){

    return new Date(
        date+"T12:00:00"
    )
    .toLocaleDateString(
        "en-GB",
        {weekday:"long"}
    );
}


function niceDate(date){

    return new Date(
        date+"T12:00:00"
    )
    .toLocaleDateString(
        "en-GB",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );
}


function shortDate(date){

    if(!date){
        return "";
    }

    return new Date(
        date+"T12:00:00"
    )
    .toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}


function formatMinutes(value){

    const h =
        Math.floor(
            value/60
        );

    const m =
        value%60;

    return (
        String(h).padStart(2,"0")
        +
        ":"
        +
        String(m).padStart(2,"0")
    );
}


function getClient(id){

    return clients.find(
        c =>
            Number(c.id) ===

function clientName(id){

function getTodayClients(){

    const day =
        new Date()
            .toLocaleDateString(
                "en-GB",
                {weekday:"long"}
            );


    return clients
        .filter(
            client=>{

                if(client.day!==day){
                    return false;
                }

                if(
                    client.frequency==="Occasional"
                ){
                    return false;
                }

                if(
                    client.frequency==="Fortnightly"
                ){

                    return currentWeek==="A";

                }

                if(
                    client.frequency==="Every 3 weeks"
                ){

                    return currentWeek==="A";

                }

                return true;

            }
        )
        .sort(
            (a,b)=>
                minutes(a.start)-
                minutes(b.start)
        );
}

function saveNewJob(){

    const clientId =
        Number(
            document
                .getElementById(
                    "newJobClient"
                )
                .value
        );


    const client =
        getClient(clientId);


    const date =
        document
            .getElementById(
                "newJobDate"
            )
            .value;


    const start =
        document
            .getElementById(
                "newJobStart"
            )
            .value;


    const end =
        document
            .getElementById(
                "newJobEnd"
            )
            .value;


    const status =
        document
            .getElementById(
                "newJobStatus"
            )
            .value;


    let price =
        Number(
            document
                .getElementById(
                    "newJobPrice"
                )
                .value
        );


    if(
        !client ||
        !date ||
        !start ||
        !end
    ){

        alert(
            "Please complete all fields."
        );

        return;
    }


    if(
        minutes(end)<=
        minutes(start)
    ){

        alert(
            "End time must be after start time."
        );

        return;
    }


    if(!price){

        price =
            durationHours(
                start,
                end
            ) *
            Number(client.rate||0);

    }


    jobs.push({

        id:Date.now(),

        clientId:client.id,

        client:client.name,

        date,

        start,

        end,

        rate:Number(client.rate||0),

        price,

        amount:price,

        status

    });


    save();

    closeModal();

    showSchedule();

}

function saveEditedJob(id){

    const job =
        jobs.find(
            j=>Number(j.id)===Number(id)
        );


    if(!job){
        return;
    }


    job.clientId =
        Number(
            document
                .getElementById(
                    "editJobClient"
                )
                .value
        );


    const client =
        getClient(job.clientId);


    job.client =
        client
            ?client.name
            :job.client;


    job.date =
        document
            .getElementById(
                "editJobDate"
            )
            .value;


    job.start =
        document
            .getElementById(
                "editJobStart"
            )
            .value;


    job.end =
        document
            .getElementById(
                "editJobEnd"
            )
            .value;


    job.price =
        Number(
            document
                .getElementById(
                    "editJobPrice"
                )
                .value
        );


    job.amount =
        job.price;


    job.status =
        document
            .getElementById(
                "editJobStatus"
            )
            .value;


    save();

    closeModal();

    showSchedule();

}


function deleteJob(id){

    if(
        !confirm(
            "Delete this job from your history?"
        )
    ){
        return;
    }


    jobs =
        jobs.filter(
            j =>
                Number(j.id)!==
                Number(id)
        );


    save();

    showSchedule();

}

function saveClient(id){

    const name =
        document
            .getElementById(
                "clientName"
            )
            .value
            .trim();


    const type =
        document
            .getElementById(
                "clientType"
            )
            .value;


    const rate =
        Number(
            document
                .getElementById(
                    "clientRate"
                )
                .value
        );


    const day =
        document
            .getElementById(
                "clientDay"
            )
            .value;


    const start =
        document
            .getElementById(
                "clientStart"
            )
            .value;


    const end =
        document
            .getElementById(
                "clientEnd"
            )
            .value;


    const frequency =
        document
            .getElementById(
                "clientFrequency"
            )
            .value;


    if(!name){

        alert(
            "Please enter the client name."
        );

        return;
    }


    const object={

        id:
            id ||
            Date.now(),

        name,

        type,

        rate,

        day,

        start,

        end,

        frequency

    };


    if(id){

        const index =
            clients.findIndex(
                c =>
                    Number(c.id)===
                    Number(id)
            );


        if(index>=0){

            clients[index]={
                ...clients[index],
                ...object
            };

        }

    }else{

        clients.push(object);

    }


    save();

    closeModal();

    showClients();

}

function showFreeTime(){

    activateNav("free");


    const app =
        document.getElementById(

    app.innerHTML = `

        <div class="page">


            <div class="page-top">

                <h2>
                    Free time
                </h2>

            </div>


            <div class="white-card">

                <label class="form-label">
                    Choose date
                </label>

                <input
                    class="form-input"
                    id="freeDate"
                    type="date"
                    value="${todayKey()}"
                    onchange="calculateFreeTimePage()"
                >

            </div>


            <div id="freeTimePageResults">
            </div>

        </div>

    `;


    calculateFreeTimePage();

}


function calculateFreeTimePage(){

    const input =
        document.getElementById(
            "freeDate"
        );


    const result =
        document.getElementById(
            "freeTimePageResults"
        );


    if(!input || !result){
        return;
    }


    const date =
        input.value;


    const day =
        weekday(date);


    const scheduled =
        clients
            .filter(
                client=>
                    client.day===day &&
                    client.frequency!=="Occasional"
            )
            .sort(
                (a,b)=>
                    minutes(a.start)-
                    minutes(b.start)
            );


    const startDay=8*60;
    const endDay=18*60;

    let cursor=startDay;

    const gaps=[];


    scheduled.forEach(
        client=>{

            const start =
                minutes(client.start);

            const end =
                minutes(client.end);


            if(start>cursor){

                gaps.push({
                    start:cursor,
                    end:start
                });

            }


            cursor=
                Math.max(
                    cursor,
                    end
                );

        }
    );


    if(cursor<endDay){

        gaps.push({
            start:cursor,
            end:endDay
        });

    }


    result.innerHTML = `

        <div class="free-total">

            <small>
                Available time on ${day}
            </small>

            <strong>
                ${durationText(
                    gaps.reduce(
                        (sum,gap)=>
                            sum+
                            (gap.end-gap.start)/60,
                        0
                    )
                )}
            </strong>

        </div>


        ${
            gaps.length

            ?

            gaps
                .map(
                    gap=>`

                        <div class="free-slot">

                            <div>

                                <strong>
                                    ${formatMinutes(gap.start)}
                                    –
                                    ${formatMinutes(gap.end)}
                                </strong>

                                <small>
                                    ${durationText(
                                        (gap.end-gap.start)/60
                                    )}
                                </small>

                            </div>


                            <button
                                class="modal-secondary"
                                onclick="
                                    openAddJob({
                                        date:'${date}',
                                        start:'${formatMinutes(gap.start)}',
                                        end:'${formatMinutes(gap.end)}'
                                    });
                                ">

                                ＋ Add

                            </button>

                        </div>

                    `
                )
                .join("")

            :

            `
                <div
                    class="white-card"
                    style="
                        text-align:center;
                        color:#888;
                    ">

                    No free time found.

                </div>
            `
        }

    `;

}

/* =========================================================
   TIMER
========================================================= */

let timerStart=null;
let timerInterval=null;


function openTimer(){

    openModal(`

        <div class="modal-header">

            <h2>
                Start cleaning
            </h2>

            <button
                class="close-button"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <label class="form-label">
            Client
        </label>

        <select
            class="form-select"
            id="timerClient">

            ${
                clients.map(
                    client=>`

                        <option
                            value="${client.id}">

                            ${esc(client.name)}

                        </option>

                    `
                ).join("")
            }

        </select>


        <div
            id="timerDisplay"
            style="
                text-align:center;
                font-size:46px;
                font-weight:700;
                padding:30px 0;
            ">

            00:00:00

        </div>


        <button
            class="modal-main-button"
            id="timerButton"
            onclick="toggleTimer()">

            Start timer

        </button>

    `);

}


function toggleTimer(){

    const button =
        document.getElementById(
            "timerButton"
        );


    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

        button.textContent =
            "Start timer";

        return;

    }


    timerStart=Date.now();

    button.textContent =
        "Stop timer";


    timerInterval =
        setInterval(
            updateTimer,
            500
        );

}


function updateTimer(){

    if(!timerStart){
        return;
    }


    const seconds =
        Math.floor(
            (Date.now()-timerStart)/1000
        );


    const h =
        Math.floor(
            seconds/3600
        );

    const m =
        Math.floor(
            (seconds%3600)/60
        );

    const s =
        seconds%60;


    const display =
        document.getElementById(
            "timerDisplay"
        );


    if(display){

        display.textContent =
            [
                h,
                m,
                s
            ]
            .map(
                n=>
                    String(n)
                        .padStart(2,"0")
            )
            .join(":");

    }

}

/* =========================================================
   MODAL
========================================================= */

function openModal(html){

    document
        .getElementById(
            "modal"
        )
        .innerHTML=html;


    document
        .getElementById(
            "modalOverlay"
        )
        .classList.add("show");
}


function closeModal(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

    }


    document
        .getElementById(
            "modalOverlay"
        )
        .classList.remove("show");

}


document
    .getElementById(
        "modalOverlay"
    )
    .addEventListener(
        "click",
        event=>{

            if(
                event.target.id===
                "modalOverlay"
            ){

                closeModal();

            }

        }
    );


/* =========================================================
   INITIALISE
========================================================= */

save();

if(
    document
        .getElementById("app")
        .style.display==="block"
){

    showHome();

}


/*
   If returning user, render immediately.
*/

if(
    localStorage.getItem(
        "pureShineWelcomeSeen"
    )==="1"
){

    showHome();

}


/* Apply saved zoom without changing data. */

if(appZoom!==100){

    setTimeout(
        ()=>{

                );

            if(content){

                    appZoom/100;
            }
        },

    );
