<!-- RESTORE THE ORIGINAL PURE SHINE PREFACE -->

<style>
#pureShineIntro{
    position:fixed;
    inset:0;
    z-index:999999;
    width:100%;
    height:100dvh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            180deg,
            rgba(255,236,245,.35),
            rgba(255,248,238,.38)
        ),
        url("pure-shine-cleaning-background.png")
        center center / cover no-repeat;

    padding:
        calc(env(safe-area-inset-top) + 20px)
        20px
        calc(env(safe-area-inset-bottom) + 20px);
}

#pureShineIntro::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            180deg,
            rgba(255,218,234,.22),
            rgba(255,250,242,.32)
        );
    pointer-events:none;
}

.intro-card{
    position:relative;
    z-index:2;

    width:min(430px,100%);
    max-height:calc(100dvh - 40px);

    overflow:auto;

    padding:30px 22px 24px;

    border-radius:32px;

    background:rgba(255,255,255,.70);

    border:1px solid
        rgba(255,255,255,.75);

    box-shadow:
        0 25px 70px rgba(100,50,75,.18);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    text-align:center;
}

.intro-logo{
    width:145px;
    height:145px;

    margin:0 auto 18px;

    border-radius:50%;

    object-fit:cover;

    background:#fff;

    box-shadow:
        0 15px 35px rgba(120,60,90,.18);
}

.intro-title{
    margin:0;

    font-family:
        "Snell Roundhand",
        "Segoe Script",
        cursive;

    font-size:38px;
    line-height:1.05;
    font-weight:700;

    color:#b94f7d;
}

.intro-subtitle{
    margin-top:8px;

    font-size:21px;
    font-weight:800;

    color:#302932;
}

.intro-description{
    margin:13px auto 20px;

    max-width:350px;

    font-size:14px;
    line-height:1.5;

    color:#817883;
}

.intro-features{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

    margin-bottom:22px;
}

.intro-feature{
    min-height:105px;

    border-radius:22px;

    padding:15px 8px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border:1px solid
        rgba(255,255,255,.8);
}

.intro-feature:nth-child(1){
    background:#f8dce8;
}

.intro-feature:nth-child(2){
    background:#dfe5f5;
}

.intro-feature:nth-child(3){
    background:#dceee4;
}

.intro-feature:nth-child(4){
    background:#f8e9c9;
}

.intro-icon{
    font-size:30px;
    line-height:1;
    margin-bottom:8px;
}

.intro-feature strong{
    font-size:14px;
    font-weight:800;
}

.intro-button{
    width:100%;

    padding:16px 20px;

    border:0;
    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #e99ab9,
            #c76591
        );

    color:white;

    font-size:17px;
    font-weight:850;

    box-shadow:
        0 12px 25px
        rgba(185,79,125,.25);

    -webkit-tap-highlight-color:transparent;
}

.intro-login{
    margin-top:15px;

    font-size:13px;
    color:#817883;
}

.intro-login button{
    background:none;
    border:0;

    color:#b94f7d;

    font-weight:800;

    padding:4px;
}

@media(max-height:700px){

    .intro-card{
        padding:20px 18px;
    }

    .intro-logo{
        width:105px;
        height:105px;
        margin-bottom:12px;
    }

    .intro-title{
        font-size:31px;
    }

    .intro-subtitle{
        font-size:18px;
    }

    .intro-description{
        margin:9px auto 13px;
    }

    .intro-feature{
        min-height:78px;
        padding:10px 5px;
    }

    .intro-icon{
        font-size:24px;
        margin-bottom:5px;
    }
}
</style>


<div id="pureShineIntro">

    <div class="intro-card">

        <img
            class="intro-logo"
            src="1D0A5974-7253-48B0-8BCA-2272594D29F0.png"
            alt="Pure Shine Cleaning"
        >

        <h1 class="intro-title">
            Pure Shine Cleaning ♡
        </h1>

        <h2 class="intro-subtitle">
            Your Cleaning Business, Simplified
        </h2>

        <p class="intro-description">
            Manage your cleaning jobs, clients, schedule and earnings
            all in one beautiful place.
        </p>


        <div class="intro-features">

            <div class="intro-feature">
                <div class="intro-icon">🧹</div>
                <strong>Manage Jobs</strong>
            </div>

            <div class="intro-feature">
                <div class="intro-icon">♧</div>
                <strong>Keep Track of Clients</strong>
            </div>

            <div class="intro-feature">
                <div class="intro-icon">£</div>
                <strong>Track Earnings</strong>
            </div>

            <div class="intro-feature">
                <div class="intro-icon">♡</div>
                <strong>More Time for You</strong>
            </div>

        </div>


        <button
            class="intro-button"
            onclick="enterPureShineApp()"
        >
            Get Started ›
        </button>


        <div class="intro-login">
            Already have an account?
            <button onclick="enterPureShineApp()">
                Log in
            </button>
        </div>

    </div>

</div>


<script>
function enterPureShineApp(){

    localStorage.setItem(
        "ps_intro_seen",
        "true"
    );

    const intro=
        document.getElementById(
            "pureShineIntro"
        );

    if(intro){

        intro.style.opacity="0";
        intro.style.transition="opacity .25s ease";

        setTimeout(function(){

            intro.style.display="none";

        },250);

    }

}


function showPureShineIntro(){

    const intro=
        document.getElementById(
            "pureShineIntro"
        );

    if(intro){

        intro.style.display="flex";
        intro.style.opacity="1";

    }

}


document.addEventListener(
    "DOMContentLoaded",
    function(){

        if(
            localStorage.getItem(
                "ps_intro_seen"
            )==="true"
        ){

            const intro=
                document.getElementById(
                    "pureShineIntro"
                );

            if(intro){
                intro.style.display="none";
            }

        }

    }
);
</script>
