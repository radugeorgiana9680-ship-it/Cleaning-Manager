<style>
.app-logo,
.logo-ring img,
.brand img,
#appLogo {
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  width:100% !important;
  height:100% !important;
  min-width:0 !important;
  min-height:0 !important;
  object-fit:cover !important;
  object-position:center !important;
}

.logo-ring {
  overflow:hidden !important;
}

.brand img {
  width:58px !important;
  height:58px !important;
  border-radius:50% !important;
  object-fit:cover !important;
}
</style>

<script>
/* FIX IMAGE LOADING */
(function(){
  const logo = document.getElementById('appLogo');

  if (logo) {
    logo.style.display = 'block';
    logo.style.visibility = 'visible';
    logo.style.opacity = '1';
  }

  /* Do not overwrite the built-in logo unless the user selected
     a custom logo from Settings. */
  const savedLogo = localStorage.getItem('pure_shine_thumbnail_image');

  if (savedLogo) {
    document.querySelectorAll('.logo-ring img, .brand img, #appLogo')
      .forEach(img => {
        img.src = savedLogo;
        img.style.display = 'block';
        img.style.visibility = 'visible';
        img.style.opacity = '1';
      });
  }
})();
</script>
