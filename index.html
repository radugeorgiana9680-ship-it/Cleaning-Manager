<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f9e2eb">
<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
  --pink:#e783a2;
  --pink2:#f8dbe7;
  --pink3:#fff0f5;
  --blue:#e2ebfa;
  --green:#dff2e6;
  --yellow:#fff0c9;
  --purple:#eadcf8;
  --peach:#ffe2dc;
  --text:#161419;
  --muted:#777179;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#f8dce7;
  color:var(--text);
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
}

.hidden{
  display:none!important;
}


/* =========================================================
   WELCOME — STRUCTURE MATCHES LEFT PHONE
========================================================= */

#welcome{
  position:fixed;
  inset:0;
  z-index:99999;
  overflow:hidden;
  background:#f7e2e9;
}

#welcomePhoto{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

#welcome:after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,241,247,.16);
}

.welcome-content{
  position:relative;
  z-index:2;
  height:100%;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    max(35px,env(safe-area-inset-top))
    30px
    max(20px,env(safe-area-inset-bottom));
}

.welcome-logo{
  width:min(365px,72vw);
  height:min(365px,72vw);
  object-fit:contain;
  margin-top:3px;
}

.welcome-script{
  margin-top:0;
  text-align:center;
  color:#99546c;
  font-family:"Parisienne","Brush Script MT","Segoe Script",cursive;
  font-size:clamp(43px,10.8vw,62px);
  line-height:.88;
}

.welcome-heart{
  margin-top:8px;
  color:#c76b87;
  font-family:Georgia,serif;
  font-size:43px;
  line-height:1;
}

.welcome-features{
  width:100%;
  max-width:540px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin-top:13px;
  padding:7px 2px;
  border-radius:19px;
  background:rgba(255,255,255,.32);
}

.feature{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:90px;
  color:#272126;
}

.feature svg{
  width:35px;
  height:35px;
  margin-bottom:7px;
  color:#ae506c;
}

.feature span{
  font-size:12px;
  line-height:1.12;
}

.welcome-bottom{
  width:100%;
  margin-top:auto;
  max-width:520px;
}

.get-started{
  width:100%;
  height:65px;
  border-radius:34px;
  background:#e27d9c;
  color:white;
  font-size:20px;
  font-weight:500;
  box-shadow:0 8px 18px rgba(178,72,104,.17);
}

.login{
  text-align:center;
  margin-top:15px;
  color:#655d63;
  font-size:15px;
}

.login a{
  color:#a84765;
  font-weight:700;
  text-decoration:underline;
}


/* =========================================================
   APPLICATION
========================================================= */

#app{
  display:none;
  min-height:100vh;
  background:
    linear-gradient(
      180deg,
      #fffafd 0%,
      #fff6f9 100%
    );
  padding-bottom:88px;
}

.container{
  width:100%;
  max-width:540px;
  margin:auto;
  padding:10px 17px 25px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  height:79px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:61px;
  height:61px;
  object-fit:contain;
}

.brand-title{
  font-size:21px;
  font-weight:700;
  line-height:1;
  letter-spacing:-.5px;
}

.brand-sub{
  color:#746d73;
  font-size:14px;
  margin-top:6px;
}

.settings{
  width:47px;
  height:47px;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 20px rgba(133,75,97,.08);
}

.settings svg{
  width:24px;
  height:24px;
}


/* =========================================================
   DATE CARD
========================================================= */

.date-card{
  position:relative;
  min-height:82px;
  border-radius:20px;
  background:#f8d9e6;
  padding:16px 60px 13px 18px;
}

.date-title{
  font-size:16px;
  font-weight:700;
}

.date-sub{
  color:#746d73;
  margin-top:5px;
  font-size:14px;
}

.date-heart{
  position:absolute;
  right:18px;
  top:13px;
  font-family:Georgia,serif;
  color:#c95f7c;
  font-size:39px;
}


/* =========================================================
   FOUR STAT CARDS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:17px;
}

.stat{
  height:119px;
  border-radius:19px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stat.jobs{background:#f9dce7}
.stat.hours{background:#e1e7fa}
.stat.earned{background:#def1e5}
.stat.available{background:#fff0c9}

.stat svg{
  width:29px;
  height:29px;
  margin-bottom:8px;
}

.jobs svg{color:#742642}
.hours svg{color:#182642}
.earned svg{color:#2d7451}
.available svg{color:#99731c}

.stat-value{
  font-size:18px;
  font-weight:700;
  line-height:1;
}

.stat-label{
  margin-top:6px;
  font-size:13px;
}


/* =========================================================
   SECTION
========================================================= */

.heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:21px 2px 10px;
}

.heading h2{
  margin:0;
  font-size:20px;
  letter-spacing:-.4px;
}

.heading button{
  background:none;
  color:#ad4665;
  font-weight:700;
}


/* =========================================================
   TODAY'S SCHEDULE
========================================================= */

.schedule-card{
  background:white;
  border-radius:20px;
  padding:10px;
  box-shadow:0 5px 20px rgba(130,73,95,.07);
}

.empty{
  min-height:195px;
  display:flex;
  align-items:center;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}

.empty svg{
  width:63px;
  height:63px;
  color:#e4839f;
  margin-bottom:6px;
}

.empty-title{
  font-size:17px;
}

.empty-sub{
  color:#817981;
  font-size:14px;
  margin-top:4px;
}

.add{
  height:52px;
  width:100%;
  margin-top:15px;
  border-radius:28px;
  background:#e47e9d;
  color:white;
  font-size:16px;
}

.home-job{
  border-radius:16px;
  padding:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
}

.home-job:nth-child(odd){
  background:#f9dce7;
}

.home-job:nth-child(even){
  background:#e2ebfa;
}

.home-job:last-child{
  margin-bottom:0;
}

.home-job-name{
  font-weight:700;
}

.home-job-time{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.home-job-money{
  color:#ad4c69;
  font-weight:700;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-heading{
  margin:20px 2px 10px;
  font-size:20px;
}

.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.quick{
  height:64px;
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  font-size:14px;
}

.quick svg{
  width:27px;
  height:27px;
}

.q-blue{
  background:#dfebfa;
  color:#175087;
}

.q-green{
  background:#dff2e6;
  color:#23704e;
}

.q-pink{
  background:#f9dce7;
  color:#7b2949;
}

.q-yellow{
  background:#fff0c9;
  color:#111;
}

.q-purple{
  background:#eadcf8;
  color:#652c8e;
}

.q-peach{
  background:#ffe1db;
  color:#a74c3e;
}


/* =========================================================
   QUOTE / CLEANING IMAGE
========================================================= */

.quote{
  position:relative;
  height:117px;
  margin-top:17px;
  border-radius:18px;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      rgba(250,215,229,.95),
      rgba(250,224,234,.65)
    ),
    url("pure-shine-cleaning-background.png");
  background-size:cover;
  background-position:center bottom;
}

.quote:after{
  content:"";
  position:absolute;
  right:-7px;
  bottom:-5px;
  width:115px;
  height:115px;
  background:
    radial-gradient(
      circle,
      rgba(235,123,154,.82) 0 8px,
      transparent 9px 20px,
      rgba(242,139,166,.62) 21px 29px,
      transparent 30px
    );
  opacity:.6;
}

.quote-text{
  position:absolute;
  z-index:3;
  left:54px;
  right:92px;
  top:22px;
  text-align:center;
  color:#98546c;
  font-family:"Parisienne","Brush Script MT",cursive;
  font-size:30px;
  line-height:.9;
}

.quote-heart{
  position:absolute;
  z-index:4;
  font-family:Georgia,serif;
  color:#d17891;
  font-size:34px;
}

.quote-heart.left{
  left:18px;
  top:36px;
}

.quote-heart.right{
  right:119px;
  bottom:17px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.nav{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(540px,100%);
  height:79px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.98);
  border-top:1px solid #eee6ea;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav button{
  position:relative;
  background:transparent;
  color:#777b82;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:10px;
}

.nav svg{
  width:27px;
  height:27px;
}

.nav button.active{
  color:#b94667;
}

.nav button.active:before{
  content:"";
  position:absolute;
  width:64px;
  height:52px;
  border-radius:16px;
  background:#f8dce8;
  z-index:-1;
}


/* =========================================================
   INNER PAGES
========================================================= */

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 1px 16px;
}

.page-title h1{
  margin:0;
  font-size:27px;
  letter-spacing:-.7px;
}

.add-top{
  padding:9px 13px;
  border-radius:12px;
  background:#f8dce7;
  color:#a74362;
  font-weight:700;
}

.card{
  background:white;
  border-radius:20px;
  padding:15px;
  margin-bottom:9px;
  box-shadow:0 5px 20px rgba(130,73,95,.07);
}


/* =========================================================
   SCHEDULE PAGE
========================================================= */

.calendar{
  background:white;
  border-radius:21px;
  padding:14px;
  box-shadow:0 5px 20px rgba(130,73,95,.07);
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.calendar-head strong{
  font-size:18px;
}

.cal-arrow{
  width:37px;
  height:37px;
  border-radius:50%;
  background:#f8dce7;
  color:#a74362;
  font-size:22px;
}

.weekdays,
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.weekdays div{
  text-align:center;
  font-size:10px;
  color:#92898f;
  font-weight:700;
  padding-bottom:5px;
}

.day{
  height:40px;
  border-radius:11px;
  background:#fff7fa;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  font-size:12px;
}

.day.today{
  background:#e783a2;
  color:white;
  font-weight:700;
}

.day.has:after{
  content:"";
  position:absolute;
  bottom:4px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#d26987;
}

.day.today.has:after{
  background:white;
}


/* =========================================================
   CLIENTS
========================================================= */

.client{
  background:white;
  border-radius:20px;
  padding:15px;
  margin-bottom:9px;
  box-shadow:0 5px 20px rgba(130,73,95,.07);
}

.client-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#f8dce7;
  color:#a64261;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.client-info{
  flex:1;
}

.client-info strong{
  display:block;
}

.client-info small{
  display:block;
  margin-top:4px;
  color:#777;
}

.rate{
  color:#aa4a68;
  font-weight:700;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badge{
  border-radius:9px;
  padding:4px 8px;
  font-size:10px;
  font-weight:700;
}

.badge.private{
  background:#ffe0eb;
  color:#893151;
}

.badge.agency{
  background:#dceefa;
  color:#28617e;
}

.badge.freq{
  background:#eee6f5;
  color:#68477f;
}

.client-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
  flex-wrap:wrap;
}

.small{
  padding:8px 11px;
  border-radius:11px;
  background:#f0e8ed;
  color:#855269;
  font-size:12px;
  font-weight:700;
}

.small.delete{
  color:#b72e55;
  background:#fff0f3;
}


/* =========================================================
   EARNINGS
========================================================= */

.total{
  border-radius:22px;
  background:#eadcf8;
  text-align:center;
  padding:23px;
}

.total small{
  color:#756a7d;
}

.total strong{
  display:block;
  font-size:40px;
  margin:5px 0;
}

.history{
  background:white;
  border-radius:19px;
  padding:15px;
  margin-bottom:9px;
  box-shadow:0 5px 20px rgba(130,73,95,.07);
}

.history-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.history-name{
  font-weight:700;
}

.history-meta{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.history-money{
  color:#ad4c69;
  font-weight:700;
}


/* =========================================================
   MODAL
========================================================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(30,20,25,.4);
  backdrop-filter:blur(4px);
  display:none;
  align-items:flex-end;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:540px;
  max-height:93vh;
  overflow:auto;
  background:#fff9fb;
  border-radius:28px 28px 0 0;
  padding:20px 18px 35px;
  margin:auto auto 0;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:23px;
}

.close{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#f1e7ed;
  color:#9c3e5c;
  font-size:26px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:12px 0 6px;
}

.input,
select{
  width:100%;
  height:49px;
  border:1px solid #e7dce2;
  border-radius:14px;
  padding:0 12px;
  background:white;
  outline:none;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.save{
  width:100%;
  height:51px;
  border-radius:27px;
  background:#e47e9d;
  color:white;
  font-weight:700;
  margin-top:17px;
}


/* =========================================================
   TIMER
========================================================= */

.timer{
  text-align:center;
  font-size:44px;
  font-weight:700;
  padding:27px 0 12px;
  letter-spacing:1px;
}

.timer-note{
  text-align:center;
  color:#777;
  font-size:13px;
}


/* =========================================================
   SETTINGS
========================================================= */

.setting{
  background:white;
  border-radius:19px;
  padding:14px;
  margin-bottom:9px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 5px 20px rgba(130,73,95,.07);
}

.setting-icon{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#f9dce7;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.setting-copy{
  flex:1;
}

.setting-copy strong{
  display:block;
}

.setting-copy small{
  display:block;
  color:#777;
  margin-top:3px;
}

.switch{
  width:46px;
  height:26px;
  border-radius:20px;
  background:#d8d2d6;
  position:relative;
}

.switch:after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:white;
}

.switch.on{
  background:#e783a2;
}

.switch.on:after{
  left:23px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

  .container{
    padding-left:14px;
    padding-right:14px;
  }

  .brand-logo{
    width:56px;
    height:56px;
  }

  .brand-title{
    font-size:19px;
  }

  .brand-sub{
    font-size:12px;
  }

  .stat{
    height:106px;
  }

  .stat-value{
    font-size:16px;
  }

  .stat-label{
    font-size:11px;
  }

  .welcome-logo{
    width:245px;
    height:245px;
  }

  .welcome-script{
    font-size:40px;
  }

  .feature{
    min-height:73px;
  }

  .feature svg{
    width:27px;
    height:27px;
  }

  .feature span{
    font-size:10px;
  }
}

</style>
</head>

<body>


<!-- =========================================================
     WELCOME
========================================================= -->

<section id="welcome">

  <img
    id="welcomePhoto"
    src="pure-shine-cleaning-background.png"
    alt=""
  >

  <div class="welcome-content">

    <img
      class="welcome-logo"
      src="1D0A5974-7253-48B0-8BCA-2272594D29F0.png"
      alt="Pure Shine Cleaning"
      onerror="logoFallback(this)"
    >

    <div class="welcome-script">
      Your Cleaning<br>
      Business, Simplified
    </div>

    <div class="welcome-heart">
      ♡
    </div>

    <div class="welcome-features">

      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M8 3v4M16 3v4M3 10h18"/>
        </svg>
        <span>Manage<br>Jobs</span>
      </div>

      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="9" cy="8" r="3"/>
          <path d="M3 20c0-3 2.5-5 6-5s6 2 6 5"/>
          <circle cx="17" cy="9" r="2.5"/>
          <path d="M15 15c3 0 5 2 5 5"/>
        </svg>
        <span>Keep Track<br>of Clients</span>
      </div>

      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M4 20V10M10 20V5M16 20v-8M22 20H2"/>
        </svg>
        <span>Track<br>Earnings</span>
      </div>

      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        <span>More Time<br>for You</span>
      </div>

    </div>

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(x){
  return String(x??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function minutes(time){
  if(!time||!time.includes(":"))return 0;
  const p=time.split(":").map(Number);
  return p[0]*60+p[1];
}

function exactHours(start,end){
  return Math.max(
    0,
    minutes(end)-minutes(start)
  )/60;
}

function duration(h){
  const total=Math.round(Number(h||0)*60);
  return `${Math.floor(total/60)}h ${total%60}m`;
}

function pounds(n){
  return "£"+Number(n||0).toFixed(2);
}

function isoToday(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function dateText(date){
  return new Date(date+"T12:00:00").toLocaleDateString(
    "en-GB",
    {
      weekday:"long",
      day:"numeric",
      month:"long"
    }
  );
}

function weekday(date){
  return new Date(date+"T12:00:00").toLocaleDateString(
    "en-GB",
    {weekday:"long"}
  );
}

function client(id){
  return clientsData.find(c=>Number(c.id)===Number(id));
}

function setNav(page){

    x.classList.toggle(

    );

}

/* =========================================================
   SCHEDULE
========================================================= */

let calendar=
  new Date(
    new Date().getFullYear(),
    new Date().getMonth(),
    1
  );


function schedule(){

  setNav("schedule");

  const y=calendar.getFullYear();
  const m=calendar.getMonth();

  const first=
    new Date(y,m,1);

  const last=
    new Date(y,m+1,0);

  let offset=
    first.getDay()===0
    ?6
    :first.getDay()-1;

  let cells=[];

  for(let i=0;i<offset;i++){
    cells.push("");
  }

  for(let d=1;d<=last.getDate();d++){
    cells.push(d);
  }

  document.getElementById("content").innerHTML=`

    <div class="page-title">

      <h1>
        Schedule
      </h1>

      <button
        class="add-top"
        onclick="addJob()">

        ＋ Add job

      </button>

    </div>


    <section class="calendar">

      <div class="calendar-head">

        <button
          class="cal-arrow"
          onclick="
            calendar.setMonth(calendar.getMonth()-1);
            schedule();
          ">

          ‹

        </button>

        <strong>
          ${calendar.toLocaleDateString(
            "en-GB",
            {
              month:"long",
              year:"numeric"
            }
          )}
        </strong>

        <button
          class="cal-arrow"
          onclick="
            calendar.setMonth(calendar.getMonth()+1);
            schedule();
          ">

          ›

        </button>

      </div>


      <div class="weekdays">

        <div>MON</div>
        <div>TUE</div>
        <div>WED</div>
        <div>THU</div>
        <div>FRI</div>
        <div>SAT</div>
        <div>SUN</div>

      </div>


      <div class="days">

        ${
          cells.map(d=>{

            if(!d){
              return `<div></div>`;
            }

            const date=
              `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

            const has=
              jobsData.some(
                j=>j.date===date
              )||
              clientsData.some(
                c=>c.day===weekday(date)
              );

            return `

              <button
                class="
                  day
                  ${date===isoToday()?"today":""}
                  ${has?"has":""}
                "
                onclick="dayJobs('${date}')">

                ${d}

              </button>

            `;

          }).join("")
        }

      </div>

    </section>


    <div class="heading">
      <h2>Scheduled clients</h2>
    </div>


    ${
      clientsData
      .slice()
      .sort(
        (a,b)=>
          minutes(a.start)-minutes(b.start)
      )
      .map(c=>`

        <div class="card">

          <strong>
            ${escapeHTML(c.name)}
          </strong>

          <div
            style="
              color:#777;
              font-size:12px;
              margin-top:4px;
            ">

            ${escapeHTML(c.day)}
            ·
            ${escapeHTML(c.start)}
            –
            ${escapeHTML(c.end)}
            ·
            £${Number(c.rate||0)}/h

          </div>

          <div
            class="client-actions">

            <button
              class="small"
              onclick="editClient(${c.id})">

              Edit

            </button>

            <button
              class="small"
              onclick="
                addJob({
                  clientId:${c.id},
                  start:'${c.start}',
                  end:'${c.end}'
                })
              ">

              Add job

            </button>

          </div>

        </div>

      `).join("")
    }


    <div class="heading">
      <h2>Job history</h2>
    </div>


    ${
      jobsData.length

        .slice()
        .sort(
          (a,b)=>

              String(a.date)
            )

        .join("")
      :
      `
        <div class="card"
          style="text-align:center;color:#888">

          No job history yet.

        </div>
      `
    }

  `;
}

  openModal(`

      <h2>
        ${dateText(date)}

        class="close"

  const date=
    document.getElementById("jobDate").value;

  const start=
    document.getElementById("jobStart").value;

  const end=

    Number(
      document.getElementById("jobPrice").value
    );


  if(!c||!date||!start||!end){

    return;

  }


  if(minutes(end)<=minutes(start)){

    return;

  }


  if(!price){

      exactHours(start,end)*
      Number(c.rate||0);

  }


  jobsData.push({

    id:Date.now(),

    clientId:c.id,

    client:c.name,

    date,

    start,

    end,

    rate:Number(c.rate||0),

    price,

    amount:price,

    status:"Completed"

  });


  save();
  closeModal();
  schedule();

function calculateFree(){

  const date=
    document.getElementById("freeDate").value;

  const day=
    weekday(date);

  const scheduled=
    clientsData
      .filter(
        c=>
          c.day===day &&
          c.frequency!=="Occasional"
      )
      .sort(
        (a,b)=>
          minutes(a.start)-minutes(b.start)
      );


  const start=8*60;
  const end=18*60;

  let cursor=start;
  const gaps=[];


  scheduled.forEach(c=>{

    const s=minutes(c.start);
    const e=minutes(c.end);

    if(s>cursor){

      gaps.push({
        start:cursor,
        end:s
      });

    }

    cursor=Math.max(cursor,e);

  });


  if(cursor<end){

    gaps.push({
      start:cursor,
      end
    });

  }


  const total=
    gaps.reduce(
      (x,g)=>
        x+(g.end-g.start)/60,
      0
    );


  document.getElementById("freeResults").innerHTML=`

    <div
      class="total"
      style="background:#fff0c9">

      <small>
        Available time
      </small>

      <strong>
        ${duration(total)}
      </strong>

    </div>


    <div style="margin-top:10px">

      ${
        gaps.map(g=>`

          <div class="card"
            style="
              display:flex;
              justify-content:space-between;
              align-items:center;
            ">

            <div>

              <strong>
                ${format(g.start)}
                –
                ${format(g.end)}
              </strong>

              <div
                style="
                  color:#777;
                  font-size:12px;
                  margin-top:4px;
                ">

                ${duration(
                  (g.end-g.start)/60
                )}

              </div>

            </div>

            <button
              class="small"
              onclick="
                addJob({
                  date:'${date}',
                  start:'${format(g.start)}',
                  end:'${format(g.end)}'
                })
              ">

              ＋ Add

            </button>

          </div>

        `).join("")
      }

    </div>

  `;

}


function format(x){

  return `${String(
    Math.floor(x/60)
  ).padStart(2,"0")}:${String(
    x%60
  ).padStart(2,"0")}`;

}


/* =========================================================
   TIMER
========================================================= */

let timerInterval=null;

function timerSeconds(){

  if(!timer?.startedAt)return 0;

  return Math.floor(
    (Date.now()-timer.startedAt)/1000
  );

}

function timerDisplay(){

  const s=timerSeconds();

  const h=Math.floor(s/3600);

  const m=Math.floor(
    (s%3600)/60
  );

  const sec=s%60;

  return [
    h,m,sec
  ].map(
    x=>String(x).padStart(2,"0")
  ).join(":");

}


function startTimer(){

  openModal(`

    <div class="modal-head">

      <h2>
        Start cleaning
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <label>
      Client
    </label>

    <select id="timerClient">

      ${
        clientsData.map(c=>`

          <option value="${c.id}">
            ${escapeHTML(c.name)}
            · £${Number(c.rate||0)}/h
          </option>

        `).join("")
      }

    </select>


    <div
      id="timerDisplay"
      class="timer">

      ${timerDisplay()}

    </div>


    <div
      class="timer-note">

      ${
        timer
        ?"Cleaning timer is running"
        :"Ready to start"
      }

    </div>


    <button
      class="save"
      onclick="${
        timer
        ?"finishTimer()"
        :"beginTimer()"
      }">

      ${
        timer
        ?"Finish cleaning"
        :"Start timer"
      }

    </button>

  `);


  if(timerInterval){
    clearInterval(timerInterval);
  }

  timerInterval=setInterval(()=>{

    const el=
      document.getElementById(
        "timerDisplay"
      );

    if(el){
      el.textContent=
        timerDisplay();
    }

  },500);

}


function beginTimer(){

  const id=
    Number(
      document.getElementById(
        "timerClient"
      ).value
    );

  const c=client(id);

  if(!c)return;

  timer={
    clientId:c.id,
    client:c.name,
    rate:Number(c.rate||0),
    startedAt:Date.now(),
    date:isoToday()
  };

  save();

  startTimer();

}


function finishTimer(){

  if(!timer)return;

  const c=client(timer.clientId);

  const elapsed=
    Math.max(
      1,
      Math.round(
        (Date.now()-timer.startedAt)/60000
      )
    );

  const startDate=
    new Date(timer.startedAt);

  const endDate=
    new Date();

  const start=
    `${String(startDate.getHours()).padStart(2,"0")}:${String(startDate.getMinutes()).padStart(2,"0")}`;

  const end=
    `${String(endDate.getHours()).padStart(2,"0")}:${String(endDate.getMinutes()).padStart(2,"0")}`;

  const h=elapsed/60;

  const rate=
    Number(
      timer.rate||
      c?.rate||
      0
    );

  const amount=h*rate;


  jobsData.push({

    id:Date.now(),

    clientId:timer.clientId,

    client:timer.client,

    date:timer.date,

    start,

    end,

    durationMinutes:elapsed,

    rate,

    price:amount,

    amount,

    status:"Completed",

    timerStartedAt:timer.startedAt,

    timerFinishedAt:Date.now()

  });


  timer=null;

  save();

  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval=null;
  }

  closeModal();

  home();

  setTimeout(()=>{
    alert(
      "Cleaning finished\n\n"+
      "Time: "+duration(h)+"\n"+
      "Payment: "+pounds(amount)
    );
  },100);

}

        <strong>
          Welcome screen
        </strong>

        <small>
          Show the welcome page again
        </small>

      </div>

      <button
        class="small"
        onclick="showWelcome()">

        Show

      </button>

    </div>

  `;

}


function setZoom(value){

  zoom=Number(value);

  save();

  document.getElementById("content").style.zoom=
    zoom/100;

}


function showWelcome(){

  localStorage.removeItem(
    "pureShineWelcomeSeen"
  );

  document.getElementById("app").style.display="none";
  document.getElementById("welcome").style.display="block";

}


/* =========================================================
   MODAL
========================================================= */

function openModal(html){

  document.getElementById("modal").innerHTML=html;

  document.getElementById("overlay")
    .classList.add("show");

}


function closeModal(){

  document.getElementById("overlay")
    .classList.remove("show");

}


document.getElementById("overlay")
  .addEventListener(
    "click",
    e=>{
      if(e.target.id==="overlay"){
        closeModal();
      }
    }
  );


/* =========================================================
   INIT — NEVER RESET SAVED HISTORY
========================================================= */

save();

if(
  localStorage.getItem(
    "pureShineWelcomeSeen"
  )==="1"
){

  document.getElementById("welcome").style.display="none";
  document.getElementById("app").style.display="block";

  home();

}else{

  document.getElementById("welcome").style.display="block";
  document.getElementById("app").style.display="none";

}


window.addEventListener(
  "beforeunload",
  save
);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(!document.hidden){
      save();
    }
  }
);

</script>

</body>
</html>
