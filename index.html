.history-row{

.history-date{

/* MODAL */

<body>

<div id="app"></div>

<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY="pureShineCleaningManager_200";
const TIMER_KEY="pureShineCleaningManager_TIMER";

/* =====================================================
   DEFAULT CLIENTS
===================================================== */

const defaultClients=[

    {
        id:1,
        name:"Tosca",
        type:"agency",
        rate:16,
        day:"Monday",
        start:"09:00",
        end:"12:00",
        freq:"weekly",
        week:"A"
    },

    {
        id:2,
        name:"Lottie",
        type:"agency",
        rate:16,
        day:"Monday",
        start:"13:00",
        end:"15:00",
        freq:"weekly",
        week:"A"
    },

    {
        id:3,
        name:"Christine",
        type:"private",
        rate:18,
        day:"Tuesday",
        start:"09:30",
        end:"12:30",
        freq:"weekly",
        week:"A"
    },

    {
        id:4,
        name:"Matt",
        type:"agency",
        rate:16,
        day:"Tuesday",
        start:"13:00",
        end:"17:00",
        freq:"weekly",
        week:"A",
        variable:true
    },

    {
        id:5,
        name:"Sonia",
        type:"agency",
        rate:16,
        day:"Wednesday",
        start:"09:00",
        end:"14:00",
        freq:"weekly",
        week:"A",
        variable:true
    },

    {
        id:7,
        name:"Laura",
        type:"private",
        rate:18,
        day:"Thursday",
        start:"09:00",
        end:"13:00",
        freq:"weekly",
        week:"A",
        variable:true
    },

    {
        id:8,
        name:"Hannah",
        type:"agency",
        rate:16,
        day:"Thursday",
        start:"13:00",
        end:"16:00",
        freq:"weekly",
        week:"A"
    },

    {
        id:9,
        name:"Joanna",
        type:"private",
        rate:18,
        day:"Friday",
        start:"09:30",
        end:"13:30",
        freq:"fortnightly",
        week:"A",
        variable:true
    },

    {
        id:10,
        name:"Sindu",
        type:"agency",
        rate:16,
        day:"Friday",
        start:"09:30",
        end:"12:30",
        freq:"fortnightly",
        week:"B"
    }
];

/* =====================================================
   LOAD DATA
===================================================== */

let data;

try{

    data=JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        )
    );

}catch(e){

    data=null;
}

if(
    !data ||
    !Array.isArray(data.clients)
){

    data={
        clients:defaultClients,
        jobs:[]
    };
}

if(!Array.isArray(data.jobs)){
    data.jobs=[];
}

/* Gill stays removed */

data.clients=
    data.clients.filter(
        c =>
            String(
                c.name||""
            ).toLowerCase()
            !=="gill"
    );

data.jobs=
    data.jobs.filter(
        j =>
            String(
                j.clientName||""
            ).toLowerCase()
            !=="gill"
    );

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

saveData();

/* =====================================================
   FREQUENCY TEXT
===================================================== */

function frequencyText(freq){

    if(freq==="weekly"){
        return "Weekly";
    }

    if(freq==="fortnightly"){
        return "Every 2 weeks";
    }

    if(freq==="threeweekly"){
        return "Every 3 weeks";
    }

    if(freq==="fourweekly"){
        return "Every 4 weeks";
    }

    if(freq==="monthly"){
        return "Monthly";
    }

    if(freq==="occasional"){
        return "Occasional";
    }

    return "Weekly";
}

/* =====================================================
   EXACT TIME FORMATTING
===================================================== */

/*
   This is now ALWAYS displayed like:

   4 hours 25 minutes

   NOT:
   4.25h
   4.4167h
   4h 25m
*/

function formatExactTime(hours){

    const totalMinutes=
        Math.round(
            Number(hours||0)*60
        );

    const h=
        Math.floor(
            totalMinutes/60
        );

    const m=
        totalMinutes%60;

    if(h===0 && m===0){
        return "0 minutes";
    }

    if(h===0){
        return m+
            (m===1
                ?" minute"
                :" minutes");
    }

    if(m===0){
        return h+
            (h===1
                ?" hour"
                :" hours");
    }

    return h+
        (h===1
            ?" hour "
            :" hours ")
        +
        m+
        (m===1
            ?" minute"
            :" minutes");
}

function exactMinutes(
    start,
    end
){

    if(!start || !end){
        return 0;
    }

    const startParts=
        start.split(":");

    const endParts=
        end.split(":");

    const startMinutes=
        Number(startParts[0])*60+
        Number(startParts[1]);

    const endMinutes=
        Number(endParts[0])*60+
        Number(endParts[1]);

    return Math.max(
        0,
        endMinutes-startMinutes
    );
}

function exactHours(
    start,
    end
){

    return exactMinutes(
        start,
        end
    )/60;
}

/* =====================================================
   GENERAL HELPERS
===================================================== */

function esc(value){

    return String(
        value==null
            ?""
            :value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function money(value){

    return "£"+
        Number(value||0)
        .toFixed(2);
}

function minutes(time){

    if(!time){
        return 0;
    }

    const p=time.split(":");

    return Number(p[0])*60+
        Number(p[1]);
}

function today(){

    const d=new Date();

    return d.getFullYear()+
        "-"+
        String(
            d.getMonth()+1
        ).padStart(2,"0")+
        "-"+
        String(
            d.getDate()
        ).padStart(2,"0");
}

function todayDay(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {
                weekday:"long"
            }
        );
}

function findClient(id){

    return data.clients.find(
        c =>
            Number(c.id)===
            Number(id)
    );
}

function formatDate(date){

    return new Date(
        date+"T12:00:00"
    )
    .toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}

/* =====================================================
   TIMER
===================================================== */

let timer={
    running:false,
    clientId:null,
    startedAt:null,
    accumulated:0
};

try{

    const savedTimer=
        JSON.parse(
            localStorage.getItem(
                TIMER_KEY
            )
        );

    if(savedTimer){
        timer=savedTimer;
    }

}catch(e){}

function saveTimer(){

    localStorage.setItem(
        TIMER_KEY,
        JSON.stringify(timer)
    );
}

function timerSeconds(){

    if(!timer.running){

        return Number(
            timer.accumulated||0
        );
    }

    return Number(
        timer.accumulated||0
    )+
    Math.max(
        0,
        Math.floor(
            (
                Date.now()-
                Number(
                    timer.startedAt||0
                )
            )/1000
        )
    );
}

function timerText(seconds){

    seconds=Math.max(
        0,
        Math.floor(
            Number(seconds)||0
        )
    );

    const h=
        Math.floor(
            seconds/3600
        );

    const m=
        Math.floor(
            (seconds%3600)/60
        );

    const s=
        seconds%60;

    return String(h)
        .padStart(2,"0")
        +":"
        +String(m)
        .padStart(2,"0")
        +":"
        +String(s)
        .padStart(2,"0");
}

function timerHours(){

    return timerSeconds()/3600;
}

/* =====================================================
   HOME
===================================================== */

function homePage(){

    const todayJobs=
        data.jobs.filter(
            j =>
                j.date===today()
        );

    const totalHours=
        todayJobs.reduce(
            (sum,j)=>
                sum+
                Number(
                    j.hours||0
                ),
            0
        );

    const earned=
        todayJobs.reduce(
            (sum,j)=>
                sum+
                Number(
                    j.price||0
                ),
            0
        );

    const todayClients=
        data.clients
        .filter(
            c =>
                c.day===todayDay() &&
                c.freq!=="occasional"
        )
        .sort(
            (a,b)=>
                minutes(a.start)-
                minutes(b.start)
        );

    const available=
        todayClients.reduce(
            (sum,c)=>
                sum+
                exactHours(
                    c.start,
                    c.end
                ),
            0
        );

    let html="";

    html+=`
        <h1 class="greeting">
            Hello ✨
        </h1>

        <div class="date">
            ${new Date()
                .toLocaleDateString(
                    "en-GB",
                    {
                        weekday:"long",
                        day:"numeric",
                        month:"long"
                    }
                )}
        </div>

        <div class="dashboard">

            <div class="stat jobs">
                <div class="stat-icon">🧹</div>
                <div class="stat-label">Jobs</div>
                <div class="stat-value">
                    ${todayJobs.length}
                </div>
            </div>

            <div class="stat hours">
                <div class="stat-icon">⏱️</div>
                <div class="stat-label">Hours</div>
                <div class="stat-value">
                    ${formatExactTime(
                        totalHours
                    )}
                </div>
            </div>

            <div class="stat earned">
                <div class="stat-icon">💷</div>
                <div class="stat-label">Earned</div>
                <div class="stat-value">
                    ${money(earned)}
                </div>

function getMonday(date){

    const d=new Date(date);

    const day=d.getDay();

    const diff=
        day===0
            ?-6
            :1-day;

    d.setDate(
        d.getDate()+diff
    );

    d.setHours(
        12,0,0,0
    );

    return d;
}

function dateISO(d){

    return d.getFullYear()+
        "-"+
        String(
            d.getMonth()+1
        ).padStart(2,"0")+
        "-"+
        String(
            d.getDate()
        ).padStart(2,"0");
}

function calendarPage(){

    const monday=
        getMonday(
            new Date()
        );

    const dayNames=[
        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat",
        "Sun"
    ];

    let html="";

    html+=`
        <div class="section-head">

            <h2 class="section-title">
                Weekly Calendar 📅
            </h2>

        </div>

        <div class="calendar">

            <div class="calendar-header">
    `;

    dayNames.forEach(
        day=>{

            html+=`
                <div class="calendar-day-name">
                    ${day}
                </div>
            `;
        }
    );

    html+=`
            </div>

            <div class="calendar-grid">
    `;

    for(let i=0;i<7;i++){

        const d=
            new Date(monday);

        d.setDate(
            monday.getDate()+i
        );

        const iso=
            dateISO(d);

        const dayName=
            d.toLocaleDateString(
                "en-GB",
                {
                    weekday:"long"
                }
            );

        /*
           Occasional clients are not placed
           automatically in the weekly calendar.
        */

        const clients=
            data.clients
            .filter(
                c =>
                    c.day===dayName &&
                    c.freq!=="occasional"
            );

        const isToday=
            iso===today();

        html+=`
            <div class="
                calendar-cell
                ${isToday?"today":""}
            ">

                <div class="calendar-date">
                    ${d.getDate()}
                </div>
        `;

        if(clients.length){

            clients.forEach(
                c=>{

                    html+=`
                        <div
                            class="calendar-client"
                            onclick="openJobFormByClient(${c.id})"
                        >

                            ${esc(c.name)}

                            <div class="calendar-time">
                                ${esc(c.start)}
                                –
                                ${esc(c.end)}
                            </div>

                        </div>
                    `;
                }
            );

        }else{

            html+=`
                <div class="calendar-empty">
                    —
                </div>
            `;
        }

        html+=`
            </div>
        `;
    }

    html+=`
            </div>

        </div>
    `;

    return html;
}

function saveClient(id){

    const name=
        document
        .getElementById(
            "clientName"
        )
        .value
        .trim();

    const type=
        document
        .getElementById(
            "clientType"
        )
        .value;

    const rate=
        Number(
            document
            .getElementById(
                "clientRate"
            )
            .value
        );

    const day=
        document
        .getElementById(
            "clientDay"
        )
        .value;

    const freq=
        document
        .getElementById(
            "clientFreq"
        )
        .value;

    const start=
        document
        .getElementById(
            "clientStart"
        )
        .value;

    const end=
        document
        .getElementById(
            "clientEnd"
        )
        .value;

    const variable=
        document
        .getElementById(
            "clientVariable"
        )
        .value==="yes";

    if(!name){

        alert(
            "Please enter a client name."
        );

        return;
    }

    if(
        minutes(end)<=
        minutes(start)
    ){

        alert(
            "Please enter a valid Start and End time."
        );

        return;
    }

    if(id){

        const client=
            findClient(id);

        if(client){

            client.name=name;
            client.type=type;
            client.rate=rate;
            client.day=day;
            client.start=start;
            client.end=end;
            client.freq=freq;
            client.variable=variable;
        }

    }else{

        data.clients.push({

            id:Date.now(),

            name:name,

            type:type,

            rate:rate,

            day:day,

            start:start,

            end:end,

            freq:freq,

            variable:variable,

            week:"A"
        });
    }

    saveData();

    closeModal();

    render();
}

function deleteClient(id){

    const client=
        findClient(id);

    if(!client){
        return;
    }

    if(
        !confirm(
            "Delete "+
            client.name+
            "?"
        )
    ){
        return;
    }

    data.clients=
        data.clients.filter(
            c =>
                Number(c.id)!==
                Number(id)
        );

    if(
        timer.running &&
        Number(timer.clientId)===
        Number(id)
    ){

        resetTimer();
    }

    saveData();

    render();
}

function jobsPage(){

    html+=`

            </h2>

            <button
                class="primary"
                onclick="openJobForm()"
            >

            </button>

        </div>
    `;

    if(!data.jobs.length){

        html+=`
            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                No completed jobs yet.

            </div>
        `;

        return html;
    }

    const grouped={};

    data.jobs.forEach(
        job=>{

            const client=
                findClient(
                    job.clientId
                );

            const name=
                client
                    ?client.name
                    :(job.clientName||"Unknown");

            if(!grouped[name]){
                grouped[name]=[];
            }

            grouped[name].push(job);
        }
    );

    Object.keys(grouped)
    .sort()
    .forEach(
        name=>{

            const jobs=
                grouped[name]
                .slice()
                .sort(
                    (a,b)=>
                        b.date.localeCompare(
                            a.date
                        )
                );

            const clientTotal=
                jobs.reduce(
                    (sum,j)=>
                        sum+
                        Number(
                            j.price||0
                        ),
                    0
                );

            html+=`
                <div class="client-history">

                    <div class="client-history-title">

                        <span>
                            ${esc(name)}
                        </span>

                        <span class="client-total">
                            ${money(
                                clientTotal
                            )}
                        </span>

                    </div>
            `;

            jobs.forEach(
                job=>{

                    let workedMinutes;

                    /*
                       Timer jobs use exact timer
                       seconds converted to minutes.
                    */

                    if(
                        Number(job.timerSeconds)>0
                    ){

                        workedMinutes=
                            Math.floor(
                                Number(
                                    job.timerSeconds
                                )/60
                            );

                    }else if(
                        Number.isFinite(
                            Number(
                                job.workedMinutes
                            )
                        )
                    ){

                        workedMinutes=
                            Number(
                                job.workedMinutes
                            );

                    }else{

                        workedMinutes=
                            Math.round(
                                Number(
                                    job.hours||0
                                )*60
                            );
                    }

                    const workedHours=
                        workedMinutes/60;

                    html+=`
                        <div class="history-job">

                            <div class="history-row">

                                <div class="history-date">
                                    ${formatDate(
                                        job.date
                                    )}
                                </div>

                                <div class="history-money">
                                    ${money(
                                        job.price
                                    )}
                                </div>

                            </div>

                            <div class="history-hours">
                                ⏱️ Worked:
                                <strong>
                                    ${formatExactTime(
                                        workedHours
                                    )}
                                </strong>
                            </div>
                    `;

                    if(
                        job.start &&
                        job.end
                    ){

                        html+=`
                            <div class="exact-time">
                                ${esc(job.start)}
                                –
                                ${esc(job.end)}
                            </div>
                        `;
                    }

                    html+=`
                            <div class="card-actions">

                                <button
                                    class="secondary"
                                    onclick="editJob(${job.id})"
                                >
                                    ✏️ Edit
                                </button>

                                <button
                                    class="danger"
                                    onclick="deleteJob(${job.id})"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>
                    `;
                }
            );

            html+=`
                </div>
            `;
        }
    );

    return html;
}

        update

    end.addEventListener(
        "input",
        update
    );

    rate.addEventListener(
        "input",
        update
    );

    document
    .getElementById(
        "jobDate"
    )
    .addEventListener(
        "change",
        updateDay
    );

    updateDay();
    update();
}

/* =====================================================
   SAVE JOB
===================================================== */

function saveJob(id){

    const client=
        findClient(
            Number(
                document
                .getElementById(
                    "jobClient"
                )
                .value
            )
        );

    if(!client){
        return;
    }

    const date=
        document
        .getElementById(
            "jobDate"
        )
        .value;

    const start=
        document
        .getElementById(
            "jobStart"
        )
        .value;

    const end=
        document
        .getElementById(
            "jobEnd"
        )
        .value;

    const rate=
        Number(
            document
            .getElementById(
                "jobRate"
            )
            .value
        );

    const status=
        document
        .getElementById(
            "jobStatus"
        )
        .value;

    if(
        !date ||
        !start ||
        !end ||
        minutes(end)<=minutes(start)
    ){

        alert(
            "Please enter a valid Start and End time."
        );

        return;
    }

    /*
       EXACT calculation.

       Example:

       09:15 → 13:40
       = 265 minutes
       = 4 hours 25 minutes
       = 4.416666... decimal hours internally

       Money is calculated from the exact minutes.
    */

    const workedMinutes=
        exactMinutes(
            start,
            end
        );

    const workedHours=
        workedMinutes/60;

    const price=
        workedHours*
        rate;

    if(id){

        const job=
            data.jobs.find(
                j =>
                    Number(j.id)===
                    Number(id)
            );

        if(job){

            job.clientId=
                client.id;

            job.clientName=
                client.name;

            job.rate=
                rate;

            job.date=
                date;

            job.start=
                start;

            job.end=
                end;

            job.hours=
                workedHours;

            job.workedMinutes=
                workedMinutes;

            job.price=
                price;

            job.status=
                status;
        }

    }else{

        data.jobs.push({

            id:
                Date.now(),

            clientId:
                client.id,

            clientName:
                client.name,

            rate:
                rate,

            date:
                date,

            start:
                start,

            end:
                end,

            hours:
                workedHours,

            workedMinutes:
                workedMinutes,

            price:
                price,

            status:
                status,

            timerSeconds:
                0
        });
    }

    saveData();

    closeModal();

    render();
}

/* =====================================================
   EDIT / DELETE JOB
===================================================== */

function editJob(id){

    const job=
        data.jobs.find(
            j =>
                Number(j.id)===
                Number(id)
        );

    if(job){
        openJobForm(job);
    }
}

function deleteJob(id){

    if(
        !confirm(
            "Delete this job?"
        )
    ){
        return;
    }

    data.jobs=
        data.jobs.filter(
            j =>
                Number(j.id)!==
                Number(id)
        );

    saveData();

    render();
}

/* =====================================================
   EARNINGS
===================================================== */

function earningsPage(){

    let total=0;
    let hours=0;
    let owed=0;

    data.jobs.forEach(
        j=>{

            total+=
                Number(
                    j.price||0
                );

            hours+=
                Number(
                    j.hours||0
                );

            if(
                j.status==="Owed"
            ){

                owed+=
                    Number(
                        j.price||0
                    );
            }
        }
    );

    return `

        <div class="section-head">

            <h2 class="section-title">
                Earnings 💷
            </h2>

        </div>

        <div class="dashboard">

            <div class="stat earned">

                <div class="stat-icon">
                    💷
                </div>

                <div class="stat-label">
                    Total earned
                </div>

                <div class="stat-value">
                    ${money(total)}
                </div>

            </div>

            <div class="stat hours">

                <div class="stat-icon">
                    ⏱️
                </div>

                <div class="stat-label">
                    Total time
                </div>

                <div class="stat-value">
                    ${formatExactTime(hours)}
                </div>

            </div>

            <div class="stat available">

                <div class="stat-icon">
                    💰
                </div>

                <div class="stat-label">
                    Owed
                </div>

                <div class="stat-value">
                    ${money(owed)}
                </div>

            </div>

        </div>
    `;
}

/* =====================================================
   TIMER SELECTOR
===================================================== */

function openTimerSelector(){

    if(timer.running){

        showTimer(
            timer.clientId
        );

        return;
    }

    let html=`

        <div class="modal-head">

            <h2 class="modal-title">
                Start Timer ⏱️
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div class="form-group">

            <label class="label">
                Client
            </label>

            <select
                id="timerClient"
                class="control"
            >

                <option value="">
                    Select client
                </option>

                ${data.clients
                    .map(
                        c=>`
                            <option
                                value="${c.id}"
                            >
                                ${esc(c.name)}
                            </option>
                        `
                    )
                    .join("")}

            </select>

        </div>

        <button
            class="primary"
            style="width:100%"
            onclick="startSelectedTimer()"
        >
            ▶ Start Timer
        </button>
    `;

    openModal(html);
}

function startSelectedTimer(){

    const id=
        Number(
            document
            .getElementById(
                "timerClient"
            )
            .value
        );

    if(!id){

        alert(
            "Please choose a client."
        );

        return;
    }

    timer={

        running:true,

        clientId:id,

        startedAt:
            Date.now(),

        accumulated:0
    };

    saveTimer();

    closeModal();

    render();
}

/* =====================================================
   SHOW TIMER
===================================================== */

function showTimer(id){

    const client=
        findClient(id);

    if(!client){
        return;
    }

    let html=`

        <div class="modal-head">

            <h2 class="modal-title">
                ${esc(client.name)} ⏱️
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div class="timer-box">

            <div
                id="timerDisplay"
                class="timer-display"
            >
                ${timerText(
                    timerSeconds()
                )}
            </div>

            <button
                class="primary"
                style="
                    width:100%;
                    background:#766c82
                "
                onclick="stopTimer()"
            >
                ⏹ Stop & Save
            </button>

            <div class="timer-info">

                Worked

                <strong
                    id="timerHours"
                    class="timer-big"
                >
                    ${formatExactTime(
                        timerHours()
                    )}
                </strong>

                Earned

                <strong
                    id="timerMoney"
                    class="timer-big"
                >
                    ${money(
                        timerHours()*
                        Number(
                            client.rate
                        )
                    )}
                </strong>

            </div>

        </div>
    `;

    openModal(html);
}

/* =====================================================
   STOP TIMER
===================================================== */

function stopTimer(){

    if(!timer.running){
        return;
    }

    const client=
        findClient(
            timer.clientId
        );

    if(!client){

        resetTimer();

        return;
    }

    const seconds=
        timerSeconds();

    const workedMinutes=
        Math.floor(
            seconds/60
        );

    const workedHours=
        workedMinutes/60;

    const now=
        new Date();

    const started=
        new Date(
            Number(
                timer.startedAt
            )
        );

    const start=
        started.toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    const end=
        now.toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    const price=
        workedHours*
        Number(
            client.rate
        );

    data.jobs.push({

        id:
            Date.now(),

        clientId:
            client.id,

        clientName:
            client.name,

        rate:
            Number(client.rate),

        date:
            today(),

        start:
            start,

        end:
            end,

        hours:
            workedHours,

        workedMinutes:
            workedMinutes,

        timerSeconds:
            seconds,

        price:
            price,

        status:
            "Paid"
    });

    resetTimer();

    saveData();

    closeModal();

    render();
}

function resetTimer(){

    timer={

        running:false,

        clientId:null,

        startedAt:null,

        accumulated:0
    };

    saveTimer();
}

/* =====================================================
   MODAL
===================================================== */

function openModal(content){

    closeModal();

    const bg=
        document.createElement(
            "div"
        );

    bg.id="modal";

    bg.className="modal-bg";

    const box=
        document.createElement(
            "div"
        );

    box.className="modal";

    box.innerHTML=
        content;

    box.onclick=
        e =>
            e.stopPropagation();

    bg.appendChild(box);

    bg.onclick=
        closeModal;

    document.body.appendChild(bg);
}

function closeModal(){

    const modal=
        document.getElementById(
            "modal"
        );

    if(modal){
        modal.remove();
    }
}

/* =====================================================
   NAVIGATION
===================================================== */

let currentPage="home";

function go(page){

    currentPage=
        page;

    closeModal();

    render();
}

function navButton(
    page,
    icon,
    label
){

    return `

        <button
            class="nav ${
                currentPage===page
                    ?"active"
                    :""
            }"
            onclick="go('${page}')"
        >

            <span class="nav-icon">
                ${icon}
            </span>

            ${label}

        </button>
    `;
}

function navigation(){

    return `

        <nav class="bottom-nav">

            ${navButton(
                "home",
                "🏠",
                "Home"
            )}

            ${navButton(
                "schedule",
                "📅",
                "Calendar"
            )}

            ${navButton(
                "clients",
                "👥",
                "Clients"
            )}

            ${navButton(
                "jobs",
                "📋",
                "Jobs"
            )}

            ${navButton(
                "earnings",
                "💷",
                "Earnings"
            )}

        </nav>
    `;
}

/* =====================================================
   RENDER
===================================================== */

function render(){

    let content="";

    if(
        currentPage==="home"
    ){
        content=
            homePage();
    }

    if(
        currentPage==="schedule"
    ){
        content=
            calendarPage();
    }

    if(
        currentPage==="clients"
    ){
        content=
            clientsPage();
    }

    if(
        currentPage==="jobs"
    ){
        content=
            jobsPage();
    }

    if(
        currentPage==="earnings"
    ){
        content=
            earningsPage();
    }

    let banner="";

    if(timer.running){

        const client=
            findClient(
                timer.clientId
            );

        if(client){

            banner=`

                <div
                    class="timer-banner"
                    onclick="showTimer(${client.id})"
                >

                    <span>
                        ⏱️ ${esc(client.name)}
                    </span>

                    <strong
                        id="bannerTimer"
                    >
                        ${timerText(
                            timerSeconds()
                        )}
                    </strong>

                    <span>
                        Tap
                    </span>

                </div>
            `;
        }
    }

    document.getElementById(
        "app"
    ).innerHTML=`

        <div class="app">

            ${banner}

            <header class="header">

                <div class="brand">

                    <img
                        id="mainLogo"
                        class="logo"
                        src="icon.png"
                        alt="Pure Shine"
                    >

                    <div
                        id="logoFallback"
                        class="logo-fallback"
                    >
                        ✨
                    </div>

                    <div>

                        <div class="brand-title">
                            Pure Shine
                        </div>

                        <div class="brand-subtitle">
                            Cleaning Manager ✨
                        </div>

                    </div>

                </div>

                <div class="header-actions">

                    <button
                        class="header-btn timer"
                        onclick="openTimerSelector()"
                    >
                        ⏱️
                    </button>

                    <button
                        class="header-btn"
                        onclick="openJobForm()"
                    >
                        +
                    </button>

                </div>

            </header>

            <main class="content">
                ${content}
            </main>

        </div>

        ${navigation()}
    `;

    const logo=
        document.getElementById(
            "mainLogo"
        );

    const fallback=
        document.getElementById(
            "logoFallback"
        );

    if(logo){

        logo.onerror=
            function(){

                logo.style.display=
                    "none";

                if(fallback){

                    fallback.style.display=
                        "flex";
                }
            };
    }
}

/* =====================================================
   LIVE TIMER UPDATE
===================================================== */

setInterval(
    function(){

        if(!timer.running){
            return;
        }

        const seconds=
            timerSeconds();

        const display=
            document.getElementById(
                "timerDisplay"
            );

        const banner=
            document.getElementById(
                "bannerTimer"
            );

        const hours=
            document.getElementById(
                "timerHours"
            );

        const moneyBox=
            document.getElementById(
                "timerMoney"
            );

        if(display){

            display.textContent=
                timerText(
                    seconds
                );
        }

        if(banner){

            banner.textContent=
                timerText(
                    seconds
                );
        }

        if(hours){

            hours.textContent=
                formatExactTime(
                    seconds/3600
                );
        }

        const client=
            findClient(
                timer.clientId
            );

        if(
            moneyBox &&
            client
        ){

            moneyBox.textContent=
                money(
                    (
                        seconds/3600
                    )*
                    Number(
                        client.rate
                    )
                );
        }

    },
    1000
);

/* =====================================================
   BACKGROUND TIMER
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(timer.running){
            saveTimer();
        }

        if(
            !document.hidden &&
            timer.running
        ){

            render();
        }
    }
);

window.addEventListener(
    "pagehide",
    function(){

        if(timer.running){
            saveTimer();
        }
    }
);

window.addEventListener(
    "beforeunload",
    function(){

        if(timer.running){
            saveTimer();
        }
    }
);

/* =====================================================
   START
===================================================== */

render();

</script>

</body>
</html>
