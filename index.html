
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7fa">
<title>Pure Shine Cleaning Manager</title>
<style>
:root{
  --pink:#edbfd1;
  --pink-light:#fff0f5;
  --pink-deep:#b75f83;
  --gold:#c4a05b;
  --gold-light:#fff4df;
  --ink:#493b47;
  --muted:#8c7e8a;
  --line:#f0e1e9;
  --lav:#eee7f8;
  --sage:#e4f1e7;
  --paper:#fff9fb;
  --scale:1;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.app{width:100%;max-width:850px;margin:auto;padding:calc(12px * var(--scale)) calc(14px * var(--scale)) calc(105px * var(--scale) + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:5px 0 16px}
.profile{width:64px;height:64px;flex:0 0 64px;position:relative;overflow:hidden;border-radius:21px;background:linear-gradient(135deg,#f0c6d7,#d0b178);border:2px solid white;box-shadow:0 4px 14px #75556812;display:grid;place-items:center}
.profile img{width:100%;height:100%;object-fit:cover}
.profile .editphoto{position:absolute;right:3px;bottom:3px;padding:3px 6px;border:0;border-radius:8px;background:#ffffffed;font-size:12px}
.brand{flex:1;min-width:0}
.brand h1{font:700 calc(25px * var(--scale)) Georgia,serif;letter-spacing:-.5px;margin:0;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:calc(12px * var(--scale));margin-top:4px}
.topbtn{width:48px;height:48px;flex:0 0 48px;border:0;border-radius:17px;background:white;color:var(--pink-deep);font-size:28px;box-shadow:0 4px 18px #7555680b}
.banner{height:clamp(125px,29vw,180px);position:relative;overflow:hidden;border-radius:23px;margin-bottom:18px;background:linear-gradient(125deg,#f2d1dd,#f8eaf0 55%,#e9def6);box-shadow:0 5px 20px #7555680b}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner-edit{position:absolute;right:9px;top:9px;border:0;border-radius:12px;background:#ffffffed;padding:9px 12px;font-size:12px;font-weight:750;color:#674d5d}
.banner-empty{height:100%;display:grid;place-items:center;color:#b995a6;font-size:38px}
h2{font:700 calc(22px * var(--scale)) Georgia,serif;margin:0;line-height:1.25}
h3{font-size:calc(16px * var(--scale));margin:0 0 9px}
p{line-height:1.5}
.muted{font-size:calc(13px * var(--scale));line-height:1.5;color:var(--muted)}
.hero{border-radius:25px;padding:calc(20px * var(--scale));background:linear-gradient(125deg,#f7dce7,#f0e7fa 65%,#fff1dc);margin-bottom:15px}
.hero h2{font-size:calc(25px * var(--scale));margin:8px 0}
.hero p{font-size:calc(15px * var(--scale));margin:10px 0 14px;color:var(--muted)}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 2px 11px}
.card{background:white;border:1px solid var(--line);border-radius:22px;padding:calc(15px * var(--scale));margin:10px 0;box-shadow:0 5px 20px #75556808}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{padding:calc(15px * var(--scale));border-radius:19px;background:var(--pink-light);min-width:0}
.stat:nth-child(2){background:var(--sage)}
.stat:nth-child(3){background:var(--lav)}
.stat:nth-child(4){background:var(--gold-light)}
.stat span{font-size:calc(12px * var(--scale));color:var(--muted);display:block;line-height:1.4}
.stat strong{display:block;font-size:calc(22px * var(--scale));margin-top:5px;overflow-wrap:anywhere;line-height:1.25}
.btn{border:0;border-radius:15px;padding:12px 15px;background:var(--pink);color:#684456;font-weight:750;font-size:calc(14px * var(--scale));min-height:42px}
.btn.primary{background:linear-gradient(120deg,#e7adc4,#c5a15b);color:white}
.btn.soft{background:#faeaf1}
.btn.danger{background:#f9e0e3;color:#994958}
.btn.small{padding:9px 11px;min-height:36px;font-size:calc(12px * var(--scale))}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{margin:12px 0}
.field label{display:block;font-size:calc(13px * var(--scale));font-weight:750;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1.5px solid #e8dce4;border-radius:14px;background:#fff;color:var(--ink);padding:13px;font-size:16px;min-height:47px}
.field textarea{min-height:85px;resize:vertical}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.itemtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.itemtop>div{min-width:0}
.item strong{font-size:calc(15px * var(--scale))}
.itemprice{white-space:nowrap;font-weight:800}
.pill{display:inline-block;font-size:calc(11px * var(--scale));font-weight:750;background:var(--lav);border-radius:9px;padding:5px 8px;margin:5px 4px 0 0}
.pill.green{background:var(--sage)}
.pill.gold{background:var(--gold-light)}
.pill.pink{background:var(--pink-light)}
.empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:calc(14px * var(--scale))}
.notice{padding:13px;border-radius:14px;background:var(--gold-light);font-size:calc(12px * var(--scale));line-height:1.5;margin:12px 0}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.nav button{min-width:0;min-height:62px;border:0;background:transparent;border-radius:15px;padding:5px 0;color:#887987;font-size:calc(11px * var(--scale));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button span{font-size:calc(22px * var(--scale));line-height:1.2}
.nav button.active{background:#fff0f5;color:#a25276;font-weight:800}
.modalback{display:none;position:fixed;inset:0;z-index:60;background:#34263177;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:700px;max-height:92dvh;overflow:auto;background:#fffafd;border-radius:27px 27px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));font-size:calc(16px * var(--scale))}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.close{border:0;border-radius:50%;width:42px;height:42px;background:#f8e7ef;color:#995675;font-size:25px;flex:0 0 42px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.settings-tile{min-height:120px;border:1px solid var(--line);border-radius:20px;padding:15px 13px;text-align:left;background:white;display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:var(--ink)}
.settings-tile:active{transform:scale(.99)}
.settings-tile .tile-icon{font-size:28px}
.settings-tile strong{font-size:calc(14px * var(--scale));line-height:1.35}
.settings-tile small{font-size:calc(12px * var(--scale));color:var(--muted);line-height:1.4}
.settings-tile.pink{background:#fff0f5}
.settings-tile.gold{background:#fff5df}
.settings-tile.lavender{background:#f3effb}
.settings-tile.green{background:#edf6ef}
.settings-preview{border-radius:19px;background:linear-gradient(130deg,#f7dce7,#fff1db);padding:17px;margin-bottom:15px}
.settings-preview strong{font:700 calc(22px * var(--scale)) Georgia,serif}
.settings-preview p{font-size:calc(13px * var(--scale));margin:6px 0 0;color:#756274}
.settings-section{margin:19px 0}
.settings-section h3{font:700 calc(18px * var(--scale)) Georgia,serif;margin:0 0 10px}
.settings-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.row-icon{width:43px;height:43px;flex-shrink:0;border-radius:14px;background:#fff0f5;display:grid;place-items:center;font-size:21px}
.row-copy{flex:1;min-width:0}
.row-copy strong{display:block;font-size:calc(14px * var(--scale))}
.row-copy small{display:block;color:var(--muted);font-size:calc(12px * var(--scale));margin-top:4px;line-height:1.4}
.settings-row .btn{flex-shrink:0}
.settings-savebar{position:sticky;bottom:-18px;background:#fffafd;padding:12px 0 max(8px,env(safe-area-inset-bottom));margin-top:12px}
.range{width:100%;accent-color:var(--gold);min-height:32px}
#toast{display:none;position:fixed;z-index:100;left:14px;right:14px;bottom:calc(95px + env(safe-area-inset-bottom));padding:14px 16px;border-radius:15px;background:#51414f;color:white;font-size:14px;box-shadow:0 5px 25px #0002}
@media(min-width:650px){
 .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
 .nav{max-width:850px;left:50%;right:auto;transform:translateX(-50%);width:100%;border-radius:18px 18px 0 0}
 .modalback{align-items:center;padding:20px}
 .modal{border-radius:26px;max-height:88dvh}
}
@media(max-width:380px){
 .app{padding-left:10px;padding-right:10px}
 header{gap:9px}
 .profile{width:56px;height:56px;flex-basis:56px}
 .brand h1{font-size:calc(22px * var(--scale))}
 .hero{padding:16px}
 .btn{padding:11px 12px}
 .card{padding:12px}
}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="profile" id="profileBox"></div>
 <div class="brand"><h1>Pure Shine</h1><small>Cleaning Manager · Business planner</small></div>
 <button class="topbtn" onclick="addMenu()" aria-label="Adaugă">＋</button>
</header>
<div class="banner" id="bannerBox"></div>
<input id="profileFile" type="file" accept="image/*" hidden>
<input id="bannerFile" type="file" accept="image/*" hidden>
<div id="view"><div class="card"><div class="empty">Se încarcă aplicația…</div></div></div>
</main>

<nav class="nav">
<button data-page="home" onclick="go('home')"><span>⌂</span>Acasă</button>
<button data-page="schedule" onclick="go('schedule')"><span>▦</span>Calendar</button>
<button data-page="clients" onclick="go('clients')"><span>♙</span>Clienți</button>
<button data-page="money" onclick="go('money')"><span>£</span>Financiar</button>
<button data-page="more" onclick="go('more')"><span>☷</span>Mai mult</button>
</nav>

<div class="modalback" id="modalback">
 <section class="modal" id="modal"></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>

<script>
'use strict';

const DBNAME='PureShineCleaningDB';
const STORE='app';
const RECORD='main';
const $=id=>document.getElementById(id);
const today=()=>{
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const uid=()=>Date.now()+Math.floor(Math.random()*99999);
const initial=()=>({
 version:8,
 settings:{zoom:100,businessName:'Pure Shine Cleaning',phone:'',email:'',address:'',invoicePrefix:'PSC',invoiceNext:1},
 clients:[],jobs:[],invoices:[],payments:[],expenses:[],holidays:[],history:[],images:{},activeTimer:null
});
let db=initial();
let page='home';
let selectedDate=today();
let mode='week';
let search='';
let idb=null;
let storageMode='local';
let toastTimer=null;
let timerInterval=null;

const DAY={'Luni':1,'Marți':2,'Miercuri':3,'Joi':4,'Vineri':5,'Sâmbătă':6,'Duminică':0};

function esc(s=''){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cash(n){
 return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
}
function dateObj(s){return new Date((s||today())+'T12:00:00');}
function dateText(s){
 return s?dateObj(s).toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'';
}
function minutes(s){
 if(!s||!s.includes(':'))return 0;
 const [h,m]=s.split(':').map(Number);
 return h*60+m;
}
function hours(a,b){
 let n=minutes(b)-minutes(a);
 if(n<0)n+=1440;
 return Math.max(0,n)/60;
}
function durationText(h){
 const n=Math.round((Number(h)||0)*60);
 return `${Math.floor(n/60)} h ${n%60} min`;
}
function getClient(id){return db.clients.find(c=>String(c.id)===String(id));}
function getJob(id){return db.jobs.find(j=>String(j.id)===String(id));}
function jobHours(j){return Number.isFinite(j.actualMinutes)?j.actualMinutes/60:hours(j.start,j.end);}
function doneJobs(){return db.jobs.filter(j=>j.status==='Finalizat');}
function revenue(){return doneJobs().reduce((s,j)=>s+(Number(j.price)||0),0);}
function totalExpenses(){return db.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);}
function paid(inv){return db.payments.filter(p=>String(p.invoiceId)===String(inv.id)).reduce((s,p)=>s+Number(p.amount||0),0);}
function balance(inv){return Math.max(0,Number(inv.total||0)-paid(inv));}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'');}

function toast(message){
 $('toast').textContent=message;
 $('toast').style.display='block';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$('toast').style.display='none',3200);
}
function history(action,details=''){
 db.history.unshift({id:uid(),at:new Date().toISOString(),action,details});
 db.history=db.history.slice(0,250);
}

function openDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(Error('IndexedDB unavailable'));return;}
  const request=indexedDB.open(DBNAME,1);
  request.onupgradeneeded=()=>{
   if(!request.result.objectStoreNames.contains(STORE))request.result.createObjectStore(STORE);
  };
  request.onsuccess=()=>{idb=request.result;resolve(idb);};
  request.onerror=()=>reject(request.error);
 });
}
function dbGet(){
 return new Promise((resolve,reject)=>{
  const request=idb.transaction(STORE,'readonly').objectStore(STORE).get(RECORD);
  request.onsuccess=()=>resolve(request.result||null);
  request.onerror=()=>reject(request.error);
 });
}
function dbPut(value){
 return new Promise((resolve,reject)=>{
  const tx=idb.transaction(STORE,'readwrite');
  tx.objectStore(STORE).put(value,RECORD);
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}
async function persist(){
 try{
  if(storageMode==='indexedDB'&&idb){await dbPut(db);return true;}
  localStorage.setItem('pureShineManager_v7',JSON.stringify(db));
  return true;
 }catch(error){
  toast('Salvarea a eșuat. Descarcă un backup și eliberează spațiu.');
  return false;
 }
}
async function save(action,details=''){
 history(action,details);
 return persist();
}

const presets=[
 ['Lottie','Agency',16,'Săptămânal','Luni','13:00','15:00'],
 ['Christine','Private',18,'La 2 săptămâni','Marți','09:30','12:30'],
 ['Matt','Agency',16,'Săptămânal','Marți','09:00','13:00'],
 ['Sonia','Agency',16,'Săptămânal','Miercuri','09:00','14:00'],
 ['Laura','Private',18,'Săptămânal','Joi','09:00','13:00'],
 ['Hannah','Agency',16,'Săptămânal','Joi','13:00','16:00'],
 ['Meghan','Private',null,'Ocazional','Nesetată','',''],
 ['Johanna','Private',null,'La 2 săptămâni','Vineri','',''],
 ['Sindu','Agency',16,'La 2 săptămâni','Vineri','',''],
 ['Peter','Private',null,'Ocazional','Nesetată','',''],
 ['Mike','Private',null,'La 3 săptămâni','Nesetată','','']
];

function seedClients(){
 for(const p of presets){
  const existing=db.clients.find(c=>norm(c.name)===norm(p[0])||(p[0]==='Johanna'&&norm(c.name)==='joanna'));
  if(!existing){
   db.clients.push({
    id:uid(),name:p[0],type:p[1],rate:p[2],frequency:p[3],day:p[4],
    start:p[5],end:p[6],phone:'',address:'',notes:'',archived:false,
    week:p[0]==='Sindu'?'B':'A',anchorWeek:'2026-10-05',
    anchorDate:p[0]==='Christine'?'2026-10-13':''
   });
  }
 }
 const g=db.clients.find(c=>norm(c.name)==='gill');
 if(g)g.archived=true;
}

function occurs(c,date){
 if(c.archived||!c.day||!Object.prototype.hasOwnProperty.call(DAY,c.day)||!c.start||!c.end||dateObj(date).getDay()!==DAY[c.day])return false;
 if(c.frequency==='Ocazional')return false;
 if(c.frequency==='La 2 săptămâni'){
  if(c.anchorDate){
   const n=Math.round((dateObj(date)-dateObj(c.anchorDate))/86400000);
   return n>=0&&n%14===0;
  }
  let a=dateObj(c.anchorWeek||'2026-10-05'),b=dateObj(date);
  a.setDate(a.getDate()-((a.getDay()+6)%7));
  b.setDate(b.getDate()-((b.getDay()+6)%7));
  return ((Math.round((b-a)/604800000)%2)+2)%2===(c.week==='B'?1:0);
 }
 if(c.frequency==='La 3 săptămâni'){
  const n=Math.round((dateObj(date)-dateObj(c.anchorDate||date))/86400000);
  return n>=0&&n%21===0;
 }
 return c.frequency==='Săptămânal';
}

function generate(){
 let changed=false;
 for(let i=0;i<42;i++){
  const d=dateObj(today());
  d.setDate(d.getDate()+i);
  const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  for(const c of db.clients){
   if(!occurs(c,date))continue;
   if(db.holidays.some(h=>String(h.clientId)===String(c.id)&&date>=h.from&&date<=h.to))continue;
   if(db.jobs.some(j=>String(j.clientId)===String(c.id)&&j.date===date))continue;
   const rate=Number(c.rate)||0;
   db.jobs.push({
    id:uid(),clientId:c.id,date,start:c.start,end:c.end,rate,
    price:Math.round(hours(c.start,c.end)*rate*100)/100,
    status:'Programat',notes:'',autoGenerated:true
   });
   changed=true;
  }
 }
 if(changed)db.jobs.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 return changed;
}

function applyZoom(){
 const zoom=Math.min(1.6,Math.max(1,Number(db.settings.zoom)||100))/100;
 document.documentElement.style.setProperty('--scale',String(zoom));
}
function renderImages(){
 const profile=db.images?.profile;
 const banner=db.images?.banner;
 $('profileBox').innerHTML=
  (profile?`<img src="${profile}" alt="Poză de profil">`:'<span style="font-size:30px">✨</span>')+
  '<button class="editphoto" aria-label="Schimbă poza de profil" onclick="$(\\'profileFile\\').click()">✎</button>';
 $('bannerBox').innerHTML=
  (banner?`<img src="${banner}" alt="Banner">`:'<div class="banner-empty">✨</div>')+
  `<button class="banner-edit" onclick="$('${'bannerFile'}').click()">${banner?'📷 Schimbă bannerul':'📷 Adaugă banner'}</button>`;
}
function go(nextPage){page=nextPage;render();}
function setView(html){$('view').innerHTML=html;}
function render(){
 applyZoom();
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='home')home();
 else if(page==='schedule')schedule();
 else if(page==='clients')clients();
 else if(page==='money')money();
 else more();
 renderImages();
}

function jobCard(j){
 const c=getClient(j.clientId);
 return `<div class="item">
  <div class="itemtop">
   <div><strong>${esc(c?.name||'Client')}</strong>
    <div class="muted">${dateText(j.date)} · ${esc(j.start)}–${esc(j.end)} · ${durationText(jobHours(j))}</div>
    <span class="pill ${j.status==='Finalizat'?'green':j.status==='Anulat'?'pink':'gold'}">${esc(j.status)}</span>
   </div>
   <strong class="itemprice">${cash(j.price)}</strong>
  </div>
  <div class="btnrow">
   <button class="btn small soft" onclick="jobForm(${j.id})">Editează</button>
   ${j.status==='Programat'?`<button class="btn small" onclick="startTimer(${j.id})">▶ Timer</button><button class="btn small" onclick="finishJob(${j.id})">Finalizează</button>`:''}
   <button class="btn small danger" onclick="deleteJob(${j.id})">Șterge</button>
  </div>
 </div>`;
}

function home(){
 const list=db.jobs.filter(j=>j.date===today()&&j.status!=='Anulat').sort((a,b)=>a.start.localeCompare(b.start));
 const next=db.jobs.filter(j=>j.date>today()&&j.status==='Programat').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,3);
 setView(`
  <div class="hero">
   <div class="muted">${dateText(today())}</div>

function weekStart(s){
 const d=dateObj(s);d.setDate(d.getDate()-((d.getDay()+6)%7));
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function shiftDate(s,n){
 const d=dateObj(s);d.setDate(d.getDate()+n);
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function saveClient(e,id){
 e.preventDefault();
 const f=new FormData(e.target),old=id?getClient(id):null;
 const c={...(old||{}),id:old?.id||uid(),name:f.get('name').trim(),phone:f.get('phone'),rate:f.get('rate')===''?null:Number(f.get('rate')),address:f.get('address'),type:f.get('type'),frequency:f.get('frequency'),day:f.get('day'),week:f.get('week'),start:f.get('start'),end:f.get('end'),notes:f.get('notes'),archived:false};
 if(c.frequency==='La 2 săptămâni'&&!c.anchorDate&&!c.anchorWeek)c.anchorWeek=today();
 if(c.frequency==='La 3 săptămâni'&&!c.anchorDate)c.anchorDate=today();
 if(old){

async function saveJob(e,id){
 e.preventDefault();
 const f=new FormData(e.target),old=id?getJob(id):null,start=f.get('start'),end=f.get('end'),rate=Number(f.get('rate')),h=hours(start,end);
 if(h<=0){toast('Verifică orele introduse.');return;}
 const j={...(old||{}),id:old?.id||uid(),clientId:f.get('clientId'),date:f.get('date'),start,end,rate,price:Math.round(h*rate*100)/100,status:f.get('status'),notes:f.get('notes'),autoGenerated:false};
 delete j.actualMinutes;
 if(old)Object.assign(old,j);else db.jobs.push(j);
 await save(old?'Job actualizat':'Job adăugat');generate();await persist();closeModal();render();
}

async function finishJob(id){
 const j=getJob(id);if(!j)return;
 const raw=prompt('Durata reală în minute:',String(Math.round(hours(j.start,j.end)*60)));
 if(raw===null)return;
 const n=Number(raw);
 if(!Number.isFinite(n)||n<=0){toast('Introdu durata în minute.');return;}
 j.actualMinutes=Math.round(n);j.price=Math.round(n/60*Number(j.rate)*100)/100;j.status='Finalizat';
 await save('Job finalizat',getClient(j.clientId)?.name||'');render();
}

async function startTimer(id){
 const j=getJob(id);if(!j)return;
 if(db.activeTimer&&!confirm('Înlocuiești timerul activ?'))return;
 db.activeTimer={jobId:j.id,clientId:j.clientId,startedAt:Date.now(),pausedAt:null,pausedMs:0};
 await save('Timer pornit');render();
}
function timerElapsed(){
 const t=db.activeTimer;if(!t)return '00:00:00';
 const end=t.pausedAt||Date.now();
 const seconds=Math.max(0,Math.floor((end-t.startedAt-(t.pausedMs||0))/1000));
 return [Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(x=>String(x).padStart(2,'0')).join(':');
}
function startTicker(){
 if(timerInterval)clearInterval(timerInterval);
 if(!db.activeTimer||page!=='home')return;
 timerInterval=setInterval(()=>{
  const el=$('timerDisplay');
  if(!db.activeTimer||page!=='home'){clearInterval(timerInterval);timerInterval=null;return;}
  if(el)el.textContent=timerElapsed();
 },1000);
}
async function pauseTimer(){
 const t=db.activeTimer;if(!t)return;
 if(t.pausedAt){t.pausedMs+=(Date.now()-t.pausedAt);t.pausedAt=null;}
 else t.pausedAt=Date.now();
 await save('Timer actualizat');render();
}
async function stopTimer(){
 const t=db.activeTimer;if(!t)return;
 const j=getJob(t.jobId);
 if(j){
  const n=Math.max(1,Math.round(((t.pausedAt||Date.now())-t.startedAt-(t.pausedMs||0))/60000));
  j.actualMinutes=n;j.price=Math.round(n/60*Number(j.rate)*100)/100;j.status='Finalizat';
 }
 db.activeTimer=null;
 await save('Job finalizat din timer');render();
}

 $('zoomValue').textContent=zoom+'%';
 $('zoomSlider').value=zoom;
 db.settings.zoom=zoom;
 applyZoom();
 $('zoomPreview').style.fontSize=(16*zoom/100)+'px';
}

}

function resizeImage(file,maxW,maxH){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const scale=Math.min(1,maxW/img.width,maxH/img.height);
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.width*scale));
   canvas.height=Math.max(1,Math.round(img.height*scale));
   const ctx=canvas.getContext('2d');
   if(!ctx){URL.revokeObjectURL(url);reject(Error('Canvas unavailable'));return;}
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   URL.revokeObjectURL(url);
   resolve(canvas.toDataURL('image/jpeg',.76));
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image error'));};
  img.src=url;
 });
}
async function saveImage(e,key){
 const file=e.target.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/')){toast('Alege un fișier imagine.');e.target.value='';return;}
 try{
  const data=await resizeImage(file,key==='banner'?1400:600,key==='banner'?450:600);
  const previous=db.images[key];db.images[key]=data;
  if(await persist()){renderImages();toast(key==='banner'?'Banner salvat.':'Poza de profil salvată.');}
  else{db.images[key]=previous;toast('Imaginea nu a putut fi salvată. Descarcă un backup și încearcă o imagine mai mică.');}
 }catch(error){toast('Nu am putut procesa imaginea. Încearcă un JPG sau PNG mai mic.');}
 e.target.value='';
}
$('profileFile').addEventListener('change',e=>saveImage(e,'profile'));
$('bannerFile').addEventListener('change',e=>saveImage(e,'banner'));

async function backup(){
 if(!(await persist()))return;
 const blob=new Blob([JSON.stringify(db)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=`pure-shine-backup-${today()}.json`;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importBackup(e){
 const file=e.target.files?.[0];if(!file)return;
 try{
  const x=JSON.parse(await file.text());
  if(!x||!Array.isArray(x.clients)||!Array.isArray(x.jobs))throw Error('Invalid backup');
  if(!confirm('Backupul va înlocui datele actuale. Continui?'))return;
  db={...initial(),...x,settings:{...initial().settings,...x.settings},images:x.images||{}};
  generate();await persist();applyZoom();toast('Backup restaurat.');closeModal();render();
 }catch(error){toast('Fișierul nu este un backup valid.');}
 finally{e.target.value='';}
}
$('importFile').addEventListener('change',importBackup);

function exportCSV(type){
 let rows=[];
 if(type==='jobs')rows=[['Data','Client','Început','Final','Minute','Tarif','Sumă','Status'],...db.jobs.map(j=>[j.date,getClient(j.clientId)?.name,j.start,j.end,Math.round(jobHours(j)*60),j.rate,j.price,j.status])];
 if(type==='clients')rows=[['Nume','Telefon','Adresă','Tip','Tarif','Frecvență','Zi'],...db.clients.map(c=>[c.name,c.phone,c.address,c.type,c.rate,c.frequency,c.day])];
 if(type==='invoices')rows=[['Număr','Client','Data','Scadență','Total','Plătit','Restant'],...db.invoices.map(i=>[i.number,getClient(i.clientId)?.name||i.clientName,i.date,i.due,i.total,paid(i),balance(i)])];
 const content=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=`pure-shine-${type}-${today()}.csv`;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function boot(){
 try{
  try{
   await openDB();storageMode='indexedDB';
   const saved=await dbGet();
   if(saved)db={...initial(),...saved,settings:{...initial().settings,...saved.settings},images:saved.images||{}};
   else{
    for(const key of ['pureShineManager_v7','pureShineManager_v6','pureShineManager_v5','pureShineManager_v4','pureShineCleaningManager','pureShineManager']){
     try{
      const old=JSON.parse(localStorage.getItem(key)||'null');
      if(old){db={...initial(),...old,settings:{...initial().settings,...old.settings},images:old.images||{}};break;}
     }catch(error){}
    }
   }
  }catch(error){
   storageMode='local';
   for(const key of ['pureShineManager_v7','pureShineManager_v6','pureShineManager_v5','pureShineManager_v4','pureShineCleaningManager','pureShineManager']){
    try{
     const old=JSON.parse(localStorage.getItem(key)||'null');
     if(old){db={...initial(),...old,settings:{...initial().settings,...old.settings},images:old.images||{}};break;}
    }catch(error){}
   }
  }
  seedClients();
  generate();
  await persist();
  applyZoom();
  render();
 }catch(error){
  console.error('Pure Shine startup error:',error);
  $('view').innerHTML='<div class="card"><h2>Nu am putut încărca aplicația</h2><p class="muted">Încearcă să reîncarci pagina. Dacă problema persistă, restaurează un backup.</p><button class="btn primary" onclick="location.reload()">Reîncarcă</button></div>';
 }
}
window.addEventListener('pageshow',()=>{if(db.activeTimer&&page==='home')startTicker();});
boot();
</script>
