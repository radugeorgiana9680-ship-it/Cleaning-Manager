<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4c6da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light">
<link rel="apple-touch-icon" href="icon.png">

<title>Pure Shine Cleaning Manager ✨</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#343348;
    background:
        linear-gradient(rgba(249,246,251,.86),rgba(249,246,251,.94)),
        url("background.jpg") center/cover fixed no-repeat;
}

button,input,select,textarea{
    font:inherit;
}

input,select,textarea{
    font-size:16px!important;
}

button{
    border:0;
    touch-action:manipulation;
}

.app{
    width:100%;
    min-height:100vh;
    padding-bottom:90px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:50;
    width:100%;
    min-height:105px;
    padding:14px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.97);
    border-bottom:1px solid #eee5ed;
    backdrop-filter:blur(15px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.logo{
    width:65px;
    height:65px;
    flex:0 0 65px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 6px 18px rgba(170,80,120,.18);
}

.logo-fallback{
    display:none;
    width:65px;
    height:65px;
    border-radius:20px;
    background:#f2b8d0;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.brand-title{
    font-size:26px;
    font-weight:850;
    white-space:nowrap;
}

.brand-subtitle{
    color:#8b879c;
    font-size:14px;
    margin-top:3px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    width:52px;
    height:52px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    background:#efabc8;
    color:white;
}

.header-btn.timer{
    background:#e5daf7;
    color:#655b7d;
}

/* CONTENT */

.content{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:25px 18px 30px;
}

.greeting{
    margin:0;
    font-size:39px;
    line-height:1;
}

.date{
    color:#8b879c;
    margin-top:8px;
    font-size:16px;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:25px;
}

.stat{
    min-height:135px;
    padding:17px;
    border-radius:25px;
}

.stat.jobs{background:#f8dce8}
.stat.hours{background:#e9e0f8}
.stat.earned{background:#ddf1e6}
.stat.available{background:#fff0c9}

.stat-icon{
    font-size:25px;
}

.stat-label{
    color:#777388;
    font-size:14px;
    margin-top:7px;
}

.stat-value{
    font-size:28px;
    font-weight:850;
    margin-top:3px;
}

/* TODAY */

.section{
    margin-top:28px;
}

.section-title{
    margin:0;
    font-size:26px;
    font-weight:850;
}

.today-card{
    background:white;
    border-radius:22px;
    padding:17px 18px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 6px 20px rgba(60,50,75,.07);
}

.today-client{
    font-size:20px;
    font-weight:850;
}

.today-standard{
    color:#817b8d;
    margin-top:4px;
    font-size:15px;
}

.today-standard strong{
    color:#a9577e;
}

/* QUICK ACTIONS */

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.quick{
    min-height:105px;
    padding:18px;
    border-radius:23px;
    text-align:left;
    font-weight:800;
    color:#403c51;
}

.quick.pink{background:#f8dce8}
.quick.purple{background:#e9e0f8}

.quick-icon{
    display:block;
    font-size:29px;
    margin-bottom:9px;
}

/* TIMER BANNER */

.timer-banner{
    position:sticky;
    top:105px;
    z-index:40;
    width:100%;
    min-height:46px;
    padding:9px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:linear-gradient(90deg,#d88eb2,#aa8fcf);
    color:white;
    font-size:13px;
    font-weight:750;
}

.timer-banner strong{
    font-size:16px;
    letter-spacing:1px;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:100;
    height:80px;
    padding-bottom:env(safe-area-inset-bottom);
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:rgba(255,255,255,.98);
    border-top:1px solid #e8e1e9;
}

.nav{
    background:none;
    color:#8a8698;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-weight:800;
}

.nav-icon{
    font-size:21px;
}

.nav.active{
    color:#b45d87;
}

/* BUTTONS */

.primary{
    min-height:47px;
    padding:0 18px;
    border-radius:15px;
    background:#df99ba;
    color:white;
    font-weight:800;
}

.secondary{
    min-height:44px;
    padding:0 14px;
    border-radius:14px;
    background:#eee7f8;
    color:#665a83;
    font-weight:800;
}

.danger{
    min-height:44px;
    padding:0 14px;
    border-radius:14px;
    background:#ffe8ee;
    color:#bd5473;
    font-weight:800;
}

/* CALENDAR */

.calendar{
    margin-top:15px;
}

.calendar-header{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-bottom:7px;
}

.calendar-day-name{
    text-align:center;
    color:#8b8797;
    font-size:11px;
    font-weight:800;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.calendar-cell{
    min-height:115px;
    padding:7px 5px;
    border-radius:14px;
    background:rgba(255,255,255,.86);
    border:1px solid #eee8ef;
    overflow:hidden;
}

.calendar-cell.today{
    border:2px solid #e0a1be;
    background:#fff6fa;
}

.calendar-date{
    font-size:12px;
    font-weight:850;
    color:#8d8797;
    margin-bottom:6px;
}

.calendar-client{
    padding:7px 4px;
    border-radius:10px;
    background:#f3d9e5;
    color:#5a4350;
    font-size:11px;
    line-height:1.25;
    font-weight:800;
    word-break:break-word;
}

.calendar-time{
    margin-top:3px;
    font-size:9px;
    color:#8b7580;
    font-weight:600;
}

.calendar-empty{
    color:#c0bac4;
    font-size:10px;
    text-align:center;
    margin-top:18px;
}

/* CARDS */

.card{
    background:white;
    padding:18px;
    border-radius:23px;
    margin-bottom:12px;
    box-shadow:0 7px 22px rgba(60,50,75,.06);
}

.card-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.card-name{
    font-size:20px;
    font-weight:850;
}

.card-details{
    color:#858094;
    font-size:14px;
    line-height:1.65;
    margin-top:6px;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

/* JOB HISTORY */

.client-history{
    margin-top:17px;
}

.client-history-title{
    padding:14px 16px;
    border-radius:18px;
    background:#f5e2eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:850;
}

.client-total{
    color:#a9577e;
}

.history-job{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-top:7px;
    box-shadow:0 5px 17px rgba(60,50,75,.05);
}

.history-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.history-date{
    font-weight:800;
}

.history-money{
    font-size:19px;
    font-weight:850;
    color:#ad527c;
}

.history-hours{
    color:#817b8d;
    font-size:14px;
    margin-top:5px;
}

.exact-time{
    color:#5e586b;
    font-size:13px;
    margin-top:3px;
}

/* MODAL */

.modal-bg{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(35,29,44,.42);
}

.modal{
    width:100%;
    max-width:620px;
    max-height:93vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:23px 20px 40px;
    border-radius:30px 30px 0 0;
    background:#fbf9fc;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-title{
    margin:0;
    font-size:27px;
    font-weight:850;
}

.close{
    width:43px;
    height:43px;
    border-radius:50%;
    background:#eee8f1;
    font-size:24px;
    color:#595469;
}

.form-group{
    margin-bottom:15px;
}

.label{
    display:block;
    margin-bottom:7px;
    color:#777287;
    font-size:13px;
    font-weight:800;
}

.control{
    width:100%;
    min-height:51px;
    padding:10px 13px;
    border:1px solid #ddd6e2;
    border-radius:15px;
    background:white;
    color:#383548;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

/* TIMER */

.timer-box{
    padding:24px;
    border-radius:27px;
    background:linear-gradient(135deg,#f8dce8,#e8def7);
    text-align:center;
}

.timer-display{
    font-size:47px;
    font-weight:850;
    letter-spacing:2px;
    margin:10px 0 22px;
}

.timer-info{
    margin-top:15px;
    padding:16px;
    border-radius:18px;
    background:rgba(255,255,255,.75);
}

.timer-big{
    display:block;
    margin:6px 0 13px;
    font-size:28px;
    color:#b04f7c;
}

/* EMPTY */

.empty{
    padding:38px 15px;
    text-align:center;
    color:#8d8798;
    background:rgba(255,255,255,.7);
    border-radius:23px;
}

.empty-icon{
    font-size:40px;
    margin-bottom:7px;
}

/* MOBILE */

@media(max-width:390px){

    .header{
        padding-left:11px;
        padding-right:11px;
    }

    .logo,
    .logo-fallback{
        width:59px;
        height:59px;
        flex-basis:59px;
    }

    .brand{
        gap:8px;
    }

    .brand-title{
        font-size:22px;
    }

    .brand-subtitle{
        font-size:12px;
    }

    .header-btn{
        width:47px;
        height:47px;
    }

    .content{
        padding-left:13px;
        padding-right:13px;
    }

    .calendar-cell{
        min-height:105px;
    }

    .calendar-client{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =====================================================
   DATA
===================================================== */

const STORAGE_KEY="pureShineCleaningManager_200";
const TIMER_KEY="pureShineCleaningManager_TIMER";

const defaultClients=[
    {
        id:1,
        name:"Tosca",
        type:"agency",
        rate:16,
        day:"Monday",
        start:"09:00",
        end:"12:00",
        freq:"weekly",
        week:"A"
    },
    {
        id:2,
        name:"Lottie",
        type:"agency",
        rate:16,
        day:"Monday",
        start:"13:00",
        end:"15:00",
        freq:"weekly",
        week:"A"
    },
    {
        id:3,
        name:"Christine",
        type:"private",
        rate:18,
        day:"Tuesday",
        start:"09:30",
        end:"12:30",
        freq:"weekly",
        week:"A"
    },
    {
        id:4,
        name:"Matt",
        type:"agency",
        rate:16,
        day:"Tuesday",
        start:"13:00",
        end:"17:00",
        freq:"weekly",
        week:"A",
        variable:true
    },
    {
        id:5,
        name:"Sonia",
        type:"agency",
        rate:16,
        day:"Wednesday",
        start:"09:00",
        end:"14:00",
        freq:"weekly",
        week:"A",
        variable:true
    },
    {
        id:7,
        name:"Laura",
        type:"private",
        rate:18,
        day:"Thursday",
        start:"09:00",
        end:"13:00",
        freq:"weekly",
        week:"A",
        variable:true
    },
    {
        id:8,
        name:"Hannah",
        type:"agency",
        rate:16,
        day:"Thursday",
        start:"13:00",
        end:"16:00",
        freq:"weekly",
        week:"A"
    },
    {
        id:9,
        name:"Joanna",
        type:"private",
        rate:18,
        day:"Friday",
        start:"09:30",
        end:"13:30",
        freq:"fortnightly",
        week:"A",
        variable:true
    },
    {
        id:10,
        name:"Sindu",
        type:"agency",
        rate:16,
        day:"Friday",
        start:"09:30",
        end:"12:30",
        freq:"fortnightly",
        week:"B"
    }
];

let data;

try{
    data=JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    );
}catch(e){
    data=null;
}

if(!data || !Array.isArray(data.clients)){
    data={
        clients:defaultClients,
        jobs:[]
    };
}

if(!Array.isArray(data.jobs)){
    data.jobs=[];
}

/* Gill must stay removed */
data.clients=data.clients.filter(
    c =>
        String(c.name||"").toLowerCase()
        !=="gill"
);

data.jobs=data.jobs.filter(
    j =>
        String(j.clientName||"").toLowerCase()
        !=="gill"
);

function saveData(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

saveData();

/* =====================================================
   TIMER
===================================================== */

let timer={
    running:false,
    clientId:null,
    startedAt:null,
    accumulated:0
};

try{
    const saved=
        JSON.parse(
            localStorage.getItem(TIMER_KEY)
        );

    if(saved){
        timer=saved;
    }
}catch(e){}

function saveTimer(){
    localStorage.setItem(
        TIMER_KEY,
        JSON.stringify(timer)
    );
}

/*
   Timer is based on Date.now().
   It therefore does NOT depend on the page
   running every second.
*/

function timerSeconds(){

    if(!timer.running){
        return Number(
            timer.accumulated||0
        );
    }

    return Number(
        timer.accumulated||0
    )+
    Math.max(
        0,
        Math.floor(
            (
                Date.now()-
                Number(timer.startedAt||0)
            )/1000
        )
    );
}

function timerText(seconds){

    seconds=Math.max(
        0,
        Math.floor(Number(seconds)||0)
    );

    const h=Math.floor(
        seconds/3600
    );

    const m=Math.floor(
        (seconds%3600)/60
    );

    const s=seconds%60;

    return String(h).padStart(2,"0")
        +":"
        +String(m).padStart(2,"0")
        +":"
        +String(s).padStart(2,"0");
}

function timerHours(){
    return timerSeconds()/3600;
}

/* =====================================================
   HELPERS
===================================================== */

function esc(v){
    return String(v==null?"":v)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function money(v){
    return "£"+
        Number(v||0).toFixed(2);
}

function minutes(t){

    if(!t)return 0;

    const p=t.split(":");

    return Number(p[0])*60+
        Number(p[1]);
}

function exactHours(start,end){
    return (
        minutes(end)-
        minutes(start)
    )/60;
}

function exactMinutes(start,end){
    return (
        minutes(end)-
        minutes(start)
    );
}

function formatExactHours(hours){

    const total=Math.round(
        Number(hours||0)*60
    );

    const h=Math.floor(
        total/60
    );

    const m=total%60;

    if(h && m){
        return h+"h "+m+"min";
    }

    if(h){
        return h+"h";
    }

    return m+"min";
}

function today(){

    const d=new Date();

    return d.getFullYear()+
        "-"+
        String(d.getMonth()+1).padStart(2,"0")+
        "-"+
        String(d.getDate()).padStart(2,"0");
}

function todayDay(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {weekday:"long"}
        );
}

function findClient(id){

    return data.clients.find(
        c =>
            Number(c.id)===
            Number(id)
    );
}

function formatDate(date){

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}

/* =====================================================
   HOME PAGE
===================================================== */

function homePage(){

    const todayJobs=
        data.jobs.filter(
            j =>
                j.date===today()
        );

    const totalHours=
        todayJobs.reduce(
            (s,j)=>
                s+Number(j.hours||0),
            0
        );

    const earned=
        todayJobs.reduce(
            (s,j)=>
                s+Number(j.price||0),
            0
        );

    const todayClients=
        data.clients
            .filter(
                c =>
                    c.day===todayDay()
            )
            .sort(
                (a,b)=>
                    minutes(a.start)-
                    minutes(b.start)
            );

    const available=
        todayClients.reduce(
            (s,c)=>
                s+
                exactHours(
                    c.start,
                    c.end
                ),
            0
        );

    let html="";

    html+=`
        <h1 class="greeting">Hello ✨</h1>
        <div class="date">
            ${new Date().toLocaleDateString(
                "en-GB",
                {
                    weekday:"long",
                    day:"numeric",
                    month:"long"
                }
            )}
        </div>
    `;

    html+=`
        <div class="dashboard">

            <div class="stat jobs">
                <div class="stat-icon">🧹</div>
                <div class="stat-label">Jobs</div>
                <div class="stat-value">
                    ${todayJobs.length}
                </div>
            </div>

            <div class="stat hours">
                <div class="stat-icon">⏱️</div>
                <div class="stat-label">Hours</div>
                <div class="stat-value">
                    ${formatExactHours(totalHours)}
                </div>
            </div>

            <div class="stat earned">
                <div class="stat-icon">💷</div>
                <div class="stat-label">Earned</div>
                <div class="stat-value">
                    ${money(earned)}
                </div>
            </div>

            <div class="stat available">
                <div class="stat-icon">🌸</div>
                <div class="stat-label">Available</div>
                <div class="stat-value">
                    ${formatExactHours(available)}
                </div>
            </div>

        </div>
    `;

    /* ONLY CLIENT + STANDARD HOURS ON HOME */

    html+=`
        <section class="section">
            <h2 class="section-title">
                Today's schedule
            </h2>
    `;

    if(todayClients.length){

        todayClients.forEach(c=>{

            html+=`
                <div class="today-card">

                    <div>
                        <div class="today-client">
                            ${esc(c.name)}
                        </div>

                        <div class="today-standard">
                            Standard:
                            <strong>
                                ${formatExactHours(
                                    exactHours(
                                        c.start,
                                        c.end
                                    )
                                )}
                            </strong>
                        </div>
                    </div>

                    <div>
                        ⏱️
                    </div>

                </div>
            `;
        });

    }else{

        html+=`
            <div class="empty">
                <div class="empty-icon">🌸</div>
                No cleaning jobs today.
            </div>
        `;
    }

    html+=`</section>`;

    /* ONLY TWO QUICK ACTIONS */

    html+=`
        <section class="section">

            <h2 class="section-title">
                Quick actions
            </h2>

            <div class="quick-grid">

                <button
                    class="quick purple"
                    onclick="openTimerSelector()"
                >
                    <span class="quick-icon">
                        ⏱️
                    </span>
                    Timer
                </button>

                <button
                    class="quick pink"
                    onclick="openJobForm()"
                >
                    <span class="quick-icon">
                        ➕
                    </span>
                    Add Job
                </button>

            </div>

        </section>
    `;

    return html;
}

/* =====================================================
   CALENDAR PAGE
===================================================== */

function getMonday(date){

    const d=new Date(date);

    const day=d.getDay();

    const diff=
        day===0
            ?-6
            :1-day;

    d.setDate(
        d.getDate()+diff
    );

    d.setHours(12,0,0,0);

    return d;
}

function dateISO(d){

    return d.getFullYear()+
        "-"+
        String(d.getMonth()+1).padStart(2,"0")+
        "-"+
        String(d.getDate()).padStart(2,"0");
}

function calendarPage(){

    const monday=
        getMonday(
            new Date()
        );

    const dayNames=[
        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat",
        "Sun"
    ];

    let html="";

    html+=`
        <div class="section-head">
            <h2 class="section-title">
                Weekly Calendar 📅
            </h2>
        </div>
    `;

    html+=`
        <div class="calendar">

            <div class="calendar-header">
    `;

    dayNames.forEach(
        day=>{
            html+=`
                <div class="calendar-day-name">
                    ${day}
                </div>
            `;
        }
    );

    html+=`
            </div>

            <div class="calendar-grid">
    `;

    for(let i=0;i<7;i++){

        const d=new Date(monday);

        d.setDate(
            monday.getDate()+i
        );

        const iso=dateISO(d);

        const dayName=
            d.toLocaleDateString(
                "en-GB",
                {weekday:"long"}
            );

        const clients=
            data.clients.filter(
                c =>
                    c.day===dayName
            );

        const isToday=
            iso===today();

        html+=`
            <div class="
                calendar-cell
                ${isToday?"today":""}
            ">

                <div class="calendar-date">
                    ${d.getDate()}
                </div>
        `;

        /*
           Only clients belonging to that
           exact day are displayed.
        */

        if(clients.length){

            clients.forEach(c=>{

                html+=`
                    <div
                        class="calendar-client"
                        onclick="openJobFormByClient(${c.id})"
                    >

                        ${esc(c.name)}

                        <div class="calendar-time">
                            ${esc(c.start)}
                            –
                            ${esc(c.end)}
                        </div>

                    </div>
                `;
            });

        }else{

            html+=`
                <div class="calendar-empty">
                    —
                </div>
            `;
        }

        html+=`
            </div>
        `;
    }

    html+=`
            </div>
        </div>
    `;

    html+=`
        <div class="note" style="margin-top:14px">
            Each day shows only the clients scheduled
            for that exact day.
        </div>
    `;

    return html;
}

/* =====================================================
   JOB HISTORY
===================================================== */

function jobsPage(){

    let html="";

    html+=`
        <div class="section-head">

            <h2 class="section-title">
                Job History 📋
            </h2>

            <button
                class="primary"
                onclick="openJobForm()"
            >
                ＋ Add
            </button>

        </div>
    `;

    if(!data.jobs.length){

        return html+
        `
            <div class="empty">
                <div class="empty-icon">
                    📋
                </div>
                No completed jobs yet.
            </div>
        `;
    }

    /*
       GROUP HISTORY BY CLIENT
    */

    const grouped={};

    data.jobs.forEach(job=>{

        const client=findClient(
            job.clientId
        );

        const name=
            client
                ?client.name
                :(job.clientName||"Unknown");

        if(!grouped[name]){
            grouped[name]=[];
        }

        grouped[name].push(job);
    });

    Object.keys(grouped)
        .sort()
        .forEach(name=>{

            const jobs=
                grouped[name].sort(
                    (a,b)=>
                        b.date.localeCompare(
                            a.date
                        )
                );

            const clientTotal=
                jobs.reduce(
                    (s,j)=>
                        s+
                        Number(j.price||0),
                    0
                );

            html+=`
                <div class="client-history">

                    <div class="client-history-title">

                        <span>
                            ${esc(name)}
                        </span>

                        <span class="client-total">
                            ${money(clientTotal)}
                        </span>

                    </div>
            `;

            jobs.forEach(job=>{

                const exactMins=
                    job.timerSeconds
                        ?Math.floor(
                            Number(
                                job.timerSeconds
                            )/60
                        )
                        :Math.round(
                            Number(
                                job.hours||0
                            )*60
                        );

                const h=Math.floor(
                    exactMins/60
                );

                const m=exactMins%60;

                let exactText="";

                if(h&&m){
                    exactText=
                        h+
                        " hours "+
                        m+
                        " minutes";
                }else if(h){
                    exactText=
                        h+
                        " hours";
                }else{
                    exactText=
                        m+
                        " minutes";
                }

                html+=`
                    <div class="history-job">

                        <div class="history-row">

                            <div class="history-date">
                                ${formatDate(
                                    job.date
                                )}
                            </div>

                            <div class="history-money">
                                ${money(
                                    job.price
                                )}
                            </div>

                        </div>

                        <div class="history-hours">
                            ⏱️ Worked:
                            <strong>
                                ${exactText}
                            </strong>
                        </div>
                `;

                if(job.start&&job.end){

                    html+=`
                        <div class="exact-time">
                            ${esc(job.start)}
                            –
                            ${esc(job.end)}
                        </div>
                    `;
                }

                html+=`
                        <div class="card-actions">

                            <button
                                class="secondary"
                                onclick="editJob(${job.id})"
                            >
                                ✏️ Edit
                            </button>

                            <button
                                class="danger"
                                onclick="deleteJob(${job.id})"
                            >
                                🗑️ Delete
                            </button>

                        </div>

                    </div>
                `;
            });

            html+=`
                </div>
            `;
        });

    return html;
}

    const existing=
        data.jobs.find(
            j =>
                j.date===today() &&
                Number(j.clientId)===
                Number(clientId)
        );

    if(existing){
        openJobForm(existing);
    }else{
        openJobForm({
            id:0,
            clientId:c.id,
            date:today(),
            start:c.start,
            end:c.end,
            status:"Paid"
        });
    }
}

    );

        "input",
        update
    );

    document.getElementById(
        "jobDate"
    ).addEventListener(
        "change",
        updateDay
    );

    updateDay();
    update();
}

/* =====================================================
   SAVE JOB
===================================================== */

function saveJob(id){

    const client=
        findClient(
            Number(
                document.getElementById(
                    "jobClient"
                ).value
            )
        );

    if(!client)return;

    const date=
        document.getElementById(
            "jobDate"
        ).value;

    const start=
        document.getElementById(
            "jobStart"
        ).value;

    const end=
        document.getElementById(
            "jobEnd"
        ).value;

    const rate=
        Number(
            document.getElementById(
                "jobRate"
            ).value
        );

    const status=
        document.getElementById(
            "jobStatus"
        ).value;

    if(
        !date||
        !start||
        !end||
        minutes(end)<=minutes(start)
    ){

        alert(
            "Please enter a valid Start and End time."
        );

        return;
    }

    /*
       EXACT CALCULATION:
       09:15 -> 13:40
       = 265 minutes
       = 4.4166666667 hours
    */

    const workedMinutes=
        exactMinutes(
            start,
            end
        );

    const workedHours=
        workedMinutes/60;

    const price=
        workedHours*rate;

    if(id){

        const job=data.jobs.find(
            j =>
                Number(j.id)===
                Number(id)
        );

        if(job){

            job.clientId=
                client.id;

            job.clientName=
                client.name;

            job.rate=
                rate;

            job.date=
                date;

            job.start=
                start;

            job.end=
                end;

            job.hours=
                workedHours;

            job.workedMinutes=
                workedMinutes;

            job.price=
                price;

            job.status=
                status;

        }

    }else{

        data.jobs.push({

            id:Date.now(),

            clientId:
                client.id,

            clientName:
                client.name,

            rate:
                rate,

            date:
                date,

            start:
                start,

            end:
                end,

            hours:
                workedHours,

            workedMinutes:
                workedMinutes,

            price:
                price,

            status:
                status,

            timerSeconds:
                0
        });
    }

    saveData();

    closeModal();

    render();
}

function saveClient(id){

    const name=
        document.getElementById(
            "clientName"
        ).value.trim();

    const type=
        document.getElementById(
            "clientType"
        ).value;

    const rate=
        Number(
            document.getElementById(
                "clientRate"
            ).value
        );

    const day=
        document.getElementById(
            "clientDay"
        ).value;

    const freq=
        document.getElementById(
            "clientFreq"
        ).value;

    const start=
        document.getElementById(
            "clientStart"
        ).value;

    const end=
        document.getElementById(
            "clientEnd"
        ).value;

    if(!name){
        alert("Please enter a client name.");
        return;
    }

    if(minutes(end)<=minutes(start)){
        alert(
            "Please enter a valid Start and End time."
        );
        return;
    }

    if(id){

        const c=findClient(id);

        if(c){

            c.name=name;
            c.type=type;
            c.rate=rate;
            c.day=day;
            c.freq=freq;
            c.start=start;
            c.end=end;
        }

    }else{

        data.clients.push({

            id:Date.now(),

            name:name,

            type:type,

            rate:rate,

            day:day,

            start:start,

            end:end,

            freq:freq,

            week:"A"
        });
    }

    saveData();

    closeModal();

    render();
}

function deleteClient(id){

    const c=findClient(id);

    if(!c)return;

    if(!confirm(
        "Delete "+c.name+"?"
    )){
        return;
    }

    data.clients=
        data.clients.filter(
            x =>
                Number(x.id)!==
                Number(id)
        );

    saveData();

    render();
}

            onclick="startSelectedTimer()"
        >
            ▶ Start Timer
        </button>
    `;

    openModal(html);
}

function startSelectedTimer(){

    const id=
        Number(
            document.getElementById(
                "timerClient"
            ).value
        );

    if(!id){
        alert(
            "Please choose a client."
        );
        return;
    }

    timer={
        running:true,
        clientId:id,
        startedAt:Date.now(),
        accumulated:0
    };

    saveTimer();

    closeModal();

    render();
}

function showTimer(id){

    const c=findClient(id);

    if(!c)return;

    let html=`
        <div class="modal-head">

            <h2 class="modal-title">
                ${esc(c.name)} ⏱️
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div class="timer-box">

            <div
                id="timerDisplay"
                class="timer-display"
            >
                ${timerText(
                    timerSeconds()
                )}
            </div>

            <button
                class="primary"
                style="
                    width:100%;
                    background:#766c82
                "
                onclick="stopTimer()"
            >
                ⏹ Stop & Save
            </button>

            <div class="timer-info">

                Worked

                <strong
                    id="timerHours"
                    class="timer-big"
                >
                    ${formatExactHours(
                        timerHours()
                    )}
                </strong>

                Earned

                <strong
                    id="timerMoney"
                    class="timer-big"
                >
                    ${money(
                        timerHours()*
                        Number(c.rate)
                    )}
                </strong>

            </div>

        </div>
    `;

    openModal(html);
}

function stopTimer(){

    if(!timer.running){
        return;
    }

    const c=findClient(
        timer.clientId
    );

    if(!c){
        resetTimer();
        return;
    }

    const seconds=
        timerSeconds();

    const workedMinutes=
        Math.floor(
            seconds/60
        );

    const workedHours=
        seconds/3600;

    const now=new Date();

    const started=
        new Date(
            Number(timer.startedAt)
        );

    const start=
        started.toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    const end=
        now.toLocaleTimeString(
            "en-GB",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    const price=
        workedHours*
        Number(c.rate);

    data.jobs.push({

        id:Date.now(),

        clientId:c.id,

        clientName:c.name,

        rate:Number(c.rate),

        date:today(),

        start:start,

        end:end,

        hours:workedHours,

        workedMinutes:workedMinutes,

        timerSeconds:seconds,

        price:price,

        status:"Paid"
    });

    resetTimer();

    saveData();

    closeModal();

    render();
}

function resetTimer(){

    timer={
        running:false,
        clientId:null,
        startedAt:null,
        accumulated:0
    };

    saveTimer();
}

/* =====================================================
   MODAL
===================================================== */

function openModal(content){

    closeModal();

    const bg=
        document.createElement(
            "div"
        );

    bg.id="modal";

    bg.className="modal-bg";

    const box=
        document.createElement(
            "div"
        );

    box.className="modal";

    box.innerHTML=content;

    box.onclick=e=>
        e.stopPropagation();

    bg.appendChild(box);

    bg.onclick=closeModal;

    document.body.appendChild(bg);
}

function closeModal(){

    const modal=
        document.getElementById(
            "modal"
        );

    if(modal){
        modal.remove();
    }
}

/* =====================================================
   NAVIGATION
===================================================== */

let currentPage="home";

function go(page){

    currentPage=page;

    closeModal();

    render();
}

function navButton(
    page,
    icon,
    label
){

    return `
        <button
            class="nav ${
                currentPage===page
                ?"active"
                :""
            }"
            onclick="go('${page}')"
        >
            <span class="nav-icon">
                ${icon}
            </span>
            ${label}
        </button>
    `;
}

function navigation(){

    return `
        <nav class="bottom-nav">

            ${navButton(
                "home",
                "🏠",
                "Home"
            )}

            ${navButton(
                "schedule",
                "📅",
                "Calendar"
            )}

            ${navButton(
                "clients",
                "👥",
                "Clients"
            )}

            ${navButton(
                "jobs",
                "📋",
                "Jobs"
            )}

            ${navButton(
                "earnings",
                "💷",
                "Earnings"
            )}

        </nav>
    `;
}

/* =====================================================
   RENDER
===================================================== */

function render(){

    let content="";

    if(currentPage==="home"){
        content=homePage();
    }

    if(currentPage==="schedule"){
        content=calendarPage();
    }

    if(currentPage==="clients"){
        content=clientsPage();
    }

    if(currentPage==="jobs"){
        content=jobsPage();
    }

    if(currentPage==="earnings"){
        content=earningsPage();
    }

    let banner="";

    if(timer.running){

        const c=
            findClient(
                timer.clientId
            );

        if(c){

            banner=`
                <div
                    class="timer-banner"
                    onclick="showTimer(${c.id})"
                >

                    <span>
                        ⏱️ ${esc(c.name)}
                    </span>

                    <strong id="bannerTimer">
                        ${timerText(
                            timerSeconds()
                        )}
                    </strong>

                    <span>
                        Tap
                    </span>

                </div>
            `;
        }
    }

    document.getElementById(
        "app"
    ).innerHTML=`

        <div class="app">

            ${banner}

            <header class="header">

                <div class="brand">

                    <img
                        id="mainLogo"
                        class="logo"
                        src="icon.png"
                        alt="Pure Shine"
                    >

                    <div
                        id="logoFallback"
                        class="logo-fallback"
                    >
                        ✨
                    </div>

                    <div>

                        <div class="brand-title">
                            Pure Shine
                        </div>

                        <div class="brand-subtitle">
                            Cleaning Manager ✨
                        </div>

                    </div>

                </div>

                <div class="header-actions">

                    <button
                        class="header-btn timer"
                        onclick="openTimerSelector()"
                    >
                        ⏱️
                    </button>

                    <button
                        class="header-btn"
                        onclick="openJobForm()"
                    >
                        +
                    </button>

                </div>

            </header>

            <main class="content">
                ${content}
            </main>

        </div>

        ${navigation()}
    `;

    const logo=
        document.getElementById(
            "mainLogo"
        );

    const fallback=
        document.getElementById(
            "logoFallback"
        );

    if(logo){

        logo.onerror=function(){

            logo.style.display="none";

            if(fallback){
                fallback.style.display="flex";
            }
        };
    }
}

/* =====================================================
   TIMER DISPLAY UPDATE
===================================================== */

setInterval(
    function(){

        if(!timer.running){
            return;
        }

        const seconds=
            timerSeconds();

        const display=
            document.getElementById(
                "timerDisplay"
            );

        const banner=
            document.getElementById(
                "bannerTimer"
            );

        const hours=
            document.getElementById(
                "timerHours"
            );

        const moneyBox=
            document.getElementById(
                "timerMoney"
            );

        if(display){
            display.textContent=
                timerText(seconds);
        }

        if(banner){
            banner.textContent=
                timerText(seconds);
        }

        if(hours){
            hours.textContent=
                formatExactHours(
                    seconds/3600
                );
        }

        const c=
            findClient(
                timer.clientId
            );

        if(moneyBox&&c){

            moneyBox.textContent=
                money(
                    (seconds/3600)*
                    Number(c.rate)
                );
        }

    },
    1000
);

/*
   Save timer when iOS puts the page
   into the background.
*/

document.addEventListener(
    "visibilitychange",
    function(){

        if(timer.running){
            saveTimer();
        }

        if(
            !document.hidden &&
            timer.running
        ){

            render();
        }
    }
);

window.addEventListener(
    "pagehide",
    function(){

        if(timer.running){
            saveTimer();
        }
    }
);

window.addEventListener(
    "beforeunload",
    function(){

        if(timer.running){
            saveTimer();
        }
    }
);

render();

</script>

</body>
</html>
