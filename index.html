<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7dce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pure Shine Cleaning Manager">

<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
  --pink:#f5c8d9;
  --pink-dark:#d9799b;
  --pink-soft:#fdebf3;
  --pink-light:#fff5f9;
  --gold:#c8a45d;
  --gold-light:#ead7a4;
  --text:#222;
  --muted:#70666b;
  --white:#fff;
  --blue:#e8f0ff;
  --blue-text:#174d8c;
  --green:#e6f5ec;
  --green-text:#28704a;
  --yellow:#fff4c9;
  --yellow-text:#755d08;
  --purple:#eee3ff;
  --purple-text:#65369c;
  --peach:#ffe6dc;
  --peach-text:#a94f2e;
  --shadow:0 5px 20px rgba(130,75,100,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f8dfe8;
  font-family:'DM Sans',sans-serif;
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  position:relative;
  padding-bottom:88px;
  overflow:hidden;
}

/* =========================
   WELCOME
========================= */

.welcome{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(
      rgba(255,244,248,.60),
      rgba(255,244,248,.78)
    ),
    url('pure-shine-cleaning-background.png') center/cover no-repeat;
}

.welcome::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(255,245,249,.18) 0%,
    rgba(255,244,248,.10) 45%,
    rgba(255,240,246,.60) 100%
  );
  pointer-events:none;
}

.welcome-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:520px;
  min-height:100vh;
  padding:
    calc(35px + env(safe-area-inset-top))
    28px
    calc(24px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
}

.welcome-logo{
  width:min(310px,70vw);
  height:min(310px,70vw);
  object-fit:contain;
  margin-top:18px;
  filter:drop-shadow(0 7px 14px rgba(130,70,90,.14));
}

.welcome-title{
  margin-top:5px;
  font-family:'Parisienne',cursive;
  color:#a54d6c;
  font-size:55px;
  line-height:.95;
  font-weight:400;
}

.welcome-subtitle{
  margin-top:8px;
  font-family:'Parisienne',cursive;
  color:#a54d6c;
  font-size:31px;
  line-height:1;
}

.welcome-heart{
  font-size:35px;
  color:#c36e89;
  margin-top:4px;
}

.welcome-features{
  width:100%;
  margin-top:auto;
  margin-bottom:24px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.welcome-feature{
  min-height:105px;
  border-radius:22px;
  background:rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.45);
  backdrop-filter:blur(5px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:8px 3px;
}

.welcome-feature-icon{
  color:#ae536f;
  font-size:36px;
  line-height:1;
  margin-bottom:7px;
}

.welcome-feature-text{
  color:#382e33;
  font-size:12px;
  line-height:1.25;
}

.welcome-feature-text strong{
  display:block;
  font-weight:500;
}

.welcome-start{
  width:100%;
  height:64px;
  border-radius:32px;
  background:#df7fa0;
  color:white;
  font-size:20px;
  font-weight:500;
  box-shadow:0 8px 20px rgba(190,105,135,.22);
}

.welcome-login{
  margin-top:22px;
  color:#61565b;
  font-size:14px;
}

.welcome-login span{
  color:#a54d6c;
  text-decoration:underline;
  font-weight:600;
  margin-left:5px;
}

/* =========================
   HEADER
========================= */

header{
  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    8px;
  background:#fff;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:58px;
  height:58px;
  object-fit:contain;
}

.brand-title{
  font-weight:700;
  font-size:22px;
  line-height:1.1;
  color:#171416;
}

.brand-sub{
  font-size:13px;
  color:#70676b;
  margin-top:3px;
}

.icon-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#fff;
  border:1px solid #f0e6ea;
  box-shadow:0 3px 12px rgba(90,50,70,.06);
  font-size:25px;
  color:#222;
}

/* =========================
   PAGE
========================= */

.page{
  padding:8px 16px 28px;
}

.date-card{
  margin-top:7px;
  min-height:77px;
  padding:13px 18px;
  border-radius:19px;
  background:#f9dce8;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.date-card-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.date-calendar{
  width:42px;
  height:42px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9c4866;
  font-size:28px;
}

.date-main{
  font-size:17px;
  font-weight:700;
  line-height:1.15;
}

.date-small{
  color:#62575d;
  font-size:13px;
  margin-top:4px;
}

.date-heart{
  color:#d36d91;
  font-size:33px;
}

/* =========================
   FLOWER BANNER
========================= */

.flower-banner{
  margin-top:10px;
  height:108px;
  border-radius:19px;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.82),
      rgba(255,245,249,.34)
    ),
    url('pure-shine-cleaning-background.png') center 58%/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.flower-banner::after{
  content:"🌸";
  position:absolute;
  right:20px;
  top:11px;
  font-size:34px;
  opacity:.8;
}

.flower-banner strong{
  font-family:'Parisienne',cursive;
  font-size:30px;
  font-weight:400;
  color:#8e6171;
  line-height:1.05;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:12px;
}

.stat{
  min-height:112px;
  border-radius:18px;
  padding:12px 7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stat:nth-child(1){
  background:#fde1eb;
}

.stat:nth-child(2){
  background:#e7edff;
}

.stat:nth-child(3){
  background:#e1f2e8;
}

.stat:nth-child(4){
  background:#fff2c8;
}

.stat-icon{
  font-size:27px;
  line-height:1;
  margin-bottom:7px;
}

.stat-label{
  color:#3f373b;
  font-size:11px;
  line-height:1.2;
}

.stat-value{
  font-size:18px;
  font-weight:700;
  margin-top:4px;
  line-height:1.1;
}

/* =========================
   SECTION
========================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:23px 2px 10px;
}

.section-title h2{
  margin:0;
  font-size:21px;
  font-weight:700;
  color:#171416;
}

.section-title span{
  font-size:13px;
  color:#a2496b;
}

/* =========================
   TODAY
========================= */

.today-schedule-box{
  background:#fff;
  border:1px solid #f3e8ec;
  border-radius:20px;
  min-height:210px;
  padding:20px 16px 15px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.today-empty-icon{
  width:55px;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e184a2;
  font-size:45px;
  margin-bottom:9px;
}

.today-empty-title{
  font-size:17px;
  font-weight:500;
  color:#272124;
}

.today-empty-sub{
  font-size:12px;
  color:#82777c;
  margin-top:6px;
}

.add-cleaning-btn{
  width:94%;
  height:53px;
  border-radius:28px;
  margin-top:17px;
  background:#df7d9e;
  color:#fff;
  font-size:17px;
  font-weight:500;
}

/* =========================
   SCHEDULE CARD
========================= */

.schedule-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#fff;
  border:1px solid #f0e6ea;
  border-radius:19px;
  padding:14px;
  box-shadow:var(--shadow);
  margin-bottom:10px;
}

.schedule-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.client-dot{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fde4ed;
  font-size:22px;
  flex-shrink:0;
}

.client-name{
  font-weight:700;
  color:#242023;
}

.client-meta{
  color:#83777d;
  font-size:12px;
  margin-top:3px;
}

.rate{
  font-weight:700;
  color:#a05270;
  white-space:nowrap;
}

.small-btn{
  width:39px;
  height:39px;
  border-radius:12px;
  background:#f9eaf0;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.quick{
  min-height:63px;
  padding:10px 14px;
  border-radius:17px;
  text-align:left;
  display:flex;
  align-items:center;
  gap:11px;
}

.quick:nth-child(1){
  background:#e5efff;
  color:#174d8c;
}

.quick:nth-child(2){
  background:#e3f4e9;
  color:#28704a;
}

.quick:nth-child(3){
  background:#fde1ec;
  color:#8d3559;
}

.quick:nth-child(4){
  background:#fff1c7;
  color:#70590c;
}

.quick:nth-child(5){
  background:#eee2ff;
  color:#63339a;
}

.quick:nth-child(6){
  background:#ffe5dc;
  color:#a24e30;
}

.quick .emoji{
  font-size:27px;
  line-height:1;
  width:34px;
  text-align:center;
}

.quick strong{
  display:block;
  font-size:14px;
  font-weight:500;
}

/* =========================
   QUOTE
========================= */

.quote-banner{
  margin-top:11px;
  min-height:105px;
  border-radius:18px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px 60px;
  background:
    linear-gradient(
      90deg,
      rgba(255,231,240,.94),
      rgba(255,235,242,.77)
    ),
    url('pure-shine-cleaning-background.png') center/cover no-repeat;
}

.quote-banner::before{
  content:"♡";
  position:absolute;
  left:25px;
  top:25px;
  color:#d87999;
  font-size:38px;
}

.quote-banner::after{
  content:"♡";
  position:absolute;
  right:23px;
  bottom:21px;
  color:#d87999;
  font-size:34px;
}

.quote-text{
  font-family:'Parisienne',cursive;
  color:#8c6171;
  font-size:31px;
  line-height:1.05;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);
  padding:
    6px
    7px
    calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(15px);
  border-top:1px solid #eee5e9;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  background:transparent;
  color:#777076;
  min-height:62px;
  border-radius:17px;
  font-size:11px;
}

.nav-btn span{
  display:block;
  font-size:27px;
  line-height:1;
  margin-bottom:5px;
}

.nav-btn.active{
  color:#c04e78;
  background:#fde5ee;
  font-weight:700;
}

/* =========================
   MODALS
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(45,30,38,.40);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:29px 29px 0 0;
  padding:20px 17px calc(25px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(70,40,55,.2);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h3{
  margin:0;
  font-size:21px;
}

.close{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#f9edf2;
  font-size:21px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  font-weight:700;
  color:#76656d;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #ecdde3;
  border-radius:14px;
  background:#fffafc;
  outline:none;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.primary{
  width:100%;
  padding:15px 20px;
  border-radius:18px;
  background:#df7d9e;
  color:#fff;
  font-weight:600;
}

.secondary{
  background:#f5edf0!important;
  color:#725d66!important;
}

.danger{
  background:#f5d7dd!important;
  color:#965766!important;
}

/* =========================
   TIMER
========================= */

.timer-box{
  text-align:center;
  padding:24px 10px;
  border-radius:25px;
  background:linear-gradient(135deg,#fff1f6,#fff9ec);
  margin-bottom:16px;
}

.timer-client{
  font-size:18px;
  font-weight:700;
}

.timer-time{
  font-size:53px;
  font-weight:700;
  letter-spacing:1px;
  margin:10px 0;
  color:#765563;
}

.timer-rate{
  color:var(--gold);
  font-weight:700;
}

.timer-live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:#9b6e79;
}

.live-dot{
  width:9px;
  height:9px;
  background:#c77987;
  border-radius:50%;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.75);
  }
}

.timer-earnings{
  margin-top:14px;
  font-size:18px;
  font-weight:700;
}

.timer-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* =========================
   CARDS
========================= */

.client-card,
.job-card,
.earning-card,
.setting-card{
  background:#fff;
  border-radius:20px;
  padding:15px;
  box-shadow:var(--shadow);
  border:1px solid #f1e7eb;
  margin-bottom:11px;
}

.client-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.client-actions{
  display:flex;
  gap:5px;
}

.job-card{
  position:relative;
}

.job-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.job-date{
  font-weight:700;
}

.job-status{
  padding:5px 9px;
  border-radius:10px;
  background:#e2efe6;
  color:#547861;
  font-size:10px;
  font-weight:700;
}

.job-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.job-info div{
  background:#fff6f9;
  padding:9px;
  border-radius:12px;
}

.job-info small{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.job-info strong{
  font-size:13px;
}

.job-buttons{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.job-buttons button{
  flex:1;
  padding:9px;
  border-radius:12px;
  background:#f6edf1;
  font-size:12px;
}

.earning-total{
  background:linear-gradient(135deg,#fff1f6,#fff8e9);
  border-radius:25px;
  padding:22px;
  box-shadow:var(--shadow);
  text-align:center;
}

.earning-total .money{
  font-size:36px;
  font-weight:700;
  color:#8f6877;
}

.earning-total .hours{
  color:var(--muted);
  margin-top:4px;
}

/* =========================
   WEEK / SETTINGS
========================= */

.week-row{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:5px;
}

.week-day{
  min-width:78px;
  padding:12px 8px;
  border-radius:17px;
  background:#fff;
  box-shadow:var(--shadow);
  text-align:center;
}

.week-day.today{
  background:#f5dce6;
}

.week-day small{
  display:block;
  color:var(--muted);
}

.week-day strong{
  display:block;
  font-size:18px;
  margin-top:4px;
}

.switch-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #f0e5e9;
}

.switch{
  width:50px;
  height:28px;
  border-radius:20px;
  background:#ddd;
  padding:3px;
}

.switch i{
  display:block;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch.on{
  background:#d9b6c5;
}

.switch.on i{
  transform:translateX(22px);
}

.zoom-value{
  font-weight:700;
  color:var(--gold);
}

.holiday{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.holiday-date{
  font-size:12px;
  color:var(--muted);
}

.day-title{
  font-weight:700;
  color:#92717f;
  margin:20px 2px 8px;
}

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
  background:#fff;
  border-radius:22px;
  border:1px solid #f1e7eb;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:1000;
  left:50%;
  bottom:105px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#493c42;
  color:#fff;
  padding:12px 17px;
  border-radius:15px;
  font-size:13px;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:390px){

  .welcome-logo{
    width:245px;
    height:245px;
  }

  .welcome-title{
    font-size:48px;
  }

  .welcome-subtitle{
    font-size:27px;
  }

  .welcome-feature{
    min-height:92px;
  }

  .welcome-feature-icon{
    font-size:30px;
  }

  .welcome-feature-text{
    font-size:10px;
  }

  .stat{
    min-height:104px;
  }

  .stat-value{
    font-size:16px;
  }

  .stat-label{

function uid(prefix='id'){

  return prefix+
    '_'+Date.now()+
    '_'+Math.random()
      .toString(36)
      .slice(2,8);

}


function money(n){

  return '£'+
    Number(n||0)
      .toFixed(2);

}


function formatMinutes(minutes){

  minutes=Math.max(
    0,
    Math.round(
      Number(minutes)||0
    )
  );

  const h=
    Math.floor(minutes/60);

  const m=
    minutes%60;

  return `${h}h ${String(m).padStart(2,'0')}m`;

}


function formatTime(seconds){

  seconds=Math.max(
    0,
    Math.floor(
      Number(seconds)||0
    )
  );

  const h=
    Math.floor(seconds/3600);

  const m=
    Math.floor(
      (seconds%3600)/60
    );

  const s=
    seconds%60;

  if(h>0){

    return (
      String(h).padStart(2,'0')+
      ':'+
      String(m).padStart(2,'0')+
      ':'+
      String(s).padStart(2,'0')
    );

  }

  return (
    String(m).padStart(2,'0')+
    ':'+
    String(s).padStart(2,'0')
  );

}


function dateISO(date=new Date()){

  const d=
    new Date(date);

  const y=
    d.getFullYear();

  const m=
    String(
      d.getMonth()+1
    ).padStart(2,'0');

  const day=
    String(
      d.getDate()
    ).padStart(2,'0');

  return `${y}-${m}-${day}`;

}


function displayDate(value){

  if(!value)return '';

  const d=
    new Date(
      value+'T12:00:00'
    );

  return d.toLocaleDateString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );

}


function getClient(id){

    c=>c.id===id
  );

function getWorkedMinutes(job){

  if(job.minutes!=null){

    return Number(
      job.minutes
    );

  }

  if(job.start&&job.end){

    const a=
      job.start
        .split(':')
        .map(Number);

    const b=
      job.end
        .split(':')
        .map(Number);

    let mins=
      (b[0]*60+b[1])-
      (a[0]*60+a[1]);

    if(mins<0){
      mins+=1440;
    }

    return mins;
  }

  return 0;
}


function calculateJobPay(job){

  const minutes=
    getWorkedMinutes(job);

  const rate=
    Number(job.rate||0);

  return (
    minutes/60
  )*rate;

}


function todayJobs(){

function totalHours(){

  return jobs.reduce(

  );

}


function totalEarned(){

}

function schedulePage(){

    'Wednesday',
    'Thursday',

    'Saturday',
    'Sunday'
  ];

  let html=`

  <section class="page">

    <div class="section-title">

      <h2>
        Weekly Schedule
      </h2>

      <span>
        Regular clients
      </span>

    </div>


    <div class="week-row">

      ${
        days.map(
          (d,i)=>{

            const jsDay=
              i===6
              ?0
              :i+1;

            const today=
              new Date().getDay();

            return `

            <div
              class="week-day ${
                today===jsDay
                ?'today'
                :''
              }"
            >

              <small>
                ${d.slice(0,3)}
              </small>

              <strong>
                ${getDateForDay(jsDay)}
              </strong>

            </div>

            `;

          }
        ).join('')
      }

    </div>

  `;


  days.forEach(
    (day,index)=>{

      const dayNum=
        index+1;

      const list=
        clients.filter(
          c=>
            c.day===dayNum &&
            c.frequency!=='Occasional'
        );


      html+=`

        <div class="day-title">
          ${day}
        </div>

      `;


      if(!list.length){

        html+=`

          <div class="empty">
            No regular jobs

        html+=
          list
            .map(
              c=>scheduleCard(
                c,

  );


  html+=`

    <div class="section-title">

      <h2>
        Job History

      <span>
        ${jobs.length} saved
      </span>

    ${

}

        'Unknown';

      if(!byClient[name]){

        byClient[name]={
          minutes:0,
          earnings:0,
          count:0

      byClient[name].minutes+=
        getWorkedMinutes(job);

      byClient[name].earnings+=
        calculateJobPay(job);

      byClient[name].count++;

    }
  );

/* =====================================================
   SCHEDULE LOGIC
===================================================== */

function getTodaySchedule(){

  const jsDay=
    new Date().getDay();

  const day=
    jsDay===0
    ?7
    :jsDay;


  return clients.filter(
    c=>{

      if(c.day!==day){
        return false;
      }

      if(
        c.frequency==='Occasional'
      ){
        return false;
      }

      if(
        c.frequency==='Weekly'
      ){
        return true;
      }

      const week=
        getWeekNumber(
          new Date()
        );


      if(
        c.frequency==='Fortnightly'
      ){
        return week%2===0;
      }


      if(
        c.frequency==='Every 3 weeks'
      ){
        return week%3===0;
      }


      return true;

    }
  );

}


function getDateForDay(day){

  const today=
    new Date();

  const current=
    today.getDay();

  const diff=
    day-current;

  const d=
    new Date(today);

  d.setDate(
    today.getDate()+diff
  );

  return d.getDate();

}


function getWeekNumber(date){

  const d=
    new Date(
      Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      )
    );

  const dayNum=
    d.getUTCDay()||7;

  d.setUTCDate(
    d.getUTCDate()+4-dayNum
  );

  const yearStart=
    new Date(
      Date.UTC(
        d.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (
      (
        (d-yearStart)/
        86400000
      )+1
    )/7
  );

}


function getFreeMinutes(){

  const start=
    8*60;

  const end=
    18*60;

  let busy=0;


  getTodaySchedule()
    .forEach(
      c=>{

        const s=
          c.start
            .split(':')
            .map(Number);

        const e=
          c.end
            .split(':')
            .map(Number);

        busy+=Math.max(
          0,
          (e[0]*60+e[1])-
          (s[0]*60+s[1])
        );

      }
    );


  return Math.max(
    0,
    end-start-busy
  );

}

/* =====================================================
   TIMER
===================================================== */

function openTimer(clientId){

  const client=
    getClient(clientId);

  if(!client)return;


  if(
    timer.active &&
    timer.clientId!==clientId
  ){

    showToast(
      'Please stop the current timer first.'
    );

    return;

  }


  if(!timer.active){

    timer.active=true;

    timer.clientId=
      clientId;

    timer.startTimestamp=
      Date.now();

    timer.elapsedBefore=0;

    startTimerInterval();

  }


  renderTimerModal();

}


function startTimerInterval(){

  clearInterval(
    timer.interval
  );

  timer.interval=
    setInterval(
      ()=>{

        if(timer.active){
          updateTimerDisplay();
        }

      },
      250
    );

}


function getTimerElapsedSeconds(){

  if(!timer.active){

    return timer.elapsedBefore;

  }


  return timer.elapsedBefore+
    Math.floor(
      (
        Date.now()-
        timer.startTimestamp
      )/1000
    );

}


function updateTimerDisplay(){

  const element=
    document.getElementById(
      'liveTimer'
    );


  if(element){

    element.textContent=
      formatTime(
        getTimerElapsedSeconds()
      );

  }


  const earn=
    document.getElementById(
      'liveEarnings'
    );


  if(earn){

    const client=
      getClient(
        timer.clientId
      );

    const seconds=
      getTimerElapsedSeconds();

    const value=
      seconds/3600*
      Number(
        client?.rate||0
      );

    earn.textContent=
      money(value);

  }

}


function renderTimerModal(){

  const client=
    getClient(
      timer.clientId
    );

  if(!client)return;


  openModal(`

    <div class="modal-head">

          getTimerElapsedSeconds()
        )}
      </div>

        ${money(client.rate)}
        per hour

      </div>


      <div class="timer-earnings">

        Current earnings:
        <span id="liveEarnings">
          ${
            money(
              getTimerElapsedSeconds()/
              3600*
              client.rate
            )
          }
        </span>

      </div>

    </div>


    <div class="timer-actions">

      <button
        class="primary danger"
        onclick="stopTimerAndSave()"
      >
        ⏹ Stop & Save Job
      </button>


      <button
        class="primary secondary"
        onclick="closeTimerWithoutStopping()"
      >
        Continue in background
      </button>

    </div>


    <p
      style="
        text-align:center;
        color:#9a8990;
        font-size:11px;
        margin-top:13px
      "
    >
      Your timer uses the exact start and finish
      timestamps and automatically calculates
      what the client should pay.
    </p>

  `);


  updateTimerDisplay();

}


function closeTimerWithoutStopping(){

  closeModal();

}


function stopTimerAndSave(){

  if(
    !timer.active||
    !timer.clientId
  ){
    return;
  }


  const client=
    getClient(
      timer.clientId
    );


  if(!client)return;


  const seconds=
    getTimerElapsedSeconds();


  const minutes=
    Math.max(
      1,
      Math.round(
        seconds/60
      )
    );


  const startDate=
    new Date(
      timer.startTimestamp
    );


  const endDate=
    new Date();


  const job={

    id:uid('job'),

    clientId:
      client.id,

    clientName:
      client.name,

    date:
      dateISO(startDate),

    start:
      startDate.toLocaleTimeString(
        'en-GB',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      ),

    end:
      endDate.toLocaleTimeString(
        'en-GB',
        {
          hour:'2-digit',
          minute:'2-digit'
        }
      ),

    rate:
      Number(client.rate),

    minutes:

      minutes,

    status:
      'Completed',

    source:
      'timer',

    createdAt:
      new Date().toISOString()

  };


  job.earnings=
    calculateJobPay(job);


  jobs.push(job);

  saveJobs();


  clearInterval(
    timer.interval
  );


  timer={

    active:false,

    clientId:null,

    startTimestamp:null,

    elapsedBefore:0,

    interval:null

  };


  sessionStorage.removeItem(
    'pureShineTimer'
  );


  closeModal();

  render();


  showToast(
    `${client.name} saved: `+
    `${formatMinutes(minutes)} · `+
    `You should receive `+
    `${money(job.earnings)}`
  );

}

      c=>c.id!==id

  showToast(
    `${client.name} removed`
  );

          id="editClient"
        >

          ${
            clients.map(
              c=>`

              <option
                value="${c.id}"
                ${
                  job.clientId===c.id
                  ?'selected'
                  :''
                }
              >
                ${escapeHTML(c.name)}
              </option>

              `
            ).join('')
          }

        </select>

      </div>


      <div class="two">

        <div class="form-group">

          <label>
            Date
          </label>

          <input
            id="editDate"
            type="date"
            value="${job.date}"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Rate £/hour
          </label>

          <input
            id="editRate"
            type="number"
            step="0.01"
            value="${job.rate}"
            required
          >

        </div>

      </div>


      <div class="two">

        <div class="form-group">

          <label>
            Start
          </label>

          <input
            id="editStart"
            type="time"
            value="${job.start||''}"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Finish
          </label>

          <input
            id="editEnd"
            type="time"
            value="${job.end||''}"
            required
          >

        </div>

      </div>


      <button
        class="primary"
        type="submit"
      >
        Save & Recalculate
      </button>

    </form>

  `);

}


function saveEditedJob(e,id){

  e.preventDefault();


  const job=
    jobs.find(
      j=>j.id===id
    );

  if(!job)return;


  const client=
    getClient(
      document.getElementById(
        'editClient'
      ).value
    );


  job.clientId=
    client?.id||
    job.clientId;

  job.clientName=
    client?.name||
    job.clientName;

  job.date=
    document.getElementById(
      'editDate'
    ).value;

  job.rate=
    Number(
      document.getElementById(
        'editRate'
      ).value
    );

  job.start=
    document.getElementById(
      'editStart'
    ).value;

  job.end=
    document.getElementById(
      'editEnd'
    ).value;

  job.minutes=
    getWorkedMinutes(job);

  job.earnings=
    calculateJobPay(job);


  saveJobs();

  closeModal();

  render();


  showToast(
    `Job updated · `+
    `${formatMinutes(job.minutes)} · `+
    `${money(job.earnings)}`
  );

}


function deleteJob(id){

  const job=
    jobs.find(
      j=>j.id===id
    );

  if(!job)return;


  if(
    !confirm(
      `Delete the ${job.clientName} job from ${displayDate(job.date)}?`
    )
  ){
    return;
  }


  jobs=
    jobs.filter(
      j=>j.id!==id
    );


  saveJobs();

  render();


  showToast(
    'Job deleted'
  );

}


/* =====================================================
   HOLIDAYS
===================================================== */

function renderHolidays(){

  const holidays=
    JSON.parse(
      localStorage.getItem(
        HOLIDAY_KEY
      )||'[]'
    );


  if(!holidays.length){

    return `

      <div class="empty">

        No holidays added yet.

        <br><br>

        <button
          class="primary"
          onclick="addHoliday()"
        >
          ＋ Add Holiday
        </button>

      </div>

    `;

  }


  return `

    ${
      holidays
        .map(
          (h,i)=>`

          <div
            class="setting-card holiday"
          >

            <div>

              <strong>
                ${escapeHTML(
                  h.clientName
                )}
              </strong>

              <div class="holiday-date">
                ${displayDate(h.start)}
                –
                ${displayDate(h.end)}
              </div>

            </div>

            <button
              class="small-btn"
              onclick="deleteHoliday(${i})"
            >
              🗑
            </button>

          </div>

          `
        )
        .join('')
    }


    <button
      class="primary"
      onclick="addHoliday()"
    >
      ＋ Add Holiday
    </button>

  `;

}


function addHoliday(){

  openModal(`

    <div class="modal-head">

      <h3>
        Client Holiday
      </h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <form
      onsubmit="saveHoliday(event)"
    >

      <div class="form-group">

        <label>
          Client
        </label>

        <select
          id="holidayClient"
          required
        >

          ${
            clients
              .map(
                c=>`

                <option value="${c.id}">
                  ${escapeHTML(c.name)}
                </option>

                `
              )
              .join('')
          }

        </select>

      </div>


      <div class="two">

        <div class="form-group">

          <label>
            From
          </label>

          <input
            id="holidayStart"
            type="date"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Until
          </label>

          <input
            id="holidayEnd"
            type="date"
            required
          >

        </div>

      </div>


      <button
        class="primary"
        type="submit"
      >
        Save Holiday
      </button>

    </form>

  `);

}


function saveHoliday(e){

  e.preventDefault();


  const list=
    JSON.parse(
      localStorage.getItem(
        HOLIDAY_KEY
      )||'[]'
    );


  const client=
    getClient(
      document.getElementById(
        'holidayClient'
      ).value
    );


  list.push({

    clientId:
      client.id,

    clientName:
      client.name,

    start:
      document.getElementById(
        'holidayStart'
      ).value,

    end:
      document.getElementById(
        'holidayEnd'
      ).value

  });


  localStorage.setItem(
    HOLIDAY_KEY,
    JSON.stringify(list)
  );


  closeModal();

  render();


  showToast(
    `${client.name}'s holiday saved`
  );

}


function deleteHoliday(index){

  const list=
    JSON.parse(
      localStorage.getItem(
        HOLIDAY_KEY
      )||'[]'
    );


  list.splice(
    index,
    1
  );


  localStorage.setItem(
    HOLIDAY_KEY,
    JSON.stringify(list)
  );


  render();

}


/* =====================================================
   SETTINGS
===================================================== */

function toggleSetting(key){

  appSettings[key]=
    !appSettings[key];

  saveSettings();

  render();

}


function changeZoom(amount){

  appSettings.zoom=
    Math.min(
      200,
      Math.max(
        100,
        appSettings.zoom+amount
      )
    );

  saveSettings();

  applyZoom();

  render();

}


function setZoom(value){

  appSettings.zoom=
    Math.min(
      200,
      Math.max(
        100,
        Number(value)
      )
    );

  saveSettings();

  applyZoom();

}


function applyZoom(){

  const app=
    document.getElementById(
      'app'
    );

  if(!app)return;

  app.style.zoom=
    appSettings.zoom/100;

  if(
    appSettings.zoom>100
  ){
    app.style.maxWidth=
      '520px';
  }

}

   EXPORT
===================================================== */

function exportData(){

  const data={

    clients,

    jobs,

    settings:
      appSettings,

    holidays:
      JSON.parse(
        localStorage.getItem(
          HOLIDAY_KEY
        )||'[]'
      ),

    exportedAt:
      new Date().toISOString()

  };


  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );


  const url=
    URL.createObjectURL(
      blob
    );


  const a=
    document.createElement(
      'a'
    );

  a.href=url;

  a.download=
    'pure-shine-cleaning-manager-backup.json';

  a.click();

  URL.revokeObjectURL(url);


  showToast(
    'Backup exported'
  );

}


function confirmClearJobs(){

  if(!jobs.length)return;


  if(
    !confirm(
      'Delete ALL saved job history? This cannot be undone.'
    )
  ){
    return;
  }


  jobs=[];

  saveJobs();

  render();


  showToast(
    'All job history deleted'
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value??'')

    .replaceAll(
      '&',
      '&amp;'
    )

    .replaceAll(
      '<',
      '&lt;'
    )

    .replaceAll(
      '>',
      '&gt;'
    )

    .replaceAll(
      '"',
      '&quot;'
    )

    .replaceAll(
      "'",
      '&#039;'
    );

}


function escapeAttr(value){

  return escapeHTML(value);

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast=
    document.getElementById(
      'toast'
    );


  toast.textContent=
    message;


  toast.classList.add(
    'show'
  );


  clearTimeout(
    showToast.timeout
  );


  showToast.timeout=
    setTimeout(
      ()=>{
        toast.classList.remove(
          'show'
        );
      },
      3200
    );

}


/* =====================================================
   TIMER RESTORE
===================================================== */

window.addEventListener(
  'beforeunload',
  ()=>{

    if(timer.active){

      sessionStorage.setItem(
        'pureShineTimer',
        JSON.stringify({

          active:true,

          clientId:
            timer.clientId,

          startTimestamp:
            timer.startTimestamp,

          elapsedBefore:
            timer.elapsedBefore

        })
      );

    }

  }
);


function restoreTimer(){

  const saved=
    sessionStorage.getItem(
      'pureShineTimer'
    );

  if(!saved)return;


  try{

    const data=
      JSON.parse(saved);


    if(
      data.active&&
      data.clientId
    ){

      timer={

        active:true,

        clientId:
          data.clientId,

        startTimestamp:
          data.startTimestamp,

        elapsedBefore:
          data.elapsedBefore||0,

        interval:null

      };


      startTimerInterval();

    }

  }catch(e){}

}


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
  'load',
  ()=>{

    restoreTimer();

    init();

  }
);


document.addEventListener(
  'visibilitychange',
  ()=>{

    if(timer.active){

      updateTimerDisplay();

    }

  }
);
