<style>
/* =========================================================
   PURE SHINE — FINAL PALE HOME DESIGN
   Removes:
   • square icon from date
   • quote text/banner
   • Quick Actions section
   Adds:
   • pale floral + cleaning-products feature panel
   • pink / lavender / mint / yellow pastel palette
   • extra sparkles
   • clean full-width phone layout
========================================================= */

:root{
  --pink:#f4c9dc;
  --pinkStrong:#e46c9e;
  --pinkSoft:#f9e5ee;
  --lavender:#e5dcf8;
  --mint:#dcefe5;
  --yellow:#fff0c7;
  --peach:#f8ddd5;
  --blue:#dceafb;
  --white:#fff;
  --ink:#27242d;
  --muted:#817984;
}

/* FULL SCREEN — NO EMPTY PINK SIDE MARGINS */
html,
body{
  width:100%;
  min-width:100%;
  margin:0;
  padding:0;
  background:#fffafd;
}

body{
  overflow-x:hidden;
}

/* APP MUST FILL THE WHOLE SCREEN */
#app{
  width:100%;
  max-width:none;
  min-height:100vh;
  margin:0;
  padding-left:
    max(18px,env(safe-area-inset-left));
  padding-right:
    max(18px,env(safe-area-inset-right));
  padding-bottom:
    calc(105px + env(safe-area-inset-bottom));
  background:
    linear-gradient(
      180deg,
      #fffafd 0%,
      #fffafd 65%,
      #fff9fc 100%
    );
}

/* =========================================================
   HEADER
========================================================= */

header{
  padding:
    22px
    0
    16px;
}

.headerRow{
  width:100%;
}

.brand{
  gap:13px;
}

.logo{
  width:64px;
  height:64px;
  border-radius:19px;
  border:1px solid #edc1d2;
  box-shadow:
    0 7px 20px rgba(190,104,142,.13);
}

.brand h1{
  font-size:25px;
  letter-spacing:-.7px;
  color:#27242d;
}

.brand p{
  font-size:14px;
  color:#8c838d;
}

.headerBtn{
  width:54px;
  height:54px;
  background:#fff;
  box-shadow:
    0 7px 22px rgba(80,55,75,.08);
}

/* =========================================================
   DATE CARD
   NO SQUARE ICON
========================================================= */

.dateCard{
  position:relative;
  height:104px;
  border-radius:28px;
  background:
    linear-gradient(
      135deg,
      #f5d2e1,
      #f7d9e6
    );
  padding:18px 22px;
  overflow:hidden;
}

.dateCard::before{
  content:"✦  ✧  ✦";
  position:absolute;
  right:86px;
  top:16px;
  color:#e7a4c0;
  font-size:13px;
  letter-spacing:7px;
  opacity:.85;
}

.dateLeft{
  display:block;
}

/* COMPLETELY REMOVE THE OLD SQUARE */
.dateIcon{
  display:none!important;
}

.dateMain{
  font-size:21px;
  font-weight:900;
  color:#27242d;
}

.dateSub{
  margin-top:7px;
  font-size:14px;
  color:#817681;
}

.dateHeart{
  font-size:46px;
  color:#d45e91;
}

/* =========================================================
   NEW FLOWERS + CLEANING PRODUCTS PANEL
   NO QUOTE TEXT
========================================================= */

.dateCard::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-4px;
  height:0;
}

/* New visual panel inserted by JS */
#pastelFeature{
  position:relative;
  width:100%;
  height:158px;
  margin:
    17px
    0
    22px;
  border-radius:28px;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      rgba(248,215,228,.92),
      rgba(246,224,235,.72)
    ),
    url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1400&q=90");
  background-size:cover;
  background-position:center;
  box-shadow:
    0 9px 28px rgba(100,65,90,.07);
}

/* soft pale overlay */
#pastelFeature::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(249,219,232,.92) 0%,
      rgba(249,225,235,.68) 48%,
      rgba(255,244,238,.25) 100%
    );
}

/* sparkle decoration */
#pastelFeature::after{
  content:"✦   ✧   ✦       ✧   ✦";
  position:absolute;
  top:20px;
  left:22px;
  color:#fff;
  font-size:15px;
  letter-spacing:5px;
  text-shadow:
    0 1px 5px rgba(185,96,137,.2);
}

/* =========================================================
   STATS
========================================================= */

.stats{
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:10px;
  margin:
    0
    0
    30px;
}

.stat{
  height:137px;
  border-radius:25px;
  box-shadow:
    0 6px 20px rgba(70,45,65,.045);
}

.stat:nth-child(1){
  background:#f7d8e5;
}

.stat:nth-child(2){
  background:#dceafb;
}

.stat:nth-child(3){
  background:#dcefe4;
}

.stat:nth-child(4){
  background:#fff0c7;
}

/* MORE SPARKLES */
.stat::after{
  content:"✦";
  position:absolute;
  right:13px;
  top:13px;
  font-size:13px;
  opacity:.6;
}

.stat:nth-child(1)::after{
  color:#d66a98;
}

.stat:nth-child(2)::after{
  color:#fff;
}

.stat:nth-child(3)::after{
  color:#c89a55;
}

.stat:nth-child(4)::after{
  color:#d6a73e;
}

.statIcon{
  font-size:24px;
}

.statValue{
  font-size:24px;
  color:#29262f;
}

.statLabel{
  color:#36313a;
}

/* =========================================================
   TODAY'S SCHEDULE
========================================================= */

.sectionHead{
  margin-bottom:13px;
}

.sectionHead h2{
  font-size:23px;
  color:#27242d;
}

.linkBtn{
  color:#c75283;
}

/* =========================================================
   EMPTY SCHEDULE
========================================================= */

.scheduleBox{
  background:#fff;
  border-radius:27px;
  padding:15px;
  box-shadow:
    0 8px 30px rgba(70,45,65,.055);
}

.empty{
  padding:
    43px
    15px
    35px;
}

.emptyIcon{
  font-size:54px;
  color:#df6397;
}

.empty strong{
  font-size:19px;
  color:#28252d;
}

.empty p{
  color:#837983;
  font-size:15px;
}

.primaryFull{
  height:57px;
  border-radius:30px;
  background:
    linear-gradient(
      135deg,
      #ed78a7,
      #dc4f88
    );
  box-shadow:
    0 9px 22px rgba(220,79,136,.18);
  font-size:17px;
}

/* =========================================================
   REMOVE QUICK ACTIONS COMPLETELY
========================================================= */

.quickTitle,
.quick{
  display:none!important;
}

/* =========================================================
   OLD QUOTE BANNER COMPLETELY REMOVED
========================================================= */

.banner{
  display:none!important;
}

/* =========================================================
   BOTTOM NAV — 5 ITEMS LIKE REFERENCE
========================================================= */

.bottomNav{
  width:100%;
  max-width:none;
  left:0;
  transform:none;
  min-height:94px;
  border-radius:0;
  padding:
    8px
    max(6px,env(safe-area-inset-left))
    calc(8px + env(safe-area-inset-bottom))
    max(6px,env(safe-area-inset-right));
  grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.98);
  box-shadow:
    0 -7px 28px rgba(80,50,70,.08);
}

/* Hide Settings from bottom navigation */
.bottomNav button:nth-child(6){
  display:none!important;
}

.bottomNav button{
  min-height:74px;
  font-size:13px;
  color:#8b858e;
  gap:4px;
}

.bottomNav button span{
  width:51px;
  height:45px;
  min-width:51px;
  font-size:28px;
}

.bottomNav button.active{
  color:#d95d91;
}

.bottomNav button.active span{
  background:#f9dce8;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

  #app{
    padding-left:
      max(13px,env(safe-area-inset-left));
    padding-right:
      max(13px,env(safe-area-inset-right));
    padding-bottom:
      calc(115px + env(safe-area-inset-bottom));
  }

  header{
    padding-top:18px;
  }

  .brand h1{
    font-size:22px;
  }

  .brand p{
    font-size:13px;
  }

  .logo{
    width:58px;
    height:58px;
  }

  .headerBtn{
    width:50px;
    height:50px;
  }

  .dateCard{
    height:99px;
    border-radius:26px;
  }

  .dateMain{
    font-size:18px;
  }

  .dateSub{
    font-size:13px;
  }

  .dateHeart{
    font-size:43px;
  }

  #pastelFeature{
    height:145px;
    margin-top:16px;
    margin-bottom:21px;
    border-radius:25px;
  }

  .stats{
    gap:8px;
    margin-bottom:28px;
  }

  .stat{
    height:130px;
    border-radius:23px;
  }

  .statValue{
    font-size:21px;
  }

  .statLabel{
    font-size:12px;
  }

  .sectionHead h2{
    font-size:21px;
  }

  .scheduleBox{
    border-radius:26px;
  }

  .empty{
    padding-top:40px;
  }

  .primaryFull{
    height:55px;
  }

  .bottomNav{
    min-height:91px;
  }

  .bottomNav button{
    min-height:70px;
    font-size:12px;
  }

  .bottomNav button span{
    width:48px;
    height:43px;
    min-width:48px;
    font-size:27px;
  }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:370px){

  .stats{
    gap:6px;
  }

  .stat{
    height:120px;
  }

  .statValue{
    font-size:19px;
  }

  .statLabel{
    font-size:11px;
  }

  #pastelFeature{
    height:130px;
  }

}
</style>

<script>
/* =========================================================
   INSERT THE NEW FLORAL / CLEANING-PRODUCTS PANEL
   DIRECTLY UNDER THE DATE
========================================================= */

document.addEventListener("DOMContentLoaded",function(){

  const dateCard=document.querySelector(".dateCard");

  if(dateCard && !document.getElementById("pastelFeature")){

    const feature=document.createElement("section");

    feature.id="pastelFeature";

    dateCard.insertAdjacentElement(
      "afterend",
      feature
    );

  }

  /* Remove the old square completely */
  const dateIcon=document.querySelector(".dateIcon");

  if(dateIcon){
    dateIcon.remove();
  }

  /* Remove the old quote banner */
  const banner=document.querySelector(".banner");

  if(banner){
    banner.remove();
  }

  /* Remove Quick Actions completely */
  const quickTitle=document.querySelector(".quickTitle");
  const quick=document.querySelector(".quick");

  if(quickTitle){
    quickTitle.remove();
  }

  if(quick){
    quick.remove();
  }

});
</script>
