<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8d8e5">
<title>Pure Shine Cleaning Manager</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#f8dfe9;
    color:#292634;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:min(100%,650px);
    min-height:100vh;
    margin:auto;
    background:#fffafd;
    padding:0 22px 125px;
}

/* =========================
   HEADER
========================= */

.header{
    padding:30px 0 18px;
    background:#fffafd;
}

.headerInner{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:64px;
    height:64px;
    border-radius:19px;
    background:linear-gradient(145deg,#fff,#ffd5e5);
    border:1px solid #efb4ca;
    box-shadow:0 8px 22px rgba(190,91,130,.16);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
}

.logo span{
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:11px;
    line-height:.9;
    text-align:center;
    color:#c87899;
    transform:rotate(-5deg);
}

.logo span b{
    display:block;
    font-size:10px;
    letter-spacing:1px;
    font-family:Arial,sans-serif;
    margin-top:4px;
}

.brandTitle{
    font-size:25px;
    font-weight:800;
    letter-spacing:-.7px;
}

.brandSub{
    color:#8c8290;
    font-size:16px;
    margin-top:5px;
}

.headerButton{
    width:55px;
    height:55px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#397ff0;
    font-size:25px;
    box-shadow:0 8px 25px rgba(80,65,90,.08);
}

/* =========================
   TODAY
========================= */

.today{
    margin-top:5px;
    padding:22px 22px;
    border-radius:27px;
    background:#f8d2e1;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.todayLeft{
    display:flex;
    align-items:center;
    gap:17px;
}

.calendarIcon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9f5777;
    font-size:28px;
}

.todayDate{
    font-size:20px;
    font-weight:800;
}

.todayText{
    color:#817583;
    font-size:16px;
    margin-top:7px;
}

.todayHeart{
    color:#d76e9b;
    font-size:40px;
    line-height:1;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:11px;
    margin-top:20px;
}

.stat{
    min-height:144px;
    border-radius:27px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.statIcon{
    font-size:27px;
    margin-bottom:11px;
}

.statNumber{
    font-size:24px;
    font-weight:850;
}

.statLabel{
    font-size:15px;
    margin-top:7px;
}

.pink{
    background:#f8d8e5;
}

.blue{
    background:#d9e7fc;
}

.green{
    background:#dcefe5;
}

.yellow{
    background:#fff0c8;
}

/* =========================
   TITLES
========================= */

.sectionHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:27px 0 13px;
}

.sectionTitle{
    font-size:25px;
    font-weight:850;
    letter-spacing:-.7px;
}

.seeAll{
    border:0;
    background:transparent;
    color:#b34c73;
    font-weight:800;
    font-size:17px;
}

/* =========================
   SCHEDULE
========================= */

.schedule{
    background:#fff;
    border-radius:27px;
    padding:16px;
    box-shadow:0 9px 30px rgba(70,45,65,.07);
}

.clientCard{
    position:relative;
    border-radius:23px;
    min-height:135px;
    padding:18px 18px;
    margin-bottom:12px;
    display:grid;
    grid-template-columns:62px 1fr auto;
    align-items:center;
    gap:14px;
}

.clientCard:last-child{
    margin-bottom:0;
}

.clientPink{
    background:#fbdce8;
}

.clientBlue{
    background:#dceafb;
}

.clientGreen{
    background:#e0f2e7;
}

.avatar{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
}

.avatarPink{
    background:#f5b4ce;
    color:#b53670;
}

.avatarBlue{
    background:#b9daf6;
    color:#237caf;
}

.avatarGreen{
    background:#b8e3c9;
    color:#299565;
}

.clientName{
    font-size:21px;
    font-weight:850;
}

.badge{
    display:inline-block;
    vertical-align:middle;
    margin-left:6px;
    padding:5px 12px;
    border-radius:13px;
    font-size:12px;
    font-weight:700;
}

.badgePrivate{
    background:#f5c8dc;
    color:#bc4278;
}

.badgeAgency{
    background:#c5e2f8;
    color:#277ba7;
}

.clientInfo{
    color:#5e6671;
    font-size:15px;
    line-height:1.55;
    margin-top:6px;
}

.priceArea{
    text-align:right;
    align-self:center;
}

.price{
    font-size:22px;
    font-weight:850;
}

.rate{
    color:#68717b;
    font-size:14px;
    margin-top:3px;
}

.play{
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#e66b9b;
    color:#fff;
    font-size:21px;
    margin-top:8px;
    box-shadow:0 6px 16px rgba(210,82,130,.2);
}

/* =========================
   QUICK ACTIONS
========================= */

.quickTitle{
    font-size:24px;
    font-weight:850;
    margin:28px 0 13px;
}

.quick{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.quickButton{
    min-height:105px;
    border:0;
    border-radius:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:13px;
    font-size:15px;
    font-weight:750;
    box-shadow:0 6px 18px rgba(70,50,70,.04);
}

.quickIcon{
    font-size:28px;
}

.quickPink{
    background:#f9d7e5;
    color:#ba4174;
}

.quickGreen{
    background:#dcefe4;
    color:#398061;
}

.quickPurple{
    background:#e6dbfb;
    color:#644b9b;
}

.quickYellow{
    background:#fff0c7;
    color:#85651e;
}

.quickBlue{
    background:#dceafc;
    color:#396c9e;
}

.quickPeach{
    background:#f8ddd4;
    color:#a95845;
}

/* =========================
   BANNER
========================= */

.banner{
    margin-top:17px;
    min-height:145px;
    border-radius:25px;
    background:linear-gradient(135deg,#e7c2d1,#e6c6d5);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.bannerText{
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:30px;
    line-height:1.25;
    color:#9b5875;
}

.bannerText span{
    font-size:24px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
    position:fixed;
    z-index:50;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(650px,100%);
    background:rgba(255,255,255,.97);
    border-top:1px solid #eee3e8;
    padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    display:grid;
    grid-template-columns:repeat(5,1fr);
    box-shadow:0 -8px 25px rgba(70,45,65,.05);
}

.navButton{
    border:0;
    background:transparent;
    color:#9b949d;
    font-size:13px;
    padding:4px;
}

.navButton span{
    display:flex;
    width:48px;
    height:40px;
    margin:auto;
    border-radius:20px;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.navButton.active{
    color:#df6998;
}

.navButton.active span{
    background:#f9dce8;
}

/* =========================
   MODAL
========================= */

.overlay{
    position:fixed;
    z-index:100;
    inset:0;
    background:rgba(40,27,37,.45);
    display:none;
    align-items:flex-end;
}

.overlay.open{
    display:flex;
}

.modal{
    width:100%;
    max-width:650px;
    max-height:92vh;
    overflow-y:auto;
    background:#fffafd;
    border-radius:32px 32px 0 0;
    padding:23px 20px calc(30px + env(safe-area-inset-bottom));
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modalTitle{
    margin:0;
    font-size:24px;
}

.close{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#f7e6ee;
    color:#bb6687;
    font-size:26px;
}

.label{
    display:block;
    margin:14px 0 7px;
    font-weight:750;
}

.input,
.select,
.textarea{
    width:100%;
    border:2px solid #eadfe5;
    background:#fff;
    border-radius:16px;
    padding:14px;
    outline:none;
}

.textarea{
    min-height:90px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.save{
    width:100%;
    border:0;
    border-radius:18px;
    padding:16px;
    margin-top:18px;
    background:linear-gradient(135deg,#e991b4,#d66f99);
    color:white;
    font-weight:850;
}

.delete{
    width:100%;
    border:0;
    border-radius:18px;
    padding:14px;
    margin-top:9px;
    background:#ffe3ea;
    color:#bb426c;
    font-weight:750;
}

/* =========================
   CLIENT LIST
========================= */

.clientListItem{
    display:flex;
    align-items:center;
    gap:13px;
    background:#fff;
    border:1px solid #f0e3e9;
    border-radius:20px;
    padding:14px;
    margin:8px 0;
}

.clientListAvatar{
    width:53px;
    height:53px;
    border-radius:50%;
    background:#f7d8e5;
    color:#b94171;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:850;
    font-size:20px;
    flex-shrink:0;
}

.clientListInfo{
    flex:1;
}

.clientListName{
    font-size:18px;
    font-weight:800;
}

.clientListMeta{
    color:#847983;
    font-size:12px;
    margin-top:4px;
}

.editButton{
    border:0;
    background:#f7e7ee;
    color:#b85e82;
    border-radius:13px;
    padding:9px 12px;
    font-weight:750;
}

.addClient{
    width:100%;
    border:0;
    background:#e791b3;
    color:white;
    border-radius:18px;
    padding:15px;
    font-weight:850;
    margin-bottom:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    color:#887b84;
    padding:28px 10px;
}

.emptyIcon{
    font-size:40px;
    margin-bottom:7px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

    .app{
        padding-left:16px;
        padding-right:16px;
    }

    .brandTitle{
        font-size:21px;
    }

    .brandSub{
        font-size:14px;
    }

    .logo{
        width:58px;
        height:58px;
    }

    .headerButton{
        width:48px;
        height:48px;
    }

    .today{
        padding:18px;
    }

    .todayDate{
        font-size:17px;
    }

    .todayText{
        font-size:14px;
    }

    .todayHeart{
        font-size:34px;
    }

    .stats{
        gap:7px;
    }

    .stat{
        min-height:122px;
        border-radius:21px;
    }

    .statNumber{
        font-size:20px;
    }

    .statLabel{
        font-size:12px;
    }

    .sectionTitle,
    .quickTitle{
        font-size:21px;
    }

    .clientCard{
        grid-template-columns:50px 1fr auto;
        gap:9px;
        padding:13px;
    }

    .avatar{
        width:48px;
        height:48px;
        font-size:20px;
    }

    .clientName{
        font-size:17px;
    }

    .badge{
        font-size:10px;
        padding:4px 8px;
    }

    .clientInfo{
        font-size:12px;
    }

    .price{
        font-size:17px;
    }

    .rate{
        font-size:11px;
    }

    .play{
        width:42px;
        height:42px;
        font-size:17px;
    }

    .quick{
        grid-template-columns:repeat(2,1fr);
    }

    .quickButton{
        min-height:86px;
        font-size:13px;
    }

    .quickIcon{
        font-size:24px;
    }

    .bannerText{
        font-size:25px;
    }
}

@media(max-width:360px){

    .brandTitle{
        font-size:18px;
    }

    .brandSub{
        font-size:12px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        min-height:105px;
    }

    .todayHeart{
        display:none;
    }

    .clientCard{
        grid-template-columns:45px 1fr;
    }

    .priceArea{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY =
    "pureShineExactDesign";

const defaultClients = [

    {
        id:1,
        name:"Lottie",
        type:"Private",
        rate:18,
        day:"Monday",
        start:"09:00",
        end:"12:00",
        location:"",
        notes:"",
        frequency:"Weekly"
    },

    {
        id:2,
        name:"Matt",
        type:"Agency",
        rate:16,
        day:"Tuesday",
        start:"13:00",
        end:"15:00",
        location:"",
        notes:"",
        frequency:"Weekly"
    },

    {
        id:3,
        name:"Christine",
        type:"Private",
        rate:18,
        day:"Tuesday",
        start:"16:00",
        end:"17:30",
        location:"",
        notes:"",
        frequency:"Weekly"
    }

];

let stored = null;

try{
    stored =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        );
}catch(e){}

let clients =
    stored?.clients ||
    defaultClients;

let jobs =
    stored?.jobs ||
    [];

let holidays =
    stored?.holidays ||
    [];

let timerInterval = null;
let timerStart = null;


/* =========================================================
   SAVE
========================================================= */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            clients,
            jobs,
            holidays
        })
    );

}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function minutes(time){

    const [h,m] =
        time.split(":").map(Number);

    return h * 60 + m;

}


function duration(start,end){

    return Math.max(
        0,
        (minutes(end)-minutes(start))/60
    );

}


function money(value){

    return "£" +
        Number(value)
            .toFixed(2)
            .replace(".00","");

}


function initials(name){

    return name
        .trim()
        .charAt(0)
        .toUpperCase();

}


function todayName(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {
                weekday:"long"
            }
        );

}


function dateText(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {
                weekday:"long",
                day:"numeric",
                month:"long"
            }
        );

}


function getTodayClients(){

    const today =
        todayName();

    return clients
        .filter(
            c => c.day === today
        )
        .sort(
            (a,b) =>
                minutes(a.start) -
                minutes(b.start)
        );

}


/* =========================================================
   DASHBOARD
========================================================= */

function render(){

    document
        .getElementById("todayDate")
        .textContent = dateText();


    const todayClients =
        getTodayClients();


    let hours = 0;
    let earnings = 0;


    todayClients.forEach(client => {

        const h =
            duration(
                client.start,
                client.end
            );

        hours += h;

        earnings +=
            h * Number(client.rate);

    });


    document
        .getElementById("jobsToday")
        .textContent =
        todayClients.length;


    document
        .getElementById("hoursToday")
        .textContent =
        formatHours(hours);


    document
        .getElementById("earnedToday")
        .textContent =
        money(earnings);


    document
        .getElementById("freeToday")
        .textContent =
        formatHours(
            Math.max(0,8-hours)
        );


    renderTodaySchedule();

    save();

}


function formatHours(value){

    return value % 1 === 0
        ? value + "h"
        : value.toFixed(1) + "h";

}

/* =========================================================
   SAVE CLIENT
========================================================= */

function saveClient(id){

    const name =
        document
            .getElementById("clientName")
            .value
            .trim();

    const type =
        document
            .getElementById("clientType")
            .value;

    const rate =
        Number(
            document
                .getElementById("clientRate")
                .value
        );

    const day =
        document
            .getElementById("clientDay")
            .value;

    const frequency =
        document
            .getElementById("clientFrequency")
            .value;

    const start =
        document
            .getElementById("clientStart")
            .value;

    const end =
        document
            .getElementById("clientEnd")
            .value;

    const location =
        document
            .getElementById("clientLocation")
            .value
            .trim();

    const notes =
        document
            .getElementById("clientNotes")
            .value
            .trim();


    if(!name){

        alert("Please enter the client's name.");

        return;

    }


    if(!start || !end){

        alert("Please enter the cleaning times.");

        return;

    }


    if(minutes(end) <= minutes(start)){

        alert("End time must be after start time.");

        return;

    }


    const newClient = {

        id:
            id ||
            Date.now(),

        name,

        type,

        rate,

        day,

        frequency,

        start,

        end,

        location,

        notes

    };


    if(id){

        const index =
            clients.findIndex(
                c => c.id === id
            );

        if(index !== -1){

            clients[index] =
                newClient;

        }

    }else{

        clients.push(newClient);

    }


    save();

    closeModal();

    render();

}

function deleteClient(id){

        )
    ){

        return;

    }


    clients =
        clients.filter(
            c => c.id !== id
        );


    save();

    openClients();

}

function startTimerFor(clientId){

    openTimer();

    setTimeout(() => {

        const select =
            document.getElementById(
                "timerClient"
            );

        if(select){

            select.value =
                String(clientId);

        }

    },30);

}


function toggleTimer(){

    const button =
        document.getElementById(
            "timerButton"
        );

    const clock =
        document.getElementById(
            "timerClock"
        );


    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval = null;

        button.textContent =
            "Start timer";

        return;

    }


    timerStart =
        Date.now();


    button.textContent =
        "Stop timer";


    timerInterval =
        setInterval(() => {

            const seconds =
                Math.floor(
                    (Date.now()-timerStart)
                    /1000
                );


            const h =
                Math.floor(
                    seconds/3600
                );

            const m =
                Math.floor(
                    (seconds%3600)/60
                );

            const s =
                seconds%60;


            clock.textContent =
                [
                    h,
                    m,
                    s
                ]
                .map(
                    n =>
                    String(n)
                        .padStart(2,"0")
                )
                .join(":");


        },1000);

}

        >

            <strong>
                Pure Shine Cleaning Manager
            </strong>

            <div
                style="
                    color:#80727c;
                    font-size:13px;
                    margin-top:6px;
                "
            >
                All client details are stored on this device.
            </div>

        </div>


        <button
            class="save"
            onclick="openClients()"
        >
            👥 Manage clients
        </button>


        <button
            class="delete"
            onclick="resetApp()"
        >
            Reset application data
        </button>

    `);

}


function resetApp(){

    if(
        !confirm(
            "Delete all clients and cleaning data?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        STORAGE_KEY
    );

    clients = [];

    jobs = [];

    holidays = [];

    closeModal();

    render();

}


/* =========================================================
   NAV
========================================================= */

function setActive(button){

    document
        .querySelectorAll(".navButton")
        .forEach(
            b =>
            b.classList.remove("active")
        );


    if(button){

        button.classList.add("active");

    }

}


function goHome(button){

    closeModal();

    setActive(button);

    render();

}


/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
