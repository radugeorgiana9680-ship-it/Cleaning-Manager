<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5eaf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pure Shine">
<title>Pure Shine Cleaning Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Parisienne&family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#e8b4c6;--powder:#f8eaf0;--rose:#d58eaa;--gold:#c5a46c;--sage:#a8bda9;--lavender:#b9acd2;--blue:#a9c5d8;--peach:#e9b9a5;--ink:#443b45;--muted:#8d828d;--line:#eee3e9;--paper:#fffdfd;--scale:1;--font:"DM Sans",sans-serif;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{font-size:calc(14px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;height:100dvh;overflow:hidden;font-family:var(--font);color:var(--ink);background:linear-gradient(145deg,#fbf1f6,#f1f4f8 45%,#f4f3ed);background-size:cover;background-position:center;background-attachment:fixed}
button,input,select,textarea{font:inherit;max-width:100%}button{cursor:pointer;border:0;touch-action:manipulation}
.app{height:100dvh;max-width:760px;margin:auto;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),5px) 9px 0;overflow:hidden;background:#ffffff18}
header{min-height:104px;flex-shrink:0;display:flex;align-items:center;gap:15px;padding:10px 7px 12px;border-bottom:1px solid #eadde5;background:linear-gradient(110deg,#fffafcdd,#f8f1f7aa);border-radius:0 0 17px 17px;margin-bottom:7px}
.profile{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid #fff;outline:2px solid var(--gold);display:none;flex-shrink:0;box-shadow:0 4px 15px #9e789333}
.greeting-wrap{min-width:0;display:flex;flex-direction:column;gap:4px}.greeting{font:700 clamp(1.55rem,5vw,2.05rem)/1.08 "Cormorant Garamond",serif;color:#594754}.greeting-date{font-size:.88rem;color:var(--muted);font-weight:600}.greeting-business{font:1.15rem/1.1 "Parisienne",cursive;color:var(--rose);margin-top:2px}
.bottom-brand-banner{margin:18px 0 10px;padding:17px 12px;border-radius:15px;text-align:center;background:linear-gradient(115deg,#f7e5ec,#fff9fb 48%,#f5e9df);border:1px solid #ead5df;box-shadow:0 4px 16px #92798a12}.bottom-brand-banner strong{display:block;font:700 1.45rem "Cormorant Garamond",serif;color:#a66f88}.bottom-brand-banner span{display:block;font:1.2rem "Parisienne",cursive;color:#bd9871;margin-top:4px}.bottom-brand-banner small{display:block;color:#9c8994;font-size:.68rem;letter-spacing:1.6px;margin-top:5px}
h1,h2,h3{font-family:"Cormorant Garamond",serif;margin:10px 0;font-weight:700}h1{font-size:1.9rem}h2{font-size:1.5rem}h3{font-size:1.25rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0;min-width:0;box-shadow:0 3px 14px #92798a0d}
.page{display:none;min-height:0;min-width:0}.page.active{display:block;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 2px calc(82px + var(--safe));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sub{font-size:.78rem;color:var(--muted);line-height:1.5}.primary,.secondary,.danger,.soft,.green{padding:10px 12px;border-radius:10px;font-size:.82rem;min-height:39px}
.primary{background:linear-gradient(135deg,var(--pink),var(--rose));color:white}.secondary{background:white;border:1px solid var(--line);color:#a97891}.danger{background:#fff0f0;color:#b24e58}.soft{background:#f0eafa;color:#8875a5}.green{background:#edf5ed;color:#648b6b}
.field{margin:10px 0;min-width:0}.field label{display:block;color:#ad7891;font-weight:700;font-size:.78rem;margin-bottom:5px}
.field input,.field select,.field textarea,.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:1rem}
.field textarea{min-height:75px;resize:vertical}.grid2,.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.stat:nth-child(1){background:#fff0f5}.stat:nth-child(2){background:#f0f4fc}.stat:nth-child(3){background:#f2f8f0}.stat:nth-child(4){background:#fff7e9}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.2rem;color:var(--gold);overflow-wrap:anywhere}
.banner{padding:0;overflow:hidden;min-height:0;background:#fff;border:1px dashed #dfbdcc}.banner img{width:100%;height:175px;object-fit:cover;display:none}.banner-placeholder{height:145px;background:linear-gradient(135deg,#fffafd,#f8f3f7,#f3f6fa)}.banner.has-image img{display:block}.banner.has-image .banner-placeholder{display:none}
.job{background:white;border:1px solid var(--line);border-left:4px solid var(--pink);border-radius:12px;padding:12px;margin:9px 0;overflow-wrap:anywhere}.job.done{border-left-color:var(--sage)}.job.running{border-left-color:var(--gold)}.job-name{font-weight:800;font-size:1rem}.job-time{color:var(--rose);font-weight:700;margin:5px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{flex:1 1 85px}
.message-preview{background:white;border:1px solid var(--line);border-radius:11px;padding:12px;white-space:pre-wrap;line-height:1.6;min-height:85px}
.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:7px 3px calc(7px + var(--safe));background:#fffdfdf5;border-top:1px solid var(--line);backdrop-filter:blur(12px)}
.nav button{background:none;color:#a99a83;font-size:.61rem;padding:4px 1px;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button span{font-size:1.8rem;line-height:1.2}.nav button.active{color:var(--rose);font-weight:800}
.empty{text-align:center;padding:20px;color:var(--muted)}dialog{width:min(94%,520px);max-height:88dvh;overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fffafc;color:var(--ink);padding:14px}dialog::backdrop{background:#30263088}
.home-timer{background:linear-gradient(145deg,#fffafd,#f8f4fa,#fff);border:1px solid #ead8e2;border-radius:16px;padding:15px;margin:10px 0}.timer-display{font:700 2.5rem "DM Sans",sans-serif;color:var(--gold);text-align:center;margin:13px 0;font-variant-numeric:tabular-nums}.timer-money{font:700 1.7rem "Cormorant Garamond",serif;color:#a9874d}.timer-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}.timer-buttons button{padding:11px 4px;border-radius:10px;font-size:.76rem;font-weight:700;min-height:43px}
.calendar-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;color:var(--muted);font-size:.72rem;margin-top:12px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}.cal-day{min-height:66px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 2px;text-align:center;color:var(--ink);font-size:.78rem}.cal-day.muted{opacity:.35}.cal-day.selected{border:2px solid var(--rose);background:#fff1f6}.cal-day.today{box-shadow:inset 0 0 0 1px var(--gold)}.cal-day .dots{display:flex;justify-content:center;gap:3px;margin-top:5px}.cal-day i{width:5px;height:5px;border-radius:50%;background:var(--rose)}.cal-day i:nth-child(2){background:var(--sage)}.view-tabs{display:flex;gap:6px}.view-tabs button{flex:1}
.divider{height:1px;background:var(--line);margin:15px 0}.status-note{padding:9px;border-radius:9px;background:#f3f5ef;font-size:.75rem;color:#648b6b;margin:8px 0}
@media(max-width:390px){.nav button{font-size:.53rem}.nav button span{font-size:1.55rem}.cal-day{min-height:56px;font-size:.7rem}}
</style>
</head>
<body>
<!-- Pentru a evita trunchierea, codul complet este disponibil în fișierul atașat. -->
</body>
</html>
