  function renderHome(){

function calcAvail(js){

let total=0;
let last=9*60;

js.forEach(j=>{
total+=Math.max(0,minutes(j.start)-last);
last=Math.max(last,minutes(j.end));
});

total+=Math.max(0,18*60-last);

return (total/60).toFixed(1);
}

let c=client(j.clientId);

let cls=
j.status==='completed'
?'done'
:j.status==='inprogress'
?'prog'
:'';

return `

<div class="bar"></div>

<div class="jobbody">

<b>${c.name}</b>

<b>£${Number(j.price||0).toFixed(2)}</b>

?`<p>📍 ${c.address}</p>`
:''}

${
j.status==='inprogress'
?'In Progress'
:j.status
?j.status[0].toUpperCase()+j.status.slice(1)

function jobAction(id){

let j=data.jobs.find(x=>x.id===id);

if(!j)return;

if(j.status==='scheduled'){

if(confirm('Start this cleaning now? 🧹')){
startTimer(id);
}

}else if(j.status==='inprogress'){

showTimer(id);

}else{

openJobEdit(id);

}
}


function startTimer(id){

let j=data.jobs.find(x=>x.id===id);

if(!j)return;

j.status='inprogress';

timerJobId=id;
timerStart=Date.now();

save();

showTimer(id);

clearInterval(timerId);

timerId=setInterval(updateClock,1000);

updateClock();
}


function showTimer(id){

let j=data.jobs.find(x=>x.id===id);

if(!j)return;

let c=client(j.clientId);

document.getElementById('timerName').textContent=c.name;

document.getElementById('timerDetails').innerHTML=`

<div class="row">
<span>Date</span>
<b>${j.date}</b>
</div>

<div class="row">
<span>Scheduled</span>
<b>${j.start} – ${j.end}</b>
</div>

<div class="row">
<span>Price</span>
<b>£${Number(j.price||0).toFixed(2)}</b>
</div>

`;

show('timer');

if(!timerStart){

timerJobId=id;

timerStart=Date.now();

clearInterval(timerId);

timerId=setInterval(updateClock,1000);

}

updateClock();
}


function updateClock(){

if(!timerStart)return;

let s=Math.floor((Date.now()-timerStart)/1000);

document.getElementById('clock').textContent=
`${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;
}


function finishTimer(){

let j=data.jobs.find(x=>x.id===timerJobId);

if(!j)return;

let elapsed=Math.max(0,Date.now()-timerStart);

let totalHours=elapsed/3600000;

let startMinutes=minutes(j.start);

let endMinutes=Math.round(startMinutes+totalHours*60);

j.end=
`${pad(Math.floor(endMinutes/60)%24)}:${pad(endMinutes%60)}`;

j.status='completed';

clearInterval(timerId);

timerId=null;
timerStart=null;
timerJobId=null;

save();

toast('Job completed and saved ✓');

show('home');
}

function saveClient(){

let c={
id:editingClient||Date.now(),
name:document.getElementById('cName').value.trim(),
phone:document.getElementById('cPhone').value.trim(),
address:document.getElementById('cAddress').value.trim(),
freq:document.getElementById('cFreq').value,
hours:Number(document.getElementById('cHours').value||0),
price:Number(document.getElementById('cPrice').value||0)
};

if(!c.name){

toast('Please enter a client name');

return;
}

if(editingClient){

let i=data.clients.findIndex(
x=>x.id===editingClient
);

if(i>=0)data.clients[i]=c;

}else{

data.clients.push(c);

}

save();

closeModal();

renderAll();

toast('Client saved ✓');
}


function deleteClient(){

if(!editingClient)return;

let c=client(editingClient);

if(!confirm(
`Delete ${c.name} from your clients? Historical jobs will be kept.`
))return;

data.clients=data.clients.filter(
x=>x.id!==editingClient
);

data.weeklySchedule=
data.weeklySchedule.filter(
x=>x.name.toLowerCase()!==c.name.toLowerCase()
);

save();

closeModal();

renderAll();

toast('Client deleted');
}

function renderWeeklySchedule(){

let container=
document.getElementById('weeklySchedule');

if(!container)return;

let names=[
'Monday',
'Tuesday',
'Wednesday',
'Thursday',
'Friday'
];

let html='';

names.forEach((name,index)=>{

let items=data.weeklySchedule
.filter(x=>x.day===index+1);

if(!items.length)return;

html+=`

<h2 style="font-size:17px;margin-bottom:8px">
${name}
</h2>
`;

items.forEach(x=>{

let actual=x;

if(index===4){

let weekAnchor=
new Date(2026,0,5);

let now=new Date();

let diff=Math.floor(
(now-weekAnchor)/(7*24*60*60*1000)
);

let even=Math.abs(diff)%2===0;

if(x.alternate==='A'&&!even)return;
if(x.alternate==='B'&&even)return;
}

let hours=
x.variable
?`${x.defaultHours||4}h default`
:`${(minutes(x.end)-minutes(x.start))/60}h`;

html+=`

<div class="job">

<div class="bar"></div>

<div class="jobbody">

<div class="jobtop">
<b>${x.name}</b>
<b>£${x.rate}/h</b>
</div>

<p>
🕐 ${x.start} – ${x.end}
· ${hours}
</p>

<p>
${x.type==='Private'?'🏡 Private':'🏢 Agency'}
</p>

${x.variable
?`<span class="pill">Flexible hours</span>`
:''}

</div>

</div>
`;

});

});

container.innerHTML=html;
}


function renderMonthlyEstimate(){

let el=
document.getElementById('monthlyEstimate');

if(!el)return;

let now=new Date();

let prev=
new Date(now.getFullYear(),now.getMonth()-1,1);

let year=prev.getFullYear();
let month=prev.getMonth();

let daysInMonth=
new Date(year,month+1,0).getDate();

let totalHours=0;
let totalEarn=0;

for(let d=1;d<=daysInMonth;d++){

let date=
new Date(year,month,d);

let day=date.getDay();

if(day===0||day===6)continue;

let weekday=
day===0?7:day;

data.weeklySchedule
.filter(x=>x.day===weekday)
.forEach(x=>{

let hours=
x.variable
?Number(x.defaultHours||4)
:(minutes(x.end)-minutes(x.start))/60;

totalHours+=hours;
totalEarn+=hours*Number(x.rate||0);

});

}

el.innerHTML=`

<b>
📊 Estimated ${prev.toLocaleDateString(undefined,{
month:'long',
year:'numeric'
})}
</b>

<p style="margin:8px 0 0">
Approximately <strong>${totalHours.toFixed(1)} hours</strong>
</p>

<p style="margin:4px 0 0">
Estimated earnings:
<strong>£${totalEarn.toFixed(2)}</strong>
</p>

<p class="small" style="margin-top:9px">
Based on your saved weekly schedule and default hours.
</p>
`;
}


function nextSlots(){

let out=[];

let d=new Date();

for(
let n=1;
n<=14&&out.length<3;
n++
){

let x=new Date();

x.setDate(d.getDate()+n);

let ds=dateStr(x);

let js=data.jobs
.filter(j=>j.date===ds)
.sort((a,b)=>
minutes(a.start)-minutes(b.start)
);

let start=9*60;

for(let j of js){

let gap=minutes(j.start)-start;

if(gap>=120){

out.push({
date:x.toLocaleDateString(undefined,{
weekday:'short',
day:'numeric',
month:'short'
}),

time:
`${pad(Math.floor(start/60))}:${pad(start%60)} – ${j.start}`,

hours:(gap/60).toFixed(1)+'h'
});

break;
}

start=Math.max(start,minutes(j.end));
}

if(
out.length<3 &&
18*60-start>=120
){

out.push({

date:x.toLocaleDateString(undefined,{
weekday:'short',
day:'numeric',
month:'short'
}),

time:
`${pad(Math.floor(start/60))}:${pad(start%60)} – 18:00`,

hours:
((18*60-start)/60).toFixed(1)+'h'

});

}

}

return out;
}


function findNextSlot(js){

let last=9*60;

for(let j of js){

if(minutes(j.start)-last>=120){

return {
label:'Today ✨',
detail:
`${pad(Math.floor(last/60))}:${pad(last%60)} – ${j.start}`
};

}

last=Math.max(last,minutes(j.end));

}

if(18*60-last>=120){

return {
label:'Today ✨',
detail:
`${pad(Math.floor(last/60))}:${pad(last%60)} – 18:00`
};

}

return {
label:'Tomorrow',
detail:'Swipe to Schedule to see available slots 📅'
};

}

toast('Notifications are not supported here');

return;
}

Notification.requestPermission()
.then(permission=>{

if(permission==='granted'){

toast('Reminders enabled 🔔');

scheduleReminder();

}else{

toast('Notification permission not granted');

}

});

}


function scheduleReminder(){

if(!('Notification' in window))return;

if(Notification.permission!=='granted')return;

let now=new Date();

let tomorrow=
new Date(
now.getFullYear(),
now.getMonth(),
now.getDate()+1
);

let day=
tomorrow.getDay();

let weekday=
day===0?7:day;

let items=data.weeklySchedule
.filter(x=>x.day===weekday);

if(!items.length)return;

let text=items.map(x=>
`${x.name} · ${x.start}–${x.end}`
).join('\n');

let target=
new Date(
tomorrow.getFullYear(),
tomorrow.getMonth(),
tomorrow.getDate()-1,
20,0,0
);

let delay=target-now;

if(delay>0){

new Notification(

function renderTomorrowReminder(){

let el=
document.getElementById('tomorrowReminder');

if(!el)return;

let tomorrow=
new Date();

tomorrow.setDate(tomorrow.getDate()+1);

let day=tomorrow.getDay();

let weekday=
day===0?7:day;

let items=data.weeklySchedule
.filter(x=>x.day===weekday);

if(!items.length){

el.innerHTML=
'🌸 No scheduled cleaning for tomorrow.';

return;
}

el.innerHTML=`

<b>🔔 Tomorrow at 20:00</b>

<p class="small" style="margin:6px 0 0">
${items.map(x=>
`${x.name} · ${x.start}–${x.end}`
).join(' · ')}
</p>

`;
}


function toast(t){

let el=
document.getElementById('toast');

el.textContent=t;

el.classList.remove('hidden');

setTimeout(()=>{
el.classList.add('hidden');
},1800);

}


const toastEl=
document.getElementById('toast');


/* SWIPE NAVIGATION */

let touchStartX=0;
let touchStartY=0;

const track=
document.getElementById('pageTrack');

track.addEventListener(
'touchstart',
e=>{

touchStartX=e.touches[0].clientX;
touchStartY=e.touches[0].clientY;

},
{passive:true}
);


track.addEventListener(
'touchend',
e=>{

let endX=e.changedTouches[0].clientX;
let endY=e.changedTouches[0].clientY;

let dx=endX-touchStartX;
let dy=endY-touchStartY;

if(Math.abs(dx)<55)return;

if(Math.abs(dx)<=Math.abs(dy))return;

if(dx<0){

goPage(currentPage+1);

}else{

goPage(currentPage-1);

}

},
{passive:true}
);


window.addEventListener(
'pageshow',
()=>{

if(timerStart){
updateClock();
}

}
);


window.addEventListener(
'beforeunload',
()=>{

if(timerStart){

localStorage.setItem(
'cleaningTimer',
JSON.stringify({
jobId:timerJobId,
startedAt:timerStart
})
);

}

}
);


function restoreTimer(){

let saved=
localStorage.getItem('cleaningTimer');

if(!saved)return;

try{

let t=JSON.parse(saved);

if(
t &&
t.jobId &&
t.startedAt
){

let j=data.jobs.find(
x=>x.id==t.jobId
);

if(
j &&
j.status==='inprogress'
){

timerJobId=t.jobId;
timerStart=t.startedAt;

clearInterval(timerId);

timerId=
setInterval(updateClock,1000);

}

}

}catch(e){}

}


renderTomorrowReminder();
renderAll();
restoreTimer();

if('serviceWorker' in navigator){

window.addEventListener(
'load',
()=>
navigator.serviceWorker
.register('./sw.js')
.catch(()=>{})
);

}
