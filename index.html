<script>
/* =========================================================
   PURE SHINE CLEANING MANAGER — NAVIGATION + CALENDAR FIX
   ========================================================= */

/* ---------- FIX ALL NAVIGATION BUTTONS ---------- */
document.querySelectorAll('.bottom .nav').forEach(button => {
    button.type = 'button';

    button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();

        const page = this.dataset.page;

        if (!page) return;

        /* Close any open modal/sheet before changing page */
        document.querySelectorAll('.modal.show').forEach(modal => {
            modal.classList.remove('show');
        });

        /* Remove old active states */
        document.querySelectorAll('.page').forEach(p => {
            p.classList.remove('active');
        });

        document.querySelectorAll('.bottom .nav').forEach(n => {
            n.classList.remove('active');
        });

        /* Open requested page */
        const target = document.getElementById(page);

        if (target) {
            target.classList.add('active');
            this.classList.add('active');

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

            if (typeof render === 'function') {
                render();
            }
        }
    });
});


/* ---------- SAFE PAGE NAVIGATION ---------- */
window.showPage = function(pageId, button) {

    const target = document.getElementById(pageId);

    if (!target) return;

    document.querySelectorAll('.modal.show').forEach(modal => {
        modal.classList.remove('show');
    });

    document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
    });

    document.querySelectorAll('.bottom .nav').forEach(nav => {
        nav.classList.remove('active');
    });

    target.classList.add('active');

    const navButton =
        button ||
        document.querySelector('.bottom .nav[data-page="' + pageId + '"]');

    if (navButton) {
        navButton.classList.add('active');
    }

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

    if (typeof render === 'function') {
        render();
    }
};


/* ---------- NORMALISE OLD / BROKEN JOB DATA ---------- */
function normaliseCleaningJobs() {

    if (!Array.isArray(jobs)) {
        jobs = [];
    }

    jobs = jobs.map((job, index) => {

        const client =
            clients.find(c =>
                String(c.id) === String(job.clientId)
            );

        let start =
            job.start ||
            job.startTime ||
            job.from ||
            '';

        let end =
            job.end ||
            job.endTime ||
            job.to ||
            '';

        /*
         * Never allow undefined to reach the screen.
         */
        if (start === 'undefined' || start === 'null') {
            start = '';
        }

        if (end === 'undefined' || end === 'null') {
            end = '';
        }

        let day =
            job.day ||
            job.weekday ||
            '';

        if (!day && job.date) {
            const d = new Date(job.date + 'T12:00:00');

            if (!isNaN(d.getTime())) {
                day = days[d.getDay()];
            }
        }

        if (!day) {
            day = 'Monday';
        }

        let hours = Number(job.hours);

        if (!Number.isFinite(hours) || hours < 0) {
            hours = 0;
        }

        if (start && end) {
            const calculated = duration(start, end);

            if (calculated > 0) {
                hours = calculated;
            }
        }

        return {
            id: job.id || ('job-' + Date.now() + '-' + index),

            clientId:
                job.clientId ||
                client?.id ||
                '',

            day: day,

            date:
                job.date ||
                '',

            start: start,

            end: end,

            hours: hours,

            rate:
                Number(job.rate) ||
                Number(client?.rate) ||
                0,

            done:
                Boolean(job.done),

            notes:
                job.notes ||
                ''
        };
    });

    save();
}

normaliseCleaningJobs();


/* ---------- CALENDAR — REAL MONTH GRID ---------- */
window.renderCalendar = function() {

    const calendar = document.getElementById('calendar');

    if (!calendar) return;

    const now = new Date();

    let currentYear =
        window.calendarYear ||
        now.getFullYear();

    let currentMonth =
        window.calendarMonth !== undefined
            ? window.calendarMonth
            : now.getMonth();

    window.calendarYear = currentYear;
    window.calendarMonth = currentMonth;

    const monthName =
        new Date(
            currentYear,
            currentMonth,
            1
        ).toLocaleDateString(
            'en-GB',
            {
                month: 'long',
                year: 'numeric'
            }
        );

    const firstDay =
        new Date(
            currentYear,
            currentMonth,
            1
        ).getDay();

    const mondayOffset =
        firstDay === 0 ? 6 : firstDay - 1;

    const daysInMonth =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        ).getDate();

    const previousMonthDays =
        new Date(
            currentYear,
            currentMonth,
            0
        ).getDate();

    let html = `
        <div class="calendar-wrapper">

            <div class="calendar-top">
                <button
                    type="button"
                    class="calendar-arrow"
                    onclick="previousCalendarMonth(event)">
                    ‹
                </button>

                <div class="calendar-month">
                    ${monthName}
                </div>

                <div class="calendar-controls">
                    <button
                        type="button"
                        class="calendar-today"
                        onclick="goCalendarToday(event)">
                        Today
                    </button>

                    <button
                        type="button"
                        class="calendar-arrow"
                        onclick="nextCalendarMonth(event)">
                        ›
                    </button>
                </div>
            </div>

            <div class="calendar-weekdays">
                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div>SAT</div>
                <div>SUN</div>
            </div>

            <div class="calendar-grid">
    `;

    /* Previous month filler */
    for (let i = mondayOffset - 1; i >= 0; i--) {

        const dayNumber =
            previousMonthDays - i;

        html += `
            <div class="calendar-cell muted">
                <div class="calendar-number">
                    ${dayNumber}
                </div>
            </div>
        `;
    }

    /* Current month */
    for (
        let dayNumber = 1;
        dayNumber <= daysInMonth;
        dayNumber++
    ) {

        const cellDate =
            new Date(
                currentYear,
                currentMonth,
                dayNumber
            );

        const isoDate =
            currentYear +
            '-' +
            String(currentMonth + 1).padStart(2, '0') +
            '-' +
            String(dayNumber).padStart(2, '0');

        const weekday =
            days[cellDate.getDay()];

        const isToday =
            cellDate.toDateString() === now.toDateString();

        const dayJobs =
            jobs.filter(job => {

                if (job.date === isoDate) {
                    return true;
                }

                /*
                 * Legacy weekly jobs without dates
                 * still appear on the correct weekday.
                 */
                if (!job.date && job.day === weekday) {
                    return true;
                }

                return false;
            });

        html += `
            <div
                class="calendar-cell ${isToday ? 'today-cell' : ''}"
                onclick="calendarDayClicked('${isoDate}', '${weekday}')">

                <div class="calendar-number ${isToday ? 'today-number' : ''}">
                    ${dayNumber}
                </div>

                <div class="calendar-jobs">
        `;

        dayJobs.forEach(job => {

            const clientName =
                name(job.clientId);

            const safeStart =
                job.start && job.start !== 'undefined'
                    ? job.start
                    : '';

            const safeEnd =
                job.end && job.end !== 'undefined'
                    ? job.end
                    : '';

            let time = '';

            if (safeStart && safeEnd) {
                time =
                    safeStart +
                    ' – ' +
                    safeEnd;
            } else if (safeStart) {
                time = safeStart;
            } else if (job.hours) {
                time = timeText(job.hours);
            }

            html += `
                <button
                    type="button"
                    class="calendar-job"
                    onclick="event.stopPropagation(); openJob('${job.id}')">

                    <strong>${clientName}</strong>

                    ${
                        time
                            ? `<span>${time}</span>`
                            : `<span>${timeText(job.hours)}</span>`
                    }

                    <small>
                        ${money(job.hours * job.rate)}
                    </small>

                </button>
            `;
        });

        html += `
                </div>
            </div>
        `;
    }

    /*
     * Fill remaining cells so the calendar
     * always has complete weeks.
     */
    const totalCells =
        mondayOffset + daysInMonth;

    const remaining =
        totalCells % 7 === 0
            ? 0
            : 7 - (totalCells % 7);

    for (let i = 1; i <= remaining; i++) {

        html += `
            <div class="calendar-cell muted">
                <div class="calendar-number">
                    ${i}
                </div>
            </div>
        `;
    }

    html += `
            </div>

            <button
                type="button"
                class="calendar-add-job"
                onclick="openJob()">
                ＋ Add cleaning job
            </button>

        </div>
    `;

    calendar.innerHTML = html;
};


/* ---------- CALENDAR NAVIGATION ---------- */
window.previousCalendarMonth = function(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    window.calendarMonth--;

    if (window.calendarMonth < 0) {
        window.calendarMonth = 11;
        window.calendarYear--;
    }

    renderCalendar();
};


window.nextCalendarMonth = function(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    window.calendarMonth++;

    if (window.calendarMonth > 11) {
        window.calendarMonth = 0;
        window.calendarYear++;
    }

    renderCalendar();
};


window.goCalendarToday = function(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    const today = new Date();

    window.calendarYear =
        today.getFullYear();

    window.calendarMonth =
        today.getMonth();

    renderCalendar();
};


window.calendarDayClicked = function(date, day) {

    /*
     * Tapping an empty calendar day opens
     * a new job already prepared for that date.
     */
    openJob();

    const dateInput =
        document.getElementById('jDate');

    const dayInput =
        document.getElementById('jDay');

    if (dateInput) {
        dateInput.value = date;
    }

    if (dayInput) {
        dayInput.value = day;
    }
};


/* ---------- FIX ADD / EDIT JOB ---------- */
window.openJob = function(id) {

    const modal =
        document.getElementById('jobModal');

    const clientSelect =
        document.getElementById('jClient');

    const jobId =
        document.getElementById('jId');

    if (!modal || !clientSelect) return;

    const job =
        jobs.find(
            item => String(item.id) === String(id)
        );

    clientSelect.innerHTML =
        clients.map(client => `
            <option value="${client.id}">
                ${client.name} — £${Number(client.rate || 0).toFixed(2)}/hour
            </option>
        `).join('');

    if (job) {

        jobId.value = job.id;

        clientSelect.value =
            job.clientId;

        document.getElementById('jDate').value =
            job.date || '';

        document.getElementById('jDay').value =
            job.day || 'Monday';

        document.getElementById('jStart').value =
            job.start || '';

        document.getElementById('jEnd').value =
            job.end || '';

        document.getElementById('jRate').value =
            job.rate || 0;

        document.getElementById('jNotes').value =
            job.notes || '';

        document
            .getElementById('deleteJobBtn')
            ?.classList.remove('hidden');

        document.getElementById('jobTitle').textContent =
            'Edit Cleaning Job';

    } else {

        jobId.value = '';

        const firstClient =
            clients[0];

        if (firstClient) {
            clientSelect.value =
                firstClient.id;

            document.getElementById('jRate').value =
                firstClient.rate || 0;
        }

        const today =
            new Date();

        const iso =
            today.getFullYear() +
            '-' +
            String(today.getMonth() + 1).padStart(2, '0') +
            '-' +
            String(today.getDate()).padStart(2, '0');

        document.getElementById('jDate').value =
            iso;

        document.getElementById('jDay').value =
            days[today.getDay()];

        document.getElementById('jStart').value =
            '';

        document.getElementById('jEnd').value =
            '';

        document.getElementById('jNotes').value =
            '';

        document
            .getElementById('deleteJobBtn')
            ?.classList.add('hidden');

        document.getElementById('jobTitle').textContent =
            'Add Cleaning Job';
    }

    if (typeof calcHours === 'function') {
        calcHours();
    }

    modal.classList.add('show');
};


/* ---------- FIX SAVE JOB ---------- */
window.saveJob = function() {

    const clientId =
        document.getElementById('jClient').value;

    const client =
        clients.find(
            c => String(c.id) === String(clientId)
        );

    if (!client) return;

    const id =
        document.getElementById('jId').value;

    const date =
        document.getElementById('jDate').value;

    const start =
        document.getElementById('jStart').value;

    const end =
        document.getElementById('jEnd').value;

    const day =
        document.getElementById('jDay').value;

    const hours =
        start && end
            ? duration(start, end)
            : Number(client.hours || 0);

    const rate =
        Number(
            document.getElementById('jRate').value
        ) || Number(client.rate || 0);

    const oldJob =
        jobs.find(
            j => String(j.id) === String(id)
        );

    const newJob = {
        id:
            id ||
            'job-' +
            Date.now(),

        clientId,

        date,

        day,

        start,

        end,

        hours,

        rate,

        done:
            oldJob?.done || false,

        notes:
            document
                .getElementById('jNotes')
                .value
                .trim()
    };

    if (id) {

        jobs =
            jobs.map(
                j =>
                    String(j.id) === String(id)
                        ? newJob
                        : j
            );

    } else {

        jobs.push(newJob);
    }

    save();

    document
        .getElementById('jobModal')
        ?.classList.remove('show');

    renderCalendar();

    if (typeof render === 'function') {
        render();
    }
};


/* ---------- FIX RENDER SO CALENDAR NEVER SHOWS UNDEFINED ---------- */
const originalRender =
    window.render;

window.render = function() {

    normaliseCleaningJobs();

    if (typeof originalRender === 'function') {
        originalRender();
    }

    renderCalendar();
};


/* ---------- FIX MODAL BUTTONS ---------- */
document
    .querySelectorAll('.modal button')
    .forEach(button => {
        button.type = 'button';
    });


/* ---------- FIX PAGE BUTTONS ---------- */
document
    .querySelectorAll('button')
    .forEach(button => {

        if (!button.type) {
            button.type = 'button';
        }
    });


/* ---------- START ON HOME ---------- */
document
    .querySelectorAll('.page')
    .forEach(page => {
        page.classList.remove('active');
    });

document
    .getElementById('home')
    ?.classList.add('active');

document
    .querySelectorAll('.bottom .nav')
    .forEach(nav => {
        nav.classList.toggle(
            'active',
            nav.dataset.page === 'home'
        );
    });


/* ---------- REFRESH CALENDAR ---------- */
setTimeout(() => {
    normaliseCleaningJobs();
    renderCalendar();
}, 50);
</script>
