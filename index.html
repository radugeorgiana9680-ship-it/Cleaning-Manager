<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fffafd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Pure Shine Cleaning Manager</title>

<style>
:root{
--pink:#e879a3;
--pink-soft:#f9dce8;
--blue:#dceafb;
--green:#dcefe4;
--yellow:#fff0c7;
--purple:#e8defa;
--peach:#f8ddd5;
--ink:#22212a;
--muted:#77727d;
--white:#fff;
--zoom:1
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
min-height:100%;
background:#f8e8ee;
color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

button,input,select,textarea{
font:inherit
}

button{
border:0;
cursor:pointer
}

.hidden{
display:none!important
}

#app{
width:min(100%,650px);
min-height:100vh;
margin:auto;
background:#fffafd;
padding:0 16px calc(108px + env(safe-area-inset-bottom));
zoom:var(--zoom)
}

/* HEADER */

header{
padding:22px 0 15px
}

.headerRow{
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:62px;
height:62px;
border-radius:50%;
object-fit:cover;
background:#fff
}

.brand h1{
margin:0;
font-size:23px;
letter-spacing:-.5px
}

.brand p{
margin:4px 0 0;
color:#817984;
font-size:14px
}

.headerBtn{
width:50px;
height:50px;
border-radius:50%;
background:#fff;
box-shadow:0 5px 18px #55435514;
font-size:24px
}

/* DATE */

.dateCard{
height:86px;
border-radius:24px;
background:#f7d7e5;
padding:14px 18px;
display:flex;
align-items:center;
justify-content:space-between
}

.dateLeft{
display:flex;
align-items:center;
gap:12px
}

.dateIcon{
font-size:28px;
color:#a53f69
}

.dateMain{
font-size:18px;
font-weight:850
}

.dateSub{
font-size:13px;
color:#817984;
margin-top:5px
}

.dateHeart{
font-size:43px;
color:#d56696
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin:18px 0 27px
}

.stat{
height:116px;
border-radius:21px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center
}

.statIcon{
font-size:25px;
margin-bottom:5px
}

.statValue{
font-size:20px;
font-weight:900
}

.statLabel{
font-size:12px;
margin-top:4px
}

.stat:nth-child(1){
background:#f8d9e5
}

.stat:nth-child(2){
background:#dceafb
}

.stat:nth-child(3){
background:#dcefe4
}

.stat:nth-child(4){
background:#fff0c7
}

/* HEADINGS */

.sectionHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px
}

.sectionHead h2,
.quickTitle{
font-size:21px;
font-weight:900;
margin:0
}

.linkBtn{
background:none;
color:#b34770;
font-weight:850
}

/* TODAY */

.scheduleBox{
background:#fff;
border-radius:22px;
padding:10px;
box-shadow:0 6px 24px #60495d0d
}

.empty{
text-align:center;
padding:22px 12px 12px;
color:#77727d
}

.emptyIcon{
font-size:43px;
color:#e27aa4
}

.empty strong{
display:block;
font-size:18px;
color:#22212a
}

.empty p{
margin:5px 0 16px
}

.primaryFull{
width:100%;
height:53px;
border-radius:27px;
background:linear-gradient(135deg,#e98aae,#d96c98);
color:#fff;
font-weight:850
}

/* QUICK ACTIONS */

.quickTitle{
margin:24px 0 10px
}

.quick{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.quick button{
height:65px;
border-radius:17px;
display:flex;
align-items:center;
justify-content:center;
gap:9px;
font-size:13px;
font-weight:700
}

.q1{
background:var(--blue);
color:#245887
}

.q2{
background:var(--green);
color:#347758
}

.q3{
background:var(--pink-soft);
color:#9e3f68
}

.q4{
background:var(--yellow);
color:#7d621d
}

.q5{
background:var(--purple);
color:#65469c
}

.q6{
background:var(--peach);
color:#a65243
}

.q7{
background:var(--peach);
color:#a65243
}

.q8{
background:var(--pink-soft);
color:#a43e69
}

.qIcon{
font-size:24px
}

/* BANNER */

.banner{
height:108px;
margin-top:15px;
border-radius:20px;
background:linear-gradient(135deg,#f8dce7,#fdebef);
display:grid;
place-items:center;
text-align:center;
overflow:hidden
}

.bannerText{
font-family:"Brush Script MT","Segoe Script",cursive;
font-size:29px;
line-height:1.1;
color:#a45676
}

/* BOTTOM NAV */

.bottomNav{
position:fixed;
z-index:90;
left:50%;
bottom:0;
transform:translateX(-50%);
width:min(650px,100%);
min-height:88px;
background:rgba(255,255,255,.98);
border-top:1px solid #eee5e9;
padding:7px 4px calc(7px + env(safe-area-inset-bottom));
display:grid;
grid-template-columns:repeat(5,1fr);
box-shadow:0 -7px 28px #50324612
}

.bottomNav button{
background:none;
color:#99939d;
font-size:11px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px
}

.bottomNav button span{
width:48px;
height:41px;
border-radius:21px;
display:grid;
place-items:center;
font-size:27px
}

.bottomNav button.active{
color:#d45f91;
font-weight:800
}

.bottomNav button.active span{
background:#f9dce8
}

/* MODAL */

.overlay{
position:fixed;
z-index:1000;
inset:0;
background:#2d243355;
backdrop-filter:blur(5px);
display:none;
align-items:flex-end
}

.overlay.show{
display:flex
}

.sheet{
width:100%;
max-width:650px;
max-height:94vh;
overflow:auto;
background:#fffafd;
border-radius:30px 30px 0 0;
padding:20px 18px 30px
}

.sheetHeader{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px
}

.sheetHeader h2{
margin:0;
font-size:23px
}

.closeBtn{
width:43px;
height:43px;
border-radius:50%;
background:#f4e7ee;
color:#b45c80;
font-size:24px
}

.listItem,
.history,
.setting,
.reminder{
background:#fff;
border:1px solid #eee3e8;
border-radius:19px;
padding:14px;
margin:9px 0
}

.listTop,
.settingRow{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.meta,
.settingText,
.reminderMeta{
font-size:12px;
color:#817984;
margin-top:5px;
line-height:1.5
}

.editBtn{
background:#f5e5ec;
color:#b65c80;
padding:9px 12px;
border-radius:12px;
font-weight:800
}

.saveBtn{
width:100%;
margin-top:15px;
padding:15px;
border-radius:18px;
background:linear-gradient(135deg,#e98bae,#d76d99);
color:#fff;
font-weight:900
}

.deleteBtn{
width:100%;
margin-top:9px;
padding:14px;
border-radius:17px;
background:#ffe1e7;
color:#ad3e67;
font-weight:850
}

.input,
.select,
.textarea{
width:100%;
padding:13px;
border:2px solid #eadfe5;
border-radius:16px;
background:#fff;
outline:0;
font-size:16px
}

.textarea{
min-height:90px
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

label{
display:block;
font-weight:800;
margin:13px 0 6px
}

.tabs{
display:flex;
gap:7px;
margin-bottom:12px
}

.tab{
flex:1;
background:#eee8f0;
border-radius:14px;
padding:11px;
font-weight:800
}

.tab.active{
background:#e68caf;
color:#fff
}

.notice{
padding:13px;
background:#fff1f5;
border-radius:16px;
color:#7d7179;
font-size:12px;
line-height:1.55;
margin:10px 0
}

.history{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.history small{
display:block;
color:#857b84;
margin-top:4px
}

/* TIMER */

.timerFloating{
position:fixed;
z-index:95;
right:14px;
bottom:100px;
background:#fff;
border-radius:17px;
box-shadow:0 10px 30px #0002;
padding:10px 13px;
display:none
}

.timerFloating.show{
display:block
}

/* RESPONSIVE */

@media(max-width:520px){

#app{
padding-left:13px;
padding-right:13px
}

.brand h1{
font-size:21px
}

.logo{
width:58px;
height:58px
}

.dateMain{
font-size:16px
}

.stats{
gap:6px
}

.stat{
height:110px
}

.statValue{
font-size:18px
}

.statLabel{
font-size:11px
}

.quick button{
height:64px
}

.banner{
height:103px
}

}

@media(max-width:370px){

.stats{
grid-template-columns:1fr 1fr
}

}
</style>
</head>

<script>

const STORAGE_KEY=
"pure_shine_cleaning_manager_final_v21";

const OLD_KEYS=[
"pure_shine_cleaning_manager_final_v20",
"pure_shine_manager_v7",
"pureShineCleaningManager3",
"pureShineExactDesign",
"pureShineExactDesignV11"
];


const defaultClients=[

{

},

{

variable:true,
phone:"",

notes:"Normally 09:00–14:00, sometimes only until 13:00 or sometimes more than 14:00."
},

{
id:"laura",
name:"Laura",
type:"Private",
rate:18,
day:"Thursday",
start:"09:00",
end:"13:00",
frequency:"Weekly",
week:"A",
variable:true,
phone:"",
location:"",
notes:"Normally 09:00–13:00, sometimes 5 hours."
},

{
id:"hannah",
name:"Hannah",
type:"Agency",
rate:16,
day:"Thursday",
start:"13:00",
end:"16:00",

week:"A",

phone:"",

},

{
id:"meghan",
name:"Meghan",
type:"Private",
rate:18,
day:"",
start:"",
end:"",
frequency:"Occasional",
week:"A",
variable:true,

},

{
id:"joanna",
name:"Joanna",
type:"Private",
rate:18,
day:"Friday",
start:"09:30",
end:"13:30",
frequency:"Fortnightly",
week:"A",
variable:true,
phone:"",
location:"",
notes:"Friday fortnightly. Starts 2 October 2026."
},

{
id:"sindu",
name:"Sindu",
type:"Agency",
rate:16,
day:"Friday",
start:"09:30",
end:"12:30",
frequency:"Fortnightly",
week:"B",
variable:false,
phone:"",
location:"",
notes:"Friday fortnightly. Starts 25 September 2026."
},

{
id:"peter",
name:"Peter",
type:"Private",
rate:18,
day:"",
start:"",
end:"",
frequency:"Occasional",
week:"A",
variable:true,
phone:"",
location:"",
notes:"Occasional client."
},

{
id:"mike",
name:"Mike",
type:"Agency",
rate:16,
day:"",
start:"",
end:"",
frequency:"Every 3 weeks",
week:"A",
variable:true,
phone:"",
location:"",
notes:"Every 3 weeks. Standard 2 hours, variable duration."
}

];


let data={
clients:[],
jobs:[],
holidays:[],
reminders:[],
timer:null
};


function money(n){

return "£"+
Number(n||0)
.toFixed(2)
.replace(/\.00$/,"");

}


function hoursText(x){

x=Math.max(
0,
Number(x||0)
);

let h=
Math.floor(x);

let m=
Math.round(
(x-h)*60
);

if(m===60){

h++;
m=0;

}

return h+"h "+m+"m";

}


function diffHours(a,b){

if(!a||!b)
return 0;

let [ah,am]=
a.split(":")
.map(Number);

let [bh,bm]=
b.split(":")
.map(Number);

return Math.max(
0,
(
(bh*60+bm)-
(ah*60+am)
)/60
);

}


function esc(s){

return String(s??"")
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


function iso(d=new Date()){

return new Date(
d.getTime()-
d.getTimezoneOffset()*60000
)
.toISOString()
.slice(0,10);

}


function dayName(d=new Date()){

return d.toLocaleDateString(
"en-GB",
{
weekday:"long"
}
);

}


function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}


function client(id){

return data.clients.find(
c=>c.id===id
);

}


function load(){

try{

let saved=
JSON.parse(
localStorage.getItem(
STORAGE_KEY
)||"null"
);

if(saved){

data={
...data,
...saved
};

}else{

for(
const k of OLD_KEYS
){

let old=
JSON.parse(
localStorage.getItem(k)||"null"
);

if(old){

data={
...data,
...old
};

break;

}

}

}

}catch(e){}


[
"clients",
"jobs",
"holidays",
"reminders"
]
.forEach(
k=>{
if(!Array.isArray(data[k]))
data[k]=[];
}
);


data.clients=
data.clients.filter(
c=>
String(c.name||"")
.toLowerCase()!=="gill"
);


for(
const c of defaultClients
){

if(
!data.clients.some(
x=>
String(x.name)
.toLowerCase()===
c.name.toLowerCase()
)
){

data.clients.push(
JSON.parse(
JSON.stringify(c)
)
);

}

}


save();

}


function holidayApplies(
id,
date
){

return data.holidays.some(
h=>
h.clientId===id&&
date>=h.from&&
date<=h.to
);

}


function clientWorksOnDate(
c,
date
){

if(
!c.day||
!c.start||
!c.end||
holidayApplies(
c.id,
iso(date)
)||
dayName(date)!==c.day||
c.frequency==="Occasional"
)
return false;


if(c.name==="Sindu"){

let a=
new Date(
"2026-09-25T00:00:00"
);

return(
date>=a&&
Math.floor(
(date-a)/86400000
)%14===0
);

}


if(c.name==="Joanna"){

let a=
new Date(
"2026-10-02T00:00:00"
);

return(
date>=a&&
Math.floor(
(date-a)/86400000
)%14===0
);

}


if(
c.frequency==="Fortnightly"||
c.frequency==="Every 2 weeks"
){

let a=
new Date(
"2026-09-25T00:00:00"
);

return(
Math.floor(
(date-a)/86400000
)%14===0
);

}


if(
c.frequency==="Every 3 weeks"
){

let a=
new Date(
"2026-09-25T00:00:00"
);

return(
Math.floor(
(date-a)/86400000
)%21===0
);

}


return true;

}


function recurringJobsForDate(date){

return data.clients
.filter(
c=>
clientWorksOnDate(
c,
date
)
)
.map(
c=>({

id:
"auto-"+
c.id+
"-"+
iso(date),

clientId:
c.id,

day:
c.day,

date:
iso(date),

start:
c.start,

end:
c.end,

hours:
diffHours(
c.start,
c.end
),

rate:
c.rate,

notes:
c.notes||"",

scheduled:true,

auto:true

})
);

}


function todayJobs(){

let d=
new Date();

return[
...recurringJobsForDate(d),

...data.jobs.filter(
j=>
j.date===iso(d)&&
j.auto!==true
)
];

}


function render(){

let jobs=
todayJobs();

let hours=
jobs.reduce(
(s,j)=>
s+
Number(j.hours||0),
0
);

let earned=
jobs.reduce(
(s,j)=>
s+
Number(j.hours||0)*
Number(
j.rate||
client(j.clientId)?.rate||
0
),
0
);


todayDate.textContent=
new Date()
.toLocaleDateString(
"en-GB",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

jobsCount.textContent=
jobs.length;

hoursCount.textContent=
hoursText(hours);

earnedCount.textContent=
money(earned);

freeCount.textContent=
hoursText(
Math.max(
0,
8-hours
)
);


let box=
document.getElementById(
"todaySchedule"
);


if(!jobs.length){

box.innerHTML=`

<div class="empty">

<div class="emptyIcon">
♡
</div>

<strong>
No cleaning jobs today 🌸
</strong>

<p>
Add one with the + button.
</p>

<button
class="primaryFull"
onclick="openJob()"
>
＋ Add cleaning job
</button>

</div>

`;

return;

}


box.innerHTML=
jobs
.map(
j=>{

let c=
client(j.clientId);

return`

<div class="listItem">

<div class="listTop">

<div>

<strong>
${esc(
c?.name||
"Client"
)}
</strong>

<div class="meta">

${j.start}–${j.end}

· ${hoursText(j.hours)}

· £${Number(
j.rate||
c?.rate||
0
)}/h

</div>

</div>

<button
class="editBtn"
onclick="openJob('${j.id}')"
>
Edit
</button>

</div>

</div>

`;

}
)
.join("");

}


function show(html){

sheet.innerHTML=
html;

overlay.classList.add(
"show"
);

}


function closeModal(){

overlay.classList.remove(
"show"
);

}


overlay.addEventListener(
"click",
e=>{

if(
e.target===overlay
)
closeModal();

});


function home(){

closeModal();

render();

}

function saveClient(){

let id=
clientId.value;

let name=
clientName.value.trim();

if(
!name||
name.toLowerCase()==="gill"
){

alert(
"Please enter a valid client name."
);

return;

}

let old=
client(id);

let c={

id:
id||
"client-"+Date.now(),

name,

type:
clientType.value,

rate:
Number(
clientRate.value||0
),

day:
clientDay.value,

frequency:
clientFrequency.value,

start:
clientStart.value,

end:
clientEnd.value,

week:"A",

variable:
old?.variable||
false,

phone:
clientPhone.value.trim(),

location:
clientLocation.value.trim(),

notes:
clientNotes.value.trim()

};


if(id){

data.clients=
data.clients.map(
x=>
x.id===id
?
c
:
x
);

}else{

data.clients.push(c);

}

save();

closeModal();

render();

}


function deleteClient(id){

if(
!confirm(
"Delete this client?"
)
)
return;

data.clients=
data.clients.filter(
c=>c.id!==id
);

data.jobs=
data.jobs.filter(
j=>j.clientId!==id
);

save();

openClients();

render();

}

/* TIMER */

function startNextTimer(){

let j=
todayJobs()[0];

if(j)
toggleTimer(j.id);
else
openJob();

}


function toggleTimer(id){

if(
data.timer?.jobId===id
)
return stopTimer();

let j=
data.jobs.find(
x=>x.id===id
);

if(!j){

let a=
todayJobs().find(
x=>x.id===id
);

if(a){

j={

...a,

id:
"logged-"+Date.now(),

auto:false,

date:iso()

};

data.jobs.push(j);

}

}

if(!j)
return;

data.timer={

jobId:
j.id,

startedAt:
Date.now(),

baseHours:
Number(j.hours||0)

};

save();

render();

}


function stopTimer(){

if(!data.timer)
return;

let j=
data.jobs.find(
x=>x.id===data.timer.jobId
);

if(j){

j.hours=
Number(
data.timer.baseHours||0
)
+
(
Date.now()-
data.timer.startedAt
)/3600000;

}

data.timer=null;

save();

render();

}


function updateTimer(){

let b=
document.getElementById(
"timerFloating"
);

if(!data.timer){

b.classList.remove(
"show"
);

return;

}

let j=
data.jobs.find(
x=>x.id===data.timer.jobId
);

if(!j){

data.timer=null;

save();

b.classList.remove(
"show"
);

return;

}

b.classList.add(
"show"
);

timerClient.textContent=
client(j.clientId)?.name||
"Timer";

let s=
Math.floor(
(
Date.now()-
data.timer.startedAt
)/1000
);

timerValue.textContent=

String(
Math.floor(s/3600)
)
.padStart(2,"0")

+

":"+

String(
Math.floor(
s%3600/60
)
)
.padStart(2,"0")

+

":"+

String(
s%60
)
.padStart(2,"0");

}

function getZoom(){

return Math.max(
80,
Math.min(
200,
Number(
localStorage.getItem(
"pure_shine_zoom"
)||100
)
)
);

}


function applyZoom(z){

z=
Math.max(
80,
Math.min(
200,
Number(z)||100
)
);

localStorage.setItem(
"pure_shine_zoom",
z
);

document.documentElement.style.setProperty(
"--zoom",
z/100
);

let x=
document.getElementById(
"zoomText"
);

if(x)
x.textContent=
z+"%";

}


load();

applyZoom(
getZoom()
);

render();

setInterval(
updateTimer,
1000
);
