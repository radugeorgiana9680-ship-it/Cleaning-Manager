    }

];

let stored =
    localStorage.getItem(STORAGE);

let data;

try{

    data =
        stored
        ? JSON.parse(stored)
        : {
            clients:defaultClients,
            jobs:[]
          };

}catch(e){

    data={
        clients:defaultClients,
        jobs:[]
    };

}

/*
   Remove Gill automatically from old data.
*/

data.clients =
    data.clients.filter(
        c =>
            c.name.toLowerCase()
            !== "gill"
    );

save();

/* =====================================================
   TIMER STATE
===================================================== */

let timerState;

try{

    timerState =
        JSON.parse(
            localStorage.getItem(
                "pureShineActiveTimer"
            )
        ) || {

            running:false,
            clientId:null,
            startedAt:null,
            accumulated:0

        };

}catch(e){

    timerState={

        running:false,
        clientId:null,
        startedAt:null,
        accumulated:0

    };

}

/* =====================================================
   SCREEN
===================================================== */

let screen="home";

let filter="All";

/* =====================================================
   SAVE
===================================================== */

function save(){

    localStorage.setItem(
        STORAGE,
        JSON.stringify(data)
    );

}

/* =====================================================
   DATE
===================================================== */

function today(){

    return new Date()
        .toISOString()
        .slice(0,10);

}

function currentDay(){

    return new Date()
        .toLocaleDateString(
            "en-GB",
            {weekday:"long"}
        );

}

function prettyDate(date){

    return new Date(
        date+"T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}

/* =====================================================
   TIME
===================================================== */

function timeMinutes(time){

    if(!time)
        return 0;

    const p =
        time.split(":")
        .map(Number);

    return p[0]*60+p[1];

}

function hoursBetween(start,end){

    const value =
        (
            timeMinutes(end) -
            timeMinutes(start)
        ) / 60;

    return Math.max(
        0,
        value
    );

}

function formatMoney(value){

    return "£"+
        Number(value||0)
        .toFixed(2);

}

/* =====================================================
   TIMER CALCULATION
===================================================== */

function timerSeconds(){

    if(!timerState.running){

        return Number(
            timerState.accumulated || 0
        );

    }

    return Number(
        timerState.accumulated || 0
    )
    +
    Math.floor(
        (
            Date.now() -
            timerState.startedAt
        ) / 1000
    );

}

function formatTimer(seconds){

    seconds=Math.max(
        0,
        Math.floor(seconds)
    );

    const h =
        Math.floor(
            seconds/3600
        );

    const m =
        Math.floor(
            (seconds%3600)/60
        );

    const s =
        seconds%60;

    return (

        String(h).padStart(2,"0")
        +":"+
        String(m).padStart(2,"0")
        +":"+
        String(s).padStart(2,"0")

    );

}

function timerHours(){

    return timerSeconds()/3600;

}

/* =====================================================
   HOME
===================================================== */

function home(){

    const schedule =
        todaySchedule();

    const completed =
        data.jobs.filter(
            j=>j.date===today()
        );

    const earned =
        completed.reduce(
            (sum,j)=>
                sum+
                Number(j.price||0),
            0
        );

    const hours =
        completed.reduce(
            (sum,j)=>
                sum+
                Number(j.hours||0),
            0
        );

    return `

        <h1 class="greeting">
            Good morning ✨
        </h1>

        <div class="date-text">
            ${
                new Date()
                .toLocaleDateString(
                    "en-GB",
                    {
                        weekday:"long",
                        day:"numeric",
                        month:"long"
                    }
                )
            }
        </div>

        <div class="dashboard">

            <div class="stat-card jobs">

                <div class="stat-icon">
                    🧹
                </div>

                <div class="stat-label">
                    Jobs
                </div>

                <div class="stat-value">
                    ${completed.length}
                </div>

            </div>

            <div class="stat-card hours">

                <div class="stat-icon">
                    ⏰
                </div>
