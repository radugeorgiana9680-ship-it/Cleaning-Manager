<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3c7d7">
<title>Pure Shine Cleaning Manager</title>
<style>
:root{--pink:#efc3d4;--pale:#fff0f5;--gold:#c5a15b;--ink:#493b47;--muted:#867986;--line:#f0e2e9;--lav:#eee7f8;--sage:#e3f0e6;--cream:#fff4df;--scale:1;--text-scale:1}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--text-scale));-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;max-width:100%;overflow-x:hidden;touch-action:pan-y}
body{zoom:var(--scale);margin:0;background:#fff9fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;overscroll-behavior-x:none}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
.app{max-width:850px;width:100%;margin:auto;padding:12px 13px calc(105px + env(safe-area-inset-bottom));overflow-x:clip}
header{display:flex;align-items:center;gap:11px;margin:5px 0 13px}
.profile{width:59px;height:59px;flex-shrink:0;position:relative;overflow:hidden;border-radius:19px;background:linear-gradient(135deg,var(--pink),var(--gold));display:grid;place-items:center;border:2px solid white}
.profile img{width:100%;height:100%;object-fit:cover}.profile .editphoto{position:absolute;right:3px;bottom:3px;border:0;border-radius:8px;background:#ffffffed;padding:3px 6px;font-size:.8rem}
.brand{flex:1;min-width:0}.brand h1{font:700 1.5rem Georgia,serif;margin:0}.brand small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.topbtn{width:45px;height:45px;border:0;border-radius:15px;background:white;color:#a45d7b;font-size:1.6rem}
.banner{height:145px;position:relative;overflow:hidden;border-radius:21px;margin-bottom:16px;background:linear-gradient(125deg,#f4cbd9,#f9e8ef 55%,#e9def6)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}.banner-edit{position:absolute;right:9px;top:9px;border:0;border-radius:11px;background:#ffffffdf;padding:8px 10px;font-size:.78rem;font-weight:750;color:#674d5d}.banner-empty{height:100%;display:grid;place-items:center;color:#b995a6;font-size:2.2rem}
h2{font:700 1.3rem Georgia,serif;margin:0}h3{font-size:1rem;margin:0 0 9px}p{line-height:1.5}.muted{font-size:.85rem;line-height:1.5;color:var(--muted)}
.hero{border-radius:23px;padding:19px;background:linear-gradient(125deg,#f7dce7,#f0e7fa 65%,#fff1dc);margin-bottom:13px}.hero h2{font-size:1.5rem;margin:7px 0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:21px 2px 10px}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:14px;margin:9px 0;box-shadow:0 5px 20px #75556808}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.stat{padding:14px;border-radius:18px;background:var(--pale);min-width:0}.stat:nth-child(2){background:var(--sage)}.stat:nth-child(3){background:var(--lav)}.stat:nth-child(4){background:var(--cream)}.stat span{font-size:.8rem;color:var(--muted);display:block}.stat strong{display:block;font-size:1.3rem;margin-top:5px;overflow-wrap:anywhere}
.btn{border:0;border-radius:14px;padding:11px 14px;background:var(--pink);color:#684456;font-weight:750}.btn.primary{background:linear-gradient(120deg,#eab5c9,#c5a15b);color:white}.btn.soft{background:#faeaf1}.btn.danger{background:#f9e0e2;color:#994958}.btn.small{padding:8px 10px;font-size:.8rem}.btn.wide{width:100%}.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.field{margin:11px 0}.field label{display:block;font-size:.85rem;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;min-width:0;border:1.5px solid #e8dce4;border-radius:13px;background:white;color:var(--ink);padding:12px;font-size:16px}.field textarea{min-height:75px;resize:vertical}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.itemtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.itemtop>div{min-width:0}.item strong{font-size:.95rem}.pill{display:inline-block;font-size:.72rem;font-weight:750;background:var(--lav);border-radius:9px;padding:4px 7px;margin:4px 3px 0 0}.pill.green{background:var(--sage)}.pill.gold{background:var(--cream)}.pill.pink{background:var(--pale)}
.empty{text-align:center;padding:20px 8px;color:var(--muted);font-size:.9rem}.notice{padding:12px;border-radius:13px;background:var(--cream);font-size:.8rem;line-height:1.5;margin:10px 0}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nav button{min-width:0;border:0;background:transparent;border-radius:13px;padding:7px 0;color:#887987;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button span{font-size:1.4rem}.nav button.active{background:#fff0f5;color:#a25276;font-weight:800}
.modalback{display:none;position:fixed;inset:0;z-index:60;background:#34263177;align-items:flex-end;justify-content:center}.modal{width:100%;max-width:700px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:#fffafd;border-radius:26px 26px 0 0;padding:17px 15px calc(22px + env(safe-area-inset-bottom))}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.close{border:0;border-radius:50%;width:39px;height:39px;background:#f8e7ef;color:#995675;font-size:1.5rem}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.settings-tile{min-height:112px;border:1px solid var(--line);border-radius:19px;padding:14px 12px;text-align:left;background:white;display:flex;flex-direction:column;justify-content:space-between;gap:7px;color:var(--ink)}.settings-tile .tile-icon{font-size:1.7rem}.settings-tile strong{font-size:.9rem;line-height:1.35}.settings-tile small{font-size:.78rem;color:var(--muted);line-height:1.4}.settings-tile.pink{background:#fff0f5}.settings-tile.gold{background:#fff5df}.settings-tile.lavender{background:#f3effb}.settings-tile.green{background:#edf6ef}
.settings-preview{border-radius:18px;background:linear-gradient(130deg,#f7dce7,#fff1db);padding:16px;margin-bottom:14px}.settings-preview strong{font:700 1.3rem Georgia,serif}.settings-preview p{font-size:.85rem;margin:6px 0 0;color:#756274}
.settings-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.row-icon{width:41px;height:41px;flex-shrink:0;border-radius:14px;background:#fff0f5;display:grid;place-items:center;font-size:1.3rem}.row-copy{flex:1;min-width:0}.row-copy strong{display:block;font-size:.9rem}.row-copy small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px;line-height:1.4}.settings-savebar{position:sticky;bottom:-18px;background:#fffafd;padding:12px 0 max(8px,env(safe-area-inset-bottom));margin-top:12px}
#toast{display:none;position:fixed;z-index:100;left:14px;right:14px;bottom:94px;padding:13px 16px;border-radius:14px;background:#51414f;color:white;font-size:.9rem;box-shadow:0 5px 25px #0002}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{max-width:850px;left:50%;right:auto;transform:translateX(-50%);width:100%;border-radius:18px 18px 0 0}.modalback{align-items:center;padding:20px}.modal{border-radius:25px;max-height:88dvh}}
@media(max-width:360px){.banner{height:115px}.profile{width:52px;height:52px}.brand h1{font-size:1.3rem}.app{padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<main class="app">
<header><div class="profile" id="profileBox"><span>✨</span></div><div class="brand"><h1 id="brandTitle">Pure Shine Cleaning</h1><small>Cleaning Manager · Business planner</small></div><button class="topbtn" onclick="addMenu()" aria-label="Adaugă">＋</button></header>
<div class="banner" id="bannerBox"><div class="banner-empty">✨</div><button class="banner-edit" onclick="document.getElementById('bannerFile').click()">📷 Adaugă banner</button></div>
<input id="profileFile" type="file" accept="image/*" hidden onchange="saveImage(event,'profile')"><input id="bannerFile" type="file" accept="image/*" hidden onchange="saveImage(event,'banner')">
<div id="view"><div class="card" style="text-align:center">Se încarcă aplicația…</div></div></main>
<nav class="nav"><button data-page="home" onclick="go('home')"><span>⌂</span>Acasă</button><button data-page="schedule" onclick="go('schedule')"><span>▦</span>Calendar</button><button data-page="clients" onclick="go('clients')"><span>♙</span>Clienți</button><button data-page="money" onclick="go('money')"><span>£</span>Financiar</button><button data-page="more" onclick="go('more')"><span>☷</span>Mai mult</button></nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div><div id="toast"></div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importBackup(event)">
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='pureShineManager_v8';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now()+Math.floor(Math.random()*9999);
