<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7c5d8">
<title>Pure Shine Cleaning Manager</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --pink:#e85f91;
  --pink-dark:#a52b61;
  --pink-light:#fff1f6;
  --gold:#d8ae52;
  --gold-light:#f4df9d;
  --text:#54243b;
  --muted:#75596a;
  --white:#fff;
  --shadow:0 10px 30px rgba(126,44,79,.14);
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:#fff5f8;
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   WELCOME PAGE
========================= */

#welcomePage{
  min-height:100dvh;
  width:100%;
  display:flex;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 15%,#fff 0,transparent 28%),
    radial-gradient(circle at 90% 80%,#fff 0,transparent 30%),
    linear-gradient(145deg,#fff9fb,#ffdce9 48%,#fff0f6);
  overflow:hidden;
}

.welcome{
  width:min(100%,620px);
  min-height:100dvh;
  padding:55px 28px 35px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  justify-content:center;
}

.profile-wrap{
  position:relative;
  width:190px;
  height:190px;
  margin-bottom:28px;
}

.profile{
  width:190px;
  height:190px;
  border-radius:50%;
  object-fit:cover;
  border:7px solid white;
  outline:4px solid var(--gold);
  background:linear-gradient(135deg,#e8bd55,#fff0a8,#c88918);
  box-shadow:0 12px 35px rgba(150,95,20,.22);
}

.profile-edit{
  position:absolute;
  right:-3px;
  bottom:3px;
  width:54px;
  height:54px;
  border-radius:50%;
  border:4px solid white;
  background:var(--pink);
  color:white;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow);
}

#welcomeTitle{
  margin:0;
  max-width:590px;
  font-family:"Brush Script MT","Segoe Script",cursive;
  font-size:clamp(52px,12vw,82px);
  line-height:.92;
  color:#a92d62;
  text-shadow:0 2px 0 #fff;
}

.welcome-heart{
  color:var(--gold);
  font-size:34px;
  margin:16px 0;
}

.welcome-text{
  max-width:540px;
  font-size:22px;
  line-height:1.4;
  margin:0 0 30px;
  color:#684e5e;
}

.feature-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:25px;
}

.feature{
  min-height:145px;
  border:2px solid #dfbd70;
  border-radius:22px;
  background:rgba(255,255,255,.88);
  padding:15px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 7px 18px rgba(117,42,77,.08);
}

.feature-icon{
  font-size:38px;
}

.feature strong{
  font-size:18px;
  line-height:1.1;
}

.get-started{
  width:100%;
  min-height:70px;
  border:3px solid var(--gold);
  border-radius:40px;
  background:linear-gradient(180deg,#ed75a0,#dd4f87);
  color:white;
  font-family:Georgia,serif;
  font-size:31px;
  box-shadow:0 12px 25px rgba(214,72,125,.22);
  transition:.15s;
}

.get-started:active{
  transform:scale(.98);
}

.login{
  margin-top:18px;
  font-size:18px;
}

.login button{
  border:0;
  background:none;
  color:var(--pink-dark);
  text-decoration:underline;
  font-weight:700;
}

/* =========================
   APP
========================= */

  min-height:100dvh;
  background:#fff7fa;
  display:none;
}

.app-shell{

  max-width:720px;
  min-height:100dvh;
  margin:auto;
