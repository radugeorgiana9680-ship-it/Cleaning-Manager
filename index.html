<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7d5e3">

<title>Pure Shine Cleaning Manager</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#fff7fa;
    color:#292331;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:560px;
    margin:auto;
    padding:0 14px 115px;
}

/* ================= HEADER ================= */

.topHeader{
    margin:0 -14px;
    padding:24px 18px 18px;
    background:
        linear-gradient(180deg,#fff0f5 0%,#ffe8f0 100%);
    border-radius:0 0 30px 30px;
    position:relative;
    overflow:hidden;
}

.topHeader:before{
    content:"✦";
    position:absolute;
    top:35px;
    right:112px;
    color:#d7a043;
    font-size:25px;
}

.topHeader:after{
    content:"✦";
    position:absolute;
    top:78px;
    right:45px;
    color:#d7a043;
    font-size:19px;
}

.brandArea{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.brandLeft{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoCircle{
    width:74px;
    height:74px;
    border-radius:50%;
    border:2px solid #c9973e;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:0 5px 18px rgba(180,120,60,.12);
}

.logoCircle span{
    font-size:36px;
}

.brandText{
    position:relative;
    z-index:2;
}

.brandScript{
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:38px;
    line-height:.9;
    color:#9a6b20;
    white-space:nowrap;
}

.brandMain{
    font-size:17px;
    font-weight:800;
    letter-spacing:4px;
    color:#dc6f98;
    margin-top:6px;
}

.brandSub{
    color:#c77796;
    font-size:13px;
    letter-spacing:1px;
    margin-top:5px;
}

.settingsBtn{
    width:54px;
    height:54px;
    border:0;
    border-radius:19px;
    background:rgba(255,255,255,.9);
    color:#d65e88;
    font-size:26px;
    box-shadow:0 7px 20px rgba(130,70,100,.12);
    z-index:3;
}

/* ================= TODAY ================= */

.todayCard{
    margin-top:15px;
    padding:19px 18px;
    border-radius:25px;
    background:linear-gradient(135deg,#ffd7e6,#ffdce9);
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 8px 25px rgba(130,70,100,.08);
    overflow:hidden;
}

.todayLeft{
    display:flex;
    align-items:center;
    gap:13px;
}

.todayIcon{
    width:52px;
    height:52px;
    border-radius:17px;
    background:#f6a8c7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    color:white;
}

.todayTitle{
    font-size:25px;
    font-weight:800;
}

.todayDate{
    color:#7c6070;
    font-size:15px;
    margin-top:3px;
}

.todayQuote{
    text-align:right;
    font-family:"Brush Script MT","Segoe Script",cursive;
    color:#d24f83;
    font-size:27px;
    line-height:.95;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:14px;
}

.stat{
    min-height:137px;
    border-radius:23px;
    padding:14px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.statIcon{
    font-size:28px;
    margin-bottom:8px;
}

.statNumber{
    font-size:23px;
    font-weight:850;
    line-height:1;
}

.statLabel{
    margin-top:8px;
    font-size:12px;
}

.statPink{
    background:#ffe1ed;
    color:#b72d69;
}

.statBlue{
    background:#dff3ff;
    color:#237da9;
}

.statGreen{
    background:#def5e5;
    color:#23814f;
}

.statYellow{
    background:#fff0bd;
    color:#8c6717;
}

/* ================= SECTION ================= */

.sectionHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:22px 4px 10px;
}

.sectionTitle{
    font-size:21px;
    font-weight:850;
}

.sectionTitle span{
    color:#e27da1;
}

.seeAll{
    border:0;
    background:transparent;
    color:#e05d91;
    font-weight:750;
    font-size:14px;
}

/* ================= SCHEDULE ================= */

.scheduleCard{
    background:rgba(255,255,255,.9);
    border-radius:26px;
    padding:10px;
    box-shadow:0 7px 25px rgba(100,55,80,.08);
}

.clientJob{
    min-height:108px;
    border-radius:22px;
    margin:7px 0;
    padding:13px 12px;
    display:grid;
    grid-template-columns:54px 1fr auto;
    gap:10px;
    align-items:center;
}

.clientJobPink{
    background:#ffe4ee;
}

.clientJobBlue{
    background:#dff3fc;
}

.clientJobGreen{
    background:#e1f5e8;
}

.clientAvatar{
    width:54px;
    height:54px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:850;
}

.avatarPink{
    background:#f7b1cf;
    color:#ad3270;
}

.avatarBlue{
    background:#bce5f8;
    color:#147daf;
}

.avatarGreen{
    background:#bce9ce;
    color:#269060;
}

.clientName{
    font-size:20px;
    font-weight:850;
}

.clientType{
    display:inline-block;
    margin-left:5px;
    padding:5px 10px;
    border-radius:12px;
    font-size:11px;
    font-weight:750;
}

.private{
    background:#f9d0e1;
    color:#bd3f76;
}

.agency{
    background:#bfe5f8;
    color:#2078a5;
}

.clientDetails{
    color:#53606c;
    font-size:14px;
    margin-top:7px;
    line-height:1.45;
}

.clientDetails div{
    margin-top:2px;
}

.jobPrice{
    text-align:right;
    min-width:70px;
}

.jobPrice strong{
    font-size:20px;
    display:block;
}

.jobRate{
    font-size:12px;
    color:#66717a;
    margin-top:4px;
}

.startBtn{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#e66d9b;
    color:white;
    font-size:20px;
    margin-top:8px;
    box-shadow:0 5px 12px rgba(210,80,130,.22);
}

/* ================= QUICK ACTIONS ================= */

.quickTitle{
    font-size:21px;
    font-weight:850;
    margin:22px 4px 10px;
}

.quickGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.quickButton{
    min-height:95px;
    border:0;
    border-radius:21px;
    padding:12px 7px;
    font-weight:750;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    flex-direction:column;
    box-shadow:0 5px 16px rgba(70,50,70,.05);
}

.quickButton span{
    font-size:26px;
}

.quickPink{
    background:#ffdcea;
    color:#b8326b;
}

.quickGreen{
    background:#dff5e7;
    color:#267e51;
}

.quickPurple{
    background:#e8ddff;
    color:#6546a3;
}

.quickYellow{
    background:#fff0bd;
    color:#876417;
}

.quickBlue{
    background:#dff2fc;
    color:#2679a3;
}

.quickRose{
    background:#ffe0ed;
    color:#bb4775;
}

/* ================= BANNER ================= */

.cleanBanner{
    margin-top:15px;
    min-height:140px;
    border-radius:25px;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 80%,rgba(240,120,165,.22),transparent 25%),
        linear-gradient(135deg,#fff2f6,#fff9f2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    box-shadow:0 7px 25px rgba(100,55,80,.06);
}

.bannerItems{
    font-size:47px;
    letter-spacing:-10px;
    white-space:nowrap;
}

.bannerText{
    text-align:center;
    font-family:"Brush Script MT","Segoe Script",cursive;
    color:#d84e87;
    font-size:30px;
    line-height:.95;
}

.bannerStars{
    color:#d69d3b;
    font-size:18px;
}

/* ================= BOTTOM NAV ================= */

.bottomNav{
    position:fixed;
    z-index:50;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:min(535px,calc(100% - 20px));
    padding:8px;
    border-radius:28px;
    background:rgba(255,255,255,.96);
    border:1px solid #f0dfe7;
    box-shadow:0 10px 35px rgba(70,40,60,.15);
    backdrop-filter:blur(15px);
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.navBtn{
    border:0;
    background:transparent;
    border-radius:20px;
    padding:9px 3px 7px;
    color:#6d6871;
    font-size:11px;
}

.navBtn span{
    display:block;
    font-size:24px;
    margin-bottom:3px;
}

.navBtn.active{
    background:#ffe1ed;
    color:#dc5c8e;
    font-weight:800;
}

/* ================= MODAL ================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(35,22,32,.43);
    display:none;
    align-items:flex-end;
}

.overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:560px;
    max-height:92vh;
    overflow:auto;
    margin:auto;
    background:#fffafd;
    border-radius:30px 30px 0 0;
    padding:22px 18px calc(25px + env(safe-area-inset-bottom));
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modalHeader h2{
    margin:0;
    font-size:23px;
}

.closeBtn{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:#f8e7ef;
    color:#bd6387;
    font-size:26px;
}

.formLabel{
    display:block;
    margin:13px 0 7px;
    font-weight:750;
    color:#4e4550;
}

.formInput,
.formSelect{
    width:100%;
    border:2px solid #eadde5;
    border-radius:16px;
    padding:14px;
    background:white;
    color:#312b34;
    outline:none;
}

.formInput:focus,
.formSelect:focus{
    border-color:#e5a0bb;
}

.formRow{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.saveBtn{
    width:100%;
    border:0;
    border-radius:18px;
    padding:16px;
    margin-top:18px;
    background:linear-gradient(135deg,#ed9ebc,#d9789e);
    color:white;
    font-weight:850;
    box-shadow:0 8px 20px rgba(215,120,158,.25);
}

.deleteBtn{
    width:100%;
    border:0;
    border-radius:18px;
    padding:14px;
    margin-top:9px;
    background:#ffe7ed;
    color:#c2486f;
    font-weight:750;
}

/* ================= CLIENTS ================= */

.clientList{
    margin-top:10px;
}

.clientListItem{
    background:white;
    border:1px solid #f0e1e8;
    border-radius:20px;
    padding:14px;
    margin:8px 0;
    display:flex;
    align-items:center;
    gap:12px;
}

.clientListAvatar{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:850;
    background:#ffe0ec;
    color:#bd4e79;
    flex-shrink:0;
}

.clientListInfo{
    flex:1;
}

.clientListName{
    font-size:17px;
    font-weight:800;
}

.clientListMeta{
    font-size:12px;
    color:#807680;
    margin-top:4px;
}

.editClientBtn{
    border:0;
    border-radius:13px;
    padding:9px 11px;
    background:#f7e8ef;
    color:#bb6485;
    font-weight:750;
}

/* ================= EMPTY ================= */

.empty{
    padding:28px 10px;
    text-align:center;
    color:#817680;
}

.emptyIcon{
    font-size:40px;
    margin-bottom:8px;
}

.addClientBtn{
    width:100%;
    border:0;
    border-radius:18px;
    padding:15px;
    background:#f3aac6;
    color:white;
    font-weight:800;
    margin-bottom:8px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:420px){

    .app{
        padding-left:10px;
        padding-right:10px;
    }

    .topHeader{
        margin-left:-10px;
        margin-right:-10px;
    }

    .brandScript{
        font-size:31px;
    }

    .brandMain{
        font-size:14px;
        letter-spacing:3px;
    }

    .logoCircle{
        width:64px;
        height:64px;
    }

    .settingsBtn{
        width:48px;
        height:48px;
    }

    .todayQuote{
        font-size:22px;
    }

    .stats{
        gap:6px;
    }

    .stat{
        min-height:125px;
    }

    .statNumber{
        font-size:20px;
    }

    .statLabel{
        font-size:10px;
    }

    .clientJob{
        grid-template-columns:48px 1fr auto;
        padding:11px 9px;
    }

    .clientAvatar{
        width:48px;
        height:48px;
    }

    .clientName{
        font-size:17px;
    }

    .clientDetails{
        font-size:12px;
    }

    .jobPrice strong{
        font-size:17px;
    }

    .startBtn{
        width:43px;
        height:43px;
    }

    .quickButton{
        min-height:88px;
        font-size:12px;
    }

    .quickButton span{
        font-size:23px;
    }

    .bannerText{
        font-size:24px;
    }

    .bannerItems{
        font-size:36px;
    }
}

@media(max-width:350px){

    .todayQuote{
        display:none;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        min-height:105px;
    }

    .quickGrid{
        grid-template-columns:repeat(2,1fr);
    }

    .clientJob{
        grid-template-columns:45px 1fr;
    }

    .jobPrice{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="topHeader">

        <div class="brandArea">

            <div class="brandLeft">

                <div class="logoCircle">
                    <span>🏠</span>
                </div>

                <div class="brandText">
                    <div class="brandScript">Pure Shine</div>
                    <div class="brandMain">CLEANING</div>
                    <div class="brandSub">Cleaning Manager</div>
                </div>

            </div>

            <button class="settingsBtn" onclick="openSettings()">⚙️</button>

        </div>

    </header>


    <!-- TODAY -->
    <section class="todayCard">

        <div class="todayLeft">

            <div class="todayIcon">📅</div>

            <div>
                <div class="todayTitle">Today</div>
                <div class="todayDate" id="todayDate"></div>
            </div>

        </div>

        <div class="todayQuote">
            A clean space<br>
            is a happy place ♡
        </div>

    </section>


    <!-- STATS -->
    <section class="stats">

        <div class="stat statPink">
            <div class="statIcon">🧹</div>
            <div class="statNumber" id="jobsToday">0</div>
            <div class="statLabel">Jobs today</div>
        </div>

        <div class="stat statBlue">
            <div class="statIcon">◷</div>
            <div class="statNumber" id="hoursToday">0h</div>
            <div class="statLabel">Hours today</div>
        </div>

        <div class="stat statGreen">
            <div class="statIcon">🪙</div>
            <div class="statNumber" id="earningsToday">£0</div>
            <div class="statLabel">Today's earnings</div>
        </div>

        <div class="stat statYellow">
            <div class="statIcon">▣</div>
            <div class="statNumber" id="freeToday">8h</div>
            <div class="statLabel">Free time</div>
        </div>

    </section>


    <!-- SCHEDULE -->
    <div class="sectionHeader">

        <div class="sectionTitle">
            📅 Today's schedule
        </div>

        <button class="seeAll" onclick="openSchedule()">
            See all ›
        </button>

    </div>


    <section class="scheduleCard" id="scheduleList"></section>


    <!-- QUICK ACTIONS -->
    <div class="quickTitle">
        ✨ Quick actions
    </div>

    <section class="quickGrid">

        <button class="quickButton quickPink" onclick="openAddJob()">
            <span>🗓️</span>
            Add cleaning job
        </button>

        <button class="quickButton quickGreen" onclick="openClients()">
            <span>👥</span>
            Clients
        </button>

        <button class="quickButton quickPurple" onclick="openTimer()">
            <span>◷</span>
            Start timer
        </button>

        <button class="quickButton quickYellow" onclick="openSchedule()">
            <span>▣</span>
            Schedule
        </button>

        <button class="quickButton quickBlue" onclick="openEarnings()">
            <span>▥</span>
            Earnings
        </button>

        <button class="quickButton quickRose" onclick="openSettings()">
            <span>⚙️</span>
            Settings
        </button>

    </section>


    <!-- BANNER -->
    <section class="cleanBanner">

        <div class="bannerItems">
            🧴🧹🌸
        </div>

        <div>
            <div class="bannerStars">✦ ✨ ✦</div>
            <div class="bannerText">
                Cleaning homes<br>
                creating happier days ♡
            </div>
        </div>

    </section>

</div>


<!-- BOTTOM NAV -->
<nav class="bottomNav">

    <button class="navBtn active" onclick="goHome(this)">
        <span>⌂</span>
        Home
    </button>

    <button class="navBtn" onclick="openSchedule(this)">
        <span>▣</span>
        Schedule
    </button>

    <button class="navBtn" onclick="openClients(this)">
        <span>♧</span>
        Clients
    </button>

    <button class="navBtn" onclick="openTimer(this)">
        <span>◷</span>
        Timer
    </button>

    <button class="navBtn" onclick="openEarnings(this)">
        <span>▥</span>
        Earnings
    </button>

</nav>


<!-- MODAL -->
<div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
</div>


<script>

/* =========================================================
   PURE SHINE CLEANING MANAGER
   CLIENT DETAILS ARE EDITABLE
   NO LOCATION IS PRE-FILLED
========================================================= */

const STORAGE_KEY = "pure_shine_cleaning_manager_v10";


const defaultClients = [

    {
        id:1,
        name:"Lottie",
        type:"Private",
        rate:18,
        day:"Monday",
        start:"09:00",
        end:"12:00",
        location:"",
        notes:""
    },

    {
        id:2,
        name:"Matt",
        type:"Agency",
        rate:16,
        day:"Tuesday",
        start:"13:00",
        end:"15:00",
        location:"",
        notes:""
    },

    {
        id:3,
        name:"Christine",
        type:"Private",
        rate:18,
        day:"Tuesday",
        start:"16:00",
        end:"17:30",
        location:"",
        notes:""
    }

];


let savedData;

try{
    savedData = JSON.parse(localStorage.getItem(STORAGE_KEY));
}catch(e){
    savedData = null;
}


let clients = savedData?.clients || defaultClients;

let jobs = savedData?.jobs || [];

let timerInterval = null;
let timerStarted = null;
let timerClient = null;


/* =========================================================
   SAVE
========================================================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            clients,
            jobs
        })
    );

}


/* =========================================================
   DATE
========================================================= */

function todayName(){

    return new Date().toLocaleDateString(
        "en-GB",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    );

}


document.getElementById("todayDate").textContent = todayName();


/* =========================================================
   HELPERS
========================================================= */

function minutes(time){

    const [h,m] = time.split(":").map(Number);

    return h * 60 + m;

}


function hoursBetween(start,end){

    return Math.max(
        0,
        (minutes(end)-minutes(start))/60
    );

}


function money(value){

    return "£" + Number(value).toFixed(2).replace(".00","");

}


function getTodayName(){

    return new Date().toLocaleDateString(
        "en-GB",
        {weekday:"long"}
    );

}


function getInitial(name){

    return name
        ? name.trim().charAt(0).toUpperCase()
        : "?";

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

    const today = getTodayName();

    const todayClients = clients
        .filter(client => client.day === today)
        .sort(
            (a,b) =>
                minutes(a.start)-minutes(b.start)
        );


    let totalHours = 0;
    let totalEarnings = 0;


    todayClients.forEach(client => {

        const h = hoursBetween(
            client.start,
            client.end
        );

        totalHours += h;

        totalEarnings += h * Number(client.rate);

    });


    document.getElementById("jobsToday")
        .textContent = todayClients.length;


    document.getElementById("hoursToday")
        .textContent =
        totalHours % 1 === 0
        ? totalHours + "h"
        : totalHours.toFixed(1) + "h";


    document.getElementById("earningsToday")
        .textContent = money(totalEarnings);


    const free = Math.max(
        0,
        8-totalHours
    );


    document.getElementById("freeToday")
        .textContent =
        free % 1 === 0
        ? free + "h"
        : free.toFixed(1) + "h";


    const list = document.getElementById("scheduleList");


    if(!todayClients.length){

        list.innerHTML = `
            <div class="empty">

                <div class="emptyIcon">🧺💗</div>

                <strong>No cleaning jobs today</strong>

                <div>Add a client or cleaning job.</div>

            </div>
        `;

        return;

    }


    list.innerHTML = todayClients.map(
        (client,index) => {

            const h = hoursBetween(
                client.start,
                client.end
            );

            const total = h * Number(client.rate);

            const colors = [
                "clientJobPink",
                "clientJobBlue",
                "clientJobGreen"
            ];

            const avatars = [
                "avatarPink",
                "avatarBlue",
                "avatarGreen"
            ];


            return `

                <div class="clientJob ${colors[index % 3]}">

                    <div class="clientAvatar ${avatars[index % 3]}">
                        ${getInitial(client.name)}
                    </div>


                    <div>

                        <div class="clientName">

                            ${escapeHTML(client.name)}

                            <span class="clientType ${
                                client.type.toLowerCase() === "private"
                                ? "private"
                                : "agency"
                            }">

                                ${escapeHTML(client.type)}

                            </span>

                        </div>


                        <div class="clientDetails">

                            <div>
                                ◷ ${client.start} – ${client.end}
                                (${h}h)
                            </div>

                            ${
                                client.location
                                ?
                                `<div>⌖ ${escapeHTML(client.location)}</div>`
                                :
                                `<div>⌖ Location not added</div>`
                            }

                        </div>

                    </div>


                    <div class="jobPrice">

                        <strong>
                            ${money(total)}
                        </strong>

                        <div class="jobRate">
                            £${Number(client.rate).toFixed(0)}/h
                        </div>

                        <button
                            class="startBtn"
                            onclick="startClientTimer(${client.id})"
                        >
                            ▶
                        </button>

                    </div>

                </div>

            `;

        }
    ).join("");

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   MODAL
========================================================= */

function showModal(html){

    document.getElementById("modal").innerHTML = html;

    document
        .getElementById("overlay")
        .classList.add("show");

}


function closeModal(){

    document
        .getElementById("overlay")
        .classList.remove("show");

}


document
    .getElementById("overlay")
    .addEventListener("click",function(e){

        if(e.target === this){

            closeModal();

        }

    });

/* =========================================================
   SAVE CLIENT
========================================================= */

function saveClient(id){

    const name =
        document.getElementById("clientName")
            .value.trim();

    const type =
        document.getElementById("clientType")
            .value;

    const rate =
        Number(
            document.getElementById("clientRate")
                .value
        );

    const day =
        document.getElementById("clientDay")
            .value;

    const start =
        document.getElementById("clientStart")
            .value;

    const end =
        document.getElementById("clientEnd")
            .value;

    const location =
        document.getElementById("clientLocation")
            .value.trim();

    const notes =
        document.getElementById("clientNotes")
            .value.trim();


    if(!name){

        alert("Please enter the client's name.");

        return;

    }


    if(!start || !end){

        alert("Please enter the cleaning times.");

        return;

    }


    if(end <= start){

        alert("End time must be after start time.");

        return;

    }


    const clientData = {

        id: id || Date.now(),

        name,

        type,

        rate,

        day,

        start,

        end,

        location,

        notes

    };


    if(id){

        const index =
            clients.findIndex(c => c.id === id);

        if(index !== -1){

            clients[index] = clientData;

        }

    }else{

        clients.push(clientData);

    }


    saveData();

    closeModal();

    renderDashboard();

}


/* =========================================================
   DELETE CLIENT
========================================================= */

function deleteClient(id){

    if(!confirm("Delete this client?")){

        return;

    }


    clients =
        clients.filter(c => c.id !== id);


    saveData();

    openClients();

    renderDashboard();

}

/* =========================================================
   SAVE JOB
========================================================= */

function saveJob(){

    const clientId =
        Number(
            document.getElementById("jobClient").value
        );

    const date =
        document.getElementById("jobDate").value;

    const start =
        document.getElementById("jobStart").value;

    const end =
        document.getElementById("jobEnd").value;

    const notes =
        document.getElementById("jobNotes").value.trim();


    if(!date || !start || !end){

        alert("Please complete the date and times.");

        return;

    }


    if(end <= start){

        alert("End time must be after start time.");

        return;

    }


    const client =
        clients.find(c => c.id === clientId);


    jobs.push({

        id:Date.now(),

        clientId,

        date,

        start,

        end,

        notes,

        price:
            hoursBetween(start,end)
            *
            Number(client.rate)

    });


    saveData();

    closeModal();

    renderDashboard();

}

function startClientTimer(id){

    openTimer();

    setTimeout(() => {

        const select =
            document.getElementById(
                "timerClientSelect"
            );

        if(select){

            select.value = String(id);

        }

    },30);

}


function toggleTimer(){

    const button =
        document.getElementById("timerButton");

    const clock =
        document.getElementById("timerClock");


    if(timerInterval){

        clearInterval(timerInterval);

        timerInterval = null;

        button.textContent = "Start timer";

        return;

    }


    timerClient =
        document.getElementById(
            "timerClientSelect"
        ).value;


    timerStarted = Date.now();


    button.textContent = "Stop timer";


    timerInterval =
        setInterval(() => {

            const seconds =
                Math.floor(
                    (Date.now()-timerStarted)/1000
                );


            const h =
                Math.floor(seconds/3600);

            const m =
                Math.floor(
                    (seconds%3600)/60
                );

            const s =
                seconds%60;


            clock.textContent =
                [
                    h,
                    m,
                    s
                ]
                .map(
                    n =>
                    String(n).padStart(2,"0")
                )
                .join(":");


        },1000);

}
