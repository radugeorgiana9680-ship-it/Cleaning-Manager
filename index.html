<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7dce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon(2).png">
<title>Pure Shine Cleaning Manager</title>

<style>
:root{
 --pink:#e97eaa;
 --pink-soft:#f7d3e2;
 --purple:#e2d8f7;
 --blue:#dbeafb;
 --green:#dcefe4;
 --yellow:#fff0c8;
 --peach:#f8ddd5;
 --ink:#292631;
 --muted:#817985;
 --zoom:1;
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 margin:0;
 width:100%;
 min-height:100%;
 background:#fffafd;
 color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
 -webkit-text-size-adjust:100%;
 overflow-x:hidden;
}

body:before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-2;
 background:
   linear-gradient(rgba(255,250,253,.94),rgba(255,250,253,.97)),
   url("pure-shine-cleaning-background(1).png") center top/cover no-repeat;
}

button,input,select,textarea{
 font:inherit;
}

button{
 border:0;
 touch-action:manipulation;
}

button:active{
 transform:scale(.98);
}

#app{
 width:100vw;
 min-height:100vh;
 padding-bottom:96px;
 overflow-x:hidden;
}

.header{
 width:100%;
 min-height:108px;
 padding:16px 22px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:rgba(255,255,255,.98);
 border-bottom:1px solid #eee5eb;
}

.brand{
 display:flex;
 align-items:center;
 gap:13px;
 min-width:0;
}

.logo{
 width:68px;
 height:68px;
 flex:0 0 68px;
 border-radius:21px;
 object-fit:cover;
 box-shadow:0 7px 20px #b45a8228;
}

.brand-title{
 font-size:25px;
 font-weight:900;
 letter-spacing:-.5px;
}

.brand-subtitle{
 margin-top:4px;
 color:#8b8290;
 font-size:14px;
}

.settings-btn{
 width:56px;
 height:56px;
 border-radius:50%;
 background:#fff;
 box-shadow:0 7px 24px #50374b16;
 font-size:27px;
 color:#706976;
}

.content{
 width:100%;
 padding:20px 24px 30px;
}

.date-card{
 width:100%;
 min-height:104px;
 padding:19px 24px;
 border-radius:28px;
 background:#f5cfe0;
 display:flex;
 align-items:center;
 justify-content:space-between;
 box-shadow:0 7px 22px #70455b0d;
}

.date-main{
 font-size:23px;
 font-weight:900;
 letter-spacing:-.4px;
}

.date-sub{
 margin-top:7px;
 color:#7f747e;
 font-size:15px;
}

.sparkles{
 color:#d45d8c;
 font-size:22px;
 letter-spacing:4px;
}

.quote-banner{
 position:relative;
 width:100%;
 height:166px;
 margin:18px 0 20px;
 border-radius:27px;
 overflow:hidden;

 background-image:
   linear-gradient(rgba(255,207,226,.45),rgba(255,207,226,.50)),
   url("6C0E0B5E-6D80-4C4B-A0D8-095D803624EE.jpeg");

 background-size:
   100% 100%,
   100% 200%;

 background-position:
   center,
   center bottom;

 background-repeat:no-repeat;

 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;

 box-shadow:0 8px 25px #70455b10;
}

.quote-banner:before{
 content:"✦  ✧  ✦";
 position:absolute;
 top:15px;
 left:24px;
 color:white;
 font-size:20px;
 letter-spacing:7px;
}

.quote-banner:after{
 content:"✧  ✦";
 position:absolute;
 right:24px;
 bottom:17px;
 color:white;
 font-size:19px;
 letter-spacing:7px;
}

.quote-text{
 position:relative;
 z-index:2;
 padding:10px 34px;
 font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;
 font-size:31px;
 line-height:1.08;
 color:#a74370;
 text-shadow:0 1px 5px #fff8;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.stat{
 min-height:138px;
 border-radius:26px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 box-shadow:0 7px 22px #50374b0b;
}

.stat:nth-child(1){
 background:var(--pink-soft);
}

.stat:nth-child(2){
 background:var(--blue);
}

.stat:nth-child(3){
 background:var(--green);
}

.stat:nth-child(4){
 background:var(--yellow);
}

.stat-icon{
 font-size:25px;
 margin-bottom:6px;
}

.stat-value{
 font-size:25px;
 font-weight:900;
}

.stat-label{
 margin-top:5px;
 font-size:13px;
}

.section{
 margin-top:28px;
}

.section-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:13px;
}

.section-title{
 margin:0;
 font-size:24px;
 font-weight:900;
}

.see-all{
 background:none;
 color:#b44f79;
 font-weight:900;
 font-size:15px;
}

.schedule-box{
 background:#fff;
 border-radius:27px;
 padding:14px;
 box-shadow:0 8px 28px #50374b12;
}

.empty{
 text-align:center;
 padding:37px 15px;
 color:#817985;
}

.empty-icon{
 font-size:52px;
 color:#df5d96;
 margin-bottom:7px;
}

.empty strong{
 display:block;
 font-size:18px;
 color:#302d36;
}

.empty p{
 margin:6px 0 18px;
}

.primary{
 width:100%;
 height:54px;
 border-radius:28px;
 background:linear-gradient(135deg,#eb83ae,#d94788);
 color:#fff;
 font-weight:900;
 font-size:17px;
 box-shadow:0 9px 23px #d9478830;
}

.job{
 display:grid;
 grid-template-columns:8px 1fr auto;
 gap:12px;
 align-items:center;
 background:#fff;
 border-radius:20px;
 padding:13px;
 margin:7px 0;
 box-shadow:0 4px 16px #50374b0b;
}

.job-line{
 width:8px;
 height:55px;
 border-radius:20px;
 background:linear-gradient(#e57ba7,#a784d0,#74b89a);
}

.job-name{
 font-size:17px;
 font-weight:900;
}

.job-time{
 font-size:13px;
 color:#817985;
 margin-top:4px;
}

.job-right{
 text-align:right;
}

.job-price{
 font-weight:900;
 font-size:17px;
}

.job-buttons{
 display:flex;
 gap:5px;
 margin-top:5px;
}

.mini{
 padding:6px 8px;
 border-radius:10px;
 background:#eadff6;
 color:#68568c;
 font-size:11px;
 font-weight:900;
}

.mini.pink{
 background:#f5d8e5;
 color:#ad4d77;
}

.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 z-index:100;
 height:86px;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 background:rgba(255,255,255,.99);
 border-top:1px solid #eee5eb;
 box-shadow:0 -7px 25px #50374b10;
 padding-bottom:env(safe-area-inset-bottom);
}

.nav{
 background:none;
 color:#8a8490;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:3px;
 font-size:11px;
 font-weight:800;
}

.nav-icon{
 font-size:24px;
}

.nav.active{
 color:#dc5790;
}

.nav.active .nav-pill{
 background:#f9dce8;
}

.nav-pill{
 width:52px;
 height:40px;
 border-radius:22px;
 display:grid;
 place-items:center;
}

.modal-bg{
 position:fixed;
 inset:0;
 z-index:500;
 background:#241d2d66;
 display:flex;
 align-items:flex-end;
}

.modal{
 width:100%;
 max-width:700px;
 max-height:92vh;
 overflow:auto;
 background:#fffafd;
 border-radius:30px 30px 0 0;
 padding:22px 18px calc(32px + env(safe-area-inset-bottom));
 margin:auto auto 0;
}

.modal-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:16px;
}

.modal-title{
 margin:0;
 font-size:24px;
 font-weight:900;
}

.close{
 width:44px;
 height:44px;
 border-radius:50%;
 background:#f0e8ef;
 font-size:25px;
 color:#6e6571;
}

.field{
 margin:12px 0;
}

.label{
 display:block;
 margin-bottom:6px;
 color:#77707b;
 font-size:13px;
 font-weight:800;
}

.control{
 width:100%;
 min-height:50px;
 padding:11px 13px;
 border:1px solid #ddd5df;
 border-radius:15px;
 background:#fff;
 color:#34303a;
 font-size:16px;
}

.two{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.list{
 background:#fff;
 border-radius:20px;
 padding:14px;
 margin:8px 0;
 box-shadow:0 5px 18px #50374b0b;
}

.list-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
}

.edit{
 padding:8px 11px;
 border-radius:11px;
 background:#f1e5ed;
 color:#ad5278;
 font-weight:900;
}

.danger{
 width:100%;
 margin-top:9px;
 padding:13px;
 border-radius:15px;
 background:#ffe5ec;
 color:#b4476c;
 font-weight:900;
}

.setting{
 background:linear-gradient(135deg,#fff0f6,#f0eafa);
 border-radius:20px;
 padding:16px;
 margin:10px 0;
}

.setting-title{
 font-size:18px;
 font-weight:900;
}

.setting-text{
 font-size:13px;
 color:#827984;
 line-height:1.5;
 margin-top:5px;
}

.zoom{
 width:100%;
 accent-color:#dc6797;
 margin:14px 0;
}

@media(max-width:600px){

 .header{
  padding:15px 16px;
 }

 .brand-title{
  font-size:22px;
 }

 .brand-subtitle{
  font-size:13px;
 }

 .logo{
  width:60px;
  height:60px;
  flex-basis:60px;
 }

 .settings-btn{
  width:51px;
  height:51px;
  font-size:24px;
 }

 .content{
  padding:18px 14px 28px;
 }

 .date-card{
  padding:18px 20px;
 }

 .date-main{
  font-size:20px;
 }

 .date-sub{
  font-size:14px;
 }

 .quote-banner{
  height:150px;
 }

 .quote-text{
  font-size:27px;
 }

 .stats{
  gap:7px;
 }

 .stat{
  min-height:124px;
  border-radius:22px;
 }

 .stat-value{
  font-size:21px;
 }

 .stat-label{
  font-size:11px;
 }

 .section-title{
  font-size:22px;
 }

 .job{
  grid-template-columns:7px 1fr auto;
  padding:11px;
 }

 .job-price{
  font-size:15px;
 }

 .mini{
  padding:5px 6px;
  font-size:10px;
 }
}

@media(max-width:370px){

 .content{
  padding-left:10px;
  padding-right:10px;
 }

 .stats{
  gap:5px;
 }

 .stat{
  min-height:116px;
 }

 .stat-icon{
  font-size:21px;
 }

 .stat-value{
  font-size:19px;
 }

 .quote-text{
  font-size:24px;
 }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const KEY="pure_shine_manager_new_exact_v1";

const defaultClients=[

{
 id:"lottie",
 name:"Lottie",
 type:"Agency",
 rate:16,
 day:"Monday",
 start:"13:00",
 end:"15:00",
 frequency:"Weekly"
},

{
 id:"christine",
 name:"Christine",
 type:"Private",
 rate:18,
 day:"Tuesday",
 start:"09:30",
 end:"12:30",
 frequency:"Weekly"
},

{
 id:"matt",
 name:"Matt",
 type:"Agency",
 rate:16,
 day:"Tuesday",
 start:"13:00",
 end:"17:00",
 frequency:"Weekly"
},

{
 id:"sonia",
 name:"Sonia",
 type:"Agency",
 rate:16,
 day:"Wednesday",
 start:"09:00",
 end:"14:00",
 frequency:"Weekly"
},

{
 id:"laura",
 name:"Laura",
 type:"Private",
 rate:18,
 day:"Thursday",
 start:"09:00",
 end:"13:00",
 frequency:"Weekly"
},

{
 id:"hannah",
 name:"Hannah",
 type:"Agency",
 rate:16,
 day:"Thursday",
 start:"13:00",
 end:"16:00",
 frequency:"Weekly"
},

{
 id:"meghan",
 name:"Meghan",
 type:"Private",
 rate:18,
 day:"",
 start:"",
 end:"",
 frequency:"Occasional"
},

{
 id:"joanna",
 name:"Joanna",
 type:"Private",
 rate:18,
 day:"Friday",
 start:"09:30",
 end:"13:30",
 frequency:"Fortnightly",
 anchor:"2026-10-02"
},

{
 id:"sindu",
 name:"Sindu",
 type:"Agency",
 rate:16,
 day:"Friday",
 start:"09:30",
 end:"12:30",
 frequency:"Fortnightly",
 anchor:"2026-09-25"
},

{
 id:"peter",
 name:"Peter",
 type:"Private",
 rate:18,
 day:"",
 start:"",
 end:"",
 frequency:"Occasional"
},

{
 id:"mike",
 name:"Mike",
 type:"Agency",
 rate:16,
 day:"",
 start:"",
 end:"",
 frequency:"Every 3 weeks"
}

];

let data=
JSON.parse(
 localStorage.getItem(KEY)||"null"
)
||
{
 clients:structuredClone(defaultClients),
 jobs:[],
 timer:null
};

data.clients=
data.clients.filter(
 c=>String(c.name).toLowerCase()!=="gill"
);

for(
 const c of defaultClients
){
 if(
  !data.clients.some(
   x=>x.id===c.id
  )
 ){
  data.clients.push(
   structuredClone(c)
  );
 }
}

let page="home";

function save(){
 localStorage.setItem(
  KEY,
  JSON.stringify(data)
 );
}

function esc(x){
 return String(x??"")
 .replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m])
 );
}

function money(n){
 return "£"+
 Number(n||0)
 .toFixed(2)
 .replace(/\.00$/,"");
}

function iso(d=new Date()){
 return new Date(
  d.getTime()-
  d.getTimezoneOffset()*60000
 )
 .toISOString()
 .slice(0,10);
}

function day(d=new Date()){
 return d.toLocaleDateString(
  "en-GB",
  {weekday:"long"}
 );
}

function mins(t){
 if(!t)return 0;
 let [h,m]=t
 .split(":")
 .map(Number);

 return h*60+m;
}

function hours(a,b){
 return Math.max(
  0,
  (mins(b)-mins(a))/60
 );
}

function client(id){
 return data.clients.find(
  c=>c.id===id
 );
}

function works(c,d=new Date()){

 if(
  !c.day||
  !c.start||
  !c.end||
  c.frequency==="Occasional"
 )
 return false;

 if(
  day(d)!==c.day
 )
 return false;

 if(
  c.name==="Joanna"||
  c.name==="Sindu"
 ){

  if(
   iso(d)<c.anchor
  )
  return false;

  return Math.floor(
   (
    new Date(iso(d))-
    new Date(c.anchor)
   )/86400000
  )%14===0;
 }

 return c.frequency==="Every 3 weeks"
 ?
 Math.floor(
  (
   new Date(iso(d))-
   new Date("2026-09-25")
  )/86400000
 )%21===0
 :
 true;
}

function todayClients(){

 return data.clients
 .filter(c=>works(c))
 .sort(
  (a,b)=>
   mins(a.start)-
   mins(b.start)
 );
}

function render(){

 const app=
 document.getElementById("app");

 app.innerHTML=`

<header class="header">

 <div class="brand">

  <img
   class="logo"
   src="icon(2).png"
   alt="Pure Shine"
  >

  <div>

   <div class="brand-title">
    Cleaning Manager
   </div>

   <div class="brand-subtitle">
    Your cleaning business ✨
   </div>

  </div>

 </div>

 <button
  class="settings-btn"
  onclick="settings()"
 >
  ⚙️
 </button>

</header>

<main class="content">

 ${
  page==="home"
  ?home()
  :page==="schedule"
  ?schedule()
  :page==="clients"
  ?clients()
  :page==="earnings"
  ?earnings()
  :timerPage()
 }

</main>

<nav class="bottom">

 ${nav("home","⌂","Home")}
 ${nav("schedule","▣","Schedule")}
 ${nav("clients","♣","Clients")}
 ${nav("timer","◷","Free time")}
 ${nav("earnings","▤","Earnings")}

</nav>

`;
}

function nav(p,i,t){

 return `
 <button
  class="nav ${page===p?"active":""}"
  onclick="go('${p}')"
 >
  <span class="nav-pill">
   ${i}
  </span>
  ${t}
 </button>
 `;
}

function home(){

 const jobs=
 data.jobs.filter(
  j=>j.date===iso()
 );

 const tc=
 todayClients();

 const h=
 jobs.reduce(
  (s,j)=>
   s+Number(j.hours||0),
  0
 );

 const e=
 jobs.reduce(
  (s,j)=>
   s+Number(j.price||0),
  0
 );

 const av=
 tc.reduce(
  (s,c)=>
   s+hours(c.start,c.end),
  0
 );

 let x=`

<section class="date-card">

 <div>

  <div class="date-main">
   ${
    new Date().toLocaleDateString(
     "en-GB",
     {
      weekday:"long",
      day:"numeric",
      month:"long"
     }
    )
   }
  </div>

  <div class="date-sub">
   Let's make today productive 🌸
  </div>

 </div>

 <div class="sparkles">
  ✦ ✧
 </div>

</section>

<section class="quote-banner">

 <div class="quote-text">
  ♡ A clean space<br>
  is a happy place ♡
 </div>

</section>

<section class="stats">

 <div class="stat">
  <div class="stat-icon">🧹</div>
  <div class="stat-value">${jobs.length}</div>
  <div class="stat-label">Jobs</div>
 </div>

 <div class="stat">
  <div class="stat-icon">◷</div>
  <div class="stat-value">${h.toFixed(1)}h</div>
  <div class="stat-label">Hours</div>
 </div>

 <div class="stat">
  <div class="stat-icon">◎</div>
  <div class="stat-value">${money(e)}</div>
  <div class="stat-label">Earned</div>
 </div>

 <div class="stat">
  <div class="stat-icon">☼</div>
  <div class="stat-value">${av.toFixed(1)}h</div>
  <div class="stat-label">Available</div>
 </div>

</section>

<section class="section">

 <div class="section-head">

  <h2 class="section-title">
   Today's schedule
  </h2>

  <button
   class="see-all"
   onclick="go('schedule')"
  >
   See all
  </button>

 </div>

 <div class="schedule-box">
 `;

 if(!tc.length){

  x+=`

  <div class="empty">

   <div class="empty-icon">
    ♡
   </div>

   <strong>
    No cleaning jobs today 🌸
   </strong>

   <p>
    Add one with the + button.
   </p>

   <button
    class="primary"
    onclick="jobForm()"
   >
    ＋ Add cleaning job
   </button>

  </div>

  `;

 }else{

  tc.forEach(
   c=>x+=jobCard(c)
  );

 }

 return x+`

 </div>

</section>

`;

}

function jobCard(c){

 const j=
 data.jobs.find(
  x=>
   x.date===iso()&&
   x.clientId===c.id
 );

 const hh=
 j
 ?
 j.hours
 :
 hours(c.start,c.end);

 const running=
 data.timer?.clientId===c.id;

 return `

<div class="job">

 <div class="job-line"></div>

 <div>

  <div class="job-name">
   ${esc(c.name)}
  </div>

  <div class="job-time">
   ${c.start}–${c.end}
   · ${hh.toFixed(2)}h
   · £${c.rate}/h
  </div>

 </div>

 <div class="job-right">

  <div class="job-price">
   ${money(hh*c.rate)}
  </div>

  <div class="job-buttons">

   <button
    class="mini"
    onclick="${
     running
     ?"stopTimer()"
     :"startTimer('"+c.id+"')"
    }"
   >
    ${running?"■":"◷"}
   </button>

   <button
    class="mini pink"
    onclick="clientForm('${c.id}')"
   >
    ✎
   </button>

  </div>

 </div>

</div>

`;

}

function schedule(){

 let x=`

<div class="section-head">

 <h2 class="section-title">
  Weekly Schedule
 </h2>

 <button
  class="see-all"
  onclick="jobForm()"
 >
  ＋ Job
 </button>

</div>

`;

[
 "Monday",
 "Tuesday",
 "Wednesday",
 "Thursday",
 "Friday",
 "Saturday",
 "Sunday"
]
.forEach(
 d=>{

  let cs=
  data.clients.filter(
   c=>
    c.day===d&&
    c.start&&
    c.end&&
    c.frequency!=="Occasional"
  );

  if(!cs.length)
   return;

  x+=`

  <section class="section">

   <h2
    class="section-title"
    style="font-size:20px"
   >
    ${d}
   </h2>

  `;

  cs.sort(
   (a,b)=>
    mins(a.start)-
    mins(b.start)
  );

  cs.forEach(
   c=>x+=jobCard(c)
  );

  x+=`
  </section>
  `;

 }
);

return x;

}

function modal(html){

 let b=
 document.createElement("div");

 b.className="modal-bg";
 b.id="modal";

 b.onclick=
 ()=>{
  b.remove();
 };

 let m=
 document.createElement("div");

 m.className="modal";

 m.onclick=
 e=>e.stopPropagation();

 m.innerHTML=html;

 b.appendChild(m);

 document.body.appendChild(b);

}

function closeModal(){

 document
 .getElementById("modal")
 ?.remove();

}

function saveClient(id){

 let name=
 document
 .getElementById("cn")
 .value
 .trim();

 if(
  !name||
  name.toLowerCase()==="gill"
 ){

  return alert(
   "Please enter a valid client name."
  );

 }

 let c={

  id:
   id||
   "c"+Date.now(),

  name,

  type:
   document.getElementById("ct").value,

  rate:
   Number(
    document.getElementById("cr").value||16
   ),

  day:
   document.getElementById("cd").value,

  frequency:
   document.getElementById("cf").value,

  start:
   document.getElementById("cs").value,

  end:
   document.getElementById("ce").value

 };

 if(id){

  data.clients=
  data.clients.map(
   x=>x.id===id?c:x
  );

 }else{

  data.clients.push(c);

 }

 save();
 closeModal();
 render();

}

 ){

  data.clients=

  data.jobs=
  data.jobs.filter(
   j=>j.clientId!==id
  );

  save();
  closeModal();
  render();

 }

function saveJob(id){

 let c=
 client(
  document
  .getElementById("jc")
  .value
 );

 let start=
 document
 .getElementById("js")
 .value;

 let end=
 document
 .getElementById("je")
 .value;

 let h=
 Number(
  document
  .getElementById("jh")
  .value||
  hours(start,end)
 );

 let j={

  id:
   id||
   "j"+Date.now(),

  clientId:c.id,

  clientName:c.name,

  rate:c.rate,

  date:
   document
   .getElementById("jd")
   .value,

  start,

  end,

  hours:h,

  price:
   h*c.rate,

  status:
   document
   .getElementById("jp")
   .value

 };

 if(id){

  data.jobs=
  data.jobs.map(
   x=>x.id===id?j:x
  );

 }else{

  data.jobs.push(j);

 }

 save();
 closeModal();
 render();

}

function deleteJob(id){

 if(
  confirm(
   "Delete this job?"
  )
 ){

  data.jobs=
  data.jobs.filter(
   j=>j.id!==id
  );

  save();
  closeModal();
  render();

 }

}

function startTimer(id){

 if(data.timer)
  stopTimer();

 data.timer={
  clientId:id,
  startedAt:Date.now(),
  baseHours:0
 };

 save();
 render();

}

function stopTimer(){

 if(!data.timer)
  return;

 let c=
 client(
  data.timer.clientId
 );

 let elapsed=
 (
  Date.now()-
  data.timer.startedAt
 )/3600000;

 let j=
 data.jobs.find(
  x=>
   x.date===iso()&&
   x.clientId===c.id
 );

 if(!j){

  j={

   id:
    "j"+Date.now(),

   clientId:
    c.id,

   clientName:
    c.name,

   rate:
    c.rate,

   date:
    iso(),

   start:
    c.start||"",

   end:
    c.end||"",

   hours:0,

   price:0,

   status:"Paid"

  };

  data.jobs.push(j);

 }

 j.hours=
 Number(j.hours||0)+elapsed;

 j.price=
 j.hours*c.rate;

 data.timer=null;

 save();
 render();

}

function setZoom(v){

 v=
 Math.max(
  80,
  Math.min(
   130,
   Number(v)
  )
 );

 localStorage.setItem(
  "ps_zoom",
  v/100
 );

 document.documentElement
 .style
 .setProperty(
  "--zoom",
  v/100
 );

 let z=
 document.getElementById("zv");

 if(z)
  z.textContent=
   v+"%";

}

function go(p){

 page=p;

 closeModal();

 render();

}

save();

setZoom(
 localStorage.getItem(
  "ps_zoom"
 )*100||100
);

render();
