<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pure Shine Cleaning Manager</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Parisienne&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
 --pink:#d8789e;
 --dark:#9a5b78;
 --soft:#f8dfeb;
 --line:#ecd4df;
 --muted:#918b92;
 --ink:#26232a;
 --blue:#dce9fa;
 --green:#dff1e8;
 --yellow:#fff0c8;
 --purple:#e9def7;
 --peach:#f4ddd8;
 --nav:92px;
 --scale:1;
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent
}

html,body{
 margin:0;
 width:100%;
 min-height:100%;
 background:#fffafd;
 color:var(--ink);
 font-family:'DM Sans',sans-serif
}

body{
 font-size:calc(16px * var(--scale));
 overflow-x:hidden
}

button,input,select,textarea{
 font:inherit
}

button{
 border:0;
 cursor:pointer
}

.app{
 min-height:100dvh;
 padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));
 background:linear-gradient(#fffafd,#fff)
}

body.high{
 --line:#b9879e;
 --muted:#57525a;
 --ink:#111
}

body.large{
 --scale:1.14
}

/* HEADER */

.top{
 background:#fff;
 border-bottom:1px solid #f0dce5;
 padding:18px max(20px,4vw) 12px;
 position:sticky;
 top:0;
 z-index:20
}

.topin{
 width:100%;
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between
}

.brand{
 display:flex;
 align-items:center;
 gap:13px;
 min-width:0
}

.profile{
 width:64px;
 height:64px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #f0d6e1;
 box-shadow:0 5px 18px #c7839d33
}

.brandtext{
 min-width:0
}

.brandname{
 font-family:Parisienne,cursive;
 color:var(--dark);
 font-size:clamp(31px,5vw,48px);
 line-height:1;
 white-space:nowrap
}

.subtitle{
 color:var(--muted);
 margin-top:5px;
 font-size:14px
}

.topactions{
 display:flex;
 gap:8px
}

.topbtn{
 width:55px;
 height:55px;
 border-radius:18px;
 background:#f9e4ed;
 color:var(--dark);
 font-size:24px
}

/* PAGES */

.pages{
 width:100%
}

.page{
 display:none;
 width:100%;
 max-width:1100px;
 margin:auto;
 padding:18px max(20px,4vw) 35px
}

.page.active{
 display:block
}

/* DATE */

.date{
 background:linear-gradient(135deg,#f7ddea,#fff);
 border:1px solid var(--line);
 border-radius:25px;
 padding:25px 28px;
 display:flex;
 justify-content:space-between;
 align-items:center
}

.date h1{
 margin:0;
 color:var(--dark);
 font-size:clamp(24px,4vw,34px)
}

.date p{
 margin:6px 0 0;
 color:var(--muted)
}

.heart{
 font-size:45px;
 color:var(--dark)
}

/* STATS */

.stats{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px;
 margin:16px 0 24px
}

.stat{
 min-height:118px;
 border:1px solid var(--line);
 border-radius:22px;
 padding:15px;
 display:flex;
 flex-direction:column;
 justify-content:center
}

.stat:nth-child(1){background:#f1d8e5}
.stat:nth-child(2){background:var(--blue)}
.stat:nth-child(3){background:var(--green)}
.stat:nth-child(4){background:var(--yellow)}

.stat .ico{
 font-size:22px
}

.stat b{
 font-size:clamp(21px,3vw,30px);
 margin:4px 0
}

.stat span{
 color:#706a71;
 font-size:13px
}

/* SECTIONS */

.sect{
 font-size:22px;
 color:var(--dark);
 font-weight:800;
 text-transform:uppercase;
 letter-spacing:.04em;
 margin:22px 2px 11px
}

.sect small{
 float:right;
 font-size:13px;
 text-transform:none;
 letter-spacing:0;
 padding-top:5px
}

/* SCHEDULE */

.schedule{
 background:#fff;
 border:1px solid #f0dce5;
 border-radius:25px;
 padding:12px
}

.job{
 border:1px solid var(--line);
 border-radius:20px;
 padding:16px;
 margin-bottom:9px;
 background:#fff
}

.jobhead{
 display:flex;
 justify-content:space-between;
 gap:12px
}

.jobname{
 font-weight:800;
 font-size:19px
}

.jobtime{
 font-weight:800;
 color:var(--dark);
 white-space:nowrap
}

.meta{
 color:var(--muted);
 font-size:13px;
 margin-top:5px
}

.money{
 margin-top:12px;
 color:#817b82
}

.money strong{
 color:var(--dark)
}

.jobactions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px
}

.btn{
 padding:11px 14px;
 border-radius:13px;
 background:#f7e8ef;
 color:#945873;
 font-weight:700
}

.primary{
 background:var(--pink);
 color:#fff
}

.pdf{
 background:#f7ecd7;
 color:#896f47
}

.paid{
 background:#dcefe4;
 color:#397359
}

.unpaid{
 background:#ececed;
 color:#666
}

.add{
 width:100%;
 padding:15px;
 border-radius:18px;
 background:var(--pink);
 color:#fff;
 font-weight:800
}

/* QUICK ACTIONS */

.quickgrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.quick{
 min-height:72px;
 border-radius:18px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:9px;
 font-weight:700
}

.blue{
 background:var(--blue);
 color:#315b8c
}

.green{
 background:var(--green);
 color:#477967
}

.qpink{
 background:#f2d9e5;
 color:#8e5872
}

.yellow{
 background:var(--yellow);
 color:#8b7040
}

.purple{
 background:var(--purple);
 color:#73568a
}

.peach{
 background:var(--peach);
 color:#946157
}

/* BANNER */

.banner{
 display:block;
 width:100%;
 height:190px;
 object-fit:cover;
 border-radius:22px;
 border:1px solid #efd2df;
 margin-top:18px
}

/* BOTTOM NAV */

.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 height:var(--nav);
 z-index:50;
 background:#fff;
 padding:7px 9px calc(7px + env(safe-area-inset-bottom));
 box-shadow:0 -5px 25px #c7819a1c
}

.nav{
 max-width:1100px;
 height:100%;
 margin:auto;
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px
}

.nav button{
 background:transparent;
 color:#8b858c;
 border-radius:20px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:4px
}

.nav button.active{
 background:var(--soft);
 color:var(--dark);
 font-weight:800
}

.ni{
 font-size:24px;
 line-height:1
}

.nav label{
 font-size:12px
}

.fab{
 position:fixed;
 right:22px;
 bottom:calc(var(--nav) + 18px);
 z-index:55;
 width:64px;
 height:64px;
 border-radius:50%;
 background:var(--pink);
 color:#fff;
 font-size:36px;
 box-shadow:0 8px 25px #b9688840
}

/* CLIENTS / EARNINGS */

.title{
 font-size:29px;
 color:var(--dark);
 margin:5px 0 15px
}

.list{
 display:grid;
 gap:10px
}

.client,.card{
 background:#fff;
 border:1px solid var(--line);
 border-radius:20px;
 padding:14px
}

.client{
 display:flex;
 align-items:center;
 gap:12px
}

.avatar{
 width:47px;
 height:47px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:#f6dce7;
 color:var(--dark);
 font-weight:800
}

.ci{
 flex:1
}

.ci b{
 display:block
}

.ci span{
 font-size:12px;
 color:var(--muted)
}

.rate{
 font-weight:800;
 color:var(--dark)
}

.earnbox{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}

.earn{
 background:#fff;
 border:1px solid var(--line);
 border-radius:20px;
 padding:15px
}

.earn b{
 display:block;
 font-size:24px;
 color:var(--dark);
 margin-top:5px
}

/* CALENDAR */

.calendar{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:5px
}

.day{
 min-height:65px;
 border:1px solid var(--line);
 border-radius:10px;
 background:#fff;
 padding:7px 2px;
 text-align:center;
 font-size:10px
}

.day strong{
 display:block;
 font-size:13px
}

.day.has{
 background:#f8e1eb
}

/* SETTINGS */

.stitle{
 font-size:13px;
 letter-spacing:.08em;
 color:#98617a;
 font-weight:800;
 text-transform:uppercase;
 margin:14px 3px 3px
}

.settings{
 display:grid;
 gap:10px
}

.setting{
 min-height:78px;
 background:#fff;
 border:1px solid var(--line);
 border-radius:20px;
 padding:13px;
 display:flex;
 align-items:center;
 gap:13px
}

.si{
 width:49px;
 height:49px;
 border-radius:15px;
 background:#f9e3ed;
 display:grid;
 place-items:center;
 font-size:23px;
 flex:none
}

.smain{
 flex:1;
 min-width:0
}

.smain b{
 display:block
}

.smain span{
 display:block;
 color:var(--muted);
 font-size:12px;
 margin-top:3px
}

.switch{
 width:59px;
 height:35px;
 border-radius:20px;
 background:#ddd;
 padding:3px;
 flex:none
}

.switch i{
 display:block;
 width:29px;
 height:29px;
 border-radius:50%;
 background:#fff;
 box-shadow:0 1px 4px #0002;
 transition:.2s
}

.switch.on{
 background:var(--pink)
}

.switch.on i{
 transform:translateX(24px)
}

select,
input[type=text],
input[type=number]{
 border:0;
 background:#fff2f7;
 color:#955873;
 border-radius:12px;
 padding:11px 12px;
 font-weight:700;
 max-width:160px
}

.save{
 width:100%;
 padding:15px;
 border-radius:17px;
 background:var(--pink);
 color:#fff;
 font-weight:800
}

/* PHOTOS */

.photos{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.photo{
 background:#fff;
 border:1px solid var(--line);
 border-radius:20px;
 padding:12px
}

.photo img{
 width:100%;
 height:150px;
 object-fit:cover;
 border-radius:15px;
 background:#fff4f8
}

.photo b{
 display:block;
 margin:8px 0 4px
}

.photo span{
 font-size:11px;
 color:var(--muted);
 display:block;
 margin-bottom:8px
}

.upload{
 display:block;
 text-align:center;
 background:#f7e1eb;
 color:#945873;
 padding:10px;
 border-radius:12px;
 font-weight:700;
 font-size:12px
}

.upload input{
 display:none
}

.dots{
 display:flex;
 gap:9px
}

.dot{
 width:28px;
 height:28px;
 border-radius:50%;
 border:2px solid #fff;
 box-shadow:0 0 0 1px #d8c5ce
}

.dot.active{
 outline:2px solid var(--dark)
}

/* MODAL */

.modalback{
 position:fixed;
 inset:0;
 background:#20151f77;
 z-index:100;
 display:none;
 align-items:flex-end
}

.modalback.show{
 display:flex
}

.modal{
 background:#fff;
 width:min(100%,680px);
 max-height:92dvh;
 overflow:auto;
 border-radius:28px 28px 0 0;
 padding:20px
}

.modal h2{
 margin:0 0 15px;
 color:var(--dark)
}

.form{
 display:grid;
 gap:10px
}

.form label{
 font-size:12px;
 color:#777;
 font-weight:700
}

.form input,
.form select,
.form textarea{
 width:100%;
 max-width:none;
 border:1px solid var(--line);
 border-radius:13px;
 padding:12px;
 background:#fff
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.ma{
 display:flex;
 gap:8px;
 margin-top:14px
}

.ma>*{
 flex:1
}

.toast{
 position:fixed;
 z-index:150;
 left:50%;
 bottom:calc(var(--nav) + 18px);
 transform:translateX(-50%);
 background:#29252a;
 color:#fff;
 padding:11px 16px;
 border-radius:999px;
 display:none;
 font-size:13px
}

.toast.show{
 display:block
}

.empty{
 padding:30px;
 text-align:center;
 background:#fff;
 border:1px dashed var(--line);
 border-radius:20px;
 color:var(--muted)
}

/* RESPONSIVE */

@media(max-width:600px){

 .top{
  padding-left:20px;
  padding-right:20px
 }

 .profile{
  width:55px;
  height:55px
 }

 .brandname{
  font-size:32px
 }

 .topbtn{
  width:50px;
  height:50px
 }

 .page{
  padding-left:20px;
  padding-right:20px
 }

 .stats{
  gap:9px
 }

 .stat{
  min-height:110px;
  padding:11px
 }

 .stat b{
  font-size:21px
 }

 .stat span{
  font-size:12px
 }

 .jobtime{
  font-size:17px
 }

 .earnbox{
  grid-template-columns:1fr 1fr
 }

 .photos{
  grid-template-columns:1fr
 }

 .banner{
  height:150px
 }

 .nav label{
  font-size:11px
 }

 .ni{
  font-size:22px
 }
}

@media(min-width:900px){

 .page{
  padding-left:30px;
  padding-right:30px
 }

 .banner{
  height:240px
 }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
 <div class="topin">

  <div class="brand">

   <!-- Put your Pure Shine logo image in the same GitHub folder as this HTML and name it logo.jpg -->
   <img
    id="profileImg"
    class="profile"
    src="logo.jpg"
    alt="Pure Shine"
    onerror="this.style.background='#f8dfeb';this.removeAttribute('src')"
   >

   <div class="brandtext">
    <div class="brandname">Pure Shine</div>
    <div class="subtitle">Cleaning Manager ✨</div>
   </div>

  </div>

  <div class="topactions">
   <button class="topbtn" onclick="openReminder()">🔔</button>
   <button class="topbtn" onclick="startFromHome()">⏱️</button>
  </div>

 </div>
</header>

<main class="pages">

 <section id="home" class="page active"></section>

 <section id="schedule" class="page"></section>

 <section id="clients" class="page"></section>

 <section id="earnings" class="page"></section>

 <section id="settings" class="page"></section>

</main>

<button class="fab" onclick="openJob()">＋</button>

<nav class="bottom">

 <div class="nav">

  <button id="n-home" class="active" onclick="go('home')">
   <span class="ni">⌂</span>
   <label>Home</label>
  </button>

  <button id="n-schedule" onclick="go('schedule')">
   <span class="ni">📅</span>
   <label>Schedule</label>
  </button>

  <button id="n-clients" onclick="go('clients')">
   <span class="ni">♧</span>
   <label>Clients</label>
  </button>

  <button id="n-earnings" onclick="go('earnings')">
   <span class="ni">▥</span>
   <label>Earnings</label>
  </button>

  <button id="n-settings" onclick="go('settings')">
   <span class="ni">⚙️</span>
   <label>Settings</label>
  </button>

 </div>

</nav>

</div>

<div id="back" class="modalback">
 <div id="modal" class="modal"></div>
</div>

<div id="toast" class="toast"></div>

<script>

const $=id=>document.getElementById(id);

const DAYS=[
 'Sunday',
 'Monday',
 'Tuesday',
 'Wednesday',
 'Thursday',
 'Friday',
 'Saturday'
];

/*
 IMPORTANT:
 Put these two image files beside this HTML file on GitHub:

 logo.jpg
 banner.jpg

 logo.jpg = your Pure Shine Cleaning logo
 banner.jpg = your Pure Shine cleaning banner photo
*/

const DEFAULT_LOGO='logo.jpg';
const DEFAULT_BANNER='banner.jpg';


/* CLIENTS */

const CLIENTS=[

 ['Lottie','Agency',16,2,'Monday','weekly'],

 ['Christine','Private',18,3,'Tuesday','fortnightly'],

 ['Matt','Agency',16,4,'Tuesday','weekly'],

 ['Sonia','Agency',16,5,'Wednesday','weekly'],

 ['Gill','Agency',16,3,'Wednesday','weekly'],

 ['Laura','Private',18,4,'Thursday','weekly'],

 ['Hannah','Agency',16,3,'Thursday','weekly'],

 ['Meghan','Private',20,2,'Friday','weekly'],

 ['Joanna','Private',18,2,'Friday','fortnightly'],

 ['Sindu','Private',16,2,'Friday','fortnightly'],

 ['Peter','Private',20,2,'Friday','occasional'],

 ['Mike','Private',20,2,'Friday','threeweekly']

].map((x,i)=>({

 id:'c'+i,
 name:x[0],
 type:x[1],
 rate:x[2],
 hours:x[3],
 day:x[4],
 frequency:x[5],
 active:true

}));


/* DEFAULT STATE */

const initial={

 settings:{

  businessName:'Pure Shine Cleaning',

  ownerName:'Georgiana Radu',

  profile:DEFAULT_LOGO,

  banner:DEFAULT_BANNER,

  appSize:1,

  largerText:false,

  compact:false,

  highContrast:false,

  accent:'#d8789e',

  autoSaveTimer:true,

  offerInvoice:true,

  fortnightly:true,

  reminders:true,

  reminderStyle:'Professional',

  weekStart:'Monday',

  workingHours:8,

  invoicePrefix:'PS-0',

  invoiceNext:1

 },

 clients:CLIENTS,

 jobs:[],

 holidays:[]

};


let state=load();

let timer={
 running:false,
 start:0,
 clientId:null,
 id:null
};


/* STORAGE */

function load(){

 try{

  let x=JSON.parse(
   localStorage.getItem('pureShineState')
  );

  if(!x)
   return structuredClone(initial);

  return {

   ...structuredClone(initial),

   ...x,

   settings:{
    ...initial.settings,
    ...x.settings
   },

   clients:x.clients||CLIENTS,

   jobs:x.jobs||[],

   holidays:x.holidays||[]

  };

 }catch(e){

  return structuredClone(initial);

 }

}


function save(){

 localStorage.setItem(
  'pureShineState',
  JSON.stringify(state)
 );

}


/* HELPERS */

function esc(x=''){

 return String(x).replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'
  }[m])
 );

}


function dateKey(d=new Date()){

 return d.toISOString().slice(0,10);

}


function money(n){

 return '£'+Number(n||0).toFixed(2);

}


function hm(m){

 m=Math.round(m||0);

 return Math.floor(m/60)+'h '+(m%60)+'m';

}


function fmtDate(s){

 return new Date(
  s+'T12:00:00'
 ).toLocaleDateString(
  'en-GB',
  {
   weekday:'long',
   day:'numeric',
   month:'long'
  }
 );

}


function minsEnd(start,m){

 let [h,mi]=start
  .split(':')
  .map(Number);

 let n=h*60+mi+m;

 return String(
  Math.floor(n/60)%24
 ).padStart(2,'0')
 +':'+
 String(n%60).padStart(2,'0');

}


/* FORTNIGHTLY LOGIC */

function isAlt(c,date){

 if(c.frequency==='weekly')
  return true;

 if(c.frequency==='occasional')
  return false;

 if(c.frequency==='threeweekly'){

  let a=new Date(
   '2026-09-18T12:00:00'
  );

  let b=new Date(
   date+'T12:00:00'
  );

  return Math.floor(
   (b-a)/86400000/7
  )%3===0;

 }

 if(c.frequency==='fortnightly'){

  let a=new Date(
   '2026-10-02T12:00:00'
  );

  let b=new Date(
   date+'T12:00:00'
  );

  let w=Math.floor(
   (b-a)/86400000/7
  );

  if(c.name==='Joanna')
   return w%2===0;

  if(c.name==='Sindu')
   return w%2!==0;

  return w%2===0;

 }

 return true;

}


/* RECURRING JOBS */

function recurring(date=dateKey()){

 return state.clients

  .filter(c=>

   c.active&&

   c.day===
DAYS[
    new Date(
     date+'T12:00:00'
    ).getDay()
   ]&&

   isAlt(c,date)

  )

  .map(c=>({

   id:'r-'+c.id+'-'+date,

   clientId:c.id,

   name:c.name,

   type:c.type,

   rate:c.rate,

   hours:c.hours,

   minutes:c.hours*60,

   date,

   start:'09:00',

   end:minsEnd(
    '09:00',
    c.hours*60
   ),

   payment:'unpaid',

   recurring:true

  }))

  .filter(j=>
   !state.holidays.some(
    h=>date>=h.start&&date<=h.end
   )
  );

}


function jobsFor(date=dateKey()){

 return [

  ...recurring(date),

  ...state.jobs.filter(
   j=>j.date===date&&!j.recurring
  )

 ];

}


function jobTotal(j){

 return (
  Number(
   j.minutes??j.hours*60
  )/60
 )*Number(j.rate);

}


function stats(date=dateKey()){

 let js=state.jobs.filter(
  j=>j.date===date
 );

 let m=js.reduce(
  (a,j)=>a+
  Number(j.minutes??j.hours*60),
  0
 );

 let e=js.reduce(

 );

function calendarDays(){

 let d=new Date();

 let first=new Date(
  d.getFullYear(),
  d.getMonth(),
  1
 );

 let days=new Date(
  d.getFullYear(),
  d.getMonth()+1,
  0
 ).getDate();

 let out='';

 for(
  let i=0;
  i<first.getDay();
  i++
 ){

  out+='<div></div>';

 }

 for(
  let n=1;
  n<=days;
  n++
 ){

  let k=dateKey(
   new Date(
    d.getFullYear(),
    d.getMonth(),
    n
   )
  );

  let has=jobsFor(k).length;

  out+=`

   <div class="day ${has?'has':''}">

    <strong>${n}</strong>

    ${has?'🧹':''}

   </div>

  `;

 }

 return out;

}

function saveJob(old){

  x=>x.id==$('jc').value

 let o={

  id:old?.id||'j'+Date.now(),

  clientId:c.id,

  name:c.name,

  type:c.type,

  rate:c.rate,

  hours:h,

  minutes:Math.round(h*60),

  date:$('jd').value,

  start:$('js').value,

  end:$('je').value,

  payment:$('jp').value,

  recurring:false

 };

 state.jobs=old

  ?state.jobs.map(
   x=>x.id===old.id?o:x
  )

  :[...state.jobs,o];

 save();

 closeModal();

 render();

 toast('Job saved ✓');

/* PAID / NOT PAID */

function togglePaid(id,rec){

 let j=state.jobs.find(
  x=>x.id===id
 );

 if(!j&&rec){

  let r=jobsFor(dateKey()).find(
   x=>x.id===id
  );

  if(r){

   j={
    ...r,
    id:'j'+Date.now(),
    recurring:false
   };

   state.jobs.push(j);

  }

 }

 if(j){

  j.payment=
   j.payment==='paid'
   ?'unpaid'
   :'paid';

  save();

  render();

  toast(
   j.payment==='paid'
   ?'Marked as paid ✓'
   :'Marked as not paid'
  );

 }

}

   </label>


   <div class="row">

    <label>
     Type

     <select id="ct">

      <option
       ${c?.type==='Private'?'selected':''}
      >
       Private
      </option>

      <option
       ${c?.type==='Agency'?'selected':''}
      >
       Agency
      </option>

     </select>

    </label>


    <label>
     Rate £/h

     <input
      id="cr"
      type="number"
      value="${c?.rate||18}"
     >

    </label>

   </div>


   <div class="row">

    <label>
     Hours

     <input
      id="ch"
      type="number"
      step=".25"
      value="${c?.hours||2}"
     >

    </label>


    <label>
     Day

     <select id="cd">

      ${
       DAYS.map(x=>`

        <option
         ${c?.day===x?'selected':''}
        >
         ${x}
        </option>

       `).join('')
      }

     </select>

    </label>

   </div>


   <label>
    Frequency

    <select id="cf">

     <option
      ${c?.frequency==='weekly'?'selected':''}
     >
      weekly
     </option>

     <option
      ${c?.frequency==='fortnightly'?'selected':''}
     >
      fortnightly
     </option>

     <option
      ${c?.frequency==='threeweekly'?'selected':''}
     >
      threeweekly
     </option>

     <option
      ${c?.frequency==='occasional'?'selected':''}
     >
      occasional
     </option>

    </select>

   </label>


  </div>


  <div class="ma">

   <button
    class="btn"
    onclick="closeModal()"
   >
    Cancel
   </button>

   <button
    class="btn primary"
    onclick='saveClient(${c?JSON.stringify(c):'null'})'
   >
    Save
   </button>

  </div>

 `);

}


function saveClient(old){

 let o={

  id:old?.id||'c'+Date.now(),

  name:$('cn').value.trim(),

  type:$('ct').value,

  rate:Number($('cr').value),

  hours:Number($('ch').value),

  day:$('cd').value,

  frequency:$('cf').value,

  active:true

 };

 if(!o.name)return;

 state.clients=

  old

  ?state.clients.map(
   x=>x.id===old.id?o:x
  )

  :[...state.clients,o];

 save();

 closeModal();

 render();

 toast('Client saved ✓');

}


function editClient(c){

 openClient(c);

}


/* TIMER */

function startFromHome(){

 let c=state.clients.find(
  x=>x.active
 );

 if(c)
  startJob(c.id);

}


function startJob(id){

 if(timer.running){

  stopTimer();

  return;

 }

 timer={

  running:true,

  start:Date.now(),

  clientId:id

 };

 toast('Timer started ✓');

 document.title='⏱️ Timer running';

 timer.id=setInterval(()=>{

  document.title=
   '⏱️ '+
   hm(
    Math.floor(
     (Date.now()-timer.start)/60000
    )
   )+
   ' · Pure Shine';

 },1000);

}


function stopTimer(){

 if(!timer.running)return;

 clearInterval(timer.id);

 let c=
  state.clients.find(
   x=>x.id===timer.clientId
  )
  ||
  state.clients[0];

 let m=Math.max(
  1,
  Math.round(
   (Date.now()-timer.start)/60000
  )
 );

 timer={
  running:false,
  start:0,
  clientId:null,
  id:null
 };

 let j={

  id:'j'+Date.now(),

  clientId:c.id,

  name:c.name,

  type:c.type,

  rate:c.rate,

  hours:m/60,

  minutes:m,

  date:dateKey(),

  start:new Date(
   Date.now()-m*60000
  ).toTimeString().slice(0,5),

  end:new Date()
   .toTimeString()
   .slice(0,5),

  payment:'unpaid',

  recurring:false

 };

 if(state.settings.autoSaveTimer){

  state.jobs.push(j);

  save();

  render();

  toast('Timer job saved ✓');

  if(state.settings.offerInvoice){

   setTimeout(
    ()=>invoice(j),
    300
   );

  }

 }else{

  openJob(j);

 }

 document.title=
  'Pure Shine Cleaning Manager';

}


/* PDF INVOICE */

function invoice(j){

 let J=window.jspdf?.jsPDF;

 if(!J){

  toast(
   'PDF library unavailable'
  );

  return;

 }

 let d=new J();

 let total=jobTotal(j);


 d.setFillColor(
  248,223,235
 );

 d.roundedRect(
  15,15,180,35,5,5,'F'
 );


 d.setTextColor(
  154,91,120
 );

 d.setFontSize(25);

 d.text(
  'Pure Shine',
  25,
  30
 );


 d.setFontSize(10);

 d.text(
  'Cleaning Manager',
  25,
  40
 );


 d.setTextColor(
  35,33,39
 );

 d.setFontSize(18);

 d.text(
  'INVOICE',
  20,
  65
 );


 d.setFontSize(11);

 d.text(
  'Invoice: '+
  state.settings.invoicePrefix+
  String(
   state.settings.invoiceNext
  ).padStart(5,'0'),
  20,
  77
 );


 d.text(
  'Client: '+j.name,
  20,
  87
 );


 d.text(
  'Date: '+j.date,
  20,
  97
 );


 d.text(
  'Cleaning: '+hm(j.minutes),
  20,
  112
 );


 d.text(
  'Time: '+j.start+' - '+j.end,
  20,
  122
 );


 d.setFontSize(19);

 d.text(
  'Total: '+money(total),
  20,
  145
 );


 d.setFontSize(10);

 d.text(
  'Thank you for choosing Pure Shine Cleaning ✨',
  20,
  160
 );


 d.save(
  'Pure-Shine-Invoice-'+
  j.name.replace(
   /[^a-z0-9]+/gi,
   '-'
  )+
  '.pdf'
 );


 state.settings.invoiceNext++;

 save();

 render();

 toast(
  'Invoice PDF created ✓'
 );

}


/* REMINDERS */

function openReminder(){

 show(`

  <h2>
   Payment reminder
  </h2>


  <div class="form">

   <label>

    Message

    <textarea
     id="msg"
     rows="6"
    >Hi, just a friendly reminder that payment for your recent cleaning is still outstanding. Thank you, Georgiana – Pure Shine Cleaning ✨</textarea>

   </label>

  </div>

    "

 `);

}


/* INVOICE NUMBER */

function editInvoicePrefix(){

 let v=prompt(
  'Invoice prefix',
  state.settings.invoicePrefix
 );

 if(v!==null){

  state.settings.invoicePrefix=v;

  save();

  render();

  toast(
   'Invoice numbering saved ✓'
  );

 }

}


/* HOLIDAYS */

function addHoliday(){

 let n=prompt(
  'Holiday name',
  'Holiday'
 );

 if(!n)return;

 let s=prompt(
  'Start date YYYY-MM-DD',
  dateKey()
 );

 let e=prompt(
  'End date YYYY-MM-DD',
  s
 );

 if(s&&e){

  state.holidays.push({
   name:n,
   start:s,
   end:e
  });

  save();

  render();

  toast(
   'Holiday saved ✓'
  );

 }

}


function removeHoliday(i){

 state.holidays.splice(i,1);

 save();

 render();

}


/* FREE TIME */

function findFreeTime(){

 alert(
  'Based on your current schedule, the app will show the next available working time here.'
 );

}


/* BACKUP */

function backup(){

 let a=document.createElement('a');

 a.href=
  URL.createObjectURL(
   new Blob(
    [JSON.stringify(state,null,2)],
    {type:'application/json'}
   )
  );

 a.download=
  'pure-shine-backup.json';

 a.click();

}


/* CALENDAR EXPORT */

function exportCalendar(){

 let v=[

  'BEGIN:VCALENDAR',

  'VERSION:2.0',

  'PRODID:-//Pure Shine//EN'

 ];

 state.jobs.forEach(j=>{

  v.push(

   'BEGIN:VEVENT',

   'DTSTART:'+
   j.date.replaceAll('-','')+
   'T090000',

   'DTEND:'+
   j.date.replaceAll('-','')+
   'T100000',

   'SUMMARY:'+
   j.name+
   ' Cleaning',

   'END:VEVENT'

  );

 });

 v.push(
  'END:VCALENDAR'
 );

 let a=document.createElement('a');

 a.href=
  URL.createObjectURL(
   new Blob(
    [v.join('\r\n')],
    {type:'text/calendar'}
   )
  );

 a.download=
  'pure-shine-calendar.ics';

 a.click();

}


/* RESET */

function resetApp(){

 if(
  confirm(
   'Reset the application?'
  )
 ){

  state=structuredClone(
   initial
  );

  save();

  render();

  toast(
   'Application reset ✓'
  );

 }

}


/* MODAL */

function show(x){

 $('modal').innerHTML=x;

 $('back').classList.add(
  'show'
 );

}


function closeModal(){

 $('back').classList.remove(
  'show'
 );

}


function toast(t){

 let e=$('toast');

 e.textContent=t;

 e.classList.add('show');

 clearTimeout(window.tt);

 window.tt=setTimeout(
  ()=>e.classList.remove('show'),
  1800
 );

}


$('back').onclick=e=>{

 if(e.target.id==='back')
  closeModal();

};


/* START */

render();

</script>
