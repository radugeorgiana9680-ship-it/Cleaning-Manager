<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4c6da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light">
<link rel="apple-touch-icon" href="icon.png">
<title>Pure Shine Cleaning Manager ✨</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#343348;
    background:
        linear-gradient(rgba(249,246,251,.82),rgba(249,246,251,.92)),
        url("background.jpg") center/cover fixed no-repeat;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
}

.app{
    min-height:100vh;
    padding-bottom:95px;
}

.header{
    position:sticky;
    top:0;
    z-index:20;
    min-height:110px;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #eee5ed;
    backdrop-filter:blur(15px);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:68px;
    height:68px;
    border-radius:21px;
    object-fit:cover;
    background:#f2b8d0;
    box-shadow:0 7px 20px rgba(180,90,130,.18);
}

.logo-fallback{
    display:none;
    width:68px;
    height:68px;
    border-radius:21px;
    align-items:center;
    justify-content:center;
    background:#f2b8d0;
    font-size:32px;
}

.brand-title{
    font-size:27px;
    font-weight:850;
}

.brand-subtitle{
    color:#8b879c;
    font-size:15px;
    margin-top:3px;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    width:54px;
    height:54px;
    border-radius:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:#efabc8;
    color:white;
}

.header-btn.timer{
    background:#e5daf7;
    color:#655b7d;
}

.content{
    max-width:780px;
    margin:auto;
    padding:29px 20px 35px;
}

.greeting{
    margin:0;
    font-size:40px;
    line-height:1;
    letter-spacing:-1.5px;
}

.date{
    color:#8b879c;
    font-size:17px;
    margin-top:9px;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
    margin-top:29px;
}

.stat{
    min-height:145px;
    padding:19px;
    border-radius:27px;
}

.stat.jobs{background:#f8dce8}
.stat.hours{background:#e9e0f8}
.stat.earned{background:#ddf1e6}
.stat.available{background:#fff0c9}

.stat-icon{
    font-size:27px;
}

.stat-label{
    color:#777388;
    margin-top:8px;
    font-size:16px;
}

.stat-value{
    font-size:30px;
    font-weight:850;
    margin-top:4px;
}

.section{
    margin-top:30px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
}

.section-title{
    margin:0;
    font-size:27px;
    font-weight:850;
}

.text-btn{
    background:none;
    color:#b25d87;
    font-weight:800;
}

.schedule-card{
    background:white;
    border-radius:24px;
    padding:16px;
    margin-bottom:11px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 7px 22px rgba(60,50,75,.07);
}

.schedule-line{
    width:9px;
    min-height:60px;
    border-radius:20px;
    background:#e6a7c5;
}

.schedule-info{
    flex:1;
    min-width:0;
}

.schedule-name{
    font-size:20px;
    font-weight:850;
}

.schedule-time{
    color:#8a869a;
    font-size:15px;
    margin-top:4px;
}

.schedule-actions{
    display:flex;
    gap:5px;
    align-items:center;
}

.hours-input{
    width:70px;
    height:42px;
    border:1px solid #ddd6e2;
    border-radius:12px;
    text-align:center;
    background:#faf8fc;
    font-weight:800;
}

.small-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#eee6f8;
    color:#655982;
}

.small-btn.pink{
    background:#f5d9e7;
}

.small-btn.red{
    background:#ffe8ee;
    color:#bd5473;
}

.running{
    background:#d993b7!important;
    color:white!important;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.quick{
    min-height:94px;
    padding:17px;
    border-radius:23px;
    text-align:left;
    color:#403c51;
    font-weight:800;
}

.quick.pink{background:#f8dce8}
.quick.purple{background:#e9e0f8}
.quick.green{background:#ddf1e6}
.quick.blue{background:#e1eef8}

.quick-icon{
    display:block;
    font-size:27px;
    margin-bottom:7px;
}

.quote{
    margin-top:18px;
    padding:22px;
    border-radius:24px;
    background:white;
    text-align:center;
}

.quote-main{
    font-family:Georgia,serif;
    font-size:18px;
    font-weight:700;
}

.quote-sub{
    margin-top:6px;
    color:#9993a4;
    font-size:13px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:100;
    height:80px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:rgba(255,255,255,.98);
    border-top:1px solid #e9e3eb;
    padding-bottom:env(safe-area-inset-bottom);
}

.nav{
    background:none;
    color:#8a8698;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:11px;
    font-weight:800;
}

.nav-icon{
    font-size:22px;
}

.nav.active{
    color:#b45d87;
}

.primary{
    min-height:48px;
    padding:0 18px;
    border-radius:15px;
    background:#df99ba;
    color:white;
    font-weight:800;
}

.secondary{
    min-height:45px;
    padding:0 15px;
    border-radius:14px;
    background:#eee7f8;
    color:#665a83;
    font-weight:800;
}

.danger{
    min-height:45px;
    padding:0 15px;
    border-radius:14px;
    background:#ffe8ee;
    color:#bd5473;
    font-weight:800;
}

.empty{
    background:rgba(255,255,255,.75);
    border-radius:23px;
    padding:35px 15px;
    text-align:center;
    color:#8d8798;
}

.empty-icon{
    font-size:42px;
    margin-bottom:8px;
}

.card{
    background:white;
    padding:18px;
    border-radius:23px;
    margin-bottom:12px;
    box-shadow:0 7px 22px rgba(60,50,75,.06);
}

.card-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.card-name{
    font-size:20px;
    font-weight:850;
}

.card-details{
    color:#858094;
    font-size:14px;
    line-height:1.6;
    margin-top:6px;
}

.badge{
    height:max-content;
    padding:6px 10px;
    border-radius:10px;
    font-size:10px;
    font-weight:800;
}

.badge.agency{
    background:#e9e0f8;
    color:#6c5a92;
}

.badge.private{
    background:#f8dce8;
    color:#a54f76;
}

.card-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.modal-bg{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(35,29,44,.42);
}

.modal{
    width:100%;
    max-width:620px;
    max-height:92vh;
    overflow-y:auto;
    padding:23px 20px 40px;
    border-radius:30px 30px 0 0;
    background:#fbf9fc;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal-title{
    margin:0;
    font-size:27px;
    font-weight:850;
}

.close{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#eee8f1;
    font-size:25px;
    color:#595469;
}

.form-group{
    margin-bottom:15px;
}

.label{
    display:block;
    margin-bottom:7px;
    color:#777287;
    font-size:13px;
    font-weight:800;
}

.control{
    width:100%;
    min-height:52px;
    padding:11px 13px;
    border:1px solid #ddd6e2;
    border-radius:15px;
    background:white;
    color:#383548;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.timer-box{
    padding:24px;
    border-radius:27px;
    background:linear-gradient(135deg,#f8dce8,#e8def7);
    text-align:center;
}

.timer-display{
    font-size:48px;
    font-weight:850;
    margin:12px 0 22px;
    letter-spacing:2px;
}

.timer-info{
    margin-top:15px;
    padding:16px;
    border-radius:18px;
    background:rgba(255,255,255,.72);
}

.timer-big{
    display:block;
    margin:5px 0 12px;
    font-size:28px;
    font-weight:850;
    color:#b04f7c;
}

.earnings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.earning{
    padding:20px;
    border-radius:23px;
}

.earning.green{background:#ddf1e6}
.earning.pink{background:#f8dce8}
.earning.yellow{background:#fff0c9}
.earning.purple{background:#e9e0f8}

.earning-label{
    color:#777287;
    font-size:13px;
}

.earning-value{
    font-size:28px;
    font-weight:850;
    margin-top:5px;
}

@media(max-width:500px){
    .content{
        padding:28px 18px 35px;
    }

    .greeting{
        font-size:37px;
    }

    .brand-title{
        font-size:24px;
    }

    .brand-subtitle{
        font-size:14px;
    }

    .logo,
    .logo-fallback{
        width:62px;
        height:62px;
    }

    .header-btn{
        width:50px;
        height:50px;
    }

    .schedule-card{
        padding:14px;
    }

    .schedule-name{
        font-size:18px;
    }

    .hours-input{
        width:62px;
    }
}

@media(max-width:370px){
    .schedule-actions{
        gap:3px;
    }

    .hours-input{
        width:55px;
    }

    .small-btn{
        width:39px;
        height:39px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   DATA
========================================================= */

var STORAGE_KEY = "pure_shine_manager_v7";
var TIMER_KEY = "pure_shine_timer_v7";

var defaultClients = [
    {
        id:1,
        name:"Lottie",
        type:"Agency",
        rate:16,
        day:"Monday",
        start:"13:00",
        end:"15:00"
    },
    {
        id:2,
        name:"Christine",
        type:"Private",
        rate:18,
        day:"Tuesday",
        start:"09:30",
        end:"12:30"
    },
    {
        id:3,
        name:"Matt",
        type:"Agency",
        rate:16,
        day:"Tuesday",
        start:"13:30",
        end:"17:30"
    },
    {
        id:4,
        name:"Sonia",
        type:"Agency",
        rate:16,
        day:"Wednesday",
        start:"09:00",
        end:"14:00"
    },
    {
        id:5,
        name:"Laura",
        type:"Private",
        rate:18,
        day:"Thursday",
        start:"09:00",
        end:"13:00"
    },
    {
        id:6,
        name:"Hannah",
        type:"Agency",
        rate:16,
        day:"Thursday",
        start:"13:00",
        end:"16:00"
    }
];

var data;

try{
    data = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    );
}catch(e){
    data = null;
}

if(!data || !Array.isArray(data.clients)){
    data = {
        clients: defaultClients,
        jobs: []
    };
}

if(!Array.isArray(data.jobs)){
    data.jobs = [];
}

/* Gill is explicitly removed */
data.clients = data.clients.filter(function(c){
    return String(c.name).toLowerCase() !== "gill";
});

/* Remove Gill from stored jobs as well */
data.jobs = data.jobs.filter(function(j){
    return String(j.clientName || "").toLowerCase() !== "gill";
});

function saveData(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

saveData();

/* =========================================================
   TIMER
========================================================= */

var timer = {
    running:false,
    clientId:null,
    startedAt:null,
    accumulated:0
};

try{
    var savedTimer =
        JSON.parse(
            localStorage.getItem(TIMER_KEY)
        );

    if(savedTimer){
        timer = savedTimer;
    }
}catch(e){}

function saveTimer(){
    localStorage.setItem(
        TIMER_KEY,
        JSON.stringify(timer)
    );
}

saveTimer();

/* =========================================================
   STATE
========================================================= */

var currentPage = "home";

/* =========================================================
   HELPERS
========================================================= */

function esc(value){
    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function money(value){
    return "£" + Number(value || 0).toFixed(2);
}

function today(){
    var d = new Date();

    return d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0");
}

function todayDay(){
    return new Date().toLocaleDateString(
        "en-GB",
        {weekday:"long"}
    );
}

function minutes(time){
    if(!time) return 0;

    var p = time.split(":");

    return Number(p[0])*60 +
           Number(p[1]);
}

function duration(start,end){
    return Math.max(
        0,
        (minutes(end)-minutes(start))/60
    );
}

function formatDate(date){
    return new Date(
        date + "T12:00:00"
    ).toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}

function findClient(id){
    return data.clients.find(function(c){
        return Number(c.id) === Number(id);
    });
}

/* =========================================================
   TIMER FUNCTIONS
========================================================= */

function timerSeconds(){

    if(!timer.running){
        return Number(timer.accumulated || 0);
    }

    return Number(timer.accumulated || 0) +
        Math.floor(
            (Date.now() - Number(timer.startedAt))/1000
        );
}

function timerText(seconds){

    seconds = Math.max(
        0,
        Math.floor(seconds)
    );

    var h = Math.floor(seconds/3600);
    var m = Math.floor((seconds%3600)/60);
    var s = seconds%60;

    return String(h).padStart(2,"0") +
        ":" +
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0");
}

function timerHours(){
    return timerSeconds()/3600;
}

function startTimer(id){

    if(timer.running){

        if(Number(timer.clientId) === Number(id)){
            showTimer(id);
        }else{
            alert("A timer is already running for another client.");
        }

        return;
    }

    timer = {
        running:true,
        clientId:Number(id),
        startedAt:Date.now(),
        accumulated:0
    };

    saveTimer();

    showTimer(id);
    render();
}

function stopTimer(){

    if(!timer.running){
        return;
    }

    var client = findClient(timer.clientId);

    if(!client){
        resetTimer();
        return;
    }

    var seconds = timerSeconds();
    var hours = Number((seconds/3600).toFixed(4));

    var now = new Date();
    var started = new Date(Number(timer.startedAt));

    var start = started.toLocaleTimeString(
        "en-GB",
        {hour:"2-digit",minute:"2-digit"}
    );

    var end = now.toLocaleTimeString(
        "en-GB",
        {hour:"2-digit",minute:"2-digit"}
    );

    var existing = data.jobs.find(function(j){
        return j.date === today() &&
            Number(j.clientId) === Number(client.id);
    });

    if(existing){

        existing.start = start;
        existing.end = end;
        existing.hours = hours;
        existing.price = hours * Number(client.rate);
        existing.timerSeconds = seconds;

    }else{

        data.jobs.push({
            id:Date.now(),
            clientId:client.id,
            clientName:client.name,
            rate:client.rate,
            date:today(),
            start:start,
            end:end,
            hours:hours,
            price:hours * Number(client.rate),
            status:"Paid",
            timerSeconds:seconds
        });

    }

    resetTimer();
    saveData();
    closeModal();
    render();
}

function resetTimer(){

    timer = {
        running:false,
        clientId:null,
        startedAt:null,
        accumulated:0
    };

    saveTimer();
}

/* =========================================================
   HOME
========================================================= */

function homePage(){

    var todayClients = data.clients.filter(function(c){
        return c.day === todayDay();
    });

    todayClients.sort(function(a,b){
        return minutes(a.start)-minutes(b.start);
    });

    var todayJobs = data.jobs.filter(function(j){
        return j.date === today();
    });

    var totalHours = todayJobs.reduce(function(sum,j){
        return sum + Number(j.hours || 0);
    },0);

    var earned = todayJobs.reduce(function(sum,j){
        return sum + Number(j.price || 0);
    },0);

    var available = todayClients.reduce(function(sum,c){
        return sum + duration(c.start,c.end);
    },0);

    var html = "";

    html += '<h1 class="greeting">Good morning ✨</h1>';

    html += '<div class="date">' +
        new Date().toLocaleDateString(
            "en-GB",
            {
                weekday:"long",
                day:"numeric",
                month:"long"
            }
        ) +
        '</div>';

    html += '<div class="dashboard">';

    html += '<div class="stat jobs">';
    html += '<div class="stat-icon">🧹</div>';
    html += '<div class="stat-label">Jobs</div>';
    html += '<div class="stat-value">' +
        todayJobs.length +
        '</div>';
    html += '</div>';

    html += '<div class="stat hours">';
    html += '<div class="stat-icon">⏰</div>';
    html += '<div class="stat-label">Hours</div>';
    html += '<div class="stat-value">' +
        totalHours.toFixed(2) +
        'h</div>';
    html += '</div>';

    html += '<div class="stat earned">';
    html += '<div class="stat-icon">💷</div>';
    html += '<div class="stat-label">Earned</div>';
    html += '<div class="stat-value">' +
        money(earned) +
        '</div>';
    html += '</div>';

    html += '<div class="stat available">';
    html += '<div class="stat-icon">✨</div>';
    html += '<div class="stat-label">Available</div>';
    html += '<div class="stat-value">' +
        available.toFixed(1) +
        'h</div>';
    html += '</div>';

    html += '</div>';

    html += '<section class="section">';

    html += '<div class="section-head">';
    html += '<h2 class="section-title">Today\'s schedule</h2>';
    html += '<button class="text-btn" onclick="go(\'schedule\')">View all</button>';
    html += '</div>';

    if(todayClients.length === 0){

        html += '<div class="empty">';
        html += '<div class="empty-icon">✨</div>';
        html += 'No cleaning scheduled today.';
        html += '</div>';

    }else{

        todayClients.forEach(function(client){
            html += scheduleCard(client);
        });

    }

    html += '</section>';

    html += '<section class="section">';
    html += '<div class="section-head">';
    html += '<h2 class="section-title">Quick actions</h2>';
    html += '</div>';

    html += '<div class="quick-grid">';

    html += '<button class="quick pink" onclick="openTimerSelector()">';
    html += '<span class="quick-icon">⏱️</span>';
    html += 'Start Timer';
    html += '</button>';

    html += '<button class="quick purple" onclick="openJobForm()">';
    html += '<span class="quick-icon">➕</span>';
    html += 'Add Cleaning Job';
    html += '</button>';

    html += '<button class="quick green" onclick="go(\'jobs\')">';
    html += '<span class="quick-icon">📋</span>';
    html += 'View Jobs';
    html += '</button>';

    html += '<button class="quick blue" onclick="go(\'earnings\')">';
    html += '<span class="quick-icon">💷</span>';
    html += 'Earnings';
    html += '</button>';

    html += '</div>';
    html += '</section>';

    html += '<div class="quote">';
    html += '<div class="quote-main">“A clean space is a happy place ♡”</div>';
    html += '<div class="quote-sub">Pure Shine Cleaning</div>';
    html += '</div>';

    return html;
}

/* =========================================================
   TODAY SCHEDULE CARD
========================================================= */

function scheduleCard(client){

    var existing = data.jobs.find(function(j){
        return j.date === today() &&
            Number(j.clientId) === Number(client.id);
    });

    var hours = existing ?
        Number(existing.hours || 0) :
        duration(client.start,client.end);

    var running =
        timer.running &&
        Number(timer.clientId) === Number(client.id);

    var html = "";

    html += '<div class="schedule-card">';

    html += '<div class="schedule-line"></div>';

    html += '<div class="schedule-info">';
    html += '<div class="schedule-name">' +
        esc(client.name) +

/* =========================================================
   CHANGE HOURS
========================================================= */

function changeHours(clientId,value){

    var client = findClient(clientId);

    if(!client) return;

    var hours = Math.max(
        0,
        Number(value) || 0
    );

    var job = data.jobs.find(function(j){
        return j.date === today() &&
            Number(j.clientId) === Number(client.id);
    });

    if(!job){

        data.jobs.push({
            id:Date.now(),
            clientId:client.id,
            clientName:client.name,
            rate:client.rate,
            date:today(),
            start:client.start,
            end:client.end,
            hours:hours,
            price:hours*Number(client.rate),
            status:"Paid",
            timerSeconds:0
        });

    }else{

        job.hours = hours;
        job.price = hours*Number(client.rate);

    }

    saveData();
    render();
}

function saveClient(id){

    var name = document.getElementById("clientName").value.trim();
    var type = document.getElementById("clientType").value;
    var rate = Number(document.getElementById("clientRate").value);
    var day = document.getElementById("clientDay").value;
    var start = document.getElementById("clientStart").value;
    var end = document.getElementById("clientEnd").value;

    if(!name){
        alert("Please enter a client name.");
        return;
    }

    if(name.toLowerCase() === "gill"){
        alert("Gill is excluded from this version.");
        return;
    }

    if(!rate || rate <= 0){
        alert("Please enter a valid hourly rate.");
        return;
    }

    if(id){

        var client = findClient(id);

        if(client){

            client.name = name;
            client.type = type;
            client.rate = rate;
            client.day = day;
            client.start = start;
            client.end = end;

        }

    }else{

        data.clients.push({
            id:Date.now(),
            name:name,
            type:type,
            rate:rate,
            day:day,
            start:start,
            end:end
        });

    }

    saveData();
    closeModal();
    render();
}

function editClient(id){

    var client = findClient(id);

    if(client){
        openClientForm(client);
    }
}

function deleteClient(id,fromModal){

    var client = findClient(id);

    if(!client) return;

    if(!confirm("Delete " + client.name + " from your clients?")){
        return;
    }

    data.clients = data.clients.filter(function(c){
        return Number(c.id) !== Number(id);
    });

    saveData();

    if(fromModal){
        closeModal();
    }

    render();
}

function saveJob(id){

    var client = findClient(clientId);

    if(!client) return;

    var date =
        document.getElementById("jobDate").value;

    var start =
        document.getElementById("jobStart").value;

    var end =
        document.getElementById("jobEnd").value;

    var hours =
        Number(document.getElementById("jobHours").value);

    var status =
        document.getElementById("jobStatus").value;

    if(!hours){
        hours = duration(start,end);
    }

    var price = hours * Number(client.rate);

    if(id){

        var job = data.jobs.find(function(j){
            return Number(j.id) === Number(id);
        });

        if(job){

            job.clientId = client.id;
            job.clientName = client.name;
            job.rate = client.rate;
            job.date = date;
            job.start = start;
            job.end = end;
            job.hours = hours;
            job.price = price;
            job.status = status;

        }

    }else{

        data.jobs.push({
            id:Date.now(),
            clientId:client.id,
            clientName:client.name,
            rate:client.rate,
            date:date,
            start:start,
            end:end,
            hours:hours,
            price:price,
            status:status,
            timerSeconds:0
        });

    }

    saveData();
    closeModal();
    render();
}

/* =========================================================

function openModal(content){

    closeModal();

    var bg = document.createElement("div");

    bg.id = "modal";
    bg.className = "modal-bg";

    var box = document.createElement("div");

    box.className = "modal";
    box.innerHTML = content;

    box.onclick = function(e){
        e.stopPropagation();
    };

    bg.appendChild(box);

    bg.onclick = function(){
        closeModal();
    };

    document.body.appendChild(bg);
}

function closeModal(){

    var old = document.getElementById("modal");

    if(old){
        old.remove();
    }
}

        document.getElementById("timerMoney");

    if(display){
        display.textContent =
            timerText(timerSeconds());
    }

    if(hours){
        hours.textContent =
            timerHours().toFixed(2) + " h";
    }

    var client = findClient(timer.clientId);

    if(moneyBox && client){

        moneyBox.textContent =
            money(
                timerHours() *
                Number(client.rate)
            );

    }

},1000);

/* =========================================================
   WHEN RETURNING TO APP
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden && timer.running){

            var display =
                document.getElementById("timerDisplay");

            if(display){
                display.textContent =
                    timerText(timerSeconds());
            }

        }

    }
);

/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
