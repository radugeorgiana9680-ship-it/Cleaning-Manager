
<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4c5d6">
<title>Pure Shine Cleaning Manager</title>
<style>
:root{--pink:#f4c5d6;--pink2:#fff0f5;--gold:#c6a15b;--lav:#e7def6;--sage:#dceee2;--blue:#dceaf8;--cream:#fff5e6;--ink:#403540;--muted:#817681;--line:#f0e2e9;--shadow:0 8px 25px #6c4a5b12}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff9fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{max-width:900px;margin:auto;padding:14px 14px 110px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
.brand{display:flex;gap:11px;align-items:center}
.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--gold));display:grid;place-items:center;font-size:28px}
h1{font:700 24px Georgia,serif;margin:0;color:#594653}
.sub,.muted{font-size:13px;color:var(--muted);line-height:1.5}
.sub{font-size:12px;margin-top:4px}
.iconbtn{border:0;background:white;border-radius:16px;width:48px;height:48px;box-shadow:var(--shadow);font-size:24px;color:#ad6685}
.hero{background:linear-gradient(135deg,#f8dce7,#eee5fa 60%,#fff2dc);border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8b6e7e;font-weight:800}
.hero h2{font:700 24px Georgia,serif;margin:8px 0}
.hero p{margin:0;color:#776875}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}
.stat{border-radius:20px;padding:15px;background:white;box-shadow:var(--shadow);min-width:0}
.stat:nth-child(1){background:var(--pink2)}.stat:nth-child(2){background:var(--sage)}.stat:nth-child(3){background:var(--lav)}.stat:nth-child(4){background:var(--cream)}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat strong{font-size:22px;display:block;margin-top:5px;overflow-wrap:anywhere}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sectionhead h2{margin:0;font:700 20px Georgia,serif}
.btn{border:0;border-radius:15px;padding:12px 15px;background:var(--pink);color:#603d4d;font-weight:750}
.btn.primary{background:linear-gradient(135deg,#edb4c9,#d5b879);color:#fff}
.btn.soft{background:#f8e7ee}.btn.small{padding:8px 10px;font-size:13px}
.btn.danger{background:#f8dddd;color:#913f4b}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.card{background:white;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow);margin:9px 0}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}
.item{padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.itemtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item strong{font-size:16px}
.pill{display:inline-block;padding:4px 8px;border-radius:10px;font-size:11px;font-weight:800;background:var(--lav);margin:3px 4px 0 0}
.pill.green{background:var(--sage)}.pill.pink{background:var(--pink2)}.pill.gold{background:var(--cream)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.field{margin:12px 0}
.field label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}
.field input,.field select,.field textarea,input,select,textarea{width:100%;min-width:0;border:1.5px solid #e9dce4;background:white;border-radius:13px;padding:12px;color:var(--ink);font-size:16px}
.field textarea{min-height:80px;resize:vertical}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);box-shadow:0 -8px 25px #6c4a5b12}
.nav button{border:0;background:transparent;border-radius:14px;padding:6px 0;color:#8b7d88;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.nav button span{font-size:23px;line-height:1.1}
.nav button.active{color:#a64f75;background:#fff0f5;font-weight:800}
.modalback{display:none;position:fixed;inset:0;z-index:60;background:#32253075;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:720px;max-height:92dvh;overflow:auto;background:#fffafd;border-radius:27px 27px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 40px #38233330}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modalhead h2{margin:0;font:700 22px Georgia,serif}
.close{width:40px;height:40px;border:0;border-radius:50%;background:#f7e5ed;color:#9c5471;font-size:25px}
.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}
.tab{border:0;border-radius:12px;padding:9px 12px;background:#f2eaf1;color:#685c68;font-weight:750;white-space:nowrap}
.tab.active{background:#e9c1d1;color:#75445a}
.notice{background:#fff5dd;border-radius:14px;padding:12px;font-size:13px;line-height:1.45;margin:10px 0}
.hidden{display:none!important}.wide{width:100%}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{left:50%;right:auto;transform:translateX(-50%);width:min(900px,100%);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}.modalback{align-items:center;padding:20px}.modal{border-radius:26px;max-height:88dvh}}
@media(max-width:360px){.app{padding-left:10px;padding-right:10px}.hero h2{font-size:21px}.nav button{font-size:10px}.nav button span{font-size:20px}.btn{padding:11px 12px}}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="brand"><div class="logo">✨</div><div><h1>Pure Shine</h1><div class="sub">Cleaning Manager · Business planner</div></div></div>
 <button class="iconbtn" onclick="openAddMenu()" aria-label="Adaugă">＋</button>
</header>
<div id="view"></div>
</main>
<nav class="nav" aria-label="Navigare">
 <button data-page="home" class="active" onclick="go('home')"><span>⌂</span>Acasă</button>
 <button data-page="schedule" onclick="go('schedule')"><span>▦</span>Calendar</button>
 <button data-page="clients" onclick="go('clients')"><span>♙</span>Clienți</button>
 <button data-page="money" onclick="go('money')"><span>£</span>Financiar</button>
 <button data-page="more" onclick="go('more')"><span>☷</span>Mai mult</button>
</nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()">
 <section class="modal" id="modal" role="dialog" aria-modal="true"></section>
</div>
<input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importBackup(event)">
<script>
'use strict';
const KEY='pureShineManager_v5';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now()+Math.floor(Math.random()*10000);
const initial={
 version:5,
 settings:{zoom:100,reminderTime:'20:00',businessName:'Pure Shine Cleaning',businessEmail:'',businessPhone:'',businessAddress:'',invoicePrefix:'PSC',invoiceNext:1},
 clients:[],jobs:[],payments:[],invoices:[],expenses:[],holidays:[],history:[],activeTimer:null
};
let db=loadDB(),page='home',scheduleDate=today(),scheduleMode='week',clientSearch='',moneyFilter='month';
function loadDB(){
 let x=null;
 try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(!x){
  for(const k of ['pureShineManager_v4','pureShineCleaningManager','pureShineManager_v3','pureShineManager_v2','pureShineManager']){
   try{const old=JSON.parse(localStorage.getItem(k)||'null');if(old&&typeof old==='object'){x=old;break}}catch(e){}
  }
 }
 if(!x)return structuredClone(initial);
 return {...structuredClone(initial),...x,settings:{...initial.settings,...(x.settings||{})},
 clients:Array.isArray(x.clients)?x.clients:[],jobs:Array.isArray(x.jobs)?x.jobs:[],
 payments:Array.isArray(x.payments)?x.payments:[],invoices:Array.isArray(x.invoices)?x.invoices:[],
 expenses:Array.isArray(x.expenses)?x.expenses:[],holidays:Array.isArray(x.holidays)?x.holidays:[],
 history:Array.isArray(x.history)?x.history:[]};
}
const PRESETS=[
 {name:'Lottie',type:'Agency',rate:16,frequency:'Săptămânal',day:'Luni',start:'13:00',end:'15:00'},
 {name:'Christine',type:'Private',rate:18,frequency:'La 2 săptămâni',day:'Marți',start:'09:30',end:'12:30',anchorDate:'2026-10-13'},
 {name:'Matt',type:'Agency',rate:16,frequency:'Săptămânal',day:'Marți',start:'09:00',end:'13:00',durationHours:4},
 {name:'Sonia',type:'Agency',rate:16,frequency:'Săptămânal',day:'Miercuri',start:'09:00',end:'14:00'},
 {name:'Laura',type:'Private',rate:18,frequency:'Săptămânal',day:'Joi',start:'09:00',end:'13:00'},
 {name:'Hannah',type:'Agency',rate:16,frequency:'Săptămânal',day:'Joi',start:'13:00',end:'16:00'},
 {name:'Meghan',type:'Private',rate:null,frequency:'Ocazional',day:'Nesetată',start:'',end:''},
 {name:'Johanna',type:'Private',rate:null,frequency:'La 2 săptămâni',day:'Vineri',start:'',end:'',week:'A',anchorWeek:'2026-10-05'},
 {name:'Sindu',type:'Agency',rate:16,frequency:'La 2 săptămâni',day:'Vineri',start:'',end:'',week:'B',anchorWeek:'2026-10-05'},
 {name:'Peter',type:'Private',rate:null,frequency:'Ocazional',day:'Nesetată',start:'',end:''},
 {name:'Mike',type:'Private',rate:null,frequency:'La 3 săptămâni',day:'Nesetată',start:'',end:'',durationHours:2}
];
function normName(v){return String(v||'').toLowerCase().replace(/[^a-z]/g,'')}
function presetFor(c){return PRESETS.find(p=>normName(p.name)===normName(c.name)||(normName(c.name)==='joanna'&&p.name==='Johanna'))}
function seedClients(){
 let changed=false;
 for(const p of PRESETS){
  let c=db.clients.find(x=>normName(x.name)===normName(p.name)||(p.name==='Johanna'&&normName(x.name)==='joanna'));
  if(!c){db.clients.push({id:uid(),phone:'',address:'',notes:'',archived:false,...p,schedulePresetVersion:1});changed=true}
  else if(!c.schedulePresetVersion){
   for(const k of ['type','rate','frequency','day','start','end','week','anchorDate','anchorWeek','durationHours'])if(p[k]!==undefined)c[k]=p[k];
   c.schedulePresetVersion=1;changed=true;
  }
 }
 const gill=db.clients.find(c=>normName(c.name)==='gill');
 if(gill&&!gill.archived){gill.archived=true;changed=true}
 if(changed)history('Program standard configurat','Clienții și orele standard au fost configurate; istoricul lucrărilor a fost păstrat.');
 return changed;
}
const DAY={'Luni':1,'Marți':2,'Miercuri':3,'Joi':4,'Vineri':5,'Sâmbătă':6,'Duminică':0};
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateObj(s){return new Date(`${s}T12:00:00`)}
function monday(s){let d=dateObj(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function daysBetween(a,b){return Math.round((dateObj(b)-dateObj(a))/86400000)}
function minutes(t){if(!t||!t.includes(':'))return 0;const [h,m]=t.split(':').map(Number);return h*60+m}
function duration(a,b){let n=minutes(b)-minutes(a);if(n<0)n+=1440;return Math.max(0,n)/60}
function hoursText(h){const n=Math.round((Number(h)||0)*60);return `${Math.floor(n/60)} h ${n%60} min`}
function money(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0)}
function dateText(s){if(!s)return '';return dateObj(s).toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getClient(id){return db.clients.find(c=>String(c.id)===String(id))}
function jobHours(j){return Number.isFinite(j.actualMinutes)?j.actualMinutes/60:duration(j.start,j.end)}
function completed(){return db.jobs.filter(j=>j.status==='Finalizat')}
function realized(){return completed().reduce((s,j)=>s+(Number(j.price)||0),0)}
function received(){return db.payments.reduce((s,p)=>s+(Number(p.amount)||0),0)}
function expensesTotal(){return db.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0)}
function paid(i){return db.payments.filter(p=>String(p.invoiceId)===String(i.id)).reduce((s,p)=>s+(Number(p.amount)||0),0)}
function balance(i){return Math.max(0,(Number(i.total)||0)-paid(i))}
function history(action,details=''){db.history.unshift({id:uid(),at:new Date().toISOString(),action,details});db.history=db.history.slice(0,250)}
function save(action='Date salvate'){try{if(action)history(action);localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Nu s-au putut salva datele. Descarcă un backup și încearcă din nou.');return false}}
function occurs(c,date){
 if(!c||c.archived||!c.day||c.day==='Nesetată'||DAY[c.day]===undefined||!c.start||!c.end)return false;
 if(dateObj(date).getDay()!==DAY[c.day]||minutes(c.start)===minutes(c.end))return false;
 if(c.frequency==='Ocazional')return false;
 if(c.frequency==='La 2 săptămâni'){
  if(c.anchorDate){let n=daysBetween(c.anchorDate,date);return n>=0&&n%14===0}
  const a=monday(c.anchorWeek||'2026-10-05'),b=monday(date),weeks=Math.round((b-a)/604800000);
  return ((weeks%2)+2)%2===(c.week==='B'?1:0);
 }
 if(c.frequency==='La 3 săptămâni')return !!c.anchorDate&&daysBetween(c.anchorDate,date)>=0&&daysBetween(c.anchorDate,date)%21===0;
 return c.frequency==='Săptămânal';
}
function generateRecurring(){
 let changed=false;
 for(const j of db.jobs){
  if(!j.autoGenerated||j.status!=='Programat'||j.date<today())continue;
  const c=getClient(j.clientId);if(!c||!occurs(c,j.date))continue;
  const rate=Number(c.rate)||0,price=Math.round(duration(c.start,c.end)*rate*100)/100;
  if(j.start!==c.start||j.end!==c.end||Number(j.rate)!==rate||Number(j.price)!==price){j.start=c.start;j.end=c.end;j.rate=rate;j.price=price;changed=true}
 }
 for(let n=0;n<84;n++){
  const d=dateObj(today());d.setDate(d.getDate()+n);const date=iso(d);
  for(const c of db.clients){
   if(!occurs(c,date))continue;
   if(db.holidays.some(h=>String(h.clientId)===String(c.id)&&date>=h.from&&date<=h.to))continue;
   if(db.jobs.some(j=>String(j.clientId)===String(c.id)&&j.date===date))continue;
   const rate=Number(c.rate)||0;
   db.jobs.push({id:uid(),clientId:c.id,date,start:c.start,end:c.end,rate,price:Math.round(duration(c.start,c.end)*rate*100)/100,status:'Programat',notes:'',autoGenerated:true});
   changed=true;
  }
 }
 if(changed)db.jobs.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 return changed;
}
function setView(html){document.getElementById('view').innerHTML=html;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function go(p){page=p;render()}
function render(){if(page==='home')renderHome();else if(page==='schedule')renderSchedule();else if(page==='clients')renderClients();else if(page==='money')renderMoney();else renderMore()}
function jobCard(j){
 const c=getClient(j.clientId);
 return `<div class="item"><div class="itemtop"><div><strong>${esc(c?.name||'Client')}</strong><div class="muted">${dateText(j.date)} · ${esc(j.start||'')}–${esc(j.end||'')} · ${hoursText(jobHours(j))}</div><span class="pill ${j.status==='Finalizat'?'green':j.status==='Anulat'?'pink':'gold'}">${esc(j.status)}</span></div><div style="text-align:right"><strong>${money(j.price)}</strong><div class="muted">${esc(c?.type||'')}</div></div></div><div class="btnrow" style="margin-top:9px"><button class="btn small soft" onclick="jobForm(${j.id})">Editează</button>${j.status!=='Finalizat'&&j.status!=='Anulat'?`<button class="btn small" onclick="startTimer(${j.id})">▶ Timer</button><button class="btn small" onclick="finishJob(${j.id})">Finalizează</button>`:''}<button class="btn small danger" onclick="deleteJob(${j.id})">Șterge</button></div></div>`;
}
function renderHome(){
 const list=db.jobs.filter(j=>j.date===today()&&j.status!=='Anulat').sort((a,b)=>a.start.localeCompare(b.start));
 const upcoming=db.jobs.filter(j=>j.date>today()&&j.status==='Programat').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,3);
 setView(`<section class="hero"><div class="eyebrow">${dateText(today())}</div><h2>Bună! Hai să organizăm ziua ✨</h2><p>Tot ce ai nevoie pentru Pure Shine Cleaning, într-un singur loc.</p><div class="btnrow" style="margin-top:15px"><button class="btn primary" onclick="jobForm()">＋ Adaugă job</button><button class="btn" onclick="clientForm()">＋ Client nou</button></div></section>
 <div class="stats"><div class="stat"><span>Venit realizat</span><strong>${money(realized())}</strong></div><div class="stat"><span>Bani încasați</span><strong>${money(received())}</strong></div><div class="stat"><span>De încasat</span><strong>${money(db.invoices.reduce((s,i)=>s+balance(i),0))}</strong></div><div class="stat"><span>Ore finalizate</span><strong>${hoursText(completed().reduce((s,j)=>s+jobHours(j),0))}</strong></div></div>
 ${db.activeTimer?`<div class="card"><b>⏱️ Cronometru activ</b><p class="muted">${esc(getClient(db.activeTimer.clientId)?.name||'Client')}</p><div id="timerReadout" style="font-size:26px;font-weight:850">${timerElapsed()}</div><div class="btnrow"><button class="btn primary" onclick="timerFinish()">Finalizează jobul</button><button class="btn" onclick="timerPauseResume()">${db.activeTimer.pausedAt?'Continuă':'Pauză'}</button></div></div>`:''}
 <div class="sectionhead"><h2>Programul de azi</h2><button class="btn small soft" onclick="go('schedule')">Calendar →</button></div><div class="card">${list.length?list.map(jobCard).join(''):'<div class="empty">🌸<br><b>Nu ai joburi programate astăzi.</b></div>'}</div>
 <div class="sectionhead"><h2>Urmează</h2></div><div class="card">${upcoming.length?upcoming.map(jobCard).join(''):'<div class="empty">Nu există alte joburi programate.</div>'}</div>
 <div class="sectionhead"><h2>Acces rapid</h2></div><div class="grid2"><button class="btn" onclick="invoiceForm()">🧾 Creează factură</button><button class="btn" onclick="expenseForm()">🛍️ Adaugă cheltuială</button><button class="btn" onclick="openForecast()">📈 Previziuni</button><button class="btn" onclick="exportBackup()">💾 Backup</button></div>`);
 startReadout();
}
function renderSchedule(){
 let dates=weekDates(scheduleDate);
 let jobs=db.jobs.filter(j=>scheduleMode==='all'||(scheduleMode==='day'?j.date===scheduleDate:dates.includes(j.date))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 setView(`<div class="sectionhead"><h2>Calendar & programări</h2><button class="btn primary" onclick="jobForm()">＋ Job</button></div><div class="card"><div class="grid2"><div class="field"><label>Data de referință</label><input type="date" value="${scheduleDate}" onchange="scheduleDate=this.value;renderSchedule()"></div><div class="field"><label>Vizualizare</label><select onchange="scheduleMode=this.value;renderSchedule()"><option value="week" ${scheduleMode==='week'?'selected':''}>Săptămâna</option><option value="day" ${scheduleMode==='day'?'selected':''}>Ziua aleasă</option><option value="all" ${scheduleMode==='all'?'selected':''}>Toate joburile</option></select></div></div><div class="btnrow"><button class="btn small" onclick="scheduleDate=shiftDate(scheduleDate,-7);renderSchedule()">← Săptămâna trecută</button><button class="btn small" onclick="scheduleDate=today();renderSchedule()">Astăzi</button><button class="btn small" onclick="scheduleDate=shiftDate(scheduleDate,7);renderSchedule()">Săptămâna următoare →</button></div></div><div class="card">${jobs.length?jobs.map(jobCard).join(''):'<div class="empty">Nu există joburi în această vizualizare.</div>'}</div>
 <div class="sectionhead"><h2>Clienți în vacanță</h2><button class="btn small" onclick="holidayForm()">＋ Vacanță</button></div><div class="card">${db.holidays.length?db.holidays.map(h=>`<div class="item"><strong>${esc(getClient(h.clientId)?.name||'Client')}</strong><div class="muted">${dateText(h.from)} – ${dateText(h.to)}</div><button class="btn small danger" onclick="deleteHoliday(${h.id})">Șterge vacanța</button></div>`).join(''):'<div class="empty">Nu ai înregistrat vacanțe.</div>'}</div>`);
}
function weekDates(s){let d=dateObj(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(x.getDate()+i);return iso(x)})}
function shiftDate(s,n){let d=dateObj(s);d.setDate(d.getDate()+n);return iso(d)}
function renderClients(){
 let list=db.clients.filter(c=>!c.archived&&(c.name+' '+(c.phone||'')+' '+(c.address||'')).toLowerCase().includes(clientSearch.toLowerCase()));

function saveClient(e,id){
 e.preventDefault();const f=new FormData(e.target),old=id?getClient(id):null;
 const c={...(old||{}),id:old?.id||uid(),name:f.get('name').trim(),phone:f.get('phone'),rate:f.get('rate')===''?null:Number(f.get('rate')),address:f.get('address'),type:f.get('type'),frequency:f.get('frequency'),day:f.get('day'),week:f.get('week'),start:f.get('start'),end:f.get('end'),notes:f.get('notes'),archived:false};
 if(c.frequency==='La 2 săptămâni'&&!c.anchorDate&&!c.anchorWeek)c.anchorWeek=today();
 if(c.frequency==='La 3 săptămâni'&&!c.anchorDate)c.anchorDate=today();
 if(old){
  const scheduleChanged=['day','start','end','rate','frequency','week','anchorDate','anchorWeek'].some(k=>old[k]!==c[k]);
  Object.assign(old,c);
  if(scheduleChanged)db.jobs=db.jobs.filter(j=>!(j.autoGenerated&&j.status==='Programat'&&j.date>=today()&&String(j.clientId)===String(old.id)));
 }else db.clients.push(c);
 save(old?'Client actualizat':'Client adăugat');generateRecurring();localStorage.setItem(KEY,JSON.stringify(db));closeModal();render();
}

function saveJob(e,id){
 e.preventDefault();const f=new FormData(e.target),old=id?db.jobs.find(x=>String(x.id)===String(id)):null;
 const start=f.get('start'),end=f.get('end'),rate=Number(f.get('rate')),hours=duration(start,end);
 if(hours<=0){alert('Verifică orele introduse.');return}
 const j={...(old||{}),id:old?.id||uid(),clientId:f.get('clientId'),date:f.get('date'),start,end,rate,price:Math.round(hours*rate*100)/100,status:f.get('status'),notes:f.get('notes'),autoGenerated:false};
 if(old)Object.assign(old,j);else db.jobs.push(j);
 save(old?'Programare editată':'Programare adăugată');generateRecurring();localStorage.setItem(KEY,JSON.stringify(db));closeModal();render();
}
function deleteJob(id){if(!confirm('Ștergi această programare?'))return;db.jobs=db.jobs.filter(j=>String(j.id)!==String(id));save('Programare ștearsă');render()}
function finishJob(id){
 const j=db.jobs.find(x=>String(x.id)===String(id));if(!j)return;
 const raw=prompt('Durata reală în minute:',String(Math.round(duration(j.start,j.end)*60)));
 if(raw===null)return;const mins=Number(raw);if(!Number.isFinite(mins)||mins<=0){alert('Introdu durata în minute.');return}
 j.actualMinutes=Math.round(mins);j.price=Math.round(mins/60*Number(j.rate)*100)/100;j.status='Finalizat';
 save('Job finalizat',getClient(j.clientId)?.name||'');render();
}
function startTimer(id){
 const j=db.jobs.find(x=>String(x.id)===String(id));if(!j)return;
 if(db.activeTimer&&!confirm('Există deja un timer activ. Îl înlocuiești?'))return;
 db.activeTimer={jobId:j.id,clientId:j.clientId,startedAt:new Date().toISOString(),pausedAt:null,pausedMs:0};
 save('Timer pornit');closeModal();render();
}
function timerElapsed(){
 const t=db.activeTimer;if(!t)return '00:00:00';
 const end=t.pausedAt?new Date(t.pausedAt).getTime():Date.now();
 const sec=Math.max(0,Math.floor((end-new Date(t.startedAt).getTime()-(t.pausedMs||0))/1000));
 return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(n=>String(n).padStart(2,'0')).join(':');
}
function startReadout(){if(!db.activeTimer)return;const el=document.getElementById('timerReadout');if(!el)return;el.textContent=timerElapsed();setTimeout(startReadout,1000)}
function timerPauseResume(){
 const t=db.activeTimer;if(!t)return;
 if(t.pausedAt){t.pausedMs=(t.pausedMs||0)+(Date.now()-new Date(t.pausedAt).getTime());t.pausedAt=null}
 else t.pausedAt=new Date().toISOString();
 save(t.pausedAt?'Timer pus pe pauză':'Timer reluat');render();
}
function timerFinish(){
 const t=db.activeTimer;if(!t)return;const j=db.jobs.find(x=>String(x.id)===String(t.jobId));
 if(!j){db.activeTimer=null;save('Timer închis');render();return}
 const elapsed=Math.max(1,Math.round((Date.now()-new Date(t.startedAt).getTime()-(t.pausedMs||0))/60000));
 const mins=t.pausedAt?Math.max(1,Math.round((new Date(t.pausedAt).getTime()-new Date(t.startedAt).getTime()-(t.pausedMs||0))/60000)):elapsed;
 j.actualMinutes=mins;j.price=Math.round(mins/60*Number(j.rate)*100)/100;j.status='Finalizat';db.activeTimer=null;
 save('Job finalizat din timer');render();
}

}
function openSettings(){
 show(`<div class="modalhead"><h2>Setări</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveSettings(event)"><div class="field"><label>Numele firmei</label><input name="businessName" value="${esc(db.settings.businessName)}"></div><div class="grid2"><div class="field"><label>Telefon</label><input name="businessPhone" value="${esc(db.settings.businessPhone)}"></div><div class="field"><label>E-mail</label><input name="businessEmail" type="email" value="${esc(db.settings.businessEmail)}"></div></div><div class="field"><label>Adresă firmă</label><input name="businessAddress" value="${esc(db.settings.businessAddress)}"></div><div class="grid2"><div class="field"><label>Prefix factură</label><input name="invoicePrefix" value="${esc(db.settings.invoicePrefix)}"></div><div class="field"><label>Reminder programări</label><input name="reminderTime" type="time" value="${esc(db.settings.reminderTime)}"></div></div><div class="field"><label>Mărimea textului</label><input type="range" name="zoom" min="100" max="200" step="5" value="${db.settings.zoom}" oninput="this.nextElementSibling.textContent=this.value+'%'" style="padding:0"><div class="muted">${db.settings.zoom}%</div></div><button class="btn primary wide">Salvează setările</button></form><div class="notice">Datele sunt salvate local în Safari. Exportă un backup periodic pentru siguranță.</div>`);
}
function saveSettings(e){
 e.preventDefault();const f=new FormData(e.target);
 for(const k of ['businessName','businessPhone','businessEmail','businessAddress','invoicePrefix','reminderTime'])db.settings[k]=f.get(k);
 db.settings.zoom=Number(f.get('zoom'));document.documentElement.style.fontSize=(16*db.settings.zoom/100)+'px';
 save('Setări actualizate');closeModal();render();
}
function exportBackup(){
 localStorage.setItem(KEY,JSON.stringify(db));
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=`pure-shine-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackup(e){
 const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();
 reader.onload=()=>{try{
  const x=JSON.parse(reader.result);
  if(!x||!Array.isArray(x.clients)||!Array.isArray(x.jobs))throw new Error('invalid');
  if(!confirm('Importul va înlocui datele actuale. Continui?'))return;
  db={...structuredClone(initial),...x,settings:{...initial.settings,...x.settings}};
  localStorage.setItem(KEY,JSON.stringify(db));alert('Backup restaurat.');closeModal();render();
 }catch(err){alert('Fișierul nu pare să fie un backup Pure Shine valid.')}finally{e.target.value=''}};
 reader.readAsText(file);
}
function csvDownload(filename,rows){
 const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCSV(type){
 let rows=[];
 if(type==='jobs')rows=[['Data','Client','Început','Final','Minute','Tarif','Sumă','Status','Notițe'],...db.jobs.map(j=>[j.date,getClient(j.clientId)?.name,j.start,j.end,Math.round(jobHours(j)*60),j.rate,j.price,j.status,j.notes])];
 if(type==='clients')rows=[['Nume','Telefon','Tip','Adresă','Tarif','Frecvență','Zi'],...db.clients.map(c=>[c.name,c.phone,c.type,c.address,c.rate,c.frequency,c.day])];
 if(type==='invoices')rows=[['Număr','Client','Data','Scadență','Total','Plătit','Restant'],...db.invoices.map(i=>[i.number,getClient(i.clientId)?.name||i.clientName,i.date,i.due,i.total,paid(i),balance(i)])];
 csvDownload(`pure-shine-${type}-${today()}.csv`,rows);
}
function seedAndRun(){
 seedClients();generateRecurring();
 try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
 if(db.settings.zoom)document.documentElement.style.fontSize=(16*db.settings.zoom/100)+'px';
 render();
}
seedAndRun();
setInterval(()=>{if(db.activeTimer&&page==='home')startReadout()},1000);
window.addEventListener('pageshow',()=>{db=loadDB();generateRecurring();render()});
</script>
</body>
</html>
