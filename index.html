<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#f8dce7">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Cleaning Manager</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

}

button{

}

.app{

/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    align-items:center;

.brand{

.logo{

.brandText h1{

.settings{

/* =========================================================
   DATE
========================================================= */

.dateCard{

.heart{

/* =========================================================
   STATS
========================================================= */

.stats{

.stat{

.statIcon{

/* =========================================================

========================================================= */

.sectionTitle{

/* =========================================================

.flowerBanner{

.flowerImage{

.sheetHeader{

<div class="app">

<script>

/* =========================================================
   BASIC DATE
========================================================= */

function updateDate(){

    const now=new Date();

    document.getElementById(
        "dateTitle"
    ).textContent=
        now.toLocaleDateString(
            "en-GB",
            {
                weekday:"long",
                day:"numeric",
                month:"long"
            }
        );
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

let clients=
JSON.parse(
    localStorage.getItem(
        "pureShineClients"
    )||"[]"
);

let jobs=
JSON.parse(
    localStorage.getItem(
        "pureShineJobs"
    )||"[]"
);


if(!clients.length){

    clients=[
        {
            id:1,
            name:"Lottie",
            type:"Agency",
            rate:16,
            day:"Monday",
            start:"13:00",
            end:"15:00"
        },

        {
            id:2,
            name:"Christine",
            type:"Private",
            rate:18,
            day:"Tuesday",
            start:"09:30",
            end:"12:30"
        },

        {
            id:3,
            name:"Matt",
            type:"Agency",
            rate:16,
            day:"Tuesday",
            start:"13:00",
            end:"17:00"
        },

        {
            id:4,
            name:"Sonia",
            type:"Agency",
            rate:16,
            day:"Wednesday",
            start:"09:00",
            end:"14:00"
        },

        {
            id:5,
            name:"Laura",
            type:"Private",
            rate:18,
            day:"Thursday",
            start:"09:00",
            end:"13:00"
        },

        {
            id:6,
            name:"Hannah",
            type:"Agency",
            rate:16,
            day:"Thursday",
            start:"13:00",
            end:"16:00"
        }
    ];

    save();
}


function save(){

    localStorage.setItem(
        "pureShineClients",
        JSON.stringify(clients)
    );

    localStorage.setItem(
        "pureShineJobs",
        JSON.stringify(jobs)
    );
}


/* =========================================================
   TODAY
========================================================= */

function renderToday(){

    const today=
        new Date().toLocaleDateString(
            "en-GB",
            {weekday:"long"}
        );

    const scheduled=
        clients.filter(
            c=>c.day===today
        );

    const box=
        document.getElementById(
            "todaySchedule"
        );

    if(!scheduled.length){

        box.innerHTML=`

            <div class="emptyIcon">
                ♡
            </div>

            <div class="emptyTitle">
                No cleaning jobs today 🌸
            </div>

            <div class="emptyText">
                Add one with the + button.
            </div>

            <button
                class="addJob"
                onclick="addJob()"
            >
                ＋ &nbsp;Add cleaning job
            </button>

        `;

        return;
    }


    box.style.justifyContent="flex-start";
    box.style.alignItems="stretch";
    box.style.textAlign="left";

    box.innerHTML=
        scheduled.map(
            c=>`

                <div class="job">

                    <div>

                        <div class="jobName">
                            ${c.name}
                        </div>

                        <div class="jobTime">
                            ${c.start} – ${c.end}
                        </div>

                    </div>

                    <div class="jobMoney">
                        £${c.rate}/h
                    </div>

                </div>

            `
        ).join("")+

        `

        <button
            class="addJob"
            onclick="addJob()"
        >
            ＋ &nbsp;Add cleaning job
        </button>

        `;
}


/* =========================================================
   STATS
========================================================= */

function renderStats(){

    const today=
        new Date()
        .toISOString()
        .slice(0,10);

    const todayJobs=
        jobs.filter(
            j=>j.date===today
        );

    let totalHours=0;
    let totalEarned=0;

    todayJobs.forEach(j=>{

        totalHours+=
            Number(j.hours||0);

        totalEarned+=
            Number(j.hours||0)*
            Number(j.rate||0);

    });


    document.getElementById(
        "jobs"
    ).textContent=
        todayJobs.length;

    document.getElementById(
        "hours"
    ).textContent=
        Math.floor(totalHours)+"h "+
        Math.round(
            (totalHours-
            Math.floor(totalHours))*60
        )+"m";

    document.getElementById(
        "earned"
    ).textContent=
        "£"+
        totalEarned.toFixed(0);

}


/* =========================================================
   MODAL
========================================================= */

function showModal(html){

    document.getElementById(
        "sheet"
    ).innerHTML=html;

    document.getElementById(
        "overlay"
    ).classList.add("show");
}


function closeModal(){

    document.getElementById(
        "overlay"
    ).classList.remove("show");
}


function closeOutside(e){

    if(
        e.target===
        document.getElementById("overlay")
    ){
        closeModal();
    }
}


/* =========================================================
   ADD JOB
========================================================= */

function addJob(){

    showModal(`

        <div class="sheetHeader">

            <h2>
                Add cleaning job
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <label>
            Client
        </label>

        <select
            class="select"
            id="jobClient"
        >

            ${
                clients.map(
                    c=>`
                        <option value="${c.id}">
                            ${c.name}
                        </option>
                    `
                ).join("")
            }

        </select>


        <div class="row">

            <div>

                <label>
                    Date
                </label>

                <input
                    class="input"
                    id="jobDate"
                    type="date"
                    value="${
                        new Date()
                        .toISOString()
                        .slice(0,10)
                    }"
                >

            </div>

            <div>

                <label>
                    Hours
                </label>

                <input
                    class="input"
                    id="jobHours"
                    type="number"
                    step="0.01"
                    value="2"
                >

            </div>

        </div>


        <div class="row">

            <div>

                <label>
                    Start
                </label>

                <input
                    class="input"
                    id="jobStart"
                    type="time"
                    value="09:00"
                >

            </div>

            <div>

                <label>
                    End
                </label>

                <input
                    class="input"
                    id="jobEnd"
                    type="time"
                    value="11:00"
                >

            </div>

        </div>


        <label>
            Hourly rate
        </label>

        <input
            class="input"
            id="jobRate"
            type="number"
            value="16"
        >


        <button
            class="save"
            onclick="saveJob()"
        >
            Save cleaning job
        </button>

    `);
}


function saveJob(){

    const id=
        document.getElementById(
            "jobClient"
        ).value;

    const client=
        clients.find(
            c=>String(c.id)===String(id)
        );

    jobs.push({

        id:Date.now(),

        clientId:id,

        date:
            document.getElementById(
                "jobDate"
            ).value,

        start:
            document.getElementById(
                "jobStart"
            ).value,

        end:
            document.getElementById(
                "jobEnd"
            ).value,

        hours:
            Number(
                document.getElementById(
                    "jobHours"
                ).value
            ),

        rate:
            Number(
                document.getElementById(
                    "jobRate"
                ).value
            )||
            client?.rate||
            16

    });

    save();

    closeModal();

    renderStats();

    renderToday();
}

function newClient(){

    showModal(`

        <div class="sheetHeader">

            <h2>
                New client
            </h2>

            <button
                class="close"
                onclick="openClients()"
            >
                ×
            </button>

        </div>

        <label>
            Name
        </label>

        <input
            class="input"
            id="newName"
        >

        <label>
            Type
        </label>

        <select
            class="select"
            id="newType"
        >

            <option>
                Private
            </option>

            <option>
                Agency
            </option>

        </select>

        <label>
            Rate
        </label>

        <input
            class="input"
            id="newRate"
            type="number"
            value="16"
        >

        <label>
            Day
        </label>

        <select
            class="select"
            id="newDay"
        >

            <option value="">
                Choose day
            </option>

            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>

        </select>

        <button
            class="save"
            onclick="saveClient()"
        >
            Save client
        </button>

    `);
}


function saveClient(){

    const name=
        document.getElementById(
            "newName"
        ).value.trim();

    if(!name)
        return;

    clients.push({

        id:Date.now(),

        name,

        type:
            document.getElementById(
                "newType"
            ).value,

        rate:
            Number(
                document.getElementById(
                    "newRate"
                ).value
            )||16,

        day:
            document.getElementById(
                "newDay"
            ).value,

        start:"09:00",
        end:"12:00"

    });

    save();

    openClients();

    renderToday();
}


function editClient(id){

    const c=
        clients.find(
            x=>x.id===id
        );

    if(!c)
        return;

    showModal(`

        <div class="sheetHeader">

            <h2>
                Edit ${c.name}
            </h2>

            <button
                class="close"
                onclick="openClients()"
            >
                ×
            </button>

        </div>

        <label>
            Name
        </label>

        <input
            class="input"
            id="editName"
            value="${c.name}"
        >

        <label>
            Rate
        </label>

        <input
            class="input"
            id="editRate"
            type="number"
            value="${c.rate}"
        >

        <button
            class="save"
            onclick="
                c.name=document.getElementById('editName').value;
                c.rate=Number(document.getElementById('editRate').value);
                save();
                openClients();
                renderToday();
            "
        >
            Save changes
        </button>

    `);
}


/* =========================================================
   SCHEDULE
========================================================= */

function openSchedule(){

    showModal(`

        <div class="sheetHeader">

            <h2>
                Schedule
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        ${
            [
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday",
                "Saturday",
                "Sunday"
            ].map(
                day=>{

                    const list=
                        clients.filter(
                            c=>c.day===day
                        );

                    if(!list.length)
                        return "";

                    return`

                        <div class="job">

                            <div>

                                <div class="jobName">
                                    ${day}
                                </div>

                                ${
                                    list.map(
                                        c=>`

                                            <div
                                                class="jobTime"
                                            >
                                                ${c.name}
                                                ·
                                                ${c.start}–${c.end}
                                                ·
                                                £${c.rate}/h
                                            </div>

                                        `
                                    ).join("")
                                }

                            </div>

                        </div>

                    `;

                }
            ).join("")
        }

    `);
}


/* =========================================================
   EARNINGS
========================================================= */

function openEarnings(){

    let totalHours=0;
    let totalMoney=0;

    jobs.forEach(
        j=>{

            totalHours+=
                Number(j.hours||0);

            totalMoney+=
                Number(j.hours||0)*
                Number(j.rate||0);

        }
    );

    showModal(`

        <div class="sheetHeader">

            <h2>
                Earnings
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div class="job">

            <div>

                <div class="jobName">
                    Total hours
                </div>

                <div class="jobTime">
                    ${totalHours.toFixed(2)} hours
                </div>

            </div>

            <div class="jobMoney">
                £${totalMoney.toFixed(2)}
            </div>

        </div>

    `);
}

function startCleaning(){

    const first=
        clients.find(
            c=>c.day===
            new Date().toLocaleDateString(

                {weekday:"long"}
            )
        );

    if(!first){

        addJob();

        return;

    alert(
        "Timer started for "+first.name
