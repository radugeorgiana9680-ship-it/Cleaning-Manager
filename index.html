<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3c7d7">
<title>Pure Shine Cleaning Manager</title>
<style>
:root{--pink:#efc3d4;--pale:#fff0f5;--gold:#c5a15b;--ink:#493b47;--muted:#867986;--line:#f0e2e9;--lav:#eee7f8;--sage:#e3f0e6;--cream:#fff4df;--app-scale:1}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:#fff9fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:1rem;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{width:100%;max-width:850px;margin:auto;padding:12px 13px calc(100px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:11px;margin:5px 0 13px}
.profile{width:59px;height:59px;flex-shrink:0;position:relative;overflow:hidden;border-radius:19px;background:linear-gradient(135deg,var(--pink),var(--gold));display:grid;place-items:center;border:2px solid white;box-shadow:0 3px 12px #75556815}
.profile img{width:100%;height:100%;object-fit:cover}
.profile .editphoto{position:absolute;right:3px;bottom:3px;border:0;border-radius:8px;background:#ffffffed;padding:3px 6px;font-size:.75rem}
.brand{flex:1;min-width:0}
.brand h1{font:700 1.5rem Georgia,serif;margin:0}
.brand small{display:block;color:var(--muted);font-size:.75rem;margin-top:3px}
.topbtn{width:45px;height:45px;border:0;border-radius:15px;background:white;color:#a45d7b;font-size:1.6rem;box-shadow:0 4px 16px #7555680c}
.banner{height:145px;position:relative;overflow:hidden;border-radius:21px;margin-bottom:16px;background:linear-gradient(125deg,#f4cbd9,#f9e8ef 55%,#e9def6);box-shadow:0 5px 20px #7555680b}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner-edit{position:absolute;right:9px;top:9px;border:0;border-radius:11px;background:#ffffffdf;padding:8px 10px;font-size:.75rem;font-weight:750;color:#674d5d}
.banner-empty{height:100%;display:grid;place-items:center;color:#b995a6;font-size:2.1rem}
h2{font:700 1.3125rem Georgia,serif;margin:0}
h3{font-size:1rem;margin:0 0 9px}
p{line-height:1.5}
.muted{font-size:.8125rem;line-height:1.5;color:var(--muted)}
.hero{border-radius:23px;padding:19px;background:linear-gradient(125deg,#f7dce7,#f0e7fa 65%,#fff1dc);margin-bottom:13px}
.hero h2{font-size:1.5rem;margin:7px 0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:21px 2px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:14px;margin:9px 0;box-shadow:0 5px 20px #75556808}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.stat{padding:14px;border-radius:18px;background:var(--pale);min-width:0}
.stat:nth-child(2){background:var(--sage)}.stat:nth-child(3){background:var(--lav)}.stat:nth-child(4){background:var(--cream)}
.stat span{font-size:.75rem;color:var(--muted);display:block}
.stat strong{display:block;font-size:1.3125rem;margin-top:5px;overflow-wrap:anywhere}
.btn{border:0;border-radius:14px;padding:11px 14px;background:var(--pink);color:#684456;font-weight:750}
.btn.primary{background:linear-gradient(120deg,#eab5c9,#c5a15b);color:white}
.btn.soft{background:#faeaf1}.btn.danger{background:#f9e0e2;color:#994958}
.btn.small{padding:8px 10px;font-size:.75rem}
.btn.wide{width:100%}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.field{margin:11px 0}.field label{display:block;font-size:.8125rem;font-weight:750;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1.5px solid #e8dce4;border-radius:13px;background:#fff;color:var(--ink);padding:12px;font-size:1rem}
.field textarea{min-height:75px;resize:vertical}
.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.itemtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.itemtop>div{min-width:0}.item strong{font-size:.9375rem}
.pill{display:inline-block;font-size:.6875rem;font-weight:750;background:var(--lav);border-radius:9px;padding:4px 7px;margin:4px 3px 0 0}
.pill.green{background:var(--sage)}.pill.gold{background:var(--cream)}.pill.pink{background:var(--pale)}
.empty{text-align:center;padding:20px 8px;color:var(--muted);font-size:.875rem}
.notice{padding:12px;border-radius:13px;background:var(--cream);font-size:.75rem;line-height:1.5;margin:10px 0}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nav button{min-width:0;border:0;background:transparent;border-radius:13px;padding:6px 0;color:#887987;font-size:.625rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button span{font-size:1.375rem}.nav button.active{background:#fff0f5;color:#a25276;font-weight:800}
.modalback{display:none;position:fixed;inset:0;z-index:60;background:#34263177;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:700px;max-height:92dvh;overflow:auto;background:#fffafd;border-radius:26px 26px 0 0;padding:17px 15px calc(22px + env(safe-area-inset-bottom))}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.close{border:0;border-radius:50%;width:39px;height:39px;background:#f8e7ef;color:#995675;font-size:1.5rem}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.settings-tile{min-height:112px;border:1px solid var(--line);border-radius:19px;padding:14px 12px;text-align:left;background:white;display:flex;flex-direction:column;justify-content:space-between;gap:7px;color:var(--ink)}
.settings-tile:active{transform:scale(.98)}
.settings-tile .tile-icon{font-size:1.625rem}
.settings-tile strong{font-size:.875rem;line-height:1.35}
.settings-tile small{font-size:.75rem;color:var(--muted);line-height:1.4}
.settings-tile.pink{background:#fff0f5}.settings-tile.gold{background:#fff5df}.settings-tile.lavender{background:#f3effb}.settings-tile.green{background:#edf6ef}
.settings-preview{border-radius:18px;background:linear-gradient(130deg,#f7dce7,#fff1db);padding:16px;margin-bottom:14px}
.settings-preview strong{font:700 1.3125rem Georgia,serif}
.settings-preview p{font-size:.8125rem;margin:6px 0 0;color:#756274}
.settings-section{margin:18px 0}.settings-section h3{font:700 1.125rem Georgia,serif;margin:0 0 10px}
.settings-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.row-icon{width:41px;height:41px;flex-shrink:0;border-radius:14px;background:#fff0f5;display:grid;place-items:center;font-size:1.3125rem}
.row-copy{flex:1;min-width:0}.row-copy strong{display:block;font-size:.875rem}.row-copy small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px;line-height:1.4}
.settings-row .btn{flex-shrink:0}
.settings-savebar{position:sticky;bottom:-18px;background:#fffafd;padding:12px 0 max(8px,env(safe-area-inset-bottom));margin-top:12px}
#toast{display:none;position:fixed;z-index:100;left:14px;right:14px;bottom:94px;padding:13px 16px;border-radius:14px;background:#51414f;color:white;font-size:.875rem;box-shadow:0 5px 25px #0002}
#zoomPreview{font-size:calc(1rem * var(--app-scale));line-height:1.5}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{max-width:850px;left:50%;right:auto;transform:translateX(-50%);width:100%;border-radius:18px 18px 0 0}.modalback{align-items:center;padding:20px}.modal{border-radius:25px;max-height:88dvh}}
@media(max-width:360px){.banner{height:115px}.profile{width:52px;height:52px}.brand h1{font-size:1.3125rem}.app{padding-left:9px;padding-right:9px}.btn{padding:10px 11px}}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="profile" id="profileBox"></div>
 <div class="brand"><h1>Pure Shine</h1><small>Cleaning Manager · Business planner</small></div>
 <button class="topbtn" onclick="addMenu()" aria-label="Adaugă">＋</button>
</header>
<div class="banner" id="bannerBox"></div>
<input id="profileFile" type="file" accept="image/*" hidden onchange="saveImage(event,'profile')">
<input id="bannerFile" type="file" accept="image/*" hidden onchange="saveImage(event,'banner')">
<div id="view"></div>
</main>
<nav class="nav">
<button data-page="home" onclick="go('home')"><span>⌂</span>Acasă</button>
<button data-page="schedule" onclick="go('schedule')"><span>▦</span>Calendar</button>
<button data-page="clients" onclick="go('clients')"><span>♙</span>Clienți</button>
<button data-page="money" onclick="go('money')"><span>£</span>Financiar</button>
<button data-page="more" onclick="go('more')"><span>☷</span>Mai mult</button>
</nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" id="modal"></section></div>
<div id="toast"></div>
<input id="importFile" type="file" accept=".json,application/json" hidden onchange="importBackup(event)">
<script>
'use strict';
const DBNAME='PureShineCleaningDB',STORE='app',RECORD='main';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now()+Math.floor(Math.random()*9999);
const initial=()=>({version:7,settings:{zoom:100,businessName:'Pure Shine Cleaning',phone:'',email:'',address:'',invoicePrefix:'PSC',invoiceNext:1},clients:[],jobs:[],invoices:[],payments:[],expenses:[],holidays:[],history:[],images:{},activeTimer:null});
let db=initial(),page='home',selectedDate=today(),mode='week',search='',idb=null,storageMode='local';
const DAY={'Luni':1,'Marți':2,'Miercuri':3,'Joi':4,'Vineri':5,'Sâmbătă':6,'Duminică':0};
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('IndexedDB unavailable'));return}const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>{idb=r.result;resolve(idb)};r.onerror=()=>reject(r.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const r=idb.transaction(STORE,'readonly').objectStore(STORE).get(RECORD);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function dbPut(v){return new Promise((resolve,reject)=>{const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,RECORD);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3200)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cash(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0)}
function dateObj(s){return new Date((s||today())+'T12:00:00')}
function dateText(s){return s?dateObj(s).toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):''}
function minutes(s){if(!s||!s.includes(':'))return 0;const [h,m]=s.split(':').map(Number);return h*60+m}
function hours(a,b){let n=minutes(b)-minutes(a);if(n<0)n+=1440;return Math.max(0,n)/60}
function durationText(h){const n=Math.round((Number(h)||0)*60);return `${Math.floor(n/60)} h ${n%60} min`}
function getClient(id){return db.clients.find(c=>String(c.id)===String(id))}
function getJob(id){return db.jobs.find(j=>String(j.id)===String(id))}
function jobHours(j){return Number.isFinite(j.actualMinutes)?j.actualMinutes/60:hours(j.start,j.end)}
function doneJobs(){return db.jobs.filter(j=>j.status==='Finalizat')}
function revenue(){return doneJobs().reduce((s,j)=>s+(Number(j.price)||0),0)}
function totalExpenses(){return db.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0)}
function paid(inv){return db.payments.filter(p=>String(p.invoiceId)===String(inv.id)).reduce((s,p)=>s+Number(p.amount||0),0)}
function balance(inv){return Math.max(0,Number(inv.total||0)-paid(inv))}
function history(action,details=''){db.history.unshift({id:uid(),at:new Date().toISOString(),action,details});db.history=db.history.slice(0,250)}
async function persist(){
 try{
  if(storageMode==='indexedDB'&&idb){await dbPut(db);return true}
  localStorage.setItem('pureShineManager_v7',JSON.stringify(db));return true
 }catch(e){toast('Nu am putut salva datele. Descarcă un backup și eliberează spațiu în browser.');return false}
}
async function save(action,details=''){history(action,details);return persist()}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'')}
const presets=[
 ['Lottie','Agency',16,'Săptămânal','Luni','13:00','15:00'],
 ['Christine','Private',18,'La 2 săptămâni','Marți','09:30','12:30'],
 ['Matt','Agency',16,'Săptămânal','Marți','09:00','13:00'],
 ['Sonia','Agency',16,'Săptămânal','Miercuri','09:00','14:00'],
 ['Laura','Private',18,'Săptămânal','Joi','09:00','13:00'],
 ['Hannah','Agency',16,'Săptămânal','Joi','13:00','16:00'],
 ['Meghan','Private',null,'Ocazional','Nesetată','',''],
 ['Johanna','Private',null,'La 2 săptămâni','Vineri','',''],
 ['Sindu','Agency',16,'La 2 săptămâni','Vineri','',''],
 ['Peter','Private',null,'Ocazional','Nesetată','',''],
 ['Mike','Private',null,'La 3 săptămâni','Nesetată','','']
];
function seedClients(){
 for(const p of presets){
  let c=db.clients.find(x=>norm(x.name)===norm(p[0])||(p[0]==='Johanna'&&norm(x.name)==='joanna'));
  if(!c)db.clients.push({id:uid(),name:p[0],type:p[1],rate:p[2],frequency:p[3],day:p[4],start:p[5],end:p[6],phone:'',address:'',notes:'',archived:false,week:p[0]==='Sindu'?'B':'A',anchorWeek:'2026-10-05',anchorDate:p[0]==='Christine'?'2026-10-13':'',schedulePresetVersion:1});
 }
 const g=db.clients.find(c=>norm(c.name)==='gill');if(g)g.archived=true;
}
function occurs(c,date){
 if(c.archived||!c.day||!Object.prototype.hasOwnProperty.call(DAY,c.day)||!c.start||!c.end||dateObj(date).getDay()!==DAY[c.day])return false;
 if(c.frequency==='Ocazional')return false;
 if(c.frequency==='La 2 săptămâni'){
  if(c.anchorDate){const n=Math.round((dateObj(date)-dateObj(c.anchorDate))/86400000);return n>=0&&n%14===0}
  let a=dateObj(c.anchorWeek||'2026-10-05'),b=dateObj(date);a.setDate(a.getDate()-((a.getDay()+6)%7));b.setDate(b.getDate()-((b.getDay()+6)%7));
  return ((Math.round((b-a)/604800000)%2)+2)%2===(c.week==='B'?1:0);
 }
 if(c.frequency==='La 3 săptămâni'){const n=Math.round((dateObj(date)-dateObj(c.anchorDate||date))/86400000);return n>=0&&n%21===0}
 return c.frequency==='Săptămânal';
}
function generate(){
 let changed=false;
 for(let i=0;i<42;i++){
  const d=dateObj(today());d.setDate(d.getDate()+i);const date=d.toLocaleDateString('en-CA');
  for(const c of db.clients){
   if(!occurs(c,date))continue;
   if(db.holidays.some(h=>String(h.clientId)===String(c.id)&&date>=h.from&&date<=h.to))continue;
   if(db.jobs.some(j=>String(j.clientId)===String(c.id)&&j.date===date))continue;
   const rate=Number(c.rate)||0;
   db.jobs.push({id:uid(),clientId:c.id,date,start:c.start,end:c.end,rate,price:Math.round(hours(c.start,c.end)*rate*100)/100,status:'Programat',notes:'',autoGenerated:true});changed=true;
  }
 }
 if(changed)db.jobs.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 return changed;
}
function renderImages(){
 const p=db.images?.profile,b=db.images?.banner;
 $('profileBox').innerHTML=(p?`<img src="${p}" alt="Poză de profil">`:'<span style="font-size:1.6875rem">✨</span>')+'<button class="editphoto" onclick="$(\\'profileFile\\').click()">✎</button>';
 $('bannerBox').innerHTML=(b?`<img src="${b}" alt="Banner">`:'<div class="banner-empty">✨</div>')+'<button class="banner-edit" onclick="$(\\'bannerFile\\').click()">'+(b?'📷 Schimbă bannerul':'📷 Adaugă banner')+'</button>';
}
function go(p){page=p;render()}
function setView(s){$('view').innerHTML=s}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='home')home();else if(page==='schedule')schedule();else if(page==='clients')clients();else if(page==='money')money();else more();
 renderImages();
}
function home(){
 const list=db.jobs.filter(j=>j.date===today()&&j.status!=='Anulat').sort((a,b)=>a.start.localeCompare(b.start));
 const next=db.jobs.filter(j=>j.date>today()&&j.status==='Programat').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,3);
 setView(`<div class="hero"><div class="muted">${dateText(today())}</div><h2>Bună! ✨</h2><p class="muted">Organizează-ți ziua și urmărește fiecare lucrare.</p><div class="btnrow"><button class="btn primary" onclick="jobForm()">＋ Adaugă job</button><button class="btn" onclick="clientForm()">＋ Client nou</button></div></div>
 <div class="stats"><div class="stat"><span>Venit realizat</span><strong>${cash(revenue())}</strong></div><div class="stat"><span>Cheltuieli</span><strong>${cash(totalExpenses())}</strong></div><div class="stat"><span>Facturi restante</span><strong>${cash(db.invoices.reduce((s,i)=>s+balance(i),0))}</strong></div><div class="stat"><span>Ore finalizate</span><strong>${durationText(doneJobs().reduce((s,j)=>s+jobHours(j),0))}</strong></div></div>
 ${db.activeTimer?`<div class="card"><h3>⏱ Timer activ · ${esc(getClient(db.activeTimer.clientId)?.name||'Client')}</h3><strong id="timerDisplay" style="font-size:1.5rem">${timerElapsed()}</strong><div class="btnrow"><button class="btn primary" onclick="stopTimer()">Finalizează</button><button class="btn" onclick="pauseTimer()">${db.activeTimer.pausedAt?'Continuă':'Pauză'}</button></div></div>`:''}
 <div class="sectionhead"><h2>Programul de azi</h2><button class="btn small soft" onclick="go('schedule')">Calendar →</button></div><div class="card">${list.length?list.map(jobCard).join(''):'<div class="empty">🌸 Nu ai joburi programate astăzi.</div>'}</div>
 <div class="sectionhead"><h2>Urmează</h2></div><div class="card">${next.length?next.map(jobCard).join(''):'<div class="empty">Nu există alte programări.</div>'}</div>`);
 if(db.activeTimer)tick();
}
function jobCard(j){
 const c=getClient(j.clientId);
 return `<div class="item"><div class="itemtop"><div><strong>${esc(c?.name||'Client')}</strong><div class="muted">${dateText(j.date)} · ${esc(j.start)}–${esc(j.end)} · ${durationText(jobHours(j))}</div><span class="pill ${j.status==='Finalizat'?'green':j.status==='Anulat'?'pink':'gold'}">${esc(j.status)}</span></div><strong>${cash(j.price)}</strong></div><div class="btnrow"><button class="btn small soft" onclick="jobForm(${j.id})">Editează</button>${j.status==='Programat'?`<button class="btn small" onclick="startTimer(${j.id})">▶ Timer</button><button class="btn small" onclick="finishJob(${j.id})">Finalizează</button>`:''}<button class="btn small danger" onclick="deleteJob(${j.id})">Șterge</button></div></div>`;
}
function weekStart(s){const d=dateObj(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString('en-CA')}
function shiftDate(s,n){const d=dateObj(s);d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')}
function schedule(){
 const start=weekStart(selectedDate),dates=Array.from({length:7},(_,i)=>shiftDate(start,i));
 const list=db.jobs.filter(j=>mode==='all'||(mode==='day'?j.date===selectedDate:dates.includes(j.date))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 setView(`<div class="sectionhead"><h2>Calendar</h2><button class="btn primary" onclick="jobForm()">＋ Job</button></div><div class="card"><div class="grid2"><div class="field"><label>Data</label><input type="date" value="${selectedDate}" onchange="selectedDate=this.value;schedule()"></div><div class="field"><label>Vizualizare</label><select onchange="mode=this.value;schedule()"><option value="week" ${mode==='week'?'selected':''}>Săptămână</option><option value="day" ${mode==='day'?'selected':''}>O zi</option><option value="all" ${mode==='all'?'selected':''}>Toate joburile</option></select></div></div><div class="btnrow"><button class="btn small" onclick="selectedDate=shiftDate(selectedDate,-7);schedule()">← Anterior</button><button class="btn small" onclick="selectedDate=today();schedule()">Astăzi</button><button class="btn small" onclick="selectedDate=shiftDate(selectedDate,7);schedule()">Următor →</button></div></div><div class="card">${list.length?list.map(jobCard).join(''):'<div class="empty">Nu există programări în această perioadă.</div>'}</div>

async function saveClient(e,id){
 e.preventDefault();const f=new FormData(e.target),old=id?getClient(id):null;
 const c={...(old||{}),id:old?.id||uid(),name:f.get('name').trim(),phone:f.get('phone'),rate:f.get('rate')===''?null:Number(f.get('rate')),address:f.get('address'),type:f.get('type'),frequency:f.get('frequency'),day:f.get('day'),week:f.get('week'),start:f.get('start'),end:f.get('end'),notes:f.get('notes'),archived:false};
 if(c.frequency==='La 2 săptămâni'&&!c.anchorDate&&!c.anchorWeek)c.anchorWeek=today();
 if(c.frequency==='La 3 săptămâni'&&!c.anchorDate)c.anchorDate=today();
 if(old){const changed=['day','start','end','rate','frequency','week'].some(k=>old[k]!==c[k]);Object.assign(old,c);if(changed)db.jobs=db.jobs.filter(j=>!(j.autoGenerated&&j.status==='Programat'&&j.date>=today()&&String(j.clientId)===String(old.id)))}
 else db.clients.push(c);
 generate();await save(old?'Client actualizat':'Client adăugat');closeModal();render();
}

async function saveJob(e,id){
 e.preventDefault();const f=new FormData(e.target),old=id?getJob(id):null,start=f.get('start'),end=f.get('end'),rate=Number(f.get('rate')),h=hours(start,end);
 if(h<=0){toast('Verifică orele introduse.');return}
 const j={...(old||{}),id:old?.id||uid(),clientId:f.get('clientId'),date:f.get('date'),start,end,rate,price:Math.round(h*rate*100)/100,status:f.get('status'),notes:f.get('notes'),autoGenerated:false};
 if(old)Object.assign(old,j);else db.jobs.push(j);
 await save(old?'Job actualizat':'Job adăugat');generate();await persist();closeModal();render();
}
async function deleteJob(id){if(!confirm('Ștergi acest job?'))return;db.jobs=db.jobs.filter(j=>String(j.id)!==String(id));await save('Job șters');render()}
async function finishJob(id){const j=getJob(id);if(!j)return;const raw=prompt('Durata reală în minute:',String(Math.round(hours(j.start,j.end)*60)));if(raw===null)return;const n=Number(raw);if(!Number.isFinite(n)||n<=0){toast('Introdu durata în minute.');return}j.actualMinutes=Math.round(n);j.price=Math.round(n/60*Number(j.rate)*100)/100;j.status='Finalizat';await save('Job finalizat',getClient(j.clientId)?.name||'');render()}
async function startTimer(id){const j=getJob(id);if(!j)return;if(db.activeTimer&&!confirm('Înlocuiești timerul activ?'))return;db.activeTimer={jobId:j.id,clientId:j.clientId,startedAt:Date.now(),pausedAt:null,pausedMs:0};await save('Timer pornit');render()}
function timerElapsed(){const t=db.activeTimer;if(!t)return '00:00:00';const end=t.pausedAt||Date.now(),s=Math.max(0,Math.floor((end-t.startedAt-(t.pausedMs||0))/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function tick(){if(!db.activeTimer||page!=='home')return;const el=$('timerDisplay');if(el)el.textContent=timerElapsed();setTimeout(tick,1000)}
async function pauseTimer(){const t=db.activeTimer;if(!t)return;if(t.pausedAt){t.pausedMs+=(Date.now()-t.pausedAt);t.pausedAt=null}else t.pausedAt=Date.now();await save('Timer actualizat');render()}
async function stopTimer(){const t=db.activeTimer;if(!t)return;const j=getJob(t.jobId);if(j){const n=Math.max(1,Math.round(((t.pausedAt||Date.now())-t.startedAt-(t.pausedMs||0))/60000));j.actualMinutes=n;j.price=Math.round(n/60*Number(j.rate)*100)/100;j.status='Finalizat'}db.activeTimer=null;await save('Job finalizat din timer');render()}

 <div class="settings-preview"><strong>${esc(s.businessName)}</strong><p>Detaliile de mai jos pot apărea pe facturi.</p></div>
 <form onsubmit="saveSettings(event)"><div class="field"><label>Numele firmei</label><input name="businessName" value="${esc(s.businessName)}" required></div><div class="grid2"><div class="field"><label>Telefon</label><input name="phone" type="tel" value="${esc(s.phone)}"></div><div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(s.email)}"></div></div><div class="field"><label>Adresă firmă</label><input name="address" value="${esc(s.address)}"></div><div class="field"><label>Prefix factură</label><input name="invoicePrefix" value="${esc(s.invoicePrefix)}" required></div><div class="settings-savebar"><button class="btn primary wide">Salvează setările</button></div></form>
 <div class="notice">Pentru poză de profil și banner, apasă pictograma creion de lângă logo sau butonul de pe banner.</div>`);
}
async function saveSettings(e){e.preventDefault();const f=new FormData(e.target);for(const k of ['businessName','phone','email','address','invoicePrefix'])db.settings[k]=String(f.get(k)||'').trim();await save('Setări firmă actualizate');closeModal();render()}
function appearanceForm(){
 const zoom=Math.min(160,Math.max(100,Number(db.settings.zoom)||100));
 showModal(`<div class="modalhead"><h2>Aspect și text</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><div class="settings-row"><div class="row-icon">🔎</div><div class="row-copy"><strong>Mărimea textului</strong><small>Reglează textul din aplicație pentru a-l citi mai ușor.</small></div><span class="muted" id="zoomValue">${zoom}%</span></div><div class="field"><input id="zoomSlider" type="range" min="100" max="160" step="5" value="${zoom}" oninput="previewZoom(this.value)" style="width:100%;padding:0;accent-color:#c5a15b"></div><div class="btnrow"><button type="button" class="btn small" onclick="previewZoom(100)">Standard</button><button type="button" class="btn small" onclick="previewZoom(120)">Mai mare</button><button type="button" class="btn small" onclick="previewZoom(140)">Foarte mare</button><button type="button" class="btn small" onclick="previewZoom(160)">Maxim</button></div></div><div class="card"><h3>Previzualizare</h3><p id="zoomPreview">Pure Shine Cleaning ✨<br>Textul aplicației va fi mai ușor de citit.</p></div><div class="settings-savebar"><button class="btn primary wide" onclick="saveAppearance()">Salvează aspectul</button></div>`);
 previewZoom(zoom);
}
function applySavedZoom(){
 const zoom=Math.min(160,Math.max(100,Number(db.settings.zoom)||100));
 db.settings.zoom=zoom;
 document.documentElement.style.setProperty('--app-scale',String(zoom/100));
 document.documentElement.style.fontSize=(16*zoom/100)+'px';
 document.body.style.zoom=String(zoom/100);
}
function previewZoom(v){
 const n=Math.min(160,Math.max(100,Number(v)||100));
 $('zoomValue').textContent=n+'%';
 $('zoomSlider').value=n;
 $('zoomPreview').style.fontSize=(16*n/100)+'px';
 document.documentElement.style.setProperty('--app-scale',String(n/100));
 document.documentElement.style.fontSize=(16*n/100)+'px';
 document.body.style.zoom=String(n/100);
}
async function saveAppearance(){
 db.settings.zoom=Math.min(160,Math.max(100,Number($('zoomSlider').value)||100));
 applySavedZoom();
 await save('Aspect actualizat');
 closeModal();
 render();
}
async function saveImage(e,key){
 const file=e.target.files?.[0];if(!file)return;
 if(!file.type.startsWith('image/')){toast('Alege un fișier imagine.');e.target.value='';return}
 try{
  const data=await resizeImage(file,key==='banner'?1400:600,key==='banner'?450:600);
  const previous=db.images[key];db.images[key]=data;
  if(await persist()){renderImages();toast(key==='banner'?'Banner salvat.':'Poza de profil salvată.')}
  else{db.images[key]=previous;toast('Imaginea nu a putut fi salvată. Descarcă un backup și încearcă o imagine mai mică.')}
 }catch(err){toast('Nu am putut procesa imaginea. Încearcă o imagine JPG sau PNG mai mică.')}
 e.target.value='';
}
function resizeImage(file,maxW,maxH){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,maxW/img.width,maxH/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.76))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Image error'))};img.src=url})}
async function backup(){if(!(await persist()))return;const blob=new Blob([JSON.stringify(db)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`pure-shine-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(e){const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x||!Array.isArray(x.clients)||!Array.isArray(x.jobs))throw Error();if(!confirm('Backupul va înlocui datele actuale. Continui?'))return;db={...initial(),...x,settings:{...initial().settings,...x.settings},images:x.images||{}};generate();await persist();applySavedZoom();toast('Backup restaurat.');closeModal();render()}catch(err){toast('Fișierul nu este un backup valid.')}finally{e.target.value=''}}
function exportCSV(type){
 let rows=[];
 if(type==='jobs')rows=[['Data','Client','Început','Final','Minute','Tarif','Sumă','Status'],...db.jobs.map(j=>[j.date,getClient(j.clientId)?.name,j.start,j.end,Math.round(jobHours(j)*60),j.rate,j.price,j.status])];
 if(type==='clients')rows=[['Nume','Telefon','Adresă','Tip','Tarif','Frecvență','Zi'],...db.clients.map(c=>[c.name,c.phone,c.address,c.type,c.rate,c.frequency,c.day])];
 if(type==='invoices')rows=[['Număr','Client','Data','Scadență','Total','Plătit','Restant'],...db.invoices.map(i=>[i.number,getClient(i.clientId)?.name||i.clientName,i.date,i.due,i.total,paid(i),balance(i)])];
 const content=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`pure-shine-${type}-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
async function boot(){
 let loaded=false;
 try{
  await openDB();storageMode='indexedDB';const saved=await dbGet();
  if(saved){db={...initial(),...saved,settings:{...initial().settings,...saved.settings},images:saved.images||{}};loaded=true}
 }catch(e){storageMode='local'}
 if(!loaded){
  let old=null;
  for(const k of ['pureShineManager_v7','pureShineManager_v6','pureShineManager_v5','pureShineManager_v4','pureShineCleaningManager','pureShineManager']){
   try{old=JSON.parse(localStorage.getItem(k)||'null');if(old)break}catch(e){}
  }
  if(old)db={...initial(),...old,settings:{...initial().settings,...old.settings},images:old.images||{}};
 }
 seedClients();generate();await persist();
 applySavedZoom();
 render();
}
boot();
window.addEventListener('pageshow',()=>{if(db.activeTimer&&page==='home')tick()});
</script>
