<!-- =========================================================
     PURE SHINE — NOUĂ PREFACE / WELCOME SCREEN
     Înlocuiește complet secțiunea veche #welcomeScreen
========================================================= -->

<section id="welcomeScreen">

<style>

#welcomeScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #f9e8ef 0%,
            #f8dce7 100%
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* Cleaning photo */

#welcomeScreen .welcome-photo{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    z-index:0;
}


/* Soft pink overlay */

#welcomeScreen .welcome-overlay{
    position:absolute;
    inset:0;

    z-index:1;

    background:
        linear-gradient(
            180deg,
            rgba(255,248,250,.10) 0%,
            rgba(255,241,246,.15) 45%,
            rgba(255,220,232,.32) 100%
        );
}


/* Main content */

#welcomeScreen .welcome-inner{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:
        max(42px,env(safe-area-inset-top))
        25px
        max(18px,env(safe-area-inset-bottom));
}


/* Logo */

#welcomeScreen .welcome-logo{
    width:min(330px,72vw);
    height:min(330px,72vw);

    object-fit:contain;

    margin-top:5px;

    border-radius:50%;

    filter:
        drop-shadow(
            0 8px 18px
            rgba(120,55,78,.18)
        );
}


/* If the supplied logo cannot load,
   keep the elegant circular Pure Shine design */

#welcomeScreen .logo-fallback{
    width:min(330px,72vw);
    height:min(330px,72vw);

    border-radius:50%;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #f9d5e2 0%,
            #f5c4d6 70%,
            #e9b0c7 100%
        );

    border:
        3px solid
        #cfa04c;

    box-shadow:
        inset 0 0 0 5px rgba(255,255,255,.35),
        0 8px 18px rgba(120,55,78,.18);

    color:#9a6070;
}

#welcomeScreen .logo-fallback-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
}

#welcomeScreen .logo-fallback-main{
    font-family:Georgia,serif;

    font-size:28px;

    color:#9b7044;

    letter-spacing:1px;
}

#welcomeScreen .logo-fallback-script{
    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:42px;

    color:#a65c76;

    margin-top:-5px;
}


/* Slogan */

#welcomeScreen .welcome-slogan{
    margin-top:4px;

    text-align:center;

    color:#98566d;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Snell Roundhand",
        cursive;

    font-size:
        clamp(40px,11vw,58px);

    line-height:.92;

    text-shadow:
        0 1px 2px
        rgba(255,255,255,.8);
}


/* Heart */

#welcomeScreen .welcome-heart{
    margin-top:5px;

    color:#c96785;

    font-family:
        "Times New Roman",
        serif;

    font-size:43px;

    line-height:1;
}


/* Feature row */

#welcomeScreen .welcome-features{
    width:100%;
    max-width:530px;

    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:4px;

    margin-top:12px;

    padding:8px 4px;

    border-radius:21px;

    background:
        rgba(255,255,255,.32);

    backdrop-filter:
        blur(4px);
}


/* Feature */

#welcomeScreen .welcome-feature{
    min-height:92px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#292228;
}

#welcomeScreen .welcome-feature svg{
    width:34px;
    height:34px;

    margin-bottom:7px;

    color:#b14d6b;
}

#welcomeScreen .welcome-feature span{
    font-size:12px;

    line-height:1.2;

    font-weight:500;
}


/* Bottom section */

#welcomeScreen .welcome-bottom{
    width:100%;
    max-width:520px;

    margin-top:auto;
}


/* Get started */

#welcomeScreen .get-started{
    width:100%;

    height:63px;

    border:0;

    border-radius:33px;

    background:
        linear-gradient(
            180deg,
            #e786a4,
            #df7899
        );

    color:#fff;

    font-size:20px;

    font-weight:500;

    box-shadow:
        0 8px 20px
        rgba(177,67,103,.20);
}

#welcomeScreen .get-started:active{
    transform:scale(.985);
}

#welcomeScreen .get-started-arrow{
    font-size:31px;

    line-height:0;

    vertical-align:-3px;

    margin-left:5px;
}


/* Login */

#welcomeScreen .login-text{
    margin-top:14px;

    margin-bottom:2px;

    text-align:center;

    color:#655b62;

    font-size:15px;
}

#welcomeScreen .login-text a{
    color:#ad4c6a;

    font-weight:700;

    text-decoration:underline;
}


/* Small iPhones */

@media(max-width:390px){

    #welcomeScreen .welcome-inner{
        padding-left:17px;
        padding-right:17px;
    }

    #welcomeScreen .welcome-logo,
    #welcomeScreen .logo-fallback{
        width:245px;
        height:245px;
    }

    #welcomeScreen .welcome-slogan{
        font-size:40px;
    }

    #welcomeScreen .welcome-heart{
        font-size:35px;
    }

    #welcomeScreen .welcome-features{
        margin-top:7px;
    }

    #welcomeScreen .welcome-feature{
        min-height:75px;
    }

    #welcomeScreen .welcome-feature svg{
        width:28px;
        height:28px;
    }

    #welcomeScreen .welcome-feature span{
        font-size:10px;
    }

    #welcomeScreen .get-started{
        height:57px;
        font-size:18px;
    }
}


/* Very small screens */

@media(max-height:700px){

    #welcomeScreen .welcome-logo{
        width:220px;
        height:220px;
    }

    #welcomeScreen .welcome-slogan{
        font-size:37px;
    }

    #welcomeScreen .welcome-heart{
        font-size:31px;
    }

    #welcomeScreen .welcome-features{
        margin-top:4px;
    }

    #welcomeScreen .welcome-feature{
        min-height:66px;
    }

    #welcomeScreen .welcome-feature svg{
        width:25px;
        height:25px;
        margin-bottom:3px;
    }

}

</style>


<!-- FOTO DE FUNDAL CLEANING -->

<img
    class="welcome-photo"
    src="pure-shine-cleaning-background.png"
    alt=""
>


<div class="welcome-overlay"></div>


<div class="welcome-inner">


    <!-- LOGO -->

    <img
        class="welcome-logo"
        src="icon(3).png"
        alt="Pure Shine Cleaning"
        onerror="
            this.style.display='none';
            document.getElementById('welcomeLogoFallback').style.display='flex';
        "

    <!-- FALLBACK LOGO -->

    <div

        <div class="logo-fallback-inner">

            <div class="logo-fallback-main">
                PURE SHINE
            </div>

            <div class="logo-fallback-script">
                Cleaning ♡
            </div>

        </div>

    </div>


    <!-- SLOGAN -->

    <div class="welcome-slogan">

        Your Cleaning<br>
        Business, Simplified

    </div>


    <div class="welcome-heart">

    </div>


    <!-- FOUR FEATURES -->

    <div class="welcome-features">


        <!-- MANAGE JOBS -->

        <div class="welcome-feature">

            <svg

                stroke-linejoin="round">

                <rect
                    x="3"

                />

                <path
                    d="M8 3v4M16 3v4M3 10h18"
                />

                <path
                    d="M8 14h2M14 14h2M8 18h2"
                />

            </svg>

            <span>
                Manage<br>
                Jobs
            </span>

        </div>


        <!-- CLIENTS -->

        <div class="welcome-feature">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round">

                <circle
                    cx="9"
                    cy="8"
                    r="3"
                />

                <path
                    d="M3 20c0-3 2.5-5 6-5s6 2 6 5"
                />

                <circle
                    cx="17"
                    cy="9"
                    r="2.5"
                />

                <path
                    d="M15 15c3 0 5 2 5 5"
                />

            </svg>

            <span>
                Keep Track<br>
                of Clients
            </span>

        </div>


        <!-- EARNINGS -->

        <div class="welcome-feature">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M4 20V10"/>
                <path d="M10 20V5"/>
                <path d="M16 20v-8"/>
                <path d="M22 20H2"/>

            </svg>

            <span>
                Track<br>
                Earnings
            </span>

        </div>


        <!-- TIME -->

        <div class="welcome-feature">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round">

                <circle
                    cx="12"
                    cy="12"
                    r="9"
                />

                <path
                    d="M12 7v5l3 2"
                />

            </svg>

            <span>
                More Time<br>
                for You
            </span>

        </div>


    </div>


    <!-- BUTTON + LOGIN -->

    <div class="welcome-bottom">

        <button
            class="get-started"
            onclick="enterApp()">

            Get Started

            <span class="get-started-arrow">
                ›
            </span>

        </button>


        <div class="login-text">

            Already have an account?

            <a
                href="#"
                onclick="
                    enterApp();
                    return false;
                ">

                Log in

            </a>

        </div>

    </div>


</div>

</section>
