  display:grid !important;

  body{

<script>
/*
  EMERGENCY STARTUP FIX

  This runs independently from the previous JavaScript.
  Even if an older script has an error, the application
  will still be placed on screen.
*/

(function(){

  try{

    const app =
      document.getElementById("app");

    const splash =
      document.getElementById("splash");

    if(splash){
      splash.style.display="none";
    }

    if(app){

      app.classList.remove("hidden");

      app.style.display="block";
      app.style.visibility="visible";
      app.style.opacity="1";

    }


    /* DATE */

    const dateElement =
      document.getElementById("todayDate");

    if(dateElement){

      dateElement.textContent =
        new Date().toLocaleDateString(
          "en-GB",
          {
            weekday:"long",
            day:"numeric",
            month:"long"
          }
        );

    }


    /* IF THE ORIGINAL RENDER FUNCTION WORKS,
       USE IT */

    if(
      typeof render === "function"
    ){

      try{
        render();
      }catch(e){}

    }


    /*
      FALLBACK SCHEDULE
      Makes sure something is visible
      even if the previous JavaScript failed.
    */

    const schedule =
      document.getElementById(
        "todaySchedule"
      );

    if(
      schedule &&
      !schedule.innerHTML.trim()
    ){

      schedule.innerHTML = `

        <div class="empty">

          <div class="emptyIcon">
            ♡
          </div>

          <strong>
            No cleaning jobs today 🌸
          </strong>

          <p>
            Add one with the + button.
          </p>

          <button
            class="primaryFull"
            onclick="
              if(typeof openJob==='function'){
                openJob();
              }
            "
          >
            ＋ &nbsp;Add cleaning job
          </button>

        </div>

      `;

    }


    /*
      MAKE SURE THE FOUR STATISTICS
      ARE VISIBLE
    */

    const jobs =
      document.getElementById("jobsCount");

    const hours =
      document.getElementById("hoursCount");

    const earned =
      document.getElementById("earnedCount");

    const free =
      document.getElementById("freeCount");


    if(jobs && !jobs.textContent.trim())
      jobs.textContent="0";

    if(hours && !hours.textContent.trim())
      hours.textContent="0h 0m";

    if(earned && !earned.textContent.trim())
      earned.textContent="£0";

    if(free && !free.textContent.trim())
      free.textContent="8h 0m";


  }catch(error){

    /*
      LAST RESORT:
      Never leave the screen blank.
    */

    const app =
      document.getElementById("app");

    const splash =
      document.getElementById("splash");

    if(splash)
      splash.style.display="none";

    if(app){

      app.classList.remove("hidden");

      app.style.display="block";
      app.style.visibility="visible";
      app.style.opacity="1";

    }

  }

})();
</script>
