<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8dce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light-content">
<meta name="apple-mobile-web-app-title" content="Cleaning Manager">

<title>Pure Shine Cleaning Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&display=swap');

:root{
  --pink:#f8dce7;
  --pink2:#fce5ee;
  --button:#e786a8;
  --darkpink:#b94f70;
  --text:#171518;
  --muted:#77737a;
  --blue:#e5eeff;
  --green:#e0f2e7;
  --yellow:#fff0c9;
  --purple:#eee1fa;
  --peach:#fde5de;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#f8dce7;
  font-family:'DM Sans',sans-serif;
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================================================
   EXACT VISUAL IMAGE FROM THE PROVIDED PURE SHINE DESIGN
   ========================================================= */

:root{
  --welcome-photo:url("data:image/jpeg;base64,PASTE_WELCOME_IMAGE_BASE64_HERE");
  --logo-photo:url("data:image/jpeg;base64,PASTE_LOGO_IMAGE_BASE64_HERE");
}

/* WELCOME */

.welcome{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#f8dce7;
  overflow:hidden;
}

.welcome-image{
  position:absolute;
  inset:0;
  background-image:var(--welcome-photo);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.welcome-click{
  position:absolute;
  z-index:5;
  left:12%;
  right:12%;
  bottom:8%;
  height:9%;
  border-radius:40px;
  background:transparent;
}

/* APP */

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;
  background:#fff;
  position:relative;
  padding-bottom:94px;
  overflow:hidden;
}

/* HEADER */

.header{
  background:#fff;
  padding:max(13px,env(safe-area-inset-top)) 16px 8px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.brand{
  display:flex;
  align-items:center;
  min-width:0;
  gap:10px;
}

.brand-logo{
  width:61px;
  height:61px;
  object-fit:cover;
  border-radius:50%;
  background:#f8dce7;
}

.brand-copy{
  min-width:0;
}

.brand-title{
  font-size:22px;
  font-weight:700;
  line-height:1.05;
  white-space:nowrap;
}

.brand-sub{
  color:#77737a;
  font-size:13px;
  margin-top:4px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.settings-button{
  height:39px;
  padding:0 9px;
  border-radius:13px;
  background:#fff5f8;
  color:#a04463;
  font-size:11px;
  font-weight:600;
}

.bell{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  font-size:23px;
}

/* MAIN */

.page{
  padding:0 15px 25px;
}

.date-banner{
  margin-top:7px;
  min-height:82px;
  border-radius:20px;
  background:#f9dce8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 17px;
}

.date-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.date-icon{
  font-size:30px;
  color:#bd4e70;
}

.date-main{
  font-size:17px;
  font-weight:600;
}

.date-sub{
  margin-top:4px;
  color:#77737a;
  font-size:13px;
}

.date-heart{
  color:#dc6d91;
  font-size:34px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:11px;
}

.stat{
  min-height:109px;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stat:nth-child(1){background:#fde3ed}
.stat:nth-child(2){background:#e4edff}
.stat:nth-child(3){background:#e0f2e7}
.stat:nth-child(4){background:#fff0c9}

.stat-icon{
  font-size:27px;
  line-height:1;
  margin-bottom:6px;
}

.stat:nth-child(1) .stat-icon{color:#c84f73}
.stat:nth-child(2) .stat-icon{color:#3169a8}
.stat:nth-child(3) .stat-icon{color:#2e8152}
.stat:nth-child(4) .stat-icon{color:#b67c00}

.stat-value{
  font-size:18px;
  font-weight:700;
}

.stat-label{
  color:#514b50;
  font-size:11px;
  margin-top:3px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 2px 9px;
}

.section-head h2{
  margin:0;
  font-size:20px;
}

.section-link{
  color:#a94464;
  font-size:14px;
}

.today-card{
  min-height:211px;
  border:1px solid #f2e9ed;
  border-radius:20px;
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:0 3px 14px rgba(180,105,135,.06);
}

.today-icon{
  color:#e999b3;
  font-size:51px;
}

.today-title{
  margin-top:10px;
  font-size:17px;
}

.today-sub{
  color:#77737a;
  font-size:13px;
  margin-top:4px;
}

.add-job-main{
  width:100%;
  height:51px;
  border-radius:27px;
  background:#e786a8;
  color:white;
  font-size:17px;
  margin-top:16px;
}

/* SCHEDULE */

.schedule-item{
  background:#fff;
  border:1px solid #f1e7eb;
  border-radius:18px;
  padding:13px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  box-shadow:0 3px 13px rgba(180,105,135,.05);
}

.schedule-person{
  display:flex;
  align-items:center;
  gap:11px;
}

.schedule-avatar{
  width:46px;
  height:46px;
  border-radius:15px;
  background:#fce5ee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c45174;
  font-size:22px;
}

.schedule-name{
  font-weight:700;
  font-size:15px;
}

.schedule-time{
  color:#77737a;
  font-size:12px;
  margin-top:3px;
}

.schedule-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
}

.rate{
  color:#a45b73;
  font-size:12px;
  font-weight:700;
}

.mini-button{
  min-width:36px;
  height:34px;
  padding:0 8px;
  border-radius:10px;
  background:#f8edf2;
  color:#8d5066;
  font-size:11px;
  font-weight:600;
}

/* QUICK ACTIONS */

.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.quick{
  min-height:62px;
  border-radius:17px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 14px;
}

.quick-icon{
  width:29px;
  font-size:25px;
  text-align:center;
}

.quick-text{
  font-size:15px;
  font-weight:500;
}

.blue{background:var(--blue);color:#225995}
.green{background:var(--green);color:#28734d}
.pink{background:#fce1ec;color:#9c3f61}
.yellow{background:var(--yellow);color:#222}
.purple{background:var(--purple);color:#6b389e}
.peach{background:var(--peach);color:#b45f47}

/* QUOTE */

.quote-banner{
  position:relative;
  overflow:hidden;
  min-height:114px;
  margin-top:13px;
  border-radius:18px;
  background:#f9dce5;
  display:flex;
  align-items:center;
  justify-content:center;
}

.quote-photo{
  position:absolute;
  right:-15px;
  top:0;
  width:45%;
  height:100%;
  object-fit:cover;
  opacity:.42;
}

.quote-text{
  position:relative;
  z-index:2;
  font-family:'Parisienne',cursive;
  color:#a15b72;
  font-size:30px;
  line-height:1;
  text-align:center;
}

.quote-heart{
  position:absolute;
  left:17px;
  color:#dc7091;
  font-size:37px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,100%);
  min-height:78px;
  padding:6px 6px max(6px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);
  border-top:1px solid #eee7ea;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  min-height:64px;
  border-radius:17px;
  background:transparent;
  color:#777983;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.nav-icon{
  font-size:25px;
}

.nav-btn.active{
  background:#fde5ef;
  color:#bd426b;
}

.fab{
  position:fixed;
  z-index:450;
  right:max(17px,calc(50% - 242px));
  bottom:91px;
  width:57px;
  height:57px;
  border-radius:50%;
  background:#e786a8;
  color:#fff;
  font-size:30px;
  box-shadow:0 7px 20px rgba(180,75,110,.22);
}

/* OTHER PAGES */

.page-title{
  margin:14px 2px;
  font-size:27px;
  font-weight:700;
}

.week-row{
  display:flex;
  gap:7px;
  overflow-x:auto;
}

.week-day{
  flex:0 0 67px;
  min-height:73px;
  border-radius:16px;
  background:#fff;
  border:1px solid #f0e6eb;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.week-day.today{
  background:#f9dce8;
  color:#a23e60;
}

.week-day small{
  color:#77737a;
  font-size:11px;
}

.week-day strong{
  font-size:19px;
  margin-top:4px;
}

.day-title{
  margin:18px 2px 8px;
  color:#a04e6b;
  font-weight:700;
}

.empty{
  background:#fff;
  border:1px solid #f1e7eb;
  border-radius:19px;
  padding:27px 15px;
  text-align:center;
  color:#77737a;
}

/* CLIENTS */

.client-card{
  background:#fff;
  border:1px solid #f1e7eb;
  border-radius:19px;
  padding:13px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.client-main{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.client-avatar{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#fce4ed;
  color:#c45173;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex:none;
}

.client-name{
  font-weight:700;
  font-size:15px;
}

.client-meta{
  color:#77737a;
  font-size:11px;
  margin-top:3px;
}

.client-actions{
  display:flex;
  gap:4px;
  align-items:center;
}

.reminder-btn{
  height:36px;
  padding:0 9px;
  border-radius:11px;
  background:#e4edff;
  color:#285b96;
  font-size:10px;
  font-weight:700;
}

/* EARNINGS */

.earning-total{
  margin-top:13px;
  padding:23px 17px;
  border-radius:21px;
  background:linear-gradient(135deg,#fde4ee,#fff1d0);
  text-align:center;
}

.earning-title{
  color:#70676c;
  font-size:14px;
}

.money{
  color:#a14d69;
  font-size:37px;
  font-weight:700;
  margin-top:4px;
}

.hours{
  color:#77737a;
  font-size:12px;
  margin-top:4px;
}

.job-card{
  background:#fff;
  border:1px solid #f0e7ea;
  border-radius:18px;
  padding:14px;
  margin-bottom:9px;
}

.job-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.job-client{
  font-weight:700;
}

.job-date{
  color:#77737a;
  font-size:11px;
  margin-top:3px;
}

.status{
  background:#e0f1e6;
  color:#377552;
  border-radius:10px;
  padding:5px 8px;
  height:max-content;
  font-size:10px;
  font-weight:700;
}

.job-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:11px;
}

.job-box{
  background:#fff5f8;
  border-radius:11px;
  padding:8px;
}

.job-box small{
  display:block;
  color:#8b8085;
  font-size:9px;
}

.job-box strong{
  display:block;
  margin-top:2px;
  font-size:12px;
}

.job-buttons{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.job-buttons button{
  flex:1;
  height:34px;
  border-radius:10px;
  background:#f8edf2;
  color:#765a65;
  font-size:11px;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  background:rgba(35,25,30,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:27px 27px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.modal-head h3{
  margin:0;
  font-size:21px;
}

.close{
  width:39px;
  height:39px;
  border-radius:13px;
  background:#f8edf1;
  font-size:23px;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  color:#72686d;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  min-height:46px;
  padding:10px 12px;
  border:1px solid #eadde2;
  border-radius:13px;
  outline:none;
  background:#fffafc;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.primary{
  width:100%;
  min-height:49px;
  border-radius:25px;
  background:#e786a8;
  color:#fff;
  font-weight:600;
}

.secondary{
  background:#f5edf1!important;
  color:#765b65!important;
}

.danger{
  background:#f4d8df!important;
  color:#95586a!important;
}

.sms{
  background:#e4edff!important;
  color:#285b96!important;
}

.whatsapp{
  background:#def1e5!important;
  color:#28734c!important;
}

/* TIMER */

.timer-box{
  border-radius:23px;
  padding:24px 15px;
  text-align:center;
  background:linear-gradient(135deg,#fde5ee,#fff1d4);
}

.timer-client{
  font-size:20px;
  font-weight:700;
}

.timer-time{
  margin:12px 0;
  font-size:51px;
  font-weight:700;
  color:#704e5c;
}

.timer-rate{
  color:#a45d74;
  font-weight:700;
}

.timer-earned{
  margin-top:12px;
  font-weight:700;
}

.timer-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:13px;
}

.reminder-panel{
  margin-top:13px;
  padding:14px;
  background:#f9edf3;
  border-radius:17px;
}

.reminder-title{
  color:#9e4665;
  font-weight:700;
  font-size:13px;
}

.reminder-description{
  color:#756b70;
  font-size:11px;
  line-height:1.4;
  margin:5px 0 10px;
}

.reminder-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

/* SETTINGS */

.settings-card{
  background:#fff;
  border:1px solid #f0e7ea;
  border-radius:20px;
  padding:4px 15px;
  margin-bottom:13px;
}

.setting-row{
  min-height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #f1e8eb;
  gap:10px;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-name{
  font-size:14px;
  font-weight:600;
}

.setting-description{
  color:#77737a;
  font-size:10px;
  margin-top:3px;
}

.switch{
  width:49px;
  height:28px;
  padding:3px;
  border-radius:20px;
  background:#ddd;
  flex:none;
}

.switch i{
  display:block;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch.on{
  background:#df89a6;
}

.switch.on i{
  transform:translateX(21px);
}

.zoom-controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.zoom-value{
  min-width:43px;
  text-align:center;
  color:#ad5671;
  font-weight:700;
  font-size:12px;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:20000;
  left:50%;
  bottom:100px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#30272b;
  color:#fff;
  padding:11px 16px;
  border-radius:14px;
  font-size:12px;
  transition:.25s;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(min-width:700px){

  body{
    padding:20px 0;
  }

  .app{
    min-height:calc(100vh - 40px);
    border-radius:38px;
    box-shadow:0 15px 50px rgba(100,60,80,.15);
  }

  .bottom-nav{
    bottom:20px;
    border-radius:25px;
  }

  .fab{
    bottom:112px;
  }
}
</style>
</head>

<body>

<!--
IMPORTANT:
The two image variables below are filled automatically by the code.
They are embedded directly in the HTML so the pictures do NOT disappear
when the HTML is opened on the phone.
-->

<div class="welcome" id="welcomeScreen">
  <div class="welcome-image"></div>
  <button
    class="welcome-click"
    aria-label="Get Started"
    onclick="startApp()">
  </button>
</div>

<div class="app" id="app">

  <header class="header">

    <div class="header-row">

      <div class="brand">

        <img
          id="brandLogo"
          class="brand-logo"
          alt="Pure Shine Cleaning">

        <div class="brand-copy">

          <div class="brand-title">
            Cleaning Manager
          </div>

          <div class="brand-sub">
            Your cleaning business ✨
          </div>

        </div>

      </div>

      <div class="header-actions">

        <button
          class="settings-button"
          onclick="openSettings()">
          ⚙ Settings
        </button>

        <button
          class="bell"
          onclick="openNotifications()">
          ♧
        </button>

      </div>

    </div>

  </header>

  <main id="main"></main>

  <button
    class="fab"
    onclick="openAddJob()">
    +
  </button>

  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      data-page="home"
      onclick="showPage('home')">
      <span class="nav-icon">⌂</span>
      Home
    </button>

    <button
      class="nav-btn"
      data-page="schedule"
      onclick="showPage('schedule')">
      <span class="nav-icon">▣</span>
      Schedule
    </button>

    <button
      class="nav-btn"
      data-page="clients"
      onclick="showPage('clients')">
      <span class="nav-icon">♙</span>
      Clients
    </button>

    <button
      class="nav-btn"
      data-page="free"
      onclick="showPage('free')">
      <span class="nav-icon">◷</span>
      Free time
    </button>

    <button
      class="nav-btn"
      data-page="earnings"
      onclick="showPage('earnings')">
      <span class="nav-icon">▥</span>
      Earnings
    </button>

function uid(prefix){

function formatMinutes(mins){

}

function formatTime(seconds){

    0,
    Math.floor(seconds)
  );

  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;

  return `${String(h).padStart(2,'0')}:`+
         `${String(m).padStart(2,'0')}:`+
         `${String(s).padStart(2,'0')}`;
}

function dateISO(date=new Date()){

    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

/* =========================================================
   JOB CALCULATIONS
   ========================================================= */

function jobMinutes(job){

  if(job.minutes!=null){
    return Number(job.minutes);
  }

  if(!job.start||!job.end){
    return 0;
  }

  const s=job.start.split(':').map(Number);
  const e=job.end.split(':').map(Number);

  let result=
    (e[0]*60+e[1])-
    (s[0]*60+s[1]);

  if(result<0){
    result+=1440;
  }

  return result;
}

function jobPay(job){

  return jobMinutes(job)/60*
    Number(job.rate||0);
}

function totalMinutes(){

  return jobs.reduce(
    (a,j)=>a+jobMinutes(j),
    0
  );
}

function totalMoney(){

  return jobs.reduce(
    (a,j)=>a+jobPay(j),
    0
  );
}

function getTodaySchedule(){

  const day=
    new Date().getDay()===0
    ?7
    :new Date().getDay();

  const week=
    getWeekNumber(new Date());

  return clients.filter(c=>{

    if(c.day!==day)return false;

    if(c.frequency==='Weekly'){
      return true;
    }

    if(c.frequency==='Fortnightly'){
      return week%2===0;
    }

    if(c.frequency==='Every 3 weeks'){
      return week%3===0;
    }

    return false;
  });
}

function getDayDate(day){

  const now=new Date();
  const current=now.getDay()||7;

  const d=new Date(now);

  d.setDate(
    now.getDate()+day-current
  );

  return d.getDate();
}

function getWeekNumber(date){

  const d=
    new Date(
      Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      )
    );

  const day=d.getUTCDay()||7;

  d.setUTCDate(
    d.getUTCDate()+4-day
  );

  const yearStart=
    new Date(
      Date.UTC(
        d.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (((d-yearStart)/86400000)+1)/7
  );
}

function freeMinutes(){

  let busy=0;

  getTodaySchedule().forEach(c=>{

    const s=c.start.split(':').map(Number);
    const e=c.end.split(':').map(Number);

    busy+=
      e[0]*60+e[1]-
      (s[0]*60+s[1]);

  });

  return Math.max(
    0,
    600-busy
  );
}

   ========================================================= */

function quickTimer(){

  const today=getTodaySchedule();

  if(today.length){
    openTimer(today[0].id);
    return;
  }

  if(clients.length){
    openTimer(clients[0].id);
    return;
  }

  showToast('Add a client first.');
}

function openTimer(clientId){

  const client=getClient(clientId);

  if(!client)return;

  if(
    timer.active &&
    timer.clientId!==clientId
  ){

    showToast(
      'Stop the current timer first.'
    );

    return;
  }

  if(!timer.active){

    timer.active=true;
    timer.clientId=clientId;
    timer.startTimestamp=Date.now();
    timer.elapsedBefore=0;

    timer.interval=
      setInterval(
        updateTimer,
        250
      );

    saveTimer();

  }

  renderTimer();
}

function elapsedSeconds(){

  if(!timer.active){
    return timer.elapsedBefore;
  }

  return timer.elapsedBefore+
    Math.floor(
      (Date.now()-timer.startTimestamp)/1000
    );
}

function updateTimer(){

  const el=
    document.getElementById('timerClock');

  const earn=
    document.getElementById('timerMoney');

  if(!el)return;

  const seconds=elapsedSeconds();

  el.textContent=
    formatTime(seconds);

  const client=
    getClient(timer.clientId);

  if(earn&&client){

    earn.textContent=
      money(
        seconds/3600*
        client.rate
      );
  }
}

function renderTimer(){

  const client=
    getClient(timer.clientId);

  if(!client)return;

  const seconds=
    elapsedSeconds();

  openModal(`

    <div class="modal-head">

      <h3>Cleaning Timer</h3>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="timer-box">

      <div class="timer-client">
        ${esc(client.name)}
      </div>

      <div
        class="timer-time"
        id="timerClock">
        ${formatTime(seconds)}
      </div>

      <div class="timer-rate">
        ${money(client.rate)} per hour
      </div>

      <div class="timer-earned">
        Current earnings:
        <span id="timerMoney">
          ${money(seconds/3600*client.rate)}
        </span>
      </div>

    </div>


    <div class="reminder-panel">

      <div class="reminder-title">
        ♡ Send reminder to client
      </div>

      <div class="reminder-description">
        Send ${esc(client.name)} a message when
        you are on your way to the cleaning.
      </div>

      ${
        client.phone
        ?
        `
        <div class="reminder-actions">

          <button
            class="primary sms"
            onclick="sendClientReminder('${client.id}','sms')">
            💬 SMS
          </button>

          <button
            class="primary whatsapp"
            onclick="sendClientReminder('${client.id}','whatsapp')">
            WhatsApp
          </button>

        </div>
        `
        :
        `
        <button
          class="primary secondary"
          onclick="editClient('${client.id}')">
          ＋ Add Client Phone Number
        </button>
        `
      }

    </div>


    <div class="timer-actions">

      <button
        class="primary danger"
        onclick="stopTimer()">
        Stop & Save
      </button>

      <button
        class="primary secondary"
        onclick="closeModal()">
        Continue
      </button>

    </div>

  `);

  updateTimer();
}

function stopTimer(){

  if(!timer.active)return;

  const client=
    getClient(timer.clientId);

  if(!client)return;

  const seconds=
    elapsedSeconds();

  const minutes=
    Math.max(
      1,
      Math.round(seconds/60)
    );

  const start=
    new Date(timer.startTimestamp);

  const end=
    new Date();

  const job={
    id:uid('job'),
    clientId:client.id,
    clientName:client.name,
    date:dateISO(start),

    start:start.toLocaleTimeString(
      'en-GB',
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    ),

    end:end.toLocaleTimeString(
      'en-GB',
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    ),

    rate:Number(client.rate),
    minutes,
    status:'Completed',
    source:'timer'
  };

  job.earnings=jobPay(job);

  jobs.push(job);

  saveAll();

  clearInterval(timer.interval);

  timer={
    active:false,
    clientId:null,
    startTimestamp:null,
    elapsedBefore:0,
    interval:null
  };

  sessionStorage.removeItem(
    'pureShineTimer'
  );

  closeModal();
  render();

  showToast(
    `${client.name} saved · `+
    `${formatMinutes(minutes)} · `+
    `${money(job.earnings)}`
  );
}

function saveTimer(){

  sessionStorage.setItem(
    'pureShineTimer',
    JSON.stringify({
      active:timer.active,
      clientId:timer.clientId,
      startTimestamp:timer.startTimestamp,
      elapsedBefore:timer.elapsedBefore
    })
  );
}

function restoreTimer(){

  const saved=
    sessionStorage.getItem(
      'pureShineTimer'
    );

  if(!saved)return;

  try{

    const data=JSON.parse(saved);

    if(
      data.active &&
      data.clientId
    ){

      timer={
        active:true,
        clientId:data.clientId,
        startTimestamp:data.startTimestamp,
        elapsedBefore:data.elapsedBefore||0,
        interval:null
      };

      timer.interval=
        setInterval(
          updateTimer,
          250
        );
    }

  }catch(e){}
}

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(timer.active){
      updateTimer();
    }
  }
);

function saveClient(e,id){

  const data={
    id:id||uid('client'),

    name:
      document.getElementById('clientName').value.trim(),

    phone:
      document.getElementById('clientPhone').value.trim(),

    reminder:
      document.getElementById('clientReminder').value.trim(),

    type:
      document.getElementById('clientType').value,

    rate:
      Number(
        document.getElementById('clientRate').value
      ),

    day:
      Number(
        document.getElementById('clientDay').value
      ),

    frequency:
      document.getElementById('clientFrequency').value,

    start:
      document.getElementById('clientStart').value,

    end:
      document.getElementById('clientEnd').value
  };

  if(id){

    const index=
      clients.findIndex(
        c=>c.id===id
      );

    if(index>=0){
      clients[index]=data;
    }

  }else{

    clients.push(data);

  }

  saveAll();

  closeModal();
  render();

  showToast(
    `${data.name} saved`
  );
}

function deleteClient(id){

  const client=getClient(id);

  if(!client)return;

  if(
    !confirm(
      `Delete ${client.name} from your client list?`
    )
  )return;

  clients=
    clients.filter(
      c=>c.id!==id
    );

  saveAll();
  render();

  showToast(
    `${client.name} removed`
  );
}

   CLIENT REMINDER
   ========================================================= */

function reminderText(client){

  if(client.reminder){
    return client.reminder;
  }

  return(
    `Hi ${client.name}, just a quick reminder `+
    `that I'm coming for your cleaning today `+
    `at ${client.start}. See you soon! 💕✨`
  );
}

function sendClientReminder(
  clientId,
  method='choose'
){

  const client=
    getClient(clientId);

  if(!client)return;

  if(!client.phone){

    showToast(
      'Add the client phone number first.'
    );

    setTimeout(
      ()=>editClient(client.id),
      300
    );

    return;
  }

  const message=
    reminderText(client);

  const phone=
    client.phone
      .trim()
      .replace(/[^\d+]/g,'');

  if(method==='choose'){

    openModal(`

      <div class="modal-head">

        <h3>
          Send reminder
        </h3>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>


      <div class="reminder-panel">

        <div class="reminder-title">
          To: ${esc(client.name)}
        </div>

        <div class="reminder-description">
          ${esc(message)}
        </div>

      </div>


      <button
        class="primary sms"
        onclick="sendClientReminder('${client.id}','sms')">
        💬 Send by SMS
      </button>

      <br>

      <button
        class="primary whatsapp"
        onclick="sendClientReminder('${client.id}','whatsapp')">
        WhatsApp
      </button>

      <br>

      <button
        class="primary secondary"
        onclick="editClient('${client.id}')">
        ✎ Edit Phone / Message
      </button>

    `);

    return;
  }

  if(method==='sms'){

    window.location.href=
      'sms:'+phone+
      '?body='+
      encodeURIComponent(message);

    return;
  }

  if(method==='whatsapp'){

    let number=
      phone.replace(/\+/g,'');

    if(number.startsWith('0')){
      number=
        '44'+number.substring(1);
    }

    window.location.href=
      'https://wa.me/'+
      number+
      '?text='+
      encodeURIComponent(message);

  }
}

function openModal(html){

  document.getElementById('modal').innerHTML=
    html;

  document
    .getElementById('modalBackdrop')
    .classList.add('show');
}

function closeModal(){

  document
    .getElementById('modalBackdrop')
    .classList.remove('show');
}

function backdropClose(e){

  if(e.target.id==='modalBackdrop'){
    closeModal();
  }
}


/* =========================================================
   BACKUP
   ========================================================= */

function exportData(){

  const data={
    clients,
    jobs,
    holidays,
    settings,
    exportedAt:new Date().toISOString()
  };

  const blob=
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:'application/json'}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement('a');

  a.href=url;
  a.download=
    'pure-shine-cleaning-manager-backup.json';

  a.click();

  URL.revokeObjectURL(url);

  showToast('Backup exported');
}

function clearHistory(){

  if(!jobs.length)return;

  if(
    !confirm(
      'Delete ALL saved job history?'
    )
  )return;

  jobs=[];

  saveAll();

  closeModal();
  render();

  showToast(
    'Job history deleted'
  );
}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message){

  const toast=
    document.getElementById('toast');

  toast.textContent=message;

  toast.classList.add('show');

  clearTimeout(
    showToast.timer
  );

  showToast.timer=
    setTimeout(
      ()=>{
        toast.classList.remove('show');
      },
      3200
    );
}


/* =========================================================
   TIMER SURVIVES BACKGROUNDING
   ========================================================= */

window.addEventListener(
  'beforeunload',
  ()=>{
    if(timer.active){
      saveTimer();
    }
  }
);


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  'load',
  init
);

</script>
